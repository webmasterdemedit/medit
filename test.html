<!DOCTYPE html>
<html>
<head>
<style>
@font-face {
    font-family: 'QCF47';
    src: url('medit/font/QCF2047.ttf') format('truetype');
}
.qcf {
    font-family: 'QCF47', serif;
    direction: rtl;
    font-size: 2em;
    line-height: 2.2;
}
</style>
</head>
<body>

<div id="posts"></div>

<script>
// Simule tes posts avec le code [47] au début
const posts = [
    "[47] ﱊ ",
    "[45] الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
    "[47] وَإِنَّهُ لَكِتَابٌ عَزِيزٌ"
];

const container = document.getElementById('posts');

posts.forEach(post => {
    // Extrait le numéro entre crochets
    const match = post.match(/^\[(\d+)\]\s*/);
    const page = match ? match[1] : null;
    const text = match ? post.replace(match[0], '') : post;

    const div = document.createElement('div');
    div.className = 'qcf';
    
    // Si page === '47', la police est déjà appliquée via .qcf
    // Sinon, on peut ajouter d'autres polices plus tard
    if (page === '47') {
        // Rien de spécial, .qcf utilise QCF47
    } else {
        // Police par défaut si pas 47
        div.style.fontFamily = 'serif';
    }
    
    div.textContent = text;
    container.appendChild(div);
});
</script>

</body>
</html>
