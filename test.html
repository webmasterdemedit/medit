<script>
  (async function() {
    // 1. Charger l'index des versets
    const verses = await fetch('/medit/verses.json').then(r => r.json());
    
    // 2. Pour chaque élément .verset[data-ref]
    for (const el of document.querySelectorAll('.verset[data-ref]')) {
      const ref = el.dataset.ref;
      const info = verses[ref];
      if (!info) { el.textContent = '❌'; continue; }
      
      // 3. Charger la page
      const page = await fetch(`/medit/pages/${String(info.page).padStart(3, '0')}.json`).then(r => r.json());
      
      // 4. Extraire les caractères
      let chars = '';
      info.lines.forEach(li => {
        const line = page.lines.find(l => l.line === li.line);
        if (!line) return;
        chars += line.words.slice(li.word_start - 1, li.word_end).map(w => w.char).join('');
      });
      
      el.textContent = chars;
    }
  })();
</script>
