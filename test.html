<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCF4 - Verset depuis GitHub</title>
    <link rel="stylesheet" href="/medit/theme.css">
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #e0d4b4;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        #log {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            border: 1px solid #2a3040;
        }
        .verset {
            font-family: 'QCF4_Hafs_01', serif;
            font-size: 32px;
            display: block;
            padding: 20px;
            margin: 15px 0;
            line-height: 2;
            text-align: right;
            background: #161b22;
            color: #e8dfc8;
            border-radius: 12px;
            border-right: 5px solid #c9a84c;
        }
        input, button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #2a3040;
            background: #0d1117;
            color: #e0d4b4;
        }
        button {
            background: #c9a84c;
            color: #0d1117;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #dbb95e;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <h1>📖 QCF4 - Versets depuis GitHub</h1>

    <div class="controls">
        <input type="text" id="verseInput" placeholder="ex: 2:12" value="2:12" />
        <button id="loadBtn">🔍 Afficher</button>
        <button id="buildBtn">⚡ Reconstruire l'index</button>
    </div>

    <div id="verseDisplay" class="verset">⏳ Chargement...</div>

    <div id="log">⏳ Initialisation...</div>

    <script>
        // ===== CONFIGURATION : UTILISATION DES FICHIERS DEPUIS GITHUB =====
        const BASE_URL = 'https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main';
        const FONT_BASE = 'https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2';

        let verseIndex = {};
        let isIndexBuilt = false;

        // ===== CHARGER LES POLICES DYNAMIQUEMENT =====
        async function loadFont(fontName) {
            if (document.fonts.check(`16px "${fontName}"`)) return;
            
            const fontUrl = `${FONT_BASE}/${fontName}_W.woff2`;
            try {
                const font = new FontFace(fontName, `url(${fontUrl})`);
                await font.load();
                document.fonts.add(font);
                console.log(`✅ Police chargée : ${fontName}`);
            } catch (e) {
                console.warn(`⚠️ Police non chargée : ${fontName}`, e);
            }
        }

        // ===== CONSTRUIRE L'INDEX DEPUIS GITHUB =====
        async function buildIndex() {
            const log = document.getElementById('log');
            log.textContent = '⏳ Construction de l\'index depuis GitHub...\n';

            verseIndex = {};
            isIndexBuilt = false;

            try {
                // 1. Charger verses.json
                const versesUrl = `${BASE_URL}/verses.json`;
                log.textContent += `📥 Chargement de ${versesUrl}...\n`;
                const verses = await fetch(versesUrl).then(r => r.json());
                log.textContent += `✅ verses.json chargé (${Object.keys(verses).length} versets)\n`;

                // 2. Récupérer toutes les pages uniques
                const pagesNeeded = new Set();
                for (const key in verses) {
                    pagesNeeded.add(verses[key].page);
                }
                log.textContent += `📄 ${pagesNeeded.size} pages à charger\n`;

                // 3. Charger chaque page
                let totalWords = 0;
                let totalVersets = 0;

                for (const pageNum of pagesNeeded) {
                    const pageStr = String(pageNum).padStart(3, '0');
                    const url = `${BASE_URL}/pages/${pageStr}.json`;
                    
                    try {
                        const res = await fetch(url);
                        if (!res.ok) continue;
                        const page = await res.json();

                        // Charger la police de cette page
                        if (page.font) {
                            await loadFont(page.font);
                        }

                        page.lines.forEach(line => {
                            line.words.forEach(word => {
                                if (word.verse_key) {
                                    const key = word.verse_key;
                                    if (!verseIndex[key]) {
                                        verseIndex[key] = [];
                                        totalVersets++;
                                    }
                                    verseIndex[key].push({
                                        char: word.char,
                                        position: word.position,
                                        page: pageNum,
                                        font: word.font || page.font
                                    });
                                    totalWords++;
                                }
                            });
                        });

                        log.textContent += `✅ Page ${pageStr} chargée\n`;

                    } catch (e) {
                        log.textContent += `❌ Erreur page ${pageStr}: ${e.message}\n`;
                    }
                }

                isIndexBuilt = true;
                log.textContent += `\n✅ Index construit !\n`;
                log.textContent += `   📝 Mots indexés : ${totalWords}\n`;
                log.textContent += `   📖 Versets uniques : ${totalVersets}\n`;

                // Afficher le verset par défaut
                const defaultRef = document.getElementById('verseInput').value.trim();
                if (defaultRef) {
                    afficherVerset(defaultRef);
                }

            } catch (error) {
                log.textContent += `\n❌ ERREUR : ${error.message}\n`;
                console.error(error);
            }

            log.scrollTop = log.scrollHeight;
        }

        // ===== AFFICHER UN VERSET =====
        function afficherVerset(verseKey) {
            const display = document.getElementById('verseDisplay');
            const words = verseIndex[verseKey] || [];

            if (!isIndexBuilt) {
                display.textContent = '⚠️ Index en cours de construction...';
                return;
            }

            if (words.length === 0) {
                display.textContent = `❌ Verset ${verseKey} non trouvé.`;
                return;
            }

            // Trier par position
            words.sort((a, b) => a.position - b.position);

            // Construire le texte
            const chars = words.map(w => w.char).join('');
            display.textContent = chars;

            // Log
            const log = document.getElementById('log');
            log.textContent += `\n✅ ${verseKey} : ${words.length} mots (page ${words[0].page})`;
            log.scrollTop = log.scrollHeight;
        }

        // ===== ÉVÉNEMENTS =====
        document.getElementById('buildBtn').addEventListener('click', buildIndex);

        document.getElementById('loadBtn').addEventListener('click', function() {
            const ref = document.getElementById('verseInput').value.trim();
            if (!ref) {
                document.getElementById('verseDisplay').textContent = '⚠️ Entrez une référence (ex: 3:187)';
                return;
            }
            afficherVerset(ref);
        });

        document.getElementById('verseInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loadBtn').click();
            }
        });

        // ===== LANCEMENT AUTOMATIQUE =====
        window.addEventListener('load', function() {
            buildIndex();
        });
    </script>

</body>
</html>
