<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCF4 - Test avec mes polices</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #e0d4b4;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        #log {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            border: 1px solid #2a3040;
            margin-top: 10px;
        }
        .verset {
            font-size: 32px;
            display: block;
            padding: 20px;
            margin: 15px 0;
            line-height: 2;
            text-align: right;
            background: #161b22;
            color: #e8dfc8;
            border-radius: 12px;
            border-right: 5px solid #c9a84c;
            min-height: 60px;
            font-family: 'QCF4_Hafs_01', serif;
        }
        input, button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #2a3040;
            background: #0d1117;
            color: #e0d4b4;
        }
        button {
            background: #c9a84c;
            color: #0d1117;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #dbb95e;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .status {
            font-size: 14px;
            color: #8b7d60;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>

    <h1>📖 QCF4 - Test avec mes polices</h1>

    <div class="controls">
        <input type="text" id="verseInput" placeholder="ex: 2:12" value="2:12" />
        <button id="loadBtn">🔍 Afficher</button>
        <button id="buildBtn">⚡ Reconstruire l'index</button>
        <span class="status" id="status">Prêt</span>
    </div>

    <div id="verseDisplay" class="verset">⏳ Entrez une référence.</div>
    <div id="log">⏳ Initialisation...</div>

    <script>
        // ============================================================
        // CONFIGURATION : UTILISATION DE TES POLICES
        // ============================================================
        const BASE_URL = 'https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main';
        const FONT_BASE = 'https://raw.githubusercontent.com/webmasterdemedit/medit/main/fonts';

        let verseIndex = {};
        let isIndexBuilt = false;
        let fontCache = new Set();

        // ============================================================
        // CHARGER UNE POLICE DEPUIS TON DEPOT
        // ============================================================
        async function loadFont(fontName) {
            // Vérifier si déjà chargée
            if (fontCache.has(fontName)) return true;
            if (document.fonts.check(`16px "${fontName}"`)) {
                fontCache.add(fontName);
                return true;
            }

            // Charger depuis ton dépôt
            const url = `${FONT_BASE}/${fontName}_W.woff2`;
            try {
                const font = new FontFace(fontName, `url(${url})`);
                await font.load();
                document.fonts.add(font);
                fontCache.add(fontName);
                console.log(`✅ Police chargée : ${fontName}`);
                return true;
            } catch (e) {
                console.warn(`⚠️ Échec chargement de ${fontName} :`, e);
                return false;
            }
        }

        // ============================================================
        // CHARGER L'INDEX (verses.json)
        // ============================================================
        async function loadVersesIndex() {
            const url = `${BASE_URL}/verses.json`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        // ============================================================
        // CONSTRUIRE L'INDEX
        // ============================================================
        async function buildIndex() {
            const log = document.getElementById('log');
            const status = document.getElementById('status');
            log.textContent = '⏳ Construction de l\'index...\n';
            status.textContent = '⏳ Chargement...';

            verseIndex = {};
            isIndexBuilt = false;
            fontCache.clear();

            try {
                const verses = await loadVersesIndex();
                log.textContent += `✅ verses.json chargé (${Object.keys(verses).length} versets)\n`;

                // Indexer directement
                for (const [key, info] of Object.entries(verses)) {
                    verseIndex[key] = info;
                }

                isIndexBuilt = true;
                log.textContent += `✅ Index prêt ! (${Object.keys(verseIndex).length} versets)\n`;
                status.textContent = '✅ Prêt';
                status.className = 'status success';

                // Afficher le verset par défaut
                const defaultRef = document.getElementById('verseInput').value.trim();
                if (defaultRef) {
                    afficherVerset(defaultRef);
                }

            } catch (error) {
                log.textContent += `\n❌ ERREUR : ${error.message}\n`;
                status.textContent = '❌ Erreur';
                status.className = 'status error';
            }
        }

        // ============================================================
        // AFFICHER UN VERSET
        // ============================================================
        async function afficherVerset(verseKey) {
            const display = document.getElementById('verseDisplay');
            const log = document.getElementById('log');

            if (!isIndexBuilt) {
                display.textContent = '⚠️ Index en cours de construction...';
                return;
            }

            const info = verseIndex[verseKey];
            if (!info) {
                display.textContent = `❌ ${verseKey} non trouvé`;
                log.textContent += `\n❌ ${verseKey} non trouvé\n`;
                return;
            }

            log.textContent += `\n📖 Chargement de ${verseKey} (page ${info.page})...\n`;

            // Déterminer et charger la bonne police
            const fontNumber = String(info.page).padStart(2, '0');
            const fontName = `QCF4_Hafs_${fontNumber}`;
            await loadFont(fontName);

            // Charger la page
            const pageNum = String(info.page).padStart(3, '0');
            const pageUrl = `${BASE_URL}/pages/${pageNum}.json`;
            const page = await fetch(pageUrl).then(r => r.json());

            // Extraire les caractères
            let chars = '';
            for (const lineInfo of info.lines) {
                const line = page.lines.find(l => l.line === lineInfo.line);
                if (!line) continue;
                const words = line.words.slice(lineInfo.word_start - 1, lineInfo.word_end);
                chars += words.map(w => w.char).join('');
            }

            // Afficher avec la bonne police
            display.textContent = chars || '⚠️ Aucun caractère';
            display.style.fontFamily = `'${fontName}', serif`;
            display.style.fontSize = '32px';
            display.style.direction = 'rtl';
            display.style.textAlign = 'right';

            log.textContent += `✅ ${verseKey} affiché (${chars.length} caractères) avec ${fontName}\n`;
            log.scrollTop = log.scrollHeight;
        }

        // ============================================================
        // ÉVÉNEMENTS
        // ============================================================
        document.getElementById('buildBtn').addEventListener('click', buildIndex);
        document.getElementById('loadBtn').addEventListener('click', function() {
            const ref = document.getElementById('verseInput').value.trim();
            if (!ref) {
                document.getElementById('verseDisplay').textContent = '⚠️ Entrez une référence.';
                return;
            }
            afficherVerset(ref);
        });

        document.getElementById('verseInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loadBtn').click();
            }
        });

        // ============================================================
        // LANCEMENT AUTOMATIQUE
        // ============================================================
        window.addEventListener('load', buildIndex);
    </script>

</body>
</html>
