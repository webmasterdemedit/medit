<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QCF4 - Indexeur complet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #e0d4b4;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #c9a84c;
            text-align: center;
        }
        #log {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            border: 1px solid #2a3040;
            margin-top: 10px;
        }
        .verset {
            font-family: 'QCF4_Hafs_01', serif;
            font-size: 32px;
            display: block;
            padding: 20px;
            margin: 15px 0;
            line-height: 2;
            text-align: right;
            background: #161b22;
            color: #e8dfc8;
            border-radius: 12px;
            border-right: 5px solid #c9a84c;
            min-height: 60px;
        }
        input,
        button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #2a3040;
            background: #0d1117;
            color: #e0d4b4;
        }
        button {
            background: #c9a84c;
            color: #0d1117;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #dbb95e;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .status {
            font-size: 14px;
            color: #8b7d60;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        .info {
            color: #8b7d60;
        }
    </style>
</head>
<body>

    <h1>📖 QCF4 - Indexeur complet</h1>

    <div class="controls">
        <input type="text" id="verseInput" placeholder="ex: 2:12" value="2:12" />
        <button id="loadBtn">🔍 Afficher le verset</button>
        <button id="buildBtn">⚡ Reconstruire l'index</button>
        <span class="status" id="status">Prêt</span>
    </div>

    <div id="verseDisplay" class="verset">⏳ Entrez une référence et cliquez sur "Afficher".</div>

    <div id="log">⏳ Initialisation... Cliquez sur "Reconstruire l'index" pour commencer.</div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const BASE_URL = 'https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main';
        const FONT_BASE = 'https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2';

        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        let verseIndex = {};
        let isIndexBuilt = false;
        let fontCache = new Set();

        // ============================================================
        // CHARGER UNE POLICE (depuis CDN)
        // ============================================================
        async function loadFont(fontName) {
            if (fontCache.has(fontName)) return true;
            if (document.fonts.check(`16px "${fontName}"`)) {
                fontCache.add(fontName);
                return true;
            }

            const url = `${FONT_BASE}/${fontName}_W.woff2`;
            try {
                const font = new FontFace(fontName, `url(${url})`);
                await font.load();
                document.fonts.add(font);
                fontCache.add(fontName);
                console.log(`✅ Police chargée : ${fontName}`);
                return true;
            } catch (e) {
                console.warn(`⚠️ Police non chargée : ${fontName}`, e);
                return false;
            }
        }

        // ============================================================
        // CHARGER UNE PAGE (depuis GitHub)
        // ============================================================
        async function loadPage(pageNum) {
            const pageStr = String(pageNum).padStart(3, '0');
            const url = `${BASE_URL}/pages/${pageStr}.json`;
            try {
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                console.warn(`⚠️ Page ${pageStr} non chargée`, e);
                return null;
            }
        }

        // ============================================================
        // CHARGER L'INDEX (verses.json)
        // ============================================================
        async function loadVersesIndex() {
            const url = `${BASE_URL}/verses.json`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                throw new Error(`Impossible de charger verses.json: ${e.message}`);
            }
        }

        // ============================================================
        // CONSTRUIRE L'INDEX COMPLET
        // ============================================================
        async function buildIndex() {
            const log = document.getElementById('log');
            const status = document.getElementById('status');
            log.textContent = '⏳ Construction de l\'index...\n';
            status.textContent = '⏳ Chargement...';

            verseIndex = {};
            isIndexBuilt = false;
            fontCache.clear();

            try {
                // 1. Charger verses.json
                log.textContent += '📥 Chargement de verses.json...\n';
                const verses = await loadVersesIndex();
                log.textContent += `✅ verses.json chargé (${Object.keys(verses).length} versets)\n`;

                // 2. Collecter les pages uniques
                const pagesNeeded = new Set();
                for (const key in verses) {
                    pagesNeeded.add(verses[key].page);
                }
                log.textContent += `📄 ${pagesNeeded.size} pages à charger\n`;

                // 3. Charger chaque page
                let totalWords = 0;
                let totalVersets = 0;
                let totalPagesLoaded = 0;

                for (const pageNum of pagesNeeded) {
                    const page = await loadPage(pageNum);
                    if (!page) continue;

                    totalPagesLoaded++;

                    // Charger la police de cette page
                    if (page.font) {
                        await loadFont(page.font);
                    }

                    page.lines.forEach(line => {
                        line.words.forEach(word => {
                            if (word.verse_key) {
                                const key = word.verse_key;
                                if (!verseIndex[key]) {
                                    verseIndex[key] = [];
                                    totalVersets++;
                                }
                                verseIndex[key].push({
                                    char: word.char,
                                    position: word.position,
                                    page: pageNum,
                                    font: word.font || page.font,
                                    line: line.line,
                                    word_start: word.position,
                                    word_end: word.position
                                });
                                totalWords++;
                            }
                        });
                    });

                    // Log toutes les 10 pages
                    if (totalPagesLoaded % 10 === 0) {
                        log.textContent += `✅ ${totalPagesLoaded} pages chargées...\n`;
                    }
                }

                isIndexBuilt = true;
                log.textContent += `\n✅ Index construit !\n`;
                log.textContent += `   📄 Pages chargées : ${totalPagesLoaded}\n`;
                log.textContent += `   📝 Mots indexés : ${totalWords}\n`;
                log.textContent += `   📖 Versets uniques : ${totalVersets}\n`;

                status.textContent = '✅ Prêt';
                status.className = 'status success';

                // Afficher le verset par défaut
                const defaultRef = document.getElementById('verseInput').value.trim();
                if (defaultRef) {
                    afficherVerset(defaultRef);
                }

            } catch (error) {
                log.textContent += `\n❌ ERREUR : ${error.message}\n`;
                console.error(error);
                status.textContent = '❌ Erreur';
                status.className = 'status error';
            }

            log.scrollTop = log.scrollHeight;
        }

        // ============================================================
        // AFFICHER UN VERSET
        // ============================================================
        async function afficherVerset(verseKey) {
            const display = document.getElementById('verseDisplay');
            const log = document.getElementById('log');
            const status = document.getElementById('status');

            if (!isIndexBuilt) {
                display.textContent = '⚠️ Index non construit. Clique sur "Reconstruire l\'index".';
                return;
            }

            const words = verseIndex[verseKey] || [];
            if (words.length === 0) {
                display.textContent = `❌ Verset ${verseKey} non trouvé.`;
                log.textContent += `\n❌ ${verseKey} non trouvé\n`;
                return;
            }

            status.textContent = `⏳ Chargement de ${verseKey}...`;
            log.textContent += `\n📖 Chargement de ${verseKey} (${words.length} mots)...\n`;

            // Trier par position
            words.sort((a, b) => a.position - b.position);

            // Charger les polices nécessaires
            const fontsNeeded = new Set(words.map(w => w.font));
            for (const fontName of fontsNeeded) {
                await loadFont(fontName);
            }

            // Construire le verset
            const chars = words.map(w => w.char).join('');
            display.textContent = chars;

            log.textContent += `✅ ${verseKey} affiché (${chars.length} caractères)\n`;
            status.textContent = `✅ ${verseKey} affiché`;
            status.className = 'status success';
            log.scrollTop = log.scrollHeight;
        }

        // ============================================================
        // ÉVÉNEMENTS
        // ============================================================
        document.getElementById('buildBtn').addEventListener('click', function() {
            buildIndex();
        });

        document.getElementById('loadBtn').addEventListener('click', function() {
            const ref = document.getElementById('verseInput').value.trim();
            if (!ref) {
                document.getElementById('verseDisplay').textContent = '⚠️ Entrez une référence (ex: 3:187)';
                return;
            }
            afficherVerset(ref);
        });

        document.getElementById('verseInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loadBtn').click();
            }
        });

        // ============================================================
        // LANCEMENT AUTOMATIQUE
        // ============================================================
        window.addEventListener('load', function() {
            buildIndex();
        });
    </script>

</body>
</html>
