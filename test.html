<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCF4 - Solution finale</title>
    <style>
        body {
            background: #1a1a2e;
            color: #e0d4b4;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            font-family: monospace;
        }
        .verset {
            font-size: 32px;
            display: block;
            padding: 20px;
            margin: 15px 0;
            line-height: 2;
            text-align: right;
            background: #161b22;
            color: #e8dfc8;
            border-radius: 12px;
            border-right: 5px solid #c9a84c;
            min-height: 60px;
            font-family: 'QCF4_Hafs_01', serif;
        }
        #log {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            border: 1px solid #2a3040;
        }
        input, button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #2a3040;
            background: #0d1117;
            color: #e0d4b4;
        }
        button {
            background: #c9a84c;
            color: #0d1117;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #dbb95e;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <h1>📖 QCF4 - Solution finale</h1>

    <div class="controls">
        <input type="text" id="verseInput" placeholder="ex: 2:22" value="2:22" />
        <button id="loadBtn">🔍 Afficher</button>
        <span class="status" id="status">Prêt</span>
    </div>

    <div id="verseDisplay" class="verset">⏳ Entrez une référence.</div>
    <div id="log">⏳ Chargement...</div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const PAGES_BASE = 'https://raw.githubusercontent.com/webmasterdemedit/medit/main/pages';
        const VERSES_URL = 'https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/verses.json';
        const FONT_MAP_URL = 'https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/font-map.json';
        const FONT_BASE = 'https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2';

        let verseIndex = {};
        let fontMap = {};
        let isIndexBuilt = false;
        let fontCache = new Set();

        // ============================================================
        // CHARGER font-map.json
        // ============================================================
        async function loadFontMap() {
            const res = await fetch(FONT_MAP_URL);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            fontMap = await res.json();
            console.log(`✅ font-map.json chargé (${Object.keys(fontMap).length} pages)`);
        }

        // ============================================================
        // TROUVER LA POLICE POUR UNE PAGE
        // ============================================================
        function getFontForPage(pageNum) {
            return fontMap[String(pageNum)] || `QCF4_Hafs_${String(pageNum).padStart(2, '0')}`;
        }

        // ============================================================
        // CHARGER UNE POLICE (depuis CDN officiel)
        // ============================================================
        async function loadFont(fontName) {
            if (fontCache.has(fontName)) return true;
            if (document.fonts.check(`16px "${fontName}"`)) {
                fontCache.add(fontName);
                return true;
            }

            const url = `${FONT_BASE}/${fontName}_W.woff2`;
            try {
                const font = new FontFace(fontName, `url(${url})`);
                await font.load();
                document.fonts.add(font);
                fontCache.add(fontName);
                console.log(`✅ Police chargée : ${fontName}`);
                return true;
            } catch (e) {
                console.warn(`⚠️ Échec chargement de ${fontName} :`, e);
                return false;
            }
        }

        // ============================================================
        // CHARGER L'INDEX (verses.json)
        // ============================================================
        async function buildIndex() {
            const log = document.getElementById('log');
            log.textContent = '⏳ Chargement de verses.json...\n';

            try {
                await loadFontMap();
                const res = await fetch(VERSES_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                verseIndex = await res.json();
                isIndexBuilt = true;
                log.textContent += `✅ verses.json chargé (${Object.keys(verseIndex).length} versets)\n`;
                log.textContent += '✅ Index prêt !\n';

                const defaultRef = document.getElementById('verseInput').value.trim();
                if (defaultRef) afficherVerset(defaultRef);

            } catch (error) {
                log.textContent += `\n❌ ERREUR : ${error.message}\n`;
            }
        }

        // ============================================================
        // AFFICHER UN VERSET
        // ============================================================
        async function afficherVerset(verseKey) {
            const display = document.getElementById('verseDisplay');
            const log = document.getElementById('log');

            if (!isIndexBuilt) {
                display.textContent = '⏳ Index en cours de chargement...';
                return;
            }

            const info = verseIndex[verseKey];
            if (!info) {
                display.textContent = `❌ ${verseKey} non trouvé`;
                log.textContent += `\n❌ ${verseKey} non trouvé\n`;
                return;
            }

            log.textContent += `\n📖 Chargement de ${verseKey} (page ${info.page})...\n`;

            // ✅ Trouver la bonne police via font-map.json
            const fontName = getFontForPage(info.page);
            log.textContent += `🔤 Police : ${fontName}\n`;

            await loadFont(fontName);

            // Charger la page depuis TON dépôt
            const pageNum = String(info.page).padStart(3, '0');
            const pageUrl = `${PAGES_BASE}/${pageNum}.json`;
            const page = await fetch(pageUrl).then(r => r.json());

            // Extraire les caractères
            let chars = '';
            for (const lineInfo of info.lines) {
                const line = page.lines.find(l => l.line === lineInfo.line);
                if (!line) continue;
                const words = line.words.slice(lineInfo.word_start - 1, lineInfo.word_end);
                chars += words.map(w => w.char).join('');
            }

            display.textContent = chars || '⚠️ Aucun caractère';
            display.style.fontFamily = `'${fontName}', serif`;

            log.textContent += `✅ ${verseKey} affiché (${chars.length} caractères) avec ${fontName}\n`;
        }

        // ============================================================
        // ÉVÉNEMENTS
        // ============================================================
        document.getElementById('loadBtn').addEventListener('click', function() {
            const ref = document.getElementById('verseInput').value.trim();
            if (!ref) {
                document.getElementById('verseDisplay').textContent = '⚠️ Entrez une référence.';
                return;
            }
            afficherVerset(ref);
        });

        document.getElementById('verseInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loadBtn').click();
            }
        });

        window.addEventListener('load', buildIndex);
    </script>

</body>
</html>
