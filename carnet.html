<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Carnet de l'auteur - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❧</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-carnet {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 30px 60px;
      font-family: 'EB Garamond', Garamond, serif;
    }
    .carnet-hero {
      text-align: center;
      padding: 40px 10px 30px;
      margin-bottom: 26px;
      border-bottom: 0.6px solid #1a1712;
    }
    .carnet-hero .orn { display: block; color: #9a7b3c; font-size: 22px; line-height: 1; margin-bottom: 8px; }
    .carnet-hero h1 {
      font-family: 'Cormorant SC', 'EB Garamond', serif; font-weight: 600;
      font-size: 48px; letter-spacing: 5px; text-transform: lowercase;
      margin: 0 0 10px; color: var(--text); line-height: 1.1;
    }
    .carnet-hero p {
      font-style: italic; font-size: 19px; line-height: 1.5;
      color: var(--text-secondary); max-width: 600px; margin: 0 auto;
    }
    .carnet-hero .filets {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 22%; margin: 16px auto 0;
    }
    .carnet-hero .filets::before, .carnet-hero .filets::after {
      content: ""; flex: 1; border-top: 0.6px solid #9a7b3c;
    }
    .carnet-hero .compte {
      margin-top: 12px; font-family: 'Cormorant SC', 'EB Garamond', serif;
      letter-spacing: 2px; font-size: 15px; color: #2d6a4f;
    }
    .carnet-chargement { text-align: center; font-style: italic; color: #7a705f; padding: 40px 0; }
    @media (max-width: 700px) {
      .page-carnet { padding: 12px 16px 40px; }
      .carnet-hero h1 { font-size: 34px; letter-spacing: 3px; }
      .carnet-hero p { font-size: 17px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) { document.write(xhr.responseText); }
  </script>
</head>
<body>

  <div class="page page-carnet">
    <section class="carnet-hero">
      <span class="orn">❧</span>
      <h1>Carnet de l'auteur</h1>
      <p>Notes, réflexions et recherches, au fil des thèmes. De la plus récente à la plus ancienne.</p>
      <div class="filets"></div>
      <div class="compte" id="compteNotes"></div>
    </section>

    <div id="pageCarnet">
      <p class="carnet-chargement">Chargement du carnet…</p>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>
  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(r) { return r.text(); })
      .then(function(d) { document.getElementById('footer-container').innerHTML = d; })
      .catch(function() {});
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/carnet.js"></script>

  <script>
    function parseEcrits(val) {
      if (!val) return [];
      try {
        if (typeof val === 'string') { var a = JSON.parse(val); return Array.isArray(a) ? a : []; }
        return Array.isArray(val) ? val : [];
      } catch (e) { return []; }
    }

    function ecritsDuTheme(l) {
      if (Array.isArray(l.infos) && l.infos[0] && (l.infos[0].titre !== undefined || l.infos[0].contenu !== undefined)) {
        return l.infos.filter(function(e) { return e && (e.titre || e.contenu); });
      }
      return parseEcrits(l.ecrits);
    }

    function afficher(themes) {
      var tous = [];
      (themes || []).forEach(function(l) {
        ecritsDuTheme(l).forEach(function(e) {
          var copie = Object.assign({}, e);
          copie._theme = l.titre || '';
          tous.push(copie);
        });
      });
      var n = tous.length;
      document.getElementById('compteNotes').textContent = n ? (n + ' note' + (n > 1 ? 's' : '')) : '';
      Carnet.afficherPage(document.getElementById('pageCarnet'), tous);
    }

    function demarrer() {
      DataManager.charger()
        .then(function(data) { afficher((data && data.themes) || []); })
        .catch(function() {
          var id = (typeof getIdUtilisateur === 'function') ? getIdUtilisateur() : (localStorage.getItem('etudiant_id') || 'invite');
          var cache = DataManager.getCacheForce ? DataManager.getCacheForce(id) : null;
          if (cache) afficher(cache.themes || []);
          else document.getElementById('pageCarnet').innerHTML = '<p class="carnet-chargement">Impossible de charger le carnet pour le moment.</p>';
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  </script>

</body>
</html>
