<!-- les-textes.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Derniers textes publiés - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-blog {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-blog h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-blog .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .barre-recherche {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .barre-recherche input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    .barre-recherche input:focus { border-color: var(--text-secondary); }
    .compteur-resultats {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .barre-tri {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .tri-groupe {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .tri-groupe label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .tri-groupe select {
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .tri-groupe select:hover,
    .tri-groupe select:focus {
      border-color: var(--text-secondary);
    }

    .tri-reset {
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
    }

    .tri-reset:hover {
      color: var(--text);
      border-color: var(--text-secondary);
    }

    .page-blog .grille-themes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .carte-blog {
      display: flex;
      gap: 0;
      padding: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
      overflow: hidden;
    }

    .carte-blog:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    /* ---------- Couverture (fallback si pas d'images) ---------- */
    .carte-blog .blog-couverture {
      flex: 0 0 90px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #f5f5f5;
    }

    .carte-blog .blog-couverture .couverture-contenu {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .carte-blog .blog-couverture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carte-blog .blog-couverture .couverture-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }

    .carte-blog .blog-couverture .progression-couverture {
      flex: 0 0 3px;
      width: 100%;
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .carte-blog .blog-couverture .progression-couverture .progression-remplissage {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--text);
    }

    /* ---------- Miniatures des images du post ---------- */
    .carte-blog .blog-miniatures {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;      /* centrage vertical */
      gap: 6px;
      padding: 12px 10px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      box-sizing: border-box;
      min-width: 90px;
      max-width: 140px;
      position: relative;
    }

    .carte-blog .blog-miniatures .miniature {
      width: 64px;
      height: 64px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
      background: #f5f5f5;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .carte-blog .blog-miniatures .miniature-fallback {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      box-sizing: border-box;
    }

    .carte-blog .blog-miniatures .miniature-plus {
      width: 64px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      box-sizing: border-box;
    }

    .carte-blog .blog-miniatures .progression-couverture {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: var(--border);
      overflow: hidden;
    }

    .carte-blog .blog-miniatures .progression-couverture .progression-remplissage {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--text);
    }

    /* ---------- Corps de la carte ---------- */
    .carte-blog .blog-centre {
      display: flex;
      gap: 20px;
      flex: 1;
      min-width: 0;
      padding: 18px 20px;
      box-sizing: border-box;
    }

    .carte-blog .blog-numero {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
      border-right: 1px solid var(--border);
      padding-right: 14px;
      box-sizing: border-box;
    }

    .carte-blog .blog-corps {
      flex: 1;
      min-width: 0;
    }

    .carte-blog .blog-titre {
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .carte-blog .blog-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .carte-blog .blog-meta .badge-icone,
    .carte-blog .blog-meta .niveau-badge,
    .carte-blog .blog-meta .mots {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .carte-blog .blog-extrait {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .carte-blog .blog-categorie {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .carte-blog .blog-date {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
      box-sizing: border-box;
      white-space: nowrap;
    }

    .carte-blog .blog-date .bandeau-validation-texte {
      font-style: italic;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
      text-align: right;
      max-width: 200px;
      white-space: normal;
    }

    .carte-blog .blog-date .bloc-date {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
    }

    .carte-blog .blog-date .date-label {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .carte-blog .blog-date .date-validation {
      color: var(--text);
    }

    @media (max-width: 700px) {
      .page-blog { padding: 12px 16px 30px; }
      .page-blog h1 { font-size: 22px; }

      .carte-blog .blog-couverture { flex: 0 0 64px; }

      /* Miniatures : horizontales en haut de la carte */
      .carte-blog .blog-miniatures {
        flex: 1 0 100%;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        padding: 8px;
        gap: 4px;
        min-width: 0;
        max-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .carte-blog .blog-miniatures .miniature,
      .carte-blog .blog-miniatures .miniature-fallback {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
      .carte-blog .blog-miniatures .miniature-plus {
        width: 44px;
        height: 20px;
        font-size: 11px;
      }

      .carte-blog { flex-wrap: wrap; }

      .carte-blog .blog-centre {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
        flex: 1 0 100%;
      }

      .carte-blog .blog-numero {
        flex: 0 0 36px;
        font-size: 18px;
        padding-right: 10px;
      }

      .carte-blog .blog-date {
        flex: 1 0 100%;
        align-items: center;
        justify-content: flex-start;
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 8px;
        flex-direction: row-reverse;
        gap: 12px;
      }

      .carte-blog .blog-date .bandeau-validation-texte {
        text-align: left;
        max-width: none;
      }

      .carte-blog .blog-date .bloc-date {
        text-align: left;
        flex-direction: row;
        gap: 6px;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-blog">

    <h1>Derniers textes publiés</h1>
    <p class="sous-titre-page">Les textes les plus récents, tous thèmes confondus. Cliquez sur un texte pour le lire.</p>

    <div class="barre-recherche">
      <input type="text" id="rechercheTextes" placeholder="Rechercher un titre, un thème, un tag, un extrait..." />
      <span class="compteur-resultats" id="compteurResultats"></span>
    </div>

    <div class="barre-tri" id="barreTri">
      <div class="tri-groupe">
        <label for="triTheme">Thème</label>
        <select id="triTheme" onchange="appliquerTri()">
          <option value="">Tous</option>
        </select>
      </div>
      <div class="tri-groupe">
        <label for="triTag">Tag</label>
        <select id="triTag" onchange="appliquerTri()">
          <option value="">Tous</option>
        </select>
      </div>
      <div class="tri-groupe">
        <label for="triAnnee">Année</label>
        <select id="triAnnee" onchange="appliquerTri()">
          <option value="">Toutes</option>
        </select>
      </div>
      <button class="tri-reset" onclick="reinitialiserTri()">Réinitialiser</button>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des textes...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var toutesLesReponses = {};
    var textesData = [];
    var themesData = {};
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var rechercheActive = '';

    // Cache des images par catégorie (nomImage -> url)
    var imagesParCategorie = {};

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function normaliserRecherche(str) {
      return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function formatDateRelative(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';

      var maintenant = new Date();
      var diffMs = maintenant - d;
      var diffJours = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffJours < 0) diffJours = 0;
      if (diffJours === 0) return "Aujourd'hui";
      if (diffJours === 1) return 'Hier';
      if (diffJours < 7) return 'Il y a ' + diffJours + ' jours';
      if (diffJours < 30) return 'Il y a ' + Math.floor(diffJours / 7) + ' sem.';
      if (diffJours < 365) return 'Il y a ' + Math.floor(diffJours / 30) + ' mois';

      return d.toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function formatDateComplete(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function anneeDe(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      return String(d.getFullYear());
    }

    // ============================================================
    // EXTRACTION DES NOMS D'IMAGES D'UN TEXTE
    // On lit `paragraphes` (présent dans la liste) et éventuellement
    // `contenu` (si présent). Format : img:nomImage[:position[:taille]]
    // ============================================================
    function extraireImagesTexte(texte) {
      var noms = [];
      var vus = {};

      function scanner(str) {
        if (!str) return;
        var lignes = String(str).split('\n');
        for (var i = 0; i < lignes.length; i++) {
          var l = lignes[i].trim();
          var m = l.match(/^img:([^:\s]+)/i);
          if (m) {
            var nom = m[1];
            if (!vus[nom]) { vus[nom] = true; noms.push(nom); }
          }
        }
      }

      // paragraphes : tableau ou chaîne (selon comment DataManager l'expose)
      if (Array.isArray(texte.paragraphes)) {
        texte.paragraphes.forEach(scanner);
      } else if (typeof texte.paragraphes === 'string') {
        scanner(texte.paragraphes);
      }
      // contenu complet (si disponible)
      scanner(texte.contenu);

      return noms;
    }

    // ============================================================
    // PRÉCHARGEMENT DES IMAGES PAR CATÉGORIE
    // ============================================================
    function prechargerImagesCategories(categories) {
      var uniques = {};
      categories.forEach(function(c) { if (c) uniques[c] = true; });
      var liste = Object.keys(uniques);

      // On garde DataManager.chargerImagesTheme (cache mémoire + localStorage)
      var promesses = liste.map(function(cat) {
        return DataManager.chargerImagesTheme(cat)
          .then(function(images) {
            imagesParCategorie[cat] = images || {};
          })
          .catch(function() {
            imagesParCategorie[cat] = {};
          });
      });

      return Promise.all(promesses);
    }

    function chargerTextes() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      nomEtudiant = id;
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(resultats) {
        var data = resultats[0];
        var tentatives = resultats[1];

        niveauEtudiant = data.niveau || 0;
        textesData = data.tousLesTextes || data.textes || [];

        themesData = {};
        if (data.themes && Array.isArray(data.themes)) {
          data.themes.forEach(function(l) {
            themesData[l.titre] = {
              couleur: l.couleur || '#2d6a4f',
              sousTitre: l.sousTitre || '',
              date: l.date || '',
              auteur: l.auteur || '',
              niveau: parseInt(l.niveau) || 0,
              couverture: l.couverture || ''
            };
          });
        }

        toutesLesReponses = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          if (!toutesLesReponses[k]) toutesLesReponses[k] = [];
          toutesLesReponses[k].push({
            texteId: t.texteId,
            titre: t.titre,
            bonnes: t.bonnes,
            total: t.total,
            pourcentage: t.pourcentage,
            date: t.date || '',
            valide: (t.pourcentage >= 65) ? 'valide' : 'non-valide'
          });
        });

        // Précharger les images de toutes les catégories présentes
        var cats = textesData.map(function(t) { return t.categorie; });
        return prechargerImagesCategories(cats).then(function() {
          initialiserFiltres();
          afficherBlog();
        });
      }).catch(function(error) {
        console.error('Erreur chargement:', error);
        var cache = DataManager.getCacheForce(id);
        if (cache) {
          niveauEtudiant = cache.niveau || 0;
          textesData = cache.tousLesTextes || cache.textes || [];
          if (cache.themes && Array.isArray(cache.themes)) {
            themesData = {};
            cache.themes.forEach(function(l) {
              themesData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                auteur: l.auteur || '',
                niveau: parseInt(l.niveau) || 0,
                couverture: l.couverture || ''
              };
            });
          }
          var cats = textesData.map(function(t) { return t.categorie; });
          prechargerImagesCategories(cats).then(function() {
            initialiserFiltres();
            afficherBlog();
          });
        } else {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide-themes">
              <span class="icone">⚠</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion internet.</p>
              <button onclick="DataManager.rafraichir(); location.reload();"
                      style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text);">
                Réessayer
              </button>
            </div>
          `;
        }
      });
    }

    function initialiserFiltres() {
      var accessibles = textesData.filter(function(t) {
        return (parseInt(t.niveau) || 1) <= niveauEtudiant;
      });

      var themes = {};
      accessibles.forEach(function(t) {
        var cat = (t.categorie || '').trim();
        if (cat) themes[normaliserComparaison(cat)] = cat;
      });
      var selTheme = document.getElementById('triTheme');
      Object.keys(themes).sort(function(a, b) {
        return themes[a].localeCompare(themes[b], 'fr', { sensitivity: 'base' });
      }).forEach(function(k) {
        var opt = document.createElement('option');
        opt.value = themes[k];
        opt.textContent = themes[k];
        selTheme.appendChild(opt);
      });

      var tagsMap = {};
      accessibles.forEach(function(t) {
        (t.tags || []).forEach(function(tag) {
          var brut = String(tag).trim();
          if (brut) tagsMap[normaliserComparaison(brut)] = brut;
        });
      });
      var selTag = document.getElementById('triTag');
      Object.keys(tagsMap).sort(function(a, b) {
        return tagsMap[a].localeCompare(tagsMap[b], 'fr', { sensitivity: 'base' });
      }).forEach(function(k) {
        var opt = document.createElement('option');
        opt.value = tagsMap[k];
        opt.textContent = '#' + tagsMap[k];
        selTag.appendChild(opt);
      });

      var annees = {};
      accessibles.forEach(function(t) {
        var a = anneeDe(t.date);
        if (a) annees[a] = true;
      });
      var selAnnee = document.getElementById('triAnnee');
      Object.keys(annees).sort(function(a, b) { return b - a; }).forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        selAnnee.appendChild(opt);
      });
    }

    function appliquerTri() { afficherBlog(); }

    function reinitialiserTri() {
      document.getElementById('triTheme').value = '';
      document.getElementById('triTag').value = '';
      document.getElementById('triAnnee').value = '';
      var input = document.getElementById('rechercheTextes');
      if (input) input.value = '';
      rechercheActive = '';
      afficherBlog();
    }

    function brancherRecherche() {
      var input = document.getElementById('rechercheTextes');
      if (!input) return;
      var timer = null;
      input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          rechercheActive = input.value.trim();
          afficherBlog();
        }, 150);
      });
    }

    function afficherBlog() {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var filtreTheme = document.getElementById('triTheme').value;
      var filtreTag = document.getElementById('triTag').value;
      var filtreAnnee = document.getElementById('triAnnee').value;

      var accessibles = textesData.filter(function(t) {
        return (parseInt(t.niveau) || 1) <= niveauEtudiant;
      });

      if (filtreTheme) {
        var cibleTheme = normaliserComparaison(filtreTheme);
        accessibles = accessibles.filter(function(t) {
          return normaliserComparaison(t.categorie || '') === cibleTheme;
        });
      }

      if (filtreTag) {
        var cibleTag = normaliserComparaison(filtreTag);
        accessibles = accessibles.filter(function(t) {
          return (t.tags || []).some(function(x) {
            return normaliserComparaison(x) === cibleTag;
          });
        });
      }

      if (filtreAnnee) {
        accessibles = accessibles.filter(function(t) {
          return anneeDe(t.date) === filtreAnnee;
        });
      }

      if (rechercheActive) {
        var r = normaliserRecherche(rechercheActive);
        accessibles = accessibles.filter(function(t) {
          if (normaliserRecherche(t.titre).indexOf(r) !== -1) return true;
          if (normaliserRecherche(t.categorie).indexOf(r) !== -1) return true;
          if (normaliserRecherche(t.description || t.extrait).indexOf(r) !== -1) return true;
          if ((t.tags || []).some(function(tag) { return normaliserRecherche(tag).indexOf(r) !== -1; })) return true;
          return false;
        });
      }

      accessibles.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        if (da !== db) return db - da;
        return extraireNumeroTexte(b.titre) - extraireNumeroTexte(a.titre);
      });

      var compteurEl = document.getElementById('compteurResultats');
      if (compteurEl) {
        if (rechercheActive) compteurEl.textContent = accessibles.length + ' résultat(s)';
        else compteurEl.textContent = '';
      }

      var container = document.getElementById('contenu');
      var html = '<div class="grille-themes" id="listeBlog">';

      if (accessibles.length === 0) {
        html += `
          <div class="vide-themes">
            <span class="icone">◈</span>
            <h2>Aucun texte disponible</h2>
          </div>
        `;
      } else {
        accessibles.forEach(function(texte) {
          html += construireCarteBlog(texte);
        });
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function infoValidationTexte(texteId) {
      var reponses = toutesLesReponses[String(texteId)];
      if (!reponses || reponses.length === 0) return { valide: false, date: '' };

      var meilleurPct = -1;
      var meilleureDate = '';
      for (var i = 0; i < reponses.length; i++) {
        var pct = reponses[i].pourcentage || 0;
        if (pct > meilleurPct) {
          meilleurPct = pct;
          meilleureDate = reponses[i].date || '';
        }
      }
      var valide = meilleurPct >= 65;
      return { valide: valide, date: valide ? meilleureDate : '' };
    }

    // ============================================================
    // CONSTRUCTION DE LA ZONE GAUCHE (miniatures ou couverture)
    // ============================================================
    function construireZoneGauche(texte, estValide) {
      var themeMeta = themesData[texte.categorie] || {};
      var couleurTheme = themeMeta.couleur || '#2d6a4f';
      var couvertureTheme = themeMeta.couverture || '';

      var nomsImages = extraireImagesTexte(texte);
      var imagesCat = imagesParCategorie[texte.categorie] || {};

      // Filtrer : ne garder que celles dont l'URL est résolue OU fallback initiale
      // On garde tout de même celles non résolues (fallback initiale)
      if (nomsImages.length > 0) {
        var max = 3;
        var visibles = nomsImages.slice(0, max);
        var reste = nomsImages.length - visibles.length;

        var minisHtml = '';
        visibles.forEach(function(nom) {
          var url = imagesCat[nom];
          if (url) {
            minisHtml += '<img class="miniature" src="' + escapeHtml(url) + '" alt="" loading="lazy">';
          } else {
            // Fallback : initiale du nom sur fond couleur du thème
            minisHtml += '<div class="miniature-fallback" style="background:' + couleurTheme + ';">' +
                         escapeHtml(nom.charAt(0).toUpperCase()) + '</div>';
          }
        });

        if (reste > 0) {
          minisHtml += '<div class="miniature-plus">+' + reste + '</div>';
        }

        // Progression de validation conservée (barre en bas)
        var largeurProgression = estValide ? '100%' : '0%';
        var progressionHtml =
          '<div class="progression-couverture">' +
            '<div class="progression-remplissage" style="width:' + largeurProgression + ';"></div>' +
          '</div>';

        return '<div class="blog-miniatures">' + minisHtml + progressionHtml + '</div>';
      }

      // Fallback : ancienne couverture thème
      var couvertureContenuHtml = couvertureTheme
        ? '<img src="' + escapeHtml(couvertureTheme) + '" alt="" loading="lazy">'
        : '<div class="couverture-fallback" style="background:' + couleurTheme + ';">◆</div>';

      var largeurProgression2 = estValide ? '100%' : '0%';

      return (
        '<div class="blog-couverture">' +
          '<div class="couverture-contenu">' + couvertureContenuHtml + '</div>' +
          '<div class="progression-couverture">' +
            '<div class="progression-remplissage" style="width:' + largeurProgression2 + ';"></div>' +
          '</div>' +
        '</div>'
      );
    }

    function construireCarteBlog(texte) {
      var numero = extraireNumeroTexte(texte.titre);
      var titreAffiche = extraireTitreSansNumero(texte.titre);
      var categorie = (texte.categorie || 'Sans catégorie').trim();
      var mots = texte.mots || 0;

      var validation = infoValidationTexte(texte.id);
      var estValide = validation.valide;
      var dateValidation = validation.date;
      var dateAjout = texte.date || '';

      var TYPES_EXERCICES = [
        { prefix: 'quiz:',   label: 'QCM' },
        { prefix: 'open:',   label: 'Ouverte' },
        { prefix: 'ordre:',  label: 'Ordre' },
        { prefix: 'carte:',  label: 'Carte' },
        { prefix: 'relier:', label: 'Relier' },
        { prefix: 'tt:',     label: 'Trous' },
        { prefix: 'vf:',     label: 'VF' },
        { prefix: 'copier:', label: 'Copier' }
      ];

      var ordreBlocs = texte.ordreBlocs || [];
      var detailParts = [];
      var nbExercices = 0;

      if (ordreBlocs.length > 0) {
        TYPES_EXERCICES.forEach(function(type) {
          var count = 0;
          ordreBlocs.forEach(function(ob) {
            if (ob.indexOf(type.prefix) === 0) count++;
          });
          if (count > 0) {
            nbExercices++;
            detailParts.push(count + ' ' + type.label);
          }
        });
      } else {
        if (texte.hasQuiz)     { nbExercices++; detailParts.push('1 QCM'); }
        if (texte.hasQuestion) { nbExercices++; detailParts.push('1 Ouverte'); }
      }

      var detailExercices = detailParts.join(' · ');
      var extrait = texte.description || texte.extrait || '';
      if (extrait.length > 200) extrait = extrait.substring(0, 200) + '…';

      var numeroHtml = (numero !== Infinity)
        ? '<div class="blog-numero">' + numero + '</div>'
        : '<div class="blog-numero">◆</div>';

      var zoneGaucheHtml = construireZoneGauche(texte, estValide);

      var bandeauValidationHtml = '';
      if (estValide && dateValidation) {
        bandeauValidationHtml = '<div class="bandeau-validation-texte">Vous avez validé ce texte le ' + escapeHtml(dateValidation) + '</div>';
      }

      var dateCreationHtml = '';
      if (dateAjout) {
        dateCreationHtml = '<span class="date-validation">' + formatDateRelative(dateAjout) + '</span>';
      }

      var colDateHtml =
        '<div class="blog-date">' +
          bandeauValidationHtml +
          '<div class="bloc-date">' +
            dateCreationHtml +
          '</div>' +
        '</div>';

      return `
        <div class="carte-blog"
             onclick="window.location.href='/medit/texte.html?id=${encodeURIComponent(texte.id)}'">
          ${zoneGaucheHtml}
          <div class="blog-centre">
            ${numeroHtml}
            <div class="blog-corps">
              <div class="blog-titre">${escapeHtml(titreAffiche)}</div>
              <div class="blog-meta">
                <span class="niveau-badge">Niveau ${texte.niveau}</span>
                ${nbExercices > 0 ? '<span class="badge-icone">Nbr exercices : ' + nbExercices + '</span>' : ''}
                ${detailExercices ? '<span class="badge-icone">' + detailExercices + '</span>' : ''}
                ${mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : ''}
              </div>
              ${extrait ? '<div class="blog-extrait">' + escapeHtml(extrait) + '</div>' : ''}
              <span class="blog-categorie">#${escapeHtml(categorie)}</span>
            </div>
            ${colDateHtml}
          </div>
        </div>
      `;
    }

    function demarrer() {
      brancherRecherche();
      chargerTextes();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>
