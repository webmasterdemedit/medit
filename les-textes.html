<!-- les-textes.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Derniers rappels publiés - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    /* ===== PAGE BLOG ===== */
    .page-blog { max-width: 860px; margin: 0 auto; padding: 20px 30px 40px; }
    .page-blog h1 {
      font-family: 'Georgia', serif; font-size: 28px; font-weight: 700;
      color: var(--text); margin-bottom: 4px; letter-spacing: .5px;
    }
    .page-blog .sous-titre-page {
      font-size: 15px; color: var(--text-secondary);
      margin-bottom: 24px; font-weight: 300;
    }

    /* ===== BARRE RECHERCHE ===== */
    .barre-recherche { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .barre-recherche input {
      flex: 1; padding: 9px 14px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
      font-family: 'Roboto', sans-serif; font-size: 13px; outline: none;
    }
    .barre-recherche input:focus { border-color: var(--text-secondary); }
    .compteur-resultats { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    /* ===== BARRE TRI ===== */
    .barre-tri {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    .tri-groupe { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
    .tri-groupe label {
      font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted);
    }
    .tri-groupe select {
      font-family: 'Roboto', sans-serif; font-size: 13px; padding: 6px 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; outline: none;
    }
    .tri-groupe select:hover, .tri-groupe select:focus { border-color: var(--text-secondary); }
    .tri-reset {
      font-size: 12px; padding: 6px 12px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); cursor: pointer; font-family: 'Roboto', sans-serif;
    }
    .tri-reset:hover { color: var(--text); border-color: var(--text-secondary); }

    /* ===== LISTE BLOG — plus de cadre, juste des filets ===== */
    .liste-blog { display: flex; flex-direction: column; }
    .post-blog {
      display: flex; gap: 20px; padding: 22px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit; cursor: pointer;
      transition: background .15s;
    }
    .post-blog:first-child { border-top: 1px solid var(--border); }
    .post-blog:hover { background: var(--bg-hover); }

    /* Image couverture du thème — à gauche, format livre, sans cadre */
    .post-blog .post-couverture {
      flex: 0 0 96px; width: 96px; height: 144px;
      overflow: hidden; background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
    }
    .post-blog .post-couverture img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .post-blog .post-couverture .fallback {
      font-family: 'Georgia', serif; font-size: 28px; font-weight: 700;
      color: var(--text-muted); opacity: .6;
    }

    /* Corps du post */
    .post-blog .post-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .post-blog .post-titre {
      font-family: 'Georgia', serif; font-size: 18px; font-weight: 700;
      color: var(--text); line-height: 1.3;
    }
    .post-blog .post-meta {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      font-size: 12px; color: var(--text-secondary);
    }
    .post-blog .post-meta span {
      font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); color: var(--text-secondary);
    }
    .post-blog .post-extrait {
      font-size: 13px; color: var(--text-secondary); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .post-blog .post-categorie {
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted);
    }
    .post-blog .post-validation {
      font-style: italic; font-size: 11px; color: var(--text-secondary); margin-top: 2px;
    }

    /* ===== VIDES ===== */
    .vide-themes { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .vide-themes .icone { font-size: 32px; display: block; margin-bottom: 12px; color: var(--text-muted); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .page-blog { padding: 12px 16px 30px; }
      .page-blog h1 { font-size: 22px; }
      .post-blog { gap: 14px; padding: 16px 0; }
      .post-blog .post-couverture { flex: 0 0 64px; width: 64px; height: 96px; }
      .post-blog .post-titre { font-size: 16px; }
      .post-blog .post-extrait { -webkit-line-clamp: 3; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) document.write(xhr.responseText);
  </script>
</head>
<body>

  <div class="page page-blog">
    <h1>Derniers rappels publiés</h1>
    <p class="sous-titre-page">Les rappels les plus récents, tous thèmes confondus. Cliquez sur un rappel pour le lire.</p>

    <div class="barre-recherche">
      <input type="text" id="rechercheTextes" placeholder="Rechercher un titre, un thème, un tag, un extrait..." />
      <span class="compteur-resultats" id="compteurResultats"></span>
    </div>

    <div class="barre-tri" id="barreTri">
      <div class="tri-groupe">
        <label for="triTheme">Thème</label>
        <select id="triTheme" onchange="afficherBlog()"><option value="">Tous</option></select>
      </div>
      <div class="tri-groupe">
        <label for="triTag">Tag</label>
        <select id="triTag" onchange="afficherBlog()"><option value="">Tous</option></select>
      </div>
      <div class="tri-groupe">
        <label for="triAnnee">Année</label>
        <select id="triAnnee" onchange="afficherBlog()"><option value="">Toutes</option></select>
      </div>
      <button class="tri-reset" onclick="reinitialiserTri()">Réinitialiser</button>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des rappels...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>
  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(r) { return r.text(); })
      .then(function(data) { document.getElementById('footer-container').innerHTML = data; })
      .catch(function() {
        document.getElementById('footer-container').innerHTML =
          '<footer class="site-footer"><div class="footer-devise">"La méditation est la clé qui ouvre les portes de l\'intelligence du cœur."</div><div class="footer-copy">© ' + new Date().getFullYear() + ' Qiraat</div></footer>';
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var toutesLesReponses = {}, textesData = [], themesData = {}, niveauEtudiant = 0, rechercheActive = '';

    function escapeHtml(s) {
      return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function normaliser(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }
    function anneeDe(d) {
      if (!d) return '';
      var x = new Date(d); return isNaN(x.getTime()) ? '' : String(x.getFullYear());
    }
    function dateRelative(d) {
      if (!d) return '';
      var x = new Date(d); if (isNaN(x.getTime())) return '';
      var j = Math.floor((new Date() - x) / 86400000);
      if (j < 0) j = 0;
      if (j === 0) return "Aujourd'hui";
      if (j === 1) return 'Hier';
      if (j < 7) return 'Il y a ' + j + ' jours';
      if (j < 30) return 'Il y a ' + Math.floor(j/7) + ' sem.';
      if (j < 365) return 'Il y a ' + Math.floor(j/30) + ' mois';
      return x.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
    }
    function numeroTitre(t) {
      var m = (t || '').match(/^\s*(\d+)\s+/); return m ? parseInt(m[1], 10) : Infinity;
    }
    function titreSansNumero(t) { return (t || '').replace(/^\s*\d+\s+/, '').trim(); }

    function infoValidation(id) {
      var r = toutesLesReponses[String(id)];
      if (!r || !r.length) return { valide: false, date: '' };
      var best = -1, date = '';
      r.forEach(function(x) {
        var p = x.pourcentage || 0;
        if (p > best) { best = p; date = x.date || ''; }
      });
      return { valide: best >= 65, date: best >= 65 ? date : '' };
    }

    function compterExercices(t) {
      var types = ['quiz:','open:','ordre:','carte:','relier:','tt:','vf:','copier:'];
      var ob = t.ordreBlocs || [], n = 0;
      if (ob.length) {
        ob.forEach(function(o) {
          for (var i = 0; i < types.length; i++) if (o.indexOf(types[i]) === 0) { n++; return; }
        });
      } else {
        if (t.hasQuiz) n++;
        if (t.hasQuestion) n++;
      }
      return n;
    }

    function chargerTextes() {
      var id = (typeof getIdUtilisateur === 'function') ? getIdUtilisateur() : (localStorage.getItem('etudiant_id') || 'invite');
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(res) {
        var data = res[0], tentatives = res[1];
        niveauEtudiant = data.niveau || 0;
        textesData = data.tousLesTextes || data.textes || [];

        themesData = {};
        (data.themes || []).forEach(function(l) {
          themesData[l.titre] = {
            couleur: l.couleur || '#2d6a4f',
            couverture: l.couverture || ''
          };
        });

        toutesLesReponses = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          (toutesLesReponses[k] = toutesLesReponses[k] || []).push(t);
        });

        initialiserFiltres();
        afficherBlog();
      }).catch(function() {
        var cache = DataManager.getCacheForce(id);
        if (!cache) {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('contenu').innerHTML =
            '<div class="vide-themes"><span class="icone">⚠</span><h2>Erreur de chargement</h2><p>Vérifiez votre connexion.</p></div>';
          return;
        }
        niveauEtudiant = cache.niveau || 0;
        textesData = cache.tousLesTextes || cache.textes || [];
        (cache.themes || []).forEach(function(l) {
          themesData[l.titre] = { couleur: l.couleur || '#2d6a4f', couverture: l.couverture || '' };
        });
        initialiserFiltres();
        afficherBlog();
      });
    }

    function initialiserFiltres() {
      var acc = textesData.filter(function(t) { return (parseInt(t.niveau) || 1) <= niveauEtudiant; });

      var themes = {}, tags = {}, annees = {};
      acc.forEach(function(t) {
        var c = (t.categorie || '').trim();
        if (c) themes[normaliser(c)] = c;
        (t.tags || []).forEach(function(g) { var b = String(g).trim(); if (b) tags[normaliser(b)] = b; });
        var a = anneeDe(t.date); if (a) annees[a] = true;
      });

      function remplir(id, map, prefix, tri) {
        var sel = document.getElementById(id);
        Object.keys(map).sort(tri || function(a, b) { return map[a].localeCompare(map[b], 'fr', { sensitivity: 'base' }); })
          .forEach(function(k) {
            var o = document.createElement('option');
            o.value = map[k]; o.textContent = (prefix || '') + map[k];
            sel.appendChild(o);
          });
      }
      remplir('triTheme', themes);
      remplir('triTag', tags, '#');
      remplir('triAnnee', annees, '', function(a, b) { return b - a; });
    }

    function reinitialiserTri() {
      document.getElementById('triTheme').value = '';
      document.getElementById('triTag').value = '';
      document.getElementById('triAnnee').value = '';
      var i = document.getElementById('rechercheTextes'); if (i) i.value = '';
      rechercheActive = '';
      afficherBlog();
    }

    function afficherBlog() {
      var loader = document.getElementById('loader'); if (loader) loader.style.display = 'none';

      var ft = document.getElementById('triTheme').value;
      var fg = document.getElementById('triTag').value;
      var fa = document.getElementById('triAnnee').value;

      var acc = textesData.filter(function(t) { return (parseInt(t.niveau) || 1) <= niveauEtudiant; });
      if (ft) { var c = normaliser(ft); acc = acc.filter(function(t) { return normaliser(t.categorie) === c; }); }
      if (fg) { var g = normaliser(fg); acc = acc.filter(function(t) { return (t.tags || []).some(function(x) { return normaliser(x) === g; }); }); }
      if (fa) acc = acc.filter(function(t) { return anneeDe(t.date) === fa; });
      if (rechercheActive) {
        var r = normaliser(rechercheActive);
        acc = acc.filter(function(t) {
          return normaliser(t.titre).indexOf(r) !== -1
              || normaliser(t.categorie).indexOf(r) !== -1
              || normaliser(t.description || t.extrait).indexOf(r) !== -1
              || (t.tags || []).some(function(x) { return normaliser(x).indexOf(r) !== -1; });
        });
      }

      acc.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        return da !== db ? db - da : numeroTitre(b.titre) - numeroTitre(a.titre);
      });

      var comp = document.getElementById('compteurResultats');
      if (comp) comp.textContent = rechercheActive ? acc.length + ' résultat(s)' : '';

      var container = document.getElementById('contenu');
      if (!acc.length) {
        container.innerHTML = '<div class="vide-themes"><span class="icone">◈</span><h2>Aucun rappel disponible</h2></div>';
        return;
      }

      var html = '<div class="liste-blog">';
      acc.forEach(function(t) { html += cartePost(t); });
      html += '</div>';
      container.innerHTML = html;
    }

    function cartePost(t) {
      var meta = themesData[t.categorie] || {};
      var couv = meta.couverture || '';
      var validation = infoValidation(t.id);
      var nbExo = compterExercices(t);
      var numero = numeroTitre(t.titre);
      var titre = titreSansNumero(t.titre);
      var extrait = t.description || t.extrait || '';
      if (extrait.length > 200) extrait = extrait.substring(0, 200) + '…';

      var couvHtml = couv
        ? '<img src="' + escapeHtml(couv) + '" alt="" loading="lazy">'
        : '<div class="fallback">◆</div>';

      var bandeau = validation.valide && validation.date
        ? '<div class="post-validation">Vous avez validé ce rappel le ' + escapeHtml(validation.date) + '</div>'
        : '';

      return '<a class="post-blog" href="/medit/texte.html?id=' + encodeURIComponent(t.id) + '">'
        + '<div class="post-couverture">' + couvHtml + '</div>'
        + '<div class="post-corps">'
        +   '<div class="post-titre">' + (numero !== Infinity ? numero + ' — ' : '') + escapeHtml(titre) + '</div>'
        +   '<div class="post-meta">'
        +     '<span>Niveau ' + (t.niveau || 1) + '</span>'
        +     (nbExo ? '<span>' + nbExo + ' exercice' + (nbExo > 1 ? 's' : '') + '</span>' : '')
        +     (t.mots ? '<span>' + t.mots + ' mots</span>' : '')
        +     (t.date ? '<span>' + dateRelative(t.date) + '</span>' : '')
        +   '</div>'
        +   (extrait ? '<div class="post-extrait">' + escapeHtml(extrait) + '</div>' : '')
        +   '<div class="post-categorie">#' + escapeHtml((t.categorie || 'Sans catégorie').trim()) + '</div>'
        +   bandeau
        + '</div>'
        + '</a>';
    }

    function brancherRecherche() {
      var input = document.getElementById('rechercheTextes'); if (!input) return;
      var timer = null;
      input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(function() { rechercheActive = input.value.trim(); afficherBlog(); }, 150);
      });
    }

    function demarrer() { brancherRecherche(); chargerTextes(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  </script>
</body>
</html>
