<script>
// ============================================================
// MODAL - FONCTIONS
// ============================================================

// Ouvrir la modale
function ouvrirModal(formType) {
  var overlay = document.getElementById('modalOverlay');
  var connexion = document.getElementById('formConnexion');
  var inscription = document.getElementById('formInscription');
  
  if (formType === 'inscription') {
    connexion.style.display = 'none';
    inscription.style.display = 'block';
  } else {
    connexion.style.display = 'block';
    inscription.style.display = 'none';
  }
  
  overlay.classList.add('visible');
}

// Fermer la modale
function fermerModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
}

// Ouvrir le formulaire d'inscription
function ouvrirInscription() {
  ouvrirModal('inscription');
}

// Ouvrir le formulaire de connexion
function ouvrirConnexion() {
  ouvrirModal('connexion');
}

// ============================================================
// CONNEXION
// ============================================================
function seConnecter() {
  var id = document.getElementById('loginId').value.trim();
  var mdp = document.getElementById('loginMdp').value.trim();
  var message = document.getElementById('loginMessage');
  
  if (!id || !mdp) {
    message.textContent = 'Veuillez remplir tous les champs.';
    message.style.display = 'block';
    return;
  }
  
  message.textContent = 'Connexion en cours...';
  message.style.display = 'block';
  
  var url = CONFIG.SCRIPT_URL + '?action=login&id=' + encodeURIComponent(id) + '&mdp=' + encodeURIComponent(mdp);
  
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        localStorage.setItem('etudiant_id', id);
        localStorage.setItem('etudiant_nom', data.id || id);
        localStorage.setItem('etudiant_niveau', data.niveau || 0);
        message.textContent = '✅ Connexion réussie !';
        message.style.color = 'green';
        setTimeout(function() {
          fermerModal();
          window.location.reload();
        }, 1000);
      } else {
        message.textContent = '❌ ' + (data.message || 'Identifiant ou mot de passe incorrect');
        message.style.color = 'red';
      }
    })
    .catch(function(error) {
      message.textContent = '❌ Erreur de connexion au serveur.';
      message.style.color = 'red';
    });
}

// ============================================================
// INSCRIPTION
// ============================================================
function sInscrire() {
  var nom = document.getElementById('registerNom').value.trim();
  var contact = document.getElementById('registerContact').value.trim();
  var niveau = document.getElementById('registerNiveau').value;
  var message = document.getElementById('registerMessage').value.trim();
  var statusMsg = document.getElementById('registerStatusMessage');
  
  // Récupérer les disciplines cochées
  var disciplines = [];
  var checkboxes = document.querySelectorAll('#registerDisciplines input[type="checkbox"]:checked');
  checkboxes.forEach(function(cb) {
    disciplines.push(cb.value);
  });
  
  if (!nom || !contact || !niveau) {
    statusMsg.textContent = 'Veuillez remplir tous les champs obligatoires.';
    statusMsg.style.display = 'block';
    statusMsg.style.color = 'red';
    return;
  }
  
  statusMsg.textContent = 'Envoi en cours...';
  statusMsg.style.display = 'block';
  statusMsg.style.color = 'black';
  
  var url = CONFIG.SCRIPT_URL + 
    '?action=registerDemande' +
    '&nom=' + encodeURIComponent(nom) +
    '&contact=' + encodeURIComponent(contact) +
    '&disciplines=' + encodeURIComponent(disciplines.join(', ')) +
    '&niveau=' + encodeURIComponent(niveau) +
    '&message=' + encodeURIComponent(message);
  
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        statusMsg.textContent = '✅ ' + data.message;
        statusMsg.style.color = 'green';
        setTimeout(function() {
          fermerModal();
          ouvrirConnexion();
        }, 2000);
      } else {
        statusMsg.textContent = '❌ ' + (data.message || 'Erreur lors de l\'inscription');
        statusMsg.style.color = 'red';
      }
    })
    .catch(function(error) {
      statusMsg.textContent = '❌ Erreur de connexion au serveur.';
      statusMsg.style.color = 'red';
    });
}

// ============================================================
// CHARGER LES NIVEAUX ET DISCIPLINES
// ============================================================
function chargerNiveaux() {
  var url = CONFIG.SCRIPT_URL + '?action=getNiveaux';
  
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success && data.niveaux) {
        var select = document.getElementById('registerNiveau');
        data.niveaux.forEach(function(n) {
          var option = document.createElement('option');
          option.value = n.valeur;
          option.textContent = n.description || 'Niveau ' + n.valeur;
          select.appendChild(option);
        });
      }
    })
    .catch(function() {
      // Fallback : niveaux par défaut
      var select = document.getElementById('registerNiveau');
      [1, 2, 3, 4, 5].forEach(function(n) {
        var option = document.createElement('option');
        option.value = n;
        option.textContent = 'Niveau ' + n;
        select.appendChild(option);
      });
    });
}

function chargerDisciplines() {
  var container = document.getElementById('registerDisciplines');
  var disciplines = ['Tafsir', 'Hadith', 'Fiqh', 'Aqida', 'Sira', 'Coran', 'Tajwid', 'Spiritualité'];
  
  disciplines.forEach(function(d) {
    var label = document.createElement('label');
    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = d;
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(' ' + d));
    container.appendChild(label);
  });
}

// ============================================================
// INITIALISATION
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  chargerNiveaux();
  chargerDisciplines();
});

// ============================================================
// TOUCHE ENTREE (fallback au cas où)
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  var loginId = document.getElementById('loginId');
  var loginMdp = document.getElementById('loginMdp');
  
  function onLoginEnter(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      seConnecter();
    }
  }
  
  if (loginId) loginId.addEventListener('keypress', onLoginEnter);
  if (loginMdp) loginMdp.addEventListener('keypress', onLoginEnter);
});
</script>
