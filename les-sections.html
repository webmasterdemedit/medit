<!-- les-sections.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Les sections - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-sections {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-sections h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-sections .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* Liste sobre, une section par ligne */
    .liste-sections {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .carte-section {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
    }

    .carte-section:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-section .section-marqueur {
      flex: 0 0 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 50%;
      box-sizing: border-box;
    }

    .carte-section .section-corps {
      flex: 1;
      min-width: 0;
    }

    .carte-section .section-titre {
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .carte-section .section-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .carte-section .section-meta .nb {
      color: var(--text);
      font-weight: 600;
    }

    .carte-section .section-fleche {
      flex: 0 0 auto;
      font-size: 18px;
      color: var(--text-muted);
      padding-left: 12px;
    }

    .vide-section {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-section .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-sections { padding: 12px 16px 30px; }
      .page-sections h1 { font-size: 22px; }
      .carte-section { padding: 14px 16px; gap: 14px; }
      .carte-section .section-marqueur { flex: 0 0 34px; height: 34px; font-size: 15px; }
      .carte-section .section-titre { font-size: 15px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-sections">

    <h1>Les sections</h1>
    <p class="sous-titre-page">Toutes les sections de la bibliothèque. Cliquez sur une section pour voir ses thèmes.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Sections :</span>
        <span class="nombre" id="totalSections">0</span>
      </div>
      <div class="stat-item">
        <span>Thèmes :</span>
        <span class="nombre" id="totalLivrets">0</span>
      </div>
      <div class="stat-item">
        <span>Textes :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des sections...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function chargerSections() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');

      DataManager.charger()
        .then(function(data) {
          afficherSections(data);
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) afficherSections(cache);
          else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('contenu').innerHTML = `
              <div class="vide-section">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    function afficherSections(data) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var themes = data.themes || [];
      var textes = data.tousLesTextes || data.textes || [];

      // Regrouper les thèmes par section (colonne A = "theme" = section)
      var sectionsMap = {};
      themes.forEach(function(l) {
        var sec = (l.theme || '').trim();
        if (!sec || !l.titre) return;
        var cle = normaliserComparaison(sec);
        if (!sectionsMap[cle]) sectionsMap[cle] = { nom: sec, livrets: 0 };
        sectionsMap[cle].livrets++;
      });

      // Compter les textes par catégorie (= titre du livret)
      var compteTextesParLivret = {};
      textes.forEach(function(t) {
        var cat = (t.categorie || '').trim();
        if (cat) compteTextesParLivret[cat] = (compteTextesParLivret[cat] || 0) + 1;
      });

      // Associer nombre de textes par section
      var sections = Object.keys(sectionsMap).map(function(cle) {
        var sec = sectionsMap[cle];
        var nbTextes = 0;
        themes.forEach(function(l) {
          if (normaliserComparaison(l.theme || '') === cle && l.titre) {
            nbTextes += compteTextesParLivret[l.titre] || 0;
          }
        });
        return { nom: sec.nom, livrets: sec.livrets, textes: nbTextes };
      });

      sections.sort(function(a, b) {
        return a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' });
      });

      var totalLivrets = 0, totalTextes = 0;
      sections.forEach(function(s) {
        totalLivrets += s.livrets;
        totalTextes  += s.textes;
      });

      document.getElementById('totalSections').textContent = sections.length;
      document.getElementById('totalLivrets').textContent = totalLivrets;
      document.getElementById('totalTextes').textContent = totalTextes;

      var conteneur = document.getElementById('contenu');

      if (sections.length === 0) {
        conteneur.innerHTML = `
          <div class="vide-section">
            <span class="icone">◈</span>
            <h2>Aucune section disponible</h2>
          </div>
        `;
        return;
      }

      var html = '<div class="liste-sections">';
      sections.forEach(function(s, i) {
        var lettre = s.nom.charAt(0).toUpperCase();
        html += `
          <a class="carte-section" href="/medit/section.html?section=${encodeURIComponent(s.nom)}">
            <div class="section-marqueur">${escapeHtml(lettre)}</div>
            <div class="section-corps">
              <div class="section-titre">${escapeHtml(s.nom)}</div>
              <div class="section-meta">
                <span><span class="nb">${s.livrets}</span> livret${s.livrets > 1 ? 's' : ''}</span>
                <span><span class="nb">${s.textes}</span> texte${s.textes > 1 ? 's' : ''}</span>
              </div>
            </div>
            <div class="section-fleche">→</div>
          </a>
        `;
      });
      html += '</div>';

      conteneur.innerHTML = html;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerSections);
    } else {
      chargerSections();
    }
  </script>

</body>
</html>
