<!-- les-thèmes.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Les Thèmes - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-themes {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-themes .sous-titre-page {
      margin-bottom: 28px;
    }

    .grille-themes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
      justify-items: stretch;
    }

    .grille-themes .carte-avec-bas {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .carte-avec-bas .carte-bas {
      margin-top: 10px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      box-sizing: border-box;
    }

    .carte-avec-bas .carte-bas .ligne-compteurs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .carte-avec-bas .carte-bas .compteur-badge {
      padding: 3px 10px;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .carte-avec-bas .carte-bas .liste-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .carte-avec-bas .carte-bas .tag {
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .phrase-progression {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      padding: 0 4px;
      line-height: 1.4;
    }

    /* Thème : image ronde + #Nom, sans cadre */
    .theme-lien {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--text);
      background: transparent; border: none; padding: 4px 0;
    }
    .theme-lien:hover .theme-nom { text-decoration: underline; }
    .theme-lien.verrouille { opacity: .45; pointer-events: none; }
    .theme-cercle {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; border: 1px solid var(--border);
    }
    .theme-nom { font-weight: 700; font-size: 18px; line-height: 1.25; }
    .theme-diese { color: #e6b400; margin-right: 2px; }
    .theme-cadenas { font-size: 14px; opacity: .7; }

    .vide-themes {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
    }

    .vide-themes .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
    }

    .vide-themes h2 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    @media (max-width: 700px) {
      .page-themes { padding: 12px 16px 30px; }
      .grille-themes {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-themes">

    <h1>Tous les thèmes</h1>
    <p class="sous-titre-page">Cliquez sur un thème pour commencer l'apprentissage.</p>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des thèmes...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    window.toutesLesReponses = {};
    window.textesData = [];
    window.themesData = {};
    window.niveauEtudiant = 0;
    window.nomEtudiant = '';

    var TYPES_EXERCICES = [
      { prefix: 'quiz:',   label: 'QCM' },
      { prefix: 'open:',   label: 'Ouverte' },
      { prefix: 'ordre:',  label: 'Ordre' },
      { prefix: 'carte:',  label: 'Carte' },
      { prefix: 'relier:', label: 'Relier' },
      { prefix: 'tt:',     label: 'Trous' },
      { prefix: 'vf:',     label: 'VF' },
      { prefix: 'copier:', label: 'Copier' }
    ];

    function compterExercices(texte) {
      var ordreBlocs = texte.ordreBlocs || [];
      var total = 0;

      if (ordreBlocs.length > 0) {
        TYPES_EXERCICES.forEach(function(type) {
          ordreBlocs.forEach(function(ob) {
            if (ob.indexOf(type.prefix) === 0) total++;
          });
        });
      } else {
        if (texte.hasQuiz)     total++;
        if (texte.hasQuestion) total++;
      }
      return total;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function estTexteValide(texteId) {
      var r = toutesLesReponses[String(texteId)];
      if (!r) return false;
      if (Array.isArray(r)) {
        for (var i = 0; i < r.length; i++) {
          if ((r[i].pourcentage || 0) >= 65) return true;
          if (r[i].valide === 'valide') return true;
        }
        return false;
      }
      if ((r.pourcentage || 0) >= 65) return true;
      return r.valide === 'valide';
    }

    // Plus de grand rectangle : image ronde (si elle existe) + #Nom du thème
    function construireCarteCouverture(t, options) {
      var cliquable = options.cliquable && !t.verrouille;
      var interieur = ''
        + (t.couverture ? '<img class="theme-cercle" src="' + escapeHtml(t.couverture) + '" alt="">' : '')
        + '<span class="theme-nom"><span class="theme-diese">#</span>' + escapeHtml(t.nom) + '</span>'
        + (cliquable ? '' : '<span class="theme-cadenas">🔒︎</span>');
      return cliquable
        ? '<a class="theme-lien" href="' + escapeHtml(options.lien) + '">' + interieur + '</a>'
        : '<div class="theme-lien verrouille">' + interieur + '</div>';
    }

    function lireThemes(liste) {
      themesData = {};
      if (liste && Array.isArray(liste)) {
        liste.forEach(function(l) {
          themesData[l.titre] = {
            theme: l.theme || '',
            sousTitre: l.sousTitre || '',
            date: l.date || '',
            preRequis: l.preRequis || '',
            auteur: l.auteur || '',
            niveau: parseInt(l.niveau) || 0,
            couverture: l.couverture || ''
          };
        });
      }
    }

    function afficherErreur(message) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
      document.getElementById('contenu').innerHTML = `
        <div class="vide-themes">
          <span class="icone">⚠</span>
          <h2>Erreur de chargement</h2>
          <p>${escapeHtml(message || 'Vérifiez votre connexion internet.')}</p>
        </div>
      `;
    }

    function chargerThemes() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      nomEtudiant = id;
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(resultats) {
        var data = resultats[0] || {};
        var tentatives = resultats[1];

        niveauEtudiant = data.niveau || 0;
        textesData = data.tousLesTextes || data.textes || [];
        lireThemes(data.themes);

        toutesLesReponses = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          if (!toutesLesReponses[k]) toutesLesReponses[k] = [];
          toutesLesReponses[k].push({
            texteId: t.texteId,
            titre: t.titre,
            bonnes: t.bonnes,
            total: t.total,
            pourcentage: t.pourcentage,
            date: t.date || '',
            valide: (t.pourcentage >= 65) ? 'valide' : 'non-valide'
          });
        });

        afficherThemes();
      }).catch(function(error) {
        console.error('Erreur chargement:', error);
        var cache = (DataManager.getCacheForce) ? DataManager.getCacheForce(id) : null;
        if (cache) {
          niveauEtudiant = cache.niveau || 0;
          textesData = cache.textes || cache.tousLesTextes || [];
          lireThemes(cache.themes);
          afficherThemes();
        } else {
          afficherErreur(String(error && error.message ? error.message : ''));
        }
      });
    }

    function afficherThemes() {
      var container = document.getElementById('contenu');
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      try {
        var textesParCategorie = {};
        textesData.forEach(function(ch) {
          var cat = (ch.categorie || '').trim();
          if (!cat) return;
          if (!textesParCategorie[cat]) textesParCategorie[cat] = [];
          textesParCategorie[cat].push(ch);
        });

        var THEMES_EXCLUS = ['cours'];
        var titresThemes = Object.keys(themesData).filter(function(titre) {
          if (THEMES_EXCLUS.indexOf(titre.trim().toLowerCase()) !== -1) return false;
          // Un thème sans aucun texte n'est pas affiché
          return (textesParCategorie[titre] || []).length > 0;
        });

        var themesCalcules = titresThemes.map(function(titre) {
          var meta = themesData[titre];
          var textesDuTheme = textesParCategorie[titre] || [];

          var niveauMin = meta.niveau || 1;
          var niveauMax = meta.niveau || 1;
          if (textesDuTheme.length > 0) {
            niveauMin = Infinity;
            niveauMax = -Infinity;
            textesDuTheme.forEach(function(ch) {
              var n = parseInt(ch.niveau) || 1;
              if (n < niveauMin) niveauMin = n;
              if (n > niveauMax) niveauMax = n;
            });
          }

          var disponible = false;
          if (textesDuTheme.length === 0) {
            disponible = true;
          } else {
            textesDuTheme.forEach(function(ch) {
              if ((parseInt(ch.niveau) || 1) <= niveauEtudiant) disponible = true;
            });
          }

          var validees = 0;
          textesDuTheme.forEach(function(ch) {
            if (estTexteValide(ch.id)) validees++;
          });
          var pourcentage = textesDuTheme.length > 0
            ? Math.round((validees / textesDuTheme.length) * 100)
            : 0;
          var restants = Math.max(0, textesDuTheme.length - validees);

          var nbExercices = 0;
          var tagsSet = {};
          textesDuTheme.forEach(function(ch) {
            nbExercices += compterExercices(ch);
            (ch.tags || []).forEach(function(tag) {
              var t = String(tag).trim();
              if (t) tagsSet[t] = true;
            });
          });
          var tagsListe = Object.keys(tagsSet).sort(function(a, b) {
            return a.localeCompare(b, 'fr', { sensitivity: 'base' });
          });

          return {
            nom: titre,
            theme: (meta.theme || '').trim(),
            niveauMin: niveauMin,
            niveauMax: niveauMax,
            textes: textesDuTheme.length,
            exercices: nbExercices,
            tags: tagsListe,
            disponible: disponible,
            verrouille: !disponible,
            pourcentage: pourcentage,
            validees: validees,
            restants: restants,
            sousTitre: meta.sousTitre || '',
            date: meta.date || '',
            auteur: meta.auteur || '',
            niveau: meta.niveau || 1,
            couverture: meta.couverture || ''
          };
        });

        themesCalcules.sort(function(a, b) {
          return a.niveauMin - b.niveauMin
            || a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' });
        });

        if (themesCalcules.length === 0) {
          container.innerHTML = `
            <div class="vide-themes">
              <span class="icone">◈</span>
              <h2>Aucun thème disponible</h2>
              <p>Aucun thème n'est configuré pour le moment.</p>
            </div>
          `;
          return;
        }

        var html = '<div class="grille-themes">';
        themesCalcules.forEach(function(theme) {
          var carteHtml = construireCarteCouverture(theme, {
            cliquable: theme.disponible,
            lien: '/medit/thème.html?cat=' + encodeURIComponent(theme.nom)
          });

          var basHtml = ''
            + '<div class="carte-bas">'
            +   '<div class="ligne-compteurs">'
            +     '<span class="compteur-badge">' + theme.textes + ' texte' + (theme.textes > 1 ? 's' : '') + '</span>'
            +     '<span class="compteur-badge">' + theme.exercices + ' exercice' + (theme.exercices > 1 ? 's' : '') + '</span>'
            +   '</div>'
            +   (theme.tags.length > 0
                  ? '<div class="liste-tags">'
                    + theme.tags.map(function(t) {
                        return '<span class="tag">#' + escapeHtml(t) + '</span>';
                      }).join('')
                    + '</div>'
                  : '')
            + '</div>';

          var phraseProgression = ''
            + '<div class="phrase-progression">'
            +   theme.pourcentage + ' % complété — ' + theme.restants + ' texte' + (theme.restants > 1 ? 's' : '') + ' restant' + (theme.restants > 1 ? 's' : '')
            + '</div>';

          html += '<div class="carte-avec-bas">' + carteHtml + basHtml + phraseProgression + '</div>';
        });
        html += '</div>';

        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        afficherErreur('Erreur d\'affichage : ' + e.message);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerThemes);
    } else {
      chargerThemes();
    }
  </script>

</body>
</html>
