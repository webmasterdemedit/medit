<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Texte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================ */
    /* PAGE TEXTE                                                    */
    /* ============================================================ */
    .page-article {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 30px 60px;
    }

    /* Bouton retour */
    .btn-retour {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* FEUILLE TEXTE : reproduction CSS de l'impression              */
    /* ============================================================ */
    .feuille-article {
      background: #ffffff;
      color: #1a1a1a;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.35;
      padding: 26px 30px 30px;
      border: 1px solid var(--border);
    }

    .feuille-article .arabe,
    .feuille-article [lang="ar"] {
      font-family: 'Janna LT Bold', 'Traditional Arabic', serif !important;
      font-size: 1.7em;
      line-height: 1;
      vertical-align: middle;
    }

    /* Bandeau titre */
    .feuille-article .bandeau-titre {
      background: #f2f2f2;
      border-radius: 3px;
      padding: 10px 14px 9px;
      margin-bottom: 8px;
    }
    .feuille-article .bandeau-titre .ligne-titre {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      text-align: left;
    }
    .feuille-article .bandeau-titre h1 {
      font-family: 'Georgia', serif;
      font-size: 16pt;
      font-weight: bold;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
    }
    .feuille-article .bandeau-titre .meta-droite {
      font-size: 9pt;
      color: #555;
      text-align: right;
      white-space: nowrap;
    }

    /* Tags */
    .feuille-article .tags-haut {
      margin-top: 4px;
      margin-bottom: 4px;
      text-align: center;
    }
    .feuille-article .tags-haut .memo-tag {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 9.5pt;
      color: #444;
      font-style: normal;
    }

    /* Vocabulaire */
    .feuille-article .vocab-haut {
      margin-top: 3px;
      margin-bottom: 8px;
      text-align: center;
    }
    .feuille-article .vocab-haut .titre-memo {
      display: inline;
      font-weight: 600;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-right: 6px;
    }
    .feuille-article .vocab-haut .memo-mot {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #faf8f4;
      border: 0.5px solid #bbb;
      border-radius: 10px;
      font-size: 9pt;
      color: #3a2e22;
      line-height: 1.35;
    }

    /* Slides */
    .feuille-article .slides-zone {
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .feuille-article .slide {
      margin-bottom: 8px;
    }
    .feuille-article .slide p {
      font-size: 14.3pt;
      margin-bottom: 4px;
      text-align: justify;
      text-indent: 1.2em;
    }
    .feuille-article .slide p em {
      font-style: italic;
    }

    /* Sources en marge */
    .feuille-article .slide p .source-marge {
      float: right;
      display: inline-block;
      margin: 6px 0 6px 16px;
      padding: 4px 0 0 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 12pt;
      font-weight: 700;
      font-style: normal;
      color: #333;
      text-align: right;
      max-width: 23%;
      line-height: 1.2;
      text-indent: 0;
      white-space: normal;
      vertical-align: top;
    }

    /* Images */
    .feuille-article .slide::after {
      content: "";
      display: table;
      clear: both;
    }
    .feuille-article .print-img {
      display: block;
      height: auto;
      border: none;
      margin: 10px 0;
    }
    .feuille-article .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-article .print-img-gauche { float: left; margin: 6px 14px 8px 0; }
    .feuille-article .print-img-droite { float: right; margin: 6px 0 8px 14px; }
    .feuille-article .print-img-petit  { max-width: 150px; }
    .feuille-article .print-img-moyen  { max-width: 220px; }
    .feuille-article .print-img-grand  { max-width: 320px; }

    .feuille-article .img-manquante {
      display: block;
      padding: 8px;
      border: 1px dashed #999;
      color: #666;
      font-size: 9pt;
      text-align: center;
      margin: 8px 0;
    }

    /* Bloc "À retenir" */
    .feuille-article .zone-memo {
      margin-top: 20px;
      padding: 10px 14px;
      background: #f7f7f7;
      border: 0.5px solid #ccc;
      border-left: 3px solid #999;
      border-radius: 3px;
    }
    .feuille-article .zone-memo .titre-memo {
      font-weight: 600;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 6px;
    }
    .feuille-article .zone-memo .titre-memo::before {
      content: "✦ ";
      color: #999;
      margin-right: 2px;
    }
    .feuille-article .zone-memo .memo-liste {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .feuille-article .zone-memo .memo-liste li {
      font-size: 11pt;
      margin-bottom: 3px;
      padding-left: 13px;
      position: relative;
      line-height: 1.4;
    }
    .feuille-article .zone-memo .memo-liste li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #999;
      font-size: 6pt;
      top: 5px;
    }

    /* Bouton imprimer en bas */
    .pied-article {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .pied-article .btn-imprimer {
      display: inline-block;
      padding: 8px 20px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .pied-article .btn-imprimer:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* Loader / erreur */
    .loader { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide-article {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .vide-article .icone {
      font-size: 40px; display: block;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .vide-article h2 { font-size: 20px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
    .vide-article p { color: var(--text-secondary); font-size: 14px; }

    /* Devise */
    .devise {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .page-article { padding: 12px 16px 40px; }
      .feuille-article { padding: 20px 18px; font-size: 10pt; }
      .feuille-article .bandeau-titre h1 { font-size: 13pt; }
      .feuille-article .slide p { font-size: 12pt; }
      .feuille-article .print-img-moyen,
      .feuille-article .print-img-grand { max-width: 100%; }
    }
  </style>

    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-article">

    <a href="/medit/textes.html" class="btn-retour">← Retour aux textes</a>

    <div id="articleContainer">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement du texte...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var chapitreActuel = null;
    var chapitresData = [];
    var imagesLivret = {};

    // ============================================================
    // HELPERS (copiés d'impression.js, sans le toucher)
    // ============================================================

    // --- Rendu des sources [xxx] ---
    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;

      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();

      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();

      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') {
          idxDernierePonctuation = i;
          break;
        }
      }

      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') {
            idxDebutPhrase = j + 1;
            break;
          }
        }
      }

      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);

      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';

      return avant + spanSource + phrase;
    }

    // --- Rendu des citations "..." → « ... » ---
    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    // ============================================================
    // TROUVER UN CHAPITRE (même méthode qu'impression)
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // CONSTRUCTION DU HTML (même logique qu'impression)
    // MAIS : on garde UNIQUEMENT les slides (pas les exercices)
    // ============================================================
    function construireHtmlArticle(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};

      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Article vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      // --- Étape 1 : extraction des slides (on ignore les exercices) ---
      var slidesArray = [];

      parts.forEach(function(part) {
        part = part.trim();
        if (!part) return;

        // Ignorer tous les blocs d'exercices
        if (part.startsWith('q:')) return;
        if (part.startsWith('qs:')) return;
        if (part.startsWith('o:')) return;
        if (part.startsWith('r:')) return;
        if (part.startsWith('l:')) return;
        if (part.startsWith('tt:')) return;
        if (part.startsWith('vf:')) return;
        if (part.startsWith('c:')) return;

        // Sinon → slide
        var cleanText = part.replace(/\r\n/g, '\n').trim();
        if (cleanText) {
          var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
          subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
        }
      });

      // --- Étape 2 : on garde l'ordre des slides via ordreBlocs ---
      var blocsSlide = [];
      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;
          if (type === 'slide' && slidesArray[idx] !== undefined) {
            blocsSlide.push(slidesArray[idx]);
          }
        });
      }
      // Fallback si ordreBlocs vide
      if (blocsSlide.length === 0) {
        blocsSlide = slidesArray;
      }

      // --- Étape 3 : nettoyage tags/vocab/à retenir ---
      var aRetenirClean = (chapitre.aRetenir || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      // --- Étape 4 : construction HTML ---
      var html = '';

      // Bandeau titre
      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + (chapitre.titre || 'Lecture') + '</h1>';
      html += '    <div class="meta-droite">' + (chapitre.categorie ? chapitre.categorie + ' — ' : '') + 'Niveau ' + (chapitre.niveau || 0) + '</div>';
      html += '  </div>';
      html += '</div>';

      // Tags
      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + t + '</span>'; });
        html += '</div>';
      }

      // Vocabulaire
      if (vocabClean.length > 0) {
        html += '<div class="vocab-haut"><span class="titre-memo">Vocabulaire</span>';
        vocabClean.forEach(function(m) { html += '<span class="memo-mot">' + m + '</span>'; });
        html += '</div>';
      }

      // Slides
      html += '<div class="slides-zone">';
      blocsSlide.forEach(function(slideData) {
        html += '<div class="slide">';
        var lignesSlide = slideData.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + nomImg + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + nomImg + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();

        html += '</div>';
      });
      html += '</div>';

      // À retenir
      if (aRetenirClean.length > 0) {
        html += '<div class="zone-memo">';
        html += '<div class="memo-bloc">';
        html += '<div class="titre-memo">À retenir</div>';
        html += '<ul class="memo-liste">';
        aRetenirClean.forEach(function(phrase) { html += '<li>' + phrase + '</li>'; });
        html += '</ul></div>';
        html += '</div>';
      }

      return html;
    }

    // ============================================================
    // Enveloppe les mots arabes dans <span class="arabe">
    // (comme le fait impression.js dans l'iframe)
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );

      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) {
          noeuds.push(n);
        }
      }

      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;

        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);

        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });

        parent.replaceChild(frag, texteNode);
      });
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerArticle() {
      var params = new URLSearchParams(window.location.search);
      var chapitreId = params.get('id');

      if (!chapitreId) { afficherErreur('Aucun texte spécifié.'); return; }

      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          chapitresData = data.tousLesChapitres || data.chapitres || [];
          chapitreActuel = trouverChapitre(chapitreId, chapitresData);

          if (!chapitreActuel) {
            afficherErreur('Texte introuvable.');
            return;
          }

          // Charger les images puis afficher
          if (chapitreActuel.categorie && typeof chargerImagesLivret === 'function') {
            chargerImagesLivret(chapitreActuel.categorie)
              .then(function(images) {
                imagesLivret = images || {};
                afficherArticle(chapitreActuel);
              })
              .catch(function() {
                imagesLivret = {};
                afficherArticle(chapitreActuel);
              });
          } else {
            afficherArticle(chapitreActuel);
          }
        })
        .catch(function(error) {
          console.error('❌ Erreur:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];
            chapitreActuel = trouverChapitre(chapitreId, chapitresData);
            if (chapitreActuel) {
              afficherArticle(chapitreActuel);
              return;
            }
          }
          afficherErreur('Erreur de chargement.');
        });
    }

    // ============================================================
    // AFFICHER LE TEXTE
    // ============================================================
    function afficherArticle(chapitre) {
      var container = document.getElementById('articleContainer');

      var contenuHtml = construireHtmlArticle(chapitre, imagesLivret);

      var html = '<div class="feuille-article">' + contenuHtml + '</div>';
      html += `
        <div class="pied-article">
          <button class="btn-imprimer" onclick="imprimerChapitre('${chapitre.id}', '${chapitre.titre.replace(/'/g, "\\'")}', chapitresData)">
            🖨 Imprimer le texte avec les questions
          </button>
        </div>
      `;

      container.innerHTML = html;

      // Transformer les mots arabes en <span class="arabe">
      arabiserDans(container);

      document.title = chapitre.titre + ' - Qiraat';
    }

    // ============================================================
    // ERREUR
    // ============================================================
    function afficherErreur(message) {
      document.getElementById('articleContainer').innerHTML = `
        <div class="vide-article">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux textes.</p>
          <a href="/medit/textes.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux textes</a>
        </div>
      `;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerArticle);
    } else {
      chargerArticle();
    }
  </script>

</body>
</html>
