  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })

        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    var texteActuel = null;
    var textesData = [];
    var imagesTheme = {};
    var themesData = {};

    var reponsesTexte = {
      quiz: {}, vf: {}, tt: {}, cartes: {}, relier: {}, ordre: {}, copier: {},
      questionOuverte: ''
    };

    var envoiEffectue = false;
    var envoiQuestionsEffectue = false;

    var exoNumParType = {
      quiz: {}, vf: {}, tt: {}, relier: {}, carte: {}, ordre: {}, copier: {}
    };

    var questionsOuvertes = [];

    function echapperHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      return avant + '<span class="source-marge">' + contenuSource + '</span>' + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateMoisAnnee(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        var mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        return mois[d.getMonth()] + ' ' + d.getFullYear();
      } catch(e) { return ''; }
    }

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function trouverTexte(texteId, textesDataParam) {
      if (textesDataParam && textesDataParam.length > 0) {
        for (var i = 0; i < textesDataParam.length; i++) {
          if (String(textesDataParam[i].id) === String(texteId)) return textesDataParam[i];
        }
      }
      var tous = DataManager.getTousLesTextes();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(texteId)) return tous[j];
      }
      return null;
    }

    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A','B','C','D','E','F'];
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
          currentQuiz = { question: ligne.replace(/^q:\s*/i, '').trim() || 'Question', reponses: [] };
        } else if (currentQuiz) {
          var isCorrect = false;
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) { isCorrect = true; texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim(); }
          else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) { texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim(); }
          if (texteRep) currentQuiz.reponses.push({ texte: texteRep || 'Réponse', lettre: lettres[currentQuiz.reponses.length] || '?', correcte: isCorrect });
        }
      }
      if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      var consigne = 'Remettre dans l\'ordre';
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) elements.push(match[2]);
        else if (elements.length === 0 && ligne.length > 0) consigne = ligne.replace(/^o:\s*/i, '').trim() || consigne;
      }
      return { elements: elements, consigne: consigne };
    }

    function parserCartesPourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var cartes = [];
      var current = null;
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          if (current) cartes.push(current);
          current = { recto: l.replace(/^r:\s*/i, '').trim(), verso: '' };
        } else if (l.toLowerCase().startsWith('v:') && current) {
          current.verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (current) cartes.push(current);
      return cartes;
    }

    function parserRelierPourImpression(relierTexte) {
      var lignes = relierTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      if (lignes.length === 0) return null;
      var consigne = lignes[0].replace(/^l:\s*/i, '').trim() || 'Relie les éléments';
      var paires = [];
      for (var i = 1; i < lignes.length; i++) {
        var idx = lignes[i].indexOf('-');
        if (idx === -1) continue;
        var gauche = lignes[i].substring(0, idx).trim();
        var droite = lignes[i].substring(idx + 1).trim();
        if (gauche && droite) paires.push({ gauche: gauche, droite: droite });
      }
      if (paires.length === 0) return null;
      var compteParDroite = {};
      paires.forEach(function(p) { compteParDroite[p.droite] = (compteParDroite[p.droite] || 0) + 1; });
      var droitesUniques = [];
      var dejaVues = {};
      paires.forEach(function(p) {
        if (!dejaVues[p.droite]) {
          dejaVues[p.droite] = true;
          droitesUniques.push({ droite: p.droite, partagee: compteParDroite[p.droite] > 1 });
        }
      });
      for (var j = droitesUniques.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = droitesUniques[j]; droitesUniques[j] = droitesUniques[k]; droitesUniques[k] = tmp;
      }
      return { consigne: consigne, paires: paires, droitesMelangees: droitesUniques };
    }

    function parserTextesTrousPourImpression(ttTexte) {
      var lignes = ttTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var resultats = [];
      lignes.forEach(function(ligne) {
        if (!/^tt:/i.test(ligne)) return;
        var contenu = ligne.replace(/^tt:\s*/i, '').trim();
        var match = contenu.match(/\/([^\/]+)\//);
        if (!match) return;
        var mot = match[1].trim();
        var idx = contenu.indexOf('/' + mot + '/');
        var avant = contenu.substring(0, idx).trim();
        var apres = contenu.substring(idx + mot.length + 2).trim();
        resultats.push({ avant: avant, mot: mot, apres: apres });
      });
      return resultats;
    }

    function parserVraiFauxPourImpression(vfTexte) {
      var lignes = vfTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var questions = [];
      lignes.forEach(function(ligne) {
        if (!/^vf:/i.test(ligne)) return;
        var contenu = ligne.replace(/^vf:\s*/i, '').trim();
        var match = contenu.match(/\(([vf])\)\s*$/i);
        if (!match) return;
        var reponse = match[1].toLowerCase();
        var question = contenu.replace(/\s*\([vf]\)\s*$/i, '').trim();
        if (question === '') return;
        questions.push({ question: question, reponse: reponse });
      });
      return questions;
    }

    function parserCopierPourImpression(copierTexte) {
      if (!copierTexte) return [];
      var lignes = copierTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var blocs = [];
      lignes.forEach(function(ligne) {
        var contenu = ligne.replace(/^c:\s*/i, '').trim();
        if (!contenu) return;
        var mots = contenu.split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m !== ''; });
        if (mots.length > 0) blocs.push({ mots: mots });
      });
      return blocs;
    }

    function construireExercicesPourFeuille(blocsOrdonnes) {
      var html = '';
      var exoNum = 0;
      var hasExercice = false;
      var quizCounter = 0;
      var ttCounter = 0;
      var carteCounter = 0;
      var vfCounter = 0;
      var relierCounter = 0;
      var ordreCounter = 0;
      var copierCounter = 0;

      function typeLogique(t) { if (t === 'carte') return 'open'; return t; }

      var consignesBase = {
        quiz:   { sing: 'Cochez la bonne réponse :',  plur: 'Cochez la bonne réponse :' },
        open:   { sing: 'Répondez à la question :',   plur: 'Répondez aux questions :' },
        tt:     { sing: 'Complétez la phrase :',      plur: 'Complétez les phrases :' },
        vf:     { sing: 'Cochez Vrai ou Faux :',      plur: 'Cochez Vrai ou Faux :' },
        ordre:  { sing: 'Remettez dans l\'ordre :',   plur: 'Remettez dans l\'ordre :' },
        relier: { sing: 'Reliez les éléments :',      plur: 'Reliez les éléments :' },
        copier: { sing: 'Recopiez :',                 plur: 'Recopiez :' }
      };

      var iGroupe = 0;
      while (iGroupe < blocsOrdonnes.length) {
        var blocCourant = blocsOrdonnes[iGroupe];
        var typeCourant = typeLogique(blocCourant.type);
        if (typeCourant === 'slide') { iGroupe++; continue; }
        var nbConsecutifs = 1;
        var jGroupe = iGroupe + 1;
        while (jGroupe < blocsOrdonnes.length && typeLogique(blocsOrdonnes[jGroupe].type) === typeCourant) { nbConsecutifs++; jGroupe++; }
        if (typeCourant === 'vf') nbConsecutifs = (nbConsecutifs - 1) + blocCourant.data.length;
        var base = consignesBase[typeCourant];
        if (base) {
          var consigneFinale = (nbConsecutifs > 1) ? base.plur : base.sing;
          blocCourant._consigne = consigneFinale;
          for (var kGroupe = iGroupe + 1; kGroupe < jGroupe; kGroupe++) blocsOrdonnes[kGroupe]._consigne = '';
        }
        iGroupe = jGroupe;
      }

      function afficherConsigne(bloc) { if (bloc._consigne) html += '<div class="consigne-exo">' + bloc._consigne + '</div>'; }

      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type === 'slide') return;

        if (bloc.type === 'copier') {
          hasExercice = true;
          exoNum++;
          var copierIdx = copierCounter++;
          exoNumParType.copier[copierIdx] = exoNum;
          var mots = bloc.data.mots;
          html += '<div class="exo" data-copier-idx="' + copierIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">';
          html += '<div class="bloc-copier">';
          html += '<div class="copier-mots">';
          for (var cm = 0; cm < mots.length; cm++) html += '<span class="copier-mot">' + mots[cm] + '</span>';
          html += '</div>';
          html += '<div class="copier-ligne-pointillee"></div>';
          html += '</div>';
          html += '</span>';
          html += '</div>';
          html += '<div class="copier-actions">';
          html += '<button class="copier-btn" data-copier-idx="' + copierIdx + '" onclick="marquerCopie(this)">J\'ai recopié</button>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'quiz') {
          hasExercice = true;
          exoNum++;
          var q = bloc.data;
          var quizIdx = quizCounter++;
          exoNumParType.quiz[quizIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + q.question + '</span>';
          html += '</div>';
          html += '<div class="quiz-reponses" data-quiz-idx="' + quizIdx + '">';
          q.reponses.forEach(function(rep, ri) {
            html += '<span class="quiz-rep interactive" data-quiz-idx="' + quizIdx + '" data-rep-idx="' + ri + '" data-correct="' + (rep.correcte ? '1' : '0') + '" onclick="repondreQuiz(this)">';
            html += '<span class="quiz-case"></span> ' + rep.lettre + '. ' + rep.texte;
            html += '</span>';
          });
          html += '</div>';
          html += '<div class="quiz-feedback-exo" id="quizFeedbackExo-' + quizIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'open') {
          hasExercice = true;
          exoNum++;
          questionsOuvertes.push({ texte: bloc.data, reponse: '' });
          return;
        }

        if (bloc.type === 'tt') {
          hasExercice = true;
          exoNum++;
          var tt = bloc.data;
          var ttIdx = ttCounter++;
          exoNumParType.tt[ttIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="tt-phrase-print">';
          if (tt.avant) html += tt.avant + ' ';
          html += '<input type="text" class="tt-input" id="ttInput-' + ttIdx + '" data-mot="' + echapperHtml(tt.mot) + '" onkeydown="if(event.key===\'Enter\'){validerTT(' + ttIdx + ');return false;}" onblur="validerTT(' + ttIdx + ')">';
          if (tt.apres) html += ' ' + tt.apres;
          html += '</span>';
          html += '</div>';
          html += '<div class="tt-feedback" id="ttFeedback-' + ttIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'vf') {
          hasExercice = true;
          bloc.data.forEach(function(item, idxVf) {
            exoNum++;
            var vfIdx = vfCounter++;
            exoNumParType.vf[vfIdx] = exoNum;
            html += '<div class="exo">';
            if (idxVf === 0) afficherConsigne(bloc);
            html += '<div class="exo-ligne vf-ligne">';
            html += '<span class="exo-num-inline">' + exoNum + '</span>';
            html += '<span class="exo-texte-vf">' + item.question + '</span>';
            html += '<span class="vf-cases">';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="v" data-correct="' + (item.reponse === 'v' ? '1' : '0') + '" onclick="repondreVF(this)">VRAI</button>';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="f" data-correct="' + (item.reponse === 'f' ? '1' : '0') + '" onclick="repondreVF(this)">FAUX</button>';
            html += '</span>';
            html += '</div>';
            html += '<div class="vf-feedback" id="vfFeedback-' + vfIdx + '"></div>';
            html += '</div>';
          });
          return;
        }

        if (bloc.type === 'ordre') {
          hasExercice = true;
          var ordreData = bloc.data;
          var items = ordreData.elements || [];
          var consigne = ordreData.consigne || 'Remettez dans l\'ordre';
          var itemsMelanges = items.slice();
          for (var m = itemsMelanges.length - 1; m > 0; m--) {
            var k = Math.floor(Math.random() * (m + 1));
            var tmp = itemsMelanges[m]; itemsMelanges[m] = itemsMelanges[k]; itemsMelanges[k] = tmp;
          }
          exoNum++;
          var ordreIdx = ordreCounter++;
          exoNumParType.ordre[ordreIdx] = exoNum;

          html += '<div class="exo ordre-exo" data-ordre-idx="' + ordreIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + consigne + '</span>';
          html += '</div>';
          html += '<div class="ordre-grille" id="ordreGrille-' + ordreIdx + '" data-ordre-idx="' + ordreIdx + '">';
          itemsMelanges.forEach(function(item, i) {
            html += '<div class="ordre-item" draggable="true" data-ordre-idx="' + ordreIdx + '" data-original="' + i + '">';
            html += '<span class="ordre-grip">⋮⋮</span>';
            html += '<span class="ordre-num">' + (i + 1) + '</span>';
            html += '<span class="ordre-texte">' + item + '</span>';
            html += '</div>';
          });
          html += '</div>';
          html += '<div class="ordre-actions">';
          html += '<button class="ordre-btn-valider" id="ordreBtnValider-' + ordreIdx + '" onclick="validerOrdre(' + ordreIdx + ')">Valider l\'ordre</button>';
          html += '</div>';
          html += '<div class="ordre-resultat" id="ordreResultat-' + ordreIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'carte') {
          hasExercice = true;
          exoNum++;
          var c = bloc.data;
          var carteIdx = carteCounter++;
          exoNumParType.carte[carteIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + c.recto + '</span>';
          html += '</div>';
          html += '<div class="carte-actions">';
          html += '<button class="carte-btn-voir" data-carte-idx="' + carteIdx + '" onclick="voirCarteReponse(this)">Voir la réponse</button>';
          html += '</div>';
          html += '<div class="carte-reponse-cachee" id="carteRep-' + carteIdx + '">' + echapperHtml(c.verso) + '</div>';
          html += '<div class="carte-choix" id="carteChoix-' + carteIdx + '">';
          html += '<button class="trouve" data-carte-idx="' + carteIdx + '" data-choix="trouve" onclick="carteTrouvePasTrouve(this)">✓ J\'ai trouvé</button>';
          html += '<button class="pas-trouve" data-carte-idx="' + carteIdx + '" data-choix="pas-trouve" onclick="carteTrouvePasTrouve(this)">✗ Pas trouvé</button>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'relier') {
          hasExercice = true;
          var relierData = bloc.data;
          var relierIdx = relierCounter++;
          exoNum++;
          exoNumParType.relier[relierIdx] = exoNum;
          var paires = relierData.paires || [];
          var droitesMelangees = relierData.droitesMelangees || [];
          html += '<div class="exo relier-exo" data-relier-idx="' + relierIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + relierData.consigne + '</span>';
          html += '</div>';
          html += '<div class="relier-zone" id="relierZone-' + relierIdx + '">';
          html += '<div class="relier-grid">';
          html += '<div class="relier-colonne gauche">';
          paires.forEach(function(p, i) {
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="gauche" data-idx="' + i + '" onclick="selectionnerRelier(' + relierIdx + ', \'gauche\', ' + i + ')">';
            html += '<span class="texte">' + p.gauche + '</span>';
            html += '<span class="point"></span>';
            html += '</div>';
          });
          html += '</div>';
          html += '<div class="relier-colonne droite">';
          droitesMelangees.forEach(function(d, i) {
            var classePoint = d.partagee ? 'point point-partage' : 'point';
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="droite" data-idx="' + i + '" data-droite-texte="' + echapperHtml(d.droite) + '" onclick="selectionnerRelier(' + relierIdx + ', \'droite\', ' + i + ')">';
            html += '<span class="' + classePoint + '"></span>';
            html += '<span class="texte">' + d.droite + '</span>';
            html += '</div>';
          });
          html += '</div>';
          html += '</div>';
          html += '</div>';
          html += '<div class="relier-resultat" id="relierResultat-' + relierIdx + '"></div>';
          html += '</div>';
          return;
        }
      });

      if (!hasExercice) return '';

      return '<div class="exercices-zone">' +
               '<div class="titre-exercices">QUIZ</div>' +
               html +
             '</div>';
    }

    function repondreQuiz(el) {
      var quizIdx = el.getAttribute('data-quiz-idx');
      var repIdx = el.getAttribute('data-rep-idx');
      var correct = el.getAttribute('data-correct') === '1';
      if (reponsesTexte.quiz[quizIdx]) return;
      reponsesTexte.quiz[quizIdx] = { choix: repIdx, correct: correct };
      var parent = el.parentElement;
      var reps = parent.querySelectorAll('.quiz-rep');
      reps.forEach(function(r) { r.classList.remove('interactive'); r.style.pointerEvents = 'none'; });
      el.classList.add(correct ? 'correct' : 'incorrect');
      var feedback = document.getElementById('quizFeedbackExo-' + quizIdx);
      if (feedback) {
        if (correct) feedback.textContent = 'Bonne réponse.';
        else {
          var bonne = parent.querySelector('.quiz-rep[data-correct="1"]');
          var texteBonne = bonne ? bonne.textContent.trim() : '';
          feedback.textContent = 'La bonne réponse était : ' + texteBonne;
          if (bonne) bonne.classList.add('correct');
        }
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    function repondreVF(btn) {
      var vfIdx = btn.getAttribute('data-vf-idx');
      var choix = btn.getAttribute('data-choix');
      var correct = btn.getAttribute('data-correct') === '1';
      if (reponsesTexte.vf[vfIdx]) return;
      reponsesTexte.vf[vfIdx] = { choix: choix, correct: correct };
      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('.vf-btn');
      boutons.forEach(function(b) { b.disabled = true; });
      btn.classList.add(correct ? 'vf-ok' : 'vf-ko');
      if (!correct) {
        boutons.forEach(function(b) { if (b.getAttribute('data-correct') === '1') b.classList.add('vf-ok'); });
      }
      var feedback = document.getElementById('vfFeedback-' + vfIdx);
      if (feedback) feedback.textContent = correct ? 'Correct.' : 'Incorrect.';
      majNoteGlobale();
      verifierQuizTermine();
    }

    function validerTT(ttIdx) {
      var input = document.getElementById('ttInput-' + ttIdx);
      if (!input || reponsesTexte.tt[ttIdx]) return;
      var saisi = input.value.trim();
      if (saisi === '') return;
      var motAttendu = input.getAttribute('data-mot') || '';
      var correct = normaliserComparaison(saisi) === normaliserComparaison(motAttendu);
      reponsesTexte.tt[ttIdx] = { saisi: saisi, correct: correct };
      input.classList.add(correct ? 'tt-ok' : 'tt-ko');
      input.disabled = true;
      var feedback = document.getElementById('ttFeedback-' + ttIdx);
      if (feedback) feedback.textContent = correct ? 'Bonne réponse.' : 'La bonne réponse était : « ' + motAttendu + ' »';
      majNoteGlobale();
      verifierQuizTermine();
    }

    function voirCarteReponse(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var rep = document.getElementById('carteRep-' + carteIdx);
      var choix = document.getElementById('carteChoix-' + carteIdx);
      if (rep) rep.classList.add('visible');
      if (choix) choix.classList.add('visible');
      btn.style.display = 'none';
    }

    function carteTrouvePasTrouve(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var choix = btn.getAttribute('data-choix');
      if (reponsesTexte.cartes[carteIdx] !== undefined) return;
      reponsesTexte.cartes[carteIdx] = (choix === 'trouve');
      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('button');
      boutons.forEach(function(b) { b.disabled = true; });
      btn.classList.add('actif');
      majNoteGlobale();
      verifierQuizTermine();
    }

    function marquerCopie(btn) {
      var copierIdx = btn.getAttribute('data-copier-idx');
      if (reponsesTexte.copier[copierIdx] !== undefined) return;
      reponsesTexte.copier[copierIdx] = true;
      btn.classList.add('actif');
      btn.disabled = true;
      btn.textContent = '✓ Recopié';
      majNoteGlobale();
      verifierQuizTermine();
    }

    var relierState = {};

    function initRelierState(relierIdx) {
      if (!relierState[relierIdx]) relierState[relierIdx] = { associations: {}, selection: null, mapPaires: null };
      return relierState[relierIdx];
    }

    function setRelierPaires(relierIdx, mapPaires) {
      var st = initRelierState(relierIdx);
      st.mapPaires = mapPaires;
    }

    function selectionnerRelier(relierIdx, cote, idx) {
      var st = initRelierState(relierIdx);
      if (st.valide) return;
      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;
      var item = exoEl.querySelector('.relier-item[data-cote="' + cote + '"][data-idx="' + idx + '"]');
      if (!item) return;
      if (item.classList.contains('associe')) return;
      var sel = st.selection;
      if (!sel) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      if (sel.cote === cote) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      var gaucheIdx = sel.cote === 'gauche' ? sel.idx : idx;
      var droiteIdx = sel.cote === 'droite' ? sel.idx : idx;
      var droiteEl = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + droiteIdx + '"]');
      if (droiteEl && droiteEl.classList.contains('associe')) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      var gaucheEl = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gaucheIdx + '"]');
      st.associations[gaucheIdx] = droiteIdx;
      if (gaucheEl) { gaucheEl.classList.remove('selectionne'); gaucheEl.classList.add('associe'); }
      if (droiteEl) { droiteEl.classList.remove('selectionne'); droiteEl.classList.add('associe'); }
      st.selection = null;
      var totalPaires = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]').length;
      var nbAssociees = Object.keys(st.associations).length;
      if (nbAssociees >= totalPaires) validerRelier(relierIdx);
    }

    function validerRelier(relierIdx) {
      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;
      var st = initRelierState(relierIdx);
      var mapPaires = st.mapPaires;
      if (!mapPaires) return;
      var itemsGauche = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]');
      var total = itemsGauche.length;
      var bonnes = 0;
      exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });
      for (var gIdx in st.associations) {
        var dIdx = st.associations[gIdx];
        var texteGauche = itemsGauche[parseInt(gIdx)].querySelector('.texte').textContent.trim();
        var itemDroite = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
        var texteDroite = itemDroite ? itemDroite.getAttribute('data-droite-texte') : '';
        var bonne = (mapPaires[texteGauche] === texteDroite);
        if (bonne) bonnes++;
        else {
          var elG = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gIdx + '"]');
          var elD = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
          if (elG) elG.classList.add('erreur');
          if (elD) elD.classList.add('erreur');
        }
      }
      var resultat = document.getElementById('relierResultat-' + relierIdx);
      var correct = (bonnes === total);
      reponsesTexte.relier[relierIdx] = { valide: correct, bonnes: bonnes, total: total };
      if (correct) {
        st.valide = true;
        if (resultat) resultat.textContent = 'Toutes les associations sont correctes.';
      } else {
        if (resultat) resultat.textContent = bonnes + '/' + total + ' associations correctes. Réessayez.';
        setTimeout(function() {
          exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });
          st.associations = {};
          st.selection = null;
          exoEl.querySelectorAll('.relier-item.associe, .relier-item.selectionne').forEach(function(el) { el.classList.remove('associe', 'selectionne'); });
          if (resultat) resultat.textContent = '';
        }, 1500);
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    var ordreState = {};

    function initOrdreState(ordreIdx) {
      if (!ordreState[ordreIdx]) ordreState[ordreIdx] = { valide: false, ordreInitial: null };
      return ordreState[ordreIdx];
    }

    function initDragAndDropOrdre() {
      var grilles = document.querySelectorAll('.ordre-grille');
      grilles.forEach(function(grille) {
        var ordreIdx = grille.getAttribute('data-ordre-idx');
        var st = initOrdreState(ordreIdx);
        var items = grille.querySelectorAll('.ordre-item');
        var ordre = [];
        items.forEach(function(it) { ordre.push(it.querySelector('.ordre-texte').textContent.trim()); });
        st.ordreInitial = ordre;

        items.forEach(function(item) {
          item.addEventListener('dragstart', function(e) {
            if (st.valide) { e.preventDefault(); return; }
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
          });
          item.addEventListener('dragend', function() {
            item.classList.remove('dragging');
            grille.querySelectorAll('.ordre-item').forEach(function(el) { el.classList.remove('drag-over'); });
          });
          item.addEventListener('dragover', function(e) {
            e.preventDefault();
            if (st.valide) return;
            e.dataTransfer.dropEffect = 'move';
          });
          item.addEventListener('dragenter', function(e) {
            e.preventDefault();
            if (st.valide) return;
            if (!item.classList.contains('dragging')) item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', function() {
            item.classList.remove('drag-over');
          });
          item.addEventListener('drop', function(e) {
            e.preventDefault();
            if (st.valide) return;
            item.classList.remove('drag-over');
            var dragging = grille.querySelector('.ordre-item.dragging');
            if (!dragging || dragging === item) return;
            var allItems = Array.from(grille.querySelectorAll('.ordre-item'));
            var dragIdx = allItems.indexOf(dragging);
            var dropIdx = allItems.indexOf(item);
            if (dragIdx < dropIdx) grille.insertBefore(dragging, item.nextSibling);
            else grille.insertBefore(dragging, item);
            renumOrdre(grille);
            var res = document.getElementById('ordreResultat-' + ordreIdx);
            if (res) res.textContent = '';
          });
        });
      });
    }

    function renumOrdre(grille) {
      var items = grille.querySelectorAll('.ordre-item');
      items.forEach(function(el, idx) {
        var num = el.querySelector('.ordre-num');
        if (num) num.textContent = (idx + 1);
      });
    }

    function validerOrdre(ordreIdx) {
      var grille = document.getElementById('ordreGrille-' + ordreIdx);
      if (!grille) return;
      var st = initOrdreState(ordreIdx);
      if (st.valide) return;

      var items = grille.querySelectorAll('.ordre-item');
      var ordreActuel = [];
      items.forEach(function(it) { ordreActuel.push(it.querySelector('.ordre-texte').textContent.trim()); });

      var ordreCorrect = [];
      var itemsAll = grille.querySelectorAll('.ordre-item');
      var positionsOriginales = [];
      itemsAll.forEach(function(it) {
        positionsOriginales.push({ texte: it.querySelector('.ordre-texte').textContent.trim(), original: parseInt(it.getAttribute('data-original')) });
      });
      positionsOriginales.sort(function(a, b) { return a.original - b.original; });
      positionsOriginales.forEach(function(p) { ordreCorrect.push(p.texte); });

      var bonnes = 0;
      for (var i = 0; i < ordreActuel.length; i++) {
        if (ordreActuel[i] === ordreCorrect[i]) bonnes++;
      }
      var correct = (bonnes === ordreActuel.length);
      var resultat = document.getElementById('ordreResultat-' + ordreIdx);
      var btnValider = document.getElementById('ordreBtnValider-' + ordreIdx);

      reponsesTexte.ordre[ordreIdx] = { valide: correct, bonnes: bonnes, total: ordreActuel.length };

      if (correct) {
        st.valide = true;
        if (resultat) resultat.textContent = 'Tous les éléments sont bien placés.';
        if (btnValider) btnValider.disabled = true;
        grille.querySelectorAll('.ordre-item').forEach(function(it) { it.setAttribute('draggable', 'false'); it.style.cursor = 'default'; });
      } else {
        if (resultat) resultat.textContent = bonnes + '/' + ordreActuel.length + ' bien placés. Réessayez.';
        setTimeout(function() {
          if (resultat) resultat.textContent = '';
        }, 1500);
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    function calculerNote() {
      var note = {
        quiz:   { bonnes: 0, total: Object.keys(reponsesTexte.quiz).length },
        vf:     { bonnes: 0, total: Object.keys(reponsesTexte.vf).length },
        tt:     { bonnes: 0, total: Object.keys(reponsesTexte.tt).length },
        cartes: { bonnes: 0, total: Object.keys(reponsesTexte.cartes).length },
        relier: { bonnes: 0, total: 0 },
        ordre:  { bonnes: 0, total: 0 },
        copier: { bonnes: 0, total: Object.keys(reponsesTexte.copier).length },
        total:  { bonnes: 0, total: 0 }
      };

      Object.keys(reponsesTexte.quiz).forEach(function(k) { if (reponsesTexte.quiz[k].correct) note.quiz.bonnes++; });
      Object.keys(reponsesTexte.vf).forEach(function(k) { if (reponsesTexte.vf[k].correct) note.vf.bonnes++; });
      Object.keys(reponsesTexte.tt).forEach(function(k) { if (reponsesTexte.tt[k].correct) note.tt.bonnes++; });
      Object.keys(reponsesTexte.cartes).forEach(function(k) { if (reponsesTexte.cartes[k] === true) note.cartes.bonnes++; });
      Object.keys(reponsesTexte.copier).forEach(function(k) { if (reponsesTexte.copier[k] === true) note.copier.bonnes++; });
      Object.keys(reponsesTexte.relier).forEach(function(k) {
        var r = reponsesTexte.relier[k];
        note.relier.total += r.total;
        note.relier.bonnes += r.bonnes;
      });
      Object.keys(reponsesTexte.ordre).forEach(function(k) {
        var r = reponsesTexte.ordre[k];
        note.ordre.total += r.total;
        note.ordre.bonnes += r.bonnes;
      });

      note.total.bonnes = note.quiz.bonnes + note.vf.bonnes + note.tt.bonnes + note.cartes.bonnes + note.relier.bonnes + note.ordre.bonnes + note.copier.bonnes;
      note.total.total  = note.quiz.total  + note.vf.total  + note.tt.total  + note.cartes.total  + note.relier.total  + note.ordre.total  + note.copier.total;

      return note;
    }

    function majNoteGlobale() {
      var note = calculerNote();
      var lignes = [];
      if (note.quiz.total > 0)   lignes.push({ label: 'Quiz',           b: note.quiz.bonnes,   t: note.quiz.total });
      if (note.vf.total > 0)     lignes.push({ label: 'Vrai / Faux',    b: note.vf.bonnes,     t: note.vf.total });
      if (note.tt.total > 0)     lignes.push({ label: 'Textes à trous', b: note.tt.bonnes,     t: note.tt.total });
      if (note.cartes.total > 0) lignes.push({ label: 'Cartes',         b: note.cartes.bonnes, t: note.cartes.total });
      if (note.relier.total > 0) lignes.push({ label: 'Relier',         b: note.relier.bonnes, t: note.relier.total });
      if (note.ordre.total > 0)  lignes.push({ label: 'Ordre',          b: note.ordre.bonnes,  t: note.ordre.total });
      if (note.copier.total > 0) lignes.push({ label: 'Copier',         b: note.copier.bonnes, t: note.copier.total });

      var html = '';
      if (lignes.length === 0) {
        html = '<div class="note-ligne"><span class="note-label">Aucune réponse pour le moment.</span></div>';
      } else {
        lignes.forEach(function(l) {
          html += '<div class="note-ligne"><span class="note-label">' + l.label + '</span><span class="note-valeur">' + l.b + ' / ' + l.t + '</span></div>';
        });
      }
      var el = document.getElementById('noteLignes');
      if (el) el.innerHTML = html;
      var totalEl = document.getElementById('noteTotalValeur');
      if (totalEl) totalEl.textContent = note.total.bonnes + ' / ' + note.total.total;

      var btnRevoir = document.getElementById('btnRevoir');
      if (btnRevoir && note.total.total > 0) {
        var pct = (note.total.bonnes / note.total.total) * 100;
        btnRevoir.style.display = (pct < 60) ? 'inline-block' : 'none';
      }
    }

    var popupOuverte = false;

    function verifierQuizTermine() {
      if (popupOuverte) return;
      var totalExos = Object.keys(exoNumParType.quiz).length
                    + Object.keys(exoNumParType.vf).length
                    + Object.keys(exoNumParType.tt).length
                    + Object.keys(exoNumParType.carte).length
                    + Object.keys(exoNumParType.relier).length
                    + Object.keys(exoNumParType.ordre).length
                    + Object.keys(exoNumParType.copier).length;
      if (totalExos === 0) return;

      var faits = Object.keys(reponsesTexte.quiz).length
                + Object.keys(reponsesTexte.vf).length
                + Object.keys(reponsesTexte.tt).length
                + Object.keys(reponsesTexte.cartes).length
                + Object.keys(reponsesTexte.relier).length
                + Object.keys(reponsesTexte.ordre).length
                + Object.keys(reponsesTexte.copier).length;

      if (faits >= totalExos) {
        if (!envoiEffectue) envoyerToutesReponses(true);
        ouvrirPopupResultat();
      }
    }

    function ouvrirPopupResultat() {
      popupOuverte = true;
      var note = calculerNote();
      var html = '';
      var lignes = [];
      if (note.quiz.total > 0)   lignes.push({ label: 'Quiz',           b: note.quiz.bonnes,   t: note.quiz.total });
      if (note.vf.total > 0)     lignes.push({ label: 'Vrai / Faux',    b: note.vf.bonnes,     t: note.vf.total });
      if (note.tt.total > 0)     lignes.push({ label: 'Textes à trous', b: note.tt.bonnes,     t: note.tt.total });
      if (note.cartes.total > 0) lignes.push({ label: 'Cartes',         b: note.cartes.bonnes, t: note.cartes.total });
      if (note.relier.total > 0) lignes.push({ label: 'Relier',         b: note.relier.bonnes, t: note.relier.total });
      if (note.ordre.total > 0)  lignes.push({ label: 'Ordre',          b: note.ordre.bonnes,  t: note.ordre.total });
      if (note.copier.total > 0) lignes.push({ label: 'Copier',         b: note.copier.bonnes, t: note.copier.total });

      lignes.forEach(function(l) {
        html += '<div class="popup-note-ligne"><span class="note-label">' + l.label + '</span><span class="note-valeur">' + l.b + ' / ' + l.t + '</span></div>';
      });
      document.getElementById('popupNoteLignes').innerHTML = html;
      document.getElementById('popupNoteTotal').textContent = note.total.bonnes + ' / ' + note.total.total;

      var pct = note.total.total > 0 ? (note.total.bonnes / note.total.total) * 100 : 0;
      var zoneQuestions = document.getElementById('popupQuestionsZone');
      var zoneSansQuestions = document.getElementById('popupActionsSansQuestions');

      if (pct >= 60) {
        zoneQuestions.style.display = 'block';
        zoneSansQuestions.style.display = 'none';
        var listeHtml = '';
        if (questionsOuvertes.length === 0) {
          listeHtml = '<div class="popup-questions-aucune">Aucune question pour le moment.</div>';
          document.getElementById('popupBtnEnvoyerQuestions').style.display = 'none';
        } else {
          document.getElementById('popupBtnEnvoyerQuestions').style.display = 'inline-block';
          questionsOuvertes.forEach(function(q, i) {
            listeHtml += '<div class="popup-question-bloc">';
            listeHtml += '<div class="popup-question-label">Question ' + (i + 1) + '. ' + q.texte + '</div>';
            listeHtml += '<textarea class="popup-question-textarea" id="popupQuestionRep-' + i + '" placeholder="Écrivez votre réponse ici..." oninput="majReponseQuestion(' + i + ', this.value)"></textarea>';

    function envoyerToutesReponses(silencieux) {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var texteId = texteActuel ? texteActuel.id : '';
      var titre = texteActuel ? texteActuel.titre : '';
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      var choixQcmArr = [];
      var quizTotal = 0, quizBonnes = 0;
      Object.keys(reponsesTexte.quiz).forEach(function(k) {
        quizTotal++;
        var r = reponsesTexte.quiz[k];
        if (r.correct) quizBonnes++;
        choixQcmArr.push((r.correct ? 'V' : 'F') + ':' + (parseInt(r.choix) + 1));
      });
      var choixQcm = choixQcmArr.join('|');

      var vfTotal = 0, vfBonnes = 0;
      Object.keys(reponsesTexte.vf).forEach(function(k) { vfTotal++; if (reponsesTexte.vf[k].correct) vfBonnes++; });

      var ttTotal = 0, ttBonnes = 0;
      Object.keys(reponsesTexte.tt).forEach(function(k) { ttTotal++; if (reponsesTexte.tt[k].correct) ttBonnes++; });

      var cartesTotal = 0, cartesBonnes = 0, cartesStr = [];
      Object.keys(reponsesTexte.cartes).forEach(function(k) {
        cartesTotal++;
        if (reponsesTexte.cartes[k] === true) cartesBonnes++;
        cartesStr.push(reponsesTexte.cartes[k] ? '1' : '0');
      });

      var relierTotal = 0, relierBonnes = 0;
      Object.keys(reponsesTexte.relier).forEach(function(k) {
        var r = reponsesTexte.relier[k];
        relierTotal += r.total;
        relierBonnes += r.bonnes;
      });

      var ordreTotal = 0, ordreBonnes = 0;
      Object.keys(reponsesTexte.ordre).forEach(function(k) {
        var r = reponsesTexte.ordre[k];
        ordreTotal += r.total;
        ordreBonnes += r.bonnes;
      });

      var promesses = [];
      if (quizTotal > 0) promesses.push(fetch(base + '?action=saveQuiz&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&titre=' + encodeURIComponent(titre) + '&choixQcm=' + encodeURIComponent(choixQcm) + '&bonnes=' + quizBonnes + '&total=' + quizTotal).then(function(r){return r.json();}));
      if (vfTotal > 0) promesses.push(fetch(base + '?action=saveVraiFaux&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&bonnes=' + vfBonnes + '&total=' + vfTotal).then(function(r){return r.json();}));
      if (ttTotal > 0) promesses.push(fetch(base + '?action=saveTexteTrous&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&bonnes=' + ttBonnes + '&total=' + ttTotal).then(function(r){return r.json();}));
      if (cartesTotal > 0) promesses.push(fetch(base + '?action=saveCarte&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&titre=' + encodeURIComponent(titre) + '&cartes=' + encodeURIComponent(cartesStr.join(',')) + '&bonnes=' + cartesBonnes + '&total=' + cartesTotal).then(function(r){return r.json();}));
      if (relierTotal > 0) promesses.push(fetch(base + '?action=saveRelier&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&titre=' + encodeURIComponent(titre) + '&bonnes=' + relierBonnes + '&total=' + relierTotal).then(function(r){return r.json();}));
      if (ordreTotal > 0) promesses.push(fetch(base + '?action=saveOrdre&nom=' + encodeURIComponent(nom) + '&texteId=' + encodeURIComponent(texteId) + '&titre=' + encodeURIComponent(titre) + '&bonnes=' + ordreBonnes + '&total=' + ordreTotal).then(function(r){return r.json();}));

      if (promesses.length === 0) return Promise.resolve();
      return Promise.all(promesses).then(function() { envoiEffectue = true; }).catch(function(){});
    }

    function construireHtmlTexte(texte, imagesTheme) {
      imagesTheme = imagesTheme || {};
      var contenu = texte.contenu || '';
      if (!contenu) return '<p><em>Texte vide.</em></p>';

      var ordreBlocs = texte.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      var quizTexte = '', openTexte = '', ordreTexte = '', carteTexte = '', relierTexte = '', ttTexte = '', vfTexte = '', copierTexte = '';

      parts.forEach(function(part) {
        part = part.trim();
        if (part.startsWith('q:')) quizTexte = quizTexte ? quizTexte + '\n\n' + part : part;
        else if (part.startsWith('qs:')) openTexte = openTexte ? openTexte + '\n\n' + part : part;
        else if (part.startsWith('o:')) ordreTexte = ordreTexte ? ordreTexte + '\n\n' + part : part;
        else if (part.startsWith('r:')) carteTexte = carteTexte ? carteTexte + '\n\n' + part : part;
        else if (part.startsWith('l:')) relierTexte = relierTexte ? relierTexte + '\n\n' + part : part;
        else if (part.startsWith('tt:')) ttTexte = ttTexte ? ttTexte + '\n' + part : part;
        else if (part.startsWith('vf:')) vfTexte = vfTexte ? vfTexte + '\n' + part : part;
        else if (part.startsWith('c:')) copierTexte = copierTexte ? copierTexte + '\n' + part : part;
        else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
          }
        }
      });

      var quizsParsed = quizTexte ? parserQuizsPourImpression(quizTexte) : [];
      var opensParsed = [];
      if (openTexte) {
        openTexte.split('\n\n').forEach(function(bloc) {
          var t = bloc.replace(/^qs:\s*/i, '').trim();
          if (t) opensParsed.push(t);
        });
      }
      var ordresParsed = [];
      if (ordreTexte) {
        ordreTexte.split('\n\n').forEach(function(bloc) {
          var p = parserOrdrePourImpression(bloc);
          if (p && p.elements.length > 0) ordresParsed.push(p);
        });
      }
      var cartesParsed = carteTexte ? parserCartesPourImpression(carteTexte) : [];
      var reliersParsed = [];
      if (relierTexte) {
        relierTexte.split('\n\n').forEach(function(bloc) {
          var p = parserRelierPourImpression(bloc);
          if (p && p.paires.length > 0) reliersParsed.push(p);
        });
      }
      var ttsParsed = ttTexte ? parserTextesTrousPourImpression(ttTexte) : [];
      var vfsParsed = vfTexte ? parserVraiFauxPourImpression(vfTexte) : [];
      var copiersParsed = copierTexte ? parserCopierPourImpression(copierTexte) : [];

      var blocsOrdonnes = [];
      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;
          if (type === 'slide' && slidesArray[idx] !== undefined) blocsOrdonnes.push({ type: 'slide', data: slidesArray[idx] });
          else if (type === 'quiz' && quizsParsed[idx]) blocsOrdonnes.push({ type: 'quiz', data: quizsParsed[idx] });
          else if (type === 'open' && opensParsed[idx] !== undefined) blocsOrdonnes.push({ type: 'open', data: opensParsed[idx] });
          else if (type === 'ordre' && ordresParsed[idx]) blocsOrdonnes.push({ type: 'ordre', data: ordresParsed[idx] });
          else if (type === 'carte' && cartesParsed[idx]) blocsOrdonnes.push({ type: 'carte', data: cartesParsed[idx] });
          else if (type === 'relier' && reliersParsed[idx]) blocsOrdonnes.push({ type: 'relier', data: reliersParsed[idx] });
          else if (type === 'tt' && ttsParsed[idx]) blocsOrdonnes.push({ type: 'tt', data: ttsParsed[idx] });
          else if (type === 'vf' && vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
          else if (type === 'copier' && copiersParsed[idx]) blocsOrdonnes.push({ type: 'copier', data: copiersParsed[idx] });
        });
      } else {
        slidesArray.forEach(function(s) { blocsOrdonnes.push({ type: 'slide', data: s }); });
        quizsParsed.forEach(function(q) { blocsOrdonnes.push({ type: 'quiz', data: q }); });
        opensParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'open', data: o }); });
        ttsParsed.forEach(function(t) { blocsOrdonnes.push({ type: 'tt', data: t }); });
        if (vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
        ordresParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'ordre', data: o }); });
        cartesParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'carte', data: c }); });
        reliersParsed.forEach(function(r) { blocsOrdonnes.push({ type: 'relier', data: r }); });
        copiersParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'copier', data: c }); });
      }

      var textePourCompter = '';
      blocsOrdonnes.forEach(function(b) { if (b.type === 'slide') textePourCompter += ' ' + b.data; });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 14));
      texte._nbMots = nbMots;
      texte._tempsLecture = tempsLecture;

      window._relierPaires = {};
      var relierCountPourStockage = 0;
      blocsOrdonnes.forEach(function(b) {
        if (b.type === 'relier') {
          var map = {};
          (b.data.paires || []).forEach(function(p) { map[p.gauche] = p.droite; });
          window._relierPaires[relierCountPourStockage] = map;
          relierCountPourStockage++;
        }
      });

      var numeroTexte = extraireNumeroTexte(texte.titre);
      var titreAffiche = extraireTitreSansNumero(texte.titre);
      var numeroHtml = (numeroTexte !== Infinity)
        ? '<span class="numero-texte">' + numeroTexte + '</span>'
        : '';

      var html = '';
      html += '<div class="bandeau-titre"><div class="ligne-titre">' + numeroHtml + '<h1>' + echapperHtml(titreAffiche) + '</h1></div></div>';

      html += '<div class="slides-zone">';
      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type !== 'slide') return;
        html += '<div class="slide">';
        var lignesSlide = bloc.data.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) { html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>'; });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesTheme[nomImg];
            if (!url) html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            else html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="print-img print-img-' + position + ' print-img-' + taille + '">';
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();
        html += '</div>';
      });
      html += '</div>';

      html += construireExercicesPourFeuille(blocsOrdonnes);
      return html;
    }

    function construireBlocARetenir(texte) {

      if (aRetenirClean.length === 0) return '';

    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) { if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n); }
      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;
        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);
        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else frag.appendChild(document.createTextNode(part));
        });
        parent.replaceChild(frag, texteNode);
      });
    }

      }
      if (nav.suivant) {
        html += '<a href="/medit/texte.html?id=' + encodeURIComponent(nav.suivant.id) + '" class="nav-suivant">';
        html += '<span class="nav-label">Suivant →</span><span class="nav-titre">' + echapperHtml(nav.suivant.titre) + '</span></a>';
      } else {
        html += '<div class="nav-placeholder nav-suivant"><span class="nav-label">Suivant →</span><span class="nav-titre">Fin du texte</span></div>';
      }
      html += '</div></div>';
      return html;
    }

    function construireBlocActions(texte) {
      var html = '<div class="bloc-actions-texte">';
      html += '<button class="btn-action-lateral btn-imprimer" onclick="imprimerTexte(\'' + texte.id + '\', \'' + (texte.titre || '').replace(/'/g, "\\'") + '\', textesData)">Imprimer le texte et le quiz</button>';
      html += '</div>';
      return html;
    }

    function construireZoneLaterale(texte) {
      var nav = construireNavDansTheme(texte);
      var themeInfo = themesData[texte.categorie] || {};
      var html = '';
      html += construireBlocActions(texte);
      var niveau = texte.niveau || 0;
      var tempsLecture = texte._tempsLecture || 1;
      var dateEcrit = formatDateLongue(texte.date);

      html += '<div class="bloc-section">';
      html += '  <div class="bloc-titre"><span class="icone"></span> Informations</div>';
      html += '  <div class="bloc-meta-texte">';
      html += '    <div class="meta-ligne"><span class="meta-icone"></span><span class="meta-label">Niveau</span><span class="meta-valeur">' + niveau + '</span></div>';
      html += '    <div class="meta-ligne"><span class="meta-icone">⏱</span><span class="meta-label">Temps de lecture</span><span class="meta-valeur">' + tempsLecture + ' min</span></div>';
      if (dateEcrit) html += '    <div class="meta-ligne"><span class="meta-icone"></span><span class="meta-label">Écrit le</span><span class="meta-valeur">' + echapperHtml(dateEcrit) + '</span></div>';
      html += '  </div>';
      html += '</div>';

      var vocabClean = texte._vocabClean || [];
      if (vocabClean.length > 0) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre"><span class="icone">✎</span> Vocabulaire <span class="compteur">' + vocabClean.length + '</span></div>';
        html += '  <div class="bloc-vocabulaire">';
        vocabClean.forEach(function(mot) {
          var motClean = mot.replace(/\s*=\s*/g, ' : ');
          html += '<div class="vocab-mot">' + echapperHtml(motClean) + '</div>';
        });
        html += '  </div>';
        html += '</div>';
      }

      if (texte.categorie) {
        var couleur = themeInfo.couleur || '#2d6a4f';
        var sousTitre = themeInfo.sousTitre || '';
        var auteurTheme = themeInfo.auteur || '';
        var dateTheme = themeInfo.date || '';
        var dateFormatee = formatDateMoisAnnee(dateTheme);
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre"><span class="icone">📖</span> Thème</div>';
        html += '  <a class="encart-theme" href="/medit/thème.html?cat=' + encodeURIComponent(texte.categorie) + '">';
        html += '    <div class="couverture-vraie" style="background: ' + couleur + '; border-color: ' + couleur + ';">';
        html += '      <span class="badge-niveau-couv">Niv. ' + niveau + '</span>';
        html += '      <div class="contenu-couv"><div class="titre-wrapper">';
        if (auteurTheme) html += '<span class="auteur-couv">' + echapperHtml(auteurTheme) + '</span>';
        html += '<span class="titre-couv">#' + echapperHtml(texte.categorie) + '</span>';
        if (sousTitre) html += '<span class="sous-titre-couv">' + echapperHtml(sousTitre) + '</span>';
        html += '      </div><div class="edition-info"><span class="edition-nom">Qiraat Édition</span>';
        if (dateFormatee) html += '<span class="edition-date">' + dateFormatee + '</span>';
        html += '      </div></div>';
        html += '    </div>';
        html += '    <div class="encart-texte"><div class="encart-label">Extrait du thème</div><div class="encart-nom-theme">' + echapperHtml(texte.categorie) + '</div><div class="encart-cta">Voir le thème →</div></div>';
        html += '  </a>';
        html += '</div>';
      }

      if (nav.liste && nav.liste.length > 1) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre"><span class="icone">🕮</span> Les sujets dans ce thème<span class="compteur">' + nav.liste.length + '</span></div>';
        html += '  <div class="liste-textes">';
        nav.liste.forEach(function(c) {
          var estActuel = String(c.id) === String(texte.id);
          if (estActuel) html += '<div class="item-texte actuel"><span class="item-titre">' + echapperHtml(c.titre) + '</span><span class="item-marqueur">●</span></div>';
          else html += '<a class="item-texte" href="/medit/texte.html?id=' + encodeURIComponent(c.id) + '"><span class="item-titre">' + echapperHtml(c.titre) + '</span><span class="item-marqueur">→</span></a>';
        });
        html += '  </div></div>';
      }

      return html;
    }

    function construireZoneBasseMobile(texte) { return construireZoneLaterale(texte); }

    function construireBlocNoteGlobale() {
      var html = '<div class="bloc-note-globale" id="blocNoteGlobale">';
      html += '  <div class="note-titre">Résultat</div>';
      html += '  <div class="note-lignes" id="noteLignes"></div>';
      html += '  <div class="note-totale"><span>Total</span><span class="note-valeur" id="noteTotalValeur">0 / 0</span></div>';
      html += '  <div class="note-actions">';
      html += '    <button class="btn-revoir" id="btnRevoir" onclick="relireEtRefaire()" style="display:none;">Relire le texte et refaire les questions</button>';
      html += '    <button class="btn-envoyer-final" id="btnEnvoyerFinal" onclick="envoyerToutesReponses(false)">📤 Envoyer mes réponses</button>';
      html += '  </div>';
      html += '  <div class="envoi-statut" id="envoiStatut"></div>';
      html += '</div>';
      return html;
    }

    function chargerTexte() {
      var params = new URLSearchParams(window.location.search);
      var texteId = params.get('id');
      if (!texteId) { afficherErreur('Aucun texte spécifié.'); return; }
      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          textesData = data.tousLesTextes || data.textes || [];
          themesData = {};
          if (data.themes && Array.isArray(data.themes)) {
            data.themes.forEach(function(l) {
              themesData[l.titre] = {
                theme: l.theme || '',
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                description: l.description || '',
                auteur: l.auteur || '',
                niveau: parseInt(l.niveau) || 0
              };
            });
          }
          texteActuel = trouverTexte(texteId, textesData);
          if (!texteActuel) { afficherErreur('Texte introuvable.'); return; }
          if (texteActuel.categorie && typeof chargerImagesTheme === 'function') {
            chargerImagesTheme(texteActuel.categorie)
              .then(function(images) { imagesTheme = images || {}; afficherTexte(texteActuel); })
              .catch(function() { imagesTheme = {}; afficherTexte(texteActuel); });
          } else afficherTexte(texteActuel);
        })
        .catch(function() { afficherErreur('Erreur de chargement.'); });
    }

    function afficherTexte(texte) {
      var container = document.getElementById('texteContainer');
      var colonneLaterale = document.getElementById('colonneLaterale');
      var zoneBasseMobile = document.getElementById('zoneBasseMobile');
      var zoneBasPage = document.getElementById('zoneBasPage');

      var contenuHtml = construireHtmlTexte(texte, imagesTheme);
      var blocARetenirHtml = construireBlocARetenir(texte);
      var blocNoteGlobale = construireBlocNoteGlobale();
      var zoneBasHtml = construireZoneBasTexte(texte);

      container.innerHTML = '<div class="feuille-texte">' + contenuHtml + '</div>' + blocARetenirHtml + blocNoteGlobale + zoneBasHtml;

      colonneLaterale.innerHTML = construireZoneLaterale(texte);
      zoneBasseMobile.innerHTML = construireZoneBasseMobile(texte);
      zoneBasPage.innerHTML = construireZoneBasPage(texte);

      arabiserDans(container);
      afficherFilAriane(texte);
      document.title = texte.titre + ' - Qiraat';

      if (window._relierPaires) {
        Object.keys(window._relierPaires).forEach(function(relierIdx) { setRelierPaires(parseInt(relierIdx), window._relierPaires[relierIdx]); });
      }

      majNoteGlobale();
      initDragAndDropOrdre();
    }

    function afficherErreur(message) {
      document.getElementById('texteContainer').innerHTML = `
        <div class="vide-texte">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux textes.</p>
          <a href="/medit/présentation.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux textes</a>
        </div>
      `;
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', chargerTexte);
    else chargerTexte();
  </script>

</body>
</html>
