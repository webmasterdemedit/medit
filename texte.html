<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Texte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================ */
    /* PAGE TEXTE                                                    */
    /* ============================================================ */
    .page-article {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 30px 60px;
    }

    /* Fil d'Ariane */
    .fil-ariane {
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .fil-ariane a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .fil-ariane a:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }
    .fil-ariane .sep { color: var(--text-muted); opacity: 0.6; }
    .fil-ariane .current { color: var(--text-secondary); }

    /* Bouton retour */
    .btn-retour {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* FEUILLE TEXTE                                                 */
    /* ============================================================ */
    .feuille-article {
      background: #ffffff;
      color: #1a1a1a;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.35;
      padding: 26px 30px 30px;
      border: 1px solid var(--border);
    }

    .feuille-article .arabe,
    .feuille-article [lang="ar"] {
      font-family: 'Janna LT Bold', 'Traditional Arabic', serif !important;
      font-size: 1.7em;
      line-height: 1;
      vertical-align: middle;
    }

    /* Bandeau titre */
    .feuille-article .bandeau-titre {
      background: #f2f2f2;
      border-radius: 3px;
      padding: 10px 14px 9px;
      margin-bottom: 8px;
    }
    .feuille-article .bandeau-titre .ligne-titre {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      text-align: left;
    }
    .feuille-article .bandeau-titre h1 {
      font-family: 'Georgia', serif;
      font-size: 16pt;
      font-weight: bold;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
    }
    .feuille-article .bandeau-titre .meta-droite {
      font-size: 9pt;
      color: #555;
      text-align: right;
      white-space: nowrap;
    }
    .bandeau-titre .meta-droite .lecture-time {
      display: block;
      font-size: 8pt;
      color: #888;
      margin-top: 2px;
    }

    /* Tags */
    .feuille-article .tags-haut {
      margin-top: 4px;
      margin-bottom: 4px;
      text-align: center;
    }
    .feuille-article .tags-haut .memo-tag {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 9.5pt;
      color: #444;
      font-style: normal;
    }

    /* Vocabulaire */
    .feuille-article .vocab-haut {
      margin-top: 3px;
      margin-bottom: 8px;
      text-align: center;
    }
    .feuille-article .vocab-haut .titre-memo {
      display: inline;
      font-weight: 600;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-right: 6px;
    }
    .feuille-article .vocab-haut .memo-mot {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #faf8f4;
      border: 0.5px solid #bbb;
      border-radius: 10px;
      font-size: 9pt;
      color: #3a2e22;
      line-height: 1.35;
    }

    /* Slides */
    .feuille-article .slides-zone {
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .feuille-article .slide { margin-bottom: 8px; }
    .feuille-article .slide p {
      font-size: 14.3pt;
      margin-bottom: 4px;
      text-align: justify;
      text-indent: 1.2em;
    }
    .feuille-article .slide p em { font-style: italic; }

    /* Sources en marge */
    .feuille-article .slide p .source-marge {
      float: right;
      display: inline-block;
      margin: 6px 0 6px 16px;
      padding: 4px 0 0 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 12pt;
      font-weight: 700;
      font-style: normal;
      color: #333;
      text-align: right;
      max-width: 23%;
      line-height: 1.2;
      text-indent: 0;
      white-space: normal;
      vertical-align: top;
    }

    /* Images */
    .feuille-article .slide::after {
      content: "";
      display: table;
      clear: both;
    }
    .feuille-article .print-img {
      display: block;
      height: auto;
      border: none;
      margin: 10px 0;
    }
    .feuille-article .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-article .print-img-gauche { float: left; margin: 6px 14px 8px 0; }
    .feuille-article .print-img-droite { float: right; margin: 6px 0 8px 14px; }
    .feuille-article .print-img-petit  { max-width: 150px; }
    .feuille-article .print-img-moyen  { max-width: 220px; }
    .feuille-article .print-img-grand  { max-width: 320px; }

    .feuille-article .img-manquante {
      display: block;
      padding: 8px;
      border: 1px dashed #999;
      color: #666;
      font-size: 9pt;
      text-align: center;
      margin: 8px 0;
    }

    /* Bloc "À retenir" */
    .feuille-article .zone-memo {
      margin-top: 20px;
      padding: 10px 14px;
      background: #f7f7f7;
      border: 0.5px solid #ccc;
      border-left: 3px solid #999;
      border-radius: 3px;
    }
    .feuille-article .zone-memo .titre-memo {
      font-weight: 600;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 6px;
    }
    .feuille-article .zone-memo .titre-memo::before {
      content: "✦ ";
      color: #999;
      margin-right: 2px;
    }
    .feuille-article .zone-memo .memo-liste {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .feuille-article .zone-memo .memo-liste li {
      font-size: 11pt;
      margin-bottom: 3px;
      padding-left: 13px;
      position: relative;
      line-height: 1.4;
    }
    .feuille-article .zone-memo .memo-liste li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #999;
      font-size: 6pt;
      top: 5px;
    }

    /* ============================================================ */
    /* BOUTON IMPRIMER (après le bloc texte, pleine largeur)         */
    /* ============================================================ */
    .bloc-imprimer {
      margin-top: 24px;
      padding: 0;
    }
    .bloc-imprimer .btn-imprimer-large {
      display: block;
      width: 100%;
      padding: 14px 20px;
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-align: center;
    }
    .bloc-imprimer .btn-imprimer-large:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* ZONE BASSE : navigation, livret, à découvrir                 */
    /* ============================================================ */
    .zone-basse {
      margin-top: 40px;
    }

    /* ---------- Navigation précédent/suivant ---------- */
    .nav-prev-suivant {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .nav-prev-suivant a,
    .nav-prev-suivant .nav-placeholder {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-prev-suivant a:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .nav-prev-suivant .nav-placeholder { opacity: 0.3; cursor: default; }
    .nav-prev-suivant .nav-label {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .nav-prev-suivant .nav-titre {
      font-family: 'Georgia', serif;
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.3;
    }
    .nav-prev-suivant .nav-suivant { text-align: right; }
    .nav-prev-suivant .nav-suivant .nav-label,
    .nav-prev-suivant .nav-suivant .nav-titre { text-align: right; }

    /* ---------- Bloc section ---------- */
    .bloc-section {
      margin-bottom: 32px;
    }
    .bloc-section .bloc-titre {
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bloc-section .bloc-titre .icone { font-size: 18px; opacity: 0.7; }
    .bloc-section .bloc-titre .compteur {
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* ---------- Encart livret ---------- */
    .encart-livret {
      display: flex;
      gap: 20px;
      align-items: stretch;
      padding: 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
      min-height: 160px;
    }
    .encart-livret:hover { border-color: var(--border-hover); }

    .encart-livret .mini-couverture {
      flex-shrink: 0;
      width: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 12px 8px;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .encart-livret .mini-couverture .badge-niveau-couv {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 3;
      padding: 1px 7px;
      font-size: 8px;
      font-weight: 500;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }
    .encart-livret .mini-couverture .contenu-couv {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding-top: 18px;
    }
    .encart-livret .mini-couverture .auteur-couv {
      font-size: 7px;
      font-weight: 300;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.6;
      color: rgba(26, 26, 26, 0.5);
      margin-bottom: 3px;
    }
    .encart-livret .mini-couverture .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .encart-livret .mini-couverture .sous-titre-couv {
      font-size: 8px;
      font-weight: 500;
      opacity: 0.8;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.3;
    }
    .encart-livret .mini-couverture .edition-nom {
      font-weight: 700;
      font-style: italic;
      font-size: 7px;
      letter-spacing: 0.8px;
      opacity: 0.6;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
    }

    .encart-livret .encart-texte {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }
    .encart-livret .encart-label {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .encart-livret .encart-nom-livret {
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .encart-livret .encart-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 300;
    }
    .encart-livret .encart-cta {
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .encart-livret:hover .encart-cta { color: var(--text); }

    /* ---------- Liste textes du même livret ---------- */
    .liste-textes {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .liste-textes .item-texte {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
    }
    .liste-textes .item-texte:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .liste-textes .item-texte.actuel {
      background: var(--bg-active);
      border-color: var(--border-hover);
      cursor: default;
    }
    .liste-textes .item-texte.actuel:hover { background: var(--bg-active); }
    .liste-textes .item-texte .item-titre {
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: var(--text);
      font-weight: 400;
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    .liste-textes .item-texte.actuel .item-titre { font-weight: 700; }
    .liste-textes .item-texte .item-marqueur {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .liste-textes .item-texte.actuel .item-marqueur {
      color: var(--text);
      font-weight: 600;
    }

    /* ============================================================ */
    /* GALERIE DE LIVRETS (défilement horizontal)                    */
    /* ============================================================ */
    .galerie-livrets {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 4px 18px 4px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    /* Scrollbar stylée */
    .galerie-livrets::-webkit-scrollbar {
      height: 8px;
    }
    .galerie-livrets::-webkit-scrollbar-track {
      background: var(--bg-hover);
      border-radius: 4px;
    }
    .galerie-livrets::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 4px;
    }
    .galerie-livrets::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Carte livret */
    .carte-livret-mini {
      flex-shrink: 0;
      width: 160px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.25s;
      scroll-snap-align: start;
      cursor: pointer;
    }

    .carte-livret-mini:hover {
      transform: translateY(-4px);
      border-color: var(--text);
    }

    .carte-livret-mini .contenu-couv {
      position: relative;
      z-index: 2;
      padding: 18px 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .carte-livret-mini .titre-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 22px;
    }

    .carte-livret-mini .auteur-livret {
      font-size: 8px;
      font-weight: 300;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 2px;
      color: rgba(26, 26, 26, 0.5);
    }

    .carte-livret-mini .titre-livret {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.2;
      max-width: 95%;
      color: #1a1a1a;
    }

    .carte-livret-mini .sous-titre-livret {
      font-size: 10px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 4px;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.3;
    }

    .carte-livret-mini .edition-info {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding-bottom: 4px;
    }

    .carte-livret-mini .edition-nom {
      font-weight: 700;
      font-style: italic;
      font-size: 8px;
      letter-spacing: 1px;
      opacity: 0.6;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
    }

    .carte-livret-mini .edition-date {
      font-size: 7px;
      color: rgba(26, 26, 26, 0.7);
      font-weight: 500;
    }

    .carte-livret-mini .badge-niveau {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      padding: 2px 8px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }

    /* Carte livret ACTUEL (celui du texte ouvert) */
    .carte-livret-mini.actuel {
      box-shadow: 0 0 0 2px var(--text);
    }
    .carte-livret-mini.actuel::after {
      content: "● Actuel";
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Roboto', sans-serif;
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.3px;
      z-index: 4;
    }

    /* Loader / erreur */
    .loader { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide-article {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .vide-article .icone {
      font-size: 40px; display: block;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .vide-article h2 { font-size: 20px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
    .vide-article p { color: var(--text-secondary); font-size: 14px; }

    /* Devise */
    .devise {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .page-article { padding: 12px 16px 40px; }
      .feuille-article { padding: 20px 18px; font-size: 10pt; }
      .feuille-article .bandeau-titre h1 { font-size: 13pt; }
      .feuille-article .slide p { font-size: 12pt; }
      .feuille-article .print-img-moyen,
      .feuille-article .print-img-grand { max-width: 100%; }

      .nav-prev-suivant { flex-direction: column; }
      .nav-prev-suivant .nav-suivant { text-align: left; }
      .nav-prev-suivant .nav-suivant .nav-label,
      .nav-prev-suivant .nav-suivant .nav-titre { text-align: left; }

      .encart-livret { flex-direction: column; align-items: center; text-align: center; }

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var chapitreActuel = null;
    var chapitresData = [];
    var imagesLivret = {};
    var livretsData = {};

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';
      return avant + spanSource + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    // ============================================================
    // TROUVER UN CHAPITRE
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // CONSTRUCTION DU HTML DE L'ARTICLE
    // ============================================================
    function construireHtmlArticle(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};
      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Article vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      parts.forEach(function(part) {
        part = part.trim();
        if (!part) return;
        if (part.startsWith('q:')) return;
        if (part.startsWith('qs:')) return;
        if (part.startsWith('o:')) return;
        if (part.startsWith('r:')) return;
        if (part.startsWith('l:')) return;
        if (part.startsWith('tt:')) return;
        if (part.startsWith('vf:')) return;
        if (part.startsWith('c:')) return;
        var cleanText = part.replace(/\r\n/g, '\n').trim();
        if (cleanText) {
          var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
          subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
        }
      });

      var blocsSlide = [];
      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;
          if (type === 'slide' && slidesArray[idx] !== undefined) {
            blocsSlide.push(slidesArray[idx]);
          }
        });
      }
      if (blocsSlide.length === 0) blocsSlide = slidesArray;

      var aRetenirClean = (chapitre.aRetenir || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var textePourCompter = '';
      blocsSlide.forEach(function(s) { textePourCompter += ' ' + s; });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 200));

      var html = '';

      // Bandeau titre
      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + echapperHtml(chapitre.titre || 'Lecture') + '</h1>';
      html += '    <div class="meta-droite">' +
              (chapitre.categorie ? echapperHtml(chapitre.categorie) + ' — ' : '') +
              'Niveau ' + (chapitre.niveau || 0) +
              '<span class="lecture-time">⏱ ' + tempsLecture + ' min de lecture</span>' +
              '</div>';
      html += '  </div>';
      html += '</div>';

      // Tags
      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + echapperHtml(t) + '</span>'; });
        html += '</div>';
      }

      // Vocabulaire
      if (vocabClean.length > 0) {
        html += '<div class="vocab-haut"><span class="titre-memo">Vocabulaire</span>';
        vocabClean.forEach(function(m) { html += '<span class="memo-mot">' + echapperHtml(m) + '</span>'; });
        html += '</div>';
      }

      // Slides
      html += '<div class="slides-zone">';
      blocsSlide.forEach(function(slideData) {
        html += '<div class="slide">';
        var lignesSlide = slideData.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();

        html += '</div>';
      });
      html += '</div>';

      // À retenir
      if (aRetenirClean.length > 0) {
        html += '<div class="zone-memo">';
        html += '<div class="memo-bloc">';
        html += '<div class="titre-memo">À retenir</div>';
        html += '<ul class="memo-liste">';
        aRetenirClean.forEach(function(phrase) { html += '<li>' + echapperHtml(phrase) + '</li>'; });
        html += '</ul></div>';
        html += '</div>';
      }

      return html;
    }

    // ============================================================
    // Enveloppe les mots arabes
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);

      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n);
      }

      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;

        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);

        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });

        parent.replaceChild(frag, texteNode);
      });
    }

    // ============================================================
    // FIL D'ARIANE
    // ============================================================
    function afficherFilAriane(chapitre) {
      var html = '';
      html += '<a href="/medit/index.html">Accueil</a>';
      html += '<span class="sep">›</span>';
      html += '<a href="/medit/textes.html">Tous les textes</a>';
      if (chapitre.categorie) {
        html += '<span class="sep">›</span>';
        html += '<a href="/medit/textes.html?livret=' + encodeURIComponent(chapitre.categorie) + '">' + echapperHtml(chapitre.categorie) + '</a>';
      }
      html += '<span class="sep">›</span>';
      html += '<span class="current">' + echapperHtml(chapitre.titre) + '</span>';

      var el = document.getElementById('filAriane');
      if (el) el.innerHTML = html;
    }

    // ============================================================
    // NAVIGATION DANS LE MÊME LIVRET
    // ============================================================
    function construireNavDansLivret(chapitre) {
      if (!chapitre.categorie) return {};

      var memeLivret = chapitresData.filter(function(c) {
        return (c.categorie || '') === (chapitre.categorie || '');
      });
      memeLivret = trierAlphabetique(memeLivret);

      var indexActuel = -1;
      for (var i = 0; i < memeLivret.length; i++) {
        if (String(memeLivret[i].id) === String(chapitre.id)) {
          indexActuel = i;
          break;
        }
      }

      return {
        liste: memeLivret,
        index: indexActuel,
        precedent: indexActuel > 0 ? memeLivret[indexActuel - 1] : null,
        suivant: indexActuel !== -1 && indexActuel < memeLivret.length - 1 ? memeLivret[indexActuel + 1] : null
      };
    }

    // ============================================================
    // GALERIE DE TOUS LES LIVRETS
    // ============================================================
    function construireGalerieLivrets(chapitreActuel) {
      // Récupérer tous les livrets uniques (catégories distinctes)
      var categoriesUniques = {};
      chapitresData.forEach(function(c) {
        var cat = c.categorie || 'Sans catégorie';
        if (!categoriesUniques[cat]) {
          categoriesUniques[cat] = {
            nom: cat,
            niveau: c.niveau || 1,
            nbChapitres: 0
          };
        }
        categoriesUniques[cat].nbChapitres++;
      });

      // Trier A→Z
      var livretsTries = Object.keys(categoriesUniques).sort(function(a, b) {
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });

      if (livretsTries.length === 0) return '';

      var html = '';
      html += '<div class="bloc-section">';
      html += '  <div class="bloc-titre">';
      html += '    <span class="icone">📚</span> Tous les livrets';
      html += '    <span class="compteur">' + livretsTries.length + ' livrets · cliquez pour explorer</span>';
      html += '  </div>';
      html += '  <div class="galerie-livrets">';

      livretsTries.forEach(function(cat) {
        var info = categoriesUniques[cat];
        var livretMeta = livretsData[cat] || {};
        var couleur = livretMeta.couleur || '#2d6a4f';
        var sousTitre = livretMeta.sousTitre || '';
        var auteur = livretMeta.auteur || '';
        var dateLivret = livretMeta.date || '';

        var dateFormatee = '';
        if (dateLivret) {
          try {
            var d = new Date(dateLivret);
            if (!isNaN(d.getTime())) {
              var mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                          'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
              dateFormatee = d.getFullYear();
            }
          } catch(e) {}
        }

        var estActuel = (cat === chapitreActuel.categorie);

        html += '<a class="carte-livret-mini' + (estActuel ? ' actuel' : '') + '" ';
        html += '   href="/medit/textes.html?livret=' + encodeURIComponent(cat) + '" ';
        html += '   style="background: ' + couleur + '; border-color: ' + couleur + ';" ';
        html += '   title="Voir les textes du livret ' + echapperHtml(cat) + '">';
        html += '  <span class="badge-niveau">Niv. ' + info.niveau + '</span>';
        html += '  <div class="contenu-couv">';
        html += '    <div class="titre-wrapper">';
        if (auteur) {
          html += '      <span class="auteur-livret">' + echapperHtml(auteur) + '</span>';
        }
        html += '      <span class="titre-livret">' + echapperHtml(cat) + '</span>';
        if (sousTitre) {
          html += '      <span class="sous-titre-livret">' + echapperHtml(sousTitre) + '</span>';
        }
        html += '    </div>';
        html += '    <div class="edition-info">';
        html += '      <span class="edition-nom">Qiraat Édition</span>';
        if (dateFormatee) {
          html += '      <span class="edition-date">' + dateFormatee + '</span>';
        }
        html += '    </div>';
        html += '  </div>';
        html += '</a>';
      });

      html += '  </div>';
      html += '</div>';

      return html;
    }

    // ============================================================
    // RENDU DE LA ZONE BASSE
    // ============================================================
    function construireZoneBasse(chapitre) {
      var html = '';
      var nav = construireNavDansLivret(chapitre);
      var livretInfo = livretsData[chapitre.categorie] || {};

      // ---------- 1. Navigation précédent/suivant ----------
      html += '<div class="nav-prev-suivant">';

      if (nav.precedent) {
        html += '<a href="/medit/texte.html?id=' + encodeURIComponent(nav.precedent.id) + '">';
        html += '  <span class="nav-label">← Précédent</span>';
        html += '  <span class="nav-titre">' + echapperHtml(nav.precedent.titre) + '</span>';
        html += '</a>';
      } else {
        html += '<div class="nav-placeholder">';
        html += '  <span class="nav-label">← Précédent</span>';
        html += '  <span class="nav-titre">Début du livret</span>';
        html += '</div>';
      }

      if (nav.suivant) {
        html += '<a href="/medit/texte.html?id=' + encodeURIComponent(nav.suivant.id) + '" class="nav-suivant">';
        html += '  <span class="nav-label">Suivant →</span>';
        html += '  <span class="nav-titre">' + echapperHtml(nav.suivant.titre) + '</span>';
        html += '</a>';
      } else {
        html += '<div class="nav-placeholder nav-suivant">';
        html += '  <span class="nav-label">Suivant →</span>';
        html += '  <span class="nav-titre">Fin du livret</span>';
        html += '</div>';
      }

      html += '</div>';

      // ---------- 2. Encart "Ce texte est extrait du livret..." ----------
      if (chapitre.categorie) {
        var couleur = livretInfo.couleur || '#2d6a4f';
        var sousTitre = livretInfo.sousTitre || '';
        var description = livretInfo.description || '';
        var auteur = livretInfo.auteur || '';
        var niveau = chapitre.niveau || 1;

        if (description.length > 180) {
          description = description.substring(0, 177) + '...';
        }

        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">📖 Ce texte est extrait du livret</div>';
        html += '  <a class="encart-livret" href="/medit/livret.html?cat=' + encodeURIComponent(chapitre.categorie) + '">';
        html += '    <div class="mini-couverture" style="background: ' + couleur + '; border-color: ' + couleur + ';">';
        html += '      <span class="badge-niveau-couv">Niv. ' + niveau + '</span>';
        html += '      <div class="contenu-couv">';
        html += '        <div>';
        if (auteur) html += '          <div class="auteur-couv">' + echapperHtml(auteur) + '</div>';
        html += '          <div class="titre-couv">' + echapperHtml(chapitre.categorie) + '</div>';
        if (sousTitre) html += '          <div class="sous-titre-couv">' + echapperHtml(sousTitre) + '</div>';
        html += '        </div>';
        html += '        <div class="edition-nom">Qiraat Édition</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="encart-texte">';
        html += '      <div class="encart-label">Livret</div>';
        html += '      <div class="encart-nom-livret">' + echapperHtml(chapitre.categorie) + '</div>';
        if (description) {
          html += '      <div class="encart-description">' + echapperHtml(description) + '</div>';
        }
        html += '      <div class="encart-cta">Voir le livret →</div>';
        html += '    </div>';
        html += '  </a>';
        html += '</div>';
      }

      // ---------- 3. Liste "Dans le même livret" ----------
      if (nav.liste && nav.liste.length > 1) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">';
        html += '    <span class="icone">🕮</span> Dans le même livret';
        html += '    <span class="compteur">' + nav.liste.length + ' textes · A → Z</span>';
        html += '  </div>';
        html += '  <div class="liste-textes">';

        nav.liste.forEach(function(c) {
          var estActuel = String(c.id) === String(chapitre.id);
          if (estActuel) {
            html += '<div class="item-texte actuel">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">● Vous êtes ici</span>';
            html += '</div>';
          } else {
            html += '<a class="item-texte" href="/medit/texte.html?id=' + encodeURIComponent(c.id) + '">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">Lire →</span>';
            html += '</a>';
          }
        });

        html += '  </div>';
        html += '</div>';
      }

      // ---------- 4. Galerie de TOUS les livrets ----------
      html += construireGalerieLivrets(chapitre);

      return html;
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerArticle() {
      var params = new URLSearchParams(window.location.search);
      var chapitreId = params.get('id');

      if (!chapitreId) { afficherErreur('Aucun texte spécifié.'); return; }

      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          chapitresData = data.tousLesChapitres || data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                description: l.description || '',
                auteur: l.auteur || ''
              };
            });
          }

          chapitreActuel = trouverChapitre(chapitreId, chapitresData);

          if (!chapitreActuel) {
            afficherErreur('Texte introuvable.');
            return;
          }

          if (chapitreActuel.categorie && typeof chargerImagesLivret === 'function') {
            chargerImagesLivret(chapitreActuel.categorie)
              .then(function(images) {
                imagesLivret = images || {};
                afficherArticle(chapitreActuel);
              })
              .catch(function() {
                imagesLivret = {};
                afficherArticle(chapitreActuel);
              });
          } else {
            afficherArticle(chapitreActuel);
          }
        })
        .catch(function(error) {
          console.error('❌ Erreur:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];

            livretsData = {};
            if (cache.livrets && Array.isArray(cache.livrets)) {
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  description: l.description || '',
                  auteur: l.auteur || ''
                };
              });
            }

            chapitreActuel = trouverChapitre(chapitreId, chapitresData);
            if (chapitreActuel) {
              afficherArticle(chapitreActuel);
              return;
            }
          }
          afficherErreur('Erreur de chargement.');
        });
    }

    // ============================================================
    // AFFICHER LE TEXTE
    // ============================================================
    function afficherArticle(chapitre) {
      var container = document.getElementById('articleContainer');

      var contenuHtml = construireHtmlArticle(chapitre, imagesLivret);

      // ✅ BOUTON IMPRIMER : juste après le bloc de texte, pleine largeur
      var blocImprimerHtml =
        '<div class="bloc-imprimer">' +
        '  <button class="btn-imprimer-large" onclick="imprimerChapitre(\'' +
        chapitre.id + '\', \'' +
        (chapitre.titre || '').replace(/'/g, "\\'") + '\', chapitresData)">' +
        '🖨 Imprimer les exercices' +
        '  </button>' +
        '</div>';

      var zoneBasseHtml = construireZoneBasse(chapitre);

      var html = '<div class="feuille-article">' + contenuHtml + blocImprimerHtml + '</div>';
      html += '<div class="zone-basse">' + zoneBasseHtml + '</div>';

      container.innerHTML = html;

      arabiserDans(container);
      afficherFilAriane(chapitre);

      document.title = chapitre.titre + ' - Qiraat';
    }

    // ============================================================
    // ERREUR
    // ============================================================
    function afficherErreur(message) {
      document.getElementById('articleContainer').innerHTML = `
        <div class="vide-article">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux textes.</p>
          <a href="/medit/textes.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux textes</a>
        </div>
      `;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerArticle);
    } else {
      chargerArticle();
    }
  </script>

</body>
</html>
