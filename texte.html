<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Texte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) { document.write(xhr.responseText); }
  </script>

  <style>
    /* ============================================================
       MISE EN PAGE DU TEXTE — reprend l'esprit de impression.js
       ============================================================ */

    .feuille-texte {
      background: var(--bg-paper);
      color: var(--text);
      font-family: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
      font-size: 11.5pt;
      line-height: 1.55;
      padding: 0;
    }

    /* ---- En-tête élève ---- */
    .feuille-texte .entete-eleve {
      margin-bottom: 4px; padding: 4px 0 2px;
      font-size: 9.5pt; color: var(--text-secondary);
    }
    .feuille-texte .entete-eleve .ligne-eleve {
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .feuille-texte .entete-eleve span { white-space: nowrap; }
    .feuille-texte .entete-eleve strong {
      font-weight: 600; color: var(--text); letter-spacing: .2px;
    }

    /* ---- Note haut ---- */
    .feuille-texte .note-haut {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 30px; padding: 2px 0 6px; font-size: 10pt;
    }
    .feuille-texte .note-haut strong { font-weight: 600; color: var(--text); }
    .feuille-texte .note-haut .note-haut-droite {
      flex: 1; display: flex; align-items: baseline; gap: 4px;
    }
    .feuille-texte .note-haut .note-haut-droite .ligne-pointillee {
      display: inline-block; flex: 1;
      border-bottom: 0.6px dotted var(--border-hover);
      height: 12px;
    }

    /* ---- Filet ---- */
    .feuille-texte .filet {
      border: none;
      border-top: 1.6px solid var(--text);
      border-bottom: 0.6px solid var(--border-hover);
      height: 4px; margin: 10px 0 14px;
    }

    /* ---- Temps de lecture ---- */
    .feuille-texte .temps-lecture-haut {
      text-align: center; font-size: 9pt; color: var(--text-muted);
      font-style: italic; margin-bottom: 10px; letter-spacing: .5px;
      font-family: 'Georgia', serif;
    }
    .feuille-texte .temps-lecture-haut::before {
      content: "❧ "; font-style: normal; color: var(--text-muted); margin-right: 4px;
    }

    /* ---- Bandeau titre ---- */
    .feuille-texte .bandeau-titre {
      text-align: center; padding: 6px 0 4px; margin-bottom: 6px;
      border: none; background: transparent;
    }
    .feuille-texte .bandeau-titre .ligne-titre {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .feuille-texte .bandeau-titre h1 {
      font-family: 'Georgia', serif; font-size: 20pt; font-weight: 700;
      color: var(--text); letter-spacing: 1.5px; text-transform: uppercase;
      line-height: 1.15; margin: 0; text-align: center;
    }
    .feuille-texte .bandeau-titre .meta-droite {
      font-family: 'Georgia', serif; font-style: italic; font-size: 10pt;
      color: var(--text-muted); letter-spacing: .5px; margin-top: 2px;
    }
    .feuille-texte .sous-titre-filets {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin: 6px auto 2px; width: 60%;
    }
    .feuille-texte .sous-titre-filets::before,
    .feuille-texte .sous-titre-filets::after {
      content: ""; flex: 1; border-top: 0.7px solid var(--border-hover);
    }
    .feuille-texte .numero-texte {
      display: inline-block; background: var(--text); color: var(--bg);
      font-family: 'Georgia', serif; font-size: 12pt; font-weight: bold;
      line-height: 1; padding: 4px 11px; border-radius: 1px;
      letter-spacing: 1px; white-space: nowrap;
    }

    /* ---- Tags haut ---- */
    .feuille-texte .tags-haut {
      margin-top: 6px; margin-bottom: 4px; text-align: center;
    }
    .feuille-texte .tags-haut .memo-tag {
      display: inline-block; padding: 2px 10px; margin: 2px 3px;
      background: transparent; border: 0.5px solid var(--border-hover);
      border-radius: 12px; font-size: 9pt; color: var(--text-muted);
      font-style: italic;
    }

    /* ---- Vocabulaire haut ---- */
    .feuille-texte .vocab-haut {
      margin: 6px auto 10px; text-align: center; width: 90%;
      padding: 6px 0; border-top: 0.6px dotted var(--border-hover);
      border-bottom: 0.6px dotted var(--border-hover);
    }
    .feuille-texte .vocab-haut .titre-memo {
      display: inline; font-weight: 600; font-size: 8.5pt;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text-muted); margin-right: 8px;
    }
    .feuille-texte .vocab-haut .memo-mot {
      display: inline-block; padding: 1px 10px; margin: 2px 3px;
      background: transparent; font-size: 9.5pt;
      color: var(--text); font-style: italic; line-height: 1.4;
    }
    .feuille-texte .vocab-haut .memo-mot::after { content: ","; }
    .feuille-texte .vocab-haut .memo-mot:last-child::after { content: ""; }

    /* ---- Corps du texte ---- */
    .feuille-texte .texte-zone { margin-top: 32px; margin-bottom: 10px; }
    .feuille-texte .paragraphe { margin-bottom: 10px; }
    .feuille-texte .paragraphe p {
      font-size: 12.8pt; margin-bottom: 6px; text-align: justify;
      text-indent: 1.4em; line-height: 1.6; hyphens: auto;
    }
    .feuille-texte .paragraphe p:last-child { margin-bottom: 0; }

    .feuille-texte .paragraphe p.p-avec-source {
      position: relative; padding-right: 130px;
    }
    .feuille-texte .source-discrete {
      position: absolute; top: 0; right: 0; width: 120px;
      font-family: 'Georgia', serif; font-style: italic; font-size: 9.5pt;
      line-height: 1.25; color: var(--text-muted); text-align: left;
      white-space: normal; padding-top: 2px;
      border-top: 0.5px solid var(--border-hover);
    }
    .feuille-texte .paragraphe.lettrine p:first-child::first-letter {
      font-family: 'Georgia', serif; font-size: 3.1em; float: left;
      line-height: 0.82; padding: 4px 8px 0 0;
      color: var(--text); font-weight: 700;
    }
    .feuille-texte .paragraphe p em {
      font-style: italic; white-space: pre-line; color: var(--text-secondary);
    }
    .feuille-texte .paragraphe::after {
      content: ""; display: table; clear: both;
    }
    .feuille-texte .paragraphe p .source-marge {
      float: right; display: inline-block; margin: 6px 0 6px 16px;
      padding: 4px 0 0 0; font-family: 'Georgia', serif; font-size: 11pt;
      font-weight: 700; font-style: italic; color: var(--text-muted);
      text-align: right; max-width: 23%; line-height: 1.25;
      text-indent: 0; white-space: normal; vertical-align: top;
      border-top: 0.5px solid var(--border-hover);
    }

    /* ---- Images ---- */
    .feuille-texte .print-img {
      display: block; height: auto; margin: 12px 0;
      border-radius: 1px; box-shadow: 0 1px 4px rgba(60,45,25,.12);
    }
    .feuille-texte .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-texte .print-img-gauche { float: left; margin: 6px 16px 10px 0; }
    .feuille-texte .print-img-droite { float: right; margin: 6px 0 10px 16px; }
    .feuille-texte .print-img-petit  { max-width: 110px; }
    .feuille-texte .print-img-moyen  { max-width: 180px; }
    .feuille-texte .print-img-grand  { max-width: 230px; }
    .feuille-texte .img-manquante {
      display: block; padding: 8px; border: 1px dashed var(--border-hover);
      color: var(--text-muted); font-size: 9pt; text-align: center;
      margin: 8px 0; font-style: italic;
    }

    /* ---- Zone mémo (À retenir) ---- */
    .feuille-texte .zone-memo {
      margin: 20px 0 10px; padding: 12px 16px 12px;
      background: var(--bg-hover);
      border-top: 0.6px solid var(--border-hover);
      border-bottom: 0.6px solid var(--border-hover);
    }
    .feuille-texte .zone-memo .titre-memo {
      font-weight: 700; font-size: 9pt; text-transform: uppercase;
      letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 8px;
      text-align: center; font-family: 'Georgia', serif;
    }
    .feuille-texte .zone-memo .titre-memo::before { content: "✦  "; color: var(--text-muted); margin-right: 2px; }
    .feuille-texte .zone-memo .titre-memo::after  { content: "  ✦"; color: var(--text-muted); margin-left: 2px; }
    .feuille-texte .zone-memo .memo-liste { list-style: none; padding: 0; margin: 0; }
    .feuille-texte .zone-memo .memo-liste li {
      font-size: 10.5pt; margin-bottom: 4px; padding-left: 16px;
      position: relative; line-height: 1.55;
    }
    .feuille-texte .zone-memo .memo-liste li::before {
      content: "❧"; position: absolute; left: 0; color: var(--text-muted);
      font-size: 8pt; top: 3px;
    }

        /* ============================================================
       BARRE D'ACTION (partage + nav)
       ============================================================ */
    .barre-action-texte {
      display: flex; align-items: stretch; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; width: 100%; max-width: 100%;
      box-sizing: border-box;
    }
    .barre-action-texte .btn-retour {
      display: inline-flex; align-items: center; margin: 0;
      text-decoration: none; flex: 0 0 auto; white-space: nowrap;
    }
    .btn-nav-texte {
      justify-content: center; min-width: 38px; padding: 0 12px;
      font-size: 15px; line-height: 1; box-sizing: border-box;
    }
    .btn-nav-texte.desactive {
      opacity: .35; pointer-events: none; cursor: default;
    }
    .partage-social {
      display: flex; align-items: stretch; gap: 4px;
      margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 100%;
    }
    .partage-btn {
      display: inline-flex; align-items: center; justify-content: center;
      aspect-ratio: 1 / 1; padding: 0 4px; box-sizing: border-box;
      cursor: pointer; flex: 0 1 auto; min-width: 0; overflow: hidden;
    }
    .partage-btn svg { display: block; width: 16px; height: 16px; flex: 0 0 auto; }
    .partage-btn:hover { opacity: .6; }

    @media (max-width: 900px) {
      .partage-btn { padding: 0 3px; }
      .partage-btn svg { width: 15px; height: 15px; }
      .partage-social { gap: 3px; }
    }
    @media (max-width: 700px) {
      .partage-btn { padding: 0 2px; }
      .partage-btn svg { width: 14px; height: 14px; }
      .partage-social { gap: 2px; }
      .barre-action-texte { gap: 8px; }
    }
    @media (max-width: 560px) {
      .partage-btn { padding: 0 1px; }
      .partage-btn svg { width: 13px; height: 13px; }
      .partage-social { gap: 1px; }
    }
    @media (max-width: 460px) {
      .barre-action-texte { flex-wrap: wrap; }
      .partage-social { flex-basis: 100%; justify-content: flex-end; }
    }

    /* ============================================================
       BOUTON "VÉRIFIER SA COMPRÉHENSION"
       ============================================================ */
    .bloc-verifier-comprehension {
      margin: 40px 0 24px;
      text-align: center;
    }
    .btn-verifier-comprehension {
      display: inline-block;
      width: 100%;
      max-width: 520px;
      padding: 18px 32px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-hover);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn-verifier-comprehension:hover {
      background: var(--bg-hover);
      border-color: var(--text);
    }

    /* ============================================================
       POPUP EXERCICES
       ============================================================ */
    .popup-exercices-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: none; align-items: flex-start; justify-content: center;
      padding: 40px 20px;
      background: rgba(0,0,0,.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      overflow-y: auto;
    }
    .popup-exercices-overlay.visible { display: flex; }

    .popup-exercices {
      background: var(--bg-paper);
      border: 1px solid var(--border-hover);
      width: 100%;
      max-width: 760px;
      padding: 32px 36px 28px;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
      color: var(--text);
    }
    .popup-exercices .popup-exercices-entete {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .popup-exercices .popup-exercices-titre {
      font-family: 'Georgia', serif; font-size: 20px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; margin: 0;
    }
    .popup-exercices .popup-exercices-fermer {
      background: transparent; border: none; cursor: pointer;
      font-size: 26px; line-height: 1; color: var(--text-secondary);
      padding: 0 4px;
    }
    .popup-exercices .popup-exercices-fermer:hover { color: var(--text); }

    /* Styles des exercices dans la popup (cohérents avec le reste) */
    .popup-exercices .exercices-zone { margin-top: 0; }
    .popup-exercices .titre-exercices {
      text-align: center; font-family: 'Georgia', serif;
      font-size: 13pt; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; margin: 0 0 18px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .popup-exercices .exo {
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 0.5px dotted var(--border-hover);
    }
    .popup-exercices .exo:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .popup-exercices .consigne-exo {
      font-size: 8.8pt; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-bottom: 5px; font-family: 'Georgia', serif;
    }
    .popup-exercices .consigne-exo::before {
      content: "❧  "; color: var(--text-muted); font-size: 8pt; margin-right: 2px;
    }
    .popup-exercices .exo-ligne {
      display: flex; align-items: baseline; gap: 8px; margin-top: 3px;
    }
    .popup-exercices .exo-num-inline {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px;
      background: transparent; color: var(--text);
      border: 0.9px solid var(--text); border-radius: 50%;
      font-weight: 700; font-size: 8.5pt; flex-shrink: 0;
      font-family: 'Georgia', serif; line-height: 1;
      padding-bottom: 1.2px; transform: translateY(-.5px);
    }
    .popup-exercices .exo-texte { flex: 1; font-size: 10.5pt; line-height: 1.5; }

    /* Quiz */
    .popup-exercices .quiz-reponses { margin-left: 26px; margin-top: 4px; }
    .popup-exercices .quiz-rep {
      display: block; margin-bottom: 2px; font-size: 10.5pt;
      padding: 3px 6px; border-radius: 0; cursor: default;
    }
    .popup-exercices .quiz-rep.interactive { cursor: pointer; user-select: none; }
    .popup-exercices .quiz-rep.interactive:hover { background: var(--bg-hover); }
    .popup-exercices .quiz-rep.correct {
      background: var(--bg-hover); border-left: 2px solid var(--text);
      padding-left: 10px;
    }
    .popup-exercices .quiz-rep.incorrect {
      border-left: 2px solid var(--border-hover);
      padding-left: 10px; opacity: .85;
    }
    .popup-exercices .quiz-case {
      display: inline-block; width: 10px; height: 10px;
      border: 0.9px solid var(--text-secondary);
      margin-right: 6px; vertical-align: middle;
      background: var(--bg-paper); border-radius: 1px;
    }
    .popup-exercices .quiz-rep.correct .quiz-case,
    .popup-exercices .quiz-rep.revelee .quiz-case {
      background: var(--text); border-color: var(--text);
    }
    .popup-exercices .quiz-feedback-exo {
      margin-left: 26px; margin-top: 6px; min-height: 16px;
      font-style: italic; color: var(--text-secondary); font-size: .9em;
    }

    /* Open */
    .popup-exercices .open-textarea {
      width: 100%; min-height: 90px; margin: 8px 0;
      padding: 10px; border: 1px solid var(--border);
      background: transparent; color: inherit;
      font-family: inherit; font-size: 1em;
      resize: vertical; box-sizing: border-box;
    }
    .popup-exercices .open-textarea:focus { outline: none; border-color: var(--text); }
    .popup-exercices .open-textarea.open-ok {
      border-color: var(--text); background: var(--bg-hover);
    }
    .popup-exercices .open-actions {
      display: flex; justify-content: flex-end; margin-top: 4px;
    }
    .popup-exercices .open-btn-valider {
      padding: 6px 14px; border: 1px solid var(--border);
      background: transparent; color: inherit; cursor: pointer; font-size: .9em;
    }
    .popup-exercices .open-btn-valider:hover { opacity: .7; }
    .popup-exercices .open-btn-valider.actif {
      border-color: var(--text); color: var(--text); cursor: default;
    }
    .popup-exercices .open-btn-valider:disabled { cursor: default; opacity: .8; }
    .popup-exercices .open-feedback {
      margin-top: 6px; font-size: .9em; color: var(--text-secondary); min-height: 1em;
    }

    /* TT */
    .popup-exercices .tt-phrase-print { flex: 1; font-size: 10.8pt; line-height: 1.6; }
    .popup-exercices .tt-input {
      display: inline-block; min-width: 100px; max-width: 160px;
      padding: 1px 6px; border: none;
      border-bottom: 1.2px solid var(--text);
      text-align: center; outline: none;
      background: transparent; color: var(--text); font-family: inherit;
    }
    .popup-exercices .tt-input.tt-ok { border-bottom-color: var(--text); font-weight: 600; }
    .popup-exercices .tt-input.tt-ko { border-bottom-color: var(--border-hover); color: var(--text-secondary); }
    .popup-exercices .tt-feedback {
      margin-left: 26px; margin-top: 4px; min-height: 14px;
      font-style: italic; color: var(--text-secondary); font-size: .9em;
    }

    /* VF */
    .popup-exercices .vf-ligne { display: flex; align-items: center; gap: 6px; }
    .popup-exercices .exo-texte-vf { font-size: 10.5pt; line-height: 1.5; flex: 1; }
    .popup-exercices .vf-cases {
      font-size: 9.5pt; white-space: nowrap; margin-left: 6px;
      flex-shrink: 0; display: flex; gap: 4px;
    }
    .popup-exercices .vf-btn {
      background: transparent; border: 1px solid var(--border);
      border-radius: 0; color: var(--text-secondary);
      padding: 2px 10px; cursor: pointer; font-family: inherit;
    }
    .popup-exercices .vf-btn:hover:not(:disabled) {
      background: var(--bg-hover); color: var(--text); border-color: var(--border-hover);
    }
    .popup-exercices .vf-btn.vf-ok {
      background: var(--bg-active); border-color: var(--border-hover); color: var(--text);
    }
    .popup-exercices .vf-btn.vf-ko {
      background: transparent; border-color: var(--border-hover); color: var(--text-secondary);
    }
    .popup-exercices .vf-btn:disabled { cursor: default; }
    .popup-exercices .vf-feedback {
      margin-left: 26px; margin-top: 4px; min-height: 14px;
      font-style: italic; color: var(--text-secondary); font-size: .9em;
    }

    /* Carte */
    .popup-exercices .carte-actions { margin-left: 26px; margin-top: 8px; }
    .popup-exercices .carte-btn-voir {
      background: transparent; border: 1px solid var(--border);
      border-radius: 0; color: var(--text-secondary);
      padding: 3px 12px; cursor: pointer;
    }
    .popup-exercices .carte-btn-voir:hover {
      background: var(--bg-hover); color: var(--text); border-color: var(--border-hover);
    }
    .popup-exercices .carte-reponse-cachee {
      display: none; margin-left: 26px; margin-top: 6px; padding: 6px 10px;
      background: var(--bg-hover); border-left: 2px solid var(--text); color: var(--text);
    }
    .popup-exercices .carte-reponse-cachee.visible { display: block; }
    .popup-exercices .carte-choix {
      margin-left: 26px; margin-top: 6px; display: none;
    }
    .popup-exercices .carte-choix.visible { display: block; }
    .popup-exercices .carte-choix button {
      padding: 3px 12px; margin-right: 6px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 0; color: var(--text-secondary); cursor: pointer;
    }
    .popup-exercices .carte-choix button:hover:not(:disabled) {
      background: var(--bg-hover); color: var(--text); border-color: var(--border-hover);
    }
    .popup-exercices .carte-choix button.actif {
      background: var(--bg-active); color: var(--text); border-color: var(--border-hover);
    }
    .popup-exercices .carte-choix button:disabled { cursor: default; }

    /* Relier */
    .popup-exercices .relier-zone { position: relative; margin: 12px 0 8px 26px; max-width: 100%; }

  <script>
    var texteActuel = null;
    var textesData = [];
    var imagesTheme = {};
    var themesData = {};

    var reponsesTexte = {
      quiz: {}, vf: {}, tt: {}, cartes: {}, relier: {}, ordre: {}, copier: {}, open: {}
    };

    var envoiEffectue = false;

    var exoNumParType = {
      quiz: {}, vf: {}, tt: {}, relier: {}, carte: {}, ordre: {}, copier: {}, open: {}
    };

    var questionsOuvertes = [];

    var annotationChargee = false;

    /* Contenu HTML des exercices, mis de côté pour la popup */
    var htmlExercicesPopup = '';

    function echapperHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function echapperRegexPourRegex(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function getNomUtilisateurCourant() {
      if (typeof getIdUtilisateur === 'function') {
        var id = getIdUtilisateur();
        if (id) return id;
      }
      var stock = localStorage.getItem('etudiant_id');
      if (stock) return stock;

      var inv = localStorage.getItem('invite_id');
      if (!inv) {
        inv = 'invite_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('invite_id', inv);
      }
      return inv;
    }

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var idxDerniere = Math.max(
        texteSansSource.lastIndexOf('.'),
        texteSansSource.lastIndexOf('!'),
        texteSansSource.lastIndexOf('?')
      );
      var idxDebutPhrase = 0;
      if (idxDerniere !== -1) {
        var avant = texteSansSource.substring(0, idxDerniere);
        var idxPrec = Math.max(
          avant.lastIndexOf('.'), avant.lastIndexOf('!'), avant.lastIndexOf('?')
        );
        idxDebutPhrase = idxPrec + 1;
      }
      var avantPhrase = texteSansSource.substring(0, idxDebutPhrase);
      var phrase = texteSansSource.substring(idxDebutPhrase);
      return avantPhrase + '<span class="source-marge">' + contenuSource + '</span>' + phrase;
    }

    function rendreSourcesDiscretes(texte) {
      if (!texte) return texte;
      return texte.replace(/\(source:\s*([^)]+)\)/gi, function(m, contenu) {
        return '<span class="source-discrete">' + contenu.trim() + '</span>';
      });
    }

    function rendreCitations(texte) {
      if (!texte) return texte;
      if (texte.indexOf('"') === -1 && texte.indexOf('“') === -1 && texte.indexOf('”') === -1 && texte.indexOf('«') === -1) return texte;
      texte = texte.replace(/["“]([\s\S]+?)["”]/g, '<em>« $1 »</em>');
      texte = texte.replace(/«\s*([\s\S]+?)\s*»/g, '<em>« $1 »</em>');
      return texte;
    }

    function decouperEnBlocsTexte(buffer) {
      var lignes = buffer.split('\n');
      var blocs = [];
      var courant = '';
      var dansCitation = false;

      function compterGuillemets(ligne) {
        var droits   = (ligne.match(/"/g) || []).length;
        var anglais  = (ligne.match(/[“”]/g) || []).length;
        var francais = (ligne.match(/«/g) || []).length;
        return droits + anglais + francais;
      }

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i].trim();
        if (ligne === '') {
          if (!dansCitation && courant.trim() !== '') { blocs.push(courant.trim()); courant = ''; }
          continue;
        }
        courant = courant === '' ? ligne : courant + '\n' + ligne;
        if (compterGuillemets(ligne) % 2 === 1) dansCitation = !dansCitation;
        if (!dansCitation) {
          if (courant.trim() !== '') blocs.push(courant.trim());
          courant = '';
        }
      }
      if (courant.trim() !== '') blocs.push(courant.trim());
      return blocs;
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateModifComplete(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        var jour    = String(d.getDate()).padStart(2, '0');
        var mois    = String(d.getMonth() + 1).padStart(2, '0');
        var annee   = d.getFullYear();
        var heures  = String(d.getHours()).padStart(2, '0');
        var minutes = String(d.getMinutes()).padStart(2, '0');
        return jour + '/' + mois + '/' + annee + ' à ' + heures + ':' + minutes;
      } catch(e) { return ''; }
    }

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function trouverTexte(texteId, textesDataParam) {
      if (textesDataParam && textesDataParam.length > 0) {
        for (var i = 0; i < textesDataParam.length; i++) {
          if (String(textesDataParam[i].id) === String(texteId)) return textesDataParam[i];
        }
      }
      var tous = DataManager.getTousLesTextes();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(texteId)) return tous[j];
      }
      return null;
    }

    /* ============================================================
       PARSEURS
       ============================================================ */
    function parserQuizs(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A','B','C','D','E','F'];
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
          currentQuiz = { question: ligne.replace(/^q:\s*/i, '').trim() || 'Question', reponses: [] };
        } else if (currentQuiz) {
          var isCorrect = false;
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) { isCorrect = true; texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim(); }
          else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) { texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim(); }
          if (texteRep) currentQuiz.reponses.push({ texte: texteRep || 'Réponse', lettre: lettres[currentQuiz.reponses.length] || '?', correcte: isCorrect });
        }
      }
      if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
      return quizs;
    }

    function parserOrdre(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      var consigne = 'Remettre dans l\'ordre';
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) elements.push(match[2]);
        else if (elements.length === 0 && ligne.length > 0) consigne = ligne.replace(/^o:\s*/i, '').trim() || consigne;
      }
      return { elements: elements, consigne: consigne };
    }

    function parserCartes(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var cartes = [];
      var current = null;
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          if (current) cartes.push(current);
          current = { recto: l.replace(/^r:\s*/i, '').trim(), verso: '' };
        } else if (l.toLowerCase().startsWith('v:') && current) {
          current.verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (current) cartes.push(current);
      return cartes;
    }

    function parserRelier(relierTexte) {
      var lignes = relierTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      if (lignes.length === 0) return null;
      var consigne = lignes[0].replace(/^l:\s*/i, '').trim() || 'Relie les éléments';
      var paires = [];
      for (var i = 1; i < lignes.length; i++) {
        var idx = lignes[i].indexOf('-');
        if (idx === -1) continue;
        var gauche = lignes[i].substring(0, idx).trim();
        var droite = lignes[i].substring(idx + 1).trim();
        if (gauche && droite) paires.push({ gauche: gauche, droite: droite });
      }
      if (paires.length === 0) return null;
      var compteParDroite = {};
      paires.forEach(function(p) { compteParDroite[p.droite] = (compteParDroite[p.droite] || 0) + 1; });
      var droitesUniques = [];
      var dejaVues = {};
      paires.forEach(function(p) {
        if (!dejaVues[p.droite]) {
          dejaVues[p.droite] = true;
          droitesUniques.push({ droite: p.droite, partagee: compteParDroite[p.droite] > 1 });
        }
      });
      for (var j = droitesUniques.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = droitesUniques[j]; droitesUniques[j] = droitesUniques[k]; droitesUniques[k] = tmp;
      }
      return { consigne: consigne, paires: paires, droitesMelangees: droitesUniques };
    }

    function parserTextesTrous(ttTexte) {
      var lignes = ttTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var resultats = [];
      lignes.forEach(function(ligne) {
        if (!/^tt:/i.test(ligne)) return;
        var contenu = ligne.replace(/^tt:\s*/i, '').trim();
        var match = contenu.match(/\/([^\/]+)\//);
        if (!match) return;
        var mot = match[1].trim();
        var idx = contenu.indexOf('/' + mot + '/');
        var avant = contenu.substring(0, idx).trim();
        var apres = contenu.substring(idx + mot.length + 2).trim();
        resultats.push({ avant: avant, mot: mot, apres: apres });
      });
      return resultats;
    }

    function parserVraiFaux(vfTexte) {
      var lignes = vfTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var questions = [];
      lignes.forEach(function(ligne) {
        if (!/^vf:/i.test(ligne)) return;
        var contenu = ligne.replace(/^vf:\s*/i, '').trim();
        var match = contenu.match(/\(([vf])\)\s*$/i);
        if (!match) return;
        var reponse = match[1].toLowerCase();
        var question = contenu.replace(/\s*\([vf]\)\s*$/i, '').trim();
        if (question === '') return;
        questions.push({ question: question, reponse: reponse });
      });
      return questions;
    }

    function parserCopier(copierTexte) {
      if (!copierTexte) return [];
      var lignes = copierTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var blocs = [];
      lignes.forEach(function(ligne) {
        var contenu = ligne.replace(/^c:\s*/i, '').trim();
        if (!contenu) return;
        var mots = contenu.split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m !== ''; });
        if (mots.length > 0) blocs.push({ mots: mots });
      });
      return blocs;
    }

    /* ============================================================
       CONSTRUCTION DES EXERCICES (HTML pour la popup)
       ============================================================ */
    function construireExercicesPourFeuille(blocsOrdonnes) {
      var html = '';
      var exoNum = 0;
      var hasExercice = false;
      var quizCounter = 0, ttCounter = 0, carteCounter = 0, vfCounter = 0;
      var relierCounter = 0, ordreCounter = 0, copierCounter = 0, openCounter = 0;

      var consignesBase = {
        quiz:   { sing: 'Cochez la bonne réponse :',  plur: 'Cochez la bonne réponse :' },
        open:   { sing: 'Répondez à la question :',   plur: 'Répondez aux questions :' },
        tt:     { sing: 'Complétez la phrase :',      plur: 'Complétez les phrases :' },
        vf:     { sing: 'Cochez Vrai ou Faux :',      plur: 'Cochez Vrai ou Faux :' },
        ordre:  { sing: 'Remettez dans l\'ordre :',   plur: 'Remettez dans l\'ordre :' },
        relier: { sing: 'Reliez les éléments :',      plur: 'Reliez les éléments :' },
        copier: { sing: 'Recopiez :',                 plur: 'Recopiez :' }
      };

      var iGroupe = 0;
      while (iGroupe < blocsOrdonnes.length) {
        var blocCourant = blocsOrdonnes[iGroupe];
        var typeCourant = blocCourant.type;
        if (typeCourant === 'texte') { iGroupe++; continue; }
        var nbConsecutifs = 1;
        var jGroupe = iGroupe + 1;
        while (jGroupe < blocsOrdonnes.length && blocsOrdonnes[jGroupe].type === typeCourant) { nbConsecutifs++; jGroupe++; }
        if (typeCourant === 'vf') nbConsecutifs = (nbConsecutifs - 1) + blocCourant.data.length;
        var base = consignesBase[typeCourant];
        if (base) {
          blocCourant._consigne = (nbConsecutifs > 1) ? base.plur : base.sing;
          for (var kGroupe = iGroupe + 1; kGroupe < jGroupe; kGroupe++) blocsOrdonnes[kGroupe]._consigne = '';
        }
        iGroupe = jGroupe;
      }

      function afficherConsigne(bloc) {
        if (bloc._consigne) html += '<div class="consigne-exo">' + bloc._consigne + '</div>';
      }

      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type === 'texte') return;

        if (bloc.type === 'copier') {
          hasExercice = true; exoNum++;
          var copierIdx = copierCounter++;
          exoNumParType.copier[copierIdx] = exoNum;
          var mots = bloc.data.mots;
          html += '<div class="exo" data-copier-idx="' + copierIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">';
          html += '<div class="bloc-copier"><div class="copier-mots">';
          for (var cm = 0; cm < mots.length; cm++) html += '<span class="copier-mot">' + mots[cm] + '</span>';
          html += '</div><div class="copier-ligne-pointillee"></div></div>';
          html += '</span></div>';
          html += '<div class="copier-actions"><button class="copier-btn" data-copier-idx="' + copierIdx + '" onclick="marquerCopie(this)">J\'ai recopié</button></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'quiz') {
          hasExercice = true; exoNum++;
          var q = bloc.data;
          var quizIdx = quizCounter++;
          exoNumParType.quiz[quizIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte">' + q.question + '</span></div>';
          html += '<div class="quiz-reponses" data-quiz-idx="' + quizIdx + '">';
          q.reponses.forEach(function(rep, ri) {
            html += '<span class="quiz-rep interactive" data-quiz-idx="' + quizIdx + '" data-rep-idx="' + ri + '" data-correct="' + (rep.correcte ? '1' : '0') + '" onclick="repondreQuiz(this)">';
            html += '<span class="quiz-case"></span> ' + rep.lettre + '. ' + rep.texte + '</span>';
          });
          html += '</div>';
          html += '<div class="quiz-feedback-exo" id="quizFeedbackExo-' + quizIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'open') {
          hasExercice = true; exoNum++;
          var openIdx = openCounter++;
          exoNumParType.open[openIdx] = exoNum;
          questionsOuvertes.push({ texte: bloc.data, reponse: '', idx: openIdx });
          html += '<div class="exo open-exo" data-open-idx="' + openIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte">' + echapperHtml(bloc.data) + '</span></div>';
          html += '<textarea class="open-textarea" id="openInput-' + openIdx + '" placeholder="Écrivez votre réponse ici..." oninput="majReponseOpen(' + openIdx + ', this.value)"></textarea>';
          html += '<div class="open-actions"><button class="open-btn-valider" id="openBtnValider-' + openIdx + '" onclick="validerOpen(' + openIdx + ')">Valider ma réponse</button></div>';
          html += '<div class="open-feedback" id="openFeedback-' + openIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'tt') {
          hasExercice = true; exoNum++;
          var tt = bloc.data;
          var ttIdx = ttCounter++;
          exoNumParType.tt[ttIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="tt-phrase-print">';
          if (tt.avant) html += tt.avant + ' ';
          html += '<input type="text" class="tt-input" id="ttInput-' + ttIdx + '" data-mot="' + echapperHtml(tt.mot) + '" onkeydown="if(event.key===\'Enter\'){validerTT(' + ttIdx + ');return false;}" onblur="validerTT(' + ttIdx + ')">';
          if (tt.apres) html += ' ' + tt.apres;
          html += '</span></div>';
          html += '<div class="tt-feedback" id="ttFeedback-' + ttIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'vf') {
          hasExercice = true;
          bloc.data.forEach(function(item, idxVf) {
            exoNum++;
            var vfIdx = vfCounter++;
            exoNumParType.vf[vfIdx] = exoNum;
            html += '<div class="exo">';
            if (idxVf === 0) afficherConsigne(bloc);
            html += '<div class="exo-ligne vf-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte-vf">' + item.question + '</span><span class="vf-cases">';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="v" data-correct="' + (item.reponse === 'v' ? '1' : '0') + '" onclick="repondreVF(this)">VRAI</button>';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="f" data-correct="' + (item.reponse === 'f' ? '1' : '0') + '" onclick="repondreVF(this)">FAUX</button>';
            html += '</span></div>';
            html += '<div class="vf-feedback" id="vfFeedback-' + vfIdx + '"></div>';
            html += '</div>';
          });
          return;
        }

        if (bloc.type === 'ordre') {
          hasExercice = true;
          var ordreData = bloc.data;
          var items = ordreData.elements || [];
          var consigne = ordreData.consigne || 'Remettez dans l\'ordre';
          var itemsMelanges = items.slice();
          for (var m = itemsMelanges.length - 1; m > 0; m--) {
            var k = Math.floor(Math.random() * (m + 1));
            var tmp = itemsMelanges[m]; itemsMelanges[m] = itemsMelanges[k]; itemsMelanges[k] = tmp;
          }
          exoNum++;
          var ordreIdx = ordreCounter++;
          exoNumParType.ordre[ordreIdx] = exoNum;
          html += '<div class="exo ordre-exo" data-ordre-idx="' + ordreIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte">' + consigne + '</span></div>';
          html += '<div class="ordre-grille" id="ordreGrille-' + ordreIdx + '" data-ordre-idx="' + ordreIdx + '">';
          itemsMelanges.forEach(function(item, i) {
            html += '<div class="ordre-item" draggable="true" data-ordre-idx="' + ordreIdx + '" data-original="' + i + '">';
            html += '<span class="ordre-grip">⋮⋮</span><span class="ordre-num">' + (i + 1) + '</span><span class="ordre-texte">' + item + '</span>';
            html += '</div>';
          });
          html += '</div>';
          html += '<div class="ordre-actions"><button class="ordre-btn-valider" id="ordreBtnValider-' + ordreIdx + '" onclick="validerOrdre(' + ordreIdx + ')">Valider l\'ordre</button></div>';
          html += '<div class="ordre-resultat" id="ordreResultat-' + ordreIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'carte') {
          hasExercice = true; exoNum++;
          var c = bloc.data;
          var carteIdx = carteCounter++;
          exoNumParType.carte[carteIdx] = exoNum;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte">' + c.recto + '</span></div>';
          html += '<div class="carte-actions"><button class="carte-btn-voir" data-carte-idx="' + carteIdx + '" onclick="voirCarteReponse(this)">Voir la réponse</button></div>';
          html += '<div class="carte-reponse-cachee" id="carteRep-' + carteIdx + '">' + echapperHtml(c.verso) + '</div>';
          html += '<div class="carte-choix" id="carteChoix-' + carteIdx + '">';
          html += '<button class="trouve" data-carte-idx="' + carteIdx + '" data-choix="trouve" onclick="carteTrouvePasTrouve(this)">✓ J\'ai trouvé</button>';
          html += '<button class="pas-trouve" data-carte-idx="' + carteIdx + '" data-choix="pas-trouve" onclick="carteTrouvePasTrouve(this)">✗ Pas trouvé</button>';
          html += '</div></div>';
          return;
        }

        if (bloc.type === 'relier') {
          hasExercice = true;
          var relierData = bloc.data;
          var relierIdx = relierCounter++;
          exoNum++;
          exoNumParType.relier[relierIdx] = exoNum;
          var paires = relierData.paires || [];
          var droitesMelangees = relierData.droitesMelangees || [];
          html += '<div class="exo relier-exo" data-relier-idx="' + relierIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne"><span class="exo-num-inline">' + exoNum + '</span><span class="exo-texte">' + relierData.consigne + '</span></div>';
          html += '<div class="relier-zone" id="relierZone-' + relierIdx + '">';
          html += '<div class="relier-grid">';
          html += '<div class="relier-colonne gauche">';
          paires.forEach(function(p, i) {
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="gauche" data-idx="' + i + '" onclick="selectionnerRelier(' + relierIdx + ', \'gauche\', ' + i + ')">';
            html += '<span class="texte">' + p.gauche + '</span><span class="point"></span></div>';
          });
          html += '</div><div class="relier-colonne droite">';
          droitesMelangees.forEach(function(d, i) {
            var classePoint = d.partagee ? 'point point-partage' : 'point';
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="droite" data-idx="' + i + '" data-droite-texte="' + echapperHtml(d.droite) + '" onclick="selectionnerRelier(' + relierIdx + ', \'droite\', ' + i + ')">';
            html += '<span class="' + classePoint + '"></span><span class="texte">' + d.droite + '</span></div>';
          });
          html += '</div></div></div>';
          html += '<div class="relier-resultat" id="relierResultat-' + relierIdx + '"></div>';
          html += '</div>';
          return;
        }
      });

      if (!hasExercice) return '';
      return '<div class="exercices-zone"><div class="titre-exercices">Exercices</div>' + html + '</div>';
    }

    /* ============================================================
       INTERACTIONS (inchangées)
       ============================================================ */
    function repondreQuiz(el) {
      var quizIdx = el.getAttribute('data-quiz-idx');
      var repIdx = el.getAttribute('data-rep-idx');
      var correct = el.getAttribute('data-correct') === '1';
      if (reponsesTexte.quiz[quizIdx]) return;
      reponsesTexte.quiz[quizIdx] = { choix: repIdx, correct: correct };
      var parent = el.parentElement;
      var reps = parent.querySelectorAll('.quiz-rep');
      reps.forEach(function(r) { r.classList.remove('interactive'); r.style.pointerEvents = 'none'; });
      el.classList.add(correct ? 'correct' : 'incorrect');
      var feedback = document.getElementById('quizFeedbackExo-' + quizIdx);
      if (feedback) {
        if (correct) feedback.textContent = 'Bonne réponse.';
        else {
          var bonne = parent.querySelector('.quiz-rep[data-correct="1"]');
          var texteBonne = bonne ? bonne.textContent.trim() : '';
          feedback.textContent = 'La bonne réponse était : ' + texteBonne;
          if (bonne) bonne.classList.add('correct');
        }
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    function repondreVF(btn) {
      var vfIdx = btn.getAttribute('data-vf-idx');
      var choix = btn.getAttribute('data-choix');
      var correct = btn.getAttribute('data-correct') === '1';
      if (reponsesTexte.vf[vfIdx]) return;
      reponsesTexte.vf[vfIdx] = { choix: choix, correct: correct };
      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('.vf-btn');
      boutons.forEach(function(b) { b.disabled = true; });
      btn.classList.add(correct ? 'vf-ok' : 'vf-ko');
      if (!correct) boutons.forEach(function(b) { if (b.getAttribute('data-correct') === '1') b.classList.add('vf-ok'); });
      var feedback = document.getElementById('vfFeedback-' + vfIdx);
      if (feedback) feedback.textContent = correct ? 'Correct.' : 'Incorrect.';
      majNoteGlobale();
      verifierQuizTermine();
    }

    function validerTT(ttIdx) {
      var input = document.getElementById('ttInput-' + ttIdx);
      if (!input || reponsesTexte.tt[ttIdx]) return;
      var saisi = input.value.trim();
      if (saisi === '') return;
      var motAttendu = input.getAttribute('data-mot') || '';
      var correct = normaliserComparaison(saisi) === normaliserComparaison(motAttendu);
      reponsesTexte.tt[ttIdx] = { saisi: saisi, correct: correct };
      input.classList.add(correct ? 'tt-ok' : 'tt-ko');
      input.disabled = true;
      var feedback = document.getElementById('ttFeedback-' + ttIdx);
      if (feedback) feedback.textContent = correct ? 'Bonne réponse.' : 'La bonne réponse était : « ' + motAttendu + ' »';
      majNoteGlobale();
      verifierQuizTermine();
    }

    function voirCarteReponse(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var rep = document.getElementById('carteRep-' + carteIdx);
      var choix = document.getElementById('carteChoix-' + carteIdx);
      if (rep) rep.classList.add('visible');
      if (choix) choix.classList.add('visible');
      btn.style.display = 'none';
    }

    function carteTrouvePasTrouve(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var choix = btn.getAttribute('data-choix');
      if (reponsesTexte.cartes[carteIdx] !== undefined) return;
      reponsesTexte.cartes[carteIdx] = (choix === 'trouve');
      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('button');
      boutons.forEach(function(b) { b.disabled = true; });
      btn.classList.add('actif');
      majNoteGlobale();
      verifierQuizTermine();
    }

    function marquerCopie(btn) {
      var copierIdx = btn.getAttribute('data-copier-idx');
      if (reponsesTexte.copier[copierIdx] !== undefined) return;
      reponsesTexte.copier[copierIdx] = true;
      btn.classList.add('actif');
      btn.disabled = true;
      btn.textContent = '✓ Recopié';
      majNoteGlobale();
      verifierQuizTermine();
    }

    function majReponseOpen(openIdx, valeur) {
      for (var i = 0; i < questionsOuvertes.length; i++) {
        if (questionsOuvertes[i].idx === openIdx) { questionsOuvertes[i].reponse = valeur; break; }
      }
    }

    function validerOpen(openIdx) {
      if (reponsesTexte.open[openIdx] !== undefined) return;
      var q = null;
      for (var i = 0; i < questionsOuvertes.length; i++) {
        if (questionsOuvertes[i].idx === openIdx) { q = questionsOuvertes[i]; break; }
      }
      if (!q) return;
      var saisi = (q.reponse || '').trim();
      if (saisi === '') {
        var fbVide = document.getElementById('openFeedback-' + openIdx);
        if (fbVide) fbVide.textContent = 'Veuillez écrire une réponse avant de valider.';
        return;
      }
      reponsesTexte.open[openIdx] = { texte: q.texte, reponse: saisi, valide: true };
      var input = document.getElementById('openInput-' + openIdx);
      var btn = document.getElementById('openBtnValider-' + openIdx);
      var fb = document.getElementById('openFeedback-' + openIdx);
      if (input) { input.disabled = true; input.classList.add('open-ok'); }
      if (btn) { btn.disabled = true; btn.textContent = '✓ Validée'; btn.classList.add('actif'); }
      if (fb) fb.textContent = 'Réponse enregistrée.';
      majNoteGlobale();
      verifierQuizTermine();
    }

    var relierState = {};
    function initRelierState(relierIdx) {
      if (!relierState[relierIdx]) relierState[relierIdx] = { associations: {}, selection: null, mapPaires: null };
      return relierState[relierIdx];
    }
    function setRelierPaires(relierIdx, mapPaires) {
      var st = initRelierState(relierIdx);
      st.mapPaires = mapPaires;
    }

    function selectionnerRelier(relierIdx, cote, idx) {
      var st = initRelierState(relierIdx);
      if (st.valide) return;
      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;
      var item = exoEl.querySelector('.relier-item[data-cote="' + cote + '"][data-idx="' + idx + '"]');
      if (!item) return;
      if (item.classList.contains('associe')) return;
      var sel = st.selection;
      if (!sel) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      if (sel.cote === cote) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      var gaucheIdx = sel.cote === 'gauche' ? sel.idx : idx;
      var droiteIdx = sel.cote === 'droite' ? sel.idx : idx;
      var droiteEl = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + droiteIdx + '"]');
      if (droiteEl && droiteEl.classList.contains('associe')) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }
      var gaucheEl = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gaucheIdx + '"]');
      st.associations[gaucheIdx] = droiteIdx;
      if (gaucheEl) { gaucheEl.classList.remove('selectionne'); gaucheEl.classList.add('associe'); }
      if (droiteEl) { droiteEl.classList.remove('selectionne'); droiteEl.classList.add('associe'); }
      st.selection = null;
      var totalPaires = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]').length;
      var nbAssociees = Object.keys(st.associations).length;
      if (nbAssociees >= totalPaires) validerRelier(relierIdx);
    }

    function validerRelier(relierIdx) {
      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;
      var st = initRelierState(relierIdx);
      var mapPaires = st.mapPaires;
      if (!mapPaires) return;
      var itemsGauche = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]');
      var total = itemsGauche.length;
      var bonnes = 0;
      exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });
      for (var gIdx in st.associations) {
        var dIdx = st.associations[gIdx];
        var texteGauche = itemsGauche[parseInt(gIdx)].querySelector('.texte').textContent.trim();
        var itemDroite = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
        var texteDroite = itemDroite ? itemDroite.getAttribute('data-droite-texte') : '';
        var bonne = (mapPaires[texteGauche] === texteDroite);
        if (bonne) bonnes++;
        else {
          var elG = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gIdx + '"]');
          var elD = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
          if (elG) elG.classList.add('erreur');
          if (elD) elD.classList.add('erreur');
        }
      }
      var resultat = document.getElementById('relierResultat-' + relierIdx);
      var correct = (bonnes === total);
      reponsesTexte.relier[relierIdx] = { valide: correct, bonnes: bonnes, total: total };
      if (correct) {
        st.valide = true;
        if (resultat) resultat.textContent = 'Toutes les associations sont correctes.';
      } else {
        if (resultat) resultat.textContent = bonnes + '/' + total + ' associations correctes. Réessayez.';
        setTimeout(function() {
          exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });
          st.associations = {}; st.selection = null;
          exoEl.querySelectorAll('.relier-item.associe, .relier-item.selectionne').forEach(function(el) { el.classList.remove('associe', 'selectionne'); });
          if (resultat) resultat.textContent = '';
        }, 1500);
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    var ordreState = {};
    function initOrdreState(ordreIdx) {
      if (!ordreState[ordreIdx]) ordreState[ordreIdx] = { valide: false, ordreInitial: null };
      return ordreState[ordreIdx];
    }

    function initDragAndDropOrdre() {
      var grilles = document.querySelectorAll('.ordre-grille');
      grilles.forEach(function(grille) {
        var ordreIdx = grille.getAttribute('data-ordre-idx');
        var st = initOrdreState(ordreIdx);
        var items = grille.querySelectorAll('.ordre-item');
        var ordre = [];
        items.forEach(function(it) { ordre.push(it.querySelector('.ordre-texte').textContent.trim()); });
        st.ordreInitial = ordre;

        items.forEach(function(item) {
          item.addEventListener('dragstart', function(e) {
            if (st.valide) { e.preventDefault(); return; }
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
          });
          item.addEventListener('dragend', function() {
            item.classList.remove('dragging');
            grille.querySelectorAll('.ordre-item').forEach(function(el) { el.classList.remove('drag-over'); });
          });
          item.addEventListener('dragover', function(e) {
            e.preventDefault();
            if (st.valide) return;
            e.dataTransfer.dropEffect = 'move';
          });
          item.addEventListener('dragenter', function(e) {
            e.preventDefault();
            if (st.valide) return;
            if (!item.classList.contains('dragging')) item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', function() { item.classList.remove('drag-over'); });
          item.addEventListener('drop', function(e) {
            e.preventDefault();
            if (st.valide) return;
            item.classList.remove('drag-over');
            var dragging = grille.querySelector('.ordre-item.dragging');
            if (!dragging || dragging === item) return;
            var allItems = Array.from(grille.querySelectorAll('.ordre-item'));
            var dragIdx = allItems.indexOf(dragging);
            var dropIdx = allItems.indexOf(item);
            if (dragIdx < dropIdx) grille.insertBefore(dragging, item.nextSibling);
            else grille.insertBefore(dragging, item);
            renumOrdre(grille);
            var res = document.getElementById('ordreResultat-' + ordreIdx);
            if (res) res.textContent = '';
          });
        });
      });
    }

    function renumOrdre(grille) {
      var items = grille.querySelectorAll('.ordre-item');
      items.forEach(function(el, idx) {
        var num = el.querySelector('.ordre-num');
        if (num) num.textContent = (idx + 1);
      });
    }

    function validerOrdre(ordreIdx) {
      var grille = document.getElementById('ordreGrille-' + ordreIdx);
      if (!grille) return;
      var st = initOrdreState(ordreIdx);
      if (st.valide) return;

      var items = grille.querySelectorAll('.ordre-item');
      var ordreActuel = [];
      items.forEach(function(it) { ordreActuel.push(it.querySelector('.ordre-texte').textContent.trim()); });

      var positionsOriginales = [];
      items.forEach(function(it) {
        positionsOriginales.push({ texte: it.querySelector('.ordre-texte').textContent.trim(), original: parseInt(it.getAttribute('data-original')) });
      });
      positionsOriginales.sort(function(a, b) { return a.original - b.original; });
      var ordreCorrect = positionsOriginales.map(function(p) { return p.texte; });

      var bonnes = 0;
      for (var i = 0; i < ordreActuel.length; i++) if (ordreActuel[i] === ordreCorrect[i]) bonnes++;
      var correct = (bonnes === ordreActuel.length);
      var resultat = document.getElementById('ordreResultat-' + ordreIdx);
      var btnValider = document.getElementById('ordreBtnValider-' + ordreIdx);

      reponsesTexte.ordre[ordreIdx] = { valide: correct, bonnes: bonnes, total: ordreActuel.length };

      if (correct) {
        st.valide = true;
        if (resultat) resultat.textContent = 'Tous les éléments sont bien placés.';
        if (btnValider) btnValider.disabled = true;
        grille.querySelectorAll('.ordre-item').forEach(function(it) { it.setAttribute('draggable', 'false'); it.style.cursor = 'default'; });
      } else {
        if (resultat) resultat.textContent = bonnes + '/' + ordreActuel.length + ' bien placés. Réessayez.';
        setTimeout(function() { if (resultat) resultat.textContent = ''; }, 1500);
      }
      majNoteGlobale();
      verifierQuizTermine();
    }

    function calculerNote() {
      var note = {
        quiz:   { bonnes: 0, total: Object.keys(reponsesTexte.quiz).length },
        vf:     { bonnes: 0, total: Object.keys(reponsesTexte.vf).length },
        tt:     { bonnes: 0, total: Object.keys(reponsesTexte.tt).length },
        cartes: { bonnes: 0, total: Object.keys(reponsesTexte.cartes).length },
        relier: { bonnes: 0, total: 0 },
        ordre:  { bonnes: 0, total: 0 },
        copier: { bonnes: 0, total: Object.keys(reponsesTexte.copier).length },
        open:   { bonnes: 0, total: Object.keys(reponsesTexte.open).length },
        total:  { bonnes: 0, total: 0 }
      };
      Object.keys(reponsesTexte.quiz).forEach(function(k) { if (reponsesTexte.quiz[k].correct) note.quiz.bonnes++; });
      Object.keys(reponsesTexte.vf).forEach(function(k) { if (reponsesTexte.vf[k].correct) note.vf.bonnes++; });
      Object.keys(reponsesTexte.tt).forEach(function(k) { if (reponsesTexte.tt[k].correct) note.tt.bonnes++; });
      Object.keys(reponsesTexte.cartes).forEach(function(k) { if (reponsesTexte.cartes[k] === true) note.cartes.bonnes++; });
      Object.keys(reponsesTexte.copier).forEach(function(k) { if (reponsesTexte.copier[k] === true) note.copier.bonnes++; });
      Object.keys(reponsesTexte.open).forEach(function(k) { if (reponsesTexte.open[k].valide) note.open.bonnes++; });
      Object.keys(reponsesTexte.relier).forEach(function(k) { var r = reponsesTexte.relier[k]; note.relier.total += r.total; note.relier.bonnes += r.bonnes; });
      Object.keys(reponsesTexte.ordre).forEach(function(k) { var r = reponsesTexte.ordre[k]; note.ordre.total += r.total; note.ordre.bonnes += r.bonnes; });

      note.total.bonnes = note.quiz.bonnes + note.vf.bonnes + note.tt.bonnes + note.cartes.bonnes
                        + note.relier.bonnes + note.ordre.bonnes + note.copier.bonnes + note.open.bonnes;
      note.total.total  = note.quiz.total  + note.vf.total  + note.tt.total  + note.cartes.total
                        + note.relier.total  + note.ordre.total  + note.copier.total + note.open.total;
      return note;
    }

    function majNoteGlobale() {
      var note = calculerNote();
      var lignes = [];
      if (note.quiz.total > 0)   lignes.push({ label: 'Quiz',                b: note.quiz.bonnes,   t: note.quiz.total });
      if (note.vf.total > 0)     lignes.push({ label: 'Vrai / Faux',         b: note.vf.bonnes,     t: note.vf.total });
      if (note.tt.total > 0)     lignes.push({ label: 'Textes à trous',      b: note.tt.bonnes,     t: note.tt.total });
      if (note.cartes.total > 0) lignes.push({ label: 'Cartes',              b: note.cartes.bonnes, t: note.cartes.total });
      if (note.relier.total > 0) lignes.push({ label: 'Relier',              b: note.relier.bonnes, t: note.relier.total });
      if (note.ordre.total > 0)  lignes.push({ label: 'Ordre',               b: note.ordre.bonnes,  t: note.ordre.total });
      if (note.copier.total > 0) lignes.push({ label: 'Copier',              b: note.copier.bonnes, t: note.copier.total });
      if (note.open.total > 0)   lignes.push({ label: 'Questions ouvertes',  b: note.open.bonnes,   t: note.open.total });

      var html = '';
      if (lignes.length === 0) html = '<div class="note-ligne"><span class="note-label">Aucune réponse pour le moment.</span></div>';
      else lignes.forEach(function(l) {
        html += '<div class="note-ligne"><span class="note-label">' + l.label + '</span><span class="note-valeur">' + l.b + ' / ' + l.t + '</span></div>';
      });

      var el = document.getElementById('noteLignes');
      if (el) el.innerHTML = html;
      var totalEl = document.getElementById('noteTotalValeur');
      if (totalEl) totalEl.textContent = note.total.bonnes + ' / ' + note.total.total;

      var btnRevoir = document.getElementById('btnRevoir');
      if (btnRevoir && note.total.total > 0) {
        var pct = (note.total.bonnes / note.total.total) * 100;
        btnRevoir.style.display = (pct < 60) ? 'inline-block' : 'none';
      }
    }

    var popupOuverte = false;

    function verifierQuizTermine() {
      if (popupOuverte) return;
      var totalExos = Object.keys(exoNumParType.quiz).length
                    + Object.keys(exoNumParType.vf).length
                    + Object.keys(exoNumParType.tt).length
                    + Object.keys(exoNumParType.carte).length
                    + Object.keys(exoNumParType.relier).length
                    + Object.keys(exoNumParType.ordre).length
                    + Object.keys(exoNumParType.copier).length
                    + Object.keys(exoNumParType.open).length;
      if (totalExos === 0) return;
      var faits = Object.keys(reponsesTexte.quiz).length
                + Object.keys(reponsesTexte.vf).length
                + Object.keys(reponsesTexte.tt).length
                + Object.keys(reponsesTexte.cartes).length
                + Object.keys(reponsesTexte.relier).length
                + Object.keys(reponsesTexte.ordre).length
                + Object.keys(reponsesTexte.copier).length
                + Object.keys(reponsesTexte.open).length;
      if (faits >= totalExos) {
        if (!envoiEffectue) envoyerToutesReponses(true);
        ouvrirPopupResultat();
      }
    }

    function ouvrirPopupResultat() {
      popupOuverte = true;
      var note = calculerNote();
      var lignes = [];
      if (note.quiz.total > 0)   lignes.push({ label: 'Quiz',                b: note.quiz.bonnes,   t: note.quiz.total });
      if (note.vf.total > 0)     lignes.push({ label: 'Vrai / Faux',         b: note.vf.bonnes,     t: note.vf.total });
      if (note.tt.total > 0)     lignes.push({ label: 'Textes à trous',      b: note.tt.bonnes,     t: note.tt.total });
      if (note.cartes.total > 0) lignes.push({ label: 'Cartes',              b: note.cartes.bonnes, t: note.cartes.total });
      if (note.relier.total > 0) lignes.push({ label: 'Relier',              b: note.relier.bonnes, t: note.relier.total });
      if (note.ordre.total > 0)  lignes.push({ label: 'Ordre',               b: note.ordre.bonnes,  t: note.ordre.total });
      if (note.copier.total > 0) lignes.push({ label: 'Copier',              b: note.copier.bonnes, t: note.copier.total });
      if (note.open.total > 0)   lignes.push({ label: 'Questions ouvertes',  b: note.open.bonnes,   t: note.open.total });

      var html = '';
      lignes.forEach(function(l) {
        html += '<div class="popup-note-ligne"><span class="note-label">' + l.label + '</span><span class="note-valeur">' + l.b + ' / ' + l.t + '</span></div>';
      });
      document.getElementById('popupNoteLignes').innerHTML = html;
      document.getElementById('popupNoteTotal').textContent = note.total.bonnes + ' / ' + note.total.total;
      document.getElementById('popupResultatOverlay').classList.add('visible');
    }

    function fermerPopupResultat() {
      document.getElementById('popupResultatOverlay').classList.remove('visible');
      popupOuverte = false;
    }

    function envoyerToutesReponses(silencieux) {
      if (envoiEffectue) return Promise.resolve();
      var nom = getNomUtilisateurCourant();
      var texteId = texteActuel ? texteActuel.id : '';
      var titre = texteActuel ? texteActuel.titre : '';
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      var quizTotal = 0, quizBonnes = 0, choixQcmArr = [];
      Object.keys(reponsesTexte.quiz).forEach(function(k) {
        quizTotal++;
        var r = reponsesTexte.quiz[k];
        if (r.correct) quizBonnes++;
        choixQcmArr.push((r.correct ? 'V' : 'F') + ':' + (parseInt(r.choix) + 1));
      });
      var choixQcm = choixQcmArr.join('|');

      var vfTotal = 0, vfBonnes = 0;
      Object.keys(reponsesTexte.vf).forEach(function(k) { vfTotal++; if (reponsesTexte.vf[k].correct) vfBonnes++; });
      var ttTotal = 0, ttBonnes = 0;
      Object.keys(reponsesTexte.tt).forEach(function(k) { ttTotal++; if (reponsesTexte.tt[k].correct) ttBonnes++; });
      var cartesTotal = 0, cartesBonnes = 0, cartesStr = [];
      Object.keys(reponsesTexte.cartes).forEach(function(k) {
        cartesTotal++;
        if (reponsesTexte.cartes[k] === true) cartesBonnes++;
        cartesStr.push(reponsesTexte.cartes[k] ? '1' : '0');
      });
      var relierTotal = 0, relierBonnes = 0;
      Object.keys(reponsesTexte.relier).forEach(function(k) {
        var r = reponsesTexte.relier[k];
        relierTotal += r.total; relierBonnes += r.bonnes;
      });
      var ordreTotal = 0, ordreBonnes = 0;
      Object.keys(reponsesTexte.ordre).forEach(function(k) {
        var r = reponsesTexte.ordre[k];
        ordreTotal += r.total; ordreBonnes += r.bonnes;
      });
      var copierTotal = 0, copierBonnes = 0;
      Object.keys(reponsesTexte.copier).forEach(function(k) { copierTotal++; if (reponsesTexte.copier[k] === true) copierBonnes++; });
      var openTotal = 0, openBonnes = 0, questionsOuvertesRep = [];
      Object.keys(reponsesTexte.open).forEach(function(k) {
        openTotal++;
        var r = reponsesTexte.open[k];
        if (r.valide) openBonnes++;
        questionsOuvertesRep.push('Q' + (parseInt(k) + 1) + ': ' + (r.reponse || ''));
      });
      var reponseOuverteFinale = questionsOuvertesRep.join('\n\n');

      var details = {
        quiz:   { bonnes: quizBonnes,   total: quizTotal,   choix: choixQcm },
        vf:     { bonnes: vfBonnes,     total: vfTotal },
        tt:     { bonnes: ttBonnes,     total: ttTotal },
        cartes: { bonnes: cartesBonnes, total: cartesTotal, reponses: cartesStr.join(',') },
        relier: { bonnes: relierBonnes, total: relierTotal },
        ordre:  { bonnes: ordreBonnes,  total: ordreTotal },
        copier: { bonnes: copierBonnes, total: copierTotal },
        open:   { bonnes: openBonnes,   total: openTotal }
      };

      var noteGlobale = calculerNote();
      var url = base + '?action=saveTentative'
        + '&nom=' + encodeURIComponent(nom)
        + '&texteId=' + encodeURIComponent(texteId)
        + '&titre=' + encodeURIComponent(titre)
        + '&bonnes=' + noteGlobale.total.bonnes
        + '&total=' + noteGlobale.total.total
        + '&choixQcm=' + encodeURIComponent(choixQcm)
        + '&reponseOuverte=' + encodeURIComponent(reponseOuverteFinale)
        + '&details=' + encodeURIComponent(JSON.stringify(details));

      var promesse = fetch(url).then(function(r) { return r.json(); }).then(function() {
        envoiEffectue = true;
        if (texteActuel) verifierValidationTexte(texteActuel);
      }).catch(function() {});

      if (!silencieux) {
        var statut = document.getElementById('envoiStatut');
        if (statut) {
          statut.textContent = 'Envoi en cours...';
          promesse.then(function() { statut.textContent = '✓ Réponses envoyées.'; })
                  .catch(function() { statut.textContent = 'Erreur d\'envoi.'; });
        }
      }
      return promesse;
    }

    function relireEtRefaire() {
      reponsesTexte = { quiz: {}, vf: {}, tt: {}, cartes: {}, relier: {}, ordre: {}, copier: {}, open: {} };
      questionsOuvertes = []; relierState = {}; ordreState = {};
      exoNumParType = { quiz: {}, vf: {}, tt: {}, relier: {}, carte: {}, ordre: {}, copier: {}, open: {} };
      envoiEffectue = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(function() { window.location.reload(); }, 300);
    }

    function verifierValidationTexte(texte) {
      var nom = getNomUtilisateurCourant();
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

    function verifierVersionParenthese(texte) {

      var alt = null;
      var titrePrincipal = texte.titre;
      for (var i = 0; i < tous.length; i++) {

        if (!t.titre) continue;
        var re = new RegExp('^' + echapperRegexPourRegex(titrePrincipal) + '\\s*\\(([^)]+)\\)\\s*$');
        var m = t.titre.match(re);
        if (m) { alt = { id: t.id, titre: t.titre, suffixe: m[1].trim() }; break; }
      }
      if (alt) {
        document.querySelectorAll('.btn-imprimer-alternative').forEach(function(btn) {
          btn.textContent = 'Imprimer la version ' + alt.suffixe;
          btn.style.display = 'inline-block';

        window._altTexteId = alt.id;
        window._altTexteTitre = alt.titre;
        window._altTexteSuffixe = alt.suffixe;

      DataManager.getTexteAsync(window._altTexteId).then(function(texteAlt) {
