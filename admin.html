<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <link rel="stylesheet" href="/medit/article.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; letter-spacing: 0.2px; display: flex; flex-direction: column; background: #f3f0e9; overflow-y: auto; }
    a { text-decoration: none; color: inherit; }

    .page { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; flex: 1; width: 100%; overflow-y: auto; }

    .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #d1ccc4; }
    .header-admin h1 { font-size: 28px; font-weight: 400; font-family: 'Georgia', serif; color: #2c2c2c; }
    .header-admin .btn-ajout { padding: 8px 20px; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 13px; cursor: pointer; background: transparent; color: #2c2c2c; font-family: 'Segoe UI', sans-serif; }
    .header-admin .btn-ajout:hover { background: #e8e5e0; }

    .stats-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; border-radius: 4px; padding: 14px 24px; margin-bottom: 24px; border: 1px solid #d1ccc4; background: #f3f0e9; }
    .stats-ligne .stat-item { display: flex; align-items: baseline; gap: 4px; font-size: 13px; color: #6b7a8a; }
    .stats-ligne .stat-item .nombre { font-size: 22px; font-weight: 600; color: #2c2c2c; font-family: 'Georgia', serif; }
    .stats-ligne .sep { color: #d1ccc4; font-size: 18px; }
        /* ============================================================
       FILTRES CATÉGORIES - style identique à mes-textes
       ============================================================ */
    .filtres-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 4px 0; }
    .filtre-cat-btn { padding: 6px 18px; background: transparent; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 13px; color: #6b7a8a; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
    .filtre-cat-btn:hover { background: #e8e5e0; color: #2c2c2c; }
    .filtre-cat-btn.active { background: #2c2c2c; color: #f3f0e9; border-color: #2c2c2c; }
    .filtre-cat-btn .compteur-cat { display: inline-block; font-size: 11px; font-weight: 600; margin-left: 4px; }
    .filtre-cat-btn.active .compteur-cat { color: #f3f0e9; }

    .tabs-container { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 24px; padding: 4px 0; border-bottom: 1px solid #d1ccc4; }
    .tab-btn { padding: 10px 28px; background: transparent; border: none; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; color: #6b7a8a; cursor: pointer; font-family: 'Segoe UI', sans-serif; border-radius: 0; }
    .tab-btn:hover { color: #2c2c2c; background: #e8e5e0; }
    .tab-btn.active { color: #2c2c2c; border-bottom-color: #2c2c2c; font-weight: 600; }
    .tab-btn .compteur-tab { display: inline-block; background: #e8e5e0; color: #6b7a8a; font-size: 11px; font-weight: 600; padding: 0 10px; border-radius: 30px; margin-left: 6px; line-height: 20px; }
    .tab-btn.active .compteur-tab { background: #e8e5e0; color: #2c2c2c; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grille { display: flex; flex-direction: column; gap: 10px; }
    .carte-post { border-radius: 4px; padding: 16px 22px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; border: 1px solid #d1ccc4; background: #f3f0e9; }
    .carte-post .infos { display: flex; flex-direction: column; gap: 4px; }
    .carte-post .titre { font-size: 17px; font-weight: 500; font-family: 'Georgia', serif; color: #2c2c2c; }
    .carte-post .meta { font-size: 12px; color: #6b7a8a; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .carte-post .meta .badge { padding: 1px 10px; border-radius: 30px; font-size: 11px; font-weight: 500; display: inline-block; background: #e8e5e0; color: #6b7a8a; }
    .carte-post .meta .badge.publie { background: #e8e5e0; color: #2c2c2c; }
    .carte-post .meta .badge.brouillon { background: #e8e5e0; color: #6b7a8a; }
    .carte-post .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .carte-post .actions button { padding: 6px 14px; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 12px; cursor: pointer; background: transparent; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; }
    .carte-post .actions button:hover { background: #e8e5e0; color: #2c2c2c; }
    .carte-post .actions .btn-supprimer:hover { background: #f5f0eb; color: #6b7a8a; }

    .loader { text-align: center; padding: 60px 20px; color: #b8b0a8; }
    .loader .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #d1ccc4; border-top-color: #2c2c2c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide { text-align: center; padding: 60px 20px; border: 1px solid #d1ccc4; border-radius: 4px; background: #f3f0e9; }
    .vide .icone { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .vide h2 { font-size: 20px; font-weight: 400; font-family: 'Georgia', serif; color: #2c2c2c; margin-bottom: 4px; }
    .vide p { color: #b8b0a8; font-size: 15px; }

    /* MODAL TEXTE */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); }
    .modal-overlay.visible { display: flex; }
    .modal-contenu.ajout-post { background: #f3f0e9; border: 1px solid #d1ccc4; border-radius: 4px; max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 28px 32px; font-family: 'Segoe UI', sans-serif; position: relative; }
    .modal-contenu.ajout-post .modal-close { position: absolute; top: 10px; right: 14px; background: transparent; border: none; font-size: 22px; color: #6b7a8a; cursor: pointer; line-height: 1; }
    .modal-contenu.ajout-post .modal-close:hover { color: #2c2c2c; }
    .modal-contenu.ajout-post h3 { font-size: 24px; font-weight: 400; font-family: 'Georgia', serif; color: #2c2c2c; margin-bottom: 16px; }

    .row-compact { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
    .row-compact input, .row-compact select { padding: 6px 10px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 13px; font-family: 'Segoe UI', sans-serif; background: #faf8f5; color: #2c2c2c; }
    .row-compact input[type="date"] { width: auto; }
    .row-compact input[type="text"] { flex: 1; min-width: 120px; }
    .row-compact select { width: auto; }

    .section-title { font-size: 13px; color: #6b7a8a; letter-spacing: 0.5px; margin: 12px 0 4px 0; }

    /* SLIDES - DRAG & DROP */
    .slides-list { margin: 8px 0; min-height: 30px; }
    .slide-item { padding: 6px 0; border-bottom: 1px solid #e8e5e0; color: #2c2c2c; font-family: 'Georgia', serif; font-size: 15px; line-height: 1.5; cursor: grab; display: flex; align-items: center; justify-content: space-between; }
    .slide-item:last-child { border-bottom: none; }
    .slide-item.dragging { opacity: 0.4; }
    .slide-item.drag-over { border-bottom: 2px solid #2c2c2c; }
    .slide-item .slide-handle { color: #b8b0a8; font-size: 16px; margin-right: 8px; cursor: grab; }
    .slide-item .slide-placeholder { color: #b8b0a8; font-style: italic; }
    .slide-item .slide-texte { flex: 1; cursor: pointer; }
    .slide-item .btn-del-slide { background: transparent; border: none; color: #6b7a8a; cursor: pointer; font-size: 14px; }
    .slide-item .btn-del-slide:hover { color: #2c2c2c; }

    /* SLIDE IDÉE (italique + gris) */
    .slide-item.idee .slide-texte { font-style: italic; color: #b8b0a8; }

    .btn-composer { padding: 6px 16px; background: transparent; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 13px; cursor: pointer; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; margin: 4px 0; }
    .btn-composer:hover { background: #e8e5e0; color: #2c2c2c; }

    /* QUIZ */
    .quiz-list { margin: 8px 0; }
    .quiz-item { padding: 4px 0; border-bottom: 1px solid #e8e5e0; font-size: 14px; color: #2c2c2c; position: relative; }
    .quiz-item:last-child { border-bottom: none; }
    .quiz-item .q-text { width: 100%; padding: 4px 0; border: none; background: transparent; font-size: 14px; font-family: 'Georgia', serif; color: #2c2c2c; }
    .quiz-item .q-text:focus { outline: none; background: rgba(0,0,0,0.02); }
    .quiz-item .quiz-reponses { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 2px 0; align-items: center; }
    .quiz-item .quiz-reponses input { flex: 1; min-width: 60px; padding: 2px 6px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 13px; background: #faf8f5; color: #2c2c2c; }
    .quiz-item .vf-group { display: flex; gap: 2px; }
    .quiz-item .vf-btn { padding: 2px 10px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer; background: #faf8f5; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; }
    .quiz-item .vf-btn.active { background: #2c2c2c; color: #f3f0e9; border-color: #2c2c2c; }
    .quiz-item .vf-btn:hover { background: #e8e5e0; }
    .quiz-item .btn-del-quiz { background: transparent; border: none; color: #6b7a8a; cursor: pointer; font-size: 13px; position: absolute; top: 4px; right: 0; }
    .quiz-item .btn-del-quiz:hover { color: #2c2c2c; }

    /* QUESTIONS OUVERTES */
    .open-questions-list { margin: 8px 0; }
    .open-question-item { padding: 4px 0; border-bottom: 1px solid #e8e5e0; position: relative; }
    .open-question-item:last-child { border-bottom: none; }
    .open-question-item input { width: calc(100% - 30px); padding: 4px 0; border: none; background: transparent; font-size: 14px; font-family: 'Georgia', serif; color: #2c2c2c; }
    .open-question-item input:focus { outline: none; background: rgba(0,0,0,0.02); }
    .open-question-item .btn-del-open { background: transparent; border: none; color: #6b7a8a; cursor: pointer; font-size: 13px; position: absolute; top: 4px; right: 0; }
    .open-question-item .btn-del-open:hover { color: #2c2c2c; }

    /* RETENIR - fermé par défaut */
    .retenir-container { margin: 8px 0; }
    .retenir-champs { display: none; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .retenir-champs.open { display: flex; }
    .retenir-champs input { flex: 1; min-width: 60px; padding: 6px 10px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 14px; background: #faf8f5; color: #2c2c2c; }

    /* INFOS */
    .infos-list { margin: 8px 0; }
    .info-item { padding: 4px 0; border-bottom: 1px solid #e8e5e0; position: relative; }
    .info-item:last-child { border-bottom: none; }
    .info-item input { width: calc(100% - 30px); padding: 4px 0; border: none; background: transparent; font-size: 14px; font-family: 'Georgia', serif; color: #2c2c2c; }
    .info-item input:focus { outline: none; background: rgba(0,0,0,0.02); }
    .info-item .btn-del-info { background: transparent; border: none; color: #6b7a8a; cursor: pointer; font-size: 13px; position: absolute; top: 4px; right: 0; }
    .info-item .btn-del-info:hover { color: #2c2c2c; }

    .btn-add { padding: 4px 14px; background: transparent; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 12px; cursor: pointer; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; margin: 2px 0; }
    .btn-add:hover { background: #e8e5e0; color: #2c2c2c; }

    .btn-groupe { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; border-top: 1px solid #d1ccc4; padding-top: 16px; }
    .btn-groupe .btn { padding: 8px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Segoe UI', sans-serif; border: 1px solid #d1ccc4; background: transparent; color: #2c2c2c; }
    .btn-groupe .btn:hover { background: #e8e5e0; }
    .btn-groupe .btn-annuler { color: #6b7a8a; text-decoration: none; }
    .btn-groupe .btn-brouillon { color: #6b7a8a; }
    .btn-groupe .btn-brouillon.active { background: #2c2c2c; color: #f3f0e9; border-color: #2c2c2c; }
    .btn-groupe .btn-importer { color: #6b7a8a; }
    .btn-groupe .chrono { font-size: 13px; color: #6b7a8a; font-family: 'Courier New', monospace; margin-left: auto; }

    .message { margin-top: 12px; font-size: 14px; text-align: center; padding: 8px 12px; border-radius: 4px; display: none; }
    .message.success { display: block; color: #2c2c2c; background: #e8e5e0; }
    .message.error { display: block; color: #6b7a8a; background: #f5f0eb; }

    /* COMPOSEUR PLEIN ÉCRAN - fond blanc */
    .composer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
    .composer-overlay.visible { display: flex; }
    .composer-content { background: #ffffff; border: none; border-radius: 0; max-width: 100%; width: 100%; height: 100%; padding: 40px 60px; position: relative; font-family: 'Georgia', serif; }
    .composer-content .composer-close { position: absolute; top: 16px; right: 24px; background: transparent; border: none; font-size: 28px; color: #6b7a8a; cursor: pointer; line-height: 1; }
    .composer-content .composer-close:hover { color: #2c2c2c; }
    .composer-content textarea { width: 100%; height: calc(100% - 80px); border: none; background: transparent; font-size: 30px; font-family: 'Georgia', serif; color: #2c2c2c; resize: none; padding: 20px 0; line-height: 1.8; outline: none; }
    .composer-content textarea::placeholder { color: #d1ccc4; font-style: italic; }
    .composer-content .composer-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; padding-top: 16px; }
    .composer-content .composer-actions button { padding: 8px 28px; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 14px; cursor: pointer; background: transparent; color: #2c2c2c; font-family: 'Segoe UI', sans-serif; }
    .composer-content .composer-actions button:hover { background: #e8e5e0; }

    @media (max-width: 640px) {
      .carte-post { grid-template-columns: 1fr; gap: 8px; }
      .carte-post .actions { justify-content: flex-start; }
      .modal-contenu.ajout-post { padding: 16px; }
      .row-compact { flex-direction: column; align-items: stretch; }
      .row-compact input[type="date"] { width: 100%; }
      .btn-groupe { flex-direction: column; align-items: stretch; }
      .btn-groupe .btn { text-align: center; }
      .composer-content { padding: 20px; }
      .composer-content textarea { font-size: 20px; height: calc(100% - 100px); }
    }
  </style>
</head>
<body>

  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        if (typeof mettreAJourHeader === 'function') {
          mettreAJourHeader();
        }
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- PAGE ADMIN -->
  <div class="page">

    <div class="header-admin">
      <h1>⚙ Administration</h1>
      <button class="btn-ajout" onclick="ouvrirModalTexte()">+ Ajouter un texte</button>
    </div>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item"><span>Total :</span><span class="nombre" id="totalPosts">0</span></div>
      <span class="sep">|</span>
      <div class="stat-item"><span>Publiés :</span><span class="nombre" id="publiesPosts">0</span></div>
      <span class="sep">|</span>
      <div class="stat-item"><span>Brouillons :</span><span class="nombre" id="brouillonsPosts">0</span></div>
    </div>

            <!-- FILTRES PAR CATÉGORIE -->
    <div class="filtres-container" id="filtresCategories">
      <button class="filtre-cat-btn active" data-cat="toutes" onclick="filtrerParCategorie('toutes')">Toutes <span class="compteur-cat" id="catToutes">0</span></button>
    </div>

    <div class="tabs-container" id="tabsContainer">
      <button class="tab-btn active" data-tab="tous" onclick="switchTab('tous')">Tous <span class="compteur-tab" id="compteurTous">0</span></button>
      <button class="tab-btn" data-tab="publies" onclick="switchTab('publies')">Publiés <span class="compteur-tab" id="compteurPublies">0</span></button>
      <button class="tab-btn" data-tab="brouillons" onclick="switchTab('brouillons')">Brouillons <span class="compteur-tab" id="compteurBrouillons">0</span></button>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des textes...</p>
      </div>
    </div>

  </div>

  <!-- MODAL TEXTE -->
  <div id="modalTexte" class="modal-overlay">
    <div class="modal-contenu ajout-post">
      <button class="modal-close" onclick="fermerModalTexte()">✕</button>
      <h3 id="modalTitre">Texte</h3>

      <form id="formTexte" onsubmit="return false;">
        <input type="hidden" id="editId" value="">

        <div class="row-compact">
          <input type="date" id="inputDate">
          <input type="text" id="inputTitre" placeholder="Titre">
          <select id="inputNiveau"></select>
          <select id="inputCategorie"></select>
        </div>

        <!-- SLIDES -->
        <div class="section-title">Slides</div>
        <div class="slides-list" id="slidesList"></div>
        <button type="button" class="btn-composer" onclick="ouvrirComposeur()">✎ Composer</button>
        <button type="button" class="btn-add" onclick="ajouterSlide()" style="margin-left:8px;">+ slide</button>
    

        <!-- QUIZ -->
        <div class="section-title">Quiz</div>
        <div class="quiz-list" id="quizList"></div>
        <button type="button" class="btn-add" onclick="ajouterQuestion()">+ question</button>

        <!-- QUESTIONS OUVERTES -->
        <div class="section-title">Questions ouvertes</div>
        <div class="open-questions-list" id="openQuestionsList"></div>
        <button type="button" class="btn-add" onclick="ajouterQuestionOuverte()">+ question ouverte</button>

        <!-- RETENIR - fermé par défaut -->
        <div class="section-title">À retenir</div>
        <div class="retenir-container">
          <button type="button" class="btn-add" onclick="toggleRetenir()">+ mémo</button>
          <div class="retenir-champs" id="retenirChamps">
            <input type="text" id="retenir1" placeholder="Mot 1">
            <input type="text" id="retenir2" placeholder="Mot 2">
            <input type="text" id="retenir3" placeholder="Mot 3">
          </div>
        </div>

        <!-- INFOS -->
        <div class="section-title">Infos</div>
        <div class="infos-list" id="infosList"></div>
        <button type="button" class="btn-add" onclick="ajouterInfo()">+ info</button>

        <div class="btn-groupe">
          <button type="button" onclick="importerTexte()" class="btn btn-importer">Importer</button>
          <input type="file" id="fileInput" accept=".txt" style="display:none;" onchange="importerFichier(event)">
          <span style="flex:1;"></span>
          <span class="chrono" id="chronoDisplay">00:00</span>
          <button type="button" onclick="enregistrerTexte()" class="btn" id="btnEnregistrer">Ajouter</button>
          <button type="button" onclick="fermerModalTexte()" class="btn btn-annuler">Annuler</button>
          <button type="button" onclick="toggleBrouillon()" class="btn btn-brouillon" id="btnBrouillon">Brouillon</button>
        </div>

        <div id="messageTexte" class="message"></div>
      </form>
    </div>
  </div>

  <!-- COMPOSEUR -->
  <div id="composeurOverlay" class="composer-overlay">
    <div class="composer-content" id="composerContent">
      <button class="composer-close" onclick="fermerComposeur()">✕</button>
      <textarea id="composeurTextarea" placeholder="Écrivez votre slide ici..."></textarea>
      <div class="composer-actions">
        <button onclick="validerComposeur()">✓ Valider</button>
        <button onclick="validerComposeurIdee()">💡 Idée</button>
        <button onclick="fermerComposeur()">Annuler</button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // ADMIN
    // ============================================================

    var tousLesPosts = [];
    var ongletActuel = 'tous';
    var categorieActuelle = 'toutes';
    var modeEdition = false;
    var estBrouillon = false;
    var chronoInterval = null;
    var chronoSeconds = 0;

    var niveauxData = [];
    var categoriesData = [];

    var slidesData = [];
    var slidesIdee = [];
    var quizData = [];
    var openQuestionsData = [];

    // ============================================================
    // CHRONO
    // ============================================================
    function startChrono() {
      chronoSeconds = 0;
      updateChronoDisplay();
      if (chronoInterval) clearInterval(chronoInterval);
      chronoInterval = setInterval(function() {
        chronoSeconds++;
        updateChronoDisplay();
      }, 1000);
    }

    function stopChrono() {
      if (chronoInterval) {
        clearInterval(chronoInterval);
        chronoInterval = null;
      }
    }

    function updateChronoDisplay() {
      var mins = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
      var secs = String(chronoSeconds % 60).padStart(2, '0');
      document.getElementById('chronoDisplay').textContent = mins + ':' + secs;
    }

    // ============================================================
    // CHARGER NIVEAUX ET CATÉGORIES
    // ============================================================
    function chargerNiveauxEtCategories() {
      var urlNiveaux = CONFIG.SCRIPT_URL + '?action=getNiveaux';
      fetch(urlNiveaux)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            niveauxData = data.niveaux || [];
            remplirSelectNiveaux();
          }
        })
        .catch(function(e) { console.error('Erreur niveaux:', e); });

      var urlCategories = CONFIG.SCRIPT_URL + '?action=getLabels';
      fetch(urlCategories)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            categoriesData = data.labels || [];
            remplirSelectCategories();
          }
        })
        .catch(function(e) { console.error('Erreur catégories:', e); });
    }

    function remplirSelectNiveaux() {
      var select = document.getElementById('inputNiveau');
      select.innerHTML = '';
      if (niveauxData.length === 0) {
        for (var i = 1; i <= 12; i++) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = 'Nvx ' + i;
          select.appendChild(opt);
        }
      } else {
        niveauxData.forEach(function(n) {
          var opt = document.createElement('option');
          opt.value = n.valeur;
          opt.textContent = 'Nvx ' + n.valeur + (n.description ? ' - ' + n.description : '');
          select.appendChild(opt);
        });
      }
    }

    function remplirSelectCategories() {
      var select = document.getElementById('inputCategorie');
      select.innerHTML = '';
      if (categoriesData.length === 0) {
        var defaults = ['Foi', 'Rappels divers', 'Sourate', 'Hadith', 'Méditation', 'Invocation', 'Histoire', 'Morale', 'Autre'];
        defaults.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      } else {
        categoriesData.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }
    }

    function chargerAdmin() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) { 
        window.location.href = '/medit/index.html'; 
        return; 
      }

      // === VÉRIFICATION ADMIN ===
      // Seul l'utilisateur "admin" peut accéder à cette page
      if (id !== 'admin') {
        window.location.href = '/medit/mes-textes.html';
        return;
      }
      // ==========================

      chargerNiveauxEtCategories();

      // Utiliser DataManager.charger() qui détecte automatiquement l'admin
      DataManager.charger()
        .then(function(data) {
          tousLesPosts = data.posts || [];
          tousLesPosts.forEach(function(p) { if (!p.statut) p.statut = 'publie'; });
          afficherAdmin();

        .catch(function(error) {
          console.error('Erreur:', error);
          document.getElementById('loader').style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide">
              <span class="icone">⚠️</span>

              <button onclick="location.reload();" style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid #d1ccc4;border-radius:30px;cursor:pointer;">Réessayer</button>
            </div>
          `;
        });
    }

    // ============================================================
    // SLIDES - DRAG & DROP
    // ============================================================
    var dragIndex = null;

    function initDragDrop() {
      var items = document.querySelectorAll('.slide-item');
      items.forEach(function(item) {
        item.addEventListener('dragstart', function(e) {
          dragIndex = parseInt(this.dataset.index);
          this.classList.add('dragging');
        });
        item.addEventListener('dragend', function(e) {
          this.classList.remove('dragging');
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
        });
        item.addEventListener('dragover', function(e) {
          e.preventDefault();
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          this.classList.add('drag-over');
        });
        item.addEventListener('dragleave', function(e) {
          this.classList.remove('drag-over');
        });
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          this.classList.remove('drag-over');
          var targetIndex = parseInt(this.dataset.index);
          if (dragIndex !== null && dragIndex !== targetIndex) {
            var slideMoved = slidesData.splice(dragIndex, 1)[0];
            slidesData.splice(targetIndex, 0, slideMoved);
            var ideeMoved = slidesIdee.splice(dragIndex, 1)[0];
            slidesIdee.splice(targetIndex, 0, ideeMoved);
            afficherSlides();
          }
        });
      });
    }

    // ============================================================
    // SLIDES
    // ============================================================
    function ajouterSlide() {
      slidesData.push('');
      slidesIdee.push(false);
      afficherSlides();
    }

    function ajouterIdee() {
      slidesData.push('');
      slidesIdee.push(true);
      afficherSlides();
    }

    function supprimerSlide(index) {
      slidesData.splice(index, 1);
      slidesIdee.splice(index, 1);
      if (slidesData.length === 0) {
        slidesData.push('');
        slidesIdee.push(false);
      }
      afficherSlides();
    }

    function afficherSlides() {
      var container = document.getElementById('slidesList');
      if (slidesData.length === 0) {
        container.innerHTML = '<div style="color:#b8b0a8;font-style:italic;padding:4px 0;">Aucune slide</div>';
        return;
      }
      var html = '';
      slidesData.forEach(function(slide, index) {
        var preview = slide.length > 60 ? slide.substring(0, 60) + '...' : slide;
        var ideeClass = slidesIdee[index] ? 'idee' : '';
        var displayText = preview || '<span class="slide-placeholder">Slide vide</span>';
        html += `
          <div class="slide-item ${ideeClass}" draggable="true" data-index="${index}">
            <span class="slide-handle">⠿</span>
            <span class="slide-texte" onclick="ouvrirComposeur(${index})">${displayText}</span>
            <button class="btn-del-slide" onclick="event.stopPropagation(); supprimerSlide(${index})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
      initDragDrop();
    }

    // ============================================================
    // COMPOSEUR
    // ============================================================
    function ouvrirComposeur(index) {
      composeurIndex = (index !== undefined) ? index : -1;
      var textarea = document.getElementById('composeurTextarea');
      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        textarea.value = slidesData[composeurIndex];
      } else {
        textarea.value = '';
      }
      document.getElementById('composeurOverlay').classList.add('visible');
      textarea.focus();
    }

    function fermerComposeur() {
      document.getElementById('composeurOverlay').classList.remove('visible');
    }

    function validerComposeur() {
      var texte = document.getElementById('composeurTextarea').value.trim();
      if (!texte) { alert('Veuillez écrire du contenu.'); return; }

      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = texte;
        slidesIdee[composeurIndex] = false;
      } else {
        slidesData.push(texte);
        slidesIdee.push(false);
      }
      fermerComposeur();
      afficherSlides();
    }

    function validerComposeurIdee() {
      var texte = document.getElementById('composeurTextarea').value.trim();
      if (!texte) { alert('Veuillez écrire du contenu.'); return; }

      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = texte;
        slidesIdee[composeurIndex] = true;
      } else {
        slidesData.push(texte);
        slidesIdee.push(true);
      }
      fermerComposeur();
      afficherSlides();
    }

    // ============================================================
    // RACCOURCIS CLAVIER
    // ============================================================
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Backspace') {
        var active = document.activeElement;
        if (active) {
          var slideItem = active.closest('.slide-item');
          if (slideItem) {
            var index = Array.from(slideItem.parentElement.children).indexOf(slideItem);
            if (index >= 0 && slidesData.length > 1) {
              supprimerSlide(index);
              e.preventDefault();
              return;
            }
          }
          var quizItem = active.closest('.quiz-item');
          if (quizItem) {
            var index = Array.from(quizItem.parentElement.children).indexOf(quizItem);
            if (index >= 0 && quizData.length > 1) {
              supprimerQuestion(index);
              e.preventDefault();
              return;
            }
          }
          var openItem = active.closest('.open-question-item');
          if (openItem) {
            var index = Array.from(openItem.parentElement.children).indexOf(openItem);
            if (index >= 0 && openQuestionsData.length > 1) {
              supprimerQuestionOuverte(index);
              e.preventDefault();
              return;
            }
          }
          var infoItem = active.closest('.info-item');
          if (infoItem) {
            var index = Array.from(infoItem.parentElement.children).indexOf(infoItem);
            if (index >= 0 && infosData.length > 1) {
              supprimerInfo(index);
              e.preventDefault();
              return;
            }
          }
        }
      }

      if (e.ctrlKey && e.key === '=') {
        var active = document.activeElement;
        if (active) {
          var slidesList = active.closest('#slidesList');
          if (slidesList) { ajouterSlide(); e.preventDefault(); return; }
          var quizList = active.closest('#quizList');
          if (quizList) { ajouterQuestion(); e.preventDefault(); return; }
          var openList = active.closest('#openQuestionsList');
          if (openList) { ajouterQuestionOuverte(); e.preventDefault(); return; }
          var infosList = active.closest('#infosList');
          if (infosList) { ajouterInfo(); e.preventDefault(); return; }
        }
      }

      if (e.key === 'Tab') {
        var active = document.activeElement;
        if (active) {
          var vfBtn = active.closest('.vf-btn');
          if (vfBtn) {
            e.preventDefault();
            var inputs = Array.from(document.querySelectorAll('#formTexte input:not([type="hidden"]), #formTexte textarea, #formTexte select'));
            var idx = inputs.indexOf(active);
            if (idx >= 0 && idx < inputs.length - 1) {
              inputs[idx + 1].focus();
            }
            return;
          }
        }
      }
    });

    // ============================================================
    // ENREGISTRER
    // ============================================================
    function enregistrerTexte() {
      var id = document.getElementById('editId').value;
      var titre = document.getElementById('inputTitre').value.trim();
      var niveau = document.getElementById('inputNiveau').value;
      var categorie = document.getElementById('inputCategorie').value;
      var date = document.getElementById('inputDate').value;
      var statut = estBrouillon ? 'brouillon' : 'publie';
      var msg = document.getElementById('messageTexte');

      var r1 = document.getElementById('retenir1').value.trim();
      var r2 = document.getElementById('retenir2').value.trim();
      var r3 = document.getElementById('retenir3').value.trim();
      var retenir = [r1, r2, r3].filter(function(m) { return m.length > 0; }).join(', ');

      if (!titre) { afficherMsgTexte('Veuillez saisir un titre', 'error'); return; }
      if (slidesData.length === 0) { afficherMsgTexte('Veuillez ajouter au moins une slide', 'error'); return; }

      var contenuFinal = '';

      // Slides : on prend seulement les slides qui ne sont pas des idées
      var slidesReelles = slidesData.filter(function(s, i) { return !slidesIdee[i]; });
      slidesReelles.forEach(function(slide, index) {
        if (index === 0) {
          contenuFinal += '-s- ' + slide;
        } else {
          contenuFinal += ' | -s- ' + slide;
        }
      });

      quizData.forEach(function(q) {
        if (q.question.trim() || q.reponses.some(function(r) { return r.texte.trim(); })) {
          var chaine = '-q- ' + q.question;
          q.reponses.forEach(function(r) {
            chaine += ' | ' + (r.correct ? '-v- ' : '-f- ') + r.texte;
          });
          contenuFinal += ' | ' + chaine;
        }
      });

      openQuestionsData.forEach(function(q) {
        if (q.trim()) {
          contenuFinal += ' | -qs- ' + q;
        }
      });

      if (retenir) {
        contenuFinal += ' | -r- ' + retenir;
      }

      infosData.forEach(function(info) {
        if (info.trim()) {
          contenuFinal += ' | -i- ' + info;
        }
      });

      var btn = document.getElementById('btnEnregistrer');
      btn.textContent = 'Enregistrement...';
      btn.disabled = true;
      msg.style.display = 'none';

      if (modeEdition && id) {
        DataManager.modifierPost(id, titre, parseInt(niveau), categorie, contenuFinal, '', statut)
          .then(function() {
            afficherMsgTexte('✅ Post mis à jour !', 'success');
            btn.textContent = 'Mettre à jour';
            btn.disabled = false;
            fermerModalTexte();
            chargerAdmin();
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Mettre à jour';
            btn.disabled = false;
          });
      } else {
        DataManager.ajouterPost(titre, parseInt(niveau), categorie, contenuFinal, '')
          .then(function() {
            afficherMsgTexte('✅ Post ajouté !', 'success');
            btn.textContent = 'Ajouter';
            btn.disabled = false;
            fermerModalTexte();
            chargerAdmin();
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Ajouter';
            btn.disabled = false;
          });
      }
    }

    function afficherMsgTexte(texte, type) {
      var msg = document.getElementById('messageTexte');
      msg.textContent = texte;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }

    // ============================================================
    // MODIFIER POST
    // ============================================================
    function modifierPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      modeEdition = true;
      estBrouillon = post.statut === 'brouillon';
      document.getElementById('modalTitre').textContent = 'Texte';
      document.getElementById('btnEnregistrer').textContent = 'Mettre à jour';
      document.getElementById('editId').value = postId;

      if (post.date) {
        var d = new Date(post.date);
        if (!isNaN(d.getTime())) {
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, '0');
          var dd = String(d.getDate()).padStart(2, '0');
          document.getElementById('inputDate').value = y + '-' + m + '-' + dd;
        }
      }

      document.getElementById('inputTitre').value = post.titre || '';

      var selectNiveau = document.getElementById('inputNiveau');
      for (var i = 0; i < selectNiveau.options.length; i++) {
        if (selectNiveau.options[i].value == post.niveau) {
          selectNiveau.selectedIndex = i;
          break;
        }
      }

      var selectCategorie = document.getElementById('inputCategorie');
      for (var i = 0; i < selectCategorie.options.length; i++) {
        if (selectCategorie.options[i].value === post.categorie) {
          selectCategorie.selectedIndex = i;
          break;
        }
      }

      var btnBrouillon = document.getElementById('btnBrouillon');
      if (estBrouillon) {
        btnBrouillon.classList.add('active');
        btnBrouillon.textContent = '✓ Brouillon';
      } else {
        btnBrouillon.classList.remove('active');
        btnBrouillon.textContent = 'Brouillon';
      }

      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');

      if (post.contenu) {
        var lignes = post.contenu.split('\n');
        for (var i = 0; i < lignes.length; i++) {
          var ligne = lignes[i].trim();
          if (!ligne) continue;

          if (ligne.startsWith('-s-')) {
            slidesData.push(ligne.replace('-s-', '').trim());
            slidesIdee.push(false);
          } else if (ligne.startsWith('-q-')) {
            var qText = ligne.replace('-q-', '').trim();
            var reponses = [];
            for (var j = i + 1; j < lignes.length; j++) {
              var nextLine = lignes[j].trim();
              if (nextLine.startsWith('-v-')) {
                reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
                i = j;
              } else if (nextLine.startsWith('-f-')) {
                reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
                i = j;
              } else {
                break;
              }
            }
            if (reponses.length === 0) {
              reponses.push({ texte: '', correct: true });
              reponses.push({ texte: '', correct: false });
            }
            quizData.push({ question: qText, reponses: reponses });
          } else if (ligne.startsWith('-qs-')) {
            openQuestionsData.push(ligne.replace('-qs-', '').trim());
          } else if (ligne.startsWith('-r-')) {
            var retenirText = ligne.replace('-r-', '').trim();
            var mots = retenirText.split(',').map(function(m) { return m.trim(); });
            document.getElementById('retenir1').value = mots[0] || '';
            document.getElementById('retenir2').value = mots[1] || '';
            document.getElementById('retenir3').value = mots[2] || '';
            retenirOpen = true;
            document.getElementById('retenirChamps').classList.add('open');
          } else if (ligne.startsWith('-i-')) {
            infosData.push(ligne.replace('-i-', '').trim());
          }
        }
      }

      if (slidesData.length === 0) { slidesData.push(''); slidesIdee.push(false); }
      if (quizData.length === 0) {
        quizData.push({ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] });
      }
      if (openQuestionsData.length === 0) openQuestionsData.push('');
      if (infosData.length === 0) infosData.push('');

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('modalTexte').classList.add('visible');
      document.getElementById('messageTexte').style.display = 'none';
      document.getElementById('inputTitre').focus();

      startChrono();
    }

    // ============================================================
    // EXPORTER POST
    // ============================================================
    function exporterPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      var contenu = '';
      contenu += 'Nvx: ' + (post.niveau || 0) + '\n';
      contenu += 'Cat: ' + (post.categorie || 'Sans catégorie') + '\n\n';

      if (post.contenu) {
        contenu += post.contenu;
      } else {
        contenu += '-s- ' + (post.titre || 'Sans titre') + '\n\n';
      }

      var blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (post.titre || 'post') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ============================================================
    // IMPORTER
    // ============================================================
    function importerTexte() {
      document.getElementById('fileInput').click();
    }

    function importerFichier(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        var contenu = e.target.result;
        parserContenu(contenu);
        document.getElementById('fileInput').value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parserContenu(contenu) {
      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');
      document.getElementById('retenir1').value = '';
      document.getElementById('retenir2').value = '';
      document.getElementById('retenir3').value = '';

      var lignes = contenu.split('\n');

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i].trim();
        if (!ligne) continue;

        if (ligne.startsWith('Nvx:')) {
          var niveau = ligne.replace('Nvx:', '').trim();
          var selectNiveau = document.getElementById('inputNiveau');
          for (var si = 0; si < selectNiveau.options.length; si++) {
            if (selectNiveau.options[si].value == niveau) {
              selectNiveau.selectedIndex = si;
              break;
            }
          }
          continue;
        }
        if (ligne.startsWith('Cat:')) {
          var cat = ligne.replace('Cat:', '').trim();
          var selectCategorie = document.getElementById('inputCategorie');
          for (var si = 0; si < selectCategorie.options.length; si++) {
            if (selectCategorie.options[si].value === cat) {
              selectCategorie.selectedIndex = si;
              break;
            }
          }
          continue;
        }

        if (ligne.startsWith('-s-')) {
          slidesData.push(ligne.replace('-s-', '').trim());
          slidesIdee.push(false);
        } else if (ligne.startsWith('-q-')) {
          var qText = ligne.replace('-q-', '').trim();
          var reponses = [];
          for (var j = i + 1; j < lignes.length; j++) {
            var nextLine = lignes[j].trim();
            if (nextLine.startsWith('-v-')) {
              reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
              i = j;
            } else if (nextLine.startsWith('-f-')) {
              reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
              i = j;
            } else {
              break;
            }
          }
          if (reponses.length === 0) {
            reponses.push({ texte: '', correct: true });
            reponses.push({ texte: '', correct: false });
          }
          quizData.push({ question: qText, reponses: reponses });
        } else if (ligne.startsWith('-qs-')) {
          openQuestionsData.push(ligne.replace('-qs-', '').trim());
        } else if (ligne.startsWith('-r-')) {
          var retenirText = ligne.replace('-r-', '').trim();
          var mots = retenirText.split(',').map(function(m) { return m.trim(); });
          document.getElementById('retenir1').value = mots[0] || '';
          document.getElementById('retenir2').value = mots[1] || '';
          document.getElementById('retenir3').value = mots[2] || '';
          retenirOpen = true;
          document.getElementById('retenirChamps').classList.add('open');
        } else if (ligne.startsWith('-i-')) {
          infosData.push(ligne.replace('-i-', '').trim());
        }
      }

      if (slidesData.length === 0) { slidesData.push(''); slidesIdee.push(false); }
      if (quizData.length === 0) {
        quizData.push({ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] });
      }
      if (openQuestionsData.length === 0) openQuestionsData.push('');
      if (infosData.length === 0) infosData.push('');

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('messageTexte').style.display = 'none';
    }

    // ============================================================
    // SUPPRIMER POST
    // ============================================================
    function supprimerPost(postId) {
      if (!confirm('Supprimer ce texte définitivement ?')) return;

      var btn = document.querySelector('.btn-supprimer');
      btn.textContent = '...';
      btn.disabled = true;

      DataManager.supprimerPost(postId)
        .then(function() {
          alert('✅ Post supprimé avec succès !');
          chargerAdmin();
        })
        .catch(function(err) {
          alert('❌ Erreur : ' + err.message);
          btn.textContent = '✕';
          btn.disabled = false;
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerAdmin();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>
