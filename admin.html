<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .admin-header h1 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 20px;
      color: var(--text);
      margin: 0;
    }

    .admin-header .btn-ajout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      border-radius: 4px;
    }

    .admin-header .btn-ajout:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .sous-tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .sous-tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 14px;
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sous-tab-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .sous-tab-btn.active {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .compteur-sous-tab {
      background: var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      padding: 0 8px;
      border-radius: 10px;
      line-height: 18px;
      font-weight: 500;
    }

    .sous-tab-btn.active .compteur-sous-tab {
      background: var(--text);
      color: var(--bg);
    }

    .grille {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .carte-post {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      gap: 12px;
      border-radius: 6px;
    }

    .carte-post:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }

    .carte-post .infos {
      flex: 1;
      min-width: 0;
    }

    .carte-post .infos .titre {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--text);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .carte-post .infos .meta {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .carte-post .infos .meta .statut {
      display: inline-block;
      padding: 0 10px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      border-radius: 12px;
      line-height: 20px;
    }

    .carte-post .infos .meta .statut.publie {
      color: #2d6a4f;
      border-color: #2d6a4f;
      background: rgba(45, 106, 79, 0.08);
    }

    .carte-post .infos .meta .statut.brouillon {
      color: #b34a4a;
      border-color: #b34a4a;
      background: rgba(179, 74, 74, 0.08);
    }

    .carte-post .infos .meta .badge-icone {
      display: inline-block;
      padding: 0 10px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      border-radius: 12px;
      line-height: 20px;
    }

    .carte-post .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .carte-post .actions a,
    .carte-post .actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 14px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      border-radius: 4px;
      line-height: 22px;
    }

    .carte-post .actions a:hover,
    .carte-post .actions button:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .carte-post .actions .btn-supprimer:hover {
      color: #b34a4a;
      border-color: #b34a4a;
    }

    .vide {
      text-align: center;
      padding: 60px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .vide .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .vide h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      color: var(--text);
      font-size: 20px;
      margin: 0 0 6px 0;
    }

    .vide p {
      font-family: var(--font-sans);
      color: var(--text-secondary);
      font-size: 14px;
      margin: 0;
    }

    .devise {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--text-secondary);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .admin-container { padding: 10px; }
      .admin-header h1 { font-size: 17px; }
      .admin-header .btn-ajout { font-size: 12px; padding: 4px 12px; }
      .carte-post { padding: 10px 12px; flex-wrap: wrap; }
      .carte-post .infos .titre { font-size: 14px; }
      .carte-post .infos .meta { font-size: 11px; gap: 4px; }
      .carte-post .actions a,
      .carte-post .actions button { font-size: 11px; padding: 2px 10px; }
      .sous-tab-btn { font-size: 12px; padding: 3px 10px; }
    }
  </style>

</head>
<body>

  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Header non trouvé');
        }
        return response.text();
      })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-left">
                <div class="header-logo">
                  <a href="/medit/index.html">
                    <span style="font-size:28px;vertical-align:middle;margin-right:8px;">✎❏</span>
                    <strong>Qiraat</strong> <i>lecture</i>
                  </a>
                </div>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" onclick="window.location.href='/medit/index.html';">Se connecter</a>
              </nav>
            </div>
          </header>
        `;
      });

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      var mode = document.body.classList.contains('dark-mode') ? 'sombre' : 'clair';
      localStorage.setItem('theme', mode);
    }

    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'sombre') {
        document.body.classList.add('dark-mode');
      }
    })();
  </script>

  <div class="page">

    <div class="admin-container">

      <div class="admin-header">
        <h1>Administration</h1>
        <a href="/medit/edit.html?id=new" class="btn-ajout">+ Ajouter</a>
      </div>

      <div id="sousTabsContainer" class="sous-tabs-container"></div>

      <div id="postList">
        <div class="vide">
          <span class="icone">📖</span>
          <h2>Aucun texte</h2>
          <p>Cliquez sur "Ajouter" pour commencer.</p>
        </div>
      </div>

      <div class="devise">
        “Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?” — Coran 47:24
      </div>

    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var tousLesPosts = [];
    var categorieActuelle = 'toutes';

    function chargerPosts() {
      var id = localStorage.getItem('etudiant_id');
      if (!id || id !== 'admin') {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          tousLesPosts = data.posts || [];
          tousLesPosts.forEach(function(p) {
            if (!p.statut) p.statut = 'publie';
            if (!p.date) p.date = new Date().toISOString();
          });
          afficherSousTabs();
          afficherListe();
        })
        .catch(function(error) {
          console.error('Erreur:', error);
        });
    }

    function afficherSousTabs() {
      var container = document.getElementById('sousTabsContainer');
      var categories = {};

      tousLesPosts.forEach(function(post) {
        var cat = post.categorie || 'Sans catégorie';
        if (!categories[cat]) categories[cat] = 0;
        categories[cat]++;
      });

      var categoriesTriees = Object.keys(categories).sort();

      var html = '';
      html += `
        <button class="sous-tab-btn active" data-categorie="toutes" onclick="switchCategorie('toutes')">
          Toutes
          <span class="compteur-sous-tab">${tousLesPosts.length}</span>
        </button>
      `;

      categoriesTriees.forEach(function(cat) {
        html += `
          <button class="sous-tab-btn" data-categorie="${cat}" onclick="switchCategorie('${cat}')">
            ${cat}
            <span class="compteur-sous-tab">${categories[cat]}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function switchCategorie(categorie) {
      categorieActuelle = categorie;

      document.querySelectorAll('.sous-tab-btn').forEach(function(el) {
        el.classList.remove('active');
        if (el.dataset.categorie === categorie) {
          el.classList.add('active');
        }
      });

      afficherListe();
    }

    function afficherListe() {
      var container = document.getElementById('postList');

      var postsFiltres = tousLesPosts;
      if (categorieActuelle !== 'toutes') {
        postsFiltres = tousLesPosts.filter(function(post) {
          var cat = post.categorie || 'Sans catégorie';
          return cat === categorieActuelle;
        });
      }

      if (postsFiltres.length === 0) {
        container.innerHTML = `
          <div class="vide">
            <span class="icone">📭</span>
            <h2>Aucun texte</h2>
            <p>Aucun texte dans cette catégorie.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille">';

      postsFiltres.sort(function(a, b) {
        var dateA = a.date ? new Date(a.date) : new Date(0);
        var dateB = b.date ? new Date(b.date) : new Date(0);
        return dateB - dateA;
      });

      for (var i = 0; i < postsFiltres.length; i++) {
        var post = postsFiltres[i];
        var date = post.date ? new Date(post.date) : null;
        var dateStr = date ? date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        var statutLabel = post.statut === 'publie' ? 'Publié' : 'Brouillon';
        var statutClass = post.statut === 'publie' ? 'publie' : 'brouillon';
        var mots = post.mots || 0;

        var nbQuestions = 0;
        if (post.hasQuiz) nbQuestions++;
        if (post.hasQuestion) nbQuestions++;

        html += `
          <div class="carte-post" onclick="window.location.href='/medit/edit.html?id=${post.id}'">
            <div class="infos">
              <span class="titre">${post.titre || 'Sans titre'}</span>
              <span class="meta">
                <span class="badge-icone">${post.categorie || 'Sans catégorie'}</span>
                <span class="badge-icone">Niveau ${post.niveau || 0}</span>
                <span class="badge-icone">${dateStr}</span>
                <span class="statut ${statutClass}">${statutLabel}</span>
                <span class="badge-icone">${mots} mots</span>
                <span class="badge-icone">${nbQuestions} question${nbQuestions > 1 ? 's' : ''}</span>
              </span>
            </div>
            <div class="actions" onclick="event.stopPropagation();">
              <button class="btn-editer" onclick="ouvrirEditeur('${post.id}')">Modifier</button>
              <button class="btn-supprimer" onclick="supprimerPost('${post.id}')">Supprimer</button>
            </div>
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function ouvrirEditeur(postId) {
      window.location.href = '/medit/edit.html?id=' + postId;
    }

    function supprimerPost(postId) {
      if (!confirm('Supprimer ce texte définitivement ?')) return;
      DataManager.supprimerPost(postId)
        .then(function() { 
          chargerPosts(); 
        })
        .catch(function(err) { alert('Erreur : ' + err.message); });
    }

    document.addEventListener('DOMContentLoaded', function() {
      chargerPosts();
    });

    window.supprimerPost = supprimerPost;
    window.ouvrirEditeur = ouvrirEditeur;
    window.switchCategorie = switchCategorie;
  </script>

</body>
</html>
