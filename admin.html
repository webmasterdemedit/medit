<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #121212; }
    body {
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2px;
      display: flex;
      flex-direction: column;
      background: #121212;
      color: #e8e0d8;
      overflow-y: auto;
    }
    a { text-decoration: none; color: inherit; }

    /* ===== PAGE ===== */
    .page { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; flex: 1 0 auto; width: 100%; overflow-y: auto; }

    /* ===== HEADER ADMIN ===== */
    .header-admin {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid #2a2a2a;
      flex-wrap: wrap; gap: 10px;
    }
    .header-admin h1 {
      font-size: 28px; font-weight: 400;
      font-family: 'Merriweather', 'Georgia', serif;
      color: #e8e0d8;
    }
    .header-admin .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .header-admin .btn-ajout {
      padding: 8px 20px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      background: transparent; color: #e8e0d8;
      font-family: 'Inter', sans-serif; white-space: nowrap;
      transition: all 0.2s;
    }
    .header-admin .btn-ajout:hover { background: #1e1e1e; }
    .header-admin .btn-export-all {
      padding: 8px 18px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif; white-space: nowrap;
      transition: all 0.2s;
    }
    .header-admin .btn-export-all:hover { background: #1e1e1e; color: #e8e0d8; }
    .header-admin .btn-importer-header {
      padding: 8px 18px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif; white-space: nowrap;
      transition: all 0.2s;
    }
    .header-admin .btn-importer-header:hover { background: #1e1e1e; color: #e8e0d8; }
    .header-admin .btn-categories {
      padding: 8px 18px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif; white-space: nowrap;
      transition: all 0.2s;
    }
    .header-admin .btn-categories:hover { background: #1e1e1e; color: #e8e0d8; }

    /* ===== STATS ===== */
    .stats-ligne {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 8px 20px; border-radius: 4px;
      padding: 14px 24px; margin-bottom: 24px;
      border: 1px solid #2a2a2a; background: #1a1a1a;
    }
    .stats-ligne .stat-item { display: flex; align-items: baseline; gap: 4px; font-size: 13px; color: #6b6b6b; }
    .stats-ligne .stat-item .nombre { font-size: 22px; font-weight: 600; color: #e8e0d8; font-family: 'Merriweather', serif; }
    .stats-ligne .sep { color: #2a2a2a; font-size: 18px; }

    /* ===== SEARCH ===== */
    .search-bar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 16px; padding: 8px 16px;
      border: 1px solid #2a2a2a; border-radius: 30px;
      background: #1a1a1a;
    }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; font-family: 'Inter', sans-serif;
      color: #e8e0d8; outline: none; padding: 6px 0;
    }
    .search-bar input::placeholder { color: #4a4a4a; }
    .search-bar .search-icon { color: #4a4a4a; font-size: 16px; }

    /* ===== FILTRES ===== */
    .filtres-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 4px 0; }
    .filtre-cat-btn {
      padding: 6px 18px; background: transparent;
      border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; color: #6b6b6b;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .filtre-cat-btn:hover { background: #1e1e1e; color: #e8e0d8; }
    .filtre-cat-btn.active { background: #2a2a2a; color: #e8e0d8; border-color: #2a2a2a; }
    .filtre-cat-btn .compteur-cat { display: inline-block; font-size: 11px; font-weight: 600; margin-left: 4px; }
    .filtre-cat-btn.active .compteur-cat { color: #e8e0d8; }
    .filtre-cat-btn .btn-del-cat { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 11px; margin-left: 4px; opacity: 0.6; }
    .filtre-cat-btn .btn-del-cat:hover { opacity: 1; }

    /* ===== TABS ===== */
    .tabs-container {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-bottom: 24px; padding: 4px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .tab-btn {
      padding: 10px 28px; background: transparent;
      border: none; border-bottom: 2px solid transparent;
      font-size: 15px; font-weight: 500;
      color: #6b6b6b; cursor: pointer;
      font-family: 'Inter', sans-serif; border-radius: 0;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #e8e0d8; background: transparent; }
    .tab-btn.active { color: #e8e0d8; border-bottom-color: #e8e0d8; font-weight: 600; }
    .tab-btn .compteur-tab {
      display: inline-block; background: #1e1e1e; color: #6b6b6b;
      font-size: 11px; font-weight: 600; padding: 0 10px;
      border-radius: 30px; margin-left: 6px; line-height: 20px;
    }
    .tab-btn.active .compteur-tab { background: #1e1e1e; color: #e8e0d8; }

    /* ===== GRILLE ===== */
    .grille { display: flex; flex-direction: column; gap: 10px; }

    /* ===== CARTE POST ===== */
    .carte-post {
      border-radius: 4px; padding: 20px 28px;
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 16px;
      border: 1px solid #2a2a2a;
      background: #161616;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .carte-post:hover { border-color: #3a3a3a; }
    .carte-post .infos { display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
    .carte-post .titre {
      font-size: 17px; font-weight: 400;
      font-family: 'Merriweather', 'Georgia', serif;
      color: #e8e0d8;
    }
    .carte-post .meta {
      font-size: 12px; color: #6b6b6b;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .carte-post .meta .badge {
      padding: 1px 10px; border-radius: 30px;
      font-size: 11px; font-weight: 500;
      display: inline-block; background: #1e1e1e; color: #6b6b6b;
    }
    .carte-post .meta .badge.publie { color: #e8e0d8; }
    .carte-post .meta .badge.brouillon { color: #6b6b6b; }
    .carte-post .meta .stat-lecture { font-size: 11px; color: #6b6b6b; }
    .carte-post .meta .stat-lecture .ok { color: #7ab893; }
    .carte-post .meta .stat-lecture .ko { color: #6b6b6b; }
    .carte-post .meta .info-badge {
      padding: 1px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 500;
      display: inline-block; background: #1e1e1e; color: #6b6b6b;
    }

    .carte-post .apercu-rapide {
      padding: 10px 14px; margin-top: 6px; border-radius: 4px;
      font-size: 13px; font-style: italic; line-height: 1.6;
      background: #1a1a1a; color: #c8c0b8;
      pointer-events: none;
    }

    .carte-post .actions { display: flex; gap: 8px; flex-wrap: wrap; pointer-events: auto; }
    .carte-post .actions button {
      padding: 6px 14px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 12px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .carte-post .actions button:hover { background: #1e1e1e; color: #e8e0d8; }
    .carte-post .actions .btn-supprimer:hover { color: #c87a7a; }

    .carte-post.dragging { opacity: 0.4; }
    .carte-post.drag-over { border: 2px dashed #3a3a3a; background: #1a1a1a; }
    .carte-post .drag-handle { cursor: grab; color: #3a3a3a; font-size: 16px; margin-right: 8px; user-select: none; }
    .carte-post .drag-handle:hover { color: #6b6b6b; }
    .carte-post .ordre-badge {
      display: inline-block; background: #1e1e1e; color: #6b6b6b;
      font-size: 11px; font-weight: 600; padding: 0 10px;
      border-radius: 30px; line-height: 20px;
    }

    /* ===== LOADER ===== */
    .loader { text-align: center; padding: 60px 20px; color: #6b6b6b; }
    .loader .spinner {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid #2a2a2a; border-top-color: #6b6b6b;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== VIDE ===== */
    .vide {
      text-align: center; padding: 60px 20px;
      border: 1px solid #2a2a2a; border-radius: 4px;
      background: #161616;
    }
    .vide .icone { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .vide h2 { font-size: 20px; font-weight: 400; font-family: 'Merriweather', serif; color: #e8e0d8; margin-bottom: 4px; }
    .vide p { color: #6b6b6b; font-size: 15px; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 9999; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .modal-overlay.visible { display: flex; }

    .modal-contenu {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 4px;
      max-width: 500px; width: 95%; max-height: 90vh; overflow-y: auto;
      padding: 28px 32px;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .modal-contenu .modal-close {
      position: absolute; top: 10px; right: 14px;
      background: transparent; border: none;
      font-size: 22px; color: #6b6b6b; cursor: pointer; line-height: 1;
    }
    .modal-contenu .modal-close:hover { color: #e8e0d8; }
    .modal-contenu h3 {
      font-size: 24px; font-weight: 400;
      font-family: 'Merriweather', serif;
      color: #e8e0d8; margin-bottom: 16px;
    }
    .modal-contenu .cat-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #2a2a2a;
    }
    .modal-contenu .cat-item:last-child { border-bottom: none; }
    .modal-contenu .cat-item .cat-name { font-size: 14px; color: #e8e0d8; }
    .modal-contenu .cat-item .cat-actions { display: flex; gap: 6px; }
    .modal-contenu .cat-item .cat-actions button {
      padding: 2px 10px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 11px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif;
    }
    .modal-contenu .cat-item .cat-actions button:hover { background: #1e1e1e; color: #e8e0d8; }
    .modal-contenu .ajout-cat { display: flex; gap: 8px; margin-top: 12px; }
    .modal-contenu .ajout-cat input {
      flex: 1; padding: 6px 10px; border: 1px solid #2a2a2a; border-radius: 4px;
      font-size: 13px; font-family: 'Inter', sans-serif;
      background: #1a1a1a; color: #e8e0d8;
    }
    .modal-contenu .ajout-cat button {
      padding: 6px 16px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      background: transparent; color: #e8e0d8;
      font-family: 'Inter', sans-serif;
    }
    .modal-contenu .ajout-cat button:hover { background: #1e1e1e; }

    /* ===== MODAL AJOUT POST ===== */
    .modal-contenu.ajout-post { max-width: 800px; }

    .row-compact {
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      align-items: center; margin-bottom: 16px;
    }
    .row-compact input, .row-compact select {
      padding: 6px 10px; border: 1px solid #2a2a2a; border-radius: 4px;
      font-size: 13px; font-family: 'Inter', sans-serif;
      background: #1a1a1a; color: #e8e0d8;
    }
    .row-compact input[type="date"] { width: auto; }
    .row-compact input[type="text"] { flex: 1; min-width: 120px; }
    .row-compact select { width: auto; }

    /* ===== SECTIONS MODAL ===== */
    .section-block {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .section-block .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .section-block .section-header .section-label {
      font-size: 11px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px; color: #6b6b6b;
      font-family: 'Inter', sans-serif;
    }
    .section-block .section-header .btn-add-section {
      padding: 2px 12px; border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 11px; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .section-block .section-header .btn-add-section:hover { background: #1e1e1e; color: #e8e0d8; }

    .slides-list { margin: 4px 0; min-height: 20px; }
    .slide-item {
      padding: 4px 0; border-bottom: 1px solid #2a2a2a;
      color: #e8e0d8; font-family: 'Merriweather', serif;
      font-size: 14px; line-height: 1.5;
      cursor: grab; display: flex; align-items: center; justify-content: space-between;
    }
    .slide-item:last-child { border-bottom: none; }
    .slide-item.dragging { opacity: 0.4; }
    .slide-item.drag-over { border-bottom: 2px solid #4a6a5a; }
    .slide-item .slide-handle { color: #3a3a3a; font-size: 14px; margin-right: 8px; cursor: grab; }
    .slide-item .slide-placeholder { color: #4a4a4a; font-style: italic; }
    .slide-item .slide-texte { flex: 1; cursor: pointer; }
    .slide-item .btn-del-slide { background: transparent; border: none; color: #6b6b6b; cursor: pointer; font-size: 13px; }
    .slide-item .btn-del-slide:hover { color: #c87a7a; }
    .slide-item.idee .slide-texte { font-style: italic; color: #6b6b6b; }

    .btn-composer {
      padding: 4px 14px; background: transparent;
      border: 1px solid #2a2a2a; border-radius: 30px;
      font-size: 12px; cursor: pointer;
      color: #6b6b6b; font-family: 'Inter', sans-serif;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-composer:hover { background: #1e1e1e; color: #e8e0d8; }

    /* ===== QUIZ ===== */
    .quiz-list { margin: 4px 0; }
    .quiz-item {
      padding: 8px 0; border-bottom: 1px solid #2a2a2a;
      font-size: 14px; color: #e8e0d8; position: relative;
    }
    .quiz-item:last-child { border-bottom: none; }
    .quiz-item .q-text {
      width: 100%; padding: 4px 0; border: none;
      background: transparent; font-size: 14px;
      font-family: 'Merriweather', serif;
      color: #e8e0d8;
    }
    .quiz-item .q-text:focus { outline: none; }
    .quiz-item .quiz-reponses {
      display: flex; flex-wrap: wrap; gap: 4px 8px;
      padding: 2px 0; align-items: center;
    }
    .quiz-item .quiz-reponses input {
      flex: 1; min-width: 60px; padding: 2px 6px;
      border: 1px solid #2a2a2a; border-radius: 4px;
      font-size: 13px; background: #1a1a1a; color: #e8e0d8;
    }
    .quiz-item .vf-group { display: flex; gap: 2px; }
    .quiz-item .vf-btn {
      padding: 2px 10px; border: 1px solid #2a2a2a; border-radius: 4px;
      font-size: 11px; font-weight: 500; cursor: pointer;
      background: transparent; color: #6b6b6b;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .quiz-item .vf-btn.active { background: #2a2a2a; color: #e8e0d8; border-color: #2a2a2a; }
    .quiz-item .vf-btn:hover { background: #1e1e1e; }
    .quiz-item .btn-del-quiz {
      background: transparent; border: none;
      color: #6b6b6b; cursor: pointer; font-size: 13px;
      position: absolute; top: 4px; right: 0;
    }
    .quiz-item .btn-del-quiz:hover { color: #c87a7a; }

    /* ===== QUESTIONS OUVERTES ===== */
    .open-questions-list { margin: 4px 0; }
    .open-question-item {
      padding: 4px 0; border-bottom: 1px solid #2a2a2a; position: relative;
    }
    .open-question-item:last-child { border-bottom: none; }
    .open-question-item input {
      width: calc(100% - 30px); padding: 4px 0; border: none;
      background: transparent; font-size: 14px;
      font-family: 'Merriweather', serif;
      color: #e8e0d8;
    }
    .open-question-item input:focus { outline: none; }
    .open-question-item .btn-del-open {
      background: transparent; border: none;
      color: #6b6b6b; cursor: pointer; font-size: 13px;
      position: absolute; top: 4px; right: 0;
    }
    .open-question-item .btn-del-open:hover { color: #c87a7a; }

    /* ===== RETENIR ===== */
    .retenir-container { margin: 4px 0; }
    .retenir-champs {
      display: none; gap: 8px; flex-wrap: wrap; margin-top: 4px;
    }
    .retenir-champs.open { display: flex; }
    .retenir-champs input {
      flex: 1; min-width: 60px; padding: 4px 8px;
      border: 1px solid #2a2a2a; border-radius: 4px;
      font-size: 13px; background: #1a1a1a; color: #e8e0d8;
    }

    /* ===== INFOS ===== */
    .infos-list { margin: 4px 0; }
    .info-item {
      padding: 4px 0; border-bottom: 1px solid #2a2a2a; position: relative;
    }
    .info-item:last-child { border-bottom: none; }
    .info-item input {
      width: calc(100% - 30px); padding: 4px 0; border: none;
      background: transparent; font-size: 14px;
      font-family: 'Merriweather', serif;
      color: #e8e0d8;
    }
    .info-item input:focus { outline: none; }
    .info-item .btn-del-info {
      background: transparent; border: none;
      color: #6b6b6b; cursor: pointer; font-size: 13px;
      position: absolute; top: 4px; right: 0;
    }
    .info-item .btn-del-info:hover { color: #c87a7a; }

    /* ===== BTN GROUPE ===== */
    .btn-groupe {
      display: flex; align-items: center; gap: 12px;
      margin-top: 16px; flex-wrap: wrap;
      border-top: 1px solid #2a2a2a; padding-top: 16px;
    }
    .btn-groupe .btn {
      padding: 8px 24px; border-radius: 30px; font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif;
      border: 1px solid #2a2a2a; background: transparent; color: #c8c0b8;
      transition: all 0.2s;
    }
    .btn-groupe .btn:hover { background: #1e1e1e; }
    .btn-groupe .btn-annuler { color: #6b6b6b; }
    .btn-groupe .btn-brouillon { color: #6b6b6b; }
    .btn-groupe .btn-brouillon.active { background: #2a2a2a; color: #e8e0d8; border-color: #2a2a2a; }
    .btn-groupe .chrono { font-size: 13px; color: #6b6b6b; font-family: 'Courier New', monospace; margin-left: auto; }
    .btn-groupe .auto-save-indicator { font-size: 12px; color: #6b6b6b; display: none; }
    .btn-groupe .auto-save-indicator.visible { display: inline; }
    .btn-groupe .auto-save-indicator.saved { color: #7ab893; }
    .btn-groupe .auto-save-indicator.saving { color: #c8b87a; }

    /* ===== MESSAGE ===== */
    .message { margin-top: 12px; font-size: 14px; text-align: center; padding: 8px 12px; border-radius: 4px; display: none; }
    .message.success { display: block; color: #7ab893; background: #1a2a1e; }
    .message.error { display: block; color: #c87a7a; background: #2a1a1a; }

    /* ===== COMPOSEUR ===== */
    .composer-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 99999; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7);
    }
    .composer-overlay.visible { display: flex; }
    .composer-content {
      background: #161616; border: 1px solid #2a2a2a;
      max-width: 90%; width: 800px; height: 80vh;
      padding: 40px 50px; position: relative;
      font-family: 'Merriweather', serif;
      border-radius: 4px;
    }
    .composer-content .composer-close {
      position: absolute; top: 12px; right: 18px;

    .composer-content .composer-close:hover { color: #e8e0d8; }
    .composer-content textarea {

      font-family: 'Inter', sans-serif;

    /* ===== RESPONSIVE ===== */

      .header-admin .header-actions { justify-content: center; }
      .section-block { padding: 10px 12px; }
    }
  </style>
</head>

    <div class="filtres-container" id="filtresCategories">

              <button type="button" class="btn-add-section" onclick="ajouterSlide()">+ slide</button>

  <!-- COMPOSEUR -->

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // ADMIN
    // ============================================================

    var tousLesPosts = [];
    var toutesLesReponses = [];
    var ongletActuel = 'tous';
    var categorieActuelle = 'toutes';
    var rechercheActuelle = '';
    var modeEdition = false;
    var estBrouillon = false;
    var chronoInterval = null;
    var chronoSeconds = 0;
    var autoSaveInterval = null;
    var autoSaveEnabled = true;

    var niveauxData = [];
    var categoriesData = [];

    var slidesData = [];
    var slidesIdee = [];
    var quizData = [];
    var openQuestionsData = [];
    var infosData = [];

    var composeurIndex = -1;
    var retenirOpen = false;

    var dragIndexPost = null;
    var dragCategorieActuelle = '';

    // ============================================================
    // CHRONO
    // ============================================================
    function startChrono() {
      chronoSeconds = 0;
      updateChronoDisplay();
      if (chronoInterval) clearInterval(chronoInterval);
      chronoInterval = setInterval(function() {
        chronoSeconds++;
        updateChronoDisplay();
      }, 1000);
    }

    function stopChrono() {
      if (chronoInterval) {
        clearInterval(chronoInterval);
        chronoInterval = null;
      }
    }

    function updateChronoDisplay() {
      var mins = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
      var secs = String(chronoSeconds % 60).padStart(2, '0');
      document.getElementById('chronoDisplay').textContent = mins + ':' + secs;
    }

    // ============================================================
    // SAUVEGARDE AUTOMATIQUE
    // ============================================================
    function demarrerAutoSave() {
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      autoSaveInterval = setInterval(function() {
        if (document.getElementById('modalTexte').classList.contains('visible')) {
          sauvegarderAuto();
        }
      }, 30000);
    }

    function arreterAutoSave() {
      if (autoSaveInterval) {
        clearInterval(autoSaveInterval);
        autoSaveInterval = null;
      }
    }

    function sauvegarderAuto() {
      var indicator = document.getElementById('autoSaveIndicator');
      indicator.textContent = '💾 Sauvegarde...';
      indicator.className = 'auto-save-indicator visible saving';
      
      var data = {
        slidesData: slidesData,
        slidesIdee: slidesIdee,
        quizData: quizData,
        openQuestionsData: openQuestionsData,
        infosData: infosData,
        retenirOpen: retenirOpen,
        retenir1: document.getElementById('retenir1').value,
        retenir2: document.getElementById('retenir2').value,
        retenir3: document.getElementById('retenir3').value,
        titre: document.getElementById('inputTitre').value,
        date: document.getElementById('inputDate').value,
        niveau: document.getElementById('inputNiveau').value,
        categorie: document.getElementById('inputCategorie').value,
        timestamp: Date.now()
      };
      
      try {
        localStorage.setItem('admin_auto_save', JSON.stringify(data));
        indicator.textContent = '💾 Sauvegardé';
        indicator.className = 'auto-save-indicator visible saved';
        setTimeout(function() {
          indicator.className = 'auto-save-indicator visible';
        }, 2000);
      } catch(e) {
        indicator.textContent = '⚠️ Erreur';
        indicator.className = 'auto-save-indicator visible';
      }
    }

    function chargerAutoSave() {
      try {
        var saved = localStorage.getItem('admin_auto_save');
        if (!saved) return;
        var data = JSON.parse(saved);
        var age = (Date.now() - data.timestamp) / 60000;
        if (age > 60) {
          localStorage.removeItem('admin_auto_save');
          return;
        }
        
        if (confirm('💾 Une sauvegarde automatique de ' + Math.round(age) + ' min existe. Voulez-vous la restaurer ?')) {
          slidesData = data.slidesData || [''];
          slidesIdee = data.slidesIdee || [false];
          quizData = data.quizData || [{ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] }];
          openQuestionsData = data.openQuestionsData || [''];
          infosData = data.infosData || [''];
          retenirOpen = data.retenirOpen || false;
          
          document.getElementById('inputTitre').value = data.titre || '';
          document.getElementById('inputDate').value = data.date || '';
          if (data.niveau) {
            var sn = document.getElementById('inputNiveau');
            for (var i = 0; i < sn.options.length; i++) {
              if (sn.options[i].value == data.niveau) { sn.selectedIndex = i; break; }
            }
          }
          if (data.categorie) {
            var sc = document.getElementById('inputCategorie');
            for (var i = 0; i < sc.options.length; i++) {
              if (sc.options[i].value === data.categorie) { sc.selectedIndex = i; break; }
            }
          }
          document.getElementById('retenir1').value = data.retenir1 || '';
          document.getElementById('retenir2').value = data.retenir2 || '';
          document.getElementById('retenir3').value = data.retenir3 || '';
          
          if (retenirOpen) {
            document.getElementById('retenirChamps').classList.add('open');
          }
          
          afficherSlides();
          afficherQuiz();
          afficherOpenQuestions();
          afficherInfos();
          
          localStorage.removeItem('admin_auto_save');
          document.getElementById('autoSaveIndicator').textContent = '💾 Restauré';
          document.getElementById('autoSaveIndicator').className = 'auto-save-indicator visible saved';
          setTimeout(function() {
            document.getElementById('autoSaveIndicator').className = 'auto-save-indicator';
          }, 3000);
        }
      } catch(e) {
        console.error('Erreur restauration auto-save:', e);
      }
    }

    // ============================================================
    // CHARGER NIVEAUX ET CATÉGORIES
    // ============================================================
    function chargerNiveauxEtCategories() {
      var urlNiveaux = CONFIG.SCRIPT_URL + '?action=getNiveaux';
      fetch(urlNiveaux)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            niveauxData = data.niveaux || [];
            remplirSelectNiveaux();
          }
        })
        .catch(function(e) { console.error('Erreur niveaux:', e); });

      var urlCategories = CONFIG.SCRIPT_URL + '?action=getLabels';
      fetch(urlCategories)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            categoriesData = data.labels || [];
            remplirSelectCategories();
          }
        })
        .catch(function(e) { console.error('Erreur catégories:', e); });
    }

    function remplirSelectNiveaux() {
      var select = document.getElementById('inputNiveau');
      select.innerHTML = '';
      if (niveauxData.length === 0) {
        for (var i = 1; i <= 12; i++) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = 'Nvx ' + i;
          select.appendChild(opt);
        }
      } else {
        niveauxData.forEach(function(n) {
          var opt = document.createElement('option');
          opt.value = n.valeur;
          opt.textContent = 'Nvx ' + n.valeur + (n.description ? ' - ' + n.description : '');
          select.appendChild(opt);
        });
      }
    }

    function remplirSelectCategories() {
      var select = document.getElementById('inputCategorie');
      select.innerHTML = '';
      if (categoriesData.length === 0) {
        var defaults = ['Foi', 'Rappels divers', 'Sourate', 'Hadith', 'Méditation', 'Invocation', 'Histoire', 'Morale', 'Autre'];
        defaults.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      } else {
        categoriesData.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }
    }

    // ============================================================
    // NOUVELLE CATÉGORIE DANS LE POPUP
    // ============================================================
    function ajouterNouvelleCategorie() {
      var input = document.getElementById('inputNouvelleCategorie');
      var cat = input.value.trim();
      if (!cat) { alert('Veuillez saisir un nom de catégorie.'); return; }
      if (categoriesData.indexOf(cat) !== -1) { alert('Cette catégorie existe déjà.'); return; }
      
      categoriesData.push(cat);
      var url = CONFIG.SCRIPT_URL + '?action=addLabel&label=' + encodeURIComponent(cat);
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            input.value = '';
            remplirSelectCategories();
            var select = document.getElementById('inputCategorie');
            for (var i = 0; i < select.options.length; i++) {
              if (select.options[i].value === cat) {
                select.selectedIndex = i;
                break;
              }
            }
            alert('✅ Catégorie "' + cat + '" ajoutée !');
          } else {
            alert('❌ Erreur : ' + data.message);
          }
        })
        .catch(function(e) { alert('❌ Erreur : ' + e.message); });
    }

    // ============================================================
    // CHARGEMENT ADMIN
    // ============================================================
    function chargerAdmin() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) { 
        window.location.href = '/medit/index.html'; 
        return; 
      }

      if (id !== 'admin') {
        window.location.href = '/medit/mes-textes.html';
        return;
      }

      chargerNiveauxEtCategories();

      DataManager.charger()
        .then(function(data) {
          tousLesPosts = data.posts || [];
          toutesLesReponses = data.reponses || [];
          
          tousLesPosts.forEach(function(p) {
            if (!p.statut) {
              p.statut = 'publie';
            } else {
              p.statut = p.statut.trim().toLowerCase();
            }
            if (p.statut !== 'publie' && p.statut !== 'brouillon') {
              p.statut = 'publie';
            }
            if (!p.versions) p.versions = 1;
            if (!p.dateModif) p.dateModif = '';
          });
          
          afficherAdmin();
          demarrerAutoSave();
        })
        .catch(function(error) {
          console.error('Erreur:', error);
          var loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide">
              <span class="icone">⚠️</span>
              <h2>Erreur de chargement</h2>
              <p>${error.message || 'Vérifiez votre connexion.'}</p>
              <button onclick="location.reload();" style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid #2a2a2a;border-radius:30px;cursor:pointer;color:#e8e0d8;">Réessayer</button>
            </div>
          `;
        });
    }

    // ============================================================
    // AFFICHER ADMIN
    // ============================================================
    function afficherAdmin() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.style.display = 'none';
      }

      var total = tousLesPosts.length;
      var publies = tousLesPosts.filter(function(p) { return p.statut === 'publie'; }).length;
      var brouillons = tousLesPosts.filter(function(p) { return p.statut === 'brouillon'; }).length;
      
      var totalLectures = 0;
      toutesLesReponses.forEach(function(r) {
        if (r.bonnes > 0 || r.total > 0) totalLectures++;
      });

      document.getElementById('totalPosts').textContent = total;
      document.getElementById('publiesPosts').textContent = publies;
      document.getElementById('brouillonsPosts').textContent = brouillons;
      document.getElementById('totalLectures').textContent = totalLectures;
      document.getElementById('compteurTous').textContent = total;
      document.getElementById('compteurPublies').textContent = publies;
      document.getElementById('compteurBrouillons').textContent = brouillons;

      genererFiltresCategories();

      var postsFiltres = filtrerPosts();
      afficherPosts(postsFiltres);
    }

    // ============================================================
    // FILTRER POSTS
    // ============================================================
    function filtrerPosts() {
      var resultats = [];
      
      if (ongletActuel === 'tous') {
        resultats = tousLesPosts.slice();
      } else if (ongletActuel === 'publies') {
        resultats = tousLesPosts.filter(function(p) { return p.statut === 'publie'; });
      } else if (ongletActuel === 'brouillons') {
        resultats = tousLesPosts.filter(function(p) { return p.statut === 'brouillon'; });
      }
      
      if (categorieActuelle !== 'toutes') {
        resultats = resultats.filter(function(p) { return p.categorie === categorieActuelle; });
      }
      
      if (rechercheActuelle.trim() !== '') {
        var search = rechercheActuelle.trim().toLowerCase();
        resultats = resultats.filter(function(p) {
          return (p.titre && p.titre.toLowerCase().includes(search)) ||
                 (p.contenu && p.contenu.toLowerCase().includes(search));
        });
      }
      
      return resultats;
    }

    // ============================================================
    // RECHERCHE
    // ============================================================
    function appliquerRecherche() {
      rechercheActuelle = document.getElementById('searchInput').value;
      afficherAdmin();
    }

    // ============================================================
    // AFFICHER POSTS
    // ============================================================
    function afficherPosts(posts) {
      var container = document.getElementById('contenu');

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="vide">
            <span class="icone">📭</span>
            <h2>Aucun texte</h2>
            <p>Aucun texte ne correspond à vos critères.</p>
          </div>
        `;
        return;
      }

      posts.sort(function(a, b) {
        return (a.ordre || 999) - (b.ordre || 999);
      });

      var html = '<div class="grille">';

      posts.forEach(function(post, index) {
        var statutLabel = post.statut === 'publie' ? 'Publié' : 'Brouillon';
        var statutClass = post.statut === 'publie' ? 'publie' : 'brouillon';
        var estPublie = post.statut === 'publie';
        
        var ordreHtml = post.ordre ? '<span class="ordre-badge">#' + post.ordre + '</span>' : '';
        
        // Statistiques de lecture
        var lectures = toutesLesReponses.filter(function(r) { return r.articleId === post.id; });
        var nbLectures = lectures.length;
        var nbQuiz = lectures.filter(function(r) { return r.bonnes > 0 || r.total > 0; }).length;
        var nbReponses = lectures.filter(function(r) { return r.reponseOuverte && r.reponseOuverte.trim() !== ''; }).length;
        
        var statsHtml = '';
        if (nbLectures > 0) {
          statsHtml = '<span class="stat-lecture">📖 ' + nbLectures + ' lectures' +
            (nbQuiz > 0 ? ' | 🧪 ' + nbQuiz + ' quiz' : '') +
            (nbReponses > 0 ? ' | ✏️ ' + nbReponses + ' réponses' : '') +
            '</span>';
        }

        // === INFOS ===
        var nbSlides = post.contenu ? post.contenu.split('-s-').length - 1 : 0;
        var hasQuiz = post.contenu && post.contenu.includes('-q-');
        var hasQuestion = post.contenu && post.contenu.includes('-qs-');
        var hasRetenir = post.contenu && post.contenu.includes('-r-');
        var hasInfo = post.contenu && post.contenu.includes('-i-');
        var mots = post.mots || 0;
        
        var infoBadges = '';
        infoBadges += '<span class="info-badge">📄 ' + nbSlides + ' slides</span>';
        if (hasQuiz) infoBadges += '<span class="info-badge">🧪 Quiz</span>';
        if (hasQuestion) infoBadges += '<span class="info-badge">✏️ Q. ouverte</span>';
        if (hasRetenir) infoBadges += '<span class="info-badge">📌 Mémo</span>';
        if (hasInfo) infoBadges += '<span class="info-badge">ℹ️ Infos</span>';
        if (mots > 0) infoBadges += '<span class="info-badge">📝 ' + mots + ' mots</span>';
        
        // Date : afficher la colonne B (date) en priorité, sinon la colonne H (dateModif)
        var dateCreation = post.date ? new Date(post.date) : null;
        var dateModif = post.dateModif ? new Date(post.dateModif) : null;
        var dateStr = '';
        if (dateCreation) {
          dateStr = 'Créé le ' + dateCreation.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
        } else if (dateModif) {
          dateStr = 'Modifié le ' + dateModif.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
        }
        var versionsStr = post.versions ? ' v' + post.versions : '';

        // === APERÇU NETTOYÉ (sans -s-) ===
        var apercuHtml = '';
        if (post.contenu) {
          var apercu = post.contenu.replace(/-s-/g, '').trim();
          if (apercu.length > 150) apercu = apercu.substring(0, 150) + '...';
          if (apercu.trim()) {
            apercuHtml = `
              <div class="apercu-rapide">
                ${apercu}
              </div>
            `;
          }
        }

        html += `
          <div class="carte-post" data-id="${post.id}" data-index="${index}" data-categorie="${post.categorie || 'Sans catégorie'}" onclick="modifierPost('${post.id}')">
            <div class="infos">
              <div class="titre">
                <span class="drag-handle" onclick="event.stopPropagation(); event.preventDefault();">⠿</span>
                ${post.titre || 'Sans titre'}
                ${ordreHtml}
                <span style="font-size:11px;color:#4a4a4a;font-weight:400;margin-left:8px;">${dateStr}${versionsStr}</span>
              </div>
              <div class="meta">
                <span>Niveau ${post.niveau || 0}</span>
                <span>${post.categorie || 'Sans catégorie'}</span>
                <span class="badge ${statutClass}">${statutLabel}</span>
                ${infoBadges}
                ${statsHtml}
              </div>
              ${apercuHtml}
            </div>
            <div class="actions">
              <button class="btn-exporter" onclick="event.stopPropagation(); exporterPost('${post.id}')">📤 Exporter</button>
              <button class="${estPublie ? 'btn-statut-brouillon' : 'btn-statut-publier'}" onclick="event.stopPropagation(); ${estPublie ? 'changerStatut(\'' + post.id + '\', \'brouillon\')' : 'changerStatut(\'' + post.id + '\', \'publie\')'}">${estPublie ? 'Passer en brouillon' : 'Publier'}</button>
              <button class="btn-supprimer" onclick="event.stopPropagation(); supprimerPost('${post.id}')">✕</button>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
      
      initDragDropPosts();
    }

    // ============================================================
    // DRAG & DROP POUR RÉORGANISER LES ARTICLES
    // ============================================================
    function initDragDropPosts() {
      var items = document.querySelectorAll('.carte-post[data-id]');
      items.forEach(function(item) {
        item.setAttribute('draggable', 'true');
        
        item.addEventListener('dragstart', function(e) {
          dragIndexPost = parseInt(this.dataset.index);
          dragCategorieActuelle = this.dataset.categorie;
          this.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        
        item.addEventListener('dragend', function(e) {
          this.classList.remove('dragging');
          document.querySelectorAll('.carte-post.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
        });
        
        item.addEventListener('dragover', function(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.carte-post.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          if (this.dataset.categorie === dragCategorieActuelle) {
            this.classList.add('drag-over');
          }
        });
        
        item.addEventListener('dragleave', function(e) {
          this.classList.remove('drag-over');
        });
        
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          this.classList.remove('drag-over');
          var targetIndex = parseInt(this.dataset.index);
          
          if (this.dataset.categorie !== dragCategorieActuelle) {
            alert('Impossible de déplacer un article dans une autre catégorie.');
            return;
          }
          
          if (dragIndexPost !== null && dragIndexPost !== targetIndex) {
            var postsCategorie = tousLesPosts.filter(function(p) {
              return p.categorie === dragCategorieActuelle;
            });
            postsCategorie.sort(function(a, b) {
              return (a.ordre || 999) - (b.ordre || 999);
            });
            
            var draggedPost = postsCategorie[dragIndexPost];
            var targetPost = postsCategorie[targetIndex];
            var tempOrdre = draggedPost.ordre || (dragIndexPost + 1);
            draggedPost.ordre = targetPost.ordre || (targetIndex + 1);
            targetPost.ordre = tempOrdre;
            
            sauvegarderOrdresCategorie(dragCategorieActuelle);
          }
        });
      });
    }

    // ============================================================
    // SAUVEGARDER L'ORDRE DES ARTICLES D'UNE CATÉGORIE
    // ============================================================
    function sauvegarderOrdresCategorie(categorie) {
      var postsCategorie = tousLesPosts.filter(function(p) {
        return p.categorie === categorie;
      });
      postsCategorie.sort(function(a, b) {
        return (a.ordre || 999) - (b.ordre || 999);
      });
      
      postsCategorie.forEach(function(p, index) {
        p.ordre = index + 1;
      });
      
      var url = CONFIG.SCRIPT_URL + '?action=updateOrdres';
      postsCategorie.forEach(function(p) {
        url += '&id[]=' + encodeURIComponent(p.id) + '&ordre[]=' + encodeURIComponent(p.ordre);
      });
      
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            console.log('✅ Ordres sauvegardés pour la catégorie "' + categorie + '"');
            mettreAJourBadgesOrdre();
          } else {
            console.error('❌ Erreur sauvegarde ordres:', data.message);
          }
        })
        .catch(function(e) {
          console.error('❌ Erreur:', e);
        });
    }

    // ============================================================
    // GÉNÉRER FILTRES CATÉGORIES
    // ============================================================
    function genererFiltresCategories() {
      var cats = {};
      
      tousLesPosts.forEach(function(post) {
        var cat = post.categorie || 'Sans catégorie';
        if (!cats[cat]) cats[cat] = 0;
        cats[cat]++;
      });
      
      var container = document.getElementById('filtresCategories');
      var total = tousLesPosts.length;
      
      var html = '<button class="filtre-cat-btn active" data-cat="toutes" onclick="filtrerParCategorie(\'toutes\')">Toutes <span class="compteur-cat">' + total + '</span></button>';
      
      var categoriesTriees = Object.keys(cats).sort();
      categoriesTriees.forEach(function(cat) {
        var count = cats[cat];
        var activeClass = (categorieActuelle === cat) ? ' active' : '';
        var isDefault = categoriesData.indexOf(cat) === -1 && cat !== 'Sans catégorie';
        html += '<button class="filtre-cat-btn' + activeClass + '" data-cat="' + cat + '" onclick="filtrerParCategorie(\'' + cat + '\')">' + cat + ' <span class="compteur-cat">' + count + '</span>' +
          (isDefault ? ' <span class="btn-del-cat" onclick="event.stopPropagation(); supprimerCategorie(\'' + cat + '\')">✕</span>' : '') +
          '</button>';
      });
      
      container.innerHTML = html;
    }

    // ============================================================
    // EXPORTER TOUT
    // ============================================================
    function exporterTout() {
      if (tousLesPosts.length === 0) {
        alert('Aucun article à exporter.');
        return;
      }
      
      var data = {
        exportDate: new Date().toISOString(),
        total: tousLesPosts.length,
        posts: tousLesPosts.map(function(p) {
          return {
            id: p.id,
            titre: p.titre,
            niveau: p.niveau,
            categorie: p.categorie,
            date: p.date,
            statut: p.statut,
            contenu: p.contenu ? p.contenu.replace(/ \| /g, '\n') : '',
            mots: p.mots,
            hasQuiz: p.hasQuiz,
            hasQuestion: p.hasQuestion,
            ordre: p.ordre || 0,
            versions: p.versions || 1,
            dateModif: p.dateModif || ''
          };
        })
      };
      
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'export_tous_articles_' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      alert('✅ Exportation de ' + tousLesPosts.length + ' articles terminée !');
    }

    // ============================================================

    // ============================================================
    var dragIndex = null;

    function initDragDrop() {
      var items = document.querySelectorAll('.slide-item');
      items.forEach(function(item) {
        item.addEventListener('dragstart', function(e) {
          dragIndex = parseInt(this.dataset.index);
          this.classList.add('dragging');
        });
        item.addEventListener('dragend', function(e) {
          this.classList.remove('dragging');
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
        });
        item.addEventListener('dragover', function(e) {
          e.preventDefault();
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          this.classList.add('drag-over');
        });
        item.addEventListener('dragleave', function(e) {
          this.classList.remove('drag-over');
        });
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          this.classList.remove('drag-over');
          var targetIndex = parseInt(this.dataset.index);
          if (dragIndex !== null && dragIndex !== targetIndex) {
            var slideMoved = slidesData.splice(dragIndex, 1)[0];
            slidesData.splice(targetIndex, 0, slideMoved);
            var ideeMoved = slidesIdee.splice(dragIndex, 1)[0];
            slidesIdee.splice(targetIndex, 0, ideeMoved);
            afficherSlides();
          }
        });
      });
    }

    function ajouterSlide() {
      slidesData.push('');
      slidesIdee.push(false);
      afficherSlides();
    }

    function supprimerSlide(index) {
      slidesData.splice(index, 1);
      slidesIdee.splice(index, 1);
      if (slidesData.length === 0) {
        slidesData.push('');
        slidesIdee.push(false);
      }
      afficherSlides();
    }

    function afficherSlides() {
      var container = document.getElementById('slidesList');
      if (slidesData.length === 0) {
        container.innerHTML = '<div style="color:#4a4a4a;font-style:italic;padding:4px 0;">Aucune slide</div>';
        return;
      }
      var html = '';
      slidesData.forEach(function(slide, index) {
        var preview = slide.length > 60 ? slide.substring(0, 60) + '...' : slide;
        var ideeClass = slidesIdee[index] ? 'idee' : '';
        var displayText = preview || '<span class="slide-placeholder">Slide vide</span>';
        html += `
          <div class="slide-item ${ideeClass}" draggable="true" data-index="${index}">
            <span class="slide-handle">⠿</span>
            <span class="slide-texte" onclick="ouvrirComposeur(${index})">${displayText}</span>
            <button class="btn-del-slide" onclick="event.stopPropagation(); supprimerSlide(${index})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
      initDragDrop();
    }

    function validerComposeur() {
      var texte = document.getElementById('composeurTextarea').value.trim();
      if (!texte) { alert('Veuillez écrire du contenu.'); return; }

      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = texte;
        slidesIdee[composeurIndex] = false;
      } else {
        slidesData.push(texte);

        slidesIdee[composeurIndex] = true;

    // ============================================================
    // QUIZ - AVEC AUTO-INVERSION V/F
    // ============================================================
    function ajouterQuestion() {
      quizData.push({
        question: '',
        reponses: [
          { texte: '', correct: true },
          { texte: '', correct: false }
        ]
      });
      afficherQuiz();
    }

    function supprimerQuestion(index) {
      quizData.splice(index, 1);
      if (quizData.length === 0) {
        quizData.push({ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] });
      }
      afficherQuiz();
    }

    function ajouterReponse(quizIndex) {
      quizData[quizIndex].reponses.push({ texte: '', correct: false });
      afficherQuiz();
    }

    function supprimerReponse(quizIndex, repIndex) {
      quizData[quizIndex].reponses.splice(repIndex, 1);
      if (quizData[quizIndex].reponses.length === 0) {
        quizData[quizIndex].reponses.push({ texte: '', correct: true });
      }
      afficherQuiz();
    }

    function setVraiFaux(quizIndex, repIndex, estVrai) {
      var q = quizData[quizIndex];
      q.reponses[repIndex].correct = estVrai;
      
      // Auto-inversion : si on met une réponse à Vrai, les autres passent à Faux
      if (estVrai) {
        for (var i = 0; i < q.reponses.length; i++) {
          if (i !== repIndex) {
            q.reponses[i].correct = false;
          }
        }
      }
      afficherQuiz();
    }

    function afficherQuiz() {
      var container = document.getElementById('quizList');
      if (quizData.length === 0) {
        container.innerHTML = '<div style="color:#4a4a4a;font-style:italic;padding:4px 0;">Aucun quiz</div>';
        return;
      }
      var html = '';
      quizData.forEach(function(q, qi) {
        html += `
          <div class="quiz-item">
            <input type="text" class="q-text" placeholder="Question QCM..." value="${q.question}" 
                   onchange="quizData[${qi}].question = this.value">
            <div class="quiz-reponses">
        `;
        q.reponses.forEach(function(r, ri) {
          var lettre = String.fromCharCode(65 + ri);
          html += `
            <input type="text" placeholder="Réponse ${lettre}" value="${r.texte}" 
                   style="flex:1;min-width:60px;" 
                   onchange="quizData[${qi}].reponses[${ri}].texte = this.value">
            <div class="vf-group">
              <button class="vf-btn ${r.correct ? 'active' : ''}" onclick="setVraiFaux(${qi}, ${ri}, true)">V</button>
              <button class="vf-btn ${!r.correct ? 'active' : ''}" onclick="setVraiFaux(${qi}, ${ri}, false)">F</button>
            </div>
            <button class="btn-del-quiz" onclick="supprimerReponse(${qi}, ${ri})">✕</button>
          `;
        });
        html += `
            </div>
            <button class="btn-add-section" onclick="ajouterReponse(${qi})" style="font-size:11px;padding:2px 10px;border:1px solid #2a2a2a;border-radius:30px;background:transparent;color:#6b6b6b;cursor:pointer;">+ réponse</button>
            <button class="btn-del-quiz" onclick="supprimerQuestion(${qi})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

      infosData.forEach(function(info, ii) {
        html += `
          <div class="info-item">
            <input type="text" placeholder="Info..." value="${info}" 
                   onchange="infosData[${ii}] = this.value">
            <button class="btn-del-info" onclick="supprimerInfo(${ii})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // ============================================================
    // BROUILLON
    // ============================================================
    function toggleBrouillon() {
      estBrouillon = !estBrouillon;
      var btn = document.getElementById('btnBrouillon');
      btn.classList.toggle('active');
      btn.textContent = estBrouillon ? '✓ Brouillon' : 'Brouillon';
    }

    // ============================================================
    // ENREGISTRER
    // ============================================================
    function enregistrerTexte() {
      var id = document.getElementById('editId').value;
      var titre = document.getElementById('inputTitre').value.trim();
      var niveau = document.getElementById('inputNiveau').value;
      var categorie = document.getElementById('inputCategorie').value;
      var statut = estBrouillon ? 'brouillon' : 'publie';
      var msg = document.getElementById('messageTexte');

      var r1 = document.getElementById('retenir1').value.trim();
      var r2 = document.getElementById('retenir2').value.trim();
      var r3 = document.getElementById('retenir3').value.trim();
      var retenir = [r1, r2, r3].filter(function(m) { return m.length > 0; }).join(', ');

      if (!titre) { afficherMsgTexte('Veuillez saisir un titre', 'error'); return; }
      if (slidesData.length === 0) { afficherMsgTexte('Veuillez ajouter au moins une slide', 'error'); return; }

      var colonnes = [];

      var slidesReelles = slidesData.filter(function(s, i) { return !slidesIdee[i]; });
      slidesReelles.forEach(function(slide) {
        colonnes.push('-s- ' + slide);
      });

      quizData.forEach(function(q) {
        if (q.question.trim() || q.reponses.some(function(r) { return r.texte.trim(); })) {
          colonnes.push('-q- ' + q.question);
          q.reponses.forEach(function(r) {
            colonnes.push((r.correct ? '-v- ' : '-f- ') + r.texte);
          });
        }
      });

      openQuestionsData.forEach(function(q) {
        if (q.trim()) {
          colonnes.push('-qs- ' + q);
        }
      });

      if (retenir) {
        colonnes.push('-r- ' + retenir);
      }

      infosData.forEach(function(info) {
        if (info.trim()) {
          colonnes.push('-i- ' + info);
        }
      });

      var btn = document.getElementById('btnEnregistrer');
      btn.textContent = 'Enregistrement...';
      btn.disabled = true;
      msg.style.display = 'none';

      var maintenant = new Date().toISOString();
      var dateCreation = document.getElementById('inputDate').value;

      if (modeEdition && id) {
        var version = 1;
        var postExistant = tousLesPosts.find(function(p) { return p.id === id; });
        if (postExistant) {
          version = (postExistant.versions || 1) + 1;
        }
        
        var url = CONFIG.SCRIPT_URL + '?action=updatePostCols' +
          '&id=' + encodeURIComponent(id) +
          '&titre=' + encodeURIComponent(titre) +
          '&niveau=' + encodeURIComponent(niveau) +
          '&categorie=' + encodeURIComponent(categorie) +
          '&statut=' + encodeURIComponent(statut) +
          '&versions=' + encodeURIComponent(version) +
          '&dateModif=' + encodeURIComponent(maintenant);

        // Ajouter les colonnes dynamiques
        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }

        // Ajouter la date de création personnalisée (colonne B)
        if (dateCreation) {
          url += '&date=' + encodeURIComponent(dateCreation);
        }

        fetch(url)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              afficherMsgTexte('✅ Post mis à jour ! (v' + version + ')', 'success');
              btn.textContent = 'Mettre à jour';
              btn.disabled = false;
              fermerModalTexte();
              chargerAdmin();
            } else {
              throw new Error(data.message || 'Erreur lors de la modification');
            }
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Mettre à jour';
            btn.disabled = false;
          });
      } else {
        var url = CONFIG.SCRIPT_URL + '?action=addPost' +
          '&titre=' + encodeURIComponent(titre) +
          '&niveau=' + encodeURIComponent(niveau) +
          '&categorie=' + encodeURIComponent(categorie) +
          '&statut=' + encodeURIComponent(statut) +
          '&versions=' + encodeURIComponent(1);

        // Ajouter la date de création personnalisée (colonne B)
        if (dateCreation) {
          url += '&date=' + encodeURIComponent(dateCreation);
        }

        // Ajouter les colonnes dynamiques
        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }

        fetch(url)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              afficherMsgTexte('✅ Post ajouté !', 'success');
              btn.textContent = 'Ajouter';
              btn.disabled = false;
              fermerModalTexte();
              chargerAdmin();
            } else {
              throw new Error(data.message || 'Erreur lors de la création');
            }
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Ajouter';
            btn.disabled = false;
          });
      }
    }

    function afficherMsgTexte(texte, type) {
      var msg = document.getElementById('messageTexte');
      msg.textContent = texte;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }

    // ============================================================
    // MODIFIER POST
    // ============================================================
    function modifierPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      modeEdition = true;
      estBrouillon = post.statut === 'brouillon';
      document.getElementById('modalTitre').textContent = 'Texte';
      document.getElementById('btnEnregistrer').textContent = 'Mettre à jour';
      document.getElementById('editId').value = postId;

      // Pré-remplir la date avec la date de création (colonne B)
      if (post.date) {
        var d = new Date(post.date);
        if (!isNaN(d.getTime())) {
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, '0');
          var dd = String(d.getDate()).padStart(2, '0');
          document.getElementById('inputDate').removeAttribute('readonly');
          document.getElementById('inputDate').value = y + '-' + m + '-' + dd;
document.getElementById('inputDate').setAttribute('readonly', true);
        }
      }

      document.getElementById('inputTitre').value = post.titre || '';

      var selectNiveau = document.getElementById('inputNiveau');
      for (var i = 0; i < selectNiveau.options.length; i++) {
        if (selectNiveau.options[i].value == post.niveau) {
          selectNiveau.selectedIndex = i;
          break;
        }
      }

      var selectCategorie = document.getElementById('inputCategorie');
      for (var i = 0; i < selectCategorie.options.length; i++) {
        if (selectCategorie.options[i].value === post.categorie) {
          selectCategorie.selectedIndex = i;
          break;
        }
      }

      var btnBrouillon = document.getElementById('btnBrouillon');
      if (estBrouillon) {
        btnBrouillon.classList.add('active');
        btnBrouillon.textContent = '✓ Brouillon';
      } else {
        btnBrouillon.classList.remove('active');
        btnBrouillon.textContent = 'Brouillon';
      }

      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');

      if (post.contenu) {
        var colonnes = post.contenu.split(' | ');
        
        for (var i = 0; i < colonnes.length; i++) {
          var ligne = colonnes[i].trim();
          if (!ligne) continue;

          if (ligne.startsWith('-s-')) {
            slidesData.push(ligne.replace('-s-', '').trim());
            slidesIdee.push(false);
          } else if (ligne.startsWith('-q-')) {
            var qText = ligne.replace('-q-', '').trim();
            var reponses = [];
            for (var j = i + 1; j < colonnes.length; j++) {
              var nextLine = colonnes[j].trim();
              if (nextLine.startsWith('-v-')) {
                reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
                i = j;
              } else if (nextLine.startsWith('-f-')) {
                reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
                i = j;
              } else {
                break;
              }
            }
            if (reponses.length === 0) {
              reponses.push({ texte: '', correct: true });
              reponses.push({ texte: '', correct: false });
            }
            quizData.push({ question: qText, reponses: reponses });
          } else if (ligne.startsWith('-qs-')) {
            openQuestionsData.push(ligne.replace('-qs-', '').trim());
          } else if (ligne.startsWith('-r-')) {
            var retenirText = ligne.replace('-r-', '').trim();
            var mots = retenirText.split(',').map(function(m) { return m.trim(); });
            document.getElementById('retenir1').value = mots[0] || '';
            document.getElementById('retenir2').value = mots[1] || '';
            document.getElementById('retenir3').value = mots[2] || '';
            retenirOpen = true;
            document.getElementById('retenirChamps').classList.add('open');
          } else if (ligne.startsWith('-i-')) {
            infosData.push(ligne.replace('-i-', '').trim());
          }
        }
      }

      if (slidesData.length === 0) { slidesData.push(''); slidesIdee.push(false); }
      if (quizData.length === 0) {
        quizData.push({ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] });
      }
      if (openQuestionsData.length === 0) openQuestionsData.push('');
      if (infosData.length === 0) infosData.push('');

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('modalTexte').classList.add('visible');
      document.getElementById('messageTexte').style.display = 'none';
      document.getElementById('inputTitre').focus();

      startChrono();
    }

        // ============================================================
    // EXPORTER POST
    // ============================================================
    function exporterPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      var contenu = '';
      contenu += 'Nvx: ' + (post.niveau || 0) + '\n';
      contenu += 'Cat: ' + (post.categorie || 'Sans catégorie') + '\n\n';

      if (post.contenu) {
        var lignes = post.contenu.split(' | ');
        var quizEnCours = null;
        var firstSection = true;

        for (var i = 0; i < lignes.length; i++) {
          var ligne = lignes[i].trim();
          if (!ligne) continue;

          // --- SLIDES ---
          if (ligne.startsWith('-s-')) {
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }

          // --- QUIZ ---
          else if (ligne.startsWith('-q-')) {
            if (quizEnCours) {
              // Fermer le quiz précédent
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              contenu += '\n';
            }
            // Ajouter une ligne vide avant le quiz (sauf si c'est le premier élément)
            if (!firstSection) {
              contenu += '\n';
            }
            quizEnCours = { question: ligne, reponses: [] };
            contenu += ligne + '\n';
            firstSection = false;
          }
          else if (ligne.startsWith('-v-') || ligne.startsWith('-f-')) {
            if (quizEnCours) {
              quizEnCours.reponses.push(ligne);
            } else {
              // Si une réponse arrive sans question, on la traite normalement
              if (!firstSection) {
                contenu += '\n';
              }
              contenu += ligne + '\n';
              firstSection = false;
            }
          }

          // --- QUESTIONS OUVERTES ---
          else if (ligne.startsWith('-qs-')) {
            if (quizEnCours) {
              // Fermer le quiz en cours
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            // Ajouter une ligne vide avant la question ouverte
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }

          // --- RETENIR ---
          else if (ligne.startsWith('-r-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            // Ajouter une ligne vide avant retenir
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }

          // --- INFOS ---
          else if (ligne.startsWith('-i-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }

          // --- AUTRE (cas où une ligne ne commence par aucun code connu) ---
          else {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
        }

        // Fermer le dernier quiz s'il existe
        if (quizEnCours) {
          quizEnCours.reponses.forEach(function(r) {
            contenu += r + '\n';
          });
        }

        // Supprimer les sauts de ligne en trop à la fin
        contenu = contenu.replace(/\n{3,}$/, '\n\n');

      } else {
        contenu += '-s- ' + (post.titre || 'Sans titre') + '\n\n';
      }

      var blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (post.titre || 'post') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ============================================================
    // IMPORTER (maintenant en dehors du popup)
    // ============================================================
    function importerTexte() {
      document.getElementById('fileInput').click();
    }

    function importerFichier(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        var contenu = e.target.result;
        parserContenu(contenu);
        document.getElementById('fileInput').value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    // ============================================================
    // PARSER CONTENU (IMPORT)
    // ============================================================
    function parserContenu(contenu) {
      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');
      document.getElementById('retenir1').value = '';
      document.getElementById('retenir2').value = '';
      document.getElementById('retenir3').value = '';

      var colonnes;
      if (contenu.includes('\n')) {
        colonnes = contenu.split('\n').filter(function(l) { return l.trim() !== ''; });
      } else {
        colonnes = contenu.split(' | ');
      }

      for (var i = 0; i < colonnes.length; i++) {
        var ligne = colonnes[i].trim();
        if (!ligne) continue;

        if (ligne.startsWith('Nvx:') || ligne.startsWith('Cat:')) continue;

        if (ligne.startsWith('-s-')) {
          slidesData.push(ligne.replace('-s-', '').trim());
          slidesIdee.push(false);
        } else if (ligne.startsWith('-q-')) {
          var qText = ligne.replace('-q-', '').trim();
          var reponses = [];
          for (var j = i + 1; j < colonnes.length; j++) {
            var nextLine = colonnes[j].trim();
            if (nextLine.startsWith('-v-')) {
              reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
              i = j;
            } else if (nextLine.startsWith('-f-')) {
              reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
              i = j;
            } else {
              break;
            }
          }
          if (reponses.length === 0) {
            reponses.push({ texte: '', correct: true });
            reponses.push({ texte: '', correct: false });
          }
          quizData.push({ question: qText, reponses: reponses });
        } else if (ligne.startsWith('-qs-')) {
          openQuestionsData.push(ligne.replace('-qs-', '').trim());
        } else if (ligne.startsWith('-r-')) {
          var retenirText = ligne.replace('-r-', '').trim();
          var mots = retenirText.split(',').map(function(m) { return m.trim(); });
          document.getElementById('retenir1').value = mots[0] || '';
          document.getElementById('retenir2').value = mots[1] || '';
          document.getElementById('retenir3').value = mots[2] || '';
          retenirOpen = true;
          document.getElementById('retenirChamps').classList.add('open');
        } else if (ligne.startsWith('-i-')) {
          infosData.push(ligne.replace('-i-', '').trim());
        }
      }

      if (slidesData.length === 0) { slidesData.push(''); slidesIdee.push(false); }
      if (quizData.length === 0) {
        quizData.push({ question: '', reponses: [{ texte: '', correct: true }, { texte: '', correct: false }] });
      }
      if (openQuestionsData.length === 0) openQuestionsData.push('');
      if (infosData.length === 0) infosData.push('');

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('messageTexte').style.display = 'none';
    }

    // ============================================================
    // SUPPRIMER POST
    // ============================================================
    function supprimerPost(postId) {
      if (!confirm('Supprimer ce texte définitivement ?')) return;

      var btn = document.querySelector('.btn-supprimer');
      btn.textContent = '...';
      btn.disabled = true;

      DataManager.supprimerPost(postId)
        .then(function() {
          alert('✅ Post supprimé avec succès !');
          chargerAdmin();
        })
        .catch(function(err) {
          alert('❌ Erreur : ' + err.message);
          btn.textContent = '✕';
          btn.disabled = false;
        });
    }
        // ============================================================
    // CHANGER LE STATUT D'UN POST
    // ============================================================
    function changerStatut(postId, nouveauStatut) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      var url = CONFIG.SCRIPT_URL + '?action=updatePostCols' +
        '&id=' + encodeURIComponent(postId) +
        '&titre=' + encodeURIComponent(post.titre) +
        '&niveau=' + encodeURIComponent(post.niveau || 0) +
        '&categorie=' + encodeURIComponent(post.categorie || '') +
        '&statut=' + encodeURIComponent(nouveauStatut) +
        '&versions=' + encodeURIComponent(post.versions || 1) +
        '&dateModif=' + encodeURIComponent(new Date().toISOString());

      if (post.contenu) {
        var colonnes = post.contenu.split(' | ');
        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }
      }

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            chargerAdmin();
          } else {
            alert('❌ Erreur : ' + data.message);
          }
        })
        .catch(function(e) {
          alert('❌ Erreur : ' + e.message);
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerAdmin();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>
