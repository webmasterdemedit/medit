<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
</head>
<body>

  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        if (typeof mettreAJourHeader === 'function') mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- PAGE ADMIN -->
  <div class="page">

    <div class="header-admin">
      <h1>⚙ Administration</h1>
      <div class="header-actions">
        <button class="btn-importer-header" onclick="importerTexte()">📥 Importer</button>
        <input type="file" id="fileInput" accept=".txt" style="display:none;" onchange="importerFichier(event)">
        <button class="btn-export-all" onclick="exporterTout()">📤 Exporter tout</button>
        <button class="btn-ajout" onclick="ouvrirModalTexte()">+ Ajouter un texte</button>
      </div>
    </div>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item"><span>Total :</span><span class="nombre" id="totalPosts">0</span></div>
      <span class="sep">|</span>
      <div class="stat-item"><span>Publiés :</span><span class="nombre" id="publiesPosts">0</span></div>
      <span class="sep">|</span>
      <div class="stat-item"><span>Brouillons :</span><span class="nombre" id="brouillonsPosts">0</span></div>
      <span class="sep">|</span>
      <div class="stat-item"><span>Lectures :</span><span class="nombre" id="totalLectures">0</span></div>
    </div>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher un texte par titre..." oninput="appliquerRecherche()">
    </div>

    <div class="filtres-container" id="filtresCategories">
      <button class="filtre-cat-btn active" data-cat="toutes" onclick="filtrerParCategorie('toutes')">Toutes <span class="compteur-cat" id="catToutes">0</span></button>
    </div>

    <div class="tabs-container" id="tabsContainer">
      <button class="tab-btn active" data-tab="tous" onclick="switchTab('tous')">Tous <span class="compteur-tab" id="compteurTous">0</span></button>
      <button class="tab-btn" data-tab="publies" onclick="switchTab('publies')">Publiés <span class="compteur-tab" id="compteurPublies">0</span></button>
      <button class="tab-btn" data-tab="brouillons" onclick="switchTab('brouillons')">Brouillons <span class="compteur-tab" id="compteurBrouillons">0</span></button>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des textes...</p>
      </div>
    </div>

  </div>

  <!-- MODAL CATÉGORIES -->
  <div id="modalCategories" class="modal-overlay">
    <div class="modal-contenu">
      <button class="modal-close" onclick="fermerModalCategories()">✕</button>
      <h3>🏷️ Gérer les catégories</h3>
      <div id="listeCategories"></div>
    </div>
  </div>

  <!-- MODAL TEXTE -->
  <div id="modalTexte" class="modal-overlay">
    <div class="modal-contenu ajout-post">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <input type="text" id="inputTitre" placeholder="Titre" style="flex:1;font-size:20px;font-weight:700;border:none;background:transparent;color:var(--text-primary);outline:none;padding:4px 0;">
        <button class="modal-close" onclick="fermerModalTexte()" style="margin-left:12px;">✕</button>
      </div>

      <form id="formTexte" onsubmit="return false;">
        <input type="hidden" id="editId" value="">

        <div class="row-compact">
          <input type="date" id="inputDate">
          <select id="inputNiveau"></select>
          <select id="inputCategorie"></select>
        </div>

        <!-- SLIDES -->
        <div class="section-block">
          <div class="section-header">
            <span class="section-label">Slides</span>
          </div>
          <div class="slides-list" id="slidesList"></div>
          <div style="display:flex;justify-content:flex-end;margin-top:4px;">
            <button type="button" class="btn-add-section" onclick="ouvrirComposeur()" style="font-size:13px;">✎ composer</button>
          </div>
        </div>

        <!-- QUIZ -->
        <div class="section-block">
          <div class="section-header">
            <span class="section-label">Quiz</span>
            <button type="button" class="btn-add-section" onclick="ajouterQuestion()">+ quiz</button>
          </div>
          <div class="quiz-list" id="quizList"></div>
        </div>

        <!-- QUESTIONS OUVERTES -->
        <div class="section-block">
          <div class="section-header">
            <span class="section-label">Questions ouvertes</span>
            <button type="button" class="btn-add-section" onclick="ajouterQuestionOuverte()">+ question</button>
          </div>
          <div class="open-questions-list" id="openQuestionsList"></div>
        </div>

        <!-- RETENIR -->
        <div class="section-block">
          <div class="section-header">
            <span class="section-label">À retenir</span>
            <button type="button" class="btn-add-section" onclick="toggleRetenir()">+ mémo</button>
          </div>
          <div class="retenir-container">
            <div class="retenir-champs" id="retenirChamps">
              <input type="text" id="retenir1" placeholder="Mot 1">
              <input type="text" id="retenir2" placeholder="Mot 2">
              <input type="text" id="retenir3" placeholder="Mot 3">
            </div>
          </div>
        </div>

        <!-- INFOS -->
        <div class="section-block">
          <div class="section-header">
            <span class="section-label">Infos</span>
            <button type="button" class="btn-add-section" onclick="ajouterInfo()">+ info</button>
          </div>
          <div class="infos-list" id="infosList"></div>
        </div>

        <div class="btn-groupe">
          <button type="button" onclick="toggleBrouillon()" class="btn btn-brouillon" id="btnBrouillon" style="border:none;background:transparent;padding:8px 12px;">Brouillon</button>
          <span style="flex:1;"></span>
          <span class="chrono" id="chronoDisplay">00:00</span>
          <span class="auto-save-indicator" id="autoSaveIndicator">💾 Sauvegardé</span>
          <button type="button" onclick="enregistrerTexte()" class="btn" id="btnEnregistrer">Ajouter</button>
        </div>

        <div id="messageTexte" class="message"></div>
      </form>
    </div>
  </div>

  <!-- COMPOSEUR -->
  <div id="composeurOverlay" class="composer-overlay">
    <div class="composer-content" id="composerContent">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <button onclick="validerComposeur()" class="btn" style="font-size:14px;padding:4px 16px;">✓ Valider</button>
        <button class="composer-close" onclick="fermerComposeur()">✕</button>
      </div>
      <textarea id="composeurTextarea" placeholder="Écrivez votre slide ici..."></textarea>
      <div class="composer-actions">
        <button onclick="renvoyerSlide()" class="composer-renvoyer" style="border:none;background:transparent;color:var(--text-secondary);">↩ Renvoyer</button>
        <div style="flex:1;"></div>
        <button onclick="validerComposeurIdee()">💡 Idée</button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // ADMIN - CODE COMPLET
    // ============================================================

    var tousLesPosts = [];
    var toutesLesReponses = [];
    var ongletActuel = 'tous';
    var categorieActuelle = 'toutes';
    var rechercheActuelle = '';
    var modeEdition = false;
    var estBrouillon = false;
    var chronoInterval = null;
    var chronoSeconds = 0;
    var autoSaveInterval = null;
    var autoSaveEnabled = true;

    var niveauxData = [];
    var categoriesData = [];

    var slidesData = [];
    var slidesIdee = [];
    var quizData = [];
    var openQuestionsData = [];
    var infosData = [];

    var composeurIndex = -1;
    var retenirOpen = false;

    // === CHRONO ===
    function startChrono() {
      chronoSeconds = 0;
      updateChronoDisplay();
      if (chronoInterval) clearInterval(chronoInterval);
      chronoInterval = setInterval(function() {
        chronoSeconds++;
        updateChronoDisplay();
      }, 1000);
    }

    function stopChrono() {
      if (chronoInterval) {
        clearInterval(chronoInterval);
        chronoInterval = null;
      }
    }

    function updateChronoDisplay() {
      var mins = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
      var secs = String(chronoSeconds % 60).padStart(2, '0');
      document.getElementById('chronoDisplay').textContent = mins + ':' + secs;
    }

    // === AUTO-SAVE ===
    function demarrerAutoSave() {
      if (autoSaveInterval) clearInterval(autoSaveInterval);
      autoSaveInterval = setInterval(function() {
        if (document.getElementById('modalTexte').classList.contains('visible')) {
          sauvegarderAuto();
        }
      }, 30000);
    }

    function arreterAutoSave() {
      if (autoSaveInterval) {
        clearInterval(autoSaveInterval);
        autoSaveInterval = null;
      }
    }

    function sauvegarderAuto() {
      var indicator = document.getElementById('autoSaveIndicator');
      indicator.textContent = '💾 Sauvegarde...';
      indicator.className = 'auto-save-indicator visible saving';
      
      var data = {
        slidesData: slidesData,
        slidesIdee: slidesIdee,
        quizData: quizData,
        openQuestionsData: openQuestionsData,
        infosData: infosData,
        retenirOpen: retenirOpen,
        retenir1: document.getElementById('retenir1').value,
        retenir2: document.getElementById('retenir2').value,
        retenir3: document.getElementById('retenir3').value,
        titre: document.getElementById('inputTitre').value,
        date: document.getElementById('inputDate').value,
        niveau: document.getElementById('inputNiveau').value,
        categorie: document.getElementById('inputCategorie').value,
        timestamp: Date.now()
      };
      
      try {
        localStorage.setItem('admin_auto_save', JSON.stringify(data));
        indicator.textContent = '💾 Sauvegardé';
        indicator.className = 'auto-save-indicator visible saved';
        setTimeout(function() {
          indicator.className = 'auto-save-indicator visible';
        }, 2000);
      } catch(e) {
        indicator.textContent = '⚠️ Erreur';
        indicator.className = 'auto-save-indicator visible';
      }
    }

    function chargerAutoSave() {
      try {
        var saved = localStorage.getItem('admin_auto_save');
        if (!saved) return;
        var data = JSON.parse(saved);
        var age = (Date.now() - data.timestamp) / 60000;
        if (age > 60) {
          localStorage.removeItem('admin_auto_save');
          return;
        }
        
        if (confirm('💾 Une sauvegarde automatique de ' + Math.round(age) + ' min existe. Voulez-vous la restaurer ?')) {
          slidesData = data.slidesData || [];
          slidesIdee = data.slidesIdee || [];
          quizData = data.quizData || [];
          openQuestionsData = data.openQuestionsData || [];
          infosData = data.infosData || [];
          retenirOpen = data.retenirOpen || false;
          
          document.getElementById('inputTitre').value = data.titre || '';
          document.getElementById('inputDate').value = data.date || '';
          if (data.niveau) {
            var sn = document.getElementById('inputNiveau');
            for (var i = 0; i < sn.options.length; i++) {
              if (sn.options[i].value == data.niveau) { sn.selectedIndex = i; break; }
            }
          }
          if (data.categorie) {
            var sc = document.getElementById('inputCategorie');
            for (var i = 0; i < sc.options.length; i++) {
              if (sc.options[i].value === data.categorie) { sc.selectedIndex = i; break; }
            }
          }
          document.getElementById('retenir1').value = data.retenir1 || '';
          document.getElementById('retenir2').value = data.retenir2 || '';
          document.getElementById('retenir3').value = data.retenir3 || '';
          
          if (retenirOpen) {
            document.getElementById('retenirChamps').classList.add('open');
          }
          
          afficherSlides();
          afficherQuiz();
          afficherOpenQuestions();
          afficherInfos();
          
          localStorage.removeItem('admin_auto_save');
          document.getElementById('autoSaveIndicator').textContent = '💾 Restauré';
          document.getElementById('autoSaveIndicator').className = 'auto-save-indicator visible saved';
          setTimeout(function() {
            document.getElementById('autoSaveIndicator').className = 'auto-save-indicator';
          }, 3000);
        }
      } catch(e) {
        console.error('Erreur restauration auto-save:', e);
      }
    }

    // === CHARGER NIVEAUX ET CATÉGORIES ===
    function chargerNiveauxEtCategories() {
      var urlNiveaux = CONFIG.SCRIPT_URL + '?action=getNiveaux';
      fetch(urlNiveaux)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            niveauxData = data.niveaux || [];
            remplirSelectNiveaux();
          }
        })
        .catch(function(e) { console.error('Erreur niveaux:', e); });

      var urlCategories = CONFIG.SCRIPT_URL + '?action=getLabels';
      fetch(urlCategories)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            categoriesData = data.labels || [];
            remplirSelectCategories();
          }
        })
        .catch(function(e) { console.error('Erreur catégories:', e); });
    }

    function remplirSelectNiveaux() {
      var select = document.getElementById('inputNiveau');
      select.innerHTML = '';
      if (niveauxData.length === 0) {
        for (var i = 1; i <= 12; i++) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = 'Nvx ' + i;
          select.appendChild(opt);
        }
      } else {
        niveauxData.forEach(function(n) {
          var opt = document.createElement('option');
          opt.value = n.valeur;
          opt.textContent = 'Nvx ' + n.valeur + (n.description ? ' - ' + n.description : '');
          select.appendChild(opt);
        });
      }
    }

    function remplirSelectCategories() {
      var select = document.getElementById('inputCategorie');
      select.innerHTML = '';
      if (categoriesData.length === 0) {
        var defaults = ['Foi', 'Rappels divers', 'Sourate', 'Hadith', 'Méditation', 'Invocation', 'Histoire', 'Morale', 'Autre'];
        defaults.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      } else {
        categoriesData.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }
    }

    // === CHARGEMENT ADMIN ===
    function chargerAdmin() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) { 
        window.location.href = '/medit/index.html'; 
        return; 
      }

      if (id !== 'admin') {
        window.location.href = '/medit/mes-textes.html';
        return;
      }

      chargerNiveauxEtCategories();

      DataManager.charger()
        .then(function(data) {
          tousLesPosts = data.posts || [];
          toutesLesReponses = data.reponses || [];
          
          tousLesPosts.forEach(function(p) {
            if (!p.statut) {
              p.statut = 'publie';
            } else {
              p.statut = p.statut.trim().toLowerCase();
            }
            if (p.statut !== 'publie' && p.statut !== 'brouillon') {
              p.statut = 'publie';
            }
            if (!p.versions) p.versions = 1;
            if (!p.dateModif) p.dateModif = '';
          });
          
          afficherAdmin();
          demarrerAutoSave();
        })
        .catch(function(error) {
          console.error('Erreur:', error);
          var loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide">
              <span class="icone">⚠️</span>
              <h2>Erreur de chargement</h2>
              <p>${error.message || 'Vérifiez votre connexion.'}</p>
              <button onclick="location.reload();" style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid var(--border-color);border-radius:30px;cursor:pointer;color:var(--text-primary);">Réessayer</button>
            </div>
          `;
        });
    }

    // === AFFICHER ADMIN ===
    function afficherAdmin() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.style.display = 'none';
      }

      var total = tousLesPosts.length;
      var publies = tousLesPosts.filter(function(p) { return p.statut === 'publie'; }).length;
      var brouillons = tousLesPosts.filter(function(p) { return p.statut === 'brouillon'; }).length;
      
      var totalLectures = 0;
      toutesLesReponses.forEach(function(r) {
        if (r.bonnes > 0 || r.total > 0) totalLectures++;
      });

      document.getElementById('totalPosts').textContent = total;
      document.getElementById('publiesPosts').textContent = publies;
      document.getElementById('brouillonsPosts').textContent = brouillons;
      document.getElementById('totalLectures').textContent = totalLectures;
      document.getElementById('compteurTous').textContent = total;
      document.getElementById('compteurPublies').textContent = publies;
      document.getElementById('compteurBrouillons').textContent = brouillons;

      genererFiltresCategories();

      var postsFiltres = filtrerPosts();
      afficherPosts(postsFiltres);
    }

    // === FILTRER POSTS ===
    function filtrerPosts() {
      var resultats = [];
      
      if (ongletActuel === 'tous') {
        resultats = tousLesPosts.slice();
      } else if (ongletActuel === 'publies') {
        resultats = tousLesPosts.filter(function(p) { return p.statut === 'publie'; });
      } else if (ongletActuel === 'brouillons') {
        resultats = tousLesPosts.filter(function(p) { return p.statut === 'brouillon'; });
      }
      
      if (categorieActuelle !== 'toutes') {
        resultats = resultats.filter(function(p) { return p.categorie === categorieActuelle; });
      }
      
      if (rechercheActuelle.trim() !== '') {
        var search = rechercheActuelle.trim().toLowerCase();
        resultats = resultats.filter(function(p) {
          return (p.titre && p.titre.toLowerCase().includes(search)) ||
                 (p.contenu && p.contenu.toLowerCase().includes(search));
        });
      }
      
      return resultats;
    }

    function appliquerRecherche() {
      rechercheActuelle = document.getElementById('searchInput').value;
      afficherAdmin();
    }

    // === AFFICHER POSTS ===
    function afficherPosts(posts) {
      var container = document.getElementById('contenu');

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="vide">
            <span class="icone">📭</span>
            <h2>Aucun texte</h2>
            <p>Aucun texte ne correspond à vos critères.</p>
          </div>
        `;
        return;
      }

      // Trier du plus récent au plus ancien
      posts.sort(function(a, b) {
        var dateA = a.date ? new Date(a.date) : new Date(0);
        var dateB = b.date ? new Date(b.date) : new Date(0);
        return dateB - dateA;
      });

      var html = '<div class="grille">';

      posts.forEach(function(post, index) {
        var statutLabel = post.statut === 'publie' ? 'Publié' : 'Brouillon';
        var statutClass = post.statut === 'publie' ? 'publie' : 'brouillon';
        var estPublie = post.statut === 'publie';
        
        var lectures = toutesLesReponses.filter(function(r) { return r.articleId === post.id; });
        var nbLectures = lectures.length;
        var nbQuiz = lectures.filter(function(r) { return r.bonnes > 0 || r.total > 0; }).length;
        var nbReponses = lectures.filter(function(r) { return r.reponseOuverte && r.reponseOuverte.trim() !== ''; }).length;
        
        var statsHtml = '';
        if (nbLectures > 0) {
          statsHtml = '<span class="stat-lecture">📖 ' + nbLectures + ' lectures' +
            (nbQuiz > 0 ? ' | 🧪 ' + nbQuiz + ' quiz' : '') +
            (nbReponses > 0 ? ' | ✏️ ' + nbReponses + ' réponses' : '') +
            '</span>';
        }

        var nbSlides = post.contenu ? post.contenu.split('-s-').length - 1 : 0;
        var hasQuiz = post.contenu && post.contenu.includes('-q-');
        var hasQuestion = post.contenu && post.contenu.includes('-qs-');
        var hasRetenir = post.contenu && post.contenu.includes('-r-');
        var hasInfo = post.contenu && post.contenu.includes('-i-');
        var mots = post.mots || 0;
        
        var infoBadges = '';
        infoBadges += '<span class="info-badge">📄 ' + nbSlides + ' slides</span>';
        if (hasQuiz) infoBadges += '<span class="info-badge">🧪 Quiz</span>';
        if (hasQuestion) infoBadges += '<span class="info-badge">✏️ Q. ouverte</span>';
        if (hasRetenir) infoBadges += '<span class="info-badge">📌 Mémo</span>';
        if (hasInfo) infoBadges += '<span class="info-badge">ℹ️ Infos</span>';
        if (mots > 0) infoBadges += '<span class="info-badge">📝 ' + mots + ' mots</span>';
        
        var dateCreation = post.date ? new Date(post.date) : null;
        var dateModif = post.dateModif ? new Date(post.dateModif) : null;
        var dateStr = '';
        if (dateCreation) {
          dateStr = 'Créé le ' + dateCreation.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) + ' à ' + dateCreation.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        } else if (dateModif) {
          dateStr = 'Modifié le ' + dateModif.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) + ' à ' + dateModif.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }
        var versionsStr = post.versions ? ' v' + post.versions : '';

        var apercuHtml = '';
        if (post.contenu) {
          var apercu = post.contenu.replace(/-s-/g, '').trim();
          if (apercu.length > 200) apercu = apercu.substring(0, 200) + '...';
          if (apercu.trim()) {
            apercuHtml = `
              <div class="apercu-rapide" style="width:100%;">
                ${apercu}
              </div>
            `;
          }
        }

        html += `
          <div class="carte-post" data-id="${post.id}" onclick="modifierPost('${post.id}')">
            <div class="infos" style="width:100%;">
              <div class="titre">
                ${post.titre || 'Sans titre'}

    // === EXPORTER TOUT ===
    function exporterTout() {
      if (tousLesPosts.length === 0) {
        alert('Aucun article à exporter.');
        return;
      }
      
      var data = {
        exportDate: new Date().toISOString(),
        total: tousLesPosts.length,
        posts: tousLesPosts.map(function(p) {
          return {
            id: p.id,
            titre: p.titre,
            niveau: p.niveau,
            categorie: p.categorie,
            date: p.date,
            statut: p.statut,
            contenu: p.contenu ? p.contenu.replace(/ \| /g, '\n') : '',
            mots: p.mots,
            hasQuiz: p.hasQuiz,
            hasQuestion: p.hasQuestion,
            versions: p.versions || 1,
            dateModif: p.dateModif || ''
          };
        })
      };
      
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'export_tous_articles_' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      alert('✅ Exportation de ' + tousLesPosts.length + ' articles terminée !');
    }

    // === SLIDES ===
    var dragIndex = null;

    function initDragDrop() {
      var items = document.querySelectorAll('.slide-item');
      items.forEach(function(item) {
        item.addEventListener('dragstart', function(e) {
          dragIndex = parseInt(this.dataset.index);
          this.classList.add('dragging');
        });
        item.addEventListener('dragend', function(e) {
          this.classList.remove('dragging');
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
        });
        item.addEventListener('dragover', function(e) {
          e.preventDefault();
          document.querySelectorAll('.slide-item.drag-over').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          this.classList.add('drag-over');
        });
        item.addEventListener('dragleave', function(e) {
          this.classList.remove('drag-over');
        });
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          this.classList.remove('drag-over');
          var targetIndex = parseInt(this.dataset.index);
          if (dragIndex !== null && dragIndex !== targetIndex) {
            var slideMoved = slidesData.splice(dragIndex, 1)[0];
            slidesData.splice(targetIndex, 0, slideMoved);
            var ideeMoved = slidesIdee.splice(dragIndex, 1)[0];
            slidesIdee.splice(targetIndex, 0, ideeMoved);
            afficherSlides();
          }
        });
      });
    }

    function supprimerSlide(index) {
      slidesData.splice(index, 1);
      slidesIdee.splice(index, 1);
      afficherSlides();
    }

    function afficherSlides() {
      var container = document.getElementById('slidesList');
      if (slidesData.length === 0) {
        container.innerHTML = '';
        return;
      }
      var html = '';
      slidesData.forEach(function(slide, index) {
        var preview = slide.length > 60 ? slide.substring(0, 60) + '...' : slide;
        var ideeClass = slidesIdee[index] ? 'idee' : '';
        var displayText = preview || '<span class="slide-placeholder">Slide vide</span>';
        html += `
          <div class="slide-item ${ideeClass}" draggable="true" data-index="${index}">
            <span class="slide-handle">⠿</span>
            <span class="slide-texte" onclick="ouvrirComposeur(${index})">${displayText}</span>
            <button class="btn-del-slide" onclick="event.stopPropagation(); supprimerSlide(${index})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
      initDragDrop();
    }

    // === COMPOSEUR ===
    function ouvrirComposeur(index) {
      composeurIndex = (index !== undefined) ? index : -1;
      var textarea = document.getElementById('composeurTextarea');
      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        textarea.value = slidesData[composeurIndex];
      } else {
        textarea.value = '';
      }
      document.getElementById('composeurOverlay').classList.add('visible');
      textarea.focus();
    }

    function fermerComposeur() {
      document.getElementById('composeurOverlay').classList.remove('visible');
    }

    function validerComposeur() {
      var texte = document.getElementById('composeurTextarea').value.trim();
      if (!texte) { alert('Veuillez écrire du contenu.'); return; }

      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = texte;
        slidesIdee[composeurIndex] = false;
      } else {
        slidesData.push(texte);
        slidesIdee.push(false);
      }
      fermerComposeur();
      afficherSlides();
    }

    function validerComposeurIdee() {
      var texte = document.getElementById('composeurTextarea').value.trim();
      if (!texte) { alert('Veuillez écrire du contenu.'); return; }

      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = texte;
        slidesIdee[composeurIndex] = true;
      } else {
        slidesData.push(texte);
        slidesIdee.push(true);
      }
      fermerComposeur();
      afficherSlides();
    }

    // === RENVOYER SLIDE ===
    function renvoyerSlide() {
      var textarea = document.getElementById('composeurTextarea');
      var texte = textarea.value;
      var cursorPos = textarea.selectionStart;
      
      if (cursorPos === 0) {
        alert('Placez le curseur à l\'endroit où vous voulez couper le texte.');
        return;
      }
      
      var debut = texte.substring(0, cursorPos).trim();
      var fin = texte.substring(cursorPos).trim();
      
      if (!fin) {
        alert('Il n\'y a pas de texte à renvoyer après le curseur.');
        return;
      }
      
      // Mettre à jour la slide actuelle avec le début
      textarea.value = debut;
      
      // Ajouter une nouvelle slide après la slide actuelle
      var newSlideIndex = composeurIndex + 1;
      slidesData.splice(newSlideIndex, 0, fin);
      slidesIdee.splice(newSlideIndex, 0, slidesIdee[composeurIndex] || false);
      
      // Supprimer le contenu renvoyé de la slide actuelle
      if (composeurIndex >= 0 && composeurIndex < slidesData.length) {
        slidesData[composeurIndex] = debut;
      }
      
      // Mettre à jour l'affichage
      afficherSlides();
      
      // Fermer le composeur
      fermerComposeur();
    }

    // === ENREGISTRER ===
    function enregistrerTexte() {
      var id = document.getElementById('editId').value;
      var titre = document.getElementById('inputTitre').value.trim();
      var niveau = document.getElementById('inputNiveau').value;
      var categorie = document.getElementById('inputCategorie').value;
      var statut = estBrouillon ? 'brouillon' : 'publie';
      var msg = document.getElementById('messageTexte');

      var r1 = document.getElementById('retenir1').value.trim();
      var r2 = document.getElementById('retenir2').value.trim();
      var r3 = document.getElementById('retenir3').value.trim();
      var retenir = [r1, r2, r3].filter(function(m) { return m.length > 0; }).join(', ');

      if (!titre) { afficherMsgTexte('Veuillez saisir un titre', 'error'); return; }
      if (slidesData.length === 0) { afficherMsgTexte('Veuillez ajouter au moins une slide', 'error'); return; }

      var colonnes = [];

      var slidesReelles = slidesData.filter(function(s, i) { return !slidesIdee[i]; });
      slidesReelles.forEach(function(slide) {
        colonnes.push('-s- ' + slide);
      });

      quizData.forEach(function(q) {
        if (q.question.trim() || q.reponses.some(function(r) { return r.texte.trim(); })) {
          colonnes.push('-q- ' + q.question);
          q.reponses.forEach(function(r) {
            colonnes.push((r.correct ? '-v- ' : '-f- ') + r.texte);
          });
        }
      });

      openQuestionsData.forEach(function(q) {
        if (q.trim()) {
          colonnes.push('-qs- ' + q);
        }
      });

      if (retenir) {
        colonnes.push('-r- ' + retenir);
      }

      infosData.forEach(function(info) {
        if (info.trim()) {
          colonnes.push('-i- ' + info);
        }
      });

      var btn = document.getElementById('btnEnregistrer');
      btn.textContent = 'Enregistrement...';
      btn.disabled = true;
      msg.style.display = 'none';

      var maintenant = new Date().toISOString();
      var dateCreation = document.getElementById('inputDate').value;

      if (modeEdition && id) {
        var version = 1;
        var postExistant = tousLesPosts.find(function(p) { return p.id === id; });
        if (postExistant) {
          version = (postExistant.versions || 1) + 1;
        }
        
        var url = CONFIG.SCRIPT_URL + '?action=updatePostCols' +
          '&id=' + encodeURIComponent(id) +
          '&titre=' + encodeURIComponent(titre) +
          '&niveau=' + encodeURIComponent(niveau) +
          '&categorie=' + encodeURIComponent(categorie) +
          '&statut=' + encodeURIComponent(statut) +
          '&versions=' + encodeURIComponent(version) +
          '&dateModif=' + encodeURIComponent(maintenant);

        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }

        if (dateCreation) {
          url += '&date=' + encodeURIComponent(dateCreation);
        }

        fetch(url)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              afficherMsgTexte('✅ Post mis à jour ! (v' + version + ')', 'success');
              btn.textContent = 'Mettre à jour';
              btn.disabled = false;
              fermerModalTexte();
              chargerAdmin();
            } else {
              throw new Error(data.message || 'Erreur lors de la modification');
            }
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Mettre à jour';
            btn.disabled = false;
          });
      } else {
        var url = CONFIG.SCRIPT_URL + '?action=addPost' +
          '&titre=' + encodeURIComponent(titre) +
          '&niveau=' + encodeURIComponent(niveau) +
          '&categorie=' + encodeURIComponent(categorie) +
          '&statut=' + encodeURIComponent(statut) +
          '&versions=' + encodeURIComponent(1);

        if (dateCreation) {
          url += '&date=' + encodeURIComponent(dateCreation);
        }

        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }

        fetch(url)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              afficherMsgTexte('✅ Post ajouté !', 'success');
              btn.textContent = 'Ajouter';
              btn.disabled = false;
              fermerModalTexte();
              chargerAdmin();
            } else {
              throw new Error(data.message || 'Erreur lors de la création');
            }
          })
          .catch(function(err) {
            afficherMsgTexte('❌ Erreur : ' + err.message, 'error');
            btn.textContent = 'Ajouter';
            btn.disabled = false;
          });
      }
    }

    // === MODIFIER POST ===
    function modifierPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      modeEdition = true;
      estBrouillon = post.statut === 'brouillon';
      document.getElementById('btnEnregistrer').textContent = 'Mettre à jour';
      document.getElementById('editId').value = postId;

      if (post.date) {
        var d = new Date(post.date);
        if (!isNaN(d.getTime())) {
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, '0');
          var dd = String(d.getDate()).padStart(2, '0');
          document.getElementById('inputDate').removeAttribute('readonly');
          document.getElementById('inputDate').value = y + '-' + m + '-' + dd;
          document.getElementById('inputDate').setAttribute('readonly', true);
        }
      }

      document.getElementById('inputTitre').value = post.titre || '';

      var selectNiveau = document.getElementById('inputNiveau');
      for (var i = 0; i < selectNiveau.options.length; i++) {
        if (selectNiveau.options[i].value == post.niveau) {
          selectNiveau.selectedIndex = i;
          break;
        }
      }

      var selectCategorie = document.getElementById('inputCategorie');
      for (var i = 0; i < selectCategorie.options.length; i++) {
        if (selectCategorie.options[i].value === post.categorie) {
          selectCategorie.selectedIndex = i;
          break;
        }
      }

      var btnBrouillon = document.getElementById('btnBrouillon');
      if (estBrouillon) {
        btnBrouillon.classList.add('active');
        btnBrouillon.textContent = '✓ Brouillon';
      } else {
        btnBrouillon.classList.remove('active');
        btnBrouillon.textContent = 'Brouillon';
      }

      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');

      if (post.contenu) {
        var colonnes = post.contenu.split(' | ');
        
        for (var i = 0; i < colonnes.length; i++) {
          var ligne = colonnes[i].trim();
          if (!ligne) continue;

          if (ligne.startsWith('-s-')) {
            slidesData.push(ligne.replace('-s-', '').trim());
            slidesIdee.push(false);
          } else if (ligne.startsWith('-q-')) {
            var qText = ligne.replace('-q-', '').trim();
            var reponses = [];
            for (var j = i + 1; j < colonnes.length; j++) {
              var nextLine = colonnes[j].trim();
              if (nextLine.startsWith('-v-')) {
                reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
                i = j;
              } else if (nextLine.startsWith('-f-')) {
                reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
                i = j;
              } else {
                break;
              }
            }
            if (reponses.length === 0) {
              reponses.push({ texte: '', correct: true });
              reponses.push({ texte: '', correct: false });
            }
            quizData.push({ question: qText, reponses: reponses });
          } else if (ligne.startsWith('-qs-')) {
            openQuestionsData.push(ligne.replace('-qs-', '').trim());
          } else if (ligne.startsWith('-r-')) {
            var retenirText = ligne.replace('-r-', '').trim();
            var mots = retenirText.split(',').map(function(m) { return m.trim(); });
            document.getElementById('retenir1').value = mots[0] || '';
            document.getElementById('retenir2').value = mots[1] || '';
            document.getElementById('retenir3').value = mots[2] || '';
            retenirOpen = true;
            document.getElementById('retenirChamps').classList.add('open');
          } else if (ligne.startsWith('-i-')) {
            infosData.push(ligne.replace('-i-', '').trim());
          }
        }
      }

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('modalTexte').classList.add('visible');
      document.getElementById('messageTexte').style.display = 'none';
      document.getElementById('inputTitre').focus();

      startChrono();
    }

    // === EXPORTER POST ===
    function exporterPost(postId) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      var contenu = '';
      contenu += 'Nvx: ' + (post.niveau || 0) + '\n';
      contenu += 'Cat: ' + (post.categorie || 'Sans catégorie') + '\n\n';

      if (post.contenu) {
        var lignes = post.contenu.split(' | ');
        var quizEnCours = null;
        var firstSection = true;

        for (var i = 0; i < lignes.length; i++) {
          var ligne = lignes[i].trim();
          if (!ligne) continue;

          if (ligne.startsWith('-s-')) {
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
          else if (ligne.startsWith('-q-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            quizEnCours = { question: ligne, reponses: [] };
            contenu += ligne + '\n';
            firstSection = false;
          }
          else if (ligne.startsWith('-v-') || ligne.startsWith('-f-')) {
            if (quizEnCours) {
              quizEnCours.reponses.push(ligne);
            } else {
              if (!firstSection) {
                contenu += '\n';
              }
              contenu += ligne + '\n';
              firstSection = false;
            }
          }
          else if (ligne.startsWith('-qs-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
          else if (ligne.startsWith('-r-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
          else if (ligne.startsWith('-i-')) {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
          else {
            if (quizEnCours) {
              quizEnCours.reponses.forEach(function(r) {
                contenu += r + '\n';
              });
              quizEnCours = null;
              contenu += '\n';
            }
            if (!firstSection) {
              contenu += '\n';
            }
            contenu += ligne + '\n';
            firstSection = false;
          }
        }

        if (quizEnCours) {
          quizEnCours.reponses.forEach(function(r) {
            contenu += r + '\n';
          });
        }

        contenu = contenu.replace(/\n{3,}$/, '\n\n');

      } else {
        contenu += '-s- ' + (post.titre || 'Sans titre') + '\n\n';
      }

      var blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (post.titre || 'post') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // === IMPORTER ===
    function importerTexte() {
      document.getElementById('fileInput').click();
    }

    function importerFichier(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        var contenu = e.target.result;
        parserContenu(contenu);
        document.getElementById('fileInput').value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parserContenu(contenu) {
      slidesData = [];
      slidesIdee = [];
      quizData = [];
      openQuestionsData = [];
      infosData = [];
      retenirOpen = false;
      document.getElementById('retenirChamps').classList.remove('open');
      document.getElementById('retenir1').value = '';
      document.getElementById('retenir2').value = '';
      document.getElementById('retenir3').value = '';

      var colonnes;
      if (contenu.includes('\n')) {
        colonnes = contenu.split('\n').filter(function(l) { return l.trim() !== ''; });
      } else {
        colonnes = contenu.split(' | ');
      }

      for (var i = 0; i < colonnes.length; i++) {
        var ligne = colonnes[i].trim();
        if (!ligne) continue;

        if (ligne.startsWith('Nvx:') || ligne.startsWith('Cat:')) continue;

        if (ligne.startsWith('-s-')) {
          slidesData.push(ligne.replace('-s-', '').trim());
          slidesIdee.push(false);
        } else if (ligne.startsWith('-q-')) {
          var qText = ligne.replace('-q-', '').trim();
          var reponses = [];
          for (var j = i + 1; j < colonnes.length; j++) {
            var nextLine = colonnes[j].trim();
            if (nextLine.startsWith('-v-')) {
              reponses.push({ texte: nextLine.replace('-v-', '').trim(), correct: true });
              i = j;
            } else if (nextLine.startsWith('-f-')) {
              reponses.push({ texte: nextLine.replace('-f-', '').trim(), correct: false });
              i = j;
            } else {
              break;
            }
          }
          if (reponses.length === 0) {
            reponses.push({ texte: '', correct: true });
            reponses.push({ texte: '', correct: false });
          }
          quizData.push({ question: qText, reponses: reponses });
        } else if (ligne.startsWith('-qs-')) {
          openQuestionsData.push(ligne.replace('-qs-', '').trim());
        } else if (ligne.startsWith('-r-')) {
          var retenirText = ligne.replace('-r-', '').trim();
          var mots = retenirText.split(',').map(function(m) { return m.trim(); });
          document.getElementById('retenir1').value = mots[0] || '';
          document.getElementById('retenir2').value = mots[1] || '';
          document.getElementById('retenir3').value = mots[2] || '';
          retenirOpen = true;
          document.getElementById('retenirChamps').classList.add('open');
        } else if (ligne.startsWith('-i-')) {
          infosData.push(ligne.replace('-i-', '').trim());
        }
      }

      afficherSlides();
      afficherQuiz();
      afficherOpenQuestions();
      afficherInfos();

      document.getElementById('messageTexte').style.display = 'none';
    }

    // === SUPPRIMER POST ===
    function supprimerPost(postId) {
      if (!confirm('Supprimer ce texte définitivement ?')) return;

      var btn = document.querySelector('.btn-supprimer');
      btn.textContent = '...';
      btn.disabled = true;

      DataManager.supprimerPost(postId)
        .then(function() {
          alert('✅ Post supprimé avec succès !');
          chargerAdmin();
        })
        .catch(function(err) {
          alert('❌ Erreur : ' + err.message);
          btn.textContent = '✕';
          btn.disabled = false;
        });
    }

    // === CHANGER LE STATUT ===
    function changerStatut(postId, nouveauStatut) {
      var post = tousLesPosts.find(function(p) { return p.id === postId; });
      if (!post) { alert('Post introuvable'); return; }

      var url = CONFIG.SCRIPT_URL + '?action=updatePostCols' +
        '&id=' + encodeURIComponent(postId) +
        '&titre=' + encodeURIComponent(post.titre) +
        '&niveau=' + encodeURIComponent(post.niveau || 0) +
        '&categorie=' + encodeURIComponent(post.categorie || '') +
        '&statut=' + encodeURIComponent(nouveauStatut) +
        '&versions=' + encodeURIComponent(post.versions || 1) +
        '&dateModif=' + encodeURIComponent(new Date().toISOString());

      if (post.contenu) {
        var colonnes = post.contenu.split(' | ');
        for (var i = 0; i < colonnes.length; i++) {
          url += '&col' + (i + 1) + '=' + encodeURIComponent(colonnes[i]);
        }
      }

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            chargerAdmin();
          } else {
            alert('❌ Erreur : ' + data.message);
          }
        })
        .catch(function(e) {
          alert('❌ Erreur : ' + e.message);
        });
    }

    // === INIT ===
    function demarrer() {
      chargerAdmin();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>
