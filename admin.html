<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajouter un texte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✎</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    /* ============================================================
       PAGE AJOUT POST - STRUCTURE UNIQUEMENT
       Les couleurs sont dans lecture-mode.css
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f3f0e9;
    }

    .page-ajout {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px 40px;
      width: 100%;
      flex: 1;
    }

    .page-ajout h1 {
      font-size: 28px;
      font-weight: 400;
      font-family: 'Georgia', serif;
      margin-bottom: 4px;
      color: #2c2c2c;
    }

    .page-ajout .sous-titre {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      font-style: italic;
    }

    .carte-ajout {
      background: #f3f0e9;
      border-radius: 4px;
      padding: 32px 36px;
      border: 1px solid #d1ccc4;
      margin-bottom: 24px;
    }

    .carte-ajout label {
      display: block;
      font-size: 13px;
      color: #6b7a8a;
      margin-top: 16px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .carte-ajout label:first-of-type {
      margin-top: 0;
    }

    .carte-ajout input,
    .carte-ajout textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1ccc4;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
      box-sizing: border-box;
    }

    .carte-ajout input:focus,
    .carte-ajout textarea:focus {
      outline: none;
      border-color: #b8b0a8;
    }

    .carte-ajout textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-groupe {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-submit {
      padding: 10px 28px;
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
    }

    .btn-submit:hover {
      background: #e8e5e0;
    }

    .btn-retour {
      padding: 10px 28px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      text-decoration: none;
      display: inline-block;
    }

    .btn-retour:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 4px;
    }

    .message.success {
      color: #2c2c2c;
      background: #e8e5e0;
    }

    .message.error {
      color: #6b7a8a;
      background: #f5f0eb;
    }

    @media (max-width: 640px) {
      .page-ajout {
        padding: 0 16px 30px;
        margin: 20px auto;
      }
      .carte-ajout {
        padding: 20px 18px;
      }
      .page-ajout h1 {
        font-size: 24px;
      }
      .btn-groupe {
        flex-direction: column;
      }
      .btn-submit,
      .btn-retour {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        if (typeof mettreAJourHeader === 'function') {
          mettreAJourHeader();
        }
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- ========== PAGE ========== -->
  <div class="page-ajout">

    <h1>Ajouter un texte</h1>
    <p class="sous-titre">Remplissez les champs ci-dessous pour créer une nouvelle méditation.</p>

    <div class="carte-ajout">
      <form id="formAjoutPost" onsubmit="return false;">
        <label>Titre *</label>
        <input type="text" id="inputTitre" placeholder="Titre du texte" required>

        <label>Niveau *</label>
        <input type="number" id="inputNiveau" placeholder="1" min="1" max="10" required>

        <label>Catégorie</label>
        <input type="text" id="inputCategorie" placeholder="Ex: Sourate, Hadith, Méditation...">

        <label>Contenu *</label>
        <textarea id="inputContenu" rows="8" placeholder="Le texte de la méditation..." required></textarea>

        <label>Question</label>
        <textarea id="inputQuestion" rows="3" placeholder="Question ouverte (optionnel)"></textarea>

        <div class="btn-groupe">
          <button type="button" onclick="creerPost()" class="btn-submit">Créer</button>
          <a href="/medit/mes-textes.html" class="btn-retour">Annuler</a>
        </div>

        <div id="messageAjout" class="message" style="display:none;"></div>
      </form>
    </div>

  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // AJOUTER UN POST - PAGE AUTONOME
    // ============================================================

    function creerPost() {
      var titre = document.getElementById('inputTitre').value.trim();
      var niveau = document.getElementById('inputNiveau').value.trim();
      var categorie = document.getElementById('inputCategorie').value.trim();
      var contenu = document.getElementById('inputContenu').value.trim();
      var question = document.getElementById('inputQuestion').value.trim();
      var msg = document.getElementById('messageAjout');

      if (!titre) { msg.textContent = 'Veuillez saisir un titre'; msg.style.display = 'block'; msg.className = 'message error'; return; }
      if (!niveau) { msg.textContent = 'Veuillez saisir un niveau'; msg.style.display = 'block'; msg.className = 'message error'; return; }
      if (!contenu) { msg.textContent = 'Veuillez saisir le contenu'; msg.style.display = 'block'; msg.className = 'message error'; return; }

      var btn = document.querySelector('#formAjoutPost .btn-submit');
      btn.textContent = 'Création...';
      btn.disabled = true;
      msg.style.display = 'none';

      DataManager.ajouterPost(titre, parseInt(niveau), categorie, contenu, question)
        .then(function() {
          msg.textContent = '✅ Post créé avec succès !';
          msg.style.display = 'block';
          msg.className = 'message success';
          btn.textContent = 'Créer';
          btn.disabled = false;
          document.getElementById('inputTitre').value = '';
          document.getElementById('inputNiveau').value = '';
          document.getElementById('inputCategorie').value = '';
          document.getElementById('inputContenu').value = '';
          document.getElementById('inputQuestion').value = '';
          document.getElementById('inputTitre').focus();
        })
        .catch(function(err) {
          msg.textContent = '❌ Erreur : ' + err.message;
          msg.style.display = 'block';
          msg.className = 'message error';
          btn.textContent = 'Créer';
          btn.disabled = false;
        });
    }
  </script>

</body>
</html>
