<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .admin-header h1 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 20px;
      color: var(--text);
      margin: 0;
    }

    .admin-header .btn-ajout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      border-radius: 4px;
    }

    .admin-header .btn-ajout:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      gap: 12px;
      border-radius: 6px;
    }

    .post-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }

    .post-item .post-info {
      flex: 1;
      min-width: 0;
    }

    .post-item .post-info .titre {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--text);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .post-item .post-info .meta {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .post-item .post-info .meta .statut {
      display: inline-block;
      padding: 0 10px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      border-radius: 12px;
      line-height: 20px;
    }

    .post-item .post-info .meta .statut.publie {
      color: #2d6a4f;
      border-color: #2d6a4f;
      background: rgba(45, 106, 79, 0.08);
    }

    .post-item .post-info .meta .statut.brouillon {
      color: #b34a4a;
      border-color: #b34a4a;
      background: rgba(179, 74, 74, 0.08);
    }

    .post-item .post-info .meta .badge-icone {
      display: inline-block;
      padding: 0 10px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      border-radius: 12px;
      line-height: 20px;
    }

    .post-item .post-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .post-item .post-actions a,
    .post-item .post-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 14px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      border-radius: 4px;
      line-height: 22px;
    }

    .post-item .post-actions a:hover,
    .post-item .post-actions button:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .post-item .post-actions .btn-supprimer:hover {
      color: #b34a4a;
      border-color: #b34a4a;
    }

    .vide {
      text-align: center;
      padding: 60px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .vide .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .vide h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      color: var(--text);
      font-size: 20px;
      margin: 0 0 6px 0;
    }

    .vide p {
      font-family: var(--font-sans);
      color: var(--text-secondary);
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 600px) {
      .admin-container { padding: 10px; }
      .admin-header h1 { font-size: 17px; }
      .admin-header .btn-ajout { font-size: 12px; padding: 4px 12px; }
      .post-item { padding: 10px 12px; flex-wrap: wrap; }
      .post-item .post-info .titre { font-size: 14px; }
      .post-item .post-info .meta { font-size: 11px; gap: 4px; }
      .post-item .post-actions a,
      .post-item .post-actions button { font-size: 11px; padding: 2px 10px; }
    }
  </style>

</head>
<body>

  <div class="admin-container">

    <div class="admin-header">
      <h1>Administration</h1>
      <a href="/medit/edit.html?id=new" class="btn-ajout">+ Ajouter</a>
    </div>

    <div id="postList" class="post-list">
      <div class="vide">
        <span class="icone">📖</span>
        <h2>Aucun texte</h2>
        <p>Cliquez sur "Ajouter" pour commencer.</p>
      </div>
    </div>

  </div>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var tousLesPosts = [];

    function chargerPosts() {
      var id = localStorage.getItem('etudiant_id');
      if (!id || id !== 'admin') {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          tousLesPosts = data.posts || [];
          tousLesPosts.forEach(function(p) {
            if (!p.statut) p.statut = 'publie';
            if (!p.date) p.date = new Date().toISOString();
          });
          afficherListe();
        })
        .catch(function(error) {
          console.error('Erreur:', error);
        });
    }

    function afficherListe() {
      var container = document.getElementById('postList');

      if (tousLesPosts.length === 0) {
        container.innerHTML = `
          <div class="vide">
            <span class="icone">📖</span>
            <h2>Aucun texte</h2>
            <p>Cliquez sur "Ajouter" pour commencer.</p>
          </div>
        `;
        return;
      }

      var html = '';
      tousLesPosts.sort(function(a, b) {
        var dateA = a.date ? new Date(a.date) : new Date(0);
        var dateB = b.date ? new Date(b.date) : new Date(0);
        return dateB - dateA;
      });

      for (var i = 0; i < tousLesPosts.length; i++) {
        var post = tousLesPosts[i];
        var date = post.date ? new Date(post.date) : null;
        var dateStr = date ? date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        var statutLabel = post.statut === 'publie' ? 'Publié' : 'Brouillon';
        var statutClass = post.statut === 'publie' ? 'publie' : 'brouillon';
        var mots = post.mots || 0;

        var nbQuestions = 0;
        if (post.hasQuiz) nbQuestions++;
        if (post.hasQuestion) nbQuestions++;

        html += `
          <div class="post-item">
            <div class="post-info">
              <span class="titre">${post.titre || 'Sans titre'}</span>
              <span class="meta">
                <span class="badge-icone">${post.categorie || 'Sans catégorie'}</span>
                <span class="badge-icone">Niveau ${post.niveau || 0}</span>
                <span class="badge-icone">${dateStr}</span>
                <span class="statut ${statutClass}">${statutLabel}</span>
                <span class="badge-icone">${mots} mots</span>
                <span class="badge-icone">${nbQuestions} question${nbQuestions > 1 ? 's' : ''}</span>
              </span>
            </div>
            <div class="post-actions">
              <a href="/medit/edit.html?id=${post.id}">Modifier</a>
              <button class="btn-supprimer" onclick="supprimerPost('${post.id}')">Supprimer</button>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function supprimerPost(postId) {
      if (!confirm('Supprimer ce texte définitivement ?')) return;
      DataManager.supprimerPost(postId)
        .then(function() { chargerPosts(); })
        .catch(function(err) { alert('Erreur : ' + err.message); });
    }

    document.addEventListener('DOMContentLoaded', function() {
      chargerPosts();
    });

    window.supprimerPost = supprimerPost;
  </script>

</body>
</html>
