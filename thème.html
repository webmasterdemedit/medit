<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Thème - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>

  /* ---- Nom du thème en #Nom (sans couverture) ---- */
  /* Plus de grand rectangle : en-tête simple */
  .entete-theme.sans-couverture,
  .entete-theme.sans-couverture .description-theme {
    display: block; width: 100%; max-width: none;
    background: transparent !important; border: none !important;
    box-shadow: none !important; padding: 0 !important; border-radius: 0 !important;
  }
  .entete-theme.sans-couverture { margin-bottom: 28px; }
  .ligne-titre-theme { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .ligne-titre-theme .titre-theme-hashtag { margin: 0; }
  .image-theme-cercle {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    flex-shrink: 0; border: 1px solid var(--border);
  }
  .titre-theme-hashtag {
    font-family: var(--font-serif, 'Georgia', serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 12px;
    letter-spacing: 0.3px;
  }
  .titre-theme-hashtag { color: #2d6a4f !important; }
  .titre-theme-hashtag .diese { color: #e6b400 !important; margin-right: 2px; }

  /* ---- Cartes de texte vivantes : vignette (image ou aperçu du texte) ---- */
  .carte-texte { gap: 18px; flex-wrap: nowrap !important; align-items: center; transition: background .15s; }
  .carte-texte:hover { background: var(--bg-hover); }
  .vignette-texte {
    flex: 0 0 104px; width: 104px; height: 147px; overflow: hidden; position: relative;
    background: #fffdf8; border: 1px solid var(--border);
    box-shadow: 0 1px 5px rgba(60,45,25,.14);
  }
  .carte-texte .infos { min-width: 0; }
  @media (max-width: 700px) {
    .carte-texte { flex-direction: row !important; align-items: center !important; }
    .vignette-texte { flex-basis: 74px; width: 74px; height: 105px; }
    .carte-texte .statut { display: none; }
  }

  /* ---- Écrits du thème (style liseuse, noir & blanc) ---- */
  .ecrits-theme {
    margin-top: 0;
    margin-bottom: 32px;
    padding: 24px 28px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 0;
  }

  .ecrits-theme-titre {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.3px;
  }

  .ecrit-item {
    margin-bottom: 2px;
    font-size: 13px;
  }

  .ecrit-item summary {
    cursor: pointer;
    list-style: none;
    padding: 8px 0 8px 26px;
    position: relative;
    color: var(--text-secondary);
    font-weight: 400;
    transition: color 0.15s;
  }

  .ecrit-item summary:hover {
    color: var(--text);
  }

  .ecrit-item summary::-webkit-details-marker {
    display: none;
  }

  .ecrit-item summary::before {
    content: '+';
    position: absolute;
    left: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 300;
    color: var(--text-muted);
    transition: color 0.15s;
  }

  .ecrit-item summary:hover::before {
    color: var(--text);
  }

  .ecrit-item[open] summary::before {
    content: '−';
    color: var(--text);
  }

  .ecrit-item[open] summary {
    color: var(--text);
    font-weight: 500;
  }

  .ecrit-contenu {
    padding: 4px 0 10px 26px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-size: 13px;
    white-space: pre-wrap;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 4px;
  }

  .ecrit-item:last-child .ecrit-contenu {
    border-bottom: none;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .ecrits-theme {
      padding: 18px 16px;
      margin-bottom: 24px;
    }
    .ecrits-theme-titre {
      font-size: 14px;
    }
    .ecrit-item summary {
      font-size: 13px;
      padding: 8px 0 8px 24px;
    }
    .ecrit-contenu {
      font-size: 13px;
      padding: 4px 0 10px 24px;
    }
    .titre-theme-hashtag { font-size: 22px; }
  }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-theme">

    <a href="/medit/thèmes.html" class="btn-retour">← Retourner aux thèmes</a>

    <div id="enteteTheme">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement du thème...</p>
      </div>
    </div>
     <div id="zoneEcrits"></div>

    <div id="contenuTextes"></div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>
  <script src="/medit/couverture.js"></script>

  <script>
    var toutesLesReponses = {};
    var textesData = [];
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var categorieActuelle = '';
    var themesData = {};

    var CHAMPS_RESERVES = {
      'description': true,
      'couleur': true,
      'couverture': true,
      'couverture-url': true,
      'ecrits': true,
      'titre': true,
      'contenu': true,
      'fichierid': true,
      'fichierId': true
    };

    var ORDRE_PREFERE = [
      'sous-titre', 'sous titre',
      'date',
      'auteur',
      'pre-requis', 'pré-requis', 'prerequis',
      'pages', 'nombre de pages',
      'niveau',
      'discipline', 'disciplines',
      'editeur', 'éditeur',
      'langue',
      'isbn',
      'version'
    ];

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var date = new Date(dateStr);
        var mois = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
                    'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        return mois[date.getMonth()] + ' ' + date.getFullYear();
      } catch(e) {
        return dateStr;
      }
    }

    function capitaliser(s) {
      if (!s) return '';
      var t = String(s).replace(/-/g, ' ');
      return t.charAt(0).toUpperCase() + t.slice(1);
    }

    function echapperHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    /* ============================================================
       VIGNETTE = vraie miniature de la version imprimable
       (même rendu que le bouton « Imprimer le rappel avec des exercices »)
       ============================================================ */
    var LARGEUR_A4 = 794, HAUTEUR_A4 = 1123;

    function construireVignette(texte) {
      return '<div class="vignette-texte" data-id="' + echapperHtml(texte.id) + '"></div>';
    }

    function arabiserDoc(doc) {
      var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
      var noeuds = [], n;
      while ((n = walker.nextNode())) { if (/[؀-ۿ]/.test(n.nodeValue || '')) noeuds.push(n); }
      noeuds.forEach(function(t) {
        var parent = t.parentNode;
        if (!parent || !parent.classList) return;
        if (parent.classList.contains('arabe') || parent.classList.contains('copier-mot') ||
            parent.classList.contains('copier-mot-pointille') || parent.classList.contains('copier-mot-kfg')) return;
        var parts = t.nodeValue.split(/([؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]+)/g);
        var frag = doc.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[؀-ۿ]/.test(part)) {
            var sp = doc.createElement('span');
            sp.className = 'arabe'; sp.setAttribute('lang', 'ar'); sp.textContent = part;
            frag.appendChild(sp);
          } else frag.appendChild(doc.createTextNode(part));
        });
        parent.replaceChild(frag, t);
      });
    }

    function dessinerVignette(v, texte, images, couverture) {
      if (v._fait) return;
      v._fait = true;
      var html = '';
      try {
        html = genererImpression(texte, texte.contenu || '', images, couverture, 'complet', { retournerHtml: true });
      } catch (e) { console.error('Vignette :', e); return; }
      if (!html) return;
      var echelle = v.clientWidth / LARGEUR_A4;
      var iframe = document.createElement('iframe');
      iframe.setAttribute('tabindex', '-1');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.cssText = 'width:' + LARGEUR_A4 + 'px;height:' + HAUTEUR_A4 + 'px;border:0;'
        + 'transform:scale(' + echelle + ');transform-origin:0 0;pointer-events:none;background:#fffdf8;';
      v.appendChild(iframe);
      var doc = iframe.contentWindow.document;
      doc.open();
      doc.write(html.replace('</head>', '<style>body{padding:40px 46px !important;overflow:hidden !important;}</style></head>'));
      doc.close();
      setTimeout(function() { try { arabiserDoc(doc); } catch (e) {} }, 400);
    }

    function remplirVignettes(textes) {
      var vignettes = document.querySelectorAll('.vignette-texte[data-id]');
      if (!vignettes.length || typeof genererImpression !== 'function') return;
      var parId = {};
      textes.forEach(function(t) { parId[String(t.id)] = t; });
      var couverture = (typeof recupererCouvertureTheme === 'function') ? recupererCouvertureTheme(categorieActuelle) : '';

      var promesseImages = (typeof chargerImagesTheme === 'function')
        ? chargerImagesTheme(categorieActuelle).catch(function() { return {}; })
        : Promise.resolve({});

      /* Si les images tardent, on n'attend pas plus de 2,5 s */
      var delai = new Promise(function(res) { setTimeout(function() { res({}); }, 2500); });

      Promise.race([promesseImages, delai]).then(function(images) {
        images = images || {};
        function lancer(v) {
          var t = parId[v.getAttribute('data-id')];
          if (!t) return;
          if (t.contenu) { dessinerVignette(v, t, images, couverture); return; }
          /* Le cache ne contient pas toujours le texte complet : on le charge */
          if (typeof DataManager !== 'undefined' && typeof DataManager.getTexteAsync === 'function') {
            DataManager.getTexteAsync(t.id).then(function(complet) {
              if (complet && complet.contenu) {
                var fusion = Object.assign({}, t, complet);
                parId[String(t.id)] = fusion;
                dessinerVignette(v, fusion, images, couverture);
              }
            }).catch(function(e) { console.error('Vignette (chargement) :', e); });
          }
        }
        if ('IntersectionObserver' in window) {
          var obs = new IntersectionObserver(function(entrees) {
            entrees.forEach(function(e) {
              if (e.isIntersecting) { obs.unobserve(e.target); lancer(e.target); }
            });
          }, { rootMargin: '200px' });
          vignettes.forEach(function(v) { obs.observe(v); });
        } else {
          vignettes.forEach(lancer);
        }
      });
    }

    function aUnNiveau(n) {
      return n !== '' && n !== null && n !== undefined;
    }

    // Parse sûr du champ écrits (tableau déjà parsé par le GS, ou string)
    function parseEcrits(val) {
      if (!val) return [];
      try {
        if (typeof val === 'string') {
          var arr = JSON.parse(val);
          return Array.isArray(arr) ? arr : [];
        }
        return Array.isArray(val) ? val : [];
      } catch (e) {
        return [];
      }
    }

    // ============================================================
    // Récupère les écrits depuis le thème, où qu'ils soient rangés.
    // ============================================================
    function extraireEcrits(l) {
      if (!l) return [];

      if (Array.isArray(l.infos) && l.infos.length > 0 &&
          l.infos[0] && (l.infos[0].titre !== undefined || l.infos[0].contenu !== undefined)) {
        return l.infos.filter(function(e) {
          return e && (e.titre || e.contenu);
        });
      }

      if (Array.isArray(l.infos) && l.infos[0] && l.infos[0].ecrits) {
        return parseEcrits(l.infos[0].ecrits);
      }

      if (l.infos && !Array.isArray(l.infos) && l.infos.ecrits) {
        return parseEcrits(l.infos.ecrits);
      }

      return parseEcrits(l.ecrits);
    }

    // ============================================================
    // Statut validé / non validé (basé sur Tentatives)
    // ============================================================
    function estTexteValide(texteId) {
      var reponses = toutesLesReponses[String(texteId)];
      if (!reponses || reponses.length === 0) return false;
      for (var i = 0; i < reponses.length; i++) {
        if ((reponses[i].pourcentage || 0) >= 65) return true;
      }
      return false;
    }

    function dateValidationTexte(texteId) {
      var reponses = toutesLesReponses[String(texteId)];
      if (!reponses || reponses.length === 0) return '';
      var meilleureDate = '';
      var meilleurPct = -1;
      for (var i = 0; i < reponses.length; i++) {
        var pct = reponses[i].pourcentage || 0;
        if (pct >= 65 && pct > meilleurPct) {
          meilleurPct = pct;
          meilleureDate = reponses[i].date || '';
        }
      }
      return meilleureDate;
    }

    function formaterDateValidation(dateStr) {
      if (!dateStr) return '';
      if (typeof dateStr === 'object' && dateStr instanceof Date) {
        return dateStr.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' })
          + ' à ' + dateStr.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }
      return String(dateStr);
    }

    // ============================================================
    // Infos thème
    // ============================================================
    function construireInfosHtml(infos) {
      if (!infos) return '';

      if (Array.isArray(infos)) {
        if (infos[0] && (infos[0].titre !== undefined || infos[0].contenu !== undefined)) {
          return '';
        }
        infos = infos[0] || {};
      }

      if (typeof infos !== 'object') return '';

      var html = '';
      var vus = {};

      for (var i = 0; i < ORDRE_PREFERE.length; i++) {
        var k = ORDRE_PREFERE[i];
        if (CHAMPS_RESERVES[k]) continue;
        if (vus[k]) continue;
        if (infos[k] === undefined || infos[k] === null || infos[k] === '') continue;
        if (typeof infos[k] === 'object') continue;
        html += '<div class="pre-requis"><strong>' +
          echapperHtml(capitaliser(k)) + ' :</strong> ' +
          echapperHtml(infos[k]) + '</div>';
        vus[k] = true;
      }

      for (var cle in infos) {
        if (vus[cle] || CHAMPS_RESERVES[cle]) continue;
        if (infos[cle] === undefined || infos[cle] === null || infos[cle] === '') continue;
        if (typeof infos[cle] === 'object') continue;
        html += '<div class="pre-requis"><strong>' +
          echapperHtml(capitaliser(cle)) + ' :</strong> ' +
          echapperHtml(infos[cle]) + '</div>';
        vus[cle] = true;
      }

      return html;
    }

    function construireInfosCompletes(themeInfo) {
      var infos = {};

      var sourceInfos = themeInfo.infos;

      if (Array.isArray(sourceInfos)) {
        if (sourceInfos[0] && (sourceInfos[0].titre !== undefined || sourceInfos[0].contenu !== undefined)) {
          sourceInfos = {};
        } else {
          sourceInfos = sourceInfos[0] || {};
        }
      }

      if (sourceInfos && typeof sourceInfos === 'object') {
        for (var k in sourceInfos) {
          if (k === 'ecrits') continue;
          infos[k] = sourceInfos[k];
        }
      }

      if (themeInfo.sousTitre && !infos['sous-titre']) infos['sous-titre'] = themeInfo.sousTitre;
      if (themeInfo.date && !infos['date'])             infos['date'] = themeInfo.date;
      if (themeInfo.auteur && !infos['auteur'])         infos['auteur'] = themeInfo.auteur;
      if (themeInfo.pages && !infos['pages'])           infos['pages'] = themeInfo.pages;
      return infos;
    }

    function lireThemes(liste) {
      themesData = {};
      if (liste && Array.isArray(liste)) {
        liste.forEach(function(l) {
          themesData[l.titre] = {
            couleur:    l.couleur || '#2d6a4f',
            sousTitre:  l.sousTitre || '',
            date:       l.date || '',
            pages:      l.pages || '',
            description: l.description || '',
            auteur:     l.auteur || '',
            niveau:     parseInt(l.niveau) || 0,
            couverture: l.couverture || '',
            infos:      l.infos || null,
            ecrits:     extraireEcrits(l)
          };
        });
      }
    }

    // ============================================================
    // Chargement du thème
    // ============================================================
    function chargerTheme() {
      var params = new URLSearchParams(window.location.search);
      categorieActuelle = params.get('cat') || '';

      if (!categorieActuelle) {
        document.getElementById('enteteTheme').innerHTML = `
          <div class="vide-textes" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Aucune catégorie spécifiée</h4>
            <p>Veuillez sélectionner un thème depuis la page d'accueil.</p>
            <a href="/medit/thèmes.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">Retour aux thèmes</a>
          </div>
        `;
        document.getElementById('contenuTextes').innerHTML = '';
        return;
      }

      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      nomEtudiant = id;
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(resultats) {
        var data = resultats[0];
        var tentatives = resultats[1];

        niveauEtudiant = data.niveau || 0;
        textesData = data.tousLesTextes || data.textes || [];
        lireThemes(data.themes);

        toutesLesReponses = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          if (!toutesLesReponses[k]) toutesLesReponses[k] = [];
          toutesLesReponses[k].push({
            texteId: t.texteId,
            titre: t.titre,
            bonnes: t.bonnes,
            total: t.total,
            pourcentage: t.pourcentage,
            date: t.date || '',
            valide: (t.pourcentage >= 65) ? 'valide' : 'non-valide'
          });
        });

        afficherTheme();
      }).catch(function(error) {
        console.error('Erreur chargement:', error);
        var cache = DataManager.getCacheForce(id);
        if (cache) {
          niveauEtudiant = cache.niveau || 0;
          textesData = cache.tousLesTextes || cache.textes || [];
          lireThemes(cache.themes);
          afficherTheme();
        } else {
          document.getElementById('enteteTheme').innerHTML = `
            <div class="vide-textes" style="margin-top:20px;">
              <span class="icone">⚠</span>
              <h4>Erreur de chargement</h4>
              <p>Vérifiez votre connexion internet.</p>
              <button onclick="location.reload();" style="margin-top:10px;padding:8px 20px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-secondary);">Réessayer</button>
            </div>
          `;
          document.getElementById('contenuTextes').innerHTML = '';
        }
      });
    }

    function afficherTheme() {
      var textesFiltres = textesData.filter(function(p) {
        return (p.categorie || 'Sans catégorie') === categorieActuelle;
      });

      textesFiltres.sort(function(a, b) {
        var numA = extraireNumeroTexte(a.titre);
        var numB = extraireNumeroTexte(b.titre);
        if (numA !== numB) return numA - numB;
        return extraireTitreSansNumero(a.titre).localeCompare(
          extraireTitreSansNumero(b.titre), 'fr', { sensitivity: 'base' }
        );
      });

      if (textesFiltres.length === 0) {
        document.getElementById('enteteTheme').innerHTML = `
          <div class="vide-textes" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Aucun texte</h4>
            <p>Ce thème ne contient pas encore de textes accessibles à votre niveau.</p>
            <a href="/medit/thèmes.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">Retour aux thèmes</a>
          </div>
        `;
        document.getElementById('contenuTextes').innerHTML = '';
        afficherEcrits();
        return;
      }

      var totalTextes = textesFiltres.length;

      var validees = 0;
      textesFiltres.forEach(function(texte) {
        if (estTexteValide(texte.id)) validees++;
      });

      var themeInfo = themesData[categorieActuelle] || {};
      var description = themeInfo.description || 'Ce thème explore les thèmes de ' + categorieActuelle + ' à travers ' + totalTextes + ' textes.';

      var pourcentage = totalTextes > 0 ? Math.round((validees / totalTextes) * 100) : 0;

      var infosCompletes = construireInfosCompletes(themeInfo);
      var infosHtml = construireInfosHtml(infosCompletes);

      // Plus de couverture : juste #Nom du thème
      var enteteHtml = `
        <div class="entete-theme sans-couverture">
          <div class="description-theme">
            <div class="ligne-titre-theme">
              ${themeInfo.couverture ? '<img class="image-theme-cercle" src="' + echapperHtml(themeInfo.couverture) + '" alt="">' : ''}
              <h2 class="titre-theme-hashtag"><span class="diese">#</span>${echapperHtml(categorieActuelle)}</h2>
            </div>
            ${infosHtml}
            <div class="texte-desc">
              <p>${description}</p>
            </div>
            <div class="stats-theme">
              <span class="stat-item">Textes : <span class="nombre">${totalTextes}</span></span>
              <span class="stat-item">Validés : <span class="nombre">${validees}</span></span>
              <span class="stat-item">Progression : <span class="nombre">${pourcentage}%</span></span>
            </div>
          </div>
        </div>
      `;

      document.getElementById('enteteTheme').innerHTML = enteteHtml;
      document.title = '#' + categorieActuelle + ' - Qiraat';

      afficherEcrits();
      afficherTextes(textesFiltres);
    }

    function afficherTextes(textes) {
      var container = document.getElementById('contenuTextes');

      if (textes.length === 0) {
        container.innerHTML = `
          <div class="vide-textes">
            <span class="icone">🎬</span>
            <h4>Aucun texte</h4>
            <p>Ce thème ne contient pas encore de textes.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="section-textes"><h3>Sommaire des textes</h3>';

      for (var i = 0; i < textes.length; i++) {
        var texte = textes[i];

        var numeroTexte = extraireNumeroTexte(texte.titre);
        var titreAffiche = extraireTitreSansNumero(texte.titre);
        var numeroHtml = (numeroTexte !== Infinity)
          ? '<span class="numero-texte">' + numeroTexte + '</span>'
          : '';

        var mots = texte.mots || 0;

        var TYPES_EXERCICES = [
          { prefix: 'quiz:',   label: 'QCM' },
          { prefix: 'qc:',     label: 'Question' },
          { prefix: 'open:',   label: 'Ouverte' },
          { prefix: 'ordre:',  label: 'Ordre' },
          { prefix: 'carte:',  label: 'Carte' },
          { prefix: 'relier:', label: 'Relier' },
          { prefix: 'tt:',     label: 'Trous' },
          { prefix: 'vf:',     label: 'VF' },
          { prefix: 'copier:', label: 'Copier' }
        ];

        var ordreBlocs = texte.ordreBlocs || [];
        if (typeof ordreBlocs === 'string') ordreBlocs = ordreBlocs.split(',');
        var detailParts = [];
        var nbExercices = 0;

        if (ordreBlocs.length > 0) {
          for (var t = 0; t < TYPES_EXERCICES.length; t++) {
            var type = TYPES_EXERCICES[t];
            var count = 0;
            for (var ob = 0; ob < ordreBlocs.length; ob++) {
              if (String(ordreBlocs[ob]).trim().indexOf(type.prefix) === 0) count++;
            }
            if (count > 0) {
              nbExercices++;
              detailParts.push(count + ' ' + type.label);
            }
          }
        } else {
          if (texte.hasQuiz)     { nbExercices++; detailParts.push('1 QCM'); }
          if (texte.hasQuestion) { nbExercices++; detailParts.push('1 Ouverte'); }
        }

        var detailExercices = detailParts.join(' · ');
        var exercicesHtml =
          '<span class="badge-icone">Nbr exercices : ' + nbExercices + '</span>' +
          (detailExercices ? '<span class="badge-icone">' + detailExercices + '</span>' : '');

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';
        var niveauHtml = aUnNiveau(texte.niveau) ? '<span class="niveau-badge">Niveau ' + texte.niveau + '</span>' : '';

        var valide = estTexteValide(texte.id);
        var dateValid = valide ? dateValidationTexte(texte.id) : '';
        var dateValidStr = dateValid ? formaterDateValidation(dateValid) : '';

        var statutHtml = '';
        if (valide) {
          statutHtml = '<span class="date-label">Validé' + (dateValidStr ? ' le ' : '') + '</span>';
          if (dateValidStr) statutHtml += '<span class="date-validation">' + echapperHtml(dateValidStr) + '</span>';
        } else {
          statutHtml = '<span class="date-label" style="color: var(--text-muted);">Non validé</span>';
        }

        var onClickAttr = 'onclick="window.location.href=\'/medit/texte.html?id=' + texte.id + '\'"';

        html += `
          <div class="carte-texte" ${onClickAttr}>
            ${construireVignette(texte)}
            <div class="infos">
              <div class="titre">${numeroHtml}${titreAffiche}</div>
              <div class="meta">
                ${niveauHtml}
                ${exercicesHtml}
                ${motsHtml}
              </div>
            </div>
            <div class="statut">
              ${statutHtml}
            </div>
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
      remplirVignettes(textes);
    }

    // ============================================================
    // Affichage des écrits (fichiers "x ..." du thème)
    // ============================================================
    function afficherEcrits() {
      var zone = document.getElementById('zoneEcrits');
      if (!zone) return;

      var themeInfo = themesData[categorieActuelle] || {};
      var ecrits = themeInfo.ecrits || [];

      if (!ecrits.length) {
        zone.innerHTML = '';
        return;
      }

      var itemsHtml = ecrits.map(function(e) {
        var titreEcrit = echapperHtml(e.titre || 'Écrit');
        var contenuEcrit = echapperHtml(e.contenu || '');
        return '<details class="ecrit-item">'
          + '<summary>' + titreEcrit + '</summary>'
          + '<div class="ecrit-contenu">' + contenuEcrit + '</div>'
          + '</details>';
      }).join('');

      zone.innerHTML = '<div class="ecrits-theme">'
        + '<div class="ecrits-theme-titre">Considérations générale sur ce thème</div>'
        + itemsHtml
        + '</div>';
    }

    function demarrer() {
      chargerTheme();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
