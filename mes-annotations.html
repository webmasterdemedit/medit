<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Mes annotations - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    .page-annotations {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      flex: 1;
      width: 100%;
    }

    .page-annotations h1 {
      font-size: 30px;
      font-weight: 300;
      color: #2c2c2c;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .page-annotations .sous-titre-page {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      font-style: italic;
    }

    .stats-annotations {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      padding: 14px 20px;
      border-radius: 4px;
      border: 1px solid #d1ccc4;
      margin-bottom: 24px;
      background: #f3f0e9;
    }

    .stats-annotations .stat-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-size: 13px;
      color: #6b7a8a;
    }

    .stats-annotations .stat-item .nombre {
      font-size: 22px;
      font-weight: 600;
      color: #2c2c2c;
      font-family: 'Georgia', serif;
    }

    .stats-annotations .sep {
      color: #d1ccc4;
      font-size: 20px;
    }

    .grille-annotations {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .carte-annotation {
      border-radius: 4px;
      padding: 16px 22px;
      border: 1px solid #d1ccc4;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f3f0e9;
    }

    .carte-annotation:hover {
      background: #e8e5e0;
    }

    .carte-annotation .infos {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .carte-annotation .titre {
      font-size: 17px;
      font-weight: 500;
      font-family: 'Georgia', serif;
      letter-spacing: 0.2px;
      line-height: 1.3;
      color: #2c2c2c;
    }

    .carte-annotation .meta {
      font-size: 12px;
      letter-spacing: 0.2px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: #6b7a8a;
    }

    .carte-annotation .meta .niveau-badge {
      padding: 1px 10px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 500;
      display: inline-block;
      background: #e8e5e0;
      color: #6b7a8a;
    }

    .carte-annotation .meta .badge-info {
      font-size: 12px;
      display: inline-block;
      padding: 1px 10px;
      border-radius: 4px;
      font-weight: 500;
      background: #e8e5e0;
      color: #6b7a8a;
    }

    .carte-annotation .meta .badge-info.revise {
      background: #d1ccc4;
      color: #2c2c2c;
    }

    .carte-annotation .statut-droit {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 80px;
    }

    .carte-annotation .statut-droit .date {
      font-size: 11px;
      color: #6b7a8a;
    }

    .carte-annotation .statut-droit .statut-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 12px;
      border-radius: 30px;
      display: inline-block;
    }

    .carte-annotation .statut-droit .statut-badge.a-reviser {
      background: #e8e5e0;
      color: #6b7a8a;
    }

    .carte-annotation .statut-droit .statut-badge.revise {
      background: #d1ccc4;
      color: #2c2c2c;
    }

    /* Popup */
    .modal-annotation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-annotation .modal-contenu {
      background: #f3f0e9;
      border-radius: 4px;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px 36px;
      border: 1px solid #d1ccc4;
    }

    .modal-annotation .modal-contenu h3 {
      font-size: 20px;
      font-weight: 600;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 2px;
    }

    .modal-annotation .modal-contenu .modal-sous-titre {
      font-size: 13px;
      color: #6b7a8a;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #d1ccc4;
      font-family: 'Segoe UI', sans-serif;
    }

    .modal-annotation .modal-contenu .block-slide {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 4px;
      background: #e8e5e0;
    }

    .modal-annotation .modal-contenu .block-slide .slide-num {
      font-size: 12px;
      font-weight: 600;
      color: #6b7a8a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .modal-annotation .modal-contenu .block-slide .slide-contenu {
      font-size: 13px;
      color: #6b7a8a;
      line-height: 1.6;
      font-style: italic;
      padding: 6px 10px;
      border-left: 2px solid #d1ccc4;
      margin-bottom: 8px;
    }

    .modal-annotation .modal-contenu .block-slide .slide-notes {
      font-size: 15px;
      color: #2c2c2c;
      line-height: 1.7;
      padding: 8px 12px;
      background: #faf8f5;
      border-radius: 4px;
      border-left: 2px solid #2c2c2c;
    }

    .modal-annotation .modal-contenu .block-slide .slide-notes::before {
      content: '✎𓂃 ';
      font-size: 14px;
    }

    .modal-annotation .modal-contenu .aucune-annotation {
      font-style: italic;
      font-size: 14px;
      padding: 16px 0;
      color: #6b7a8a;
      font-family: 'Segoe UI', sans-serif;
    }

    .modal-annotation .modal-contenu .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #d1ccc4;
    }

    .modal-annotation .modal-contenu .actions button {
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s ease;
    }

    .modal-annotation .modal-contenu .actions .btn-reviser {
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #d1ccc4;
    }

    .modal-annotation .modal-contenu .actions .btn-reviser:hover {
      background: #e8e5e0;
    }

    .modal-annotation .modal-contenu .actions .btn-reviser.revise {
      background: #d1ccc4;
      border-color: #2c2c2c;
    }

    .modal-annotation .modal-contenu .actions .btn-fermer {
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
    }

    .modal-annotation .modal-contenu .actions .btn-fermer:hover {
      background: #e8e5e0;
    }

    .loader {
      text-align: center;
      padding: 60px 20px;
      font-size: 16px;
      color: #6b7a8a;
    }

    .loader .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #d1ccc4;
      border-top-color: #6b7a8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide {
      text-align: center;
      padding: 60px 20px;
      border-radius: 4px;
      border: 1px solid #d1ccc4;
      background: #f3f0e9;
    }

    .vide .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide h2 {
      font-size: 20px;
      font-weight: 400;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
      color: #2c2c2c;
      margin-bottom: 4px;
    }

    .vide p {
      font-size: 15px;
      color: #6b7a8a;
    }

    .btn-retour {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 20px;
    }

    .btn-retour:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    @media (max-width: 640px) {
      .page-annotations { padding: 16px 12px; }
      .page-annotations h1 { font-size: 24px; }
      .carte-annotation { grid-template-columns: 1fr; gap: 8px; padding: 14px 16px; }
      .carte-annotation .statut-droit { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 6px; }
      .modal-annotation .modal-contenu { padding: 20px 16px; }
      .modal-annotation .modal-contenu .block-slide { padding: 10px 12px; }
      .modal-annotation .modal-contenu .block-slide .slide-contenu { font-size: 12px; }
      .modal-annotation .modal-contenu .block-slide .slide-notes { font-size: 14px; }
      .stats-annotations { padding: 12px 16px; }
      .stats-annotations .stat-item .nombre { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- PAGE -->
  <div class="page-annotations">

    <h1>Mes annotations</h1>
    <p class="sous-titre-page">Retrouvez toutes vos notes sur les slides.</p>

    <div class="stats-annotations" id="statsAnnotations">
      <div class="stat-item">
        <span class="nombre" id="totalAnnotes">0</span>
        <span>textes annotés</span>
      </div>
      <span class="sep">|</span>
      <div class="stat-item">
        <span class="nombre" id="totalSlides">0</span>
        <span>slides annotées</span>
      </div>
      <span class="sep">|</span>
      <div class="stat-item">
        <span class="nombre" id="totalMots">0</span>
        <span>mots dans les notes</span>
      </div>
      <span class="sep">|</span>
      <div class="stat-item">
        <span class="nombre" id="totalRevise">0</span>
        <span>révisés</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Vos annotations vont s'afficher ici...</p>
      </div>
    </div>

    <a href="/medit/mes-textes.html" class="btn-retour">← Retour</a>

  </div>

  <!-- FOOTER -->
  <div id="footer-container"></div>
  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var annotationsData = [];
    var postsMap = {};
    var idEtudiant = '';

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerAnnotations() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      idEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          var reponses = data.reponses || [];
          var posts = data.posts || [];

          posts.forEach(function(p) {
            postsMap[p.id] = p;
          });

          annotationsData = reponses.filter(function(r) {
            return r.annotations && r.annotations.trim() !== '';
          });

          afficherAnnotations();
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            var reponses = cache.reponses || [];
            var posts = cache.posts || [];

            posts.forEach(function(p) {
              postsMap[p.id] = p;
            });

            annotationsData = reponses.filter(function(r) {
              return r.annotations && r.annotations.trim() !== '';
            });

            afficherAnnotations();
          } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('contenu').innerHTML = `
              <div class="vide">
                <span class="icone">⚠️</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion.</p>
                <button onclick="location.reload()" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid #d1ccc4;border-radius:4px;cursor:pointer;">
                  Réessayer
                </button>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // AFFICHER
    // ============================================================
    function afficherAnnotations() {
      var contenu = document.getElementById('contenu');
      document.getElementById('loader').style.display = 'none';

      if (annotationsData.length === 0) {
        contenu.innerHTML = `
          <div class="vide">
            <span class="icone">✏️</span>
            <h2>Aucune annotation</h2>
            <p>Vous n'avez pas encore annoté de slides.</p>
            <p style="font-size:13px;color:#b8b0a8;margin-top:4px;">Commencez une méditation et prenez des notes.</p>
          </div>
        `;
        return;
      }

      // Statistiques
      var totalSlides = 0;
      var totalMots = 0;
      var totalRevise = 0;

      annotationsData.forEach(function(item) {
        var slides = item.annotations.split('|');
        totalSlides += slides.length;

        slides.forEach(function(s) {
          var parts = s.split(':');
          if (parts.length === 2) {
            var texte = parts[1] || '';
            var mots = texte.split(/\s+/).filter(function(w) { return w.length > 0; }).length;
            totalMots += mots;
          }
        });

        if (item.revise === true || item.revise === 'true' || item.revise === 1 || item.revise === '1') {
          totalRevise++;
        }
      });

      document.getElementById('totalAnnotes').textContent = annotationsData.length;
      document.getElementById('totalSlides').textContent = totalSlides;
      document.getElementById('totalMots').textContent = totalMots;
      document.getElementById('totalRevise').textContent = totalRevise;

      // Grille
      var html = '<div class="grille-annotations">';

      annotationsData.sort(function(a, b) {
        var da = a.date ? new Date(a.date) : new Date(0);
        var db = b.date ? new Date(b.date) : new Date(0);
        return db - da;
      });

      annotationsData.forEach(function(item) {
        var post = postsMap[item.articleId] || null;
        var titre = item.titre || (post ? post.titre : 'Sans titre');
        var niveau = post ? post.niveau : 0;

        var slides = item.annotations.split('|');
        var nbSlides = slides.length;

        var motsTotal = 0;
        slides.forEach(function(s) {
          var parts = s.split(':');
          if (parts.length === 2) {
            var texte = parts[1] || '';
            var mots = texte.split(/\s+/).filter(function(w) { return w.length > 0; }).length;
            motsTotal += mots;
          }
        });

        var date = item.date ? new Date(item.date) : null;
        var dateStr = date && !isNaN(date.getTime()) ? 
          date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

        var estRevise = (item.revise === true || item.revise === 'true' || item.revise === 1 || item.revise === '1');
        var statutClasse = estRevise ? 'revise' : 'a-reviser';
        var statutTexte = estRevise ? '✅ Révisé' : '📝 À réviser';

        html += `
          <div class="carte-annotation" onclick="ouvrirAnnotation('${item.articleId}')">
            <div class="infos">
              <div class="titre">${titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${niveau}</span>
                <span class="badge-info">${nbSlides} slide${nbSlides > 1 ? 's' : ''}</span>
                <span class="badge-info">${motsTotal} mots</span>
                <span class="badge-info ${estRevise ? 'revise' : ''}">${statutTexte}</span>
              </div>
            </div>
            <div class="statut-droit">
              <span class="date">${dateStr}</span>
              <span class="statut-badge ${statutClasse}">${statutTexte}</span>
            </div>
          </div>
        `;
      });

      html += '</div>';
      contenu.innerHTML = html;
    }

    // ============================================================
    // OUVRIR ANNOTATION (popup)
    // ============================================================
    function ouvrirAnnotation(articleId) {
      var item = annotationsData.find(function(r) { return r.articleId === articleId; });
      if (!item) return;

      var post = postsMap[articleId] || null;
      var titre = item.titre || (post ? post.titre : 'Sans titre');
      var niveau = post ? post.niveau : 0;

      // Récupérer le contenu du post
      var contenuPost = post ? post.contenu || '' : '';

      // Séparer les slides du contenu
      var slidesContenu = [];
      if (contenuPost) {
        var parts = contenuPost.split(/--- Slide \d+ ---/);
        parts.forEach(function(p, idx) {
          if (idx > 0 && p.trim()) {
            slidesContenu.push(p.trim());
          }
        });
        if (slidesContenu.length === 0 && contenuPost.trim()) {
          slidesContenu.push(contenuPost.trim());
        }
      }

      // Récupérer les annotations
      var annotations = item.annotations || '';
      var notesMap = {};
      if (annotations) {
        var annParts = annotations.split('|');
        annParts.forEach(function(a) {
          var kv = a.split(':');
          if (kv.length === 2) {
            var num = kv[0].replace('slide', '');
            notesMap[num] = kv[1] || '';
          }
        });
      }

      // Construire la popup
      var modal = document.createElement('div');
      modal.className = 'modal-annotation';
      modal.id = 'modalAnnotation';
      modal.onclick = function(e) {
        if (e.target === this) fermerAnnotation();
      };

      var html = '<div class="modal-contenu">';
      html += '<h3>' + titre + '</h3>';
      html += '<div class="modal-sous-titre">Niveau ' + niveau + ' · ' + Object.keys(notesMap).length + ' annotation(s)</div>';

      var notesKeys = Object.keys(notesMap).sort(function(a, b) { return parseInt(a) - parseInt(b); });

      if (notesKeys.length === 0) {
        html += '<div class="aucune-annotation">Aucune annotation pour ce texte.</div>';
      } else {
        notesKeys.forEach(function(slideNum) {
          var num = parseInt(slideNum);
          var contenuSlide = slidesContenu[num - 1] || '';

          html += '<div class="block-slide">';
          html += '<div class="slide-num">Slide ' + num + '</div>';

          if (contenuSlide) {
            html += '<div class="slide-contenu">' + contenuSlide + '</div>';
          }

          html += '<div class="slide-notes">' + notesMap[slideNum] + '</div>';
          html += '</div>';
        });
      }

      var estRevise = (item.revise === true || item.revise === 'true' || item.revise === 1 || item.revise === '1');
      var btnTexte = estRevise ? ' Marquer comme à réviser' : ' ‪‪Marquer comme révisé';
      var btnClasse = estRevise ? 'revise' : '';

      html += `
        <div class="actions">
          <button class="btn-reviser ${btnClasse}" onclick="marquerRevise('${articleId}', this)">${btnTexte}</button>
          <button class="btn-fermer" onclick="fermerAnnotation()">Fermer</button>
        </div>
      `;

      html += '</div>';
      modal.innerHTML = html;
      document.body.appendChild(modal);
    }

    // ============================================================
    // FERMER POPUP
    // ============================================================
    function fermerAnnotation() {
      var modal = document.getElementById('modalAnnotation');
      if (modal) modal.remove();
    }

    // ============================================================
    // MARQUER COMME RÉVISÉ
    // ============================================================
    function marquerRevise(articleId, btn) {
      var item = annotationsData.find(function(r) { return r.articleId === articleId; });
      if (!item) return;

      var estRevise = !(item.revise === true || item.revise === 'true' || item.revise === 1 || item.revise === '1');
      var nouvelleValeur = estRevise ? '1' : '0';

      // Mettre à jour localement
      item.revise = estRevise;

      // Sauvegarder dans la feuille
      var data = {
        action: 'markRevised',
        nom: idEtudiant,
        articleId: articleId,
        revise: nouvelleValeur
      };

      var url = CONFIG.URL_SCRIPT + '?action=markRevised' +
        '&nom=' + encodeURIComponent(idEtudiant) +
        '&articleId=' + encodeURIComponent(articleId) +
        '&revise=' + encodeURIComponent(nouvelleValeur);

      fetch(url)
        .then(function(response) { return response.json(); })
        .then(function(result) {
          if (result.success) {
            // Mettre à jour le bouton
            var estMaintenantRevise = (nouvelleValeur === '1');
            btn.textContent = estMaintenantRevise ? '✅ Marquer comme à réviser' : '📝 Marquer comme révisé';
            btn.className = 'btn-reviser' + (estMaintenantRevise ? ' revise' : '');

            // Recharger la liste
            afficherAnnotations();
          } else {
            alert('Erreur: ' + (result.message || 'Impossible de sauvegarder'));
          }
        })
        .catch(function() {
          alert('Erreur de connexion. Veuillez réessayer.');
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerAnnotations();
    }
