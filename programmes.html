<!-- programme.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Les programmes - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-programmes {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-programmes h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-programmes .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .liste-programmes {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ===== ENCADRÉ PROGRAMME ===== */
    .bloc-programme {
      border: 1px solid var(--border);
      background: var(--bg);
      overflow: hidden;
    }

    .bloc-programme .programme-entete {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      border-left: 4px solid #2d6a4f;
      background: var(--bg-hover);
    }

    .bloc-programme .programme-titre {
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .bloc-programme .programme-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .programme-parcours {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ===== ÉTAPE DU PARCOURS ===== */
    .etape {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 16px;
    }

    .etape .etape-marqueur {
      flex: 0 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .etape .etape-numero {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      border-radius: 50%;
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--bg);
      z-index: 1;
      box-sizing: border-box;
    }

    .etape:not(:last-child) .etape-marqueur::after {
      content: '';
      position: absolute;
      top: 32px;
      bottom: -10px;
      width: 2px;
      background: var(--border);
    }

    .etape .etape-corps {
      flex: 1;
      min-width: 0;
      padding-bottom: 28px;
    }

    .etape:last-child .etape-corps {
      padding-bottom: 0;
    }

    .etape .etape-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .etape .themes-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ===== CARTE THÈME COMPACTE ===== */
    .carte-theme-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-decoration: none;
      font-family: 'Georgia', serif;
      font-size: 14px;
      transition: background 0.15s, border-color 0.15s;
      box-sizing: border-box;
      max-width: 100%;
    }

    .carte-theme-mini:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-theme-mini .mini-pastille {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

    .carte-theme-mini .mini-titre {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .etape .etape-apres {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      padding-left: 4px;
    }

    .vide-programmes {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-programmes .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-programmes { padding: 12px 16px 30px; }
      .page-programmes h1 { font-size: 22px; }
      .programme-parcours { padding: 14px; }
      .carte-theme-mini { font-size: 13px; padding: 7px 10px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-programmes">

    <h1>Les programmes</h1>
    <p class="sous-titre-page">Des parcours de lecture et d'apprentissage, du plus simple au plus avancé. Cliquez sur un thème pour le commencer.</p>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des programmes...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    // ============================================================
    // Chargement : programmes.json + DataManager (couleurs des thèmes)
    // ============================================================
    function chargerProgrammes() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');

      Promise.all([
        fetch('/medit/programmes.json').then(function(r) { return r.json(); }),
        DataManager.charger().catch(function() {
          return DataManager.getCacheForce(id) || { themes: [] };
        })
      ])
      .then(function(results) {
        var config = results[0] || {};
        var data = results[1] || {};
        afficherProgrammes(config, data);
      })
      .catch(function(error) {
        console.error('Erreur chargement programmes:', error);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('contenu').innerHTML = `
          <div class="vide-programmes">
            <span class="icone">⚠</span>
            <h2>Impossible de charger les programmes</h2>
            <p>Vérifiez le fichier <code>/medit/programmes.json</code>.</p>
          </div>
        `;
      });
    }

    // ============================================================
    // Affichage
    // ============================================================
    function afficherProgrammes(config, data) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var container = document.getElementById('contenu');
      var programmes = (config && config.programmes) || [];

      if (programmes.length === 0) {
        container.innerHTML = `
          <div class="vide-programmes">
            <span class="icone">◈</span>
            <h2>Aucun programme configuré</h2>
            <p>Éditez <code>/medit/programmes.json</code> pour ajouter vos parcours.</p>
          </div>
        `;
        return;
      }

      // Index couleur par titre de thème
      var couleurParTheme = {};
      (data.themes || []).forEach(function(l) {
        if (l.titre) couleurParTheme[normaliserComparaison(l.titre)] = l.couleur || '#2d6a4f';
      });

      var html = '<div class="liste-programmes">';

      programmes.forEach(function(prog) {
        var couleur = prog.couleur || '#2d6a4f';
        var etapes = prog.etapes || [];

        html += '<section class="bloc-programme">';

        html += '<div class="programme-entete" style="border-left-color:' + escapeHtml(couleur) + ';">';
        html += '<div class="programme-titre">' + escapeHtml(prog.titre || 'Programme') + '</div>';
        if (prog.description) {
          html += '<div class="programme-desc">' + escapeHtml(prog.description) + '</div>';
        }
        html += '</div>';

        html += '<div class="programme-parcours">';

        etapes.forEach(function(etape, index) {
          var themes = etape.themes || [];
          var numero = etape.niveau || (index + 1);

          html += '<div class="etape">';
          html +=   '<div class="etape-marqueur"><div class="etape-numero">' + numero + '</div></div>';
          html +=   '<div class="etape-corps">';
          html +=     '<div class="etape-label">Étape ' + numero + '</div>';
          html +=     '<div class="themes-ligne">';

          themes.forEach(function(nomTheme) {
            var c = couleurParTheme[normaliserComparaison(nomTheme)] || couleur;
            html += '<a class="carte-theme-mini" href="/medit/thème.html?cat=' + encodeURIComponent(nomTheme) + '">'
                  +   '<span class="mini-pastille" style="background:' + escapeHtml(c) + ';"></span>'
                  +   '<span class="mini-titre">' + escapeHtml(nomTheme) + '</span>'
                  + '</a>';
          });

          html +=     '</div>';

          if (etape.apres && etape.apres.length > 0) {
            html +=   '<div class="etape-apres">→ puis : ' +
                      etape.apres.map(escapeHtml).join(' · ') +
                      '</div>';
          }

          html +=   '</div>';
          html += '</div>';
        });

        html += '</div>';
        html += '</section>';
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function demarrer() {
      chargerProgrammes();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
