<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Livret - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    .page-livret {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .entete-livret {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .couverture-mini {
      flex-shrink: 0;
      width: 200px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      color: #1a1a1a;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      background: var(--bg);
      cursor: default;
    }

    .couverture-mini .contenu-couv {
      position: relative;
      z-index: 2;
      padding: 24px 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .couverture-mini .titre-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 30px;
    }

    .couverture-mini .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 0;
      line-height: 1.2;
      max-width: 90%;
      color: #1a1a1a;
      text-align: center;
    }

    .couverture-mini .sous-titre-couv {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 8px;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.3;
      text-align: center;
    }

    .couverture-mini .edition-info {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding-bottom: 10px;
    }

    .couverture-mini .edition-nom {
      font-weight: 700;
      font-style: italic;
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0.6;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
    }

    .couverture-mini .edition-date {
      font-size: 10px;
      opacity: 1;
      color: rgba(26, 26, 26, 0.7);
      font-weight: 500;
    }

    .couverture-mini .badge-niveau-couv {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      padding: 3px 12px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }

    .couverture-mini .progression-couv {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .couverture-mini .progression-couv .barre {
      height: 100%;
      background: rgba(255, 255, 255, 0.60);
      transition: width 0.6s ease;
      width: 0%;
    }

    .description-livret {
      flex: 1;
      padding-top: 4px;
    }

    .description-livret h2 {
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .description-livret .pre-requis {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 300;
    }

    .description-livret .pre-requis strong {
      font-weight: 500;
      color: var(--text);
    }

    .description-livret .texte-desc {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
      font-weight: 300;
    }

    .description-livret .texte-desc p {
      margin-bottom: 8px;
    }

    .stats-livret {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 10px 16px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .stats-livret .stat-item {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stats-livret .stat-item .nombre {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      margin-left: 4px;
    }

    .btn-retour {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .section-chapitres {
      margin-top: 8px;
    }

    .section-chapitres h3 {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .carte-chapitre {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: all 0.2s;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .carte-chapitre:hover {
      border-color: var(--border-hover);
    }

    .carte-chapitre .infos {
      flex: 1;
      min-width: 200px;
    }

    .carte-chapitre .titre {
      font-weight: 500;
      font-size: 15px;
      color: var(--text);
    }

    .carte-chapitre .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .carte-chapitre .meta .badge-icone {
      display: inline-block;
      padding: 1px 10px;
      background: var(--bg-hover);
      font-size: 11px;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .carte-chapitre .meta .badge-icone.clickable {
      cursor: pointer;
      color: var(--text);
      border-color: var(--border-hover);
    }

    .carte-chapitre .meta .badge-icone.clickable:hover {
      background: var(--bg-active);
    }

    .carte-chapitre .statut {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      min-width: 120px;
    }

    .carte-chapitre .statut .date-label {
      font-weight: 400;
      color: var(--text-secondary);
    }

    .carte-chapitre .statut .date-validation {
      color: var(--text);
      font-weight: 500;
    }

    .carte-chapitre .btn-wrap {
      width: 100%;
      padding-top: 6px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .carte-chapitre .btn-imprimer {
      display: inline-block;
      padding: 3px 14px;
      font-size: 11px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .carte-chapitre .btn-imprimer:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .carte-chapitre .retenir-cadre {
      margin-top: 4px;
      padding: 4px 12px;
      background: var(--bg-hover);
      font-size: 12px;
      color: var(--text-secondary);
      border-left: 3px solid var(--border-hover);
    }

    .carte-chapitre .retenir-cadre strong {
      font-weight: 600;
      margin-right: 6px;
      color: var(--text);
    }

    .carte-chapitre .niveau-badge {
      font-size: 11px;
      padding: 1px 10px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .carte-chapitre .mots {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .vide-chapitres {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .vide-chapitres .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .vide-chapitres h4 {
      font-size: 16px;
      color: var(--text);
      font-weight: 500;
    }

    .vide-chapitres p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .loader {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .page-livret {
        padding: 12px 16px 30px;
      }

      .entete-livret {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding-bottom: 18px;
      }

      .couverture-mini {
        width: 160px;
        height: 220px;
      }

      .couverture-mini .titre-couv {
        font-size: 20px;
      }

      .description-livret {
        width: 100%;
        text-align: center;
      }

      .description-livret h2 {
        font-size: 20px;
      }

      .stats-livret {
        justify-content: center;
        gap: 16px;
      }

      .carte-chapitre {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .carte-chapitre .statut {
        text-align: left;
        min-width: unset;
      }

      .carte-chapitre .btn-wrap {
        justify-content: flex-start;
      }
    }

    @media (max-width: 400px) {
      .couverture-mini {
        width: 140px;
        height: 190px;
      }

      .couverture-mini .titre-couv {
        font-size: 17px;
      }

      .description-livret .texte-desc {
        font-size: 14px;
      }

      .stats-livret .stat-item {
        font-size: 12px;
      }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.50);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-contenu {
      background: var(--bg);
      border: 1px solid var(--border);
      max-width: 540px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 32px 24px;
      position: relative;
    }

    .modal-contenu h3 {
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .modal-contenu .modal-sous-titre {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .modal-contenu .modal-annotation {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .modal-contenu .modal-annotation:last-child {
      border-bottom: none;
    }

    .modal-contenu .modal-annotation strong {
      display: block;
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .modal-contenu .aucune-annotation {
      color: var(--text-secondary);
      font-style: italic;
      padding: 12px 0;
      text-align: center;
    }

    .modal-contenu .modal-close {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-contenu .modal-close:hover {
      background: var(--bg-active);
      color: var(--text);
    }
  </style>

<body>

    <a href="/medit/mes-livrets.html" class="btn-retour">← Retourner à mes livrets</a>

 <div id="enteteLivret">

  <script src="/medit/config.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var toutesLesReponses = {};
    var chapitresData = [];
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var categorieActuelle = '';
    var livretsData = {};

    // ============================================================
    // FORMATER LA DATE
    // ============================================================
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var date = new Date(dateStr);
        var mois = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 
                    'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        return mois[date.getMonth()] + ' ' + date.getFullYear();
      } catch(e) {
        return dateStr;
      }
    }

    // ============================================================
    // IMPRESSION
    // ============================================================
    function imprimerChapitre(chapitreId, titre) {
      var url = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';
      
      fetch(url + '?action=getChapitre&id=' + encodeURIComponent(chapitreId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success || !data.chapitre) {
            alert('Impossible de charger le contenu.');
            return;
          }
          var chapitre = data.chapitre;
          var contenu = chapitre.contenu || '';
          genererImpression(chapitre, contenu);
        })
        .catch(function(error) {
          alert('Erreur : ' + error.message);
        });
    }

    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
      
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) {
            quizs.push(currentQuiz);
          }
          currentQuiz = {
            question: ligne.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          if (texteRep) {
            currentQuiz.reponses.push({ 
              texte: texteRep || 'Réponse', 
              lettre: lettres[currentQuiz.reponses.length] || '?'
            });
          }
        }
      }
      
      if (currentQuiz && currentQuiz.reponses.length > 0) {
        quizs.push(currentQuiz);
      }
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      for (var i = 0; i < lignes.length; i++) {
        var match = lignes[i].match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push(match[2]);
        }
      }
      return elements;
    }

    function parserCartePourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var recto = '', verso = '';
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          recto = l.replace(/^r:\s*/i, '').trim();
        } else if (l.toLowerCase().startsWith('v:')) {
          verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (!recto) return null;
      return { recto: recto, verso: verso };
    }

    function genererImpression(chapitre, contenu) {
      var parts = contenu.split(' | ');
      
      var slidesArray = [];
      var quiz = '';
      var openQuestion = '';
      var ordre = '';
      var carte = '';
      var retenir = '';
      
      parts.forEach(function(part) {
        part = part.trim();
        if (part.startsWith('q:')) {
          quiz = part;
        } else if (part.startsWith('qs:')) {
          openQuestion = part;
        } else if (part.startsWith('o:')) {
          ordre = part;
        } else if (part.startsWith('r:')) {
          carte = part;
        } else if (part.startsWith('#')) {
          retenir = part;
        } else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) {
              slidesArray.push(sub.trim());
            });
          }
        }
      });

      var dateCreation = chapitre.date || '';
      var dateCreationStr = '';
      if (dateCreation) {
        var d = new Date(dateCreation);
        if (!isNaN(d.getTime())) {
          dateCreationStr = d.toLocaleDateString('fr-FR', {
            day: '2-digit', month: 'long', year: 'numeric'
          });
        }
      }

      var dateImpression = new Date();
      var dateImpressionStr = dateImpression.toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
      var heureImpressionStr = dateImpression.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });

      var printHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${chapitre.titre || 'Lecture'}</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            @page {
              margin: 2cm 2cm 1.5cm 2cm;
              size: A4;
            }
            body {
              font-family: 'Times New Roman', Times, serif;
              background: white;
              color: black;
              font-size: 12pt;
              line-height: 1.7;
            }
            .page {
              max-width: 100%;
              min-height: 100vh;
              display: flex;
              flex-direction: column;
            }
            
            h1 {
              font-size: 20pt;
              font-weight: bold;
              text-align: center;
              text-transform: uppercase;
              letter-spacing: 1.5px;
              margin-bottom: 4px;
            }
            .sous-titre {
              text-align: center;
              font-size: 11pt;
              font-style: italic;
              margin-bottom: 4px;
              color: #444;
            }
            .meta-ligne {
              text-align: center;
              font-size: 10pt;
              color: #555;
              margin-bottom: 18px;
              border-bottom: 1px solid #ccc;
              padding-bottom: 10px;
            }
            .meta-ligne span {
              margin: 0 8px;
            }
            .meta-ligne .sep {
              color: #ccc;
            }
            
            .zone-lecture {
              flex: 1;
              padding: 6px 0;
            }
            .slide {
              margin-bottom: 14px;
            }
            .slide p {
              font-size: 13pt;
              margin-bottom: 8px;
              text-align: justify;
              text-indent: 2em;
            }
            .slide p:first-of-type {
              text-indent: 0;
            }
            
            .zone-exercices {
              border-top: 1px solid #ccc;
              padding-top: 10px;
              margin-top: 12px;
              font-size: 10pt;
              line-height: 1.5;
              color: #333;
            }
            .zone-exercices .titre-exo {
              font-weight: bold;
              font-size: 10pt;
              text-transform: uppercase;
              letter-spacing: 0.5px;
              margin-bottom: 4px;
            }
            .exo-quiz {
              margin-bottom: 6px;
            }
            .exo-quiz .q {
              font-weight: bold;
            }
            .exo-quiz .reponses {
              padding-left: 16px;
            }
            .exo-quiz .reponses .r {
              display: inline-block;
              margin-right: 14px;
            }
            .exo-quiz .case {
              display: inline-block;
              width: 12px;
              height: 12px;
              border: 1px solid #000;
              margin-right: 3px;
              background: white;
            }
            .exo-ordre {
              margin-bottom: 6px;
            }
            .exo-ordre .item {
              display: inline-block;
              margin-right: 10px;
              font-style: italic;
            }
            .exo-ordre .item::before {
              content: "— ";
            }
            .exo-carte {
              margin-bottom: 6px;
              border: 1px solid #ccc;
              padding: 4px 10px;
              background: #f9f9f9;
            }
            .exo-carte .recto {
              font-weight: bold;
            }
            .exo-carte .verso-vide {
              color: #999;
              font-style: italic;
              font-size: 9pt;
            }
            .exo-retenir {
              margin-top: 4px;
            }
            .exo-retenir .mot {
              display: inline-block;
              padding: 1px 8px;
              margin: 1px 4px 1px 0;
              border: 1px solid #999;
              font-weight: bold;
              font-size: 9pt;
            }
            .pied-page {
              text-align: center;
              font-size: 9pt;
              color: #666;
              margin-top: 6px;
              padding-top: 6px;
              border-top: 1px solid #ddd;
            }
            .pied-page .imprime-le {
              font-style: italic;
              font-size: 8pt;
              color: #999;
              margin-top: 2px;
            }
          </style>
        </head>
        <body>
          <div class="page">
      `;

      printHtml += `
        <h1>${chapitre.titre || 'Lecture'}</h1>
        <div class="sous-titre">${chapitre.categorie || 'Sans catégorie'}</div>
        <div class="meta-ligne">
          <span>Créé le : ${dateCreationStr || '—'}</span>
          <span class="sep">|</span>
          <span>Niveau ${chapitre.niveau || 0}</span>
        </div>
      `;

      printHtml += `<div class="zone-lecture">`;

      if (slidesArray.length > 0) {
        slidesArray.forEach(function(slide, idx) {
          printHtml += `<div class="slide">`;
          var paragraphs = slide.split('\n').filter(function(p) { return p.trim() !== ''; });
          paragraphs.forEach(function(p) {
            printHtml += `<p>${p.trim()}</p>`;
          });
          printHtml += `</div>`;
        });
      }

      printHtml += `</div>`;

      printHtml += `<div class="zone-exercices">`;

      var hasExercice = false;
      var questionNum = 1;

      if (quiz.trim() !== '') {
        hasExercice = true;
        var quizs = parserQuizsPourImpression(quiz);
        printHtml += `<div class="titre-exo">Questions de compréhension</div>`;
        quizs.forEach(function(q, qi) {
          printHtml += `<div class="exo-quiz">`;
          printHtml += `<span class="q">${questionNum}.</span> ${q.question}`;
          printHtml += `<div class="reponses">`;
          q.reponses.forEach(function(rep) {
            printHtml += `<span class="r"><span class="case"></span> ${rep.lettre}. ${rep.texte}</span>`;
          });
          printHtml += `</div>`;
          printHtml += `</div>`;
          questionNum++;
        });
      }

      if (openQuestion.trim() !== '') {
        hasExercice = true;
        var qsTexte = openQuestion.replace(/^qs:\s*/i, '').trim();
        if (quiz.trim() === '') {
          printHtml += `<div class="titre-exo">Questions de compréhension</div>`;
        }
        printHtml += `<div class="exo-quiz">`;
        printHtml += `<span class="q">${questionNum}.</span> ${qsTexte}`;
        printHtml += `<div style="border:1px solid #ddd;height:30px;margin:3px 0 4px 16px;"></div>`;
        printHtml += `</div>`;
        questionNum++;
      }

      if (ordre.trim() !== '') {
        hasExercice = true;
        var ordreItems = parserOrdrePourImpression(ordre);
        if (quiz.trim() === '' && openQuestion.trim() === '') {
          printHtml += `<div class="titre-exo">Exercices</div>`;
        }
        printHtml += `<div class="exo-ordre" style="margin-top:6px;">`;
        printHtml += `<div style="font-weight:bold;margin-bottom:2px;">Remettre dans l'ordre :</div>`;
        ordreItems.forEach(function(item, idx) {
          printHtml += `<span class="item">${item}</span>`;
        });
        printHtml += `</div>`;
      }

      if (carte.trim() !== '') {
        hasExercice = true;
        var carteData = parserCartePourImpression(carte);
        if (carteData) {
          if (quiz.trim() === '' && openQuestion.trim() === '' && ordre.trim() === '') {
            printHtml += `<div class="titre-exo">Exercices</div>`;
          }
          printHtml += `<div class="exo-carte" style="margin-top:6px;">`;
          printHtml += `<div class="recto">${carteData.recto}</div>`;
          printHtml += `<div class="verso-vide">(Espace pour écrire la réponse)</div>`;
          printHtml += `</div>`;
        }
      }

      if (retenir.trim() !== '') {
        hasExercice = true;
        var mots = retenir.replace(/^#\s*/, '').split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m.length > 0; });
        if (mots.length > 0) {
          printHtml += `<div class="titre-exo" style="margin-top:8px;">Mots à retenir</div>`;
          printHtml += `<div class="exo-retenir">`;
          mots.forEach(function(mot) {
            printHtml += `<span class="mot">${mot}</span>`;
          });
          printHtml += `</div>`;
        }
      }

      if (!hasExercice) {
        printHtml += `<div style="height:2px;"></div>`;
      }

      printHtml += `</div>`;

      printHtml += `
            <div class="pied-page">
              <div>Qiraat</div>
              <div class="imprime-le">Imprimé le ${dateImpressionStr} à ${heureImpressionStr}</div>
            </div>
          </div>
        </body>
        </html>
      `;

      var win = window.open('', '_blank', 'width=1000,height=800,scrollbars=yes');
      if (!win) {
        alert('Veuillez autoriser les pop-ups pour imprimer.');
        return;
      }
      win.document.write(printHtml);
      win.document.close();
    }

    // ============================================================
    // MODAL ANNOTATIONS
    // ============================================================
    function ouvrirAnnotations(chapitreId, titre) {
      var reponse = toutesLesReponses[chapitreId] || null;
      var annotations = reponse ? reponse.annotations : '';

      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalAnnotations';
      modal.onclick = function(e) {
        if (e.target === this) fermerAnnotations();
      };

      var html = '<div class="modal-contenu">';
      html += '<h3>' + titre + '</h3>';
      html += '<div class="modal-sous-titre">Annotations</div>';

      if (annotations && annotations.trim() !== '') {
        var parts = annotations.split('|');
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split(':');
          if (kv.length === 2) {
            var slideNum = kv[0].replace('slide', '');
            var texte = kv[1];
            html += '<div class="modal-annotation">';
            html += '<strong>Slide ' + slideNum + '</strong>';
            html += texte;
            html += '</div>';
          }
        }
      } else {
        html += '<div class="aucune-annotation">Aucune annotation pour ce chapitre.</div>';
      }

      html += '<button class="modal-close" onclick="fermerAnnotations()">Fermer</button>';
      html += '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);
    }

    function fermerAnnotations() {
      var modal = document.getElementById('modalAnnotations');
      if (modal) modal.remove();
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerLivret() {
      var params = new URLSearchParams(window.location.search);
      categorieActuelle = params.get('cat') || '';

      if (!categorieActuelle) {
        document.getElementById('enteteLivret').innerHTML = `
          <div class="vide-chapitres" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Aucune catégorie spécifiée</h4>
            <p>Veuillez sélectionner un livret depuis la page d'accueil.</p>
            <a href="/medit/mes-livrets.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">Retour aux livrets</a>
          </div>
        `;
        document.getElementById('contenuChapitres').innerHTML = '';
        return;
      }

      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      nomEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          chapitresData = data.chapitres || [];

          livretsData = {};
          if (data.livrets) {
            if (Array.isArray(data.livrets)) {
              data.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  preRequis: l.preRequis || '',
                  description: l.description || ''
                  auteur: l.auteur || ''
                };
              });
            }
          }

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              if (!toutesLesReponses[r.chapitreId]) {
                toutesLesReponses[r.chapitreId] = [];
              }
              toutesLesReponses[r.chapitreId].push(r);
            });
          }

          afficherLivret();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            chapitresData = cache.chapitres || [];
            if (cache.livrets) {
              if (Array.isArray(cache.livrets)) {
                livretsData = {};
                cache.livrets.forEach(function(l) {
                  livretsData[l.titre] = {
                    couleur: l.couleur || '#2d6a4f',
                    sousTitre: l.sousTitre || '',
                    date: l.date || '',
                    preRequis: l.preRequis || '',
                    description: l.description || ''
                  };
                });
              }
            }
            afficherLivret();
          } else {
            document.getElementById('enteteLivret').innerHTML = `
              <div class="vide-chapitres" style="margin-top:20px;">
                <span class="icone">⚠</span>
                <h4>Erreur de chargement</h4>
                <p>Vérifiez votre connexion internet.</p>
                <button onclick="location.reload();" style="margin-top:10px;padding:8px 20px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-secondary);">Réessayer</button>
              </div>
            `;
            document.getElementById('contenuChapitres').innerHTML = '';
          }
        });
    }

    // ============================================================
    // AFFICHER LE LIVRET
    // ============================================================
    function afficherLivret() {
      var chapitresFiltres = chapitresData.filter(function(p) {
        return (p.categorie || 'Sans catégorie') === categorieActuelle;
      });

      chapitresFiltres.sort(function(a, b) {
        return a.titre.localeCompare(b.titre, 'fr', { sensitivity: 'base' });
      });

      if (chapitresFiltres.length === 0) {
        document.getElementById('enteteLivret').innerHTML = `
          <div class="vide-chapitres" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Aucun chapitre</h4>
            <p>Ce livret ne contient pas encore de chapitres accessibles à votre niveau (${niveauEtudiant}).</p>
            <a href="/medit/mes-livrets.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">Retour aux livrets</a>
          </div>
        `;
        document.getElementById('contenuChapitres').innerHTML = '';
        return;
      }

      var niveauLivret = chapitresFiltres[0].niveau || 1;
      var totalChapitres = chapitresFiltres.length;

      var validees = 0;
      chapitresFiltres.forEach(function(chapitre) {
        var reponse = toutesLesReponses[chapitre.id];
        if (reponse) {
          var bonnes = parseInt(reponse.bonnes) || 0;
          var total = parseInt(reponse.total) || 0;
          if (total === 1 && bonnes === 1) validees++;
          else if (total > 0 && bonnes >= Math.ceil(total / 2)) validees++;
        }
      });

      var livretInfo = livretsData[categorieActuelle] || {};
      var couleur = livretInfo.couleur || '#2d6a4f';
      var sousTitre = livretInfo.sousTitre || '';
      var dateLivret = livretInfo.date || '';
      var description = livretInfo.description || 'Ce livret explore les thèmes de ' + categorieActuelle + ' à travers ' + totalChapitres + ' chapitres.';
      var preRequis = livretInfo.preRequis || '';
      var auteur = livretInfo.auteur || '';

      var dateFormatee = formatDate(dateLivret);
      var pourcentage = totalChapitres > 0 ? Math.round((validees / totalChapitres) * 100) : 0;

      var enteteHtml = `
        <div class="entete-livret">
          <div class="couverture-mini" style="background: ${couleur} !important; border-color: ${couleur} !important;">
            <span class="badge-niveau-couv">Niveau ${niveauLivret}</span>
            <div class="contenu-couv">
              <div class="titre-wrapper">
                <span class="titre-couv">${categorieActuelle}</span>
                ${sousTitre ? `<span class="sous-titre-couv">${sousTitre}</span>` : ''}
              </div>
              <div class="edition-info">
                <span class="edition-nom">Qiraat Édition</span>
                ${dateFormatee ? `<span class="edition-date">${dateFormatee}</span>` : ''}
              </div>
            </div>
            <div class="progression-couv">
              <div class="barre" style="width: ${pourcentage}%;"></div>
            </div>
          </div>
          <div class="description-livret">
            <h2>${categorieActuelle}</h2>
            ${preRequis ? `<div class="pre-requis"><strong>Pré-requis :</strong> ${preRequis}</div>` : ''}
${auteur ? `<div class="pre-requis"><strong>Auteur :</strong> ${auteur}</div>` : ''}
            <div class="texte-desc">
              <p>${description}</p>
            </div>
            <div class="stats-livret">
              <span class="stat-item">Chapitres : <span class="nombre">${totalChapitres}</span></span>
              <span class="stat-item">Validés : <span class="nombre">${validees}</span></span>
              <span class="stat-item">Progression : <span class="nombre">${pourcentage}%</span></span>
            </div>
          </div>
        </div>
      `;

      document.getElementById('enteteLivret').innerHTML = enteteHtml;

      afficherChapitres(chapitresFiltres);
    }

    // ============================================================
    // AFFICHER LES CHAPITRES (SANS VERROUILLAGE)
    // ============================================================
    function afficherChapitres(chapitres) {
      var container = document.getElementById('contenuChapitres');

      if (chapitres.length === 0) {
        container.innerHTML = `
          <div class="vide-chapitres">
            <span class="icone">🎬</span>
            <h4>Aucun chapitre</h4>
            <p>Ce livret ne contient pas encore de chapitres.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="section-chapitres"><h3>Chapitres</h3>';

      for (var i = 0; i < chapitres.length; i++) {
        var chapitre = chapitres[i];
        var reponse = toutesLesReponses[chapitre.id];

        if (!reponse) {
          for (var key in toutesLesReponses) {
            if (toutesLesReponses[key].titre === chapitre.titre) {
              reponse = toutesLesReponses[key];
              break;
            }
          }
        }

        var dateValidation = '';
        var retenir = '';
        var estLu = false;
        var estValide = false;

        var reponses = toutesLesReponses[chapitre.id] || [];
        if (reponses.length > 0) {
          var toutesValides = true;
          for (var j = 0; j < reponses.length; j++) {
            if (reponses[j].valide !== 'valide') {
              toutesValides = false;
              break;
            }
            if (reponses[j].date) dateValidation = reponses[j].date;
            if (reponses[j].retenir) retenir = reponses[j].retenir;
          }
          
          if (toutesValides) {
            estLu = true;
            estValide = true;
          }
        }

        var hasQuiz = chapitre.hasQuiz || false;
        var hasQuestion = chapitre.hasQuestion || false;
        var mots = chapitre.mots || 0;

        var nbQuestions = 0;
        if (hasQuiz) nbQuestions++;
        if (hasQuestion) nbQuestions++;

        var metaHtml = '';

        if (estLu) {
          var resultatHtml = '';
          var questionHtml = '';
          var annoteHtml = '';

          if (reponse) {
            var bonnes = reponse.bonnes || 0;
            var total = reponse.total || 0;
            if (total > 0) {
              resultatHtml = '<span class="badge-icone">Résultat : ' + bonnes + '/' + total + '</span>';
            }

            var reponseOuverte = reponse.reponseOuverte || '';
            if (reponseOuverte && reponseOuverte.trim() !== '') {
              questionHtml = '<span class="badge-icone">Question envoyée ✓</span>';
            } else if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }

            var annotations = reponse.annotations || '';
            if (annotations && annotations.trim() !== '') {
              annoteHtml = '<span class="badge-icone clickable" onclick="event.stopPropagation(); ouvrirAnnotations(\'' + chapitre.id + '\', \'' + chapitre.titre.replace(/'/g, "\\'") + '\');">Annoté ✓</span>';
            } else {
              annoteHtml = '<span class="badge-icone">Non annoté</span>';
            }
          } else {
            resultatHtml = '<span class="badge-icone">Résultat : 0/0</span>';
            if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }
            annoteHtml = '<span class="badge-icone">Non annoté</span>';
          }

          metaHtml = resultatHtml + questionHtml + annoteHtml;
        } else {
          metaHtml = '<span class="badge-icone">Nbr questions : ' + nbQuestions + '</span>';
        }

        var dateHtml = '';
        var dateLabelHtml = '';

        if (estLu && dateValidation) {
          var d = new Date(dateValidation);
          if (!isNaN(d.getTime())) {
            var dateStr = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
            var heureStr = d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
            dateLabelHtml = '<span class="date-label">Fait :</span>';
            dateHtml = '<span class="date-validation">' + dateStr + ' à ' + heureStr + '</span>';
          }
        }

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre">
              <strong>À retenir</strong>
              ${retenir}
            </div>
          `;
        }

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

        var imprimerHtml = '';
        if (estLu) {
          imprimerHtml = `
            <div class="btn-wrap">
              <button class="btn-imprimer" onclick="event.stopPropagation(); imprimerChapitre('${chapitre.id}', '${chapitre.titre.replace(/'/g, "\\'")}')">
                🖨 Imprimer
              </button>
            </div>
          `;
        }

        // 🔓 TOUS LES CHAPITRES SONT ACCESSIBLES - PLUS DE VERROUILLAGE
        var onClickAttr = 'onclick="window.location.href=\'/medit/chapitre.html?id=' + chapitre.id + '\'"';

        html += `
          <div class="carte-chapitre" ${onClickAttr}>
            <div class="infos">
              <div class="titre">${chapitre.titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${chapitre.niveau}</span>
                ${metaHtml}
                ${motsHtml}
                ${retenirHtml}
              </div>
            </div>
            <div class="statut">
              ${dateLabelHtml}
              ${dateHtml}
            </div>
            ${imprimerHtml}
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
      chargerLivret();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
