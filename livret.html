<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livret</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+SC:wght@500;600;700&family=Playpen+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles des leçons (repris de impression.js) -->
  <style id="stylesTextes"></style>

  <!-- ============================================================
       STYLES DU LIVRET
       Le livret est découpé en vraies pages A4 par le script :
       chaque page porte son en-tête et son numéro.
       ============================================================ -->
  <style>
    @font-face {
      font-family: 'Janna LT Bold';
      src: url('/medit/fonts/Janna LT Bold.ttf') format('truetype');
      font-weight: bold;
    }

    :root {
      --encre: #1a1712;
      --encre-douce: #5a5244;
      --gris: #7a705f;
      --filet: #b9ad94;
      --or: #9a7b3c;
      --vert: #2d6a4f;
      --vert-pale: #f2f7f4;
      --papier: #ffffff;
      --livre: 'EB Garamond', Garamond, 'Times New Roman', serif;
      --capitales: 'Cormorant SC', 'EB Garamond', serif;

      /* Format de page */
      --page-l: 210mm;
      --page-h: 297mm;
      --marge-haut: 12mm;
      --marge-bas: 14mm;
      --marge-cote: 17mm;
    }

    @page { size: A4; margin: 0; }

    html, body { margin: 0; padding: 0; background: #e6e1d6; }
    body { font-family: var(--livre); color: var(--encre); }

    /* ---------- Barre d'outils (écran seulement) ---------- */
    .barre-livret {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 24px; background: #fffdf8; border-bottom: 3px double var(--filet);
    }
    .barre-livret .barre-titre { font-family: var(--capitales); font-size: 20px; letter-spacing: .1em; }
    .barre-livret .barre-statut { font-style: italic; color: var(--gris); font-size: 15px; }
    .barre-livret button {
      font-family: var(--capitales); font-size: 16px; letter-spacing: .08em;
      padding: 9px 22px; background: var(--encre); color: #fff; border: 1px solid var(--encre); cursor: pointer;
    }
    .barre-livret button:disabled { opacity: .4; cursor: default; }

    /* ---------- Pages A4 ---------- */
    .livret { padding: 30px 0 60px; }
    .page-a4 {
      width: var(--page-l);
      height: var(--page-h);
      margin: 0 auto 24px;
      padding: var(--marge-haut) var(--marge-cote) var(--marge-bas);
      box-sizing: border-box;
      background: var(--papier);
      box-shadow: 0 2px 14px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .page-a4 .zone-contenu { flex: 1; position: relative; overflow: hidden; min-height: 0; }

    /* En-tête courant : thème | n° de page | niveau */
    .entete-courant {
      flex-shrink: 0;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline;
      font-family: var(--capitales); font-size: 10pt; letter-spacing: 1px;
      color: var(--vert);
      border-bottom: 0.3mm solid var(--vert);
      padding-bottom: 1.5mm; margin-bottom: 6mm;
    }
    .entete-courant .ec-gauche { text-align: left; }
    .entete-courant .ec-num { text-align: center; color: var(--encre); font-family: var(--livre); font-size: 11pt; letter-spacing: 0; padding: 0 6mm; }
    .entete-courant .ec-droite { text-align: right; color: var(--or); }

    /* Zone de mesure (invisible) */
    #mesure {
      position: absolute; left: -10000px; top: 0;
      width: calc(var(--page-l) - 2 * var(--marge-cote));
      visibility: hidden;
    }

    /* ---------- 1re de couverture ---------- */
    .couv {
      padding: 0 !important;
      background: var(--vert-pale) !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .couv-cadre {
      flex: 1; margin: 14mm;
      border: 0.5mm solid var(--vert); outline: 0.3mm solid var(--or); outline-offset: -3mm;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      text-align: center; padding: 22mm 18mm 18mm;
      background: #ffffff;
    }
    .c-auteur-haut {
      font-family: var(--capitales); font-weight: 600; font-size: 22pt; letter-spacing: .18em; color: var(--encre);
    }
    .c-collection { font-family: var(--capitales); letter-spacing: .3em; font-size: 11pt; color: var(--gris); margin-top: 3mm; }
    .c-fleuron { font-size: 22pt; color: var(--or); margin: 6mm 0; }
    .c-titre { font-family: var(--capitales); font-weight: 700; font-size: 34pt; line-height: 1.15; letter-spacing: .06em; color: var(--vert); }
    .c-sous-titre { font-style: italic; font-size: 15pt; margin-top: 6mm; color: var(--encre-douce); }
    .c-filet { width: 30mm; border-top: 0.3mm solid var(--or); margin: 8mm auto; }
    .c-image { width: 42mm; height: 42mm; border-radius: 50%; object-fit: cover; border: 0.4mm solid var(--or); margin: 8mm auto; }
    .c-niveaux { font-style: italic; color: var(--gris); font-size: 12pt; margin-top: 3mm; }
    .c-bas { font-family: var(--capitales); font-size: 11pt; letter-spacing: .2em; color: var(--gris); }

    /* ---------- Page 2 : mentions légales ---------- */
    .mentions { justify-content: flex-end; }
    .mentions .m-bloc { font-size: 9.5pt; line-height: 1.7; color: var(--encre-douce); }
    .mentions .m-bloc strong { font-weight: 600; color: var(--encre); }

    /* ---------- Ce livret appartient à ---------- */
    .appartient { justify-content: center; align-items: center; }
    .appartient-cadre { width: 140mm; padding: 14mm 16mm; border: 0.4mm solid var(--vert); outline: 0.25mm solid var(--or); outline-offset: -2.5mm; }
    .appartient h2 { font-family: var(--capitales); font-weight: 600; text-align: center; font-size: 20pt; letter-spacing: .12em; color: var(--vert); margin: 0 0 4mm; }
    .appartient .a-fleuron { text-align: center; color: var(--or); margin-bottom: 10mm; }
    .appartient .a-ligne { display: flex; align-items: baseline; gap: 3mm; font-size: 14pt; margin: 9mm 0; }
    .appartient .a-ligne span:last-child { flex: 1; border-bottom: 0.3mm dotted var(--filet); height: 6mm; }

    /* ---------- Intercalaire de niveau ---------- */
    .intercalaire { justify-content: center; align-items: center; text-align: center; }
    .intercalaire .i-filet { width: 60mm; border-top: 0.4mm solid var(--vert); margin: 6mm auto; }
    .intercalaire .i-titre { font-family: var(--capitales); font-weight: 600; font-size: 40pt; letter-spacing: .14em; color: var(--vert); }
    .intercalaire .i-sous { font-style: italic; color: var(--gris); font-size: 13pt; }
    .intercalaire .i-fleuron { color: var(--or); font-size: 18pt; }

    /* ---------- Sommaire ---------- */
    .s-titre-page { font-family: var(--capitales); font-weight: 600; font-size: 22pt; letter-spacing: .14em; text-align: center; text-transform: lowercase; margin: 4mm 0 2mm; }
    .s-fleuron { text-align: center; color: var(--or); font-size: 15pt; margin-bottom: 8mm; }
    .s-partie { font-family: var(--capitales); color: var(--vert); font-size: 15pt; letter-spacing: .12em; margin: 6mm 0 2mm; border-bottom: 0.3mm solid var(--vert); padding-bottom: 1mm; }
    .s-theme { font-style: italic; color: var(--or); font-size: 12pt; margin: 3mm 0 1mm; }
    .s-ligne { display: flex; align-items: baseline; gap: 6px; font-size: 13pt; padding: 1.8mm 0; }
    .s-num { font-family: var(--capitales); color: var(--or); min-width: 24mm; }
    .numero-chapitre { font-family: var(--capitales) !important; letter-spacing: 2px; font-size: 13pt !important; }
    .s-points { flex: 1; border-bottom: 0.3mm dotted var(--filet); margin: 0 2mm; transform: translateY(-1mm); }
    .s-page { min-width: 8mm; text-align: right; font-variant-numeric: oldstyle-nums; }
    .s-ligne a { color: inherit; text-decoration: none; }

    /* ---------- Glossaire ---------- */
    .g-titre-page { font-family: var(--capitales); font-weight: 600; font-size: 22pt; letter-spacing: .14em; text-align: center; text-transform: lowercase; margin: 4mm 0 2mm; }
    .g-fleuron { text-align: center; color: var(--or); font-size: 15pt; margin-bottom: 6mm; }
    .g-rangee { display: flex; gap: 10mm; }
    .g-rangee .g-col { flex: 1 1 0; min-width: 0; }
    .g-lettre { font-family: var(--capitales); color: var(--vert); font-size: 15pt; border-bottom: 0.3mm solid var(--vert); margin: 3mm 0 2mm; }
    .g-entree { font-size: 11pt; line-height: 1.45; margin-bottom: 2mm; text-align: justify; hyphens: auto; }
    .g-mot { font-weight: 600; font-style: italic; }
    .g-ref { color: var(--gris); font-size: 9.5pt; font-style: italic; white-space: nowrap; }

    /* ---------- 4e de couverture : vert très pâle, sans cadre ---------- */
    .quatrieme {
      background: var(--vert-pale) !important;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      padding: 30mm 26mm 22mm !important;
      justify-content: space-between; text-align: center;
    }
    .q-texte { font-size: 13pt; line-height: 1.7; text-align: justify; hyphens: auto; }
    .q-titre { font-family: var(--capitales); font-weight: 600; font-size: 20pt; color: var(--vert); letter-spacing: .08em; margin-bottom: 8mm; }
    .q-devise { font-style: italic; font-size: 12.5pt; line-height: 1.6; color: var(--encre-douce); }
    .q-bas { font-family: var(--capitales); font-size: 11pt; letter-spacing: .2em; color: var(--gris); }

    /* ---------- Leçons ---------- */
    .zone-contenu, #mesure { background: transparent !important; }
    .zone-contenu .page { background: transparent !important; padding: 0 !important; }
    .note-fin { margin-top: 8mm; }
    .separateur-lecon { text-align: center; color: var(--or); font-size: 16pt; margin: 9mm 0 7mm; line-height: 1; }
    .repere-lecon { height: 0; }
    .note-simple { flex-shrink: 0; align-self: flex-end; font-size: 11pt; white-space: nowrap; padding-bottom: 2px; }
    .note-simple strong { font-weight: 600; }

    .chargement { text-align: center; font-style: italic; color: var(--gris); padding: 60px 20px; font-size: 16px; }
    .erreur-livret { text-align: center; color: #8a2a1a; padding: 60px 20px; }

    @media print {
      html, body { background: #fff !important; }
      .barre-livret { display: none !important; }
      .livret { padding: 0; }
      .page-a4 {
        margin: 0; box-shadow: none;
        break-after: page; page-break-after: always;
      }
      .page-a4:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>

  <div class="barre-livret">
    <div>
      <div class="barre-titre" id="barreTitre">Livret</div>
      <div class="barre-statut" id="barreStatut">Préparation du livret…</div>
    </div>
    <button id="btnImprimer" onclick="window.print()" disabled>Imprimer le livret</button>
  </div>

  <div class="livret" id="livret">
    <div class="chargement">Chargement des textes du thème…</div>
  </div>
  <div id="mesure"></div>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // RÉGLAGES
    // ============================================================
    var AUTEUR = 'W. KHAN';
    var COLLECTION = 'Programme Kitab-wa-hikmat';
    var EDITEUR = 'Association Va & Vie';
    var DEVISE = '« Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ? »<br>— Coran 47:24';

    // ============================================================
    // OUTILS
    // ============================================================
    function esc(s) {
      if (s === undefined || s === null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function numeroDe(titre) {
      var m = String(titre || '').match(/^\s*(\d+)\s+/);
      return m ? parseInt(m[1], 10) : Infinity;
    }
    function titreSansNumero(titre) { return String(titre || '').replace(/^\s*\d+\s+/, '').trim(); }
    function statut(t) { document.getElementById('barreStatut').textContent = t; }
    function pause() { return new Promise(function(r) { setTimeout(r, 0); }); }

    function envelopperArabe(racine) {
      var walker = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, null, false);
      var noeuds = [], n;
      while ((n = walker.nextNode())) if (/[؀-ۿ]/.test(n.nodeValue || '')) noeuds.push(n);
      var exclus = ['arabe', 'copier-mot', 'copier-mot-pointille', 'copier-mot-kfg'];
      noeuds.forEach(function(noeud) {
        var parent = noeud.parentNode;
        if (!parent || !parent.classList) return;
        for (var i = 0; i < exclus.length; i++) if (parent.classList.contains(exclus[i])) return;
        var morceaux = noeud.nodeValue.split(/([؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]+)/g);
        var frag = document.createDocumentFragment();
        morceaux.forEach(function(p) {
          if (p === '') return;
          if (/[؀-ۿ]/.test(p)) {
            var span = document.createElement('span');
            span.className = 'arabe'; span.setAttribute('lang', 'ar'); span.textContent = p;
            frag.appendChild(span);
          } else frag.appendChild(document.createTextNode(p));
        });
        parent.replaceChild(frag, noeud);
      });
    }

    function decouperPage(html) {
      var style = '';
      var m = html.match(/<style>([\s\S]*?)<\/style>/);
      if (m) style = m[1];
      style = style.replace(/\.page\s*\{\s*zoom:\s*\d+%;\s*\}/g, '');
      style = style.replace(/@supports not \(zoom: 1\)\s*\{[\s\S]*?\}\s*\}/g, '');
      style = style.replace(/@page\s*\{[^}]*\}/g, '');
      style = style.replace(/(^|\})\s*body\s*\{/g, '$1 .zone-contenu {');
      var corps = '';
      var b = html.match(/<body>([\s\S]*?)<\/body>/);
      if (b) corps = b[1];
      return { style: style, corps: corps };
    }

    function nettoyerLecon(racine) {
      ['.entete-eleve', '.temps-lecture-haut', '.meta-niveau', '.couverture-mini', '.pied-page'].forEach(function(sel) {
        racine.querySelectorAll(sel).forEach(function(el) { el.remove(); });
      });
      racine.querySelectorAll('.note-haut-bloc .note-sur-20').forEach(function(cadre) {
        var simple = document.createElement('div');
        simple.className = 'note-simple';
        simple.innerHTML = '<strong>Note :</strong> ……… / 20';
        cadre.parentNode.replaceChild(simple, cadre);
      });
      var note = racine.querySelector('.note-haut-bloc');
      var page = racine.querySelector('.page');
      if (note && page) { note.classList.add('note-fin'); page.appendChild(note); }
    }

    // ============================================================
    // PAGINATION : découpe le contenu en vraies pages A4
    // ============================================================
    var livretEl, pages = [];

    function nouvellePage(type, entete) {
      var p = document.createElement('div');
      p.className = 'page-a4' + (type ? ' ' + type : '');
      if (entete) {
        var e = document.createElement('div');
        e.className = 'entete-courant';
        e.innerHTML = '<span class="ec-gauche">' + esc(entete.gauche) + '</span>'
          + '<span class="ec-num"></span>'
          + '<span class="ec-droite">' + esc(entete.droite || '') + '</span>';
        p.appendChild(e);
        var z = document.createElement('div');
        z.className = 'zone-contenu';
        p.appendChild(z);
        p._zone = z;
      }
      livretEl.appendChild(p);
      pages.push(p);
      return p;
    }
    function pageSimple(type, html) {
      var p = nouvellePage(type, null);
      p.innerHTML = html;
      return p;
    }

    // Éléments qui peuvent être coupés entre deux pages (on descend dans leurs enfants)
    var SECABLES = ['page', 'corps-contenu', 'texte-zone', 'zone-exercices', 'paragraphe',
                    'zone-memorisation', 'exo-col', 'col-table-lignes', 'g-liste'];

    function estSecable(el) {
      if (!el.classList) return false;
      for (var i = 0; i < SECABLES.length; i++) if (el.classList.contains(SECABLES[i])) return true;
      return el.hasAttribute && el.hasAttribute('data-racine');
    }

    // Liste des blocs insécables, chacun avec la chaîne de ses parents
    function aplatir(el, chaine, sortie) {
      if (el.nodeType === 3) {
        if (el.nodeValue.trim()) sortie.push({ el: el, chaine: chaine });
        return;
      }
      if (el.nodeType !== 1) return;
      if (estSecable(el) && el.children.length > 0) {
        var c2 = chaine.concat([el]);
        Array.prototype.slice.call(el.childNodes).forEach(function(enf) { aplatir(enf, c2, sortie); });
      } else {
        sortie.push({ el: el, chaine: chaine });
      }
    }

    // Remplit des pages avec des blocs, en recréant leurs parents sur chaque page
    function Remplisseur(entete) {
      this.entete = entete;
      this.page = null;
      this.ouverts = [];
      this.dejaOuverts = new Set();
    }
    Remplisseur.prototype.nouvelle = function() {
      this.page = nouvellePage('', this.entete);
      this.ouverts = [];
      this.vide = true;
    };
    Remplisseur.prototype.deborde = function() {
      var z = this.page._zone;
      return z.scrollHeight > z.clientHeight + 1;
    };
    Remplisseur.prototype.parentPour = function(chaine) {
      var i = 0;
      while (i < this.ouverts.length && i < chaine.length && this.ouverts[i].src === chaine[i]) i++;
      this.ouverts.length = i;
      var parent = i > 0 ? this.ouverts[i - 1].clone : this.page._zone;
      for (var j = i; j < chaine.length; j++) {
        var src = chaine[j];
        var cl = src.cloneNode(false);
        cl.removeAttribute('id');
        if (this.dejaOuverts.has(src)) {
          cl.classList && cl.classList.remove('lettrine');
          // une suite de section ne répète pas son titre
        }
        this.dejaOuverts.add(src);
        parent.appendChild(cl);
        this.ouverts.push({ src: src, clone: cl });
        parent = cl;
      }
      return parent;
    };
    Remplisseur.prototype.ajouter = function(bloc) {
      if (!this.page) this.nouvelle();
      if (bloc.el.classList && bloc.el.classList.contains('exos-2col-flex')) { this.ajouter2col(bloc); return; }
      var parent = this.parentPour(bloc.chaine);
      var cl = bloc.el.cloneNode(true);
      parent.appendChild(cl);
      if (this.deborde() && !this.vide) {
        cl.remove();
        this.nettoyerParentsVides();
        this.nouvelle();
        parent = this.parentPour(bloc.chaine);
        parent.appendChild(cl);
      }
      this.vide = false;
    };
    // Place restante sur la page courante (en px)
    Remplisseur.prototype.placeRestante = function() {
      if (!this.page) return 0;
      var z = this.page._zone;
      var bas = 0;
      Array.prototype.forEach.call(z.children, function(c) {
        var b = c.offsetTop + c.offsetHeight;
        if (b > bas) bas = b;
      });
      return z.clientHeight - bas;
    };
    // Ajoute un élément directement dans la zone (hors chaîne de parents)
    Remplisseur.prototype.ajouterBrut = function(el) {
      if (!this.page) this.nouvelle();
      this.ouverts = [];
      this.page._zone.appendChild(el);
      if (this.deborde() && !this.vide) {
        el.remove();
        this.nouvelle();
        this.page._zone.appendChild(el);
      }
      this.vide = false;
    };
    Remplisseur.prototype.nettoyerParentsVides = function() {
      for (var i = this.ouverts.length - 1; i >= 0; i--) {
        var c = this.ouverts[i].clone;
        if (c.childNodes.length === 0) { c.remove(); this.ouverts.length = i; }
        else break;
      }
    };
    // Questions sur 2 colonnes : on remplit la page avec autant de questions que possible
    Remplisseur.prototype.ajouter2col = function(bloc) {
      var exos = Array.prototype.slice.call(bloc.el.querySelectorAll(':scope > .col-gauche > .exo, :scope > .col-droite > .exo'));
      var hauteurs = exos.map(function(e) { return e.getBoundingClientRect().height || 1; });
      var self = this;
      function construire(debut, fin) {
        var total = 0, k;
        for (k = debut; k < fin; k++) total += hauteurs[k];
        var cumul = 0, coupe = fin;
        for (k = debut; k < fin; k++) { cumul += hauteurs[k]; if (cumul >= total / 2) { coupe = k + 1; break; } }
        if (fin - debut > 1 && coupe >= fin) coupe = fin - 1;
        if (fin - debut === 1) {
          // une seule question restante : pleine largeur, pas de colonne vide
          var seule = document.createElement('div');
          seule.appendChild(exos[debut].cloneNode(true));
          return seule;
        }
        var wrap = bloc.el.cloneNode(false);
        var g = document.createElement('div'); g.className = 'col-gauche';
        var d = document.createElement('div'); d.className = 'col-droite';
        for (k = debut; k < fin; k++) (k < coupe ? g : d).appendChild(exos[k].cloneNode(true));
        wrap.appendChild(g); wrap.appendChild(d);
        return wrap;
      }
      var debut = 0;
      while (debut < exos.length) {
        var parent = this.parentPour(bloc.chaine);
        var fin = exos.length, place = null;
        while (fin > debut) {
          var essai = construire(debut, fin);
          parent.appendChild(essai);
          if (!this.deborde()) { place = essai; break; }
          essai.remove();
          fin--;
        }
        if (!place) {
          if (this.vide) {
            parent.appendChild(construire(debut, debut + 1));
            fin = debut + 1;
          } else {
            this.nettoyerParentsVides();
            this.nouvelle();
            continue;
          }
        }
        this.vide = false;
        debut = fin;
        if (debut < exos.length) { this.nettoyerParentsVides(); this.nouvelle(); }
      }
    };

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function construireLivret() {
      livretEl = document.getElementById('livret');
      var params = new URLSearchParams(window.location.search);
      // Paramètres : cat=Thème (un seul)  ou  themes=A|B|C  &niveaux=1,2  &tout=1  &titre=...
      var themesDemandes = [];
      if (params.get('cat')) themesDemandes = [params.get('cat')];
      if (params.get('themes')) themesDemandes = params.get('themes').split('|').map(function(x) { return x.trim(); }).filter(Boolean);
      var niveauxDemandes = (params.get('niveaux') || '').split(',').map(function(x) { return parseInt(x, 10); }).filter(function(x) { return !isNaN(x); });
      var tout = params.get('tout') === '1';
      if (!tout && themesDemandes.length === 0) { livretEl.innerHTML = '<div class="erreur-livret">Aucun thème choisi.</div>'; statut(''); return; }

      var cat = params.get('titre') || (themesDemandes.length === 1 && !tout ? themesDemandes[0] : 'Livret complet');
      document.title = 'Livret — ' + cat;
      document.getElementById('barreTitre').textContent = cat;

      DataManager.charger().then(function(data) {
        data = data || {};
        var tous = data.tousLesTextes || data.textes || [];
        var infoTheme = {};
        if (themesDemandes.length === 1 && !tout) {
          (data.themes || []).forEach(function(t) { if (t.titre === themesDemandes[0]) infoTheme = t; });
        }
        var ordreThemes = {};
        (data.themes || []).forEach(function(t, i) { ordreThemes[t.titre] = i; });

        var textes = tous.filter(function(t) {
          var c = (t.categorie || '').trim();
          if (/\([^)]*\)\s*$/.test(t.titre || '')) return false;
          if (!tout && themesDemandes.indexOf(c) === -1) return false;
          if (niveauxDemandes.length && niveauxDemandes.indexOf(parseInt(t.niveau, 10) || 1) === -1) return false;
          return true;
        });
        textes.sort(function(a, b) {
          var ta = ordreThemes[a.categorie] !== undefined ? ordreThemes[a.categorie] : 9999;
          var tb = ordreThemes[b.categorie] !== undefined ? ordreThemes[b.categorie] : 9999;
          return ta - tb
            || numeroDe(a.titre) - numeroDe(b.titre)
            || String(a.titre).localeCompare(String(b.titre), 'fr', { sensitivity: 'base' });
        });
        if (textes.length === 0) { livretEl.innerHTML = '<div class="erreur-livret">Aucun texte ne correspond à ces filtres.</div>'; statut(''); return; }

        // Images de chaque thème utilisé
        var themesUtilises = [];
        textes.forEach(function(t) { if (themesUtilises.indexOf(t.categorie) === -1) themesUtilises.push(t.categorie); });
        var imagesParTheme = {};
        var promesseImages = Promise.all(themesUtilises.map(function(th) {
          if (typeof chargerImagesTheme !== 'function') return Promise.resolve();
          return chargerImagesTheme(th).then(function(im) { imagesParTheme[th] = im || {}; }).catch(function() {});
        })).then(function() { return imagesParTheme; });

        var complets = [], k = 0;
        function chargerSuivant() {
          if (k >= textes.length) {
            promesseImages.then(function(images) {
              var polices = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
              polices.then(function() { assembler(cat, infoTheme, complets, images || {}); });
            });
            return;
          }
          var t = textes[k];
          statut('Chargement du texte ' + (k + 1) + ' / ' + textes.length + '…');
          DataManager.getTexteAsync(t.id).then(function(full) { complets.push(Object.assign({}, t, full || {})); })
            .catch(function() { complets.push(t); })
            .then(function() { k++; chargerSuivant(); });
        }
        chargerSuivant();
      }).catch(function(e) {
        console.error(e);
        livretEl.innerHTML = '<div class="erreur-livret">Erreur de chargement. Vérifiez votre connexion.</div>';
        statut('');
      });
    }

    // ============================================================
    // ASSEMBLAGE
    // ============================================================
    async function assembler(cat, info, textes, images) {
      livretEl.innerHTML = '';
      pages = [];
      var mesure = document.getElementById('mesure');

      // Date : mois et année du dernier texte publié
      var derniere = null;
      textes.forEach(function(t) {
        var d = new Date(t.date);
        if (!isNaN(d.getTime()) && (!derniere || d > derniere)) derniere = d;
      });
      if (!derniere) derniere = new Date();
      var moisAnnee = derniere.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      moisAnnee = moisAnnee.charAt(0).toUpperCase() + moisAnnee.slice(1);

      var parNiveau = {};
      textes.forEach(function(t) { var n = parseInt(t.niveau, 10) || 1; (parNiveau[n] = parNiveau[n] || []).push(t); });
      var niveaux = Object.keys(parNiveau).map(Number).sort(function(a, b) { return a - b; });
      // Numérotation continue des chapitres, dans l'ordre du livret
      var chap = 0;
      niveaux.forEach(function(n) { parNiveau[n].forEach(function(t) { t._chap = ++chap; }); });
      var texteNiveaux = niveaux.length === 1 ? 'Niveau ' + niveaux[0] : 'Niveaux ' + niveaux[0] + ' à ' + niveaux[niveaux.length - 1];

      // ---- 1. Première de couverture ----
      pageSimple('couv', '<div class="couv-cadre">'
        + '<div><div class="c-auteur-haut">' + esc(AUTEUR) + '</div><div class="c-collection">' + esc(COLLECTION) + '</div></div>'
        + '<div>'
        +   '<div class="c-fleuron">❦</div>'
        +   '<div class="c-titre">' + esc(cat) + '</div>'
        +   (info.sousTitre ? '<div class="c-sous-titre">' + esc(info.sousTitre) + '</div>' : '')
        +   (info.couverture ? '<img class="c-image" src="' + esc(info.couverture) + '" alt="">' : '<div class="c-filet"></div>')
        +   '<div class="c-niveaux">' + texteNiveaux + '</div>'
        + '</div>'
        + '<div class="c-bas">' + esc(EDITEUR) + ' · ' + esc(moisAnnee) + '</div>'
        + '</div>');

      // ---- 2. Page blanche avec mentions légales ----
      pageSimple('mentions', '<div class="m-bloc">'
        + '<div><strong>' + esc(AUTEUR) + '</strong> — <em>' + esc(cat) + '</em></div>'
        + '<div>' + esc(COLLECTION) + '</div>'
        + '<div>© ' + esc(EDITEUR) + ', ' + derniere.getFullYear() + '. Tous droits réservés.</div>'
        + '<div>ISBN : ………………………………</div>'
        + '<div>Dépôt légal : ' + esc(moisAnnee) + '</div>'
        + '<div>Achevé d\'imprimer en ' + esc(moisAnnee.toLowerCase()) + '.</div>'
        + '<div style="margin-top:3mm">Toute reproduction, même partielle, est interdite sans l\'autorisation de l\'éditeur.</div>'
        + '</div>');

      // ---- 3. Ce livret appartient à ----
      pageSimple('appartient', '<div class="appartient-cadre"><h2>Ce livret appartient à</h2><div class="a-fleuron">❧</div>'
        + '<div class="a-ligne"><span>Nom :</span><span></span></div>'
        + '<div class="a-ligne"><span>Prénom :</span><span></span></div>'
        + '<div class="a-ligne"><span>Classe :</span><span></span></div>'
        + '<div class="a-ligne"><span>Année :</span><span></span></div></div>');

      // ---- 4. Sommaire (numéros de page remplis à la fin) ----
      var sommaireHtml = '<div data-racine class="s-racine"><div class="s-titre-page">Sommaire</div><div class="s-fleuron">❧</div>';
      niveaux.forEach(function(n) {
        sommaireHtml += '<div class="s-partie">Niveau ' + n + '</div>';
        var themePrec = null;
        var plusieursThemes = textes.some(function(x) { return x.categorie !== textes[0].categorie; });
        parNiveau[n].forEach(function(t, i) {
          if (plusieursThemes && t.categorie !== themePrec) {
            sommaireHtml += '<div class="s-theme">' + esc(t.categorie) + '</div>';
            themePrec = t.categorie;
          }
          t._ancre = 'lecon-' + n + '-' + i;
          sommaireHtml += '<div class="s-ligne"><span class="s-num">Chapitre ' + t._chap + '</span>'
            + '<a href="#' + t._ancre + '">' + esc(titreSansNumero(t.titre)) + '</a>'
            + '<span class="s-points"></span><span class="s-page" data-ancre="' + t._ancre + '">00</span></div>';
        });
      });
      sommaireHtml += '</div>';
      mesure.innerHTML = sommaireHtml;
      var rs = new Remplisseur({ gauche: cat, droite: 'Sommaire' });
      var blocsS = []; aplatir(mesure.firstElementChild, [], blocsS);
      blocsS.forEach(function(b) { rs.ajouter(b); });
      await pause();

      // ---- 5. Niveaux et leçons ----
      var plusieursThemesLivret = textes.some(function(x) { return x.categorie !== textes[0].categorie; });
      var styleAjoute = false, faites = 0;
      for (var ni = 0; ni < niveaux.length; ni++) {
        var n = niveaux[ni];
        pageSimple('intercalaire', '<div class="i-fleuron">❦</div><div class="i-filet"></div>'
          + '<div class="i-titre">Niveau ' + n + '</div><div class="i-filet"></div>'
          + '<div class="i-sous">' + parNiveau[n].length + ' leçon' + (parNiveau[n].length > 1 ? 's' : '') + '</div>');

        var r = new Remplisseur({ gauche: cat, droite: 'Niveau ' + n });
        for (var li = 0; li < parNiveau[n].length; li++) {
          var t = parNiveau[n][li];
          faites++;
          statut('Mise en page de la leçon ' + faites + ' / ' + textes.length + '…');
          try {
            var tChap = Object.assign({}, t, { titre: t._chap + ' ' + titreSansNumero(t.titre) });
            var pageHtml = genererImpression(tChap, t.contenu || '', images[t.categorie] || {}, '', 'complet', { retournerHtml: true });
            if (!pageHtml) continue;
            var morceaux = decouperPage(pageHtml);
            if (!styleAjoute) { document.getElementById('stylesTextes').textContent = morceaux.style; styleAjoute = true; }
            var zoom = Math.max(30, Math.min(200, parseInt(t.zoom, 10) || 100));

            mesure.className = 'zone-contenu';
            mesure.innerHTML = '<div data-racine style="zoom:' + zoom + '%">' + morceaux.corps + '</div>';
            nettoyerLecon(mesure);
            mesure.querySelectorAll('.bandeau-titre .numero-texte').forEach(function(nb) {
              nb.textContent = 'Chapitre ' + t._chap;
              nb.classList.add('numero-chapitre');
            });
            envelopperArabe(mesure);

            // En-tête : le thème de la leçon si le livret en mélange plusieurs
            r.entete = { gauche: plusieursThemesLivret ? t.categorie : cat, droite: 'Niveau ' + n };

            // Début de leçon : à la suite, ou page suivante s'il reste moins d'un quart de page
            var repere = document.createElement('div');
            repere.id = t._ancre;
            if (r.page && !r.vide) {
              var hauteurZone = r.page._zone.clientHeight;
              if (r.placeRestante() < hauteurZone * 0.25) {
                r.nouvelle();
                repere.className = 'repere-lecon';
              } else {
                repere.className = 'separateur-lecon';
                repere.innerHTML = '❦';
              }
            } else {
              repere.className = 'repere-lecon';
            }
            r.ajouterBrut(repere);

            var blocs = []; aplatir(mesure.firstElementChild, [], blocs);
            blocs.forEach(function(b) { r.ajouter(b); });
          } catch (e) {
            console.error('Leçon ignorée :', t.titre, e);
          }
          await pause();
        }
      }

      // ---- 6. Glossaire ----
      var entrees = {};
      textes.forEach(function(t) {
        var ref = String(t._chap);
        var vocab = t.vocabulaire || [];
        if (typeof vocab === 'string') vocab = vocab.split('\n');
        vocab.forEach(function(item) {
          String(item).split(';').forEach(function(brut) {
            var m = brut.trim(); if (!m) return;
            var iC = m.indexOf(':'), iE = m.indexOf('='), sep = -1;
            if (iC !== -1 && iE !== -1) sep = Math.min(iC, iE); else sep = (iC !== -1) ? iC : iE;
            var mot = (sep !== -1 ? m.substring(0, sep) : m).trim();
            var def = (sep !== -1 ? m.substring(sep + 1) : '').trim();
            if (!mot) return;
            mot = mot.charAt(0).toUpperCase() + mot.slice(1);
            var cle = mot.toLowerCase();
            if (!entrees[cle]) entrees[cle] = { mot: mot, defs: [], refs: [] };
            if (def && entrees[cle].defs.indexOf(def) === -1) entrees[cle].defs.push(def);
            if (entrees[cle].refs.indexOf(ref) === -1) entrees[cle].refs.push(ref);
          });
        });
      });
      var cles = Object.keys(entrees).sort(function(a, b) { return a.localeCompare(b, 'fr', { sensitivity: 'base' }); });
      if (cles.length > 0) {
        var items = [], lettrePrec = '';
        cles.forEach(function(c) {
          var e = entrees[c];
          var lettre = e.mot.charAt(0).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
          if (lettre !== lettrePrec) { items.push('<div class="g-lettre">' + esc(lettre) + '</div>'); lettrePrec = lettre; }
          items.push('<div class="g-entree"><span class="g-mot">' + esc(e.mot) + '</span>'
            + (e.defs.length ? ' : ' + esc(e.defs.join(' ; ')) : '')
            + ' <span class="g-ref">(chap. ' + esc(e.refs.join(', ')) + ')</span></div>');
        });
        // Glossaire sur 2 colonnes, page par page
        mesure.className = '';
        var rg = new Remplisseur({ gauche: cat, droite: 'Glossaire' });
        rg.nouvelle();
        rg.page._zone.innerHTML = '<div class="g-titre-page">Glossaire</div><div class="g-fleuron">❧</div>';
        var idx = 0;
        while (idx < items.length) {
          var rangee = document.createElement('div');
          rangee.className = 'g-rangee';
          var cg = document.createElement('div'); cg.className = 'g-col';
          var cd = document.createElement('div'); cd.className = 'g-col';
          rangee.appendChild(cg); rangee.appendChild(cd);
          rg.page._zone.appendChild(rangee);
          // remplit la colonne de gauche puis celle de droite
          var colonnes = [cg, cd];
          for (var ci = 0; ci < 2 && idx < items.length; ci++) {
            while (idx < items.length) {
              var tmp = document.createElement('div');
              tmp.innerHTML = items[idx];
              var el = tmp.firstElementChild;
              colonnes[ci].appendChild(el);
              if (rg.deborde()) { el.remove(); break; }
              idx++;
            }
          }
          envelopperArabe(rangee);
          if (idx < items.length) rg.nouvelle();
        }
      }

      // ---- 7. Pages de fin : blanche + 4e de couverture, total multiple de 4 ----
      var aAjouter = 2;
      var total = pages.length + aAjouter;
      var complement = (4 - (total % 4)) % 4;
      for (var b = 0; b < complement; b++) pageSimple('blanche', '');
      pageSimple('blanche', '');
      pageSimple('quatrieme',
        '<div>'
        + '<div class="q-titre">' + esc(cat) + '</div>'
        + (info.description ? '<div class="q-texte">' + esc(info.description) + '</div>' : '')
        + '</div>'
        + '<div class="q-devise">' + DEVISE + '</div>'
        + '<div class="q-bas">' + esc(AUTEUR) + ' · ' + esc(EDITEUR) + '</div>');

      // ---- 8. Numéros de page ----
      pages.forEach(function(p, i) {
        var num = p.querySelector('.ec-num');
        if (num) num.textContent = String(i + 1);
      });
      document.querySelectorAll('.s-page').forEach(function(s) {
        var repere = document.getElementById(s.getAttribute('data-ancre'));
        var cible = repere ? repere.closest('.page-a4') : null;
        var i = pages.indexOf(cible);
        s.textContent = i >= 0 ? String(i + 1) : '';
      });

      mesure.innerHTML = '';
      statut('Livret prêt : ' + textes.length + ' leçon' + (textes.length > 1 ? 's' : '') + ', ' + pages.length + ' pages.');
      document.getElementById('btnImprimer').disabled = false;
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', construireLivret);
    else construireLivret();
  </script>
</body>
