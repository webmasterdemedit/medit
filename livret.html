<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Livret - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================
       PAGE LIVRET - VUE DÉTAIL
       ============================================================ */

    .page-livret {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    /* ===== EN-TÊTE DU LIVRET ===== */
    .entete-livret {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e8e4de;
    }

    /* ===== COUVERTURE MINIATURE ===== */
    .couverture-mini {
      flex-shrink: 0;
      width: 200px;
      height: 280px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.10);
      position: relative;
      overflow: hidden;
    }

    .couverture-mini::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.20) 100%);
      pointer-events: none;
      border-radius: 12px;
    }

    .couverture-mini .contenu-couv {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    .couverture-mini .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .couverture-mini .nb-lecons-couv {
      font-size: 14px;
      font-weight: 300;
      opacity: 0.90;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.10);
      background: rgba(0, 0, 0, 0.15);
      padding: 4px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      margin-top: 4px;
    }

    .couverture-mini .niveau-couv {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.30);
      backdrop-filter: blur(6px);
      padding: 2px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    /* ===== DESCRIPTION ===== */
    .description-livret {
      flex: 1;
      padding-top: 4px;
    }

    .description-livret h2 {
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .description-livret .sous-titre-desc {
      font-size: 13px;
      color: #7a7a7a;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .description-livret .texte-desc {
      font-size: 15px;
      line-height: 1.7;
      color: #2a2a2a;
      font-weight: 300;
    }

    .description-livret .texte-desc p {
      margin-bottom: 8px;
    }

    /* ===== STATS DU LIVRET ===== */
    .stats-livret {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 10px 16px;
      background: #f6f4f0;
      border-radius: 8px;
      border: 1px solid #e8e4de;
    }

    .stats-livret .stat-item {
      font-size: 13px;
      color: #3a3a3a;
    }

    .stats-livret .stat-item .nombre {
      font-weight: 700;
      font-size: 16px;
      color: #2d6a4f;
      margin-left: 4px;
    }

    /* ===== BOUTON RETOUR ===== */
    .btn-retour {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid #c4b8a8;
      border-radius: 6px;
      cursor: pointer;
      color: #4a4a4a;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-retour:hover {
      background: #f0ece6;
      border-color: #8a7a6a;
    }

    /* ===== LISTE DES LEÇONS ===== */
    .section-lecons {
      margin-top: 8px;
    }

    .section-lecons h3 {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    /* ===== CARTE POST (héritée de mes-textes) ===== */
    .carte-post {
      background: #ffffff;
      border: 1px solid #e8e4de;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: all 0.2s;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .carte-post:hover {
      border-color: #c4b8a8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .carte-post .infos {
      flex: 1;
      min-width: 200px;
    }

    .carte-post .titre {
      font-weight: 500;
      font-size: 15px;
      color: #1a1a1a;
    }

    .carte-post .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 4px;
      font-size: 12px;
      color: #6a6a6a;
    }

    .carte-post .meta .badge-icone {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 12px;
      background: #f0ece6;
      font-size: 11px;
      color: #4a4a4a;
    }

    .carte-post .meta .badge-icone.clickable {
      cursor: pointer;
      color: #2d6a4f;
      background: #e8f0ec;
    }

    .carte-post .meta .badge-icone.clickable:hover {
      background: #d4e4dc;
    }

    .carte-post .statut {
      font-size: 12px;
      color: #7a7a7a;
      text-align: right;
      min-width: 120px;
    }

    .carte-post .statut .date-label {
      font-weight: 400;
      color: #6a6a6a;
    }

    .carte-post .statut .date-validation {
      color: #2d6a4f;
      font-weight: 500;
    }

    .carte-post .btn-wrap {
      width: 100%;
      padding-top: 6px;
      margin-top: 6px;
      border-top: 1px solid #f0ece6;
      display: flex;
      justify-content: flex-end;
    }

    .carte-post .btn-imprimer {
      display: inline-block;
      padding: 3px 14px;
      font-size: 11px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid #c4b8a8;
      border-radius: 4px;
      cursor: pointer;
      color: #4a4a4a;
      transition: all 0.2s;
    }

    .carte-post .btn-imprimer:hover {
      background: #f0ece6;
      border-color: #8a7a6a;
    }

    .carte-post .retenir-cadre {
      margin-top: 4px;
      padding: 4px 12px;
      background: #f6f4f0;
      border-radius: 4px;
      font-size: 12px;
      color: #3a3a3a;
      border-left: 3px solid #2d6a4f;
    }

    .carte-post .retenir-cadre strong {
      font-weight: 600;
      margin-right: 6px;
    }

    .carte-post .niveau-badge {
      font-size: 11px;
      padding: 1px 10px;
      border-radius: 12px;
      background: #e8e4de;
      color: #4a4a4a;
    }

    .carte-post .mots {
      font-size: 11px;
      color: #8a8a8a;
      margin-left: 4px;
    }

    /* ===== POST BLOQUÉ ===== */
    .carte-post.bloque {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .carte-post.bloque .titre::before {
      content: '🔒 ';
      font-size: 13px;
    }

    /* ===== VIDE ===== */
    .vide-lecons {
      text-align: center;
      padding: 40px 20px;
      background: #f9f7f4;
      border-radius: 12px;
      border: 1px dashed #d4c9b8;
    }

    .vide-lecons .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
      color: #8a7a6a;
    }

    .vide-lecons h4 {
      font-size: 16px;
      color: #3a3a3a;
      font-weight: 500;
    }

    .vide-lecons p {
      color: #7a7a7a;
      font-size: 14px;
    }

    /* ===== LOADER ===== */
    .loader {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e8e4de;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .page-livret {
        padding: 12px 16px 30px;
      }

      .entete-livret {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding-bottom: 18px;
      }

      .couverture-mini {
        width: 160px;
        height: 220px;
      }

      .couverture-mini .titre-couv {
        font-size: 20px;
      }

      .description-livret {
        width: 100%;
        text-align: center;
      }

      .description-livret h2 {
        font-size: 20px;
      }

      .stats-livret {
        justify-content: center;
        gap: 16px;
      }

      .carte-post {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .carte-post .statut {
        text-align: left;
        min-width: unset;
      }

      .carte-post .btn-wrap {
        justify-content: flex-start;
      }
    }

    @media (max-width: 400px) {
      .couverture-mini {
        width: 140px;
        height: 190px;
      }

      .couverture-mini .titre-couv {
        font-size: 17px;
      }

      .couverture-mini .nb-lecons-couv {
        font-size: 12px;
      }

      .description-livret .texte-desc {
        font-size: 14px;
      }

      .stats-livret .stat-item {
        font-size: 12px;
      }
    }

    /* ============================================================
       MODAL (pour les annotations)
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.50);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-contenu {
      background: #ffffff;
      border-radius: 14px;
      max-width: 540px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 32px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .modal-contenu h3 {
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .modal-contenu .modal-sous-titre {
      font-size: 13px;
      color: #7a7a7a;
      margin-bottom: 16px;
      border-bottom: 1px solid #e8e4de;
      padding-bottom: 10px;
    }

    .modal-contenu .modal-annotation {
      padding: 10px 0;
      border-bottom: 1px solid #f0ece6;
    }

    .modal-contenu .modal-annotation:last-child {
      border-bottom: none;
    }

    .modal-contenu .modal-annotation strong {
      display: block;
      font-size: 12px;
      color: #2d6a4f;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .modal-contenu .aucune-annotation {
      color: #8a8a8a;
      font-style: italic;
      padding: 12px 0;
      text-align: center;
    }

    .modal-contenu .modal-close {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #f0ece6;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
      color: #3a3a3a;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-contenu .modal-close:hover {
      background: #e4ded6;
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-livret">

    <a href="/medit/mes-livrets.html" class="btn-retour">← Retour aux livrets</a>

    <div id="enteteLivret">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement du livret...</p>
      </div>
    </div>

    <div id="contenuLecons">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement des leçons...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var toutesLesReponses = {};
    var postsData = [];
    var cataloguesData = [];
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var categorieActuelle = '';

    // ============================================================
    // IMPRESSION
    // ============================================================
    function imprimerArticle(articleId, titre) {
      var url = config.scriptUrl;

      fetch(url + '?action=getPost&id=' + encodeURIComponent(articleId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success || !data.post) {
            alert('Impossible de charger le contenu.');
            return;
          }
          var post = data.post;
          var contenu = post.contenu || '';
          genererImpression(post, contenu);
        })
        .catch(function(error) {
          alert('Erreur : ' + error.message);
        });
    }

    function genererImpression(post, contenu) {
      // Fonction simplifiée d'impression (reprise de mes-textes)
      var printHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${post.titre || 'Lecture'}</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            @page { margin: 2.5cm; size: A4; }
            body {
              font-family: 'Georgia', 'Times New Roman', Times, serif;
              background: #faf8f5;
              color: #1a1a1a;
              font-size: 11.5pt;
              line-height: 1.8;
              padding: 20px;
            }
            h1 { font-size: 18pt; text-align: center; margin-bottom: 6px; }
            .meta { text-align: center; font-size: 10pt; color: #6a6a6a; margin-bottom: 16px; }
            .contenu { max-width: 100%; }
            .contenu p { text-indent: 2em; margin-bottom: 6px; text-align: justify; }
            .footer { text-align: center; font-size: 8pt; color: #8a7a6a; margin-top: 20px; border-top: 1px solid #d4c9b8; padding-top: 10px; }
            .no-print { display: none; }
            @media print { .no-print { display: none; } }
          </style>
        </head>
        <body>
          <h1>${post.titre || 'Lecture'}</h1>
          <div class="meta">${post.categorie || ''} · Niveau ${post.niveau || 0}</div>
          <div class="contenu">
      `;

      var slides = contenu.split(' | ').filter(function(s) { return s.trim() !== ''; });
      slides.forEach(function(slide) {
        var paras = slide.split('\n').filter(function(p) { return p.trim() !== ''; });
        paras.forEach(function(p) {
          printHtml += '<p>' + p.trim() + '</p>';
        });
      });

      printHtml += `
          </div>
          <div class="footer">Qiraat · Imprimé le ${new Date().toLocaleDateString('fr-FR')}</div>
          <script>
            window.onload = function() { window.print(); }
          <\/script>
        </body>
        </html>
      `;

      var win = window.open('', '_blank', 'width=900,height=700,scrollbars=yes');
      if (!win) {
        alert('Veuillez autoriser les pop-ups pour imprimer.');
        return;
      }
      win.document.write(printHtml);
      win.document.close();
    }

    // ============================================================
    // OUVERTURE MODAL ANNOTATIONS
    // ============================================================
    function ouvrirAnnotations(articleId, titre) {
      var reponse = toutesLesReponses[articleId] || null;
      var annotations = reponse ? reponse.annotations : '';

      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalAnnotations';
      modal.onclick = function(e) {
        if (e.target === this) fermerAnnotations();
      };

      var html = '<div class="modal-contenu">';
      html += '<h3>' + titre + '</h3>';
      html += '<div class="modal-sous-titre">Annotations</div>';

      if (annotations && annotations.trim() !== '') {
        var parts = annotations.split('|');
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split(':');
          if (kv.length === 2) {
            var slideNum = kv[0].replace('slide', '');
            var texte = kv[1];
            html += '<div class="modal-annotation">';
            html += '<strong>Slide ' + slideNum + '</strong>';
            html += texte;
            html += '</div>';
          }
        }
      } else {
        html += '<div class="aucune-annotation">Aucune annotation pour ce texte.</div>';
      }

      html += '<button class="modal-close" onclick="fermerAnnotations()">Fermer</button>';
      html += '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);
    }

    function fermerAnnotations() {
      var modal = document.getElementById('modalAnnotations');
      if (modal) modal.remove();
    }

    // ============================================================
    // EST POST LU ?
    // ============================================================
    function estPostLu(post) {
      var reponse = toutesLesReponses[post.id];
      if (!reponse) {
        for (var key in toutesLesReponses) {
          if (toutesLesReponses[key].titre === post.titre) {
            reponse = toutesLesReponses[key];
            break;
          }
        }
      }
      if (!reponse) return false;
      var bonnes = parseInt(reponse.bonnes) || 0;
      var total = parseInt(reponse.total) || 0;
      if (total === 1 && bonnes === 1) return true;
      if (total > 0 && bonnes >= Math.ceil(total / 2)) return true;
      return false;
    }

    function estPostAccessible(posts, index) {
      if (index === 0) return true;
      var postPrecedent = posts[index - 1];
      return estPostLu(postPrecedent);
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerLivret() {
      var params = new URLSearchParams(window.location.search);
      categorieActuelle = params.get('cat') || '';

      if (!categorieActuelle) {
        document.getElementById('enteteLivret').innerHTML = `
          <div class="vide-lecons" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Aucune catégorie spécifiée</h4>
            <p>Veuillez sélectionner un livret depuis la page d'accueil.</p>
            <a href="/medit/mes-livrets.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid #c4b8a8;border-radius:6px;text-decoration:none;color:#4a4a4a;">Retour aux livrets</a>
          </div>
        `;
        document.getElementById('contenuLecons').innerHTML = '';
        return;
      }

      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      nomEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          postsData = data.posts || [];

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              toutesLesReponses[r.articleId] = r;
            });
          }

          chargerCatalogueDepuisSheet();
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            postsData = cache.posts || [];
            chargerCatalogueDepuisSheet();
          } else {
            document.getElementById('enteteLivret').innerHTML = `
              <div class="vide-lecons" style="margin-top:20px;">
                <span class="icone">⚠</span>
                <h4>Erreur de chargement</h4>
                <p>Vérifiez votre connexion internet.</p>
                <button onclick="location.reload();" style="margin-top:10px;padding:8px 20px;background:transparent;border:1px solid #c4b8a8;border-radius:6px;cursor:pointer;">Réessayer</button>
              </div>
            `;
            document.getElementById('contenuLecons').innerHTML = '';
          }
        });
    }

    // ============================================================
    // CHARGER LE CATALOGUE
    // ============================================================
    function chargerCatalogueDepuisSheet() {
      var url = config.scriptUrl;

      fetch(url + '?action=getCatalogues')
        .then(function(response) { return response.json(); })
        .then(function(resultat) {
          if (resultat.success && resultat.catalogues) {
            cataloguesData = resultat.catalogues;
          } else {
            cataloguesData = [];
          }
          afficherLivret();
        })
        .catch(function() {
          cataloguesData = [];
          afficherLivret();
        });
    }

    // ============================================================
    // AFFICHER LE LIVRET
    // ============================================================
    function afficherLivret() {
      // Trouver le livret correspondant à la catégorie
      var livret = null;
      for (var i = 0; i < cataloguesData.length; i++) {
        if (cataloguesData[i].nom === categorieActuelle) {
          livret = cataloguesData[i];
          break;
        }
      }

      // Si le livret n'est pas dans le catalogue, on le crée à partir des posts
      if (!livret) {
        var postsFiltres = postsData.filter(function(p) {
          return (p.categorie || 'Sans catégorie') === categorieActuelle;
        });
        var lecons = postsFiltres.length;
        livret = {
          nom: categorieActuelle,
          description: 'Ce livret explore les thèmes de ' + categorieActuelle + ' à travers ' + lecons + ' leçons.',
          niveau: lecons > 0 ? postsFiltres[0].niveau || 1 : 1,
          couleur: '#2d6a4f',
          lecons: lecons
        };
      }

      // Vérifier si le livret est accessible (niveau)
      var niveauLivret = livret.niveau || 1;
      if (niveauLivret > niveauEtudiant) {
        document.getElementById('enteteLivret').innerHTML = `
          <div class="vide-lecons" style="margin-top:20px;">
            <span class="icone">◈</span>
            <h4>Livret non accessible</h4>
            <p>Ce livret nécessite le niveau ${niveauLivret}. Votre niveau actuel est ${niveauEtudiant}.</p>
            <a href="/medit/mes-livrets.html" style="display:inline-block;margin-top:12px;padding:8px 20px;background:transparent;border:1px solid #c4b8a8;border-radius:6px;text-decoration:none;color:#4a4a4a;">Retour aux livrets</a>
          </div>
        `;
        document.getElementById('contenuLecons').innerHTML = '';
        return;
      }

      // === AFFICHER L'ENTÊTE ===
      var couleur = livret.couleur || '#2d6a4f';
      var description = livret.description || 'Ce livret explore les thèmes de ' + livret.nom + ' à travers ' + (livret.lecons || 0) + ' leçons.';
      var totalLecons = livret.lecons || 0;

      // Compter les leçons validées
      var validees = 0;
      postsData.forEach(function(post) {
        if ((post.categorie || 'Sans catégorie') === livret.nom) {
          var reponse = toutesLesReponses[post.id];
          if (reponse) {
            var bonnes = parseInt(reponse.bonnes) || 0;
            var total = parseInt(reponse.total) || 0;
            if (total === 1 && bonnes === 1) validees++;
            else if (total > 0 && bonnes >= Math.ceil(total / 2)) validees++;
          }
        }
      });

      var enteteHtml = `
        <div class="entete-livret">
          <div class="couverture-mini" style="background: ${couleur};">
            <span class="niveau-couv">Niveau ${livret.niveau || 1}</span>
            <div class="contenu-couv">
              <span class="titre-couv">${livret.nom}</span>
              <span class="nb-lecons-couv">${totalLecons} leçon${totalLecons > 1 ? 's' : ''}</span>
            </div>
          </div>
          <div class="description-livret">
            <h2>${livret.nom}</h2>
            <div class="sous-titre-desc">${totalLecons} leçon${totalLecons > 1 ? 's' : ''} · ${validees} validée${validees > 1 ? 's' : ''}</div>
            <div class="texte-desc">
              <p>${description}</p>
            </div>
            <div class="stats-livret">
              <span class="stat-item">Leçons totales : <span class="nombre">${totalLecons}</span></span>
              <span class="stat-item">Validées : <span class="nombre">${validees}</span></span>
              <span class="stat-item">Progression : <span class="nombre">${totalLecons > 0 ? Math.round((validees / totalLecons) * 100) : 0}%</span></span>
            </div>
          </div>
        </div>
      `;

      document.getElementById('enteteLivret').innerHTML = enteteHtml;

      // === AFFICHER LES LEÇONS ===
      var postsFiltres = postsData.filter(function(p) {
        return (p.categorie || 'Sans catégorie') === livret.nom;
      });

      postsFiltres.sort(function(a, b) {
        return a.titre.localeCompare(b.titre, 'fr', { sensitivity: 'base' });
      });

      afficherLecons(postsFiltres);
    }

    // ============================================================
    // AFFICHER LES LEÇONS
    // ============================================================
    function afficherLecons(posts) {
      var container = document.getElementById('contenuLecons');

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="vide-lecons">
            <span class="icone">◈</span>
            <h4>Aucune leçon</h4>
            <p>Ce livret ne contient pas encore de leçons.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="section-lecons"><h3>Leçons</h3>';

      for (var i = 0; i < posts.length; i++) {
        var post = posts[i];
        var reponse = toutesLesReponses[post.id];

        if (!reponse) {
          for (var key in toutesLesReponses) {
            if (toutesLesReponses[key].titre === post.titre) {
              reponse = toutesLesReponses[key];
              break;
            }
          }
        }

        var dateValidation = '';
        var retenir = '';
        var estLu = false;
        var estValide = false;

        if (reponse) {
          var bonnes = parseInt(reponse.bonnes) || 0;
          var total = parseInt(reponse.total) || 0;
          dateValidation = reponse.date || '';
          retenir = reponse.retenir || '';

          if (total === 1 && bonnes === 1) {
            estLu = true;
            estValide = true;
          } else if (total > 0 && bonnes >= Math.ceil(total / 2)) {
            estLu = true;
            estValide = true;
          }
        }

        var estAccessible = estPostAccessible(posts, i);
        var estBloque = !estAccessible;

        var hasQuiz = post.hasQuiz || false;
        var hasQuestion = post.hasQuestion || false;
        var mots = post.mots || 0;

        var nbQuestions = 0;
        if (hasQuiz) nbQuestions++;
        if (hasQuestion) nbQuestions++;

        var metaHtml = '';

        if (estLu) {
          var resultatHtml = '';
          var questionHtml = '';
          var annoteHtml = '';

          if (reponse) {
            var bonnes = reponse.bonnes || 0;
            var total = reponse.total || 0;
            if (total > 0) {
              resultatHtml = '<span class="badge-icone">Resultat : ' + bonnes + '/' + total + '</span>';
            }

            var reponseOuverte = reponse.reponseOuverte || '';
            if (reponseOuverte && reponseOuverte.trim() !== '') {
              questionHtml = '<span class="badge-icone">Question envoyee</span>';
            } else if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyee</span>';
            }

            var annotations = reponse.annotations || '';
            if (annotations && annotations.trim() !== '') {
              annoteHtml = '<span class="badge-icone clickable" onclick="event.stopPropagation(); ouvrirAnnotations(\'' + post.id + '\', \'' + post.titre.replace(/'/g, "\\'") + '\');">Annote</span>';
            } else {
              annoteHtml = '<span class="badge-icone">Non annote</span>';
            }
          } else {
            resultatHtml = '<span class="badge-icone">Resultat : 0/0</span>';
            if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyee</span>';
            }
            annoteHtml = '<span class="badge-icone">Non annote</span>';
          }

          metaHtml = resultatHtml + questionHtml + annoteHtml;
        } else {
          metaHtml = '<span class="badge-icone">Nbr questions : ' + nbQuestions + '</span>';
        }

        var dateHtml = '';
        var dateLabelHtml = '';

        if (estLu && dateValidation) {
          var d = new Date(dateValidation);
          if (!isNaN(d.getTime())) {
            var dateStr = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
            var heureStr = d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
            dateLabelHtml = '<span class="date-label">Fait :</span>';
            dateHtml = '<span class="date-validation">' + dateStr + ' a ' + heureStr + '</span>';
          }
        }

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre">
              <strong>A retenir</strong>
              ${retenir}
            </div>
          `;
        }

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

        var imprimerHtml = '';
        if (!estBloque && estLu) {
          imprimerHtml = `
            <div class="btn-wrap">
              <button class="btn-imprimer" onclick="event.stopPropagation(); imprimerArticle('${post.id}', '${post.titre.replace(/'/g, "\\'")}')">
                Imprimer la page
              </button>
            </div>
          `;
        }

        var carteClass = 'carte-post';
        var iconeCadenas = '';
        var onClickAttr = '';

        if (estBloque) {
          carteClass += ' bloque';
          iconeCadenas = '🔒 ';
          onClickAttr = 'onclick="alert(\'Vous devez d\'abord valider la lecon precedente.\');"';
        } else {
          onClickAttr = 'onclick="window.location.href=\'/medit/article.html?id=' + post.id + '\'"';
        }

        html += `
          <div class="${carteClass}" ${onClickAttr}>
            <div class="infos">
              <div class="titre">${iconeCadenas}${post.titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${post.niveau}</span>
                ${metaHtml}
                ${motsHtml}
                ${retenirHtml}
              </div>
            </div>
            <div class="statut">
              ${dateLabelHtml}
              ${dateHtml}
            </div>
            ${imprimerHtml}
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
      chargerLivret();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
