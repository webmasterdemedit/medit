<!-- tags.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Tous les tags - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-tags {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-tags h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-tags .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .grille-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Carte tag : colonne pour empiler contenu + barre de progression en bas */
    .carte-tag {
      display: flex;
      flex-direction: column;
      padding: 10px 16px 0;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    .carte-tag:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-tag .tag-contenu {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
    }

    .carte-tag .tag-diese {
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .carte-tag .tag-nom {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .carte-tag .tag-compteur {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* Barre de progression horizontale en bas de la carte */
    .carte-tag .tag-progression {
      width: 100%;
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
      margin: 0 -16px;
      width: calc(100% + 32px);
    }

    .carte-tag .tag-progression .progression-remplissage {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--text);
    }

    .vide-tags {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-tags .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-tags { padding: 12px 16px 30px; }
      .page-tags h1 { font-size: 22px; }
      .carte-tag { padding: 8px 12px 0; gap: 0; }
      .carte-tag .tag-contenu { gap: 8px; padding-bottom: 8px; }
      .carte-tag .tag-nom { font-size: 14px; }
      .carte-tag .tag-progression { margin: 0 -12px; width: calc(100% + 24px); }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-tags">

    <h1>Tous les tags</h1>
    <p class="sous-titre-page">Parcourez les textes par mot-clé. Cliquez sur un tag pour voir les textes associés.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Tags distincts :</span>
        <span class="nombre" id="totalTags">0</span>
      </div>
      <div class="stat-item">
        <span>Textes tagués :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des tags...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var etatValidation = {};

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normaliserTag(t) {
      return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function estTexteValide(texteId) {
      var e = etatValidation[String(texteId)];
      return e && e.valide;
    }

    function chargerTags() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(resultats) {
        var data = resultats[0];
        var tentatives = resultats[1];

        var textes = data.tousLesTextes || data.textes || [];

        etatValidation = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          var pct = t.pourcentage || 0;
          if (!etatValidation[k] || pct > etatValidation[k].pourcentage) {
            etatValidation[k] = {
              valide: pct >= 65,
              pourcentage: pct
            };
          }
        });

        afficherTags(textes);
      }).catch(function(error) {
        console.error('Erreur chargement:', error);
        var cache = DataManager.getCacheForce(id);
        if (cache) {
          afficherTags(cache.tousLesTextes || cache.textes || []);
        } else {
          var loader = document.getElementById('loader');
          if (loader) loader.style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide-tags">
              <span class="icone">⚠</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion internet.</p>
            </div>
          `;
        }
      });
    }

    function afficherTags(textes) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      // Pour chaque tag : nombre de textes + liste des textes (pour calculer le %)
      var map = {};
      var nbTextesTagues = 0;

      textes.forEach(function(t) {
        var tags = t.tags || [];
        if (tags.length > 0) nbTextesTagues++;
        tags.forEach(function(tag) {
          var brut = String(tag).trim();
          if (brut === '') return;
          var cle = normaliserTag(brut);
          if (!map[cle]) {
            map[cle] = { label: brut, textes: [] };
          }
          map[cle].textes.push(t);
        });
      });

      var liste = Object.keys(map).map(function(k) {
        var item = map[k];
        var total = item.textes.length;
        var valides = 0;
        item.textes.forEach(function(t) {
          if (estTexteValide(t.id)) valides++;
        });
        var pct = total > 0 ? Math.round((valides / total) * 100) : 0;
        return {
          label: item.label,
          count: total,
          pourcentage: pct
        };
      });

      liste.sort(function(a, b) {
        return a.label.localeCompare(b.label, 'fr', { sensitivity: 'base' });
      });

      document.getElementById('totalTags').textContent = liste.length;
      document.getElementById('totalTextes').textContent = nbTextesTagues;

      var container = document.getElementById('contenu');

      if (liste.length === 0) {
        container.innerHTML = `
          <div class="vide-tags">
            <span class="icone">◈</span>
            <h2>Aucun tag disponible</h2>
          </div>
        `;
        return;
      }

      var html = '<div class="grille-tags">';
      liste.forEach(function(item) {
        html += '<a class="carte-tag" href="/medit/tag.html?tag=' + encodeURIComponent(item.label) + '">';
        html += '  <span class="tag-contenu">';
        html += '    <span class="tag-diese">#</span>';
        html += '    <span class="tag-nom">' + escapeHtml(item.label) + '</span>';
        html += '    <span class="tag-compteur">' + item.count + ' texte' + (item.count > 1 ? 's' : '') + '</span>';
        html += '  </span>';
        html += '  <div class="tag-progression">';
        html += '    <div class="progression-remplissage" style="width:' + item.pourcentage + '%;"></div>';
        html += '  </div>';
        html += '</a>';
      });
      html += '</div>';

      container.innerHTML = html;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerTags);
    } else {
      chargerTags();
    }
  </script>

</body>
</html>
