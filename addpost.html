<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajouter un texte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>+</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <link rel="stylesheet" href="/medit/article.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f3f0e9;
      overflow-y: auto; /* ← AJOUTÉ */
    }
    a { text-decoration: none; color: inherit; }

    .page-ajout { max-width: 900px; margin: 30px auto; padding: 0 20px 40px; width: 100%; flex: 1; }
    .page-ajout h1 { font-size: 28px; font-weight: 400; font-family: 'Georgia', serif; margin-bottom: 4px; color: #2c2c2c; }
    .page-ajout .sous-titre { font-size: 15px; color: #6b7a8a; margin-bottom: 20px; font-style: italic; }

    .carte-ajout { background: #f3f0e9; border-radius: 4px; padding: 28px 32px; border: 1px solid #d1ccc4; margin-bottom: 20px; }

    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 150px; }

    label { display: block; font-size: 13px; color: #6b7a8a; margin-top: 14px; margin-bottom: 4px; font-weight: 500; }
    label:first-of-type { margin-top: 0; }

    input[type="text"], input[type="number"], input[type="date"], textarea, select {
      width: 100%; padding: 10px 14px; border: 1px solid #d1ccc4; border-radius: 6px;
      font-size: 14px; font-family: 'Segoe UI', sans-serif; background: #faf8f5; color: #2c2c2c; box-sizing: border-box;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #b8b0a8; }
    textarea { resize: vertical; min-height: 80px; }

    .slides-preview { margin: 16px 0 8px; }
    .slides-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slide-card { background: #f3f0e9; border: 1px solid #d1ccc4; border-radius: 4px; padding: 14px 16px; position: relative; }
    .slide-card .slide-num { font-size: 11px; color: #6b7a8a; font-weight: 500; letter-spacing: 0.5px; margin-bottom: 4px; }
    .slide-card textarea { width: 100%; border: none; background: transparent; font-family: 'Georgia', serif; font-size: 15px; color: #2c2c2c; resize: vertical; min-height: 60px; padding: 4px 0; line-height: 1.6; }
    .slide-card textarea:focus { outline: none; background: rgba(0,0,0,0.02); border-radius: 4px; }
    .slide-card .slide-type { font-size: 10px; color: #6b7a8a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .slide-card .btn-del-slide { position: absolute; top: 6px; right: 8px; background: transparent; border: none; color: #6b7a8a; cursor: pointer; font-size: 16px; }
    .slide-card .btn-del-slide:hover { color: #2c2c2c; }

    .btn-add-slide { margin-top: 12px; padding: 8px 20px; background: transparent; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 13px; cursor: pointer; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; }
    .btn-add-slide:hover { background: #e8e5e0; color: #2c2c2c; }

    .quiz-block { background: rgba(0,0,0,0.02); border: 1px solid #d1ccc4; border-radius: 6px; padding: 14px; margin-top: 10px; }
    .quiz-question { border-bottom: 1px solid #e8e5e0; padding-bottom: 12px; margin-bottom: 12px; }
    .quiz-question:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .quiz-question .q-titre { font-weight: 500; color: #2c2c2c; font-size: 14px; margin-bottom: 4px; }

    .quiz-reponses { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .quiz-reponse { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #2c2c2c; }
    .quiz-reponse input[type="text"] { flex: 1; padding: 6px 10px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 13px; background: #faf8f5; }

    .vf-group { display: flex; gap: 4px; flex-shrink: 0; }
    .vf-btn { padding: 3px 14px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; background: #faf8f5; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; }
    .vf-btn.active { background: #2c2c2c; color: #f3f0e9; border-color: #2c2c2c; }
    .vf-btn:hover { background: #e8e5e0; }

    .btn-add { padding: 4px 14px; background: transparent; border: 1px solid #d1ccc4; border-radius: 30px; font-size: 12px; cursor: pointer; color: #6b7a8a; font-family: 'Segoe UI', sans-serif; margin-top: 4px; }
    .btn-add:hover { background: #e8e5e0; color: #2c2c2c; }

    .retenir-champs { display: flex; gap: 10px; flex-wrap: wrap; }
    .retenir-champs input { flex: 1; min-width: 80px; padding: 8px 12px; border: 1px solid #d1ccc4; border-radius: 4px; font-size: 14px; background: #faf8f5; }

    .btn-groupe { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn-groupe .btn { padding: 10px 28px; border-radius: 30px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'Segoe UI', sans-serif; border: 1px solid #d1ccc4; background: transparent; color: #2c2c2c; }
    .btn-groupe .btn:hover { background: #e8e5e0; }
    .btn-groupe .btn-annuler { color: #6b7a8a; text-decoration: none; }
    .btn-groupe .btn-brouillon { color: #6b7a8a; }
    .btn-groupe .btn-brouillon.active { background: #2c2c2c; color: #f3f0e9; border-color: #2c2c2c; }

    .message { margin-top: 14px; font-size: 14px; text-align: center; padding: 10px 16px; border-radius: 4px; display: none; }
    .message.success { display: block; color: #2c2c2c; background: #e8e5e0; }
    .message.error { display: block; color: #6b7a8a; background: #f5f0eb; }

    @media (max-width: 640px) {
      .page-ajout { padding: 0 12px 20px; margin: 16px auto; }
      .carte-ajout { padding: 16px; }
      .row { flex-direction: column; gap: 0; }
      .slides-grid { grid-template-columns: 1fr; }
      .btn-groupe { flex-direction: column; align-items: stretch; }
      .btn-groupe .btn { text-align: center; }
      .retenir-champs { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(r => r.text())
      .then(data => { document.getElementById('header-container').innerHTML = data;
        if (typeof mettreAJourHeader === 'function') mettreAJourHeader(); })
      .catch(e => console.error(e));
  </script>

  <div class="page-ajout">
    <h1>Ajouter un texte</h1>
    <p class="sous-titre">Remplissez les champs ci-dessous.</p>

    <div class="carte-ajout">
      <form id="formAjoutPost" onsubmit="return false;">

        <label>Date</label>
        <input type="date" id="inputDate">

        <label>Titre *</label>
        <input type="text" id="inputTitre" placeholder="Titre du texte">

        <div class="row">
          <div>
            <label>Niveau *</label>
            <select id="inputNiveau">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option><option value="11">11</option><option value="12">12</option>
            </select>
          </div>
          <div>
            <label>Catégorie</label>
            <select id="inputCategorie">
              <option value="Foi">Foi</option>
              <option value="Rappels divers">Rappels divers</option>
              <option value="Sourate">Sourate</option>
              <option value="Hadith">Hadith</option>
              <option value="Méditation">Méditation</option>
              <option value="Invocation">Invocation</option>
              <option value="Histoire">Histoire</option>
              <option value="Morale">Morale</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
        </div>

        <!-- ============================================================
             APERÇU DES SLIDES
             ============================================================ -->
        <label>Slides (aperçu)</label>
        <div class="slides-preview">
          <div class="slides-grid" id="slidesGrid"></div>
          <button type="button" class="btn-add-slide" onclick="ajouterSlide()">+ Ajouter une slide</button>
        </div>

        <!-- ============================================================
             QUIZ / QCM
             ============================================================ -->
        <label>Quiz / QCM</label>
        <div id="quizContainer">
          <div class="quiz-block" id="quizBlock"></div>
          <button type="button" class="btn-add" onclick="ajouterQuestion()">+ Ajouter une question</button>
        </div>

        <!-- ============================================================
             QUESTIONS OUVERTES
             ============================================================ -->
        <label>Questions ouvertes</label>
        <div id="openQuestionsContainer">
          <div class="open-question-item" style="margin-bottom:6px;">
            <input type="text" class="open-question-input" placeholder="Question ouverte..." style="width:100%;padding:10px 14px;border:1px solid #d1ccc4;border-radius:6px;font-size:14px;background:#faf8f5;color:#2c2c2c;">
          </div>
        </div>
        <button type="button" class="btn-add" onclick="ajouterQuestionOuverte()">+ Ajouter une question ouverte</button>

        <!-- ============================================================
             À RETENIR
             ============================================================ -->
        <label>À retenir</label>
        <div class="retenir-champs">
          <input type="text" id="retenir1" placeholder="Mot 1">
          <input type="text" id="retenir2" placeholder="Mot 2">
          <input type="text" id="retenir3" placeholder="Mot 3">
        </div>

        <!-- ============================================================
             INFORMATIONS RELATIVES
             ============================================================ -->
        <label>Informations relatives</label>
        <textarea id="inputInfos" rows="2" placeholder="Références, notes..."></textarea>

        <!-- ============================================================
             BOUTONS
             ============================================================ -->
        <div class="btn-groupe">
          <button type="button" onclick="enregistrerPost()" class="btn">Créer</button>
          <a href="/medit/mes-textes.html" class="btn btn-annuler">Annuler</a>
          <button type="button" onclick="toggleBrouillon()" class="btn btn-brouillon" id="btnBrouillon">Brouillon</button>
        </div>

        <div id="messageAjout" class="message"></div>

      </form>
    </div>
  </div>

  <div id="footer-container"></div>
  <script>
    fetch('/medit/footer.html')
      .then(r => r.text())
      .then(data => { document.getElementById('footer-container').innerHTML = data; })
      .catch(e => console.error(e));
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // DATE AUTO
    // ============================================================
    var today = new Date();
    var y = today.getFullYear();
    var m = String(today.getMonth() + 1).padStart(2, '0');
    var d = String(today.getDate()).padStart(2, '0');
    document.getElementById('inputDate').value = y + '-' + m + '-' + d;

    // ============================================================
    // BROUILLON
    // ============================================================
    var estBrouillon = false;
    function toggleBrouillon() {
      estBrouillon = !estBrouillon;
      var btn = document.getElementById('btnBrouillon');
      btn.classList.toggle('active');
      btn.textContent = estBrouillon ? '✓ Brouillon' : 'Brouillon';
    }

    // ============================================================
    // SLIDES
    // ============================================================
    var slideCount = 0;

    function ajouterSlide(contenu, type) {
      slideCount++;
      var grid = document.getElementById('slidesGrid');
      var div = document.createElement('div');
      div.className = 'slide-card';
      div.id = 'slide-' + slideCount;
      div.innerHTML = `
        <div class="slide-num">Slide ${slideCount}</div>
        <textarea class="slide-content" placeholder="Contenu de la slide..." rows="3">${contenu || ''}</textarea>
        <div class="slide-type">${type || 'texte'}</div>
        <button type="button" class="btn-del-slide" onclick="supprimerSlide('slide-${slideCount}')">✕</button>
      `;
      grid.appendChild(div);
    }

    function supprimerSlide(id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    }

    // ============================================================
    // QUIZ
    // ============================================================
    var questionCount = 0;

    function ajouterQuestion() {
      questionCount++;
      var container = document.getElementById('quizBlock');
      var div = document.createElement('div');
      div.className = 'quiz-question';
      div.id = 'q-' + questionCount;
      div.innerHTML = `
        <div class="q-titre">Question ${questionCount}</div>
        <input type="text" class="q-text" placeholder="Votre question..." style="width:100%;padding:8px 12px;border:1px solid #d1ccc4;border-radius:4px;font-size:14px;background:#faf8f5;color:#2c2c2c;margin-bottom:4px;">
        <div class="quiz-reponses" id="reponses-${questionCount}">
          <div class="quiz-reponse">
            <input type="text" class="r-text" placeholder="Réponse A" style="width:100%;">
            <div class="vf-group">
              <button type="button" class="vf-btn active" onclick="setVraiFaux(this, true)">Vrai</button>
              <button type="button" class="vf-btn" onclick="setVraiFaux(this, false)">Faux</button>
            </div>
          </div>
          <div class="quiz-reponse">
            <input type="text" class="r-text" placeholder="Réponse B" style="width:100%;">
            <div class="vf-group">
              <button type="button" class="vf-btn" onclick="setVraiFaux(this, true)">Vrai</button>
              <button type="button" class="vf-btn active" onclick="setVraiFaux(this, false)">Faux</button>
            </div>
          </div>
        </div>
        <button type="button" class="btn-add" onclick="ajouterReponse(${questionCount})" style="font-size:12px;padding:4px 12px;margin-top:2px;">+ Ajouter une réponse</button>
        <button type="button" onclick="supprimerQuestion(${questionCount})" style="font-size:12px;padding:4px 12px;background:transparent;border:none;color:#6b7a8a;cursor:pointer;">✕ Supprimer</button>
      `;
      container.appendChild(div);
    }

    function setVraiFaux(btn, estVrai) {
      var group = btn.parentElement;
      group.querySelectorAll('.vf-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }

    function ajouterReponse(qId) {
      var container = document.getElementById('reponses-' + qId);
      var count = container.children.length;
      var lettre = String.fromCharCode(65 + count);
      var div = document.createElement('div');
      div.className = 'quiz-reponse';
      div.innerHTML = `
        <input type="text" class="r-text" placeholder="Réponse ${lettre}" style="width:100%;">
        <div class="vf-group">
          <button type="button" class="vf-btn" onclick="setVraiFaux(this, true)">Vrai</button>
          <button type="button" class="vf-btn active" onclick="setVraiFaux(this, false)">Faux</button>
        </div>
        <button type="button" onclick="this.parentElement.remove()" style="background:transparent;border:none;color:#6b7a8a;cursor:pointer;">✕</button>
      `;
      container.appendChild(div);
    }

    function supprimerQuestion(qId) {
      var el = document.getElementById('q-' + qId);
      if (el) el.remove();
    }

    // ============================================================
    // QUESTIONS OUVERTES
    // ============================================================
    function ajouterQuestionOuverte() {
      var container = document.getElementById('openQuestionsContainer');
      var div = document.createElement('div');
      div.className = 'open-question-item';
      div.style.marginBottom = '6px';
      div.innerHTML = `
        <input type="text" class="open-question-input" placeholder="Question ouverte..." style="width:100%;padding:10px 14px;border:1px solid #d1ccc4;border-radius:6px;font-size:14px;background:#faf8f5;color:#2c2c2c;">
        <button type="button" onclick="this.parentElement.remove()" style="font-size:12px;padding:2px 10px;background:transparent;border:none;color:#6b7a8a;cursor:pointer;">✕ Supprimer</button>
      `;
      container.appendChild(div);
    }

    // ============================================================
    // INIT
    // ============================================================
    window.addEventListener('DOMContentLoaded', function() {
      ajouterSlide('', 'texte');
      ajouterQuestion();
    });

    // ============================================================
    // ENREGISTRER
    // ============================================================
    function enregistrerPost() {
      var titre = document.getElementById('inputTitre').value.trim();
      var niveau = document.getElementById('inputNiveau').value;
      var categorie = document.getElementById('inputCategorie').value;
      var infos = document.getElementById('inputInfos').value.trim();
      var date = document.getElementById('inputDate').value;
      var statut = estBrouillon ? 'brouillon' : 'publie';
      var msg = document.getElementById('messageAjout');

      // Récupérer les slides
      var slides = [];
      document.querySelectorAll('.slide-card').forEach(function(el) {
        var content = el.querySelector('.slide-content').value.trim();
        if (content) slides.push(content);
      });

      // Récupérer les 3 mots à retenir
      var r1 = document.getElementById('retenir1').value.trim();
      var r2 = document.getElementById('retenir2').value.trim();
      var r3 = document.getElementById('retenir3').value.trim();
      var retenir = [r1, r2, r3].filter(function(m) { return m.length > 0; }).join(', ');

      // Récupérer les questions ouvertes
      var openQuestions = [];
      document.querySelectorAll('.open-question-input').forEach(function(el) {
        var val = el.value.trim();
        if (val) openQuestions.push(val);
      });

      // Récupérer les quiz
      var quizParts = [];
      document.querySelectorAll('.quiz-question').forEach(function(qEl) {
        var qText = qEl.querySelector('.q-text').value.trim();
        if (!qText) return;

        var reponses = [];
        qEl.querySelectorAll('.quiz-reponse').forEach(function(rEl) {
          var rText = rEl.querySelector('.r-text').value.trim();
          if (!rText) return;
          var group = rEl.querySelector('.vf-group');
          var estVraie = false;
          group.querySelectorAll('.vf-btn').forEach(function(b) {
            if (b.classList.contains('active') && b.textContent.trim() === 'Vrai') {
              estVraie = true;
            }
          });
          reponses.push({ texte: rText, correct: estVraie });
        });

        if (reponses.length === 0) return;
        var vraies = reponses.filter(function(r) { return r.correct; });
        if (vraies.length === 0) { reponses[0].correct = true; }

        quizParts.push({ question: qText, reponses: reponses });
      });

      // Construction du contenu final
      var contenuFinal = slides.join('\n\n');

      quizParts.forEach(function(q) {
        contenuFinal += '\n\nQ: ' + q.question;
        q.reponses.forEach(function(r) {
          contenuFinal += '\n' + (r.correct ? 'RV: ' : 'RF: ') + r.texte;
        });
      });

      openQuestions.forEach(function(q) {
        contenuFinal += '\n\nQQ: ' + q;
      });

      if (retenir) {
        contenuFinal += '\n\nM: ' + retenir;
      }

      if (infos) {
        contenuFinal += '\n\nINFOS: ' + infos;
      }

      if (!titre) { afficherMsg('Veuillez saisir un titre', 'error'); return; }
      if (slides.length === 0) { afficherMsg('Veuillez ajouter au moins une slide', 'error'); return; }

      var btn = document.querySelector('.btn-groupe .btn:first-child');
      btn.textContent = 'Enregistrement...';
      btn.disabled = true;
      msg.className = 'message';
      msg.style.display = 'none';

      DataManager.ajouterPost(titre, parseInt(niveau), categorie, contenuFinal, '')
        .then(function() {
          afficherMsg('✅ Post créé avec succès !', 'success');
          btn.textContent = 'Créer';
          btn.disabled = false;
          document.getElementById('formAjoutPost').reset();
          document.getElementById('inputInfos').value = '';
          document.getElementById('retenir1').value = '';
          document.getElementById('retenir2').value = '';
          document.getElementById('retenir3').value = '';
          document.getElementById('btnBrouillon').classList.remove('active');
          document.getElementById('btnBrouillon').textContent = 'Brouillon';
          estBrouillon = false;
          document.getElementById('slidesGrid').innerHTML = '';
          slideCount = 0;
          ajouterSlide('', 'texte');
          document.getElementById('quizBlock').innerHTML = '';
          questionCount = 0;
          ajouterQuestion();
          document.getElementById('openQuestionsContainer').innerHTML = `
            <div class="open-question-item" style="margin-bottom:6px;">
              <input type="text" class="open-question-input" placeholder="Question ouverte..." style="width:100%;padding:10px 14px;border:1px solid #d1ccc4;border-radius:6px;font-size:14px;background:#faf8f5;color:#2c2c2c;">
            </div>
          `;
          document.getElementById('inputTitre').focus();
          document.getElementById('inputDate').value = y + '-' + m + '-' + d;
        })
        .catch(function(err) {
          afficherMsg('❌ Erreur : ' + err.message, 'error');
          btn.textContent = 'Créer';
          btn.disabled = false;
        });
    }

    function afficherMsg(texte, type) {
      var msg = document.getElementById('messageAjout');
      msg.textContent = texte;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }
  </script>

</body>
</html>
