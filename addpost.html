<!-- ============================================================
   MODAL AJOUTER UN POST - Fichier séparé
   ============================================================ -->

<style>
/* ============================================================
   MODAL AJOUT POST - STRUCTURE UNIQUEMENT
   Les couleurs sont dans lecture-mode.css
   ============================================================ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-contenu.ajout-post {
  max-width: 600px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 32px 36px;
  font-family: 'Segoe UI', sans-serif;
}

.modal-contenu.ajout-post h3 {
  font-size: 22px;
  margin-bottom: 4px;
  font-family: 'Georgia', serif;
}

.modal-contenu.ajout-post .modal-sous-titre {
  font-size: 13px;
  margin-bottom: 16px;
  padding-bottom: 12px;
}

.modal-contenu.ajout-post label {
  display: block;
  font-size: 13px;
  margin-top: 12px;
  margin-bottom: 4px;
  font-weight: 500;
}

.modal-contenu.ajout-post input,
.modal-contenu.ajout-post textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Segoe UI', sans-serif;
  box-sizing: border-box;
}

.modal-contenu.ajout-post input:focus,
.modal-contenu.ajout-post textarea:focus {
  outline: none;
}

.modal-contenu.ajout-post .btn-submit {
  padding: 10px 28px;
  border: none;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
}

.modal-contenu.ajout-post .btn-retour {
  padding: 10px 28px;
  border-radius: 30px;
  font-size: 14px;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
}
</style>

<!-- ============================================================
   MODAL AJOUTER UN POST
   ============================================================ -->
<div id="modalAjoutPost" class="modal-overlay" style="display:none;">
  <div class="modal-contenu ajout-post">
    <h3>Ajouter un texte</h3>
    <div class="modal-sous-titre">Remplissez les champs ci-dessous</div>

    <form id="formAjoutPost" onsubmit="return false;">
      <label>Titre *</label>
      <input type="text" id="inputTitre" placeholder="Titre du texte" required>

      <label>Niveau *</label>
      <input type="number" id="inputNiveau" placeholder="1" min="1" max="10" required>

      <label>Catégorie</label>
      <input type="text" id="inputCategorie" placeholder="Ex: Sourate, Hadith, Méditation...">

      <label>Contenu *</label>
      <textarea id="inputContenu" rows="8" placeholder="Le texte de la méditation..." required></textarea>

      <label>Question</label>
      <textarea id="inputQuestion" rows="3" placeholder="Question ouverte (optionnel)"></textarea>

      <div style="display:flex;gap:12px;margin-top:16px;">
        <button type="button" onclick="creerPost()" class="btn-submit">Créer</button>
        <button type="button" onclick="fermerAjoutPost()" class="btn-retour">Annuler</button>
      </div>
    </form>
  </div>
</div>

<script>
// ============================================================
// AJOUTER UN POST - OUVERTURE/FERMETURE
// ============================================================

function ouvrirAjoutPost() {
  var modal = document.getElementById('modalAjoutPost');
  if (modal) {
    modal.style.display = 'flex';
    document.getElementById('inputTitre').value = '';
    document.getElementById('inputNiveau').value = '';
    document.getElementById('inputCategorie').value = '';
    document.getElementById('inputContenu').value = '';
    document.getElementById('inputQuestion').value = '';
    document.getElementById('inputTitre').focus();
  }
}

function fermerAjoutPost() {
  var modal = document.getElementById('modalAjoutPost');
  if (modal) {
    modal.style.display = 'none';
  }
}

function creerPost() {
  var titre = document.getElementById('inputTitre').value.trim();
  var niveau = document.getElementById('inputNiveau').value.trim();
  var categorie = document.getElementById('inputCategorie').value.trim();
  var contenu = document.getElementById('inputContenu').value.trim();
  var question = document.getElementById('inputQuestion').value.trim();

  if (!titre) { alert('Veuillez saisir un titre'); return; }
  if (!niveau) { alert('Veuillez saisir un niveau'); return; }
  if (!contenu) { alert('Veuillez saisir le contenu'); return; }

  var btn = document.querySelector('#formAjoutPost .btn-submit');
  btn.textContent = 'Création...';
  btn.disabled = true;

  DataManager.ajouterPost(titre, parseInt(niveau), categorie, contenu, question)
    .then(function() {
      alert('Post créé avec succès !');
      fermerAjoutPost();
      btn.textContent = 'Créer';
      btn.disabled = false;
      if (window.location.pathname.includes('mes-textes.html')) {
        window.location.reload();
      }
    })
    .catch(function(err) {
      alert('Erreur : ' + err.message);
      btn.textContent = 'Créer';
      btn.disabled = false;
    });
}
</script>
