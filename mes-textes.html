  <link rel="stylesheet" href="/medit/theme.css" />
  <style>

  <script>

  xhr.open('GET', '/medit/header.html', false);
  xhr.send();

</script>
</head>
<body>

  <div class="page">

    <h1>Mes textes</h1>
    <p class="sous-titre-page">Retrouvez ici toutes les méditations à lire et celles que vous avez déjà validées.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Textes disponibles :</span>
        <span class="nombre" id="totalPosts">0</span>
      </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Vos textes vont s'afficher ici dans un instant...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var toutesLesReponses = {};
    var postsData = [];
    var niveauEtudiant = 0;
    var categorieActuelle = 'toutes';

    function getCategorieFromURL() {
      var params = new URLSearchParams(window.location.search);
      var cat = params.get('cat');
      return cat || 'toutes';
    }

    function mettreAJourURL(categorie) {
      var newUrl = window.location.pathname + '?cat=' + encodeURIComponent(categorie);
      history.pushState({ categorie: categorie }, '', newUrl);
    }

    window.addEventListener('popstate', function(event) {
      if (event.state && event.state.categorie) {
        var categorie = event.state.categorie;
        categorieActuelle = categorie;
        mettreAJourOngletsActifs(categorie);
        var postsFiltres = filtrerPosts(categorie);
        afficherPosts(postsFiltres);
      }
    });

    function mettreAJourOngletsActifs(categorie) {
      document.querySelectorAll('.tab-btn').forEach(function(el) {
        el.classList.remove('active');
        if (el.dataset.cat === categorie) {
          el.classList.add('active');
        }
      });
    }

    // ============================================================
    // FONCTIONS D'IMPRESSION - STYLE LISEUSE ÉLÉGANT
    // ============================================================
    function imprimerArticle(articleId, titre) {
      var url = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';
      
      fetch(url + '?action=getPost&id=' + encodeURIComponent(articleId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success || !data.post) {
            alert('Impossible de charger le contenu.');
            return;
          }
          var post = data.post;
          var contenu = post.contenu || '';
          genererImpression(post, contenu);
        })
        .catch(function(error) {
          alert('Erreur : ' + error.message);
        });
    }

    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
      
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) {
            quizs.push(currentQuiz);
          }
          currentQuiz = {
            question: ligne.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          if (texteRep) {
            currentQuiz.reponses.push({ 
              texte: texteRep || 'Réponse', 
              lettre: lettres[currentQuiz.reponses.length] || '?'
            });
          }
        }
      }
      
      if (currentQuiz && currentQuiz.reponses.length > 0) {
        quizs.push(currentQuiz);
      }
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      for (var i = 0; i < lignes.length; i++) {
        var match = lignes[i].match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push(match[2]);
        }
      }
      return elements;
    }

    function parserCartePourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var recto = '', verso = '';
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          recto = l.replace(/^r:\s*/i, '').trim();
        } else if (l.toLowerCase().startsWith('v:')) {
          verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (!recto) return null;
      return { recto: recto, verso: verso };
    }

    function genererImpression(post, contenu) {
      var parts = contenu.split(' | ');
      
      var slidesArray = [];
      var quiz = '';
      var openQuestion = '';
      var ordre = '';
      var carte = '';
      var retenir = '';
      
      parts.forEach(function(part) {
        part = part.trim();
        if (part.startsWith('q:')) {
          quiz = part;
        } else if (part.startsWith('qs:')) {
          openQuestion = part;
        } else if (part.startsWith('o:')) {
          ordre = part;
        } else if (part.startsWith('r:')) {
          carte = part;
        } else if (part.startsWith('#')) {
          retenir = part;
        } else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) {
              slidesArray.push(sub.trim());
            });
          }
        }
      });

      // Date de création du post
      var dateCreation = post.date || '';
      var dateCreationStr = '';
      if (dateCreation) {
        var d = new Date(dateCreation);
        if (!isNaN(d.getTime())) {
          dateCreationStr = d.toLocaleDateString('fr-FR', {
            day: '2-digit', month: 'long', year: 'numeric'
          });
        }
      }

      // Date d'impression
      var dateImpression = new Date();
      var dateImpressionStr = dateImpression.toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
      var heureImpressionStr = dateImpression.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });

      var printHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>${post.titre || 'Lecture'}</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            @page {
              margin: 2.5cm 2.5cm 2cm 2.5cm;
              size: A4;
            }
            body {
              font-family: 'Georgia', 'Times New Roman', Times, serif;
              background: #faf8f5;
              color: #1a1a1a;
              font-size: 11.5pt;
              line-height: 1.8;
            }
            .page {
              max-width: 100%;
              min-height: 100vh;
              display: flex;
              flex-direction: column;
              background: #faf8f5;
            }
            
            /* ===== EN-TÊTE LISEUSE ===== */
            .header-liseuse {
              text-align: center;
              padding-bottom: 14px;
              margin-bottom: 18px;
              border-bottom: 1px solid #d4c9b8;
              position: relative;
            }
            .header-liseuse .categorie {
              font-size: 9pt;
              text-transform: uppercase;
              letter-spacing: 3px;
              color: #8a7a6a;
              font-weight: 400;
              margin-bottom: 2px;
            }
            .header-liseuse .categorie .niveau {
              font-size: 8.5pt;
              letter-spacing: 1.5px;
              color: #a89888;
            }
            .header-liseuse h1 {
              font-size: 17pt;
              font-weight: 700;
              letter-spacing: 0.3px;
              color: #1a1a1a;
              margin-bottom: 2px;
              font-family: 'Georgia', 'Times New Roman', Times, serif;
            }
            .header-liseuse .meta-ligne {
              font-size: 9pt;
              color: #8a7a6a;
              letter-spacing: 0.5px;
            }
            .header-liseuse .meta-ligne span {
              margin: 0 4px;
            }
            .header-liseuse .meta-ligne .sep {
              color: #c4b8a8;
            }
            
            /* ===== ZONE DE LECTURE ===== */
            .zone-lecture {
              flex: 1;
              padding: 4px 0;
            }
            .slide {
              margin-bottom: 10px;
            }
            .slide p {
              font-size: 12.5pt;
              margin-bottom: 6px;
              text-align: justify;
              text-indent: 2em;
              color: #1a1a1a;
            }
            .slide p:first-of-type {
              text-indent: 0;
            }
            
            /* ===== ZONE EXERCICES ===== */
            .zone-exercices {
              margin-top: 16px;
              padding-top: 14px;
              border-top: 1px solid #d4c9b8;
              font-size: 10pt;
              line-height: 1.6;
              color: #2a2a2a;
            }
            .zone-exercices .titre-exo {
              font-weight: 600;
              font-size: 9.5pt;
              text-transform: uppercase;
              letter-spacing: 1.5px;
              color: #5a4a3a;
              margin-bottom: 4px;
            }
            .exo-quiz {
              margin-bottom: 5px;
              padding-left: 2px;
            }
            .exo-quiz .q {
              font-weight: 600;
            }
            .exo-quiz .reponses {
              padding-left: 18px;
            }
            .exo-quiz .reponses .r {
              display: inline-block;
              margin-right: 14px;
            }
            .exo-quiz .case {
              display: inline-block;
              width: 11px;
              height: 11px;
              border: 1px solid #5a4a3a;
              margin-right: 4px;
              background: white;
            }
            .exo-ordre {
              margin-bottom: 5px;
              padding-left: 2px;
            }
            .exo-ordre .item {
              display: inline-block;
              margin-right: 10px;
              font-style: italic;
            }
            .exo-ordre .item::before {
              content: "— ";
            }
            .exo-carte {
              margin-bottom: 5px;
              padding: 6px 12px;
              background: #f0ece6;
              border-left: 3px solid #b8a898;
            }
            .exo-carte .recto {
              font-weight: 600;
            }
            .exo-carte .verso-vide {
              color: #8a7a6a;
              font-style: italic;
              font-size: 9pt;
            }
            .exo-retenir {
              margin-top: 4px;
              padding-left: 2px;
            }
            .exo-retenir .mot {
              display: inline-block;
              padding: 1px 10px;
              margin: 1px 4px 1px 0;
              border: 1px solid #b8a898;
              font-weight: 500;
              font-size: 9pt;
              background: #f5f0ea;
              color: #2a2a2a;
            }
            
            /* ===== PIED DE PAGE ===== */
            .pied-page {
              text-align: center;
              font-size: 8.5pt;
              color: #8a7a6a;
              margin-top: 14px;
              padding-top: 10px;
              border-top: 1px solid #d4c9b8;
              letter-spacing: 0.5px;
            }
            .pied-page .imprime-le {
              font-style: italic;
              font-size: 7.5pt;
              color: #a89888;
              margin-top: 2px;
            }
            .pied-page .qiraat {
              font-weight: 400;
              text-transform: uppercase;
              letter-spacing: 2px;
            }

            /* ===== PETITS DÉTAILS ===== */
            .separateur-doux {
              border: none;
              border-top: 1px solid #e8e0d8;
              margin: 4px 0;
            }
            .zone-exercices .sous-section {
              margin-top: 6px;
            }

            /* ===== BOUTON D'IMPRESSION ===== */
            .no-print {
              text-align: center;
              margin-bottom: 12px;
              padding: 10px;
              background: #f0ece6;
              border: 1px solid #d4c9b8;
              border-radius: 4px;
            }
            .no-print button {
              padding: 8px 24px;
              font-size: 12pt;
              font-family: 'Georgia', 'Times New Roman', Times, serif;
              cursor: pointer;
              border: 1px solid #8a7a6a;
              background: white;
              border-radius: 4px;
              color: #1a1a1a;
              margin: 0 6px;
              transition: background 0.2s;
            }
            .no-print button:hover {
              background: #faf8f5;
            }
            @media print {
              .no-print { display: none; }
            }
          </style>
        </head>
        <body>
          <div class="page">
      `;

      // ===== BOUTONS D'IMPRESSION (masqués à l'impression) =====
      printHtml += `
        <div class="no-print">
          <button onclick="window.print()">🖨️ Imprimer</button>
          <button onclick="window.print()">📥 Télécharger en PDF</button>
          <button onclick="window.close()">✕ Fermer</button>
        </div>
      `;

      // ===== EN-TÊTE LISEUSE =====
      printHtml += `
        <div class="header-liseuse">
          <div class="categorie">${post.categorie || 'Sans catégorie'} <span class="niveau">· Niveau ${post.niveau || 0}</span></div>
          <h1>${post.titre || 'Lecture'}</h1>
          <div class="meta-ligne">
            <span>Le ${dateCreationStr || '—'}</span>
          </div>
        </div>
      `;

      // ===== ZONE DE LECTURE =====
      printHtml += `<div class="zone-lecture">`;

      if (slidesArray.length > 0) {
        slidesArray.forEach(function(slide, idx) {
          printHtml += `<div class="slide">`;
          var paragraphs = slide.split('\n').filter(function(p) { return p.trim() !== ''; });
          paragraphs.forEach(function(p) {
            printHtml += `<p>${p.trim()}</p>`;
          });
          printHtml += `</div>`;
        });
      } else {
        printHtml += `<p style="font-style:italic;color:#8a7a6a;text-align:center;">(Aucun contenu de lecture)</p>`;
      }

      printHtml += `</div>`;

      // ===== ZONE EXERCICES =====
      printHtml += `<div class="zone-exercices">`;

      var hasExercice = false;
      var questionNum = 1;

      // --- QUIZ ---
      if (quiz.trim() !== '') {
        hasExercice = true;
        var quizs = parserQuizsPourImpression(quiz);
        printHtml += `<div class="titre-exo">Questions de compréhension</div>`;
        quizs.forEach(function(q, qi) {
          printHtml += `<div class="exo-quiz">`;
          printHtml += `<span class="q">${questionNum}.</span> ${q.question}`;
          printHtml += `<div class="reponses">`;
          q.reponses.forEach(function(rep) {
            printHtml += `<span class="r"><span class="case"></span> ${rep.lettre}. ${rep.texte}</span>`;
          });
          printHtml += `</div>`;
          printHtml += `</div>`;
          questionNum++;
        });
      }

      // --- QUESTION OUVERTE ---
      if (openQuestion.trim() !== '') {
        hasExercice = true;
        var qsTexte = openQuestion.replace(/^qs:\s*/i, '').trim();
        if (quiz.trim() === '') {
          printHtml += `<div class="titre-exo">Questions de compréhension</div>`;
        }
        printHtml += `<div class="exo-quiz">`;
        printHtml += `<span class="q">${questionNum}.</span> ${qsTexte}`;
        printHtml += `<div style="border-bottom:1px dashed #c4b8a8;height:24px;margin:2px 0 3px 20px;"></div>`;
        printHtml += `</div>`;
        questionNum++;
      }

      // --- ORDRE ---
      if (ordre.trim() !== '') {
        hasExercice = true;
        var ordreItems = parserOrdrePourImpression(ordre);
        printHtml += `<div class="titre-exo" style="margin-top:8px;">Remettre dans l'ordre</div>`;
        printHtml += `<div class="exo-ordre">`;
        ordreItems.forEach(function(item, idx) {
          printHtml += `<span class="item">${item}</span>`;
        });
        printHtml += `</div>`;
      }

      // --- CARTE ---
      if (carte.trim() !== '') {
        hasExercice = true;
        var carteData = parserCartePourImpression(carte);
        if (carteData) {
          printHtml += `<div class="titre-exo" style="margin-top:8px;">Carte mémoire</div>`;
          printHtml += `<div class="exo-carte">`;
          printHtml += `<div class="recto">${carteData.recto}</div>`;
          printHtml += `<div class="verso-vide">(Espace pour écrire la réponse)</div>`;
          printHtml += `</div>`;
        }
      }

      // --- RETENIR ---
      if (retenir.trim() !== '') {
        hasExercice = true;
        var mots = retenir.replace(/^#\s*/, '').split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m.length > 0; });
        if (mots.length > 0) {
          printHtml += `<div class="titre-exo" style="margin-top:8px;">À retenir</div>`;
          printHtml += `<div class="exo-retenir">`;
          mots.forEach(function(mot) {
            printHtml += `<span class="mot">${mot}</span>`;
          });
          printHtml += `</div>`;
        }
      }

      if (!hasExercice) {
        printHtml += `<div style="height:2px;color:#c4b8a8;font-style:italic;font-size:9pt;">— Aucun exercice —</div>`;
      }

      printHtml += `</div>`;

      // ===== PIED DE PAGE =====
      printHtml += `
            <div class="pied-page">
              <div class="qiraat">Qiraat</div>
              <div class="imprime-le">Imprimé le ${dateImpressionStr} à ${heureImpressionStr}</div>
            </div>
          </div>
        </body>
        </html>
      `;

      var win = window.open('', '_blank', 'width=1000,height=800,scrollbars=yes');
      if (!win) {
        alert('Veuillez autoriser les pop-ups pour imprimer.');
        return;
      }
      win.document.write(printHtml);
      win.document.close();

      // === OUVRE LA FENÊTRE D'IMPRESSION AUTOMATIQUEMENT ===
      setTimeout(function() {
        win.print();
      }, 500);
    }

    // ============================================================
    // FIN FONCTIONS D'IMPRESSION
    // ============================================================

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        localStorage.removeItem('etudiant_nom');
        window.location.href = '/medit/index.html';
      }
    }

    function ouvrirAnnotations(articleId, titre) {
      var reponse = toutesLesReponses[articleId] || null;
      var annotations = reponse ? reponse.annotations : '';

      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalAnnotations';
      modal.onclick = function(e) {
        if (e.target === this) fermerAnnotations();
      };

      var html = '<div class="modal-contenu">';
      html += '<h3>' + titre + '</h3>';
      html += '<div class="modal-sous-titre">Annotations</div>';

      if (annotations && annotations.trim() !== '') {
        var parts = annotations.split('|');
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split(':');
          if (kv.length === 2) {
            var slideNum = kv[0].replace('slide', '');
            var texte = kv[1];
            html += '<div class="modal-annotation">';
            html += '<strong>Slide ' + slideNum + '</strong>';
            html += texte;
            html += '</div>';
          }
        }
      } else {
        html += '<div class="aucune-annotation">Aucune annotation pour ce texte.</div>';
      }

      html += '<button class="modal-close" onclick="fermerAnnotations()">Fermer</button>';
      html += '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);
    }

    function fermerAnnotations() {
      var modal = document.getElementById('modalAnnotations');
      if (modal) modal.remove();
    }

    function estPostLu(post) {
      var reponse = toutesLesReponses[post.id];
      
      if (!reponse) {
        for (var key in toutesLesReponses) {
          if (toutesLesReponses[key].titre === post.titre) {
            reponse = toutesLesReponses[key];
            break;
          }
        }
      }
      
      if (!reponse) return false;
      
      var bonnes = parseInt(reponse.bonnes) || 0;
      var total = parseInt(reponse.total) || 0;
      
      if (total === 1 && bonnes === 1) return true;
      if (total > 0 && bonnes >= Math.ceil(total / 2)) return true;
      
      return false;
    }

    function estPostAccessible(posts, index) {
      if (index === 0) return true;
      var postPrecedent = posts[index - 1];
      return estPostLu(postPrecedent);
    }

    function chargerTableauDeBord() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          postsData = data.posts || [];

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              toutesLesReponses[r.articleId] = r;
            });
          }

          document.getElementById('totalPosts').textContent = postsData.length;

          if (postsData.length === 0) {
            afficherVide();
          } else {
            var categorieInitiale = getCategorieFromURL();
            afficherCategories(postsData, categorieInitiale);
          }
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            postsData = cache.posts || [];
            document.getElementById('totalPosts').textContent = postsData.length;
            var categorieInitiale = getCategorieFromURL();
            afficherCategories(postsData, categorieInitiale);
          } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('contenu').innerHTML = `
              <div class="vide">
                <span class="icone">⚠️</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion.</p>
                <button onclick="DataManager.rafraichir(); location.reload();" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid var(--border-color);border-radius:4px;cursor:pointer;color:var(--text-primary);">
                  Réessayer
                </button>
              </div>
            `;
          }
        });
    }

    function afficherCategories(posts, categorieActive) {
      var contenu = document.getElementById('contenu');
      document.getElementById('loader').style.display = 'none';

      var categories = {};
      var totalPosts = 0;
      
      posts.forEach(function(post) {
        var cat = post.categorie || 'Sans catégorie';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(post);
        totalPosts++;
      });
      
      var categoriesTriees = Object.keys(categories).sort();

      var tabsHtml = '';
        
      categoriesTriees.forEach(function(cat) {
        var count = categories[cat].length;
        tabsHtml += `
          <button class="tab-btn ${categorieActive === cat ? 'active' : ''}" data-cat="${cat}" onclick="switchCategorie('${cat}')">
            ${cat}
            <span class="compteur-tab">${count}</span>
          </button>
        `;
      });
      
      document.getElementById('tabsContainer').innerHTML = tabsHtml;

      var postsFiltres = filtrerPosts(categorieActive);
      afficherPosts(postsFiltres);
    }

    function switchCategorie(categorie) {
      categorieActuelle = categorie;
      mettreAJourURL(categorie);

      document.querySelectorAll('.tab-btn').forEach(function(el) {
        el.classList.remove('active');
        if (el.dataset.cat === categorie) {
          el.classList.add('active');
        }
      });

      var postsFiltres = filtrerPosts(categorie);
      afficherPosts(postsFiltres);
    }

    function filtrerPosts(categorie) {
      var resultats = [];

      postsData.forEach(function(post) {
        var catPost = post.categorie || 'Sans catégorie';
        if (categorie !== 'toutes' && catPost !== categorie) return;
        resultats.push(post);
      });

      resultats.sort(function(a, b) {
        return a.titre.localeCompare(b.titre, 'fr', { sensitivity: 'base' });
      });

      return resultats;
    }

    function afficherPosts(posts) {
      var container = document.getElementById('contenu');
      if (!container) return;

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="vide" style="padding:30px 20px;">
            <span class="icone" style="font-size:32px;">📭</span>
            <h2 style="font-size:18px;">Aucun texte</h2>
            <p style="font-size:14px;">Aucun texte dans cette catégorie.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille">';

      for (var i = 0; i < posts.length; i++) {
        var post = posts[i];
        var reponse = toutesLesReponses[post.id];
        
        if (!reponse) {
          for (var key in toutesLesReponses) {
            if (toutesLesReponses[key].titre === post.titre) {
              reponse = toutesLesReponses[key];
              break;
            }
          }
        }
        
        var dateValidation = '';
        var retenir = '';
        var estLu = false;
        var estValide = false;

        if (reponse) {
          var bonnes = parseInt(reponse.bonnes) || 0;
          var total = parseInt(reponse.total) || 0;
          dateValidation = reponse.date || '';
          retenir = reponse.retenir || '';

          if (total === 1 && bonnes === 1) {
            estLu = true;
            estValide = true;
          } else if (total > 0 && bonnes >= Math.ceil(total / 2)) {
            estLu = true;
            estValide = true;
          }
        }

        var estAccessible = estPostAccessible(posts, i);
        var estBloque = !estAccessible;

        var hasQuiz = post.hasQuiz || false;
        var hasQuestion = post.hasQuestion || false;
        var mots = post.mots || 0;

        var nbQuestions = 0;
        if (hasQuiz) nbQuestions++;
        if (hasQuestion) nbQuestions++;

        var metaHtml = '';

        if (estLu) {
          var resultatHtml = '';
          var questionHtml = '';
          var annoteHtml = '';

          if (reponse) {
            var bonnes = reponse.bonnes || 0;
            var total = reponse.total || 0;
            if (total > 0) {
              resultatHtml = '<span class="badge-icone">Résultat : ' + bonnes + '/' + total + '</span>';
            }

            var reponseOuverte = reponse.reponseOuverte || '';
            if (reponseOuverte && reponseOuverte.trim() !== '') {
              questionHtml = '<span class="badge-icone">Question envoyée ✓</span>';
            } else if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }

            var annotations = reponse.annotations || '';
            if (annotations && annotations.trim() !== '') {
              annoteHtml = '<span class="badge-icone clickable" onclick="event.stopPropagation(); ouvrirAnnotations(\'' + post.id + '\', \'' + post.titre.replace(/'/g, "\\'") + '\');">Annoté ✓</span>';
            } else {
              annoteHtml = '<span class="badge-icone">Non annoté</span>';
            }
          } else {
            resultatHtml = '<span class="badge-icone">Résultat : 0/0</span>';
            if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }
            annoteHtml = '<span class="badge-icone">Non annoté</span>';
          }

          metaHtml = resultatHtml + questionHtml + annoteHtml;
        } else {
          metaHtml = '<span class="badge-icone">Nbr questions : ' + nbQuestions + '</span>';
        }

        var dateHtml = '';
        var dateLabelHtml = '';

        if (estLu && dateValidation) {
          var d = new Date(dateValidation);
          if (!isNaN(d.getTime())) {
            var dateStr = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
            var heureStr = d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
            dateLabelHtml = '<span class="date-label visible">Fait :</span>';
            dateHtml = '<span class="date-validation visible">' + dateStr + ' à ' + heureStr + '</span>';
          }
        }

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre visible">
              <strong>À retenir</strong>
              ${retenir}
            </div>
          `;
        }

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

        // === BOUTON VERSION PAPIER (au lieu de "Imprimer") ===
        var imprimerHtml = '';
        if (!estBloque && estLu) {
          imprimerHtml = `
            <div class="btn-wrap">
              <button class="btn-imprimer" onclick="event.stopPropagation(); imprimerArticle('${post.id}', '${post.titre.replace(/'/g, "\\'")}')">
                📄 Version papier
              </button>
            </div>
          `;
        }

        var carteStyle = '';
        var iconeCadenas = '';
        var onClickAttr = '';
        
        if (estBloque) {
          carteStyle = 'style="opacity:0.6;"';
          iconeCadenas = '🔒︎ ';
          onClickAttr = 'onclick="event.preventDefault(); alert(\'Vous devez d\'abord valider le texte précédent.\');"';
        } else {
          onClickAttr = 'onclick="window.location.href=\'/medit/article.html?id=' + post.id + '\'"';
        }

        html += `
          <div class="carte-post" ${carteStyle}>
            <div class="infos clickable-area" ${onClickAttr}>
              <div class="titre">${iconeCadenas}${post.titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${post.niveau}</span>
                ${metaHtml}
                ${motsHtml}
                ${retenirHtml}
              </div>
            </div>
            <div class="statut clickable-area" ${onClickAttr}>
              ${dateLabelHtml}
              ${dateHtml}
            </div>
            ${imprimerHtml}
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function afficherVide() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('contenu').innerHTML = `
        <div class="vide">
          <span class="icone">📭</span>
          <h2>Aucune méditation disponible</h2>
          <p>De nouvelles méditations seront ajoutées prochainement.</p>
          <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Votre niveau actuel : ${niveauEtudiant}</p>
        </div>
      `;
      document.getElementById('tabsContainer').innerHTML = '';
    }

    function demarrer() {
      chargerTableauDeBord();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
