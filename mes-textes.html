<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Mes lectures</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <style>
    /* ============================================================
       RESET & BASE - STYLE LISEUSE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #f3f0e9 !important;
      color: #2c2c2c !important;
      min-height: 100vh;
      letter-spacing: 0.2px;
      display: flex;
      flex-direction: column;
      font-weight: 350 !important;
    }

    body * {
      box-shadow: none !important;
      text-shadow: none !important;
      transition: none !important;
      animation: none !important;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ============================================================
       PAGE
       ============================================================ */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      flex: 1;
      width: 100%;
      background: #f3f0e9 !important;
    }

    /* ============================================================
       NIVEAU + STATS sur une ligne
       ============================================================ */
    .niveau-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 32px;
      margin-bottom: 24px;
      align-items: center;
    }

    .niveau-badge {
      background: #f3f0e9 !important;
      border-radius: 4px;
      padding: 14px 24px;
      border: 1px solid #d1ccc4 !important;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: none !important;
    }

    .niveau-badge .label {
      font-size: 13px;
      color: #6b7a8a;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .niveau-badge .valeur {
      font-size: 22px;
      font-weight: 600;
      color: #2c2c2c !important;
      font-family: 'Georgia', serif;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 20px;
      background: #f3f0e9 !important;
      border-radius: 4px;
      padding: 14px 24px;
      border: 1px solid #d1ccc4 !important;
      box-shadow: none !important;
    }

    .stats-ligne .stat-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-size: 13px;
      color: #6b7a8a;
    }

    .stats-ligne .stat-item .nombre {
      font-size: 22px;
      font-weight: 600;
      color: #2c2c2c !important;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .stats-ligne .stat-item .nombre.valide {
      color: #2c2c2c !important;
    }

    .stats-ligne .sep {
      color: #d1ccc4;
      font-size: 18px;
    }

    /* ============================================================
       ONGLETS PRINCIPAUX - Style liseuse
       ============================================================ */
    .tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 24px;
      padding: 4px 0;
      border-bottom: 1px solid #d1ccc4 !important;
    }

    .tab-btn {
      padding: 10px 28px;
      background: transparent !important;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 15px;
      font-weight: 500;
      color: #6b7a8a !important;
      cursor: pointer;
      transition: none !important;
      letter-spacing: 0.3px;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      border-radius: 0;
      box-shadow: none !important;
    }

    .tab-btn:hover {
      color: #2c2c2c !important;
      background: #e8e5e0 !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .tab-btn.active {
      color: #2c2c2c !important;
      border-bottom-color: #2c2c2c !important;
      font-weight: 600;
      background: transparent !important;
    }

    .tab-btn .compteur-tab {
      display: inline-block;
      background: #e8e5e0 !important;
      color: #6b7a8a !important;
      font-size: 11px;
      font-weight: 600;
      padding: 0 10px;
      border-radius: 30px;
      margin-left: 6px;
      line-height: 20px;
    }

    .tab-btn.active .compteur-tab {
      background: #e8e5e0 !important;
      color: #2c2c2c !important;
    }

    /* ============================================================
       SOUS-ONGLETS CATÉGORIES - Style liseuse
       ============================================================ */
    .sous-tabs-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding: 4px 0;
    }

    .sous-tab-btn {
      padding: 6px 18px;
      background: transparent !important;
      border: 1.5px solid #d1ccc4 !important;
      border-radius: 4px !important;
      font-size: 13px;
      font-weight: 400;
      color: #6b7a8a !important;
      cursor: pointer;
      transition: none !important;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: transparent !important;
      box-shadow: none !important;
    }

    .sous-tab-btn:hover {
      color: #2c2c2c !important;
      border-color: #b8b0a8 !important;
      background: #e8e5e0 !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .sous-tab-btn.active {
      color: #2c2c2c !important;
      background: #e8e5e0 !important;
      border-color: #b8b0a8 !important;
      font-weight: 500;
      box-shadow: none !important;
    }

    .sous-tab-btn .compteur-sous-tab {
      display: inline-block;
      background: rgba(0,0,0,0.05) !important;
      color: #6b7a8a !important;
      font-size: 10px;
      font-weight: 600;
      padding: 0 8px;
      border-radius: 30px;
      margin-left: 4px;
      line-height: 18px;
    }

    .sous-tab-btn.active .compteur-sous-tab {
      background: rgba(0,0,0,0.08) !important;
      color: #2c2c2c !important;
    }

    .sous-tab-content {
      display: none;
    }

    .sous-tab-content.active {
      display: block;
    }

    /* ============================================================
       GRILLE DES POSTS - Style liseuse
       ============================================================ */
    .grille {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .carte-post {
      background: #f3f0e9 !important;
      border-radius: 4px !important;
      padding: 16px 22px;
      border: 1px solid #d1ccc4 !important;
      box-shadow: none !important;
      transition: none !important;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .carte-post:hover {
      transform: none !important;
      box-shadow: none !important;
      border-color: #b8b0a8 !important;
      background: #f8f6f2 !important;
    }

    .carte-post .infos {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .carte-post .titre {
      font-size: 17px;
      font-weight: 500;
      color: #2c2c2c !important;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    .carte-post .meta {
      font-size: 12px;
      color: #6b7a8a;
      letter-spacing: 0.2px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .carte-post .meta .niveau-badge {
      background: #e8e5e0 !important;
      padding: 1px 10px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 500;
      color: #6b7a8a !important;
      display: inline-block;
      border: none !important;
    }

    .carte-post .meta .badge-icone {
      font-size: 12px;
      display: inline-block;
      background: #e8e5e0 !important;
      padding: 1px 10px;
      border-radius: 4px !important;
      color: #6b7a8a !important;
      font-weight: 500;
      border: 1px solid #d1ccc4 !important;
    }

    .carte-post .meta .badge-icone.info {
      background: #e8e5e0 !important;
      color: #6b7a8a !important;
    }

    .carte-post .meta .badge-icone.ok {
      background: #e8e5e0 !important;
      color: #2c2c2c !important;
    }

    .carte-post .meta .badge-icone.ko {
      background: #e8e5e0 !important;
      color: #6b7a8a !important;
    }

    .carte-post .meta .badge-icone.clickable {
      cursor: pointer;
      transition: none !important;
    }

    .carte-post .meta .badge-icone.clickable:hover {
      background: #d1ccc4 !important;
      transform: none !important;
    }

    .carte-post .meta .mots {
      font-size: 11px;
      color: #b8b0a8;
    }

    .carte-post .retenir-cadre {
      background: rgba(0,0,0,0.02) !important;
      border-left: 3px solid #b8b0a8 !important;
      padding: 10px 16px;
      border-radius: 4px !important;
      margin-top: 6px;
      font-size: 13px;
      color: #2c2c2c !important;
      font-style: italic;
      line-height: 1.5;
      display: none;
      border: 1px solid #d1ccc4 !important;
    }

    .carte-post .retenir-cadre.visible {
      display: block;
    }

    .carte-post .retenir-cadre strong {
      font-style: normal;
      color: #6b7a8a !important;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ============================================================
       STATUT DANS LA CARTE
       ============================================================ */
    .carte-post .statut {
      text-align: center;
      min-width: 80px;
    }

    .carte-post .statut .date-validation {
      font-size: 11px;
      color: #b8b0a8;
      margin-top: 4px;
      display: none;
      letter-spacing: 0.2px;
    }

    .carte-post .statut .date-validation.visible {
      display: block;
    }

    .carte-post .statut .date-label {
      font-size: 11px;
      color: #b8b0a8;
      display: none;
      letter-spacing: 0.2px;
    }

    .carte-post .statut .date-label.visible {
      display: inline;
    }

    /* ============================================================
       MODAL POPUP - Style liseuse
       ============================================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-contenu {
      background: #f3f0e9 !important;
      border-radius: 4px !important;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 32px 36px;
      box-shadow: none !important;
      font-family: 'Georgia', serif;
      line-height: 1.7;
      border: 1px solid #d1ccc4 !important;
    }

    .modal-contenu h3 {
      font-size: 20px;
      color: #2c2c2c !important;
      margin-bottom: 4px;
      font-weight: 600;
      font-family: 'Georgia', serif;
    }

    .modal-contenu .modal-sous-titre {
      font-size: 13px;
      color: #6b7a8a !important;
      margin-bottom: 16px;
      border-bottom: 1px solid #d1ccc4 !important;
      padding-bottom: 12px;
      font-family: 'Segoe UI', sans-serif;
    }

    .modal-contenu .modal-annotation {
      background: rgba(0,0,0,0.02) !important;
      border-left: 3px solid #b8b0a8 !important;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 4px !important;
      font-size: 14px;
      color: #2c2c2c !important;
      border: 1px solid #d1ccc4 !important;
    }

    .modal-contenu .modal-annotation strong {
      font-weight: 600;
      color: #6b7a8a !important;
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .modal-contenu .modal-annotation .slide-num {
      font-size: 12px;
      color: #b8b0a8;
      font-weight: 400;
      margin-top: 4px;
      font-family: 'Segoe UI', sans-serif;
    }

    .modal-contenu .modal-close {
      margin-top: 20px;
      padding: 8px 28px;
      background: transparent !important;
      border: 1px solid #d1ccc4 !important;
      border-radius: 4px !important;
      font-size: 13px;
      color: #6b7a8a !important;
      cursor: pointer;
      transition: none !important;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: none !important;
    }

    .modal-contenu .modal-close:hover {
      background: #e8e5e0 !important;
      color: #2c2c2c !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .modal-contenu .aucune-annotation {
      color: #b8b0a8;
      font-style: italic;
      font-size: 14px;
      padding: 16px 0;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ============================================================
       LOADER / VIDE - Style liseuse
       ============================================================ */
    .loader {
      text-align: center;
      padding: 60px 20px;
      font-size: 16px;
      color: #b8b0a8;
    }

    .loader .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #d1ccc4 !important;
      border-top-color: #2c2c2c !important;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide {
      text-align: center;
      padding: 60px 20px;
      background: #f3f0e9 !important;
      border-radius: 4px !important;
      border: 1px solid #d1ccc4 !important;
      box-shadow: none !important;
    }

    .vide .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide h2 {
      font-size: 20px;
      font-weight: 400;
      color: #2c2c2c !important;
      margin-bottom: 4px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    .vide p {
      color: #b8b0a8;
      font-size: 15px;
    }

    /* ============================================================
       DEVISE
       ============================================================ */
    .devise {
      text-align: center;
      padding: 28px 0 8px;
      font-size: 14px;
      color: #6b7a8a !important;
      font-style: italic;
      letter-spacing: 0.5px;
      border-top: 1px solid #d1ccc4 !important;
      margin-top: 32px;
      font-family: 'Georgia', serif;
    }

    /* ============================================================
       DÉCONNEXION EN BAS
       ============================================================ */
    .deconnexion-bas {
      text-align: center;
      padding: 16px 0 8px;
      margin-top: 20px;
    }

    .deconnexion-bas button {
      background: transparent !important;
      border: 1px solid #d1ccc4 !important;
      padding: 8px 24px;
      border-radius: 4px !important;
      font-size: 13px;
      color: #6b7a8a !important;
      cursor: pointer;
      transition: none !important;
      font-family: 'Segoe UI', sans-serif;
      box-shadow: none !important;
    }

    .deconnexion-bas button:hover {
      border-color: #b8b0a8 !important;
      color: #2c2c2c !important;
      background: #e8e5e0 !important;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ============================================================
       SCROLLBAR - Style liseuse
       ============================================================ */
    ::-webkit-scrollbar {
      width: 4px !important;
      height: 4px !important;
    }
    ::-webkit-scrollbar-track {
      background: #f3f0e9 !important;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1ccc4 !important;
      border-radius: 2px !important;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .carte-post {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 14px 16px;
      }
      .carte-post .statut {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        justify-content: flex-start;
      }
      .tabs-container {
        justify-content: center;
      }
      .tab-btn {
        font-size: 14px;
        padding: 8px 18px;
      }
      .niveau-container {
        flex-direction: column;
        align-items: stretch;
      }
      .sous-tabs-container {
        justify-content: center;
      }
      .sous-tab-btn {
        font-size: 12px;
        padding: 5px 14px;
      }
      .stats-ligne {
        justify-content: center;
        padding: 12px 16px;
      }
      .modal-contenu {
        padding: 24px 20px;
      }
    }

    @media (max-width: 480px) {
      .carte-post .statut {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }
      .carte-post .statut .date-validation {
        text-align: left;
      }
      .tab-btn {
        font-size: 13px;
        padding: 6px 14px;
      }
      .stats-ligne .stat-item .nombre {
        font-size: 18px;
      }
      .niveau-badge {
        padding: 12px 16px;
      }
      .sous-tab-btn {
        font-size: 11px;
        padding: 4px 12px;
      }
      .modal-contenu {
        padding: 20px 16px;
      }
      .modal-contenu h3 {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-logo">
                <a href="/medit/index.html">✎ <strong>Médit</strong>Islam</a>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
                <a href="#" class="header-link" onclick="ouvrirInscription(); return false;">S'inscrire</a>
              </nav>
            </div>
          </header>
        `;
        mettreAJourHeader();
      });

    function mettreAJourHeader() {
      var id = localStorage.getItem('etudiant_id');
      var nav = document.getElementById('headerNav');

      if (nav) {
        if (id) {
          nav.innerHTML = `
            <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
          `;
        } else {
          nav.innerHTML = `
            <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
            <a href="#" class="header-link" onclick="ouvrirInscription(); return false;">S'inscrire</a>
          `;
        }
      }
    }
  </script>

  <div class="page">

    <!-- NIVEAU + STATS sur une ligne -->
    <div class="niveau-container" id="niveauContainer">
      <div class="niveau-badge">
        <span class="label">Vous êtes inscrit au niveau</span>
        <span class="valeur" id="niveauValeur">—</span>
      </div>
      <div class="stats-ligne" id="statsLigne">
        <div class="stat-item">
          <span>Textes :</span>
          <span class="nombre" id="totalPosts">0</span>
        </div>
        <span class="sep">|</span>
        <div class="stat-item">
          <span>Lus :</span>
          <span class="nombre valide" id="validesPosts">0</span>
        </div>
        <span class="sep">|</span>
        <div class="stat-item">
          <span>À faire :</span>
          <span class="nombre" id="aFairePosts">0</span>
        </div>
      </div>
    </div>

    <!-- ONGLETS PRINCIPAUX : À lire / Lus -->
    <div class="tabs-container" id="tabsContainer"></div>

    <!-- CONTENU PRINCIPAL -->
    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Vos lectures vont s'afficher ici dans un instant...</p>
      </div>
    </div>

    <div class="devise">
      “Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?” — Coran 47:24
    </div>

    <!-- DÉCONNEXION EN BAS -->
    <div class="deconnexion-bas">
      <button onclick="deconnecter()">Se déconnecter</button>
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">“La méditation est la clé qui ouvre les portes de l'intelligence du cœur.”</div>
            <div class="footer-copy">© ${new Date().getFullYear()} MéditIslam</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // mes-textes.html - VERSION LISEUSE PAPERINK
    // ============================================================

    var toutesLesReponses = {};
    var postsData = [];
    var niveauEtudiant = 0;

    var ongletActuel = 'a-lire';
    var categorieActuelle = null;

    function ouvrirConnexion() {
        window.location.href = '/medit/index.html';
    }

    function ouvrirInscription() {
        window.location.href = '/medit/index.html';
    }

    function deconnecter() {
        if (confirm('Se déconnecter ?')) {
            localStorage.removeItem('etudiant_id');
            localStorage.removeItem('etudiant_niveau');
            window.location.href = '/medit/index.html';
        }
    }

    // ============================================================
    // POPUP ANNOTATIONS
    // ============================================================
    function ouvrirAnnotations(articleId, titre) {
        var reponse = toutesLesReponses[articleId] || null;
        var annotations = reponse ? reponse.annotations : '';
        var slides = reponse ? reponse.slides : '';

        var modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'modalAnnotations';
        modal.onclick = function(e) {
            if (e.target === this) fermerAnnotations();
        };

        var html = '<div class="modal-contenu">';
        html += '<h3>' + titre + '</h3>';
        html += '<div class="modal-sous-titre">Annotations</div>';

        if (annotations && annotations.trim() !== '') {
            var parts = annotations.split('|');
            for (var i = 0; i < parts.length; i++) {
                var kv = parts[i].split(':');
                if (kv.length === 2) {
                    var slideNum = kv[0].replace('slide', '');
                    var texte = kv[1];
                    html += '<div class="modal-annotation">';
                    html += '<strong>Slide ' + slideNum + '</strong>';
                    html += texte;
                    html += '</div>';
                }
            }
        } else {
            html += '<div class="aucune-annotation">Aucune annotation pour ce texte.</div>';
        }

        html += '<button class="modal-close" onclick="fermerAnnotations()">Fermer</button>';
        html += '</div>';

        modal.innerHTML = html;
        document.body.appendChild(modal);
    }

    function fermerAnnotations() {
        var modal = document.getElementById('modalAnnotations');
        if (modal) modal.remove();
    }

    // ============================================================
    // CHARGEMENT AVEC DATAMANAGER
    // ============================================================
    function chargerTableauDeBord() {
        var id = localStorage.getItem('etudiant_id');
        if (!id) {
            window.location.href = '/medit/index.html';
            return;
        }

        DataManager.charger()
            .then(function(data) {
                niveauEtudiant = data.niveau || 0;
                postsData = data.posts || [];
                
                toutesLesReponses = {};
                if (data.reponses) {
                    data.reponses.forEach(function(r) {
                        toutesLesReponses[r.articleId] = r;
                    });
                }
                
                document.getElementById('niveauValeur').textContent = niveauEtudiant;
                
                if (postsData.length === 0) {
                    afficherVide();
                } else {
                    afficherAvecOnglets(postsData);
                }
            })
            .catch(function() {
                var cache = DataManager.getCacheForce(id);
                if (cache) {
                    niveauEtudiant = cache.niveau || 0;
                    postsData = cache.posts || [];
                    document.getElementById('niveauValeur').textContent = niveauEtudiant;
                    afficherAvecOnglets(postsData);
                } else {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('contenu').innerHTML = `
                        <div class="vide">
                            <span class="icone">⚠️</span>
                            <h2>Erreur de chargement</h2>
                            <p>Vérifiez votre connexion.</p>
                            <button onclick="DataManager.rafraichir(); location.reload();" 
                                    style="margin-top:12px;padding:10px 24px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:4px;cursor:pointer;">
                                Réessayer
                            </button>
                        </div>
                    `;
                }
            });
    }

    // ============================================================
    // VÉRIFIER SI UN POST EST LU
    // ============================================================
    function estPostLu(post) {
        var reponse = toutesLesReponses[post.id];
        if (!reponse) return false;
        var bonnes = reponse.bonnes || 0;
        var total = reponse.total || 0;
        if (total === 1 && bonnes === 1) return true;
        if (total > 0 && bonnes >= Math.ceil(total / 2)) return true;
        return false;
    }

    // ============================================================
    // AFFICHAGE AVEC 2 ONGLETS
    // ============================================================
    function afficherAvecOnglets(posts) {
        var contenu = document.getElementById('contenu');
        document.getElementById('loader').style.display = 'none';

        var total = posts.length;
        var valides = 0;
        var aFaire = 0;

        posts.forEach(function(post) {
            if (estPostLu(post)) {
                valides++;
            } else {
                aFaire++;
            }
        });

        document.getElementById('totalPosts').textContent = total;
        document.getElementById('validesPosts').textContent = valides;
        document.getElementById('aFairePosts').textContent = aFaire;

        var categories = {};
        posts.forEach(function(post) {
            var cat = post.categorie || 'Sans catégorie';
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(post);
        });
        var categoriesTriees = Object.keys(categories).sort();

        var tabsHtml = `
            <button class="tab-btn active" data-tab="a-lire" onclick="switchOnglet('a-lire')">
                À lire
                <span class="compteur-tab">${aFaire}</span>
            </button>
            <button class="tab-btn" data-tab="lus" onclick="switchOnglet('lus')">
                Lus
                <span class="compteur-tab">${valides}</span>
            </button>
        `;
        document.getElementById('tabsContainer').innerHTML = tabsHtml;

        contenu.innerHTML = `
            <div id="contenu-onglet">
                <div class="loader" style="display:none;"><div class="spinner"></div></div>
            </div>
        `;

        afficherOnglet('a-lire', categoriesTriees, categories);
    }

    // ============================================================
    // AFFICHER UN ONGLET
    // ============================================================
    function afficherOnglet(onglet, categoriesTriees, categories) {
        var container = document.getElementById('contenu-onglet');
        if (!container) return;

        var html = '';

        html += `<div class="sous-tabs-container" id="sous-tabs">`;

        var totalPosts = 0;
        categoriesTriees.forEach(function(cat) {
            categories[cat].forEach(function(post) {
                if (onglet === 'a-lire' && !estPostLu(post)) totalPosts++;
                if (onglet === 'lus' && estPostLu(post)) totalPosts++;
            });
        });
        html += `
            <button class="sous-tab-btn active" data-sous-tab="toutes" onclick="switchCategorie('toutes')">
                Toutes
                <span class="compteur-sous-tab">${totalPosts}</span>
            </button>
        `;

        categoriesTriees.forEach(function(cat) {
            var count = 0;
            categories[cat].forEach(function(post) {
                if (onglet === 'a-lire' && !estPostLu(post)) count++;
                if (onglet === 'lus' && estPostLu(post)) count++;
            });
            if (count > 0) {
                html += `
                    <button class="sous-tab-btn" data-sous-tab="${cat}" onclick="switchCategorie('${cat}')">
                        ${cat}
                        <span class="compteur-sous-tab">${count}</span>
                    </button>
                `;
            }
        });

        html += `</div>`;
        html += `<div id="sous-contenu"></div>`;

        container.innerHTML = html;

        var postsFiltres = filtrerPosts(onglet, 'toutes');
        afficherPosts(postsFiltres);
    }

    // ============================================================
    // CHANGER D'ONGLET PRINCIPAL
    // ============================================================
    function switchOnglet(onglet) {
        ongletActuel = onglet;

        document.querySelectorAll('.tab-btn').forEach(function(el) {
            el.classList.remove('active');
            if (el.dataset.tab === onglet) {
                el.classList.add('active');
            }
        });

        var categories = {};
        postsData.forEach(function(post) {
            var cat = post.categorie || 'Sans catégorie';
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(post);
        });
        var categoriesTriees = Object.keys(categories).sort();

        afficherOnglet(onglet, categoriesTriees, categories);
    }

    // ============================================================
    // CHANGER DE CATÉGORIE
    // ============================================================
    function switchCategorie(categorie) {
        categorieActuelle = categorie;

        var container = document.getElementById('sous-tabs');
        if (container) {
            container.querySelectorAll('.sous-tab-btn').forEach(function(el) {
                el.classList.remove('active');
                var cat = el.dataset.sousTab;
                if (cat === categorie) {
                    el.classList.add('active');
                }
            });
        }

        var postsFiltres = filtrerPosts(ongletActuel, categorie);
        afficherPosts(postsFiltres);
    }

    // ============================================================
    // FILTRER LES POSTS
    // ============================================================
    function filtrerPosts(onglet, categorie) {
        var resultats = [];

        postsData.forEach(function(post) {
            var estLu = estPostLu(post);
            if (onglet === 'a-lire' && estLu) return;
            if (onglet === 'lus' && !estLu) return;

            var catPost = post.categorie || 'Sans catégorie';
            if (categorie !== 'toutes' && catPost !== categorie) return;

            resultats.push(post);
        });

        return resultats;
    }

    // ============================================================
    // AFFICHER LES POSTS FILTRÉS
    // ============================================================
    function afficherPosts(posts) {
        var container = document.getElementById('sous-contenu');
        if (!container) return;

        if (posts.length === 0) {
            container.innerHTML = `
                <div class="vide" style="padding:30px 20px;">
                    <span class="icone" style="font-size:32px;">📭</span>
                    <h2 style="font-size:18px;">Aucun texte</h2>
                    <p style="font-size:14px;">Aucun texte dans cette catégorie.</p>
                </div>
            `;
            return;
        }

        var html = '<div class="grille">';

        posts.forEach(function(post) {
            var reponse = toutesLesReponses[post.id] || null;
            var dateValidation = '';
            var retenir = '';
            var estLu = false;
            var estValide = false;

            if (reponse) {
                var bonnes = reponse.bonnes || 0;
                var total = reponse.total || 0;
                dateValidation = reponse.date || '';
                retenir = reponse.retenir || '';

                if (total === 1 && bonnes === 1) {
                    estLu = true;
                    estValide = true;
                } else if (total > 0 && bonnes >= Math.ceil(total / 2)) {
                    estValide = true;
                }
            }

            var hasQuiz = post.hasQuiz || false;
            var hasQuestion = post.hasQuestion || false;
            var mots = post.mots || 0;

            // --- "À lire" : Nbr questions (quiz + question) ---
            var nbQuestions = 0;
            if (hasQuiz) nbQuestions++;
            if (hasQuestion) nbQuestions++;

            // --- "Lus" : métadonnées ---
            var metaHtml = '';

            if (ongletActuel === 'a-lire') {
                metaHtml = '<span class="badge-icone info">Nbr questions : ' + nbQuestions + '</span>';
            } else {
                // Lus : résultat, question, annoté
                var resultatHtml = '';
                var questionHtml = '';
                var annoteHtml = '';

                if (reponse) {
                    var bonnes = reponse.bonnes || 0;
                    var total = reponse.total || 0;
                    if (total > 0) {
                        resultatHtml = '<span class="badge-icone info">Résultat : ' + bonnes + '/' + total + '</span>';
                    }

                    var reponseOuverte = reponse.reponseOuverte || '';
                    if (reponseOuverte && reponseOuverte.trim() !== '') {
                        questionHtml = '<span class="badge-icone ok">Question envoyée ✓</span>';
                    } else if (hasQuestion) {
                        questionHtml = '<span class="badge-icone ko">Question non envoyée</span>';
                    }

                    var annotations = reponse.annotations || '';
                    if (annotations && annotations.trim() !== '') {
                        annoteHtml = '<span class="badge-icone clickable ok" onclick="event.stopPropagation(); ouvrirAnnotations(\'' + post.id + '\', \'' + post.titre.replace(/'/g, "\\'") + '\');">Annoté ✓</span>';
                    } else {
                        annoteHtml = '<span class="badge-icone ko">Non annoté</span>';
                    }
                } else {
                    resultatHtml = '<span class="badge-icone info">Résultat : 0/0</span>';
                    if (hasQuestion) {
                        questionHtml = '<span class="badge-icone ko">Question non envoyée</span>';
                    }
                    annoteHtml = '<span class="badge-icone ko">Non annoté</span>';
                }

                metaHtml = resultatHtml + questionHtml + annoteHtml;
            }

            var dateHtml = '';
            var dateLabelHtml = '';

            if (estLu && dateValidation) {
                var d = new Date(dateValidation);
                if (!isNaN(d.getTime())) {
                    var dateStr = d.toLocaleDateString('fr-FR', {
                        day: '2-digit', month: 'long', year: 'numeric'
                    });
                    var heureStr = d.toLocaleTimeString('fr-FR', {
                        hour: '2-digit', minute: '2-digit'
                    });
                    dateLabelHtml = '<span class="date-label visible">Lu le</span>';
                    dateHtml = '<span class="date-validation visible">' + dateStr + ' à ' + heureStr + '</span>';
                }
            }

            var retenirHtml = '';
            if (estValide && retenir) {
                retenirHtml = `
                    <div class="retenir-cadre visible">
                        <strong>À retenir</strong>
                        ${retenir}
                    </div>
                `;
            }

            var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

            html += `
                <div class="carte-post" onclick="window.location.href='/medit/article.html?id=${post.id}'">
                    <div class="infos">
                        <div class="titre">${post.titre}</div>
                        <div class="meta">
                            <span class="niveau-badge">Niveau ${post.niveau}</span>
                            ${metaHtml}
                            ${motsHtml}
                            ${retenirHtml}
                        </div>
                    </div>
                    <div class="statut">
                        ${dateLabelHtml}
                        ${dateHtml}
                    </div>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    // ============================================================
    // VIDE
    // ============================================================
    function afficherVide() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('contenu').innerHTML = `
            <div class="vide">
                <span class="icone">📭</span>
                <h2>Aucune méditation disponible</h2>
                <p>De nouvelles méditations seront ajoutées prochainement.</p>
                <p style="font-size:13px;color:#b8b0a8;margin-top:4px;">Votre niveau actuel : ${niveauEtudiant}</p>
            </div>
        `;
        document.getElementById('tabsContainer').innerHTML = '';
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
        chargerTableauDeBord();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', demarrer);
    } else {
        demarrer();
    }
  </script>
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <script src="/medit/lecture-mode.js"></script>
</body>
</html>
