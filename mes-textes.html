<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Mes textes - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    /* ============================================================
       STRUCTURE UNIQUEMENT - les couleurs sont dans lecture-mode.css
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; letter-spacing: 0.2px; }
    a { text-decoration: none; color: inherit; }

    .page { max-width: 1000px; margin: 0 auto; padding: 24px 20px 40px; flex: 1; width: 100%; }

    .page h1 {
      font-size: 30px;
      font-weight: 300;
      color: #2c2c2c;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .page .sous-titre-page {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      font-style: italic;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 20px;
      border-radius: 4px;
      padding: 14px 24px;
      border: 1px solid #d1ccc4;
      margin-bottom: 24px;
      background: #f3f0e9;
    }
    .stats-ligne .stat-item { display: flex; align-items: baseline; gap: 4px; font-size: 13px; color: #6b7a8a; }
    .stats-ligne .stat-item .nombre { font-size: 22px; font-weight: 600; font-family: 'Georgia', 'Times New Roman', serif; color: #2c2c2c; }
    .stats-ligne .sep { font-size: 18px; color: #d1ccc4; }

    .tabs-container { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 24px; padding: 4px 0; }
    .tab-btn { padding: 10px 28px; background: transparent; border: none; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; cursor: pointer; letter-spacing: 0.3px; font-family: 'Segoe UI', sans-serif; border-radius: 0; }
    .tab-btn .compteur-tab { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 10px; border-radius: 30px; margin-left: 6px; line-height: 20px; }

    .sous-tabs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 4px 0; }
    .sous-tab-btn { padding: 6px 18px; background: transparent; border-radius: 4px; font-size: 13px; font-weight: 400; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
    .sous-tab-btn .compteur-sous-tab { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 8px; border-radius: 30px; margin-left: 4px; line-height: 18px; }

    .sous-tab-content { display: none; }
    .sous-tab-content.active { display: block; }

    .grille { display: flex; flex-direction: column; gap: 10px; }
    .carte-post { border-radius: 4px; padding: 16px 22px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; cursor: pointer; border: 1px solid #d1ccc4; background: #f3f0e9; }
    .carte-post .infos { display: flex; flex-direction: column; gap: 4px; }
    .carte-post .titre { font-size: 17px; font-weight: 500; font-family: 'Georgia', serif; letter-spacing: 0.2px; line-height: 1.3; color: #2c2c2c; }
    .carte-post .meta { font-size: 12px; letter-spacing: 0.2px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #6b7a8a; }
    .carte-post .meta .niveau-badge { padding: 1px 10px; border-radius: 30px; font-size: 11px; font-weight: 500; display: inline-block; background: #e8e5e0; color: #6b7a8a; }
    .carte-post .meta .badge-icone { font-size: 12px; display: inline-block; padding: 1px 10px; border-radius: 4px; font-weight: 500; background: #e8e5e0; color: #6b7a8a; }
    .carte-post .meta .badge-icone.clickable { cursor: pointer; }
    .carte-post .meta .mots { font-size: 11px; color: #b8b0a8; }

    .carte-post .retenir-cadre { padding: 10px 16px; border-radius: 4px; margin-top: 6px; font-size: 13px; font-style: italic; line-height: 1.5; display: none; background: #e8e5e0; }
    .carte-post .retenir-cadre.visible { display: block; }
    .carte-post .retenir-cadre strong { font-style: normal; font-weight: 600; display: block; margin-bottom: 2px; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7a8a; }

    .carte-post .statut { text-align: center; min-width: 80px; }
    .carte-post .statut .date-validation { font-size: 11px; margin-top: 4px; display: none; letter-spacing: 0.2px; color: #6b7a8a; }
    .carte-post .statut .date-validation.visible { display: block; }
    .carte-post .statut .date-label { font-size: 11px; display: none; letter-spacing: 0.2px; color: #6b7a8a; }
    .carte-post .statut .date-label.visible { display: inline; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); }
    .modal-contenu { border-radius: 4px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 32px 36px; font-family: 'Georgia', serif; line-height: 1.7; background: #f3f0e9; border: 1px solid #d1ccc4; }
    .modal-contenu h3 { font-size: 20px; font-weight: 600; font-family: 'Georgia', serif; margin-bottom: 4px; color: #2c2c2c; }
    .modal-contenu .modal-sous-titre { font-size: 13px; margin-bottom: 16px; padding-bottom: 12px; font-family: 'Segoe UI', sans-serif; color: #6b7a8a; border-bottom: 1px solid #d1ccc4; }
    .modal-contenu .modal-annotation { padding: 12px 16px; margin-bottom: 12px; border-radius: 4px; font-size: 14px; background: #e8e5e0; }
    .modal-contenu .modal-annotation strong { font-weight: 600; display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; color: #6b7a8a; }
    .modal-contenu .modal-close { margin-top: 20px; padding: 8px 28px; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: 'Segoe UI', sans-serif; background: transparent; color: #6b7a8a; border: 1px solid #d1ccc4; }
    .modal-contenu .modal-close:hover { background: #e8e5e0; }
    .modal-contenu .aucune-annotation { font-style: italic; font-size: 14px; padding: 16px 0; font-family: 'Segoe UI', sans-serif; color: #6b7a8a; }

    .loader { text-align: center; padding: 60px 20px; font-size: 16px; color: #6b7a8a; }
    .loader .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #d1ccc4; border-top-color: #6b7a8a; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide { text-align: center; padding: 60px 20px; border-radius: 4px; border: 1px solid #d1ccc4; background: #f3f0e9; }
    .vide .icone { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.4; }
    .vide h2 { font-size: 20px; font-weight: 400; font-family: 'Georgia', serif; letter-spacing: 0.5px; margin-bottom: 4px; color: #2c2c2c; }
    .vide p { font-size: 15px; color: #6b7a8a; }

    .devise { text-align: center; padding: 28px 0 8px; font-size: 14px; font-style: italic; letter-spacing: 0.5px; margin-top: 32px; font-family: 'Georgia', serif; color: #6b7a8a; }

    .btn-retour {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 20px;
    }

    .btn-retour:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    @media (max-width: 768px) {
      .carte-post { grid-template-columns: 1fr; gap: 8px; padding: 14px 16px; }
      .carte-post .statut { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: flex-start; }
      .tabs-container { justify-content: center; }
      .tab-btn { font-size: 14px; padding: 8px 18px; }
      .sous-tabs-container { justify-content: center; }
      .sous-tab-btn { font-size: 12px; padding: 5px 14px; }
      .stats-ligne { justify-content: center; padding: 12px 16px; }
      .modal-contenu { padding: 24px 20px; }
      .page { padding: 16px 12px; }
      .page h1 { font-size: 24px; }
    }

    @media (max-width: 480px) {
      .carte-post .statut { flex-direction: column; align-items: stretch; gap: 4px; }
      .carte-post .statut .date-validation { text-align: left; }
      .tab-btn { font-size: 13px; padding: 6px 14px; }
      .stats-ligne .stat-item .nombre { font-size: 18px; }
      .sous-tab-btn { font-size: 11px; padding: 4px 12px; }
      .modal-contenu { padding: 20px 16px; }
      .modal-contenu h3 { font-size: 17px; }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    // Chargement simplifié du header
    fetch('/medit/header.html')
      .then(function(response) { 
        if (!response.ok) {
          throw new Error('Header non trouvé');
        }
        return response.text(); 
      })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-left">
                <div class="header-logo">
                  <a href="/medit/index.html">
                    <span style="font-size:28px;vertical-align:middle;margin-right:8px;">✎❏</span>
                    <strong>Qiraat</strong> <i>lecture</i>
                  </a>
                </div>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" onclick="ouvrirConnexion(); return false;">Se connecter</a>
              </nav>
            </div>
          </header>
        `;
      });

    // ============================================================
    // MODE SOMBRE
    // ============================================================
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      var mode = document.body.classList.contains('dark-mode') ? 'sombre' : 'clair';
      localStorage.setItem('theme', mode);
    }

    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'sombre') {
        document.body.classList.add('dark-mode');
      }
    })();

    function ouvrirConnexion() {
      window.location.href = '/medit/index.html';
    }

    function ouvrirInscription() {
      window.location.href = '/medit/index.html';
    }
  </script>

  <div class="page">

    <h1>Mes textes</h1>
    <p class="sous-titre-page">Retrouvez ici toutes les méditations à lire et celles que vous avez déjà validées.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Textes disponibles :</span>
        <span class="nombre" id="totalPosts">0</span>
      </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Vos textes vont s'afficher ici dans un instant...</p>
      </div>
    </div>

    <div class="devise">
      “Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?” — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // mes-textes.html - Logique principale
    // ============================================================

    var toutesLesReponses = {};
    var postsData = [];
    var niveauEtudiant = 0;
    var ongletActuel = 'a-lire';

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        localStorage.removeItem('etudiant_nom');
        window.location.href = '/medit/index.html';
      }
    }

    function ouvrirAnnotations(articleId, titre) {
      var reponse = toutesLesReponses[articleId] || null;
      var annotations = reponse ? reponse.annotations : '';

      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalAnnotations';
      modal.onclick = function(e) {
        if (e.target === this) fermerAnnotations();
      };

      var html = '<div class="modal-contenu">';
      html += '<h3>' + titre + '</h3>';
      html += '<div class="modal-sous-titre">Annotations</div>';

      if (annotations && annotations.trim() !== '') {
        var parts = annotations.split('|');
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split(':');
          if (kv.length === 2) {
            var slideNum = kv[0].replace('slide', '');
            var texte = kv[1];
            html += '<div class="modal-annotation">';
            html += '<strong>Slide ' + slideNum + '</strong>';
            html += texte;
            html += '</div>';
          }
        }
      } else {
        html += '<div class="aucune-annotation">Aucune annotation pour ce texte.</div>';
      }

      html += '<button class="modal-close" onclick="fermerAnnotations()">Fermer</button>';
      html += '</div>';

      modal.innerHTML = html;
      document.body.appendChild(modal);
    }

    function fermerAnnotations() {
      var modal = document.getElementById('modalAnnotations');
      if (modal) modal.remove();
    }

    function chargerTableauDeBord() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          postsData = data.posts || [];

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              toutesLesReponses[r.articleId] = r;
            });
          }

          document.getElementById('totalPosts').textContent = postsData.length;

          if (postsData.length === 0) {
            afficherVide();
          } else {
            afficherAvecOnglets(postsData);
          }
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            postsData = cache.posts || [];
            document.getElementById('totalPosts').textContent = postsData.length;
            afficherAvecOnglets(postsData);
          } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('contenu').innerHTML = `
              <div class="vide">
                <span class="icone">⚠️</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion.</p>
                <button onclick="DataManager.rafraichir(); location.reload();" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid #d1ccc4;border-radius:4px;cursor:pointer;">
                  Réessayer
                </button>
              </div>
            `;
          }
        });
    }

    function estPostLu(post) {
      var reponse = toutesLesReponses[post.id];
      if (!reponse) return false;
      var bonnes = reponse.bonnes || 0;
      var total = reponse.total || 0;
      if (total === 1 && bonnes === 1) return true;
      if (total > 0 && bonnes >= Math.ceil(total / 2)) return true;
      return false;
    }

    function afficherAvecOnglets(posts) {
      var contenu = document.getElementById('contenu');
      document.getElementById('loader').style.display = 'none';

      var total = posts.length;
      var valides = 0;
      var aFaire = 0;

      posts.forEach(function(post) {
        if (estPostLu(post)) {
          valides++;
        } else {
          aFaire++;
        }
      });

      var categories = {};
      posts.forEach(function(post) {
        var cat = post.categorie || 'Sans catégorie';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(post);
      });
      var categoriesTriees = Object.keys(categories).sort();

      var tabsHtml = `
        <button class="tab-btn active" data-tab="a-lire" onclick="switchOnglet('a-lire')">
          À lire
          <span class="compteur-tab">${aFaire}</span>
        </button>
        <button class="tab-btn" data-tab="lus" onclick="switchOnglet('lus')">
          Lus
          <span class="compteur-tab">${valides}</span>
        </button>
      `;
      document.getElementById('tabsContainer').innerHTML = tabsHtml;

      contenu.innerHTML = `
        <div id="contenu-onglet">
          <div class="loader" style="display:none;"><div class="spinner"></div></div>
        </div>
      `;

      afficherOnglet('a-lire', categoriesTriees, categories);
    }

    function afficherOnglet(onglet, categoriesTriees, categories) {
      var container = document.getElementById('contenu-onglet');
      if (!container) return;

      var html = '';
      html += `<div class="sous-tabs-container" id="sous-tabs">`;

      var totalPosts = 0;
      categoriesTriees.forEach(function(cat) {
        categories[cat].forEach(function(post) {
          if (onglet === 'a-lire' && !estPostLu(post)) totalPosts++;
          if (onglet === 'lus' && estPostLu(post)) totalPosts++;
        });
      });
      html += `
        <button class="sous-tab-btn active" data-sous-tab="toutes" onclick="switchCategorie('toutes')">
          Toutes
          <span class="compteur-sous-tab">${totalPosts}</span>
        </button>
      `;

      categoriesTriees.forEach(function(cat) {
        var count = 0;
        categories[cat].forEach(function(post) {
          if (onglet === 'a-lire' && !estPostLu(post)) count++;
          if (onglet === 'lus' && estPostLu(post)) count++;
        });
        if (count > 0) {
          html += `
            <button class="sous-tab-btn" data-sous-tab="${cat}" onclick="switchCategorie('${cat}')">
              ${cat}
              <span class="compteur-sous-tab">${count}</span>
            </button>
          `;
        }
      });

      html += `</div>`;
      html += `<div id="sous-contenu"></div>`;

      container.innerHTML = html;

      var postsFiltres = filtrerPosts(onglet, 'toutes');
      afficherPosts(postsFiltres);
    }

    function switchOnglet(onglet) {
      ongletActuel = onglet;

      document.querySelectorAll('.tab-btn').forEach(function(el) {
        el.classList.remove('active');
        if (el.dataset.tab === onglet) {
          el.classList.add('active');
        }
      });

      var categories = {};
      postsData.forEach(function(post) {
        var cat = post.categorie || 'Sans catégorie';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(post);
      });
      var categoriesTriees = Object.keys(categories).sort();

      afficherOnglet(onglet, categoriesTriees, categories);
    }

    function switchCategorie(categorie) {
      var container = document.getElementById('sous-tabs');
      if (container) {
        container.querySelectorAll('.sous-tab-btn').forEach(function(el) {
          el.classList.remove('active');
          var cat = el.dataset.sousTab;
          if (cat === categorie) {
            el.classList.add('active');
          }
        });
      }

      var postsFiltres = filtrerPosts(ongletActuel, categorie);
      afficherPosts(postsFiltres);
    }

    function filtrerPosts(onglet, categorie) {
      var resultats = [];

      postsData.forEach(function(post) {
        var estLu = estPostLu(post);
        if (onglet === 'a-lire' && estLu) return;
        if (onglet === 'lus' && !estLu) return;

        var catPost = post.categorie || 'Sans catégorie';
        if (categorie !== 'toutes' && catPost !== categorie) return;

        resultats.push(post);
      });

      return resultats;
    }

    function afficherPosts(posts) {
      var container = document.getElementById('sous-contenu');
      if (!container) return;

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="vide" style="padding:30px 20px;">
            <span class="icone" style="font-size:32px;">📭</span>
            <h2 style="font-size:18px;">Aucun texte</h2>
            <p style="font-size:14px;">Aucun texte dans cette catégorie.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille">';

      posts.forEach(function(post) {
        var reponse = toutesLesReponses[post.id] || null;
        var dateValidation = '';
        var retenir = '';
        var estLu = false;
        var estValide = false;

        if (reponse) {
          var bonnes = reponse.bonnes || 0;
          var total = reponse.total || 0;
          dateValidation = reponse.date || '';
          retenir = reponse.retenir || '';

          if (total === 1 && bonnes === 1) {
            estLu = true;
            estValide = true;
          } else if (total > 0 && bonnes >= Math.ceil(total / 2)) {
            estValide = true;
          }
        }

        var hasQuiz = post.hasQuiz || false;
        var hasQuestion = post.hasQuestion || false;
        var mots = post.mots || 0;

        var nbQuestions = 0;
        if (hasQuiz) nbQuestions++;
        if (hasQuestion) nbQuestions++;

        var metaHtml = '';

        if (ongletActuel === 'a-lire') {
          metaHtml = '<span class="badge-icone">Nbr questions : ' + nbQuestions + '</span>';
        } else {
          var resultatHtml = '';
          var questionHtml = '';
          var annoteHtml = '';

          if (reponse) {
            var bonnes = reponse.bonnes || 0;
            var total = reponse.total || 0;
            if (total > 0) {
              resultatHtml = '<span class="badge-icone">Résultat : ' + bonnes + '/' + total + '</span>';
            }

            var reponseOuverte = reponse.reponseOuverte || '';
            if (reponseOuverte && reponseOuverte.trim() !== '') {
              questionHtml = '<span class="badge-icone">Question envoyée ✓</span>';
            } else if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }

            var annotations = reponse.annotations || '';
            if (annotations && annotations.trim() !== '') {
              annoteHtml = '<span class="badge-icone clickable" onclick="event.stopPropagation(); ouvrirAnnotations(\'' + post.id + '\', \'' + post.titre.replace(/'/g, "\\'") + '\');">Annoté ✓</span>';
            } else {
              annoteHtml = '<span class="badge-icone">Non annoté</span>';
            }
          } else {
            resultatHtml = '<span class="badge-icone">Résultat : 0/0</span>';
            if (hasQuestion) {
              questionHtml = '<span class="badge-icone">Question non envoyée</span>';
            }
            annoteHtml = '<span class="badge-icone">Non annoté</span>';
          }

          metaHtml = resultatHtml + questionHtml + annoteHtml;
        }

        var dateHtml = '';
        var dateLabelHtml = '';

        if (estLu && dateValidation) {
          var d = new Date(dateValidation);
          if (!isNaN(d.getTime())) {
            var dateStr = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
            var heureStr = d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
            dateLabelHtml = '<span class="date-label visible">Lu le</span>';
            dateHtml = '<span class="date-validation visible">' + dateStr + ' à ' + heureStr + '</span>';
          }
        }

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre visible">
              <strong>À retenir</strong>
              ${retenir}
            </div>
          `;
        }

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

        html += `
          <div class="carte-post" onclick="window.location.href='/medit/article.html?id=${post.id}'">
            <div class="infos">
              <div class="titre">${post.titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${post.niveau}</span>
                ${metaHtml}
                ${motsHtml}
                ${retenirHtml}
              </div>
            </div>
            <div class="statut">
              ${dateLabelHtml}
              ${dateHtml}
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function afficherVide() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('contenu').innerHTML = `
        <div class="vide">
          <span class="icone">📭</span>
          <h2>Aucune méditation disponible</h2>
          <p>De nouvelles méditations seront ajoutées prochainement.</p>
          <p style="font-size:13px;color:#b8b0a8;margin-top:4px;">Votre niveau actuel : ${niveauEtudiant}</p>
        </div>
      `;
      document.getElementById('tabsContainer').innerHTML = '';
    }

    function demarrer() {
      chargerTableauDeBord();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
