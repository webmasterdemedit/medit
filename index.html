<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon mini-blog</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1a1a2e;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      border-bottom: 3px solid #2d6a4f;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .post {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid #eef2f6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .post h2 {
      font-size: 20px;
      color: #1a3a4a;
      margin-bottom: 6px;
    }

    .post .meta {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .post .meta .label {
      display: inline-block;
      background: #e8f5e9;
      color: #2d6a4f;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
    }

    .post .contenu {
      font-size: 15px;
      color: #475569;
      line-height: 1.8;
    }

    .chargement {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }

    .erreur {
      text-align: center;
      padding: 40px;
      color: #b33;
    }
  </style>
</head>
<body>

  <h1>📖 Mon mini-blog</h1>
  <div id="listePosts">
    <div class="chargement">⏳ Chargement des articles...</div>
  </div>

  <script>
    // 🔥 REMPLACE PAR L'URL DE TON SCRIPT
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhmh8QffwNJG1ZXEHx4MdgANvjSUQMDXyebi0W9iIkOv0iGPrXYDfWKaVTrJvi_d5h/exec';

    function chargerPosts() {
      var container = document.getElementById('listePosts');

      var url = SCRIPT_URL + '?action=getPosts';

      fetch(url)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (data.success && data.posts.length > 0) {
            var html = '';
            data.posts.forEach(function(post) {
              html += '<div class="post">';
              html += '<h2>' + post.titre + '</h2>';
              html += '<div class="meta">';
              if (post.date) html += post.date + ' ';
              post.labels.forEach(function(label) {
                html += '<span class="label">' + label + '</span> ';
              });
              html += '</div>';
              html += '<div class="contenu">' + post.contenu.replace(/\n/g, '<br>') + '</div>';
              html += '</div>';
            });
            container.innerHTML = html;
          } else {
            container.innerHTML = '<div class="chargement">📭 Aucun article pour le moment.</div>';
          }
        })
        .catch(function(error) {
          console.error('Erreur:', error);
          container.innerHTML = '<div class="erreur">❌ Erreur de chargement.</div>';
        });
    }

    chargerPosts();
  </script>

</body>
</html>
