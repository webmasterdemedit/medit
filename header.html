<style>
/* Bande jaune old school pastel en bas du header */
.header-bande-jaune {
  height: 8px;
  width: 100%;
  background: linear-gradient(
    to right,
    #f5e6a8 0%,
    #f7e9b0 15%,
    #f3dfa0 30%,
    #f8ecb8 50%,
    #f3dfa0 70%,
    #f7e9b0 85%,
    #f5e6a8 100%
  );
  border-top: 1px solid #e8d48a;
  border-bottom: 1px solid #d9c47a;
  box-shadow: 
    inset 0 1px 0 rgba(255, 255, 255, 0.5),
    0 1px 2px rgba(0, 0, 0, 0.04);
}

/* Optionnel : petite texture "old school" avec des points discrets */
.header-bande-jaune::after {
  content: "";
  display: block;
  height: 100%;
  background-image: radial-gradient(
    circle,
    rgba(200, 170, 80, 0.15) 1px,
    transparent 1px
  );
  background-size: 6px 6px;
}
</style>

<script>
// Définir la fonction globalement
window.deconnecter = function() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
};
</script>
