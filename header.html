<!-- ============================================================
   HEADER - Navigation principale
   ============================================================ -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-logo">
        <a href="/medit/index.html">
          <span style="font-size:28px;vertical-align:middle;margin-right:8px;">✎❏</span>
          <strong>Qiraat</strong> <i>lecture</i>
        </a>
      </div>
      <span id="headerUserName" class="header-username"></span>
    </div>
    <nav class="header-nav" id="headerNav">
      <!-- Les liens sont gérés par JavaScript -->
    </nav>
  </div>
</header>

<script>
// ============================================================
// MODE SOMBRE
// ============================================================
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  var mode = document.body.classList.contains('dark-mode') ? 'sombre' : 'clair';
  localStorage.setItem('theme', mode);
}

// Restaurer le thème au chargement
(function() {
  var theme = localStorage.getItem('theme');
  if (theme === 'sombre') {
    document.body.classList.add('dark-mode');
  }
})();

// ============================================================
// FONCTIONS HEADER
// ============================================================
function mettreAJourHeader() {
  var id = localStorage.getItem('etudiant_id');
  var nav = document.getElementById('headerNav');

  if (nav) {
    if (id) {
      nav.innerHTML = `
        <a href="#" class="header-link" onclick="toggleDarkMode(); return false;">🌓</a>
        <a href="#" class="header-link" onclick="ouvrirAjoutPost(); return false;">Ajouter un post</a>
        <a href="/medit/mes-textes.html" class="header-link">Mes textes</a>
        <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
      `;
    } else {
      nav.innerHTML = `
        <a href="#" class="header-link" onclick="toggleDarkMode(); return false;">🌓</a>
        <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
        <a href="#" class="header-link" onclick="ouvrirInscription(); return false;">S'inscrire</a>
      `;
    }
  }
}

// ============================================================
// AJOUTER UN POST - OUVERTURE/FERMETURE (pour le modal)
// ============================================================
function ouvrirAjoutPost() {
  var modal = document.getElementById('modalAjoutPost');
  if (modal) {
    modal.style.display = 'flex';
    document.getElementById('inputTitre').value = '';
    document.getElementById('inputNiveau').value = '';
    document.getElementById('inputCategorie').value = '';
    document.getElementById('inputContenu').value = '';
    document.getElementById('inputQuestion').value = '';
    document.getElementById('inputTitre').focus();
  }
}

function fermerAjoutPost() {
  var modal = document.getElementById('modalAjoutPost');
  if (modal) {
    modal.style.display = 'none';
  }
}

function creerPost() {
  var titre = document.getElementById('inputTitre').value.trim();
  var niveau = document.getElementById('inputNiveau').value.trim();
  var categorie = document.getElementById('inputCategorie').value.trim();
  var contenu = document.getElementById('inputContenu').value.trim();
  var question = document.getElementById('inputQuestion').value.trim();

  if (!titre) { alert('Veuillez saisir un titre'); return; }
  if (!niveau) { alert('Veuillez saisir un niveau'); return; }
  if (!contenu) { alert('Veuillez saisir le contenu'); return; }

  var btn = document.querySelector('#formAjoutPost .btn-submit');
  btn.textContent = 'Création...';
  btn.disabled = true;

  DataManager.ajouterPost(titre, parseInt(niveau), categorie, contenu, question)
    .then(function() {
      alert('✅ Post créé avec succès !');
      fermerAjoutPost();
      btn.textContent = 'Créer';
      btn.disabled = false;
      if (window.location.pathname.includes('mes-textes.html')) {
        window.location.reload();
      }
    })
    .catch(function(err) {
      alert('❌ Erreur : ' + err.message);
      btn.textContent = 'Créer';
      btn.disabled = false;
    });
}

function ouvrirConnexion() {
  window.location.href = '/medit/index.html';
}

function ouvrirInscription() {
  window.location.href = '/medit/index.html';
}
</script>
