<style>
.header-btn-deconnexion {
  padding: 6px 16px;
  background: transparent;
  color: #6b7a8a;
  border: 1px solid #d1ccc4;
  border-radius: 30px;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
  transition: all 0.3s ease;
}

.header-btn-deconnexion:hover {
  background: #e8e5e0;
  color: #2c2c2c;
}

body.dark-mode .header-btn-deconnexion {
  color: #b8b0a8;
  border-color: #3a3a3a;
}

body.dark-mode .header-btn-deconnexion:hover {
  background: #2a2a2a;
  color: #e8e5e0;
}
</style>

<script>
function deconnecter() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
}
</script>
