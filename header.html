<!-- header.html -->
<header class="site-header">
  <div class="header-inner">

    <!-- Logo + nom centrés -->
    <div class="header-center">
      <a href="/medit/textes.html" class="header-logo-link">
        <span class="header-logo-icone">❏✎</span>
        <strong class="header-logo-nom">Qiraat</strong>
      </a>
      <span class="header-sous-titre">Textes islamiques de W. Khan, avec exercices interactifs.</span>
    </div>

    <!-- Bouton hamburger (visible uniquement <= 768px) -->
    <button class="header-burger" id="headerBurger" onclick="toggleMenuMobile()" aria-label="Ouvrir le menu" aria-expanded="false">
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
    </button>

    <!-- Navigation -->
    <nav class="header-nav" id="headerNav">
      <a href="/medit/les-textes.html" class="header-link">Les textes</a>
      <a href="/medit/les-thèmes.html" class="header-link">Les thèmes</a>
      <a href="/medit/programme.html" class="header-link">Programme</a>

      <!-- Le JS injecte ici : soit "Créer un compte lecteur", soit "Mon espace + Déconnexion" -->
      <span id="headerActions"></span>
    </nav>

  </div>
</header>

<!-- Overlay pour fermer le menu mobile -->
<div class="header-mobile-overlay" id="headerMobileOverlay" onclick="fermerMenuMobile()"></div>

<style>
/* ============================================================
   HEADER — Centré, sobre, responsive
   ============================================================ */
.site-header {
  background: var(--header-bg, #ffffff);
  color: var(--header-text, #111111);
  border-bottom: 1px solid var(--border, #cccccc);
  box-shadow: none;
  position: relative;
  z-index: 100;
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 14px 28px;
  box-sizing: border-box;
  min-height: 72px;
}

/* --- Bloc central : logo + nom + sous-titre --- */
.header-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 2px;
}

.header-logo-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--header-text, #111111);
}

.header-logo-icone {
  font-size: 26px;
  line-height: 1;
}

.header-logo-nom {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--header-text, #111111);
}

.header-sous-titre {
  display: block;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 11px;
  color: var(--header-muted, #777777);
  text-align: center;
  margin: 0;
}

/* --- Navigation (desktop) : placée à droite en absolu --- */
.header-nav {
  position: absolute;
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 22px;
}

.header-link {
  color: var(--header-text, #111111);
  text-decoration: none;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 14px;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: border-color 0.18s ease;
}
.header-link:hover {
  border-bottom-color: var(--text, #111111);
}

/* Bouton principal visiteur */
.header-btn-creer {
  display: inline-block;
  background: transparent;
  color: var(--header-text, #111111);
  border: 1px solid var(--border-hover, #aaaaaa);
  padding: 7px 16px;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.header-btn-creer:hover {
  background: var(--bg-hover, #f5f5f5);
  border-color: var(--text, #111111);
}

/* Boutons utilisateur connecté */
.header-btn-compte {
  display: inline-block;
  background: transparent;
  color: var(--header-text, #111111);
  border: 1px solid var(--border, #cccccc);
  padding: 6px 14px;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 13px;
  text-decoration: none;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.header-btn-compte:hover {
  background: var(--bg-hover, #f5f5f5);
  border-color: var(--border-hover, #aaaaaa);
}
.header-btn-deconnexion {
  background: transparent;
  color: var(--header-muted, #777777);
  border: none;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 0;
  transition: color 0.15s ease;
}
.header-btn-deconnexion:hover {
  color: var(--header-text, #111111);
}

/* --- Bouton hamburger (caché par défaut) --- */
.header-burger {
  display: none;
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
}
.header-burger .burger-bar {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--header-text, #111111);
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.header-burger[aria-expanded="true"] .burger-bar:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.header-burger[aria-expanded="true"] .burger-bar:nth-child(2) {
  opacity: 0;
}
.header-burger[aria-expanded="true"] .burger-bar:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* --- Overlay --- */
.header-mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  z-index: 90;
}
.header-mobile-overlay.visible {
  display: block;
}

/* ============================================================
   RESPONSIVE — Tablettes et téléphones
   ============================================================ */
@media (max-width: 900px) {
  .header-nav {
    gap: 16px;
    right: 20px;
  }
  .header-link {
    font-size: 13px;
  }
}

@media (max-width: 768px) {
  .header-inner {
    padding: 12px 20px;
    min-height: 64px;
  }
  .header-logo-icone {
    font-size: 22px;
  }
  .header-logo-nom {
    font-size: 19px;
  }
  .header-sous-titre {
    font-size: 10px;
    max-width: 260px;
  }

  /* Afficher le hamburger */
  .header-burger {
    display: flex;
  }

  /* Transforme le nav en panneau coulissant */
  .header-nav {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: 260px;
    max-width: 80vw;
    background: var(--bg-paper, #ffffff);
    border-left: 1px solid var(--border, #cccccc);
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 0;
    padding: 80px 24px 24px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 95;
    box-sizing: border-box;
    overflow-y: auto;
  }
  .header-nav.open {
    transform: translateX(0);
  }

  .header-link {
    display: block;
    width: 100%;
    font-size: 15px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border, #cccccc);
  }
  .header-link:hover {
    border-bottom-color: var(--border, #cccccc);
  }

  /* Les boutons dans le menu mobile */
  #headerActions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    margin-top: 20px;
  }
  .header-btn-creer,
  .header-btn-compte {
    width: 100%;
    text-align: center;
    padding: 12px 16px;
    font-size: 14px;
    box-sizing: border-box;
  }
  .header-btn-deconnexion {
    width: 100%;
    text-align: center;
    padding: 12px 16px;
    font-size: 14px;
    border: 1px solid var(--border, #cccccc);
  }
}
</style>

<script>
// ============================================================
// INJECTION DES BOUTONS SELON ÉTAT CONNEXION
// ============================================================
function majActionsHeader() {
  var container = document.getElementById('headerActions');
  if (!container) return;

  var id = localStorage.getItem('etudiant_id');
  var nom = localStorage.getItem('etudiant_nom') || id || '';

  if (id) {
    // === Connecté : Mon espace + Déconnexion ===
    container.innerHTML =
      '<a href="/medit/mon-compte.html" class="header-btn-compte">Mon espace</a>' +
      '<button onclick="window.deconnecter()" class="header-btn-deconnexion">Déconnexion</button>';
  } else {
    // === Visiteur : Créer un compte lecteur ===
    container.innerHTML =
      '<a href="/medit/index.html" class="header-btn-creer">Créer un compte lecteur</a>';
  }
}

// ============================================================
// MENU MOBILE (hamburger)
// ============================================================
function toggleMenuMobile() {
  var nav = document.getElementById('headerNav');
  var burger = document.getElementById('headerBurger');
  var overlay = document.getElementById('headerMobileOverlay');
  if (!nav || !burger) return;

  var ouvert = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  if (overlay) overlay.classList.toggle('visible', ouvert);
}

function fermerMenuMobile() {
  var nav = document.getElementById('headerNav');
  var burger = document.getElementById('headerBurger');
  var overlay = document.getElementById('headerMobileOverlay');
  if (nav) nav.classList.remove('open');
  if (burger) burger.setAttribute('aria-expanded', 'false');
  if (overlay) overlay.classList.remove('visible');
}

// Ferme le menu si on clique sur un lien
document.addEventListener('click', function(e) {
  var nav = document.getElementById('headerNav');
  if (!nav) return;
  if (e.target.closest('.header-link') || e.target.closest('#headerActions a')) {
    fermerMenuMobile();
  }
});

// ============================================================
// DÉCONNEXION
// ============================================================
window.deconnecter = function() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
};

// ============================================================
// INIT
// ============================================================
majActionsHeader();

// Écoute les changements de localStorage (si login dans un autre onglet)
window.addEventListener('storage', function(e) {
  if (e.key === 'etudiant_id' || e.key === 'etudiant_nom') {
    majActionsHeader();
  }
});

// Expose pour que les pages puissent rafraîchir après login
window.majActionsHeader = majActionsHeader;
</script>
