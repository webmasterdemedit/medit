<!-- header.html -->
<header class="site-header">
  <div class="header-inner">

    <div class="header-center">
      <a href="/medit/index.html" class="header-logo-link">
        <span class="header-logo-icone">❏✎</span>
        <strong class="header-logo-nom">Qiraat</strong>
      </a>
      <span class="header-sous-titre">Textes islamiques de W. Khan, avec exercices interactifs.</span>
    </div>

    <button class="header-burger" id="headerBurger" onclick="toggleMenuMobile()" aria-label="Ouvrir le menu" aria-expanded="false">
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
    </button>

    <nav class="header-nav" id="headerNav">
      <a href="/medit/les-textes.html" class="header-link">Les textes</a>
      <a href="/medit/les-thèmes.html" class="header-link">Les thèmes</a>
      <a href="/medit/programme.html" class="header-link">Programme</a>
      <span id="headerActions"></span>
    </nav>

  </div>
</header>

<div class="header-mobile-overlay" id="headerMobileOverlay" onclick="fermerMenuMobile()"></div>

<script>
function majActionsHeader() {
  var container = document.getElementById('headerActions');
  if (!container) return;
  var id = localStorage.getItem('etudiant_id');
  if (id) {
    container.innerHTML =
      '<a href="/medit/mon-compte.html" class="header-btn-compte">Mon espace</a>' +
      '<button onclick="window.deconnecter()" class="header-btn-deconnexion">Déconnexion</button>';
  } else {
    container.innerHTML =
      '<a href="/medit/index.html" class="header-btn-creer">Créer un compte lecteur</a>';
  }
}

function toggleMenuMobile() {
  var nav = document.getElementById('headerNav');
  var burger = document.getElementById('headerBurger');
  var overlay = document.getElementById('headerMobileOverlay');
  if (!nav || !burger) return;
  var ouvert = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  if (overlay) overlay.classList.toggle('visible', ouvert);
}

function fermerMenuMobile() {
  var nav = document.getElementById('headerNav');
  var burger = document.getElementById('headerBurger');
  var overlay = document.getElementById('headerMobileOverlay');
  if (nav) nav.classList.remove('open');
  if (burger) burger.setAttribute('aria-expanded', 'false');
  if (overlay) overlay.classList.remove('visible');
}

document.addEventListener('click', function(e) {
  var nav = document.getElementById('headerNav');
  if (!nav) return;
  if (e.target.closest('.header-link') || e.target.closest('#headerActions a')) {
    fermerMenuMobile();
  }
});

window.deconnecter = function() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
};

majActionsHeader();

window.addEventListener('storage', function(e) {
  if (e.key === 'etudiant_id' || e.key === 'etudiant_nom') {
    majActionsHeader();
  }
});

window.majActionsHeader = majActionsHeader;
</script>
