<!-- Section bande jaune old school pastel, APRÈS le header -->
<section class="bande-jaune-old-school"></section>

<style>
/* Bande jaune old school pastel — section autonome après le header */
.bande-jaune-old-school {
  display: block;
  width: 100%;
  height: 14px;
  background: linear-gradient(
    to right,
    #f5e6a8 0%,
    #f7e9b0 20%,
    #f3dfa0 50%,
    #f7e9b0 80%,
    #f5e6a8 100%
  );
  border-top: 1px solid #e8d48a;
  border-bottom: 1px solid #d9c47a;
  box-shadow: 
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1px 0 rgba(180, 150, 70, 0.15),
    0 1px 3px rgba(0, 0, 0, 0.05);
  position: relative;
}

/* Texture "old school" discrète par-dessus */
.bande-jaune-old-school::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(
    circle,
    rgba(190, 160, 70, 0.18) 1px,
    transparent 1px
  );
  background-size: 5px 5px;
  pointer-events: none;
}

/* Si le header est sticky/fixed, décale la bande pour qu'elle suive juste en dessous */
.site-header + .bande-jaune-old-school {
  margin-top: 0;
}
</style>

<script>
window.deconnecter = function() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
};
</script>
