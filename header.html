<!-- header.html -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-logo">
        <a href="/medit/index.html">
          <span style="font-size:28px;vertical-align:middle;margin-right:8px;">❏✎</span>
          <strong>Qiraat</strong> <i>lecture</i>
        </a>
      </div>
    </div>
    <nav class="header-nav" id="headerNav">
      <a href="/medit/admin.html" class="header-link">Admin</a>
      <a href="/medit/mes-livrets.html" class="header-link">Mes livrets</a>
      <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
      <button onclick="window.deconnecter()" class="header-btn-deconnexion">Déconnexion</button>
    </nav>
  </div>
</header>

<script>
// Définir la fonction globalement pour qu'elle soit accessible partout
window.deconnecter = function() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('etudiant_id');
    localStorage.removeItem('etudiant_nom');
    localStorage.removeItem('etudiant_niveau');
    window.location.href = '/medit/index.html';
  }
};

// Auto-injection : si le header est chargé directement dans une page, on le met en haut
(function() {
  // Vérifie si le header est déjà présent dans la page
  if (document.querySelector('.site-header')) {
    return; // déjà présent, on ne fait rien
  }
  
  // Récupère le HTML du header
  var headerHTML = document.currentScript.previousElementSibling.outerHTML;
  
  // Insère le header en début de body
  document.body.innerHTML = headerHTML + document.body.innerHTML;
  
  // Supprime le script pour éviter une boucle
  document.currentScript.remove();
})();
</script>
