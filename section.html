<!-- section.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Section - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-section h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-section .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .grille-livrets {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Carte livret (même style que carte-blog) */
    .carte-livret {
      display: flex;
      gap: 0;
      padding: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
      overflow: hidden;
    }

    .carte-livret:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-livret .livret-couverture {
      flex: 0 0 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #f5f5f5;
    }

    .carte-livret .livret-couverture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carte-livret .livret-couverture .couverture-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }

    .carte-livret .livret-centre {
      display: flex;
      gap: 20px;
      flex: 1;
      min-width: 0;
      padding: 18px 20px;
      box-sizing: border-box;
    }

    .carte-livret .livret-numero {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
      border-right: 1px solid var(--border);
      padding-right: 14px;
      box-sizing: border-box;
    }

    .carte-livret .livret-corps {
      flex: 1;
      min-width: 0;
    }

    .carte-livret .livret-titre {
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .carte-livret .livret-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .carte-livret .livret-meta .badge-icone,
    .carte-livret .livret-meta .niveau-badge {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .carte-livret .livret-sous-titre {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .vide-section {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-section .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-section { padding: 12px 16px 30px; }
      .page-section h1 { font-size: 22px; }

      .carte-livret .livret-couverture {
        flex: 0 0 64px;
      }

      .carte-livret .livret-centre {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
      }

      .carte-livret .livret-numero {
        flex: 0 0 36px;
        font-size: 18px;
        padding-right: 10px;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-section">

    <h1 id="titreSection">Section</h1>
    <p class="sous-titre-page">Tous les livrets de cette section. Cliquez sur un livret pour voir ses textes.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Livrets :</span>
        <span class="nombre" id="totalLivrets">0</span>
      </div>
      <div class="stat-item">
        <span>Textes :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement de la section...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ===== UTILITAIRES =====
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    // ===== CHARGEMENT =====
    function chargerSection() {
      var params = new URLSearchParams(window.location.search);
      var section = (params.get('section') || '').trim();
      var conteneur = document.getElementById('contenu');

      if (!section) {
        document.getElementById('loader').style.display = 'none';
        conteneur.innerHTML = `
          <div class="vide-section">
            <span class="icone">◈</span>
            <h2>Aucune section spécifiée</h2>
            <p><a href="/medit/présentation.html" style="color:var(--text-secondary);">Voir tous les textes</a></p>
          </div>
        `;
        return;
      }

      document.getElementById('titreSection').textContent = section;
      document.title = section + ' - Qiraat';

      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');

      DataManager.charger()
        .then(function(data) {
          afficherSection(data, section);
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) afficherSection(cache, section);
          else {
            document.getElementById('loader').style.display = 'none';
            conteneur.innerHTML = `
              <div class="vide-section">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    function afficherSection(data, sectionDemandee) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var themes = data.themes || [];
      var textes = data.tousLesTextes || data.textes || [];

      var cible = normaliserComparaison(sectionDemandee);

      // 1. Livrets appartenant à cette section
      var livrets = themes.filter(function(l) {
        return normaliserComparaison(l.theme || '') === cible && l.titre;
      });

      livrets.sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });

      // 2. Compter les textes par livret
      var compteTextes = {};
      textes.forEach(function(t) {
        var cat = (t.categorie || '').trim();
        if (cat) compteTextes[cat] = (compteTextes[cat] || 0) + 1;
      });

      var totalTextes = 0;
      livrets.forEach(function(l) {
        totalTextes += compteTextes[l.titre] || 0;
      });

      document.getElementById('totalLivrets').textContent = livrets.length;
      document.getElementById('totalTextes').textContent = totalTextes;

      var conteneur = document.getElementById('contenu');

      if (livrets.length === 0) {
        conteneur.innerHTML = `
          <div class="vide-section">
            <span class="icone">◈</span>
            <h2>Aucun livret dans cette section</h2>
            <p><a href="/medit/présentation.html" style="color:var(--text-secondary);">Voir tous les textes</a></p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille-livrets">';
      livrets.forEach(function(l) {
        html += construireCarteLivret(l, compteTextes[l.titre] || 0);
      });
      html += '</div>';

      conteneur.innerHTML = html;
    }

    function construireCarteLivret(livret, nbTextes) {
      var titre = livret.titre || '';
      var numero = extraireNumeroTexte(titre);
      var titreAffiche = titre.replace(/^\s*\d+\s+/, '').trim();
      var sousTitre = livret.sousTitre || livret.description || '';
      var couleur = livret.couleur || '#2d6a4f';
      var couverture = livret.couverture || '';
      var niveau = parseInt(livret.niveau) || 0;

      var numeroHtml = (numero !== Infinity)
        ? '<div class="livret-numero">' + numero + '</div>'
        : '<div class="livret-numero">◆</div>';

      var couvertureHtml = '';
      if (couverture) {
        couvertureHtml = '<div class="livret-couverture"><img src="' + escapeHtml(couverture) + '" alt="" loading="lazy"></div>';
      } else {
        couvertureHtml = '<div class="livret-couverture" style="background:' + couleur + ';">' +
                         '<div class="couverture-fallback">◆</div></div>';
      }

      return `
        <a class="carte-livret" href="/medit/thème.html?cat=${encodeURIComponent(titre)}">
          ${couvertureHtml}
          <div class="livret-centre">
            ${numeroHtml}
            <div class="livret-corps">
              <div class="livret-titre">${escapeHtml(titreAffiche)}</div>
              <div class="livret-meta">
                ${niveau > 0 ? '<span class="niveau-badge">Niveau ' + niveau + '</span>' : ''}
                <span class="badge-icone">${nbTextes} texte${nbTextes > 1 ? 's' : ''}</span>
              </div>
              ${sousTitre ? '<div class="livret-sous-titre">' + escapeHtml(sousTitre) + '</div>' : ''}
            </div>
          </div>
        </a>
      `;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerSection);
    } else {
      chargerSection();
    }
  </script>

</body>
</html>
