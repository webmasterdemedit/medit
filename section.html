<!-- section.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Section - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-section h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-section .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* === GRILLE (comme les-thèmes.html) === */
    .grille-livrets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      justify-items: stretch;
    }

    .grille-livrets .carte-avec-bas {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .grille-livrets .carte-bas {
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-top: none;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      box-sizing: border-box;
    }

    .grille-livrets .carte-bas .ligne-compteurs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .grille-livrets .carte-bas .compteur-badge {
      padding: 2px 8px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .vide-section {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    .vide-section .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-section { padding: 12px 16px 30px; }
      .page-section h1 { font-size: 22px; }
      .grille-livrets {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-section">

    <h1 id="titreSection">Section</h1>
    <p class="sous-titre-page">Tous les livrets de cette section. Cliquez sur un livret pour voir ses textes.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Livrets :</span>
        <span class="nombre" id="totalLivrets">0</span>
      </div>
      <div class="stat-item">
        <span>Textes :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement de la section...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/couverture.js"></script>

  <script>
    var etatValidation = {};

    function normaliserComparaison(str) {
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function estTexteValide(texteId) {
      var e = etatValidation[String(texteId)];
      return e && e.valide;
    }

    function chargerSection() {
      var params = new URLSearchParams(window.location.search);
      var section = (params.get('section') || '').trim();
      var conteneur = document.getElementById('contenu');

      if (!section) {
        document.getElementById('loader').style.display = 'none';
        conteneur.innerHTML = `
          <div class="vide-section">
            <span class="icone">◈</span>
            <h2>Aucune section spécifiée</h2>
            <p><a href="/medit/présentation.html" style="color:var(--text-secondary);">Voir tous les textes</a></p>
          </div>
        `;
        return;
      }

      document.getElementById('titreSection').textContent = section;
      document.title = section + ' - Qiraat';

      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      Promise.all([
        DataManager.charger(),
        fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(id))
          .then(function(r) { return r.json(); })
          .then(function(d) { return (d && d.tentatives) ? d.tentatives : []; })
          .catch(function() { return []; })
      ]).then(function(resultats) {
        var data = resultats[0];
        var tentatives = resultats[1];

        etatValidation = {};
        tentatives.forEach(function(t) {
          var k = String(t.texteId);
          var pct = t.pourcentage || 0;
          if (!etatValidation[k] || pct > etatValidation[k].pourcentage) {
            etatValidation[k] = {
              valide: pct >= 65,
              pourcentage: pct
            };
          }
        });

        afficherSection(data, section);
      }).catch(function(error) {
        console.error('Erreur chargement:', error);
        var cache = DataManager.getCacheForce(id);
        if (cache) afficherSection(cache, section);
        else {
          document.getElementById('loader').style.display = 'none';
          conteneur.innerHTML = `
            <div class="vide-section">
              <span class="icone">⚠</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion internet.</p>
            </div>
          `;
        }
      });
    }

    function afficherSection(data, sectionDemandee) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var themes = data.themes || [];
      var textes = data.tousLesTextes || data.textes || [];

      var cible = normaliserComparaison(sectionDemandee);

      var livrets = themes.filter(function(l) {
        return normaliserComparaison(l.theme || '') === cible && l.titre;
      });

      livrets.sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });

      var compteTextes = {};
      var textesParCategorie = {};
      textes.forEach(function(t) {
        var cat = (t.categorie || '').trim();
        if (!cat) return;
        compteTextes[cat] = (compteTextes[cat] || 0) + 1;
        if (!textesParCategorie[cat]) textesParCategorie[cat] = [];
        textesParCategorie[cat].push(t);
      });

      var totalTextes = 0;
      livrets.forEach(function(l) {
        totalTextes += compteTextes[l.titre] || 0;
      });

      document.getElementById('totalLivrets').textContent = livrets.length;
      document.getElementById('totalTextes').textContent = totalTextes;

      var conteneur = document.getElementById('contenu');

      if (livrets.length === 0) {
        conteneur.innerHTML = `
          <div class="vide-section">
            <span class="icone">◈</span>
            <h2>Aucun livret dans cette section</h2>
            <p><a href="/medit/présentation.html" style="color:var(--text-secondary);">Voir tous les textes</a></p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille-livrets">';
      livrets.forEach(function(l) {
        var textesDuLivret = textesParCategorie[l.titre] || [];
        var valides = 0;
        textesDuLivret.forEach(function(t) {
          if (estTexteValide(t.id)) valides++;
        });
        var pct = textesDuLivret.length > 0
          ? Math.round((valides / textesDuLivret.length) * 100)
          : 0;

        var carteHtml = construireCarteCouverture({
          titre: l.titre,
          couleur: l.couleur || '#2d6a4f',
          sousTitre: l.sousTitre || l.description || '',
          auteur: l.auteur || '',
          date: l.date || '',
          niveau: parseInt(l.niveau) || 1,
          pourcentage: pct,   // ← barre de progression sur la couverture
          couverture: l.couverture || ''
        }, {
          cliquable: true,
          lien: '/medit/thème.html?cat=' + encodeURIComponent(l.titre)
        });

        // Petit bloc bas (nb textes) sous la carte, comme dans les-thèmes
        var nbTextes = compteTextes[l.titre] || 0;
        var basHtml = ''
          + '<div class="carte-bas">'
          +   '<div class="ligne-compteurs">'
          +     '<span class="compteur-badge">' + nbTextes + ' texte' + (nbTextes > 1 ? 's' : '') + '</span>'
          +   '</div>'
          + '</div>';

        html += '<div class="carte-avec-bas">' + carteHtml + basHtml + '</div>';
      });
      html += '</div>';

      conteneur.innerHTML = html;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerSection);
    } else {
      chargerSection();
    }
  </script>

</body>
</html>
