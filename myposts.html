<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Mes lectures - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-logo">
                <a href="/medit/index.html">Qiraat</a>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
              </nav>
            </div>
          </header>
        `;
        mettreAJourHeader();
      });

    function mettreAJourHeader() {
      var id = localStorage.getItem('etudiant_id');
      var nav = document.getElementById('headerNav');
      var userNameSpan = document.getElementById('headerUserName');

      if (userNameSpan) {
        userNameSpan.textContent = id || '';
      }

      if (nav) {
        if (id) {
          nav.innerHTML = `
            <a href="/medit/myposts.html" class="header-link">Mes textes</a>
            <a href="/medit/myaccount.html" class="header-btn-compte">Mon compte</a>
            <button class="header-btn" onclick="deconnecter()">Se déconnecter</button>
          `;
        } else {
          nav.innerHTML = `
            <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
          `;
        }
      }
    }

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }
  </script>

  <!-- ========== PAGE ========== -->
  <div class="page">

    <div class="niveau-container" id="niveauContainer">
      <div class="niveau-badge">
        <span class="label">Vous êtes inscrit au niveau</span>
        <span class="valeur" id="niveauValeur">—</span>
      </div>
    </div>

    <div class="stats" id="statsContainer">
      <div class="stat-item">
        <span class="nombre" id="totalPosts">0</span>
        <span>disponibles</span>
      </div>
      <div class="stat-item">
        <span class="nombre valide" id="validesPosts">0</span>
        <span>validées</span>
      </div>
      <div class="stat-item">
        <span class="nombre" id="aFairePosts">0</span>
        <span>à faire</span>
      </div>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement...</p>
      </div>
    </div>

    <div class="devise">
      “Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?” — Coran 47:24
    </div>

  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // myposts.html
    // ============================================================

    var toutesLesReponses = {};
    var postsData = [];
    var niveauEtudiant = 0;

    function ouvrirConnexion() {
        window.location.href = '/medit/index.html';
    }

    function ouvrirInscription() {
        window.location.href = '/medit/index.html';
    }

    function deconnecter() {
        if (confirm('Se déconnecter ?')) {
            localStorage.removeItem('etudiant_id');
            localStorage.removeItem('etudiant_niveau');
            window.location.href = '/medit/index.html';
        }
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerTableauDeBord() {
        var id = localStorage.getItem('etudiant_id');
        if (!id) {
            window.location.href = '/medit/index.html';
            return;
        }

        DataManager.charger()
            .then(function(data) {
                niveauEtudiant = data.niveau || 0;
                postsData = data.posts || [];
                
                toutesLesReponses = {};
                if (data.reponses) {
                    data.reponses.forEach(function(r) {
                        toutesLesReponses[r.articleId] = r;
                    });
                }
                
                document.getElementById('niveauValeur').textContent = niveauEtudiant;
                
                if (postsData.length === 0) {
                    afficherVide();
                } else {
                    afficherAvecOnglets(postsData);
                }
            })
            .catch(function() {
                var cache = DataManager.getCacheForce(id);
                if (cache) {
                    niveauEtudiant = cache.niveau || 0;
                    postsData = cache.posts || [];
                    document.getElementById('niveauValeur').textContent = niveauEtudiant;
                    afficherAvecOnglets(postsData);
                } else {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('contenu').innerHTML = `
                        <div class="vide">
                            <span class="icone">◈</span>
                            <h2>Erreur de chargement</h2>
                            <p>Vérifiez votre connexion.</p>
                            <button onclick="DataManager.rafraichir(); location.reload();" 
                                    style="margin-top:12px;padding:10px 24px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;cursor:pointer;">
                                Réessayer
                            </button>
                        </div>
                    `;
                }
            });
    }

    // ============================================================
    // AFFICHAGE
    // ============================================================
    function afficherAvecOnglets(posts) {
        var contenu = document.getElementById('contenu');
        document.getElementById('loader').style.display = 'none';

        var total = 0;
        var valides = 0;
        var aFaire = 0;

        posts.forEach(function(post) {
            total++;
            var reponse = toutesLesReponses[post.id];
            if (reponse) {
                var bonnes = reponse.bonnes || 0;
                var totalQ = reponse.total || 0;
                if (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2)) {
                    valides++;
                } else {
                    aFaire++;
                }
            } else {
                aFaire++;
            }
        });

        document.getElementById('totalPosts').textContent = total;
        document.getElementById('validesPosts').textContent = valides;
        document.getElementById('aFairePosts').textContent = aFaire;

        var cats = {};
        posts.forEach(function(post) {
            var cat = post.categorie || 'Sans catégorie';
            if (!cats[cat]) cats[cat] = [];
            cats[cat].push(post);
        });

        var categoriesTriees = Object.keys(cats).sort();

        var tabsHtml = '';
        categoriesTriees.forEach(function(cat, index) {
            var count = cats[cat].length;
            var activeClass = index === 0 ? 'active' : '';
            tabsHtml += `
                <button class="tab-btn ${activeClass}" data-tab="tab-${index}" onclick="switchTab('tab-${index}')">
                    ${cat}
                    <span class="compteur-tab">${count}</span>
                </button>
            `;
        });
        document.getElementById('tabsContainer').innerHTML = tabsHtml;

        var contenuHtml = '';
        categoriesTriees.forEach(function(cat, index) {
            var activeClass = index === 0 ? 'active' : '';
            var postsDeCat = cats[cat];

            contenuHtml += `<div class="tab-content ${activeClass}" id="tab-${index}">`;
            contenuHtml += '<div class="grille">';
            
            postsDeCat.forEach(function(post) {
                var reponse = toutesLesReponses[post.id];
                var estValide = false;
                var dateValidation = '';
                var retenir = '';
                var estLu = false;

                if (reponse) {
                    var bonnes = reponse.bonnes || 0;
                    var totalQ = reponse.total || 0;
                    dateValidation = reponse.date || '';
                    retenir = reponse.retenir || '';

                    if (totalQ === 1 && bonnes === 1) {
                        estLu = true;
                        estValide = true;
                    } else if (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2)) {
                        estValide = true;
                    }
                }

                var hasQuiz = post.hasQuiz || false;
                var hasQuestion = post.hasQuestion || false;
                var mots = post.mots || 0;

                var badgesHtml = '';
                if (hasQuiz) {
                    badgesHtml += '<span class="badge-icone quiz">Quiz</span>';
                }
                if (hasQuestion) {
                    badgesHtml += '<span class="badge-icone question">Question</span>';
                }

                var btnClass = 'btn-lire';
                var btnText = 'Ouvrir';
                
                if (estValide || estLu) {
                    btnClass += ' reviser';
                    btnText = 'Relire';
                } else if (hasQuiz || hasQuestion) {
                    btnText = 'Faire';
                } else {
                    btnClass += ' lire';
                    btnText = 'Lire';
                }

                var badgeHtml = '';
                var dateHtml = '';
                if (estLu) {
                    badgeHtml = '<span class="badge lu">Lu</span>';
                    if (dateValidation) {
                        var d = new Date(dateValidation);
                        if (!isNaN(d.getTime())) {
                            var dateStr = d.toLocaleDateString('fr-FR', {
                                day: '2-digit', month: 'long', year: 'numeric'
                            });
                            var heureStr = d.toLocaleTimeString('fr-FR', {
                                hour: '2-digit', minute: '2-digit'
                            });
                            dateHtml = '<span class="date-validation visible">' + dateStr + ' à ' + heureStr + '</span>';
                        }
                    }
                } else if (estValide) {
                    badgeHtml = '<span class="badge valide">Validé</span>';
                    if (dateValidation) {
                        var d = new Date(dateValidation);
                        if (!isNaN(d.getTime())) {
                            var dateStr = d.toLocaleDateString('fr-FR', {
                                day: '2-digit', month: 'long', year: 'numeric'
                            });
                            var heureStr = d.toLocaleTimeString('fr-FR', {
                                hour: '2-digit', minute: '2-digit'
                            });
                            dateHtml = '<span class="date-validation visible">' + dateStr + ' à ' + heureStr + '</span>';
                        }
                    }
                } else if (reponse) {
                    badgeHtml = '<span class="badge a-faire">À faire</span>';
                } else {
                    badgeHtml = '<span class="badge non-vu">À faire</span>';
                }

                var retenirHtml = '';
                if (estValide && retenir) {
                    retenirHtml = `
                        <div class="retenir-cadre visible">
                            <strong>À retenir</strong>
                            ${retenir}
                        </div>
                    `;
                }

                var motsHtml = '';
                if (mots > 0) {
                    motsHtml = '<span class="mots">' + mots + ' mots</span>';
                }

                contenuHtml += `
                    <div class="carte-post">
                        <div class="infos">
                            <div class="titre"><a href="/medit/post.html?id=${post.id}">${post.titre}</a></div>
                            <div class="meta">
                                <span class="niveau-badge">Niveau ${post.niveau}</span>
                                ${badgesHtml}
                                ${motsHtml}
                                ${retenirHtml}
                            </div>
                        </div>
                        <div class="statut">
                            ${badgeHtml}
                            ${dateHtml}
                        </div>
                        <a href="/medit/post.html?id=${post.id}" class="${btnClass}">${btnText}</a>
                    </div>
                `;
            });

            contenuHtml += '</div>';
            contenuHtml += `</div>`;
        });

        contenu.innerHTML = contenuHtml;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(function(el) {
            el.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(function(el) {
            el.classList.remove('active');
        });

        document.getElementById(tabId).classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(function(el) {
            if (el.dataset.tab === tabId) {
                el.classList.add('active');
            }
        });
    }

    function afficherVide() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('contenu').innerHTML = `
            <div class="vide">
                <span class="icone">◈</span>
                <h2>Aucune méditation disponible</h2>
                <p>De nouvelles méditations seront ajoutées prochainement.</p>
                <p style="font-size:13px;color:#6b7a8a;margin-top:4px;">Votre niveau actuel : ${niveauEtudiant}</p>
            </div>
        `;
        document.getElementById('tabsContainer').innerHTML = '';
    }

    function demarrer() {
        chargerTableauDeBord();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', demarrer);
    } else {
        demarrer();
    }
  </script>

</body>
</html>
