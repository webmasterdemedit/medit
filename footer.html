<footer class="site-footer">
  <div class="footer-devise">“Et rappelle, car de vray le rappel sert au croyant.” CORAN</div>
  <div class="footer-copy">© <span id="anneeFooter"></span> Qiraatlecture</div>

  <!-- ========== MODE SOMBRE + DÉCONNEXION (en bas) ========== -->
  <div class="footer-actions" style="display:flex;justify-content:center;gap:20px;margin-top:12px;flex-wrap:wrap;">
    <button onclick="toggleDarkMode()" class="btn-footer" style="background:transparent;border:1px solid #d1ccc4;padding:4px 16px;border-radius:4px;font-size:12px;cursor:pointer;color:#6b7a8a;">🌓 Mode sombre</button>
    <button onclick="deconnecter()" class="btn-footer" style="background:transparent;border:1px solid #d1ccc4;padding:4px 16px;border-radius:4px;font-size:12px;cursor:pointer;color:#6b7a8a;">Se déconnecter</button>
  </div>
</footer>

<script>
  // Année automatique
  document.getElementById('anneeFooter').textContent = new Date().getFullYear();

  // ============================================================
  // DÉCONNEXION
  // ============================================================
  function deconnecter() {
    if (confirm('Se déconnecter ?')) {
      localStorage.removeItem('etudiant_id');
      localStorage.removeItem('etudiant_niveau');
      window.location.href = '/medit/index.html';
    }
  }


  })();
</script>
