<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Blog - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    .page-blog {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    /* ---------- EN-TÊTE BLOG ---------- */
    .entete-blog {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .entete-blog h1 {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .entete-blog .sous-titre-blog {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.6;
    }

    .entete-blog .stats-blog {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 10px 16px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .entete-blog .stats-blog .stat-item {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .entete-blog .stats-blog .stat-item .nombre {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      margin-left: 4px;
    }

    /* ---------- FILTRES ---------- */
    .barre-filtres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
    }

    .barre-filtres .filtre-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .barre-filtres .filtre {
      padding: 4px 14px;
      font-size: 12px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .barre-filtres .filtre:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .barre-filtres .filtre.actif {
      background: var(--bg-active);
      border-color: var(--border-hover);
      color: var(--text);
      font-weight: 500;
    }

    /* ---------- CARTES CHAPITRES ---------- */
    .section-chapitres h3 {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .carte-chapitre {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: all 0.2s;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .carte-chapitre:hover {
      border-color: var(--border-hover);
    }

    .carte-chapitre .infos {
      flex: 1;
      min-width: 200px;
    }

    .carte-chapitre .titre {
      font-weight: 500;
      font-size: 15px;
      color: var(--text);
    }

    .carte-chapitre .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      align-items: center;
    }

    .carte-chapitre .meta .badge-icone {
      display: inline-block;
      padding: 1px 10px;
      background: var(--bg-hover);
      font-size: 11px;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .carte-chapitre .meta .niveau-badge {
      font-size: 11px;
      padding: 1px 10px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .carte-chapitre .meta .livret-badge {
      font-size: 11px;
      padding: 1px 10px;
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border-hover);
      font-weight: 500;
    }

    .carte-chapitre .meta .mots {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .carte-chapitre .statut {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      min-width: 120px;
    }

    .carte-chapitre .statut .date-label {
      font-weight: 400;
      color: var(--text-secondary);
    }

    .carte-chapitre .statut .date-validation {
      color: var(--text);
      font-weight: 500;
    }

    .carte-chapitre .btn-wrap {
      width: 100%;
      padding-top: 6px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .carte-chapitre .btn-imprimer {
      display: inline-block;
      padding: 3px 14px;
      font-size: 11px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .carte-chapitre .btn-imprimer:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .carte-chapitre .retenir-cadre {
      margin-top: 4px;
      padding: 4px 12px;
      background: var(--bg-hover);
      font-size: 12px;
      color: var(--text-secondary);
      border-left: 3px solid var(--border-hover);
    }

    .carte-chapitre .retenir-cadre strong {
      font-weight: 600;
      margin-right: 6px;
      color: var(--text);
    }

    /* ---------- VIDES / LOADER ---------- */
    .vide-chapitres {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .vide-chapitres .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .vide-chapitres h4 {
      font-size: 16px;
      color: var(--text);
      font-weight: 500;
    }

    .vide-chapitres p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .loader {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .page-blog { padding: 12px 16px 30px; }
      .entete-blog h1 { font-size: 26px; }
      .stats-blog { justify-content: flex-start; gap: 16px; }
      .carte-chapitre { flex-direction: column; align-items: stretch; gap: 6px; }
      .carte-chapitre .statut { text-align: left; min-width: unset; }
      .carte-chapitre .btn-wrap { justify-content: flex-start; }
    }

    @media (max-width: 400px) {
      .entete-blog h1 { font-size: 22px; }
      .entete-blog .sous-titre-blog { font-size: 13px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-blog">

    <div class="entete-blog">
      <h1>Blog</h1>
      <div class="sous-titre-blog">
        Tous les chapitres, tous livrets confondus, classés du plus récent au plus ancien.
      </div>
      <div id="statsBlog"></div>
    </div>

    <div id="barreFiltres" class="barre-filtres"></div>

    <div id="contenuChapitres">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement des chapitres...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var toutesLesReponses = {};
    var chapitresData = [];
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var livretsData = {};
    var filtreActuel = 'tous'; // 'tous' ou nom de livret

    // ============================================================
    // FORMATER LA DATE
    // ============================================================
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var date = new Date(dateStr);
        var mois = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
                    'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        return mois[date.getMonth()] + ' ' + date.getFullYear();
      } catch(e) {
        return dateStr;
      }
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerBlog() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      nomEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          chapitresData = data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                pages: l.pages || '',
                description: l.description || '',
                auteur: l.auteur || ''
              };
            });
          }

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              if (!toutesLesReponses[r.chapitreId]) {
                toutesLesReponses[r.chapitreId] = [];
              }
              toutesLesReponses[r.chapitreId].push(r);
            });
          }

          afficherBlog();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            chapitresData = cache.chapitres || [];
            if (cache.livrets && Array.isArray(cache.livrets)) {
              livretsData = {};
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  pages: l.pages || '',
                  description: l.description || '',
                  auteur: l.auteur || ''
                };
              });
            }
            toutesLesReponses = {};
            if (cache.reponses) {
              cache.reponses.forEach(function(r) {
                if (!toutesLesReponses[r.chapitreId]) {
                  toutesLesReponses[r.chapitreId] = [];
                }
                toutesLesReponses[r.chapitreId].push(r);
              });
            }
            afficherBlog();
          } else {
            document.getElementById('contenuChapitres').innerHTML = `
              <div class="vide-chapitres">
                <span class="icone">⚠</span>
                <h4>Erreur de chargement</h4>
                <p>Vérifiez votre connexion internet.</p>
                <button onclick="location.reload();" style="margin-top:10px;padding:8px 20px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-secondary);">Réessayer</button>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // AFFICHER LE BLOG
    // ============================================================
    function afficherBlog() {
      // Tous les chapitres, sans filtre par livret ni par niveau
      // (le contenu de chapitresData est déjà filtré par niveau côté API)
      var chapitres = chapitresData.slice();

      // Tri chronologique : plus récent en premier
      chapitres.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        return db - da;
      });

      // Stats globales
      var totalChapitres = chapitres.length;
      var totalLivrets = Object.keys(livretsData).length;

      var statsHtml = `
        <div class="stats-blog">
          <span class="stat-item">Chapitres : <span class="nombre">${totalChapitres}</span></span>
          <span class="stat-item">Livrets : <span class="nombre">${totalLivrets}</span></span>
          <span class="stat-item">Niveau : <span class="nombre">${niveauEtudiant}</span></span>
        </div>
      `;
      document.getElementById('statsBlog').innerHTML = statsHtml;

      // Filtres par livret (optionnel, pratique si bcp de chapitres)
      var categories = {};
      chapitres.forEach(function(c) {
        var cat = c.categorie || 'Sans catégorie';
        categories[cat] = (categories[cat] || 0) + 1;
      });
      var catsTriees = Object.keys(categories).sort(function(a, b) {
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });

      var filtresHtml = '<span class="filtre-label">Filtrer :</span>';
      filtresHtml += `<button class="filtre ${filtreActuel === 'tous' ? 'actif' : ''}" onclick="changerFiltre('tous')">Tous (${totalChapitres})</button>`;
      catsTriees.forEach(function(cat) {
        filtresHtml += `<button class="filtre ${filtreActuel === cat ? 'actif' : ''}" onclick="changerFiltre('${cat.replace(/'/g, "\\'")}')">${cat} (${categories[cat]})</button>`;
      });
      document.getElementById('barreFiltres').innerHTML = filtresHtml;

      // Filtre appliqué
      var chapitresAffiches = chapitres;
      if (filtreActuel !== 'tous') {
        chapitresAffiches = chapitres.filter(function(c) {
          return (c.categorie || 'Sans catégorie') === filtreActuel;
        });
      }

      afficherChapitres(chapitresAffiches);
    }

    // ============================================================
    // CHANGER FILTRE
    // ============================================================
    function changerFiltre(cat) {
      filtreActuel = cat;
      afficherBlog();
    }

    // ============================================================
    // AFFICHER LES CHAPITRES
    // ============================================================
    function afficherChapitres(chapitres) {
      var container = document.getElementById('contenuChapitres');

      if (chapitres.length === 0) {
        container.innerHTML = `
          <div class="vide-chapitres">
            <span class="icone">◈</span>
            <h4>Aucun chapitre</h4>
            <p>Aucun chapitre accessible à votre niveau pour le moment.</p>
          </div>
        `;
        return;
      }

      var html = '<div class="section-chapitres">';
      html += '<h3>' + (filtreActuel === 'tous' ? 'Tous les chapitres' : filtreActuel) + '</h3>';

      for (var i = 0; i < chapitres.length; i++) {
        var chapitre = chapitres[i];

        var dateValidation = '';
        var retenir = '';
        var estLu = false;
        var estValide = false;

        var reponses = toutesLesReponses[chapitre.id] || [];
        if (reponses.length > 0) {
          var toutesValides = true;
          for (var j = 0; j < reponses.length; j++) {
            if (reponses[j].valide !== 'valide') {
              toutesValides = false;
              break;
            }
            if (reponses[j].date) dateValidation = reponses[j].date;
            if (reponses[j].retenir) retenir = reponses[j].retenir;
          }
          if (toutesValides) {
            estLu = true;
            estValide = true;
          }
        }

        var mots = chapitre.mots || 0;

        // ============================================================
        // COMPTAGE DES EXERCICES (via ordreBlocs)
        // ============================================================
        var TYPES_EXERCICES = [
          { prefix: 'quiz:',   label: 'QCM' },
          { prefix: 'open:',   label: 'Ouverte' },
          { prefix: 'ordre:',  label: 'Ordre' },
          { prefix: 'carte:',  label: 'Carte' },
          { prefix: 'relier:', label: 'Relier' },
          { prefix: 'tt:',     label: 'Trous' },
          { prefix: 'vf:',     label: 'VF' },
          { prefix: 'copier:', label: 'Copier' }
        ];

        var ordreBlocs = chapitre.ordreBlocs || [];
        var detailParts = [];
        var nbExercices = 0;

        if (ordreBlocs.length > 0) {
          for (var t = 0; t < TYPES_EXERCICES.length; t++) {
            var type = TYPES_EXERCICES[t];
            var count = 0;
            for (var ob = 0; ob < ordreBlocs.length; ob++) {
              if (ordreBlocs[ob].indexOf(type.prefix) === 0) count++;
            }
            if (count > 0) {
              nbExercices++;
              detailParts.push(count + ' ' + type.label);
            }
          }
        } else {
          if (chapitre.hasQuiz)     { nbExercices++; detailParts.push('1 QCM'); }
          if (chapitre.hasQuestion) { nbExercices++; detailParts.push('1 Ouverte'); }
        }

        var detailExercices = detailParts.join(' · ');
        var exercicesHtml =
          '<span class="badge-icone">Nbr exercices : ' + nbExercices + '</span>' +
          (detailExercices ? '<span class="badge-icone">' + detailExercices + '</span>' : '');

        var metaHtml = exercicesHtml;

        var dateHtml = '';
        var dateLabelHtml = '';

        if (estLu && dateValidation) {
          var d = new Date(dateValidation);
          if (!isNaN(d.getTime())) {
            var dateStr = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
            var heureStr = d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
            dateLabelHtml = '<span class="date-label">Fait :</span>';
            dateHtml = '<span class="date-validation">' + dateStr + ' à ' + heureStr + '</span>';
          }
        }

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre">
              <strong>À retenir</strong>
              ${retenir}
            </div>
          `;
        }

        var motsHtml = mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : '';

        var livretBadge = chapitre.categorie
          ? '<span class="livret-badge">' + chapitre.categorie + '</span>'
          : '';

        var imprimerHtml = `
          <div class="btn-wrap">
            <button class="btn-imprimer" onclick="event.stopPropagation(); imprimerChapitre('${chapitre.id}', '${chapitre.titre.replace(/'/g, "\\'")}', chapitresData)">
              🖨 Imprimer
            </button>
          </div>
        `;

        // Pas de onclick sur la carte : plus de e-learning
        html += `
          <div class="carte-chapitre">
            <div class="infos">
              <div class="titre">${chapitre.titre}</div>
              <div class="meta">
                <span class="niveau-badge">Niveau ${chapitre.niveau}</span>
                ${livretBadge}
                ${metaHtml}
                ${motsHtml}
                ${retenirHtml}
              </div>
            </div>
            <div class="statut">
              ${dateLabelHtml}
              ${dateHtml}
            </div>
            ${imprimerHtml}
          </div>
        `;
      }

      html += '</div>';
      container.innerHTML = html;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
      chargerBlog();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
