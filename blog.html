<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Lecture · Blog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    /* ===== PAGE TURNER ===== */
    .page-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      z-index: 1;
      background: var(--bg);
    }

    .page-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .page-content {
      max-width: 700px;
      width: 100%;
      max-height: 100vh;
      overflow: hidden;
      font-family: var(--font-serif);
      font-size: 22px;
      line-height: 2.2;
      text-align: justify;
      color: var(--text);
      padding: 20px 0;
      word-wrap: break-word;
      hyphens: auto;
    }

    .page-content p {
      margin-bottom: 1.5em;
      text-align: justify;
    }

    .page-content p:last-child {
      margin-bottom: 0;
    }

    /* ===== HEADER ===== */
    .lecture-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-sizing: border-box;
      transition: transform 0.4s ease, opacity 0.4s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lecture-header.hidden {
      transform: translateY(-100%);
      opacity: 0;
    }

    .lecture-header .meta-left .cat-niveau {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .lecture-header .meta-left .titre {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--text);
    }

    .lecture-header .actions .btn-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .lecture-header .actions .btn-close:hover {
      color: var(--text);
    }

    /* ===== PAGINATION ===== */
    .pagination {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 16px;
      border-radius: 0;
      user-select: none;
      transition: opacity 0.3s ease;
    }

    .pagination.hidden {
      opacity: 0;
    }

    /* ===== BARRE DE PROGRESSION ===== */
    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--text);
      z-index: 10;
      transition: width 0.3s ease;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .page-content {
        font-size: 19px;
        line-height: 2;
        padding: 10px 0;
      }
      .lecture-header .meta-left .titre {
        font-size: 16px;
      }
    }

    @media (max-width: 550px) {
      .page-content {
        font-size: 17px;
        line-height: 1.9;
      }
      .page-wrapper {
        padding: 20px 16px;
      }
    }
  </style>

</head>
<body>

  <!-- HEADER -->
  <header class="lecture-header" id="lectureHeader">
    <div class="meta-left">
      <div class="cat-niveau">
        <span id="metaCategorie">—</span> · <span id="metaNiveau">Niveau —</span>
      </div>
      <div class="titre" id="metaTitre">Chargement...</div>
    </div>
    <div class="actions">
      <button class="btn-close" id="btnFermer">✕</button>
    </div>
  </header>

  <!-- CONTENEUR DES PAGES -->
  <div id="pagesContainer" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:var(--bg);"></div>

  <!-- PAGINATION -->
  <div class="pagination" id="pagination">1 / 1</div>

  <!-- BARRE DE PROGRESSION -->
  <div class="progress-bar" id="progressBar" style="width:0%;"></div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';

    var etat = {
      postId: null,
      post: null,
      pages: [],
      currentIndex: 0,
      enTransition: false,
      headerVisible: true,
      headerTimeout: null
    };

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id) { afficherErreur('Aucun identifiant.'); return; }
      etat.postId = id;
      chargerPost(id);
    });

    // ===== CHARGER =====
    function chargerPost(id) {
      fetch(SCRIPT_URL + '?action=getPost&id=' + encodeURIComponent(id))
        .then(function(r) { if (!r.ok) throw new Error('Erreur réseau'); return r.json(); })
        .then(function(data) {
          if (!data.success || !data.post) throw new Error(data.message || 'Texte introuvable');
          etat.post = data.post;
          preparerPages(etat.post);
          afficherPage(0);
          mettreAJourPagination();
          document.getElementById('metaTitre').textContent = etat.post.titre || 'Sans titre';
          document.getElementById('metaCategorie').textContent = etat.post.categorie || 'Sans catégorie';
          document.getElementById('metaNiveau').textContent = 'Niveau ' + (etat.post.niveau || 0);
          gererHeader();
        })
        .catch(function(error) { afficherErreur(error.message); });
    }

    // ===== RECONSTITUER LE TEXTE AVEC SAUTS DE LIGNE =====
    function reconstituerTexte(contenu) {
      if (!contenu) return '';

      var colonnes = contenu.split(' | ');
      var textes = [];

      for (var i = 0; i < colonnes.length; i++) {
        var ligne = colonnes[i].trim();
        if (!ligne) continue;
        if (ligne.startsWith('-s-')) {
          var texte = ligne.replace('-s-', '').trim();
          if (texte) textes.push(texte);
        }
      }

      if (textes.length === 0) {
        var brut = contenu.replace(/-[a-z]-/g, '').trim();
        return brut || '';
      }

      // Joindre avec des sauts de ligne pour garder les paragraphes
      return textes.join('\n\n');
    }

    // ===== PRÉPARER LES PAGES (PARAGRAPHES + MOTS) =====
    function preparerPages(post) {
      var texteComplet = reconstituerTexte(post.contenu || '');
      if (!texteComplet) { etat.pages = ['Ce texte est vide.']; return; }

      var pages = [];

      // Créer un conteneur de mesure
      var mesure = document.createElement('div');
      mesure.style.cssText = 'position:fixed;top:-9999px;left:0;width:' + Math.min(window.innerWidth - 40, 700) + 'px;padding:40px 20px;box-sizing:border-box;font-family:Georgia,serif;font-size:22px;line-height:2.2;text-align:justify;';
      document.body.appendChild(mesure);

      var hauteurDispo = window.innerHeight - 80;

      // Découper en paragraphes
      var paragraphes = texteComplet.split('\n\n').filter(function(p) { return p.trim() !== ''; });

      var pageActuelle = [];

      for (var i = 0; i < paragraphes.length; i++) {
        var test = pageActuelle.concat([paragraphes[i]]);
        mesure.innerHTML = test.join('\n\n');

        if (mesure.scrollHeight > hauteurDispo) {
          // Si la page actuelle est vide, le paragraphe est trop long → le couper par mots
          if (pageActuelle.length === 0) {
            var mots = paragraphes[i].split(' ');
            var temp = [];
            for (var j = 0; j < mots.length; j++) {
              temp.push(mots[j]);
              mesure.innerHTML = temp.join(' ');
              if (mesure.scrollHeight > hauteurDispo && temp.length > 1) {
                temp.pop();
                pages.push(temp.join(' '));
                temp = [mots[j]];
              }
            }
            if (temp.length > 0) {
              pageActuelle = temp;
            }
          } else {
            pages.push(pageActuelle.join('\n\n'));
            pageActuelle = [paragraphes[i]];
          }
        } else {
          pageActuelle.push(paragraphes[i]);
        }
      }

      if (pageActuelle.length > 0) {
        pages.push(pageActuelle.join('\n\n'));
      }

      document.body.removeChild(mesure);

      if (pages.length === 0) pages = ['Ce texte est vide.'];
      etat.pages = pages;
    }

    // ===== AFFICHER UNE PAGE =====
    function afficherPage(index) {
      var container = document.getElementById('pagesContainer');
      var pageHtml = etat.pages[index] || '';

      // Nettoyer le conteneur
      container.innerHTML = '';

      // Convertir les sauts de ligne en paragraphes HTML
      var paragraphesHtml = pageHtml.split('\n\n').filter(function(p) { return p.trim() !== ''; });
      var htmlFinal = paragraphesHtml.map(function(p) { return '<p>' + p + '</p>'; }).join('');

      // Créer la page
      var wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper active';
      wrapper.innerHTML = '<div class="page-content">' + htmlFinal + '</div>';
      container.appendChild(wrapper);

      etat.currentIndex = index;
      mettreAJourPagination();
      mettreAJourProgression();
    }

    // ===== NAVIGATION =====
    function pageSuivante() {
      if (etat.enTransition) return;
      if (etat.currentIndex >= etat.pages.length - 1) return;

      etat.enTransition = true;
      var container = document.getElementById('pagesContainer');
      var currentWrapper = container.querySelector('.page-wrapper.active');

      // Convertir la nouvelle page en HTML
      var pageHtml = etat.pages[etat.currentIndex + 1] || '';
      var paragraphesHtml = pageHtml.split('\n\n').filter(function(p) { return p.trim() !== ''; });
      var htmlFinal = paragraphesHtml.map(function(p) { return '<p>' + p + '</p>'; }).join('');

      var newWrapper = document.createElement('div');
      newWrapper.className = 'page-wrapper';
      newWrapper.innerHTML = '<div class="page-content">' + htmlFinal + '</div>';
      container.appendChild(newWrapper);

      // Déclencher la transition
      requestAnimationFrame(function() {
        currentWrapper.classList.remove('active');
        newWrapper.classList.add('active');
      });

      etat.currentIndex++;
      mettreAJourPagination();
      mettreAJourProgression();

      setTimeout(function() {
        var wrappers = container.querySelectorAll('.page-wrapper');
        if (wrappers.length > 2) {
          for (var i = 0; i < wrappers.length - 1; i++) {
            if (!wrappers[i].classList.contains('active')) {
              wrappers[i].remove();
            }
          }
        }
        etat.enTransition = false;
       
      }, 850);
    }

    function pagePrecedente() {
      if (etat.enTransition) return;
      if (etat.currentIndex <= 0) return;

      etat.enTransition = true;
      var container = document.getElementById('pagesContainer');
      var currentWrapper = container.querySelector('.page-wrapper.active');

      var pageHtml = etat.pages[etat.currentIndex - 1] || '';
      var paragraphesHtml = pageHtml.split('\n\n').filter(function(p) { return p.trim() !== ''; });
      var htmlFinal = paragraphesHtml.map(function(p) { return '<p>' + p + '</p>'; }).join('');

      var newWrapper = document.createElement('div');
      newWrapper.className = 'page-wrapper';
      newWrapper.innerHTML = '<div class="page-content">' + htmlFinal + '</div>';
      container.appendChild(newWrapper);

      requestAnimationFrame(function() {
        currentWrapper.classList.remove('active');
        newWrapper.classList.add('active');
      });

      etat.currentIndex--;
      mettreAJourPagination();
      mettreAJourProgression();

      setTimeout(function() {
        var wrappers = container.querySelectorAll('.page-wrapper');
        if (wrappers.length > 2) {
          for (var i = 0; i < wrappers.length - 1; i++) {
            if (!wrappers[i].classList.contains('active')) {
              wrappers[i].remove();
            }
          }
        }
        etat.enTransition = false;
       
      }, 850);
    }

    // ===== METTRE À JOUR =====
    function mettreAJourPagination() {
      var pagination = document.getElementById('pagination');
      if (pagination) {
        pagination.textContent = (etat.currentIndex + 1) + ' / ' + etat.pages.length;
      }
    }

    function mettreAJourProgression() {
      var progress = document.getElementById('progressBar');
      if (progress && etat.pages.length > 0) {
        var pourcentage = ((etat.currentIndex + 1) / etat.pages.length) * 100;
        progress.style.width = pourcentage + '%';
      }
    }

    // ===== GÉRER LE HEADER =====
    function gererHeader() {
      var header = document.getElementById('lectureHeader');
      if (etat.headerTimeout) {
        clearTimeout(etat.headerTimeout);
        etat.headerTimeout = null;
      }
      header.classList.remove('hidden');
      etat.headerVisible = true;
      document.getElementById('pagination').classList.remove('hidden');

      etat.headerTimeout = setTimeout(function() {
        header.classList.add('hidden');
        etat.headerVisible = false;
        document.getElementById('pagination').classList.add('hidden');
      }, 3000);
    }

    // ===== ÉVÉNEMENTS =====

    // Clic sur la page
    document.addEventListener('click', function(e) {
      var container = document.getElementById('pagesContainer');
      var rect = container.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var width = rect.width;

      if (e.target.closest('.btn-close')) return;

      if (x < width * 0.2) {
        pagePrecedente();
      } else if (x > width * 0.8) {
        pageSuivante();
      } else {
        var header = document.getElementById('lectureHeader');
        if (header.classList.contains('hidden')) {
          header.classList.remove('hidden');
          document.getElementById('pagination').classList.remove('hidden');
          etat.headerVisible = true;
          if (etat.headerTimeout) clearTimeout(etat.headerTimeout);
          etat.headerTimeout = setTimeout(function() {
            header.classList.add('hidden');
            etat.headerVisible = false;
            document.getElementById('pagination').classList.add('hidden');
          }, 3000);
        }
      }
    });

    // Molette
    var scrollTimeout = null;
    document.addEventListener('wheel', function(e) {
      if (e.target.closest('.btn-close')) return;
      e.preventDefault();
      if (scrollTimeout) return;
      scrollTimeout = setTimeout(function() { scrollTimeout = null; }, 900);
      if (e.deltaY > 0) {
        pageSuivante();
      } else {
        pagePrecedente();
      }
    }, { passive: false });

    // Touches clavier
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        pageSuivante();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        pagePrecedente();
      }
    });

    // Bouton fermer
    document.getElementById('btnFermer').addEventListener('click', function() {
      window.location.href = '/medit/mes-textes.html';
    });

    // Redimensionnement
    var resizeTimeout = null;
    window.addEventListener('resize', function() {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        if (etat.post) {
          preparerPages(etat.post);
          afficherPage(Math.min(etat.currentIndex, etat.pages.length - 1));
        }
      }, 500);
    });

    // Mouvement souris pour réafficher le header
    var mouseTimeout = null;
    document.addEventListener('mousemove', function() {
      var header = document.getElementById('lectureHeader');
      var pagination = document.getElementById('pagination');
      
      if (header.classList.contains('hidden')) {
        header.classList.remove('hidden');
        pagination.classList.remove('hidden');
        etat.headerVisible = true;
        if (etat.headerTimeout) clearTimeout(etat.headerTimeout);
        etat.headerTimeout = setTimeout(function() {
          header.classList.add('hidden');
          etat.headerVisible = false;
          pagination.classList.add('hidden');
        }, 3000);
      }
    });

    // ===== ERREUR =====
    function afficherErreur(message) {
      var container = document.getElementById('pagesContainer');
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:40px;text-align:center;">
          <div>
            <div style="font-size:48px;margin-bottom:16px;">📖</div>
            <h2 style="font-family:var(--font-serif);font-weight:400;color:var(--text);">Texte introuvable</h2>
            <p style="font-family:var(--font-sans);color:var(--text-secondary);">${message || 'Le texte n\'existe pas.'}</p>
            <a href="/medit/mes-textes.html" style="display:inline-block;margin-top:20px;padding:10px 28px;border:1px solid var(--border);color:var(--text-primary);text-decoration:none;font-family:var(--font-sans);">← Retour</a>
          </div>
        </div>
      `;
      document.getElementById('pagination').style.display = 'none';
      document.getElementById('lectureHeader').style.display = 'none';
    }
  </script>

</body>
</html>
