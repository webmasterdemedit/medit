<!-- les-thèmes.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Les Thèmes - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-themes {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-themes h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-themes .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .grille-livrets {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vide-themes {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-themes .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .vide-themes h2 {
      font-size: 20px;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .vide-themes p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .page-themes { padding: 12px 16px 30px; }
      .page-themes h1 { font-size: 22px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-themes">

    <h1>Tous les thèmes</h1>
    <p class="sous-titre-page">Chaque thème regroupe des textes sur un même sujet. Cliquez sur un thème pour commencer l'apprentissage.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Thèmes :</span>
        <span class="nombre" id="totalThemes">0</span>
      </div>
      <div class="stat-item">
        <span>Textes :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
      <div class="stat-item">
        <span>Votre niveau :</span>
        <span class="nombre" id="niveauEtudiant">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des thèmes...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/couverture.js"></script>

  <script>
    window.toutesLesReponses = {};
    window.textesData = [];
    window.themesData = {};
    window.niveauEtudiant = 0;
    window.nomEtudiant = '';

    function chargerThemes() {
      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');
      nomEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          textesData = data.tousLesTextes || data.textes || [];

          themesData = {};
          if (data.themes && Array.isArray(data.themes)) {
            data.themes.forEach(function(l) {
              themesData[l.titre] = {
                theme: l.theme || '',
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                preRequis: l.preRequis || '',
                auteur: l.auteur || '',
                niveau: parseInt(l.niveau) || 0,
                couverture: l.couverture || ''
              };
            });
          }

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              toutesLesReponses[r.texteId] = r;
            });
          }

          document.getElementById('niveauEtudiant').textContent = niveauEtudiant;
          afficherThemes();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            textesData = cache.textes || cache.tousLesTextes || [];
            if (cache.themes && Array.isArray(cache.themes)) {
              themesData = {};
              cache.themes.forEach(function(l) {
                themesData[l.titre] = {
                  theme: l.theme || '',
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  preRequis: l.preRequis || '',
                  auteur: l.auteur || '',
                  niveau: parseInt(l.niveau) || 0,
                  couverture: l.couverture || ''
                };
              });
            }
            document.getElementById('niveauEtudiant').textContent = niveauEtudiant;
            afficherThemes();
          } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('contenu').innerHTML = `
              <div class="vide-themes">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    function afficherThemes() {
      var container = document.getElementById('contenu');
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      // Compter les textes par catégorie
      var textesParCategorie = {};
      textesData.forEach(function(ch) {
        var cat = (ch.categorie || '').trim();
        if (!cat) return;
        if (!textesParCategorie[cat]) textesParCategorie[cat] = [];
        textesParCategorie[cat].push(ch);
      });

      var titresThemes = Object.keys(themesData);

      var themesCalcules = titresThemes.map(function(titre) {
        var meta = themesData[titre];
        var textesDuTheme = textesParCategorie[titre] || [];

        var niveauMin = meta.niveau || 1;
        var niveauMax = meta.niveau || 1;
        if (textesDuTheme.length > 0) {
          niveauMin = Infinity;
          niveauMax = -Infinity;
          textesDuTheme.forEach(function(ch) {
            var n = parseInt(ch.niveau) || 1;
            if (n < niveauMin) niveauMin = n;
            if (n > niveauMax) niveauMax = n;
          });
        }

        var disponible = false;
        if (textesDuTheme.length === 0) {
          disponible = true;
        } else {
          textesDuTheme.forEach(function(ch) {
            if ((parseInt(ch.niveau) || 1) <= niveauEtudiant) disponible = true;
          });
        }

        var validees = 0;
        textesDuTheme.forEach(function(ch) {
          var reponse = toutesLesReponses[ch.id];
          if (reponse && reponse.valide === 'valide') validees++;
        });
        var pourcentage = textesDuTheme.length > 0
          ? Math.round((validees / textesDuTheme.length) * 100)
          : 0;

        return {
          nom: titre,
          theme: (meta.theme || '').trim(),
          niveauMin: niveauMin,
          niveauMax: niveauMax,
          textes: textesDuTheme.length,
          disponible: disponible,
          verrouille: !disponible,
          pourcentage: pourcentage,
          couleur: meta.couleur || '#2d6a4f',
          sousTitre: meta.sousTitre || '',
          date: meta.date || '',
          auteur: meta.auteur || '',
          niveau: meta.niveau || 1,
          couverture: meta.couverture || ''
        };
      });

      themesCalcules.sort(function(a, b) {
        return a.niveauMin - b.niveauMin
          || a.nom.localeCompare(b.nom, 'fr', { sensitivity: 'base' });
      });

      // Stats
      document.getElementById('totalThemes').textContent = themesCalcules.length;
      document.getElementById('totalTextes').textContent = textesData.length;

      if (themesCalcules.length === 0) {
        container.innerHTML = `
          <div class="vide-themes">
            <span class="icone">◈</span>
            <h2>Aucun thème disponible</h2>
            <p>Aucun thème n'est configuré pour le moment.</p>
          </div>
        `;
        return;
      }

      // Rendu : liste verticale comme les-sections
      var html = '<div class="grille-livrets">';
      themesCalcules.forEach(function(theme) {
        html += construireCarteCouverture(theme, {
          cliquable: theme.disponible,
          lien: '/medit/thème.html?cat=' + encodeURIComponent(theme.nom)
        });
      });
      html += '</div>';

      container.innerHTML = html;
    }

    function demarrer() {
      chargerThemes();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
