<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Mon compte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    .carte-compte {
      padding: 28px 32px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .champ-compte {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .champ-compte:last-child {
      border-bottom: none;
    }

    .champ-compte .label {
      font-size: 14px;
      min-width: 160px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .champ-compte .valeur {
      font-size: 15px;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
      color: var(--text);
    }

    .niveau-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .niveau-section .niveau-titre {
      font-size: 16px;
      font-style: italic;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .niveau-section .niveau-valeur {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 12px;
      color: var(--text);
    }

    .niveau-section .niveau-valeur small {
      font-size: 18px;
      font-weight: 400;
      margin-left: 8px;
      font-style: italic;
      color: var(--text-secondary);
    }

    .niveau-section .description-niveau {
      padding: 16px 20px;
      border-left: 3px solid var(--border);
      font-size: 15px;
      line-height: 1.7;
      font-style: italic;
      margin-top: 4px;
      color: var(--text-secondary);
    }

    .stats-activite {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-card {
      padding: 16px 18px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card .nombre {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-card .label {
      font-size: 12px;
      margin-top: 2px;
      display: block;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
    }

    .stat-card .sous-label {
      font-size: 11px;
      display: block;
      margin-top: 2px;
      color: var(--text-muted);
    }

    .groupe-date {
      margin-bottom: 16px;
    }

    .groupe-date .date-titre {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      color: var(--text);
    }

    .histo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0 6px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      position: relative;
      color: var(--text);
    }

    .histo-item:last-child {
      border-bottom: none;
    }

    .histo-item::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--text-muted);
    }

    .histo-item .heure {
      font-size: 12px;
      min-width: 60px;
      color: var(--text-secondary);
    }

    .histo-item .titre {
      flex: 1;
      margin: 0 12px;
      color: var(--text);
    }

    .histo-item .detail {
      font-size: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--text-secondary);
    }

    .histo-item .detail .badge {
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 500;
    }

    .histo-item .detail .badge.valide {
      color: var(--text);
      border: 1px solid var(--border);
    }

    .histo-item .detail .badge.echec {
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .histo-item .detail .badge.annote,
    .histo-item .detail .badge.reponse {
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-retour-compte {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 8px;
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-retour-compte:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .btn-rafraichir {
      padding: 6px 16px;
      border: 1px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
      margin-top: 12px;
      color: var(--text-secondary);
    }

    .btn-rafraichir:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .loader-histo {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .loader-histo .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide-histo {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .vide-histo .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide-histo h2 {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 4px;
      color: var(--text);
    }

    .vide-histo p {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .tabs-compte {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .tab-compte {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
    }

    .tab-compte:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .tab-compte.active {
      border-bottom-color: var(--text);
      font-weight: 600;
      color: var(--text);
    }

    .tab-content-compte {
      display: none;
    }

    .tab-content-compte.active {
      display: block;
    }

    .ligne-separatrice {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    /* === MESSAGERIE === */
    .message-item {
      padding: 16px 20px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .message-item .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .message-item .message-sujet {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
    }

    .message-item .message-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .message-item .message-statut {
      font-size: 12px;
      padding: 2px 12px;
      border: 1px solid var(--border);
    }

    .message-item .message-statut.repondu {
      color: var(--text);
      border-color: var(--text);
    }

    .message-item .message-statut.en-attente {
      color: var(--text-secondary);
      border-color: var(--border);
    }

    .message-item .message-texte {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin: 4px 0 8px 0;
    }

    .message-item .message-reponse {
      padding: 12px 16px;
      border-left: 3px solid var(--border);
      margin-top: 8px;
      background: var(--bg-hover);
    }

    .message-item .message-reponse .reponse-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .message-item .message-reponse .reponse-texte {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }

    .form-message label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .form-message input,
    .form-message textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    .form-message input:focus,
    .form-message textarea:focus {
      border-color: var(--text);
      outline: none;
    }

    .form-message textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-envoyer {
      padding: 10px 32px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn-envoyer:hover {
      background: var(--bg-hover);
    }

    .btn-envoyer:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-message {
      font-size: 13px;
      color: var(--text-secondary);
      margin-left: 12px;
    }

    .aucun-message {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-secondary);
    }

    .aucun-message .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
      opacity: 0.4;
    }

    .messagerie-titre-section {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 24px 0 12px 0;
      font-family: var(--font-serif);
    }

    @media (max-width: 640px) {
      .carte-compte { padding: 18px 16px; }
      .tabs-compte { justify-content: center; flex-wrap: wrap; }
      .tab-compte { font-size: 13px; padding: 8px 14px; }
      .champ-compte { flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 0; }
      .champ-compte .valeur { text-align: left; max-width: 100%; width: 100%; }
      .niveau-section .niveau-valeur { font-size: 32px; }
      .stats-activite { grid-template-columns: repeat(2, 1fr); }
      .stat-card .nombre { font-size: 22px; }
      .histo-item { flex-wrap: wrap; gap: 4px; }
      .histo-item .detail { flex-wrap: wrap; }
      .champ-compte .label { min-width: 120px; }
      .message-item .message-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- PAGE -->
  <div class="page">

    <h1>Mon compte</h1>
    <p class="sous-titre-page">Vos informations, votre activité et votre historique.</p>

    <!-- ONGLETS -->
    <div class="tabs-compte" id="tabsContainer">
      <button class="tab-compte" data-tab="profil" onclick="switchTab('profil')">Mon profil</button>
      <button class="tab-compte" data-tab="activite" onclick="switchTab('activite')">Mon activité</button>
      <button class="tab-compte" data-tab="historique" onclick="switchTab('historique')">Historique</button>
      <button class="tab-compte" data-tab="messagerie" onclick="switchTab('messagerie')">Messagerie</button>
    </div>

    <!-- PROFIL -->
    <div id="tab-profil" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-profil">
          <div class="loader-histo">
            <div class="spinner"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIVITÉ -->
    <div id="tab-activite" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-activite">
          <div class="loader-histo"><div class="spinner"></div><p>Chargement...</p></div>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div id="tab-historique" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-historique">
          <div class="loader-histo"><div class="spinner"></div><p>Chargement...</p></div>
        </div>
      </div>
    </div>

    <!-- MESSAGERIE -->
    <div id="tab-messagerie" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-messagerie">
          <div class="loader-histo"><div class="spinner"></div><p>Chargement...</p></div>
        </div>
      </div>
    </div>

    <a href="/medit/mes-livrets.html" class="btn-retour-compte">← Retour</a>

  </div>

  <!-- FOOTER -->
  <div id="footer-container"></div>
  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var toutesLesReponses = [];
    var niveauEtudiant = 0;
    var descriptionNiveau = '';
    var identifiant = '';

    var dateInscription = '';
    var contact = '';
    var disciplines = '';
    var messagePerso = '';

    // ============================================================
    // GESTION DE L'URL POUR LES ONGLETS
    // ============================================================
    function getTabFromURL() {
      var params = new URLSearchParams(window.location.search);
      var tab = params.get('tab');
      return tab || 'profil';
    }

    function mettreAJourURL(tab) {
      var newUrl = window.location.pathname + '?tab=' + encodeURIComponent(tab);
      history.pushState({ tab: tab }, '', newUrl);
    }

    window.addEventListener('popstate', function(event) {
      if (event.state && event.state.tab) {
        var tab = event.state.tab;
        activerOnglet(tab, false);
      }
    });

    // ============================================================
    // SWITCH D'ONGLET
    // ============================================================
    function switchTab(tabId) {
      activerOnglet(tabId, true);
    }

    function activerOnglet(tabId, mettreAJour) {
      document.querySelectorAll('.tab-content-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      document.querySelectorAll('.tab-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      var content = document.getElementById('tab-' + tabId);
      if (content) content.classList.add('active');

      document.querySelectorAll('.tab-compte').forEach(function(el) {
        if (el.dataset.tab === tabId) {
          el.classList.add('active');
        }
      });

      if (mettreAJour) {
        mettreAJourURL(tabId);
      }

      if (tabId === 'messagerie') {
        chargerMessages();
      }
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerCompte() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      identifiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          toutesLesReponses = data.reponses || [];
          descriptionNiveau = data.description || 'Aucune description.';

          dateInscription = data.dateInscription || 'Non renseignée';
          contact = data.contact || 'Non renseigné';
          disciplines = data.disciplines || 'Non renseigné';
          messagePerso = data.messagePerso || 'Aucun message';

          afficherProfil();
          afficherActivite();
          afficherHistorique();

          var tabFromURL = getTabFromURL();
          activerOnglet(tabFromURL, false);

          if (tabFromURL === 'messagerie') {
            chargerMessages();
          }
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            toutesLesReponses = cache.reponses || [];
            descriptionNiveau = cache.description || 'Aucune description.';

            dateInscription = cache.dateInscription || 'Non renseignée';
            contact = cache.contact || 'Non renseigné';
            disciplines = cache.disciplines || 'Non renseigné';
            messagePerso = cache.messagePerso || 'Aucun message';

            afficherProfil();
            afficherActivite();
            afficherHistorique();

            var tabFromURL = getTabFromURL();
            activerOnglet(tabFromURL, false);

            if (tabFromURL === 'messagerie') {
              chargerMessages();
            }
          } else {
            document.getElementById('contenu-profil').innerHTML = `
              <div style="text-align:center;padding:30px 0;">
                <p style="color:var(--text-secondary);">Erreur de chargement.</p>
                <button onclick="location.reload()" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text);">
                  Réessayer
                </button>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // FORMATER UNE DATE
    // ============================================================
    function formaterDate(dateStr) {
      if (!dateStr || dateStr === 'Non renseignée') return dateStr;
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('fr-FR', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        });
      } catch(e) {
        return dateStr;
      }
    }

    function formaterDateHeure(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('fr-FR', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        }) + ' à ' + d.toLocaleTimeString('fr-FR', {
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch(e) {
        return dateStr;
      }
    }

    // ============================================================
    // AFFICHER PROFIL
    // ============================================================
    function afficherProfil() {
      var dateFormatee = formaterDate(dateInscription);
      var nbLivrets = DataManager.getLivrets ? DataManager.getLivrets().length : 0;

      var html = '';

      html += `
        <div class="champ-compte">
          <span class="label">Identifiant</span>
          <span class="valeur">${identifiant}</span>
        </div>
      `;

      if (contact && contact !== 'Non renseigné') {
        html += `
          <div class="champ-compte">
            <span class="label">Contact</span>
            <span class="valeur">${contact}</span>
          </div>
        `;
      }

      if (disciplines && disciplines !== 'Non renseigné') {
        html += `
          <div class="champ-compte">
            <span class="label">Disciplines</span>
            <span class="valeur">${disciplines}</span>
          </div>
        `;
      }

      html += `
        <div class="champ-compte">
          <span class="label">Date d'inscription</span>
          <span class="valeur">${dateFormatee}</span>
        </div>
      `;

      if (messagePerso && messagePerso !== 'Aucun message') {
        html += `
          <div class="champ-compte" style="flex-direction:column;align-items:flex-start;gap:6px;padding:12px 0;">
            <span class="label" style="min-width:auto;">Message personnel</span>
            <span class="valeur" style="text-align:left;max-width:100%;width:100%;font-style:italic;font-weight:400;color:var(--text-secondary);">
              "${messagePerso}"
            </span>
          </div>
        `;
      }

      html += `<hr class="ligne-separatrice">`;

      html += `
        <div class="champ-compte">
          <span class="label">Livrets disponibles</span>
          <span class="valeur">${nbLivrets}</span>
        </div>
      `;

      html += `
        <div class="niveau-section">
          <div class="niveau-titre">Votre niveau actuel</div>
          <div class="niveau-valeur">
            ${niveauEtudiant}
            <small>sur 12</small>
          </div>
          <div class="description-niveau">${descriptionNiveau}</div>
        </div>
      `;

      document.getElementById('contenu-profil').innerHTML = html;
    }

    // ============================================================
    // AFFICHER ACTIVITÉ
    // ============================================================
    function afficherActivite() {
      var total = toutesLesReponses.length;
      var valides = 0;
      var annotes = 0;
      var reponsesEnvoyees = 0;
      var tempsTotalSecondes = 0;

      toutesLesReponses.forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var totalQ = parseInt(item.total) || 0;
        if (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2)) {
          valides++;
        }

        if (item.annotations && item.annotations.trim() !== '') {
          annotes++;
        }

        if (item.reponseOuverte && item.reponseOuverte.trim() !== '') {
          reponsesEnvoyees++;
        }

        if (item.dureeTotale) {
          var parts = item.dureeTotale.split(':');
          if (parts.length === 3) {
            tempsTotalSecondes += parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
          }
        }
      });

      var heures = Math.floor(tempsTotalSecondes / 3600);
      var minutes = Math.floor((tempsTotalSecondes % 3600) / 60);
      var secondes = tempsTotalSecondes % 60;
      var tempsFormate = String(heures).padStart(2, '0') + ':' + 
                         String(minutes).padStart(2, '0') + ':' + 
                         String(secondes).padStart(2, '0');

      var taux = total > 0 ? Math.round((valides / total) * 100) : 0;

      var html = '';

      html += `
        <div class="stats-activite">
          <div class="stat-card">
            <span class="nombre">${valides}</span>
            <span class="label">Textes validés</span>
            <span class="sous-label">sur ${total} tentatives</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${annotes}</span>
            <span class="label">Textes annotés</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${reponsesEnvoyees}</span>
            <span class="label">Réponses envoyées</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${taux}%</span>
            <span class="label">Taux de réussite</span>
          </div>
        </div>
        <div style="text-align:center;margin-top:8px;font-size:13px;color:var(--text-secondary);">
          Temps total passé : ${tempsFormate}
        </div>
      `;

      document.getElementById('contenu-activite').innerHTML = html;
    }

    // ============================================================
    // AFFICHER HISTORIQUE
    // ============================================================
    function afficherHistorique() {
      if (!toutesLesReponses || toutesLesReponses.length === 0) {
        document.getElementById('contenu-historique').innerHTML = `
          <div class="vide-histo">
            <span class="icone">◈</span>
            <h2>Aucune tentative</h2>
            <p>Commencez une méditation pour voir vos progrès ici.</p>
          </div>
        `;
        return;
      }

      var grouped = {};
      toutesLesReponses.forEach(function(item) {
        if (!item.date) return;
        var d = new Date(item.date);
        if (isNaN(d.getTime())) return;
        var key = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      var dates = Object.keys(grouped).sort(function(a, b) {
        return new Date(b) - new Date(a);
      });

      var html = '';

      dates.forEach(function(dateKey) {
        var items = grouped[dateKey];
        items.sort(function(a, b) {
          var da = a.date ? new Date(a.date) : new Date(0);
          var db = b.date ? new Date(b.date) : new Date(0);
          return da - db;
        });

        html += `<div class="groupe-date">`;
        html += `<div class="date-titre">${dateKey}</div>`;

        items.forEach(function(item) {
          var bonnes = parseInt(item.bonnes) || 0;
          var totalQ = parseInt(item.total) || 0;
          var valide = (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2));
          var statutClass = valide ? 'valide' : 'echec';
          var statutTexte = valide ? '✅ Validé' : '❌ Non validé';

          var d = item.date ? new Date(item.date) : null;
          var heure = d && !isNaN(d.getTime()) ? 
            d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';

          var details = [];
          if (totalQ > 0) {
            details.push(`${bonnes}/${totalQ}`);
          }
          if (item.temps) {
            details.push(`⏱️ ${item.temps}`);
          }
          if (item.annotations && item.annotations.trim() !== '') {
            details.push(`✏️ annoté`);
          }
          if (item.reponseOuverte && item.reponseOuverte.trim() !== '') {
            details.push(`📝 réponse`);
          }

          html += `
            <div class="histo-item">
              <span class="heure">${heure}</span>
              <span class="titre">${item.titre || 'Sans titre'}</span>
              <span class="detail">
                <span class="badge ${statutClass}">${statutTexte}</span>
                ${details.length > 0 ? details.join(' · ') : ''}
              </span>
            </div>
          `;
        });

        html += `</div>`;
      });

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // MESSAGERIE - CHARGER LES MESSAGES
    // ============================================================
    function chargerMessages() {
      var container = document.getElementById('contenu-messagerie');
      
      container.innerHTML = `
        <div class="loader-histo">
          <div class="spinner"></div>
          <p>Chargement des messages...</p>
        </div>
      `;

      DataManager.getMessages()
        .then(function(messages) {
          afficherMessagerie(messages);
        })
        .catch(function(error) {
          container.innerHTML = `
            <div style="text-align:center;padding:30px 0;color:var(--text-secondary);">
              <p>❌ Erreur de chargement : ${error.message}</p>
              <button onclick="chargerMessages()" 
                      style="margin-top:12px;padding:8px 24px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text);">
                Réessayer
              </button>
            </div>
          `;
        });
    }

    // ============================================================
    // MESSAGERIE - AFFICHER
    // ============================================================
    function afficherMessagerie(messages) {
      var container = document.getElementById('contenu-messagerie');

      // Formulaire d'envoi
      var html = `
        <div class="form-message">
          <h3 style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:12px;font-family:var(--font-serif);">
            Envoyer un message
          </h3>
          <form id="formMessage" onsubmit="envoyerMessage(event)">
            <div style="margin-bottom:14px;">
              <label for="sujetMessage">Sujet</label>
              <input type="text" id="sujetMessage" placeholder="Sujet de votre message" required>
            </div>
            <div style="margin-bottom:14px;">
              <label for="corpsMessage">Message</label>
              <textarea id="corpsMessage" placeholder="Écrivez votre message ici..." required></textarea>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <button type="submit" class="btn-envoyer" id="btnEnvoyer">➤</button>
              <span id="statusMessage" class="status-message"></span>
            </div>
          </form>
        </div>
      `;

      // Historique des messages
      if (messages && messages.length > 0) {
        html += `<hr class="ligne-separatrice">`;
        html += `<div class="messagerie-titre-section">⌯⌲ Messages précédents</div>`;

        messages.forEach(function(msg) {
          var statutClass = msg.statut === 'Répondu' || msg.reponse ? 'repondu' : 'en-attente';
          var statutTexte = msg.statut || 'En attente';
          var dateFormatee = formaterDateHeure(msg.date);
          var reponse = msg.reponse || '';

          html += `
            <div class="message-item">
              <div class="message-header">
                <span class="message-sujet">${msg.sujet || 'Sans sujet'}</span>
                <span class="message-date">${dateFormatee}</span>
                <span class="message-statut ${statutClass}">${statutTexte}</span>
              </div>
              <div class="message-texte">${msg.message || ''}</div>
          `;

          if (reponse && reponse.trim() !== '') {
            html += `
              <div class="message-reponse">
                <div class="reponse-label">📩 Réponse de l'administrateur</div>
                <div class="reponse-texte">${reponse}</div>
              </div>
            `;
          }

          html += `</div>`;
        });
      } else {
        html += `
          <hr class="ligne-separatrice">
          <div class="aucun-message">
            <span class="icone">📭</span>
            <p>Aucun message envoyé.</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ============================================================
    // MESSAGERIE - ENVOYER
    // ============================================================
    function envoyerMessage(event) {
      event.preventDefault();

      var sujet = document.getElementById('sujetMessage').value.trim();
      var message = document.getElementById('corpsMessage').value.trim();

      if (!sujet || !message) {
        var status = document.getElementById('statusMessage');
        status.textContent = '⚠️ Tous les champs sont requis.';
        status.style.color = 'var(--text-secondary)';
        return;
      }

      var btn = document.getElementById('btnEnvoyer');
      var status = document.getElementById('statusMessage');

      btn.disabled = true;
      btn.textContent = '⏳ Envoi...';
      status.textContent = '';

      DataManager.envoyerMessage(sujet, message)
        .then(function() {
          status.textContent = '✅ Message envoyé avec succès !';
          status.style.color = 'var(--text)';
          document.getElementById('sujetMessage').value = '';
          document.getElementById('corpsMessage').value = '';
          btn.disabled = false;
          btn.textContent = '📨 Envoyer';

          // Recharger les messages
          setTimeout(function() {
            chargerMessages();
          }, 500);
        })
        .catch(function(error) {
          status.textContent = '❌ Erreur : ' + error.message;
          status.style.color = 'var(--text-secondary)';
          btn.disabled = false;
          btn.textContent = '📨 Envoyer';
        });
    }

   // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
