<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Mon compte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>" />

  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-logo">
                <a href="/medit/index.html">Qiraat</a>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
              </nav>
            </div>
          </header>
        `;
        mettreAJourHeader();
      });

    function mettreAJourHeader() {
      var id = localStorage.getItem('etudiant_id');
      var nav = document.getElementById('headerNav');
      var userNameSpan = document.getElementById('headerUserName');

      if (userNameSpan) {
        userNameSpan.textContent = id || '';
      }

      if (nav) {
        if (id) {
          nav.innerHTML = `
            <a href="/medit/mes-textes.html" class="header-link">Mes textes</a>
            <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
            <button class="header-btn" onclick="deconnecter()">Se déconnecter</button>
          `;
        } else {
          nav.innerHTML = `
            <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
          `;
        }
      }
    }

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }
  </script>

  <!-- ========== PAGE ========== -->
  <div class="page-compte">

    <h1>Mon compte</h1>
    <p class="sous-titre-page">Vos informations personnelles et votre progression.</p>

    <!-- ========== ONGLETS ========== -->
    <div class="tabs-compte" id="tabsContainer">
      <button class="tab-compte active" data-tab="profil" onclick="switchTab('profil')">Mon profil</button>
      <button class="tab-compte" data-tab="historique" onclick="switchTab('historique')">Mes résultats</button>
    </div>

    <!-- ========== PROFIL ========== -->
    <div id="tab-profil" class="tab-content-compte active">
      <div class="carte-compte">
        <div id="contenu-compte">
          <div style="text-align:center;padding:30px 0;color:#6b7a8a;">
            <div style="display:inline-block;width:32px;height:32px;border:3px solid #d1ccc4;border-top-color:#6b7a8a;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== HISTORIQUE ========== -->
    <div id="tab-historique" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-historique">
          <div class="loader-histo">
            <div class="spinner"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== RETOUR ========== -->
    <a href="/medit/mes-textes.html" class="btn-retour-compte">← Retour</a>

  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // SWITCH D'ONGLET
    // ============================================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content-compte').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        if (el.dataset.tab === tabId) {
          el.classList.add('active');
        }
      });
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerCompte() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          afficherCompte(data, id);
          afficherHistorique(data.reponses || []);
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            afficherCompte(cache, id);
            afficherHistorique(cache.reponses || []);
          } else {
            document.getElementById('contenu-compte').innerHTML = `
              <div style="text-align:center;padding:30px 0;">
                <p style="color:#6b7a8a;">Erreur de chargement.</p>
                <button onclick="rafraichirCache()" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;cursor:pointer;">
                  Réessayer
                </button>
              </div>
            `;
            document.getElementById('contenu-historique').innerHTML = `
              <div class="vide-histo">
                <span class="icone">◈</span>
                <h2>Erreur</h2>
                <p>Vérifiez votre connexion.</p>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // AFFICHAGE COMPTE
    // ============================================================
    function afficherCompte(data, id) {
      var niveau = data.niveau || 0;
      var description = data.description || 'Aucune description disponible.';

      var html = '';

      html += `
        <div class="champ-compte">
          <span class="label">Identifiant</span>
          <span class="valeur">${id}</span>
        </div>
      `;

      html += `
        <div class="niveau-section">
          <div class="niveau-titre">Votre niveau actuel</div>
          <div class="niveau-valeur">
            ${niveau}
            <small>sur 12</small>
          </div>
          <div class="description-niveau">${description}</div>
        </div>
      `;

      html += `
        <div style="margin-top:20px;text-align:center;border-top:1px solid #d1ccc4;padding-top:16px;">
          <button onclick="rafraichirCache(event)" style="padding:10px 28px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;font-size:14px;cursor:pointer;">
            Rafraîchir
          </button>
          <p style="font-size:12px;color:#6b7a8a;margin-top:6px;">Synchronise vos données avec le serveur</p>
        </div>
      `;

      document.getElementById('contenu-compte').innerHTML = html;
    }

    // ============================================================
    // RAFRAÎCHIR
    // ============================================================
    function rafraichirCache(event) {
      var id = localStorage.getItem('etudiant_id');
      if (!id) return;

      var btn = event ? event.target : document.querySelector('#contenu-compte button');
      if (!btn) return;

      var originalText = btn.textContent;
      btn.textContent = '...';
      btn.disabled = true;
      btn.style.opacity = '0.6';

      DataManager.rafraichir()
        .then(function(data) {
          btn.textContent = 'OK';
          btn.style.background = '#e8e5e0';
          btn.disabled = false;
          btn.style.opacity = '1';
          afficherCompte(data, id);
          afficherHistorique(data.reponses || []);
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
            btn.style.background = 'transparent';
          }, 1500);
        })
        .catch(function() {
          btn.textContent = 'Erreur';
          btn.disabled = false;
          btn.style.opacity = '1';
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
          }, 1500);
        });
    }

    // ============================================================
    // AFFICHAGE HISTORIQUE
    // ============================================================
    function afficherHistorique(historique) {
      if (!historique || historique.length === 0) {
        document.getElementById('contenu-historique').innerHTML = `
          <div class="vide-histo">
            <span class="icone">◈</span>
            <h2>Aucune tentative</h2>
            <p>Commencez une méditation pour voir vos progrès.</p>
          </div>
        `;
        return;
      }

      var html = '';

      // Graphique
      html += `<div class="graphique-container"><div class="graphique-ligne">`;
      historique.slice(-10).forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var total = parseInt(item.total) || 0;
        var valide = (total > 0 && bonnes >= Math.ceil(total / 2));
        var statutClass = valide ? 'valide' : 'echec';
        var dateFormatee = item.date ? new Date(item.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '';

        html += `
          <div class="graphique-point">
            <div class="cercle ${statutClass}"></div>
            <span class="date-point">${dateFormatee}</span>
          </div>
        `;
      });
      html += `</div></div>`;

      // Légende
      html += `
        <div class="legende">
          <span class="item"><span class="cercle-legende valide"></span> Validé</span>
          <span class="item"><span class="cercle-legende echec"></span> Non validé</span>
        </div>
      `;

      // Liste
      html += `<div class="liste-tentatives">`;
      historique.slice().reverse().forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var total = parseInt(item.total) || 0;
        var valide = (total > 0 && bonnes >= Math.ceil(total / 2));
        var statutClass = valide ? 'valide' : 'echec';
        var statutTexte = valide ? '✓ Validé' : '✗ Non validé';

        var dateFormatee = 'Date inconnue';
        if (item.date) {
          var d = new Date(item.date);
          if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
            dateFormatee = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            }) + ' à ' + d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
          }
        }

        html += `
          <div class="tentative-item">
            <span>${item.titre || 'Méditation'} — ${dateFormatee}</span>
            <span class="statut ${statutClass}">${statutTexte}</span>
          </div>
        `;
      });
      html += `</div>`;

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>

            }) + ' à ' + d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
          }
        }

        html += `
          <div class="tentative-item">
            <span>${item.titre || 'Méditation'} — ${dateFormatee}</span>
            <span class="statut ${statutClass}">${statutTexte}</span>
          </div>
        `;
      });
      html += `</div>`;

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
