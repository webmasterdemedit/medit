<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Mon compte - MéditIslam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>۞</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/css/style.css" />
  <style>
    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #f4f2ed;
      color: #1e293b;
      min-height: 100vh;
      letter-spacing: 0.2px;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page-compte {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px 40px;
      flex: 1;
      width: 100%;
    }

    .page-compte h1 {
      font-size: 30px;
      font-weight: 300;
      color: #1a2a2e;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .page-compte h1 strong {
      font-weight: 700;
      color: #2d6a4f;
    }

    .page-compte .sous-titre-page {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-style: italic;
    }

    /* ============================================================
       ONGLETS INTERNES
       ============================================================ */
    .tabs-compte {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 2px solid #edeae5;
    }

    .tab-compte {
      padding: 12px 28px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 15px;
      font-weight: 500;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
      border-radius: 8px 8px 0 0;
    }

    .tab-compte:hover {
      color: #1a2a2e;
      background: #f8f6f2;
    }

    .tab-compte.active {
      color: #2d6a4f;
      border-bottom-color: #2d6a4f;
      font-weight: 600;
    }

    .tab-content-compte {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content-compte.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       CARTE DU COMPTE
       ============================================================ */
    .carte-compte {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 36px;
      border: 1px solid #edeae5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }

    /* ============================================================
       CHAMPS CLASSIQUES (Profil)
       ============================================================ */
    .champ-compte {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0ede8;
    }

    .champ-compte:last-child {
      border-bottom: none;
    }

    .champ-compte .label {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.3px;
      min-width: 140px;
    }

    .champ-compte .valeur {
      font-size: 15px;
      color: #1a2a2e;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }

    .champ-compte .valeur.mdp {
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      color: #2d6a4f;
      font-weight: 600;
    }

    .champ-compte .valeur.mdp:hover {
      text-decoration: underline;
    }

    .champ-compte .valeur .voir-mdp {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
      font-family: 'Segoe UI', sans-serif;
      margin-left: 8px;
      cursor: pointer;
      letter-spacing: 0.2px;
    }

    .champ-compte .valeur .voir-mdp:hover {
      color: #2d6a4f;
    }

    /* ============================================================
       SECTION NIVEAU
       ============================================================ */
    .niveau-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 2px solid #edeae5;
    }

    .niveau-section .niveau-titre {
      font-size: 16px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .niveau-section .niveau-valeur {
      font-size: 40px;
      font-weight: 700;
      color: #2d6a4f;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .niveau-section .niveau-valeur small {
      font-size: 18px;
      font-weight: 400;
      color: #94a3b8;
      margin-left: 8px;
      font-style: italic;
    }

    .niveau-section .description-niveau {
      padding: 18px 24px;
      background: #f8f6f2;
      border-radius: 10px;
      border-left: 4px solid #2d6a4f;
      font-size: 15px;
      color: #475569;
      line-height: 1.7;
      font-style: italic;
      letter-spacing: 0.2px;
      margin-top: 4px;
    }

    /* ============================================================
       MESSAGE PERSONNALISÉ
       ============================================================ */
    .message-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 2px solid #edeae5;
    }

    .message-section .message-label {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .message-section .message-cadre {
      background: #faf9f7;
      border-radius: 12px;
      padding: 20px 26px;
      border: 1px solid #e2e0db;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    .message-section .message-cadre .contenu {
      font-size: 16px;
      color: #1a2a2e;
      line-height: 1.8;
      width: 100%;
    }

    .message-section .message-cadre .contenu.vide {
      color: #b8b0a8;
      font-style: italic;
      font-size: 14px;
    }

    /* ============================================================
       HISTORIQUE
       ============================================================ */
    .graphique-container {
      margin: 16px 0 20px;
      padding: 16px 0 12px;
      overflow-x: auto;
    }

    .graphique-ligne {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      justify-content: flex-start;
      min-height: 60px;
      padding: 0 4px;
    }

    .graphique-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .graphique-point .cercle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #e2e0db;
      transition: all 0.2s;
    }

    .graphique-point .cercle.valide {
      background: #2d6a4f;
      border-color: #2d6a4f;
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
    }

    .graphique-point .cercle.echec {
      background: #e8e0d8;
      border-color: #b8b0a8;
    }

    .graphique-point .date-point {
      font-size: 10px;
      color: #b8b0a8;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .legende {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.2px;
    }

    .legende .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legende .cercle-legende {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #e2e0db;
    }

    .legende .cercle-legende.valide {
      background: #2d6a4f;
      border-color: #2d6a4f;
    }

    .legende .cercle-legende.echec {
      background: #e8e0d8;
      border-color: #b8b0a8;
    }

    .liste-tentatives {
      margin-top: 12px;
      border-top: 1px solid #f0ede8;
      padding-top: 12px;
    }

    .tentative-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      color: #475569;
      border-bottom: 1px solid #f8f6f2;
    }

    .tentative-item:last-child {
      border-bottom: none;
    }

    .tentative-item .statut {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .tentative-item .statut.valide {
      color: #2d6a4f;
    }

    .tentative-item .statut.echec {
      color: #b8b0a8;
    }

    .tentative-item .temps-passe {
      font-size: 12px;
      color: #94a3b8;
      font-family: 'Courier New', monospace;
    }

    .loader-histo {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    .loader-histo .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #edeae5;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide-histo {
      text-align: center;
      padding: 40px 20px;
      color: #b8b0a8;
    }

    .vide-histo .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide-histo h2 {
      font-size: 20px;
      font-weight: 400;
      color: #1a2a2e;
      margin-bottom: 4px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    .vide-histo p {
      color: #b8b0a8;
      font-size: 15px;
    }

    /* ============================================================
       BOUTON RETOUR
       ============================================================ */
    .btn-retour-compte {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: #eef2f6;
      color: #1a3a4a;
      border: none;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 8px;
    }

    .btn-retour-compte:hover {
      background: #dce2ea;
      transform: translateX(-4px);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .page-compte {
        padding: 20px 16px;
      }
      .page-compte h1 {
        font-size: 24px;
      }
      .carte-compte {
        padding: 20px 18px;
      }
      .tabs-compte {
        justify-content: center;
      }
      .tab-compte {
        font-size: 13px;
        padding: 10px 16px;
      }
      .champ-compte {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 0;
      }
      .champ-compte .valeur {
        text-align: left;
        max-width: 100%;
        width: 100%;
      }
      .niveau-section .niveau-valeur {
        font-size: 32px;
      }
      .message-section .message-cadre {
        padding: 16px 18px;
      }
      .graphique-ligne {
        gap: 8px;
      }
      .graphique-point .cercle {
        width: 14px;
        height: 14px;
      }
      .graphique-point .date-point {
        font-size: 9px;
      }
      .tentative-item {
        font-size: 13px;
        flex-wrap: wrap;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/components/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-logo">
                <a href="/medit/index.html">۞ <strong>Médit</strong>Islam</a>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
                <a href="#" class="header-link" onclick="ouvrirInscription(); return false;">S'inscrire</a>
              </nav>
            </div>
          </header>
        `;
        mettreAJourHeader();
      });

    function mettreAJourHeader() {
      var id = localStorage.getItem('etudiant_id');
      var nav = document.getElementById('headerNav');
      var userNameSpan = document.getElementById('headerUserName');

      if (userNameSpan) {
        if (id) {
          userNameSpan.textContent = id;
        } else {
          userNameSpan.textContent = '';
        }
      }

      if (nav) {
        if (id) {
          nav.innerHTML = `
            <a href="/medit/mes-textes.html" class="header-link">Mes textes</a>
            <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
            <button class="header-btn" onclick="deconnecter()">Se déconnecter</button>
          `;
        } else {
          nav.innerHTML = `
            <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
            <a href="#" class="header-link" onclick="ouvrirInscription(); return false;">S'inscrire</a>
          `;
        }
      }
    }

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }
  </script>

  <div class="page-compte">

    <h1><strong>Mon</strong> compte</h1>
    <p class="sous-titre-page">Vos informations personnelles et votre progression.</p>

    <!-- ========== ONGLETS ========== -->
    <div class="tabs-compte" id="tabsContainer">
      <button class="tab-compte active" data-tab="profil" onclick="switchTab('profil')">Mon profil</button>
      <button class="tab-compte" data-tab="historique" onclick="switchTab('historique')">Mes résultats</button>
    </div>

    <!-- ========== CONTENU PROFIL ========== -->
    <div id="tab-profil" class="tab-content-compte active">
      <div class="carte-compte" id="carteCompte">
        <div id="contenu-compte">
          <div style="text-align:center;padding:30px 0;color:#94a3b8;">
            <div style="display:inline-block;width:32px;height:32px;border:3px solid #edeae5;border-top-color:#2d6a4f;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;"></div>
            <p>Chargement de vos informations...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== CONTENU HISTORIQUE ========== -->
    <div id="tab-historique" class="tab-content-compte">
      <div class="carte-compte" id="carteHistorique">
        <div id="contenu-historique">
          <div class="loader-histo">
            <div class="spinner"></div>
            <p>Chargement de vos résultats...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== BOUTON RETOUR ========== -->
    <a href="/medit/mes-textes.html" class="btn-retour-compte">← Retour à mes textes</a>

  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/components/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} MéditIslam</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/js/config.js"></script>
  <script src="/medit/js/auth.js"></script>

  <script>
    // ============================================================
    // SWITCH D'ONGLET
    // ============================================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content-compte').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        if (el.dataset.tab === tabId) {
          el.classList.add('active');
        }
      });

      if (tabId === 'historique') {
        chargerHistorique();
      }
    }

    // ============================================================
    // CHARGEMENT DU PROFIL
    // ============================================================
    var mdpVisible = false;
    var mdpCache = '';

    function chargerCompte() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      var url = CONFIG.SCRIPT_URL + '?action=getProfilComplet&nom=' + encodeURIComponent(id);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            afficherCompte(data);
          } else {
            document.getElementById('contenu-compte').innerHTML = `
              <p style="color:#c62828;text-align:center;">❌ Erreur : ${data.message || 'Impossible de charger les informations.'}</p>
            `;
          }
        })
        .catch(function() {
          document.getElementById('contenu-compte').innerHTML = `
            <p style="color:#c62828;text-align:center;">❌ Erreur réseau. Vérifiez votre connexion.</p>
          `;
        });
    }

    function afficherCompte(data) {
      var html = '';

      var dateInscription = data.dateInscription ? new Date(data.dateInscription).toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'long', year: 'numeric'
      }) : 'Non renseignée';

      html += `
        <div class="champ-compte">
          <span class="label">📅 Date d'inscription</span>
          <span class="valeur">${dateInscription}</span>
        </div>
      `;

      mdpCache = data.mdp || '';
      var mdpAffiche = mdpVisible ? mdpCache : '••••••••';
      html += `
        <div class="champ-compte">
          <span class="label">🔒 Mot de passe</span>
          <span class="valeur mdp" onclick="basculerMdp()" title="Cliquer pour afficher/masquer">
            ${mdpAffiche}
            <span class="voir-mdp">${mdpVisible ? 'masquer' : 'voir'}</span>
          </span>
        </div>
      `;

      var niveau = data.niveau || 0;
      var description = data.description || 'Aucune description disponible pour ce niveau.';

      html += `
        <div class="niveau-section">
          <div class="niveau-titre">Votre niveau actuel</div>
          <div class="niveau-valeur">
            ${niveau}
            <small>sur 12</small>
          </div>
          <div class="description-niveau">${description}</div>
        </div>
      `;

      var messagePerso = data.messagePerso || '';
      html += `
        <div class="message-section">
          <span class="message-label">✉️ Message personnel de l'enseignant</span>
          <div class="message-cadre">
            <div class="contenu ${!messagePerso ? 'vide' : ''}">
              ${messagePerso || 'Aucun message pour le moment.'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('contenu-compte').innerHTML = html;
    }

    function basculerMdp() {
      mdpVisible = !mdpVisible;
      chargerCompte();
    }

    // ============================================================
    // CHARGEMENT DE L'HISTORIQUE
    // ============================================================
    function chargerHistorique() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) return;

      var url = CONFIG.SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(id);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses && data.reponses.length > 0) {
            var historique = data.reponses.map(function(r) {
              var bonnes = parseInt(r.bonnes) || 0;
              var total = parseInt(r.total) || 0;
              var valide = (total > 0 && bonnes >= Math.ceil(total / 2));
              return {
                date: r.date || '',
                titre: r.titre || '',
                valide: valide,
                temps: r.temps || '',
                retenir: r.retenir || ''
              };
            });
            afficherHistorique(historique);
          } else {
            document.getElementById('contenu-historique').innerHTML = `
              <div class="vide-histo">
                <span class="icone">📭</span>
                <h2>Aucune tentative enregistrée</h2>
                <p>Commencez une méditation pour voir vos progrès apparaître ici.</p>
              </div>
            `;
          }
        })
        .catch(function() {
          document.getElementById('contenu-historique').innerHTML = `
            <div class="vide-histo">
              <span class="icone">⚠️</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion et réessayez.</p>
            </div>
          `;
        });
    }

    // ============================================================
    // AFFICHAGE DE L'HISTORIQUE
    // ============================================================
    function afficherHistorique(historique) {
      var html = '';

      // === GRAPHIQUE ===
      html += `<div class="graphique-container"><div class="graphique-ligne">`;
      historique.forEach(function(item) {
        var statutClass = item.valide ? 'valide' : 'echec';
        var dateFormatee = item.date ? new Date(item.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '';

        html += `
          <div class="graphique-point">
            <div class="cercle ${statutClass}"></div>
            <span class="date-point">${dateFormatee}</span>
          </div>
        `;
      });
      html += `</div></div>`;

      // === LÉGENDE ===
      html += `
        <div class="legende">
          <span class="item"><span class="cercle-legende valide"></span> Validé</span>
          <span class="item"><span class="cercle-legende echec"></span> Non validé</span>
        </div>
      `;

      // === LISTE DES TENTATIVES ===
      html += `<div class="liste-tentatives">`;
      historique.forEach(function(item) {
        var statutClass = item.valide ? 'valide' : 'echec';
        var statutTexte = item.valide ? '✅ Validé' : '⬜ Non validé';
        
        var dateFormatee = 'Date inconnue';
        if (item.date) {
          var d = new Date(item.date);
          if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
            dateFormatee = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            });
          }
        }

        var tempsAffiche = (item.temps && item.temps !== '' && !item.temps.startsWith('1899')) ? '⏱ ' + item.temps : '';

        html += `
          <div class="tentative-item">
            <span>${item.titre || 'Méditation'} — ${dateFormatee}</span>
            <span style="display:flex;align-items:center;gap:12px;">
              ${tempsAffiche ? `<span class="temps-passe">${tempsAffiche}</span>` : ''}
              <span class="statut ${statutClass}">${statutTexte}</span>
            </span>
          </div>
        `;
      });
      html += `</div>`;

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
