<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Mon compte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    /* ============================================================
       PAGE COMPTE - Styles spécifiques
       ============================================================ */
    .page-compte {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px 40px;
      flex: 1;
      width: 100%;
    }

    .page-compte h1 {
      font-size: 30px;
      font-weight: 300;
      color: #2c2c2c;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .page-compte h1 strong {
      font-weight: 700;
      color: #2c2c2c;
    }

    .page-compte .sous-titre-page {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      font-style: italic;
    }

    /* ============================================================
       ONGLETS
       ============================================================ */
    .tabs-compte {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid #d1ccc4;
    }

    .tab-compte {
      padding: 12px 28px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 15px;
      font-weight: 500;
      color: #6b7a8a;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
    }

    .tab-compte:hover {
      color: #2c2c2c;
      background: #e8e5e0;
    }

    .tab-compte.active {
      color: #2c2c2c;
      border-bottom-color: #2c2c2c;
      font-weight: 600;
    }

    .tab-content-compte {
      display: none;
    }

    .tab-content-compte.active {
      display: block;
    }

    /* ============================================================
       CARTE
       ============================================================ */
    .carte-compte {
      background: #f3f0e9;
      border-radius: 4px;
      padding: 32px 36px;
      border: 1px solid #d1ccc4;
      margin-bottom: 24px;
    }

    /* ============================================================
       CHAMPS
       ============================================================ */
    .champ-compte {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #e8e5e0;
    }

    .champ-compte:last-child {
      border-bottom: none;
    }

    .champ-compte .label {
      font-size: 14px;
      color: #6b7a8a;
      font-weight: 500;
      letter-spacing: 0.3px;
      min-width: 140px;
    }

    .champ-compte .valeur {
      font-size: 15px;
      color: #2c2c2c;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }

    /* ============================================================
       NIVEAU
       ============================================================ */
    .niveau-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #d1ccc4;
    }

    .niveau-section .niveau-titre {
      font-size: 16px;
      color: #6b7a8a;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .niveau-section .niveau-valeur {
      font-size: 40px;
      font-weight: 700;
      color: #2c2c2c;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .niveau-section .niveau-valeur small {
      font-size: 18px;
      font-weight: 400;
      color: #6b7a8a;
      margin-left: 8px;
      font-style: italic;
    }

    .niveau-section .description-niveau {
      padding: 18px 24px;
      background: #e8e5e0;
      border-radius: 4px;
      border-left: 3px solid #6b7a8a;
      font-size: 15px;
      color: #2c2c2c;
      line-height: 1.7;
      font-style: italic;
      letter-spacing: 0.2px;
      margin-top: 4px;
    }

    /* ============================================================
       HISTORIQUE
       ============================================================ */
    .graphique-container {
      margin: 16px 0 20px;
      padding: 16px 0 12px;
      overflow-x: auto;
    }

    .graphique-ligne {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      justify-content: flex-start;
      min-height: 60px;
      padding: 0 4px;
    }

    .graphique-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .graphique-point .cercle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #d1ccc4;
      transition: all 0.2s;
    }

    .graphique-point .cercle.valide {
      background: #2c2c2c;
      border-color: #2c2c2c;
    }

    .graphique-point .cercle.echec {
      background: #e8e5e0;
      border-color: #d1ccc4;
    }

    .graphique-point .date-point {
      font-size: 10px;
      color: #6b7a8a;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .legende {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: #6b7a8a;
      letter-spacing: 0.2px;
    }

    .legende .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legende .cercle-legende {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #d1ccc4;
    }

    .legende .cercle-legende.valide {
      background: #2c2c2c;
      border-color: #2c2c2c;
    }

    .legende .cercle-legende.echec {
      background: #e8e5e0;
      border-color: #d1ccc4;
    }

    .liste-tentatives {
      margin-top: 12px;
      border-top: 1px solid #e8e5e0;
      padding-top: 12px;
    }

    .tentative-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      color: #2c2c2c;
      border-bottom: 1px solid #e8e5e0;
    }

    .tentative-item:last-child {
      border-bottom: none;
    }

    .tentative-item .statut {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .tentative-item .statut.valide {
      color: #2c2c2c;
    }

    .tentative-item .statut.echec {
      color: #6b7a8a;
    }

    .tentative-item .temps-passe {
      font-size: 12px;
      color: #6b7a8a;
      font-family: 'Courier New', monospace;
    }

    .loader-histo {
      text-align: center;
      padding: 40px 20px;
      color: #6b7a8a;
    }

    .loader-histo .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #d1ccc4;
      border-top-color: #6b7a8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide-histo {
      text-align: center;
      padding: 40px 20px;
      color: #6b7a8a;
    }

    .vide-histo .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide-histo h2 {
      font-size: 20px;
      font-weight: 400;
      color: #2c2c2c;
      margin-bottom: 4px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    .vide-histo p {
      color: #6b7a8a;
      font-size: 15px;
    }

    /* ============================================================
       BOUTON RETOUR
       ============================================================ */
    .btn-retour-compte {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 8px;
    }

    .btn-retour-compte:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .page-compte {
        padding: 20px 16px;
      }
      .page-compte h1 {
        font-size: 24px;
      }
      .carte-compte {
        padding: 20px 18px;
      }
      .tabs-compte {
        justify-content: center;
      }
      .tab-compte {
        font-size: 13px;
        padding: 10px 16px;
      }
      .champ-compte {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 0;
      }
      .champ-compte .valeur {
        text-align: left;
        max-width: 100%;
        width: 100%;
      }
      .niveau-section .niveau-valeur {
        font-size: 32px;
      }
      .graphique-ligne {
        gap: 8px;
      }
      .graphique-point .cercle {
        width: 14px;
        height: 14px;
      }
      .graphique-point .date-point {
        font-size: 9px;
      }
      .tentative-item {
        font-size: 13px;
        flex-wrap: wrap;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = `
          <header class="site-header">
            <div class="header-inner">
              <div class="header-logo">
                <a href="/medit/index.html">Qiraat</a>
              </div>
              <nav class="header-nav" id="headerNav">
                <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
              </nav>
            </div>
          </header>
        `;
        mettreAJourHeader();
      });

    function mettreAJourHeader() {
      var id = localStorage.getItem('etudiant_id');
      var nav = document.getElementById('headerNav');
      var userNameSpan = document.getElementById('headerUserName');

      if (userNameSpan) {
        userNameSpan.textContent = id || '';
      }

      if (nav) {
        if (id) {
          nav.innerHTML = `
            <a href="/medit/mes-textes.html" class="header-link">Mes textes</a>
            <a href="/medit/mon-compte.html" class="header-btn-compte">Mon compte</a>
            <button class="header-btn" onclick="deconnecter()">Se déconnecter</button>
          `;
        } else {
          nav.innerHTML = `
            <a href="#" class="header-link" onclick="ouvrirConnexion(); return false;">Se connecter</a>
          `;
        }
      }
    }

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }
  </script>

  <!-- ========== PAGE ========== -->
  <div class="page-compte">

    <h1>Mon compte</h1>
    <p class="sous-titre-page">Vos informations personnelles et votre progression.</p>

    <!-- ========== ONGLETS ========== -->
    <div class="tabs-compte" id="tabsContainer">
      <button class="tab-compte active" data-tab="profil" onclick="switchTab('profil')">Mon profil</button>
      <button class="tab-compte" data-tab="historique" onclick="switchTab('historique')">Mes résultats</button>
    </div>

    <!-- ========== PROFIL ========== -->
    <div id="tab-profil" class="tab-content-compte active">
      <div class="carte-compte">
        <div id="contenu-compte">
          <div style="text-align:center;padding:30px 0;color:#6b7a8a;">
            <div style="display:inline-block;width:32px;height:32px;border:3px solid #d1ccc4;border-top-color:#6b7a8a;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== HISTORIQUE ========== -->
    <div id="tab-historique" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-historique">
          <div class="loader-histo">
            <div class="spinner"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== RETOUR ========== -->
    <a href="/medit/mes-textes.html" class="btn-retour-compte">← Retour</a>

  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // SWITCH D'ONGLET
    // ============================================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content-compte').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        if (el.dataset.tab === tabId) {
          el.classList.add('active');
        }
      });
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerCompte() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      DataManager.charger()
        .then(function(data) {
          afficherCompte(data, id);
          afficherHistorique(data.reponses || []);
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            afficherCompte(cache, id);
            afficherHistorique(cache.reponses || []);
          } else {
            document.getElementById('contenu-compte').innerHTML = `
              <div style="text-align:center;padding:30px 0;">
                <p style="color:#6b7a8a;">Erreur de chargement.</p>
                <button onclick="rafraichirCache()" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;cursor:pointer;">
                  Réessayer
                </button>
              </div>
            `;
            document.getElementById('contenu-historique').innerHTML = `
              <div class="vide-histo">
                <span class="icone">◈</span>
                <h2>Erreur</h2>
                <p>Vérifiez votre connexion.</p>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // AFFICHAGE COMPTE
    // ============================================================
    function afficherCompte(data, id) {
      var niveau = data.niveau || 0;
      var description = data.description || 'Aucune description disponible.';

      var html = '';

      html += `
        <div class="champ-compte">
          <span class="label">Identifiant</span>
          <span class="valeur">${id}</span>
        </div>
      `;

      html += `
        <div class="niveau-section">
          <div class="niveau-titre">Votre niveau actuel</div>
          <div class="niveau-valeur">
            ${niveau}
            <small>sur 12</small>
          </div>
          <div class="description-niveau">${description}</div>
        </div>
      `;

      html += `
        <div style="margin-top:20px;text-align:center;border-top:1px solid #d1ccc4;padding-top:16px;">
          <button onclick="rafraichirCache(event)" style="padding:10px 28px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;font-size:14px;cursor:pointer;">
            Rafraîchir
          </button>
          <p style="font-size:12px;color:#6b7a8a;margin-top:6px;">Synchronise vos données avec le serveur</p>
        </div>
      `;

      document.getElementById('contenu-compte').innerHTML = html;
    }

    // ============================================================
    // RAFRAÎCHIR
    // ============================================================
    function rafraichirCache(event) {
      var id = localStorage.getItem('etudiant_id');
      if (!id) return;

      var btn = event ? event.target : document.querySelector('#contenu-compte button');
      if (!btn) return;

      var originalText = btn.textContent;
      btn.textContent = '...';
      btn.disabled = true;
      btn.style.opacity = '0.6';

      DataManager.rafraichir()
        .then(function(data) {
          btn.textContent = 'OK';
          btn.style.background = '#e8e5e0';
          btn.disabled = false;
          btn.style.opacity = '1';
          afficherCompte(data, id);
          afficherHistorique(data.reponses || []);
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
            btn.style.background = 'transparent';
          }, 1500);
        })
        .catch(function() {
          btn.textContent = 'Erreur';
          btn.disabled = false;
          btn.style.opacity = '1';
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
          }, 1500);
        });
    }

    // ============================================================
    // AFFICHAGE HISTORIQUE
    // ============================================================
    function afficherHistorique(historique) {
      if (!historique || historique.length === 0) {
        document.getElementById('contenu-historique').innerHTML = `
          <div class="vide-histo">
            <span class="icone">◈</span>
            <h2>Aucune tentative</h2>
            <p>Commencez une méditation pour voir vos progrès.</p>
          </div>
        `;
        return;
      }

      var html = '';

      // Graphique
      html += `<div class="graphique-container"><div class="graphique-ligne">`;
      historique.slice(-10).forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var total = parseInt(item.total) || 0;
        var valide = (total > 0 && bonnes >= Math.ceil(total / 2));
        var statutClass = valide ? 'valide' : 'echec';
        var dateFormatee = item.date ? new Date(item.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '';

        html += `
          <div class="graphique-point">
            <div class="cercle ${statutClass}"></div>
            <span class="date-point">${dateFormatee}</span>
          </div>
        `;
      });
      html += `</div></div>`;

      // Légende
      html += `
        <div class="legende">
          <span class="item"><span class="cercle-legende valide"></span> Validé</span>
          <span class="item"><span class="cercle-legende echec"></span> Non validé</span>
        </div>
      `;

      // Liste
      html += `<div class="liste-tentatives">`;
      historique.slice().reverse().forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var total = parseInt(item.total) || 0;
        var valide = (total > 0 && bonnes >= Math.ceil(total / 2));
        var statutClass = valide ? 'valide' : 'echec';
        var statutTexte = valide ? '✓ Validé' : '✗ Non validé';

        var dateFormatee = 'Date inconnue';
        if (item.date) {
          var d = new Date(item.date);
          if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
            dateFormatee = d.toLocaleDateString('fr-FR', {
              day: '2-digit', month: 'long', year: 'numeric'
            }) + ' à ' + d.toLocaleTimeString('fr-FR', {
              hour: '2-digit', minute: '2-digit'
            });
          }
        }

        html += `
          <div class="tentative-item">
            <span>${item.titre || 'Méditation'} — ${dateFormatee}</span>
            <span class="statut ${statutClass}">${statutTexte}</span>
          </div>
        `;
      });
      html += `</div>`;

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
