<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Mon compte - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    .page-compte {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px 40px;
      flex: 1;
      width: 100%;
    }

    .page-compte h1 {
      font-size: 30px;
      font-weight: 300;
      color: #2c2c2c;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .page-compte .sous-titre-page {
      font-size: 15px;
      color: #6b7a8a;
      margin-bottom: 24px;
      font-style: italic;
    }

    .tabs-compte {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid #d1ccc4;
    }

    .tab-compte {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      font-weight: 500;
      color: #6b7a8a;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
    }

    .tab-compte:hover {
      color: #2c2c2c;
      background: #e8e5e0;
    }

    .tab-compte.active {
      color: #2c2c2c;
      border-bottom-color: #2c2c2c;
      font-weight: 600;
    }

    .tab-content-compte {
      display: none;
    }

    .tab-content-compte.active {
      display: block;
    }

    .carte-compte {
      background: #f3f0e9;
      border-radius: 4px;
      padding: 28px 32px;
      border: 1px solid #d1ccc4;
      margin-bottom: 24px;
    }

    /* Profil */
    .champ-compte {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e8e5e0;
    }

    .champ-compte:last-child {
      border-bottom: none;
    }

    .champ-compte .label {
      font-size: 14px;
      color: #6b7a8a;
      font-weight: 500;
      min-width: 140px;
    }

    .champ-compte .valeur {
      font-size: 15px;
      color: #2c2c2c;
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }

    .niveau-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #d1ccc4;
    }

    .niveau-section .niveau-titre {
      font-size: 16px;
      color: #6b7a8a;
      font-weight: 400;
      margin-bottom: 6px;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .niveau-section .niveau-valeur {
      font-size: 40px;
      font-weight: 700;
      color: #2c2c2c;
      font-family: 'Georgia', serif;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .niveau-section .niveau-valeur small {
      font-size: 18px;
      font-weight: 400;
      color: #6b7a8a;
      margin-left: 8px;
      font-style: italic;
    }

    .niveau-section .description-niveau {
      padding: 16px 20px;
      background: #e8e5e0;
      border-radius: 4px;
      border-left: 3px solid #6b7a8a;
      font-size: 15px;
      color: #2c2c2c;
      line-height: 1.7;
      font-style: italic;
      margin-top: 4px;
    }

    /* Activité - Stats */
    .stats-activite {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 16px 18px;
      background: #e8e5e0;
      border-radius: 4px;
      text-align: center;
    }

    .stat-card .nombre {
      font-size: 28px;
      font-weight: 700;
      color: #2c2c2c;
      font-family: 'Georgia', serif;
    }

    .stat-card .label {
      font-size: 12px;
      color: #6b7a8a;
      margin-top: 2px;
      display: block;
      letter-spacing: 0.3px;
    }

    .stat-card .sous-label {
      font-size: 11px;
      color: #b8b0a8;
      display: block;
      margin-top: 2px;
    }

    .activite-recente {
      border-top: 1px solid #d1ccc4;
      padding-top: 16px;
    }

    .activite-recente .titre-section {
      font-size: 14px;
      color: #6b7a8a;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .activite-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      border-bottom: 1px solid #e8e5e0;
    }

    .activite-item:last-child {
      border-bottom: none;
    }

    .activite-item .date {
      color: #6b7a8a;
      font-size: 12px;
      min-width: 80px;
    }

    .activite-item .titre {
      color: #2c2c2c;
      flex: 1;
      margin: 0 12px;
    }

    .activite-item .statut {
      font-size: 12px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 30px;
    }

    .activite-item .statut.valide {
      color: #2c2c2c;
      background: #d1ccc4;
    }

    .activite-item .statut.echec {
      color: #6b7a8a;
      background: #e8e5e0;
    }

    .activite-item .statut.info {
      color: #6b7a8a;
      background: #e8e5e0;
    }

    /* Historique */
    .groupe-date {
      margin-bottom: 16px;
    }

    .groupe-date .date-titre {
      font-size: 14px;
      font-weight: 600;
      color: #2c2c2c;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
      padding-bottom: 6px;
      border-bottom: 1px solid #d1ccc4;
      margin-bottom: 8px;
    }

    .histo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0 6px 16px;
      font-size: 14px;
      border-bottom: 1px solid #e8e5e0;
      position: relative;
    }

    .histo-item:last-child {
      border-bottom: none;
    }

    .histo-item::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #d1ccc4;
    }

    .histo-item .heure {
      color: #6b7a8a;
      font-size: 12px;
      min-width: 60px;
    }

    .histo-item .titre {
      color: #2c2c2c;
      flex: 1;
      margin: 0 12px;
    }

    .histo-item .detail {
      font-size: 12px;
      color: #6b7a8a;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .histo-item .detail .badge {
      padding: 1px 8px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 500;
    }

    .histo-item .detail .badge.valide {
      color: #2c2c2c;
      background: #d1ccc4;
    }

    .histo-item .detail .badge.echec {
      color: #6b7a8a;
      background: #e8e5e0;
    }

    .histo-item .detail .badge.annote {
      color: #2c2c2c;
      background: #e8e5e0;
      border: 1px solid #d1ccc4;
    }

    .histo-item .detail .badge.reponse {
      color: #2c2c2c;
      background: #e8e5e0;
      border: 1px solid #d1ccc4;
    }

    .btn-retour-compte {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-top: 8px;
    }

    .btn-retour-compte:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    .loader-histo {
      text-align: center;
      padding: 40px 20px;
      color: #6b7a8a;
    }

    .loader-histo .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #d1ccc4;
      border-top-color: #6b7a8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide-histo {
      text-align: center;
      padding: 40px 20px;
      color: #6b7a8a;
    }

    .vide-histo .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .vide-histo h2 {
      font-size: 20px;
      font-weight: 400;
      color: #2c2c2c;
      margin-bottom: 4px;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    .vide-histo p {
      color: #6b7a8a;
      font-size: 15px;
    }

    @media (max-width: 640px) {
      .page-compte { padding: 20px 16px; }
      .page-compte h1 { font-size: 24px; }
      .carte-compte { padding: 18px 16px; }
      .tabs-compte { justify-content: center; flex-wrap: wrap; }
      .tab-compte { font-size: 13px; padding: 8px 14px; }
      .champ-compte { flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 0; }
      .champ-compte .valeur { text-align: left; max-width: 100%; width: 100%; }
      .niveau-section .niveau-valeur { font-size: 32px; }
      .stats-activite { grid-template-columns: repeat(2, 1fr); }
      .stat-card .nombre { font-size: 22px; }
      .histo-item { flex-wrap: wrap; gap: 4px; }
      .histo-item .detail { flex-wrap: wrap; }
      .activite-item { flex-wrap: wrap; gap: 4px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- PAGE -->
  <div class="page-compte">

    <h1>Mon compte</h1>
    <p class="sous-titre-page">Vos informations, votre activité et votre historique.</p>

    <!-- ONGLETS -->
    <div class="tabs-compte" id="tabsContainer">
      <button class="tab-compte active" data-tab="profil" onclick="switchTab('profil')">Mon profil</button>
      <button class="tab-compte" data-tab="activite" onclick="switchTab('activite')">Mon activité</button>
      <button class="tab-compte" data-tab="historique" onclick="switchTab('historique')">Historique</button>
    </div>

    <!-- PROFIL -->
    <div id="tab-profil" class="tab-content-compte active">
      <div class="carte-compte">
        <div id="contenu-profil">
          <div style="text-align:center;padding:30px 0;color:#6b7a8a;">
            <div style="display:inline-block;width:32px;height:32px;border:3px solid #d1ccc4;border-top-color:#6b7a8a;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIVITÉ -->
    <div id="tab-activite" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-activite">
          <div class="loader-histo"><div class="spinner"></div><p>Chargement...</p></div>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div id="tab-historique" class="tab-content-compte">
      <div class="carte-compte">
        <div id="contenu-historique">
          <div class="loader-histo"><div class="spinner"></div><p>Chargement...</p></div>
        </div>
      </div>
    </div>

    <a href="/medit/mes-textes.html" class="btn-retour-compte">← Retour</a>

  </div>

  <!-- FOOTER -->
  <div id="footer-container"></div>
  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // DONNÉES
    // ============================================================
    var toutesLesReponses = [];
    var niveauEtudiant = 0;
    var descriptionNiveau = '';
    var identifiant = '';

    // ============================================================
    // SWITCH D'ONGLET
    // ============================================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content-compte').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        el.classList.remove('active');
      });

      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.tab-compte').forEach(function(el) {
        if (el.dataset.tab === tabId) {
          el.classList.add('active');
        }
      });
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerCompte() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      identifiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          toutesLesReponses = data.reponses || [];
          descriptionNiveau = data.description || 'Aucune description.';

          afficherProfil();
          afficherActivite();
          afficherHistorique();
        })
        .catch(function() {
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            toutesLesReponses = cache.reponses || [];
            descriptionNiveau = cache.description || 'Aucune description.';
            afficherProfil();
            afficherActivite();
            afficherHistorique();
          } else {
            document.getElementById('contenu-profil').innerHTML = `
              <div style="text-align:center;padding:30px 0;">
                <p style="color:#6b7a8a;">Erreur de chargement.</p>
                <button onclick="location.reload()" 
                        style="margin-top:12px;padding:10px 24px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;cursor:pointer;">
                  Réessayer
                </button>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // AFFICHER PROFIL
    // ============================================================
    function afficherProfil() {
      var html = '';

      html += `
        <div class="champ-compte">
          <span class="label">Identifiant</span>
          <span class="valeur">${identifiant}</span>
        </div>
        <div class="champ-compte">
          <span class="label">Textes disponibles</span>
          <span class="valeur">${DataManager.posts ? DataManager.posts.length : '—'}</span>
        </div>
        <div class="champ-compte">
          <span class="label">Tentatives</span>
          <span class="valeur">${toutesLesReponses.length}</span>
        </div>
        <div class="niveau-section">
          <div class="niveau-titre">Votre niveau actuel</div>
          <div class="niveau-valeur">
            ${niveauEtudiant}
            <small>sur 12</small>
          </div>
          <div class="description-niveau">${descriptionNiveau}</div>
        </div>
        <div style="margin-top:20px;text-align:center;border-top:1px solid #d1ccc4;padding-top:16px;">
          <button onclick="rafraichir()" style="padding:10px 28px;background:transparent;color:#2c2c2c;border:1px solid #d1ccc4;border-radius:30px;font-size:14px;cursor:pointer;">
            Rafraîchir
          </button>
          <p style="font-size:12px;color:#6b7a8a;margin-top:6px;">Synchronise vos données avec le serveur</p>
        </div>
      `;

      document.getElementById('contenu-profil').innerHTML = html;
    }

    // ============================================================
    // AFFICHER ACTIVITÉ (stats globales)
    // ============================================================
    function afficherActivite() {
      var total = toutesLesReponses.length;
      var valides = 0;
      var annotes = 0;
      var reponsesEnvoyees = 0;
      var tempsTotalSecondes = 0;

      toutesLesReponses.forEach(function(item) {
        var bonnes = parseInt(item.bonnes) || 0;
        var totalQ = parseInt(item.total) || 0;
        if (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2)) {
          valides++;
        }

        if (item.annotations && item.annotations.trim() !== '') {
          annotes++;
        }

        if (item.reponseOuverte && item.reponseOuverte.trim() !== '') {
          reponsesEnvoyees++;
        }

        if (item.dureeTotale) {
          var parts = item.dureeTotale.split(':');
          if (parts.length === 3) {
            tempsTotalSecondes += parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
          }
        }
      });

      var heures = Math.floor(tempsTotalSecondes / 3600);
      var minutes = Math.floor((tempsTotalSecondes % 3600) / 60);
      var secondes = tempsTotalSecondes % 60;
      var tempsFormate = String(heures).padStart(2, '0') + ':' + 
                         String(minutes).padStart(2, '0') + ':' + 
                         String(secondes).padStart(2, '0');

      var taux = total > 0 ? Math.round((valides / total) * 100) : 0;

      var html = '';

      html += `
        <div class="stats-activite">
          <div class="stat-card">
            <span class="nombre">${valides}</span>
            <span class="label">Textes validés</span>
            <span class="sous-label">sur ${total} tentatives</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${annotes}</span>
            <span class="label">Textes annotés</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${reponsesEnvoyees}</span>
            <span class="label">Réponses envoyées</span>
          </div>
          <div class="stat-card">
            <span class="nombre">${taux}%</span>
            <span class="label">Taux de réussite</span>
          </div>
          <div class="stat-card" style="grid-column: span 2;">
            <span class="nombre">${tempsFormate}</span>
            <span class="label">Temps total passé</span>
          </div>
        </div>
      `;

      // Dernières activités (5 dernières)
      var recentes = toutesLesReponses.slice(-5).reverse();
      if (recentes.length > 0) {
        html += `<div class="activite-recente">`;
        html += `<div class="titre-section">Dernières activités</div>`;

        recentes.forEach(function(item) {
          var bonnes = parseInt(item.bonnes) || 0;
          var totalQ = parseInt(item.total) || 0;
          var valide = (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2));
          var statutClass = valide ? 'valide' : 'echec';
          var statutTexte = valide ? '✅ Validé' : '❌ Non validé';

          var date = item.date ? new Date(item.date) : null;
          var dateStr = date && !isNaN(date.getTime()) ? 
            date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '';

          var infos = [];
          if (item.annotations && item.annotations.trim() !== '') infos.push('✏️');
          if (item.reponseOuverte && item.reponseOuverte.trim() !== '') infos.push('📝');

          html += `
            <div class="activite-item">
              <span class="date">${dateStr}</span>
              <span class="titre">${item.titre || 'Sans titre'}</span>
              <span class="statut ${statutClass}">${statutTexte} ${infos.join(' ')}</span>
            </div>
          `;
        });

        html += `</div>`;
      } else {
        html += `
          <div class="vide-histo" style="padding:20px;">
            <span class="icone" style="font-size:32px;">◈</span>
            <h2 style="font-size:18px;">Aucune activité</h2>
            <p style="font-size:14px;">Commencez une méditation pour voir vos progrès.</p>
          </div>
        `;
      }

      document.getElementById('contenu-activite').innerHTML = html;
    }

    // ============================================================
    // AFFICHER HISTORIQUE (groupé par date)
    // ============================================================
    function afficherHistorique() {
      if (!toutesLesReponses || toutesLesReponses.length === 0) {
        document.getElementById('contenu-historique').innerHTML = `
          <div class="vide-histo">
            <span class="icone">◈</span>
            <h2>Aucune tentative</h2>
            <p>Commencez une méditation pour voir vos progrès ici.</p>
          </div>
        `;
        return;
      }

      // Grouper par date
      var grouped = {};
      toutesLesReponses.forEach(function(item) {
        if (!item.date) return;
        var d = new Date(item.date);
        if (isNaN(d.getTime())) return;
        var key = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      var dates = Object.keys(grouped).sort(function(a, b) {
        return new Date(b) - new Date(a);
      });

      var html = '';

      dates.forEach(function(dateKey) {
        var items = grouped[dateKey];
        // Trier par heure
        items.sort(function(a, b) {
          var da = a.date ? new Date(a.date) : new Date(0);
          var db = b.date ? new Date(b.date) : new Date(0);
          return da - db;
        });

        html += `<div class="groupe-date">`;
        html += `<div class="date-titre">${dateKey}</div>`;

        items.forEach(function(item) {
          var bonnes = parseInt(item.bonnes) || 0;
          var totalQ = parseInt(item.total) || 0;
          var valide = (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2));
          var statutClass = valide ? 'valide' : 'echec';
          var statutTexte = valide ? '✅ Validé' : '❌ Non validé';

          var d = item.date ? new Date(item.date) : null;
          var heure = d && !isNaN(d.getTime()) ? 
            d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';

          var details = [];
          if (totalQ > 0) {
            details.push(`${bonnes}/${totalQ}`);
          }
          if (item.temps) {
            details.push(`⏱️ ${item.temps}`);
          }
          if (item.annotations && item.annotations.trim() !== '') {
            details.push(`✏️ annoté`);
          }
          if (item.reponseOuverte && item.reponseOuverte.trim() !== '') {
            details.push(`📝 réponse`);
          }

          html += `
            <div class="histo-item">
              <span class="heure">${heure}</span>
              <span class="titre">${item.titre || 'Sans titre'}</span>
              <span class="detail">
                <span class="badge ${statutClass}">${statutTexte}</span>
                ${details.length > 0 ? details.join(' · ') : ''}
              </span>
            </div>
          `;
        });

        html += `</div>`;
      });

      document.getElementById('contenu-historique').innerHTML = html;
    }

    // ============================================================
    // RAFRAÎCHIR
    // ============================================================
    function rafraichir() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) return;

      var btn = document.querySelector('#contenu-profil button');
      if (!btn) return;

      var originalText = btn.textContent;
      btn.textContent = '...';
      btn.disabled = true;
      btn.style.opacity = '0.6';

      DataManager.rafraichir()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          toutesLesReponses = data.reponses || [];
          descriptionNiveau = data.description || 'Aucune description.';

          afficherProfil();
          afficherActivite();
          afficherHistorique();

          btn.textContent = '✓';
          btn.style.background = '#e8e5e0';
          btn.disabled = false;
          btn.style.opacity = '1';
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
            btn.style.background = 'transparent';
          }, 1500);
        })
        .catch(function() {
          btn.textContent = 'Erreur';
          btn.disabled = false;
          btn.style.opacity = '1';
          setTimeout(function() {
            btn.textContent = 'Rafraîchir';
          }, 1500);
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function demarrer() {
      chargerCompte();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
