<!-- mes-essais.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Mes essais - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    /* ===== PAGE BLOG (même structure que les-textes) ===== */
    .page-blog {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-blog h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-blog .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .barre-tri {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .tri-groupe {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .tri-groupe label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .tri-groupe select {
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .tri-groupe select:hover,
    .tri-groupe select:focus {
      border-color: var(--text-secondary);
    }

    .tri-reset {
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
    }

    .tri-reset:hover {
      color: var(--text);
      border-color: var(--text-secondary);
    }

    .page-blog .grille-themes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .carte-blog {
      display: flex;
      gap: 0;
      padding: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
      overflow: hidden;
    }

    .carte-blog:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-blog .blog-couverture {
      flex: 0 0 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #f5f5f5;
    }

    .carte-blog .blog-couverture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carte-blog .blog-couverture .couverture-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }

    .carte-blog .blog-centre {
      display: flex;
      gap: 20px;
      flex: 1;
      min-width: 0;
      padding: 18px 20px;
      box-sizing: border-box;
    }

    .carte-blog .blog-numero {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
      border-right: 1px solid var(--border);
      padding-right: 14px;
      box-sizing: border-box;
    }

    .carte-blog .blog-corps {
      flex: 1;
      min-width: 0;
    }

    .carte-blog .blog-titre {
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .carte-blog .blog-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .carte-blog .blog-meta .badge-icone,
    .carte-blog .blog-meta .niveau-badge,
    .carte-blog .blog-meta .mots {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .carte-blog .blog-extrait {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .carte-blog .blog-categorie {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .carte-blog .blog-date {
      flex: 0 0 auto;
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
      box-sizing: border-box;
    }

    .carte-blog .blog-date .date-label {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .carte-blog .blog-date .date-validation {
      color: var(--text);
    }

    /* Bouton "Revoir le texte" intégré dans la carte */
    .carte-blog .blog-date button {
      margin-top: 6px;
      padding: 6px 12px;
      font-size: 11px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      white-space: nowrap;
    }

    .carte-blog .blog-date button:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--text-secondary);
    }

    @media (max-width: 700px) {
      .page-blog { padding: 12px 16px 30px; }
      .page-blog h1 { font-size: 22px; }

      .carte-blog .blog-couverture {
        flex: 0 0 64px;
      }

      .carte-blog .blog-centre {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
      }

      .carte-blog .blog-numero {
        flex: 0 0 36px;
        font-size: 18px;
        padding-right: 10px;
      }

      .carte-blog .blog-date {
        flex: 1 0 100%;
        text-align: left;
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 8px;
        flex-direction: row;
        gap: 8px;
        align-items: center;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-blog">

    <h1>Mes essais</h1>
    <p class="sous-titre-page">Retrouvez ici toutes vos tentatives passées sur les textes. Cliquez sur « Revoir le texte » pour relire un texte et refaire les exercices.</p>

    <div class="barre-tri" id="barreTri">
      <div class="tri-groupe">
        <label for="triResultat">Résultat</label>
        <select id="triResultat" onchange="appliquerTri()">
          <option value="">Tous</option>
          <option value="valide">Validés (≥ 65 %)</option>
          <option value="non-valide">Non validés</option>
        </select>
      </div>
      <div class="tri-groupe">
        <label for="triAnnee">Année</label>
        <select id="triAnnee" onchange="appliquerTri()">
          <option value="">Toutes</option>
        </select>
      </div>
      <button class="tri-reset" onclick="reinitialiserTri()">Réinitialiser</button>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement de vos essais...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var tentativesData = [];
    var themesData = {};

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function anneeDe(dateStr) {
      if (!dateStr) return '';
      var parts = dateStr.split(' ')[0].split('/');
      if (parts.length === 3) return parts[2];
      return '';
    }

    function getNomUtilisateurCourant() {
      if (typeof getIdUtilisateur === 'function') {
        var id = getIdUtilisateur();
        if (id) return id;
      }
      var stock = localStorage.getItem('etudiant_id');
      if (stock) return stock;
      var inv = localStorage.getItem('invite_id');
      if (!inv) {
        inv = 'invite_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('invite_id', inv);
      }
      return inv;
    }

    function chargerEssais() {
      var nom = getNomUtilisateurCourant();
      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;

      // Charger les thèmes pour afficher la couverture
      DataManager.charger().then(function(data) {
        themesData = {};
        if (data.themes && Array.isArray(data.themes)) {
          data.themes.forEach(function(l) {
            themesData[l.titre] = {
              couleur: l.couleur || '#2d6a4f',
              couverture: l.couverture || ''
            };
          });
        }
        return fetchTentatives(nom, base);
      }).catch(function() {
        return fetchTentatives(nom, base);
      });
    }

    function fetchTentatives(nom, base) {
      return fetch(base + '?action=getTentativesUtilisateur&nom=' + encodeURIComponent(nom))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          tentativesData = (data && data.tentatives) ? data.tentatives : [];
          initialiserFiltres();
          afficherEssais();
        })
        .catch(function(err) {
          console.error(err);
          document.getElementById('loader').style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide-themes">
              <span class="icone">⚠</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion internet.</p>
            </div>
          `;
        });
    }

    function initialiserFiltres() {
      var annees = {};
      tentativesData.forEach(function(t) {
        var a = anneeDe(t.date);
        if (a) annees[a] = true;
      });
      var selAnnee = document.getElementById('triAnnee');
      // Vider les options sauf "Toutes"
      while (selAnnee.options.length > 1) selAnnee.remove(1);
      Object.keys(annees).sort(function(a, b) { return b - a; }).forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        selAnnee.appendChild(opt);
      });
    }

    function appliquerTri() { afficherEssais(); }

    function reinitialiserTri() {
      document.getElementById('triResultat').value = '';
      document.getElementById('triAnnee').value = '';
      afficherEssais();
    }

    function afficherEssais() {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var filtreResultat = document.getElementById('triResultat').value;
      var filtreAnnee = document.getElementById('triAnnee').value;

      var filtrees = tentativesData.slice();

      if (filtreResultat === 'valide') {
        filtrees = filtrees.filter(function(t) { return t.pourcentage >= 65; });
      } else if (filtreResultat === 'non-valide') {
        filtrees = filtrees.filter(function(t) { return t.pourcentage < 65; });
      }

      if (filtreAnnee) {
        filtrees = filtrees.filter(function(t) { return anneeDe(t.date) === filtreAnnee; });
      }

      var container = document.getElementById('contenu');
      var html = '<div class="grille-themes" id="listeEssais">';

      if (filtrees.length === 0) {
        html += `
          <div class="vide-themes">
            <span class="icone">◈</span>
            <h2>Aucun essai pour le moment</h2>
            <p>Passez des exercices sur un texte pour voir vos résultats ici.</p>
          </div>
        `;
      } else {
        filtrees.forEach(function(t) {
          html += construireCarteEssai(t);
        });
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function construireCarteEssai(t) {
      var numero = extraireNumeroTexte(t.titre);
      var titreAffiche = extraireTitreSansNumero(t.titre);
      var estValide = t.pourcentage >= 65;

      // Couverture : on cherche le thème via le texte — on n'a que le titre du texte ici,
      // donc on utilise un fallback générique
      var couleurTheme = '#2d6a4f';
      var couvertureTheme = '';

      // On tente de retrouver le texte dans les données chargées par DataManager
      var textes = [];
      try { textes = DataManager.getTousLesTextes() || []; } catch(e) {}
      var texteObj = null;
      for (var i = 0; i < textes.length; i++) {
        if (String(textes[i].id) === String(t.texteId)) { texteObj = textes[i]; break; }
      }
      if (texteObj && texteObj.categorie) {
        var meta = themesData[texteObj.categorie] || {};
        couleurTheme = meta.couleur || '#2d6a4f';
        couvertureTheme = meta.couverture || '';
      }

      var couvertureHtml = '';
      if (couvertureTheme) {
        couvertureHtml = '<div class="blog-couverture"><img src="' + escapeHtml(couvertureTheme) + '" alt="" loading="lazy"></div>';
      } else {
        couvertureHtml = '<div class="blog-couverture" style="background:' + couleurTheme + ';">' +
                         '<div class="couverture-fallback">◆</div></div>';
      }

      var numeroHtml = (numero !== Infinity)
        ? '<div class="blog-numero">' + numero + '</div>'
        : '<div class="blog-numero">◆</div>';

      var badgeResultat = estValide
        ? '<span class="badge-icone">Validé</span>'
        : '<span class="badge-icone">Non validé</span>';

      var extrait = 'Score : ' + t.bonnes + ' / ' + t.total + ' (' + t.pourcentage + ' %)';

      return `
        <div class="carte-blog">
          ${couvertureHtml}
          <div class="blog-centre">
            ${numeroHtml}
            <div class="blog-corps">
              <div class="blog-titre">${escapeHtml(titreAffiche || t.titre)}</div>
              <div class="blog-meta">
                <span class="niveau-badge">Niveau ${t.niveau}</span>
                ${badgeResultat}
              </div>
              <div class="blog-extrait">${escapeHtml(extrait)}</div>
            </div>
            <div class="blog-date">
              <span class="date-label">Fait le :</span>
              <span class="date-validation">${escapeHtml(t.date)}</span>
              <button onclick="event.stopPropagation(); window.location.href='/medit/texte.html?id=${encodeURIComponent(t.texteId)}'">Revoir le texte</button>
            </div>
          </div>
        </div>
      `;
    }

    function demarrer() { chargerEssais(); }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
