<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Lecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #121212; }
    body { font-family: 'Merriweather', serif; color: #e8e0d8; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #121212; }

    .lecture-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 32px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0; min-height: 64px; z-index: 10;
    }
    .lecture-header .meta-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .lecture-header .meta-left .cat-niveau { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: #6b6b6b; }
    .lecture-header .meta-left .titre { font-family: 'Merriweather', serif; font-size: 18px; font-weight: 400; color: #e8e0d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lecture-header .actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .lecture-header .actions .btn-close { background: none; border: none; color: #6b6b6b; font-size: 26px; cursor: pointer; padding: 4px 8px; line-height: 1; transition: color 0.2s; font-family: 'Inter', sans-serif; }
    .lecture-header .actions .btn-close:hover { color: #e8e0d8; }
    .lecture-header .actions .badge-statut { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; padding: 4px 14px; border-radius: 20px; background: #2a2a2a; color: #6b6b6b; letter-spacing: 0.3px; display: none; }
    .lecture-header .actions .badge-statut.valide { display: inline-block; background: #1e3a2a; color: #7ab893; }
    .lecture-header .actions .badge-statut.non-valide { display: inline-block; background: #3a1e1e; color: #c87a7a; }
    .lecture-header .actions .badge-statut.en-attente { display: inline-block; background: #2a2a1e; color: #c8b87a; }

    .lecture-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #161616; }
    .pages-wrapper { flex: 1; overflow-y: auto; padding: 20px 40px; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #2a2a2a transparent; }
    .pages-wrapper::-webkit-scrollbar { width: 4px; }
    .pages-wrapper::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .page-item {
      min-height: calc(100vh - 180px);
      display: flex; flex-direction: column; justify-content: center;
      padding: 30px 20px; max-width: 780px; margin: 0 auto;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      scroll-margin-top: 20px;
    }
    .page-item.visible { opacity: 1; transform: translateY(0); }
    .page-item .page-content { font-size: 19px; line-height: 1.9; color: #e0d8d0; font-weight: 300; letter-spacing: 0.3px; }
    .page-item .page-content p { margin-bottom: 1.2em; }
    .page-item .page-content p:last-child { margin-bottom: 0; }

    .page-item.slide .page-content { font-size: 21px; line-height: 2; }
    .page-item.slide .page-content .slide-idee { font-style: italic; color: #6b6b6b; border-left: 3px solid #2a2a2a; padding-left: 20px; }
    .page-item.slide .slide-num { font-family: 'Inter', sans-serif; font-size: 12px; color: #3a3a3a; text-align: right; margin-top: 20px; letter-spacing: 0.5px; }

    .page-item.quiz .page-content { font-size: 18px; }
    .page-item.quiz .quiz-question { font-weight: 400; font-size: 20px; margin-bottom: 20px; color: #e8e0d8; }
    .page-item.quiz .quiz-reponses { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .page-item.quiz .quiz-reponse {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
      border-radius: 8px; background: #1e1e1e; border: 1px solid #2a2a2a;
      cursor: pointer; transition: all 0.2s ease;
      font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 400; color: #c8c0b8;
    }
    .page-item.quiz .quiz-reponse:hover { background: #262626; border-color: #3a3a3a; }
    .page-item.quiz .quiz-reponse .lettre { font-weight: 600; color: #6b6b6b; min-width: 24px; font-size: 13px; }
    .page-item.quiz .quiz-reponse.selectionnee { border-color: #4a6a5a; background: #1e2a24; }
    .page-item.quiz .quiz-reponse.correcte { border-color: #4a8a5a; background: #1a2a1e; color: #8ac8a0; }
    .page-item.quiz .quiz-reponse.incorrecte { border-color: #8a4a4a; background: #2a1a1a; color: #c88a8a; }
    .page-item.quiz .quiz-reponse .result-icon { margin-left: auto; font-size: 18px; }
    .page-item.quiz .quiz-feedback { margin-top: 16px; padding: 14px 20px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px; display: none; background: #1a1a1a; border: 1px solid #2a2a2a; }
    .page-item.quiz .quiz-feedback.visible { display: block; }
    .page-item.quiz .quiz-feedback .bonne-reponse { color: #8ac8a0; }

    .page-item.open-question .page-content { font-size: 18px; }
    .page-item.open-question .open-question-text { font-weight: 400; font-size: 20px; color: #e8e0d8; margin-bottom: 16px; }
    .page-item.open-question textarea { width: 100%; min-height: 120px; padding: 14px 18px; border-radius: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0d8d0; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6; resize: vertical; transition: border-color 0.2s; }
    .page-item.open-question textarea:focus { outline: none; border-color: #4a6a5a; }
    .page-item.open-question textarea::placeholder { color: #4a4a4a; }
    .page-item.open-question .btn-envoyer-reponse { margin-top: 12px; padding: 10px 28px; border-radius: 8px; background: transparent; border: 1px solid #4a6a5a; color: #8ac8a0; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; align-self: flex-start; }
    .page-item.open-question .btn-envoyer-reponse:hover { background: #1a2a1e; border-color: #5a8a6a; }
    .page-item.open-question .btn-envoyer-reponse:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-item.open-question .reponse-confirmation { margin-top: 12px; font-family: 'Inter', sans-serif; font-size: 14px; color: #7ab893; display: none; }
    .page-item.open-question .reponse-confirmation.visible { display: block; }

    .page-item.retenir .page-content { font-size: 18px; text-align: center; }
    .page-item.retenir .retenir-mots { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin: 24px 0; }
    .page-item.retenir .retenir-mot { font-family: 'Merriweather', serif; font-size: 28px; font-weight: 400; color: #e8e0d8; padding: 12px 24px; border: 1px solid #2a2a2a; border-radius: 8px; background: #1a1a1a; }
    .page-item.retenir .retenir-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: #6b6b6b; margin-bottom: 8px; }

    .lecture-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6b6b6b; font-family: 'Inter', sans-serif; font-size: 14px; }
    .lecture-loader .spinner { width: 32px; height: 32px; border: 3px solid #2a2a2a; border-top-color: #6b6b6b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lecture-error { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6b6b6b; font-family: 'Inter', sans-serif; text-align: center; padding: 40px; }
    .lecture-error .icone { font-size: 48px; margin-bottom: 16px; }
    .lecture-error h2 { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 400; color: #e8e0d8; margin-bottom: 8px; }
    .lecture-error p { font-size: 14px; color: #6b6b6b; }
    .lecture-error .btn-retour { margin-top: 20px; padding: 10px 28px; border-radius: 8px; background: transparent; border: 1px solid #2a2a2a; color: #c8c0b8; font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .lecture-error .btn-retour:hover { background: #2a2a2a; }

    @media (max-width: 768px) {
      .lecture-header { padding: 10px 16px; min-height: 56px; }
      .lecture-header .meta-left .titre { font-size: 15px; }
      .pages-wrapper { padding: 12px 16px; }
      .page-item { padding: 20px 12px; min-height: calc(100vh - 160px); }
      .page-item .page-content { font-size: 17px; line-height: 1.8; }
      .page-item.slide .page-content { font-size: 18px; line-height: 1.9; }
      .page-item.quiz .quiz-question { font-size: 17px; }
      .page-item.quiz .quiz-reponse { font-size: 14px; padding: 10px 14px; }
      .page-item.retenir .retenir-mot { font-size: 22px; padding: 10px 18px; }
      .page-item.open-question textarea { min-height: 100px; font-size: 14px; }
    }
    @media (max-width: 480px) {
      .lecture-header { padding: 8px 12px; min-height: 50px; }
      .lecture-header .meta-left .titre { font-size: 13px; }
      .pages-wrapper { padding: 8px 10px; }
      .page-item { padding: 16px 8px; min-height: calc(100vh - 140px); }
      .page-item .page-content { font-size: 15px; line-height: 1.7; }
      .page-item.slide .page-content { font-size: 16px; line-height: 1.8; }
      .page-item.quiz .quiz-question { font-size: 15px; }
      .page-item.quiz .quiz-reponse { font-size: 13px; padding: 8px 12px; gap: 10px; }
      .page-item.quiz .quiz-reponse .lettre { font-size: 12px; min-width: 20px; }
      .page-item.retenir .retenir-mot { font-size: 18px; padding: 8px 14px; }
      .page-item.open-question .btn-envoyer-reponse { padding: 8px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="lecture-header">
    <div class="meta-left">
      <div class="cat-niveau">
        <span id="metaCategorie">—</span> · <span id="metaNiveau">Niveau —</span>
      </div>
      <div class="titre" id="metaTitre">Chargement...</div>
    </div>
    <div class="actions">
      <span class="badge-statut" id="badgeStatut"></span>
      <button class="btn-close" id="btnFermer">✕</button>
    </div>
  </header>

  <div class="lecture-body">
    <div class="pages-wrapper" id="pagesWrapper">
      <div class="lecture-loader" id="lectureLoader">
        <div class="spinner"></div>
        <span>Chargement...</span>
      </div>
    </div>
  </div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';

    var etat = { postId: null, post: null, pages: [], reponsesQuiz: {}, totalBonnes: 0, totalQuestions: 0, statutFinal: null };

    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id) { afficherErreur('Aucun identifiant.'); return; }
      etat.postId = id;
      chargerPost(id);
    });

    function chargerPost(id) {
      fetch(SCRIPT_URL + '?action=getPost&id=' + encodeURIComponent(id))
        .then(function(r) { if (!r.ok) throw new Error('Erreur réseau'); return r.json(); })
        .then(function(data) {
          if (!data.success || !data.post) throw new Error(data.message || 'Texte introuvable');
          etat.post = data.post;
          preparerPages(etat.post);
          afficherLiseuse();
        })
        .catch(function(error) { afficherErreur(error.message); });
    }

    // ============================================================
    // PARSER SIMPLE : cherche UNIQUEMENT les indicateurs
    // ============================================================
    function parserContenu(texte) {
      var result = { slides: [], quizs: [], openQuestions: [], retenir: [] };
      if (!texte) return result;

      // Liste des indicateurs à chercher
      var patterns = ['-s-', '-q-', '-v-', '-f-', '-qs-', '-r-', '-i-'];
      var indices = [];

      // Trouver toutes les positions des indicateurs
      for (var p = 0; p < patterns.length; p++) {
        var pos = texte.indexOf(patterns[p]);
        while (pos !== -1) {
          indices.push({ pos: pos, pattern: patterns[p] });
          pos = texte.indexOf(patterns[p], pos + 1);
        }
      }

      // Trier par position
      indices.sort(function(a, b) { return a.pos - b.pos; });

      // Découper le texte en éléments
      var elements = [];
      for (var i = 0; i < indices.length; i++) {
        var start = indices[i].pos;
        var end = (i + 1 < indices.length) ? indices[i + 1].pos : texte.length;
        var element = texte.substring(start, end).trim();
        if (element) elements.push(element);
      }

      // Parcourir les éléments
      var quizCourant = null;

      for (var i = 0; i < elements.length; i++) {
        var ligne = elements[i].trim();
        if (!ligne) continue;

        // --- SLIDE ---
        if (ligne.startsWith('-s-')) {
          var contenuSlide = ligne.replace('-s-', '').trim();
          result.slides.push(contenuSlide || 'Slide vide');
          continue;
        }

        // --- QUIZ : nouvelle question ---
        if (ligne.startsWith('-q-')) {
          // Si on avait un quiz en cours, on le sauvegarde
          if (quizCourant && quizCourant.reponses.length > 0) {
            result.quizs.push(quizCourant);
          }
          var qText = ligne.replace('-q-', '').trim() || 'Question';
          quizCourant = { question: qText, reponses: [] };
          continue;
        }

        // --- RÉPONSE VRAIE ---
        if (ligne.startsWith('-v-')) {
          if (quizCourant) {
            quizCourant.reponses.push({ texte: ligne.replace('-v-', '').trim() || 'Vrai', correct: true });
          }
          continue;
        }

        // --- RÉPONSE FAUSSE ---
        if (ligne.startsWith('-f-')) {
          if (quizCourant) {
            quizCourant.reponses.push({ texte: ligne.replace('-f-', '').trim() || 'Faux', correct: false });
          }
          continue;
        }

        // --- QUESTION OUVERTE ---
        if (ligne.startsWith('-qs-')) {
          result.openQuestions.push(ligne.replace('-qs-', '').trim() || 'Question ouverte');
          continue;
        }

        // --- RETENIR ---
        if (ligne.startsWith('-r-')) {
          var retenirText = ligne.replace('-r-', '').trim();
          if (retenirText) {
            var mots = retenirText.split(',').map(function(m) { return m.trim(); });
            result.retenir = mots.filter(function(m) { return m.length > 0; });
          }
          continue;
        }

        // --- INFO (ignoré) ---
        if (ligne.startsWith('-i-')) {
          continue;
        }
      }

      // Sauvegarder le dernier quiz
      if (quizCourant && quizCourant.reponses.length > 0) {
        result.quizs.push(quizCourant);
      }

      return result;
    }

    // ============================================================
    // PRÉPARER LES PAGES
    // ============================================================
    function preparerPages(post) {
      var pages = [];
      var contenu = post.contenu || '';
      var parsed = parserContenu(contenu);

      parsed.slides.forEach(function(slide, index) {
        pages.push({ type: 'slide', contenu: slide, numero: index + 1 });
      });

      parsed.quizs.forEach(function(quiz, index) {
        pages.push({ type: 'quiz', question: quiz.question, reponses: quiz.reponses, index: index });
      });

      parsed.openQuestions.forEach(function(q, index) {
        pages.push({ type: 'open-question', question: q, index: index });
      });

      if (parsed.retenir && parsed.retenir.length > 0) {
        pages.push({ type: 'retenir', mots: parsed.retenir });
      }

      etat.pages = pages;
    }

    // ============================================================
    // AFFICHER
    // ============================================================
    function afficherLiseuse() {
      var wrapper = document.getElementById('pagesWrapper');
      var post = etat.post;

      document.getElementById('metaTitre').textContent = post.titre || 'Sans titre';
      document.getElementById('metaCategorie').textContent = post.categorie || 'Sans catégorie';
      document.getElementById('metaNiveau').textContent = 'Niveau ' + (post.niveau || 0);

      var html = '';

      etat.pages.forEach(function(page, index) {
        var typeClass = page.type;
        var visibleClass = index === 0 ? ' visible' : '';
        html += '<div class="page-item ' + typeClass + visibleClass + '" data-index="' + index + '" id="page-' + index + '">';
        html += '<div class="page-content">';

        if (page.type === 'slide') {
          var content = page.contenu || '';
          var paragraphs = content.split('\n').filter(function(p) { return p.trim() !== ''; });
          html += paragraphs.map(function(p) { return '<p>' + p.trim() + '</p>'; }).join('');
          html += '<div class="slide-num">— ' + (index + 1) + ' —</div>';
        }

        if (page.type === 'quiz') {
          html += '<div class="quiz-question">' + (page.question || 'Question') + '</div>';
          html += '<div class="quiz-reponses" data-quiz-index="' + page.index + '">';
          var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
          page.reponses.forEach(function(rep, ri) {
            html += '<div class="quiz-reponse" data-reponse-index="' + ri + '" onclick="selectionnerReponse(' + page.index + ', ' + ri + ')">';
            html += '<span class="lettre">' + lettres[ri] + '</span>';
            html += '<span>' + (rep.texte || 'Réponse vide') + '</span>';
            html += '<span class="result-icon"></span>';
            html += '</div>';
          });
          html += '</div>';
          html += '<div class="quiz-feedback" id="quizFeedback-' + page.index + '">';
          html += '<div class="bonne-reponse" id="quizBonneReponse-' + page.index + '"></div>';
          html += '</div>';
        }

        if (page.type === 'open-question') {
          html += '<div class="open-question-text">' + (page.question || 'Question ouverte') + '</div>';
          html += '<textarea id="openReponse-' + page.index + '" placeholder="Écrivez votre réponse ici..."></textarea>';
          html += '<button class="btn-envoyer-reponse" onclick="envoyerReponseOuverte(' + page.index + ')">Envoyer la réponse</button>';
          html += '<div class="reponse-confirmation" id="openConfirmation-' + page.index + '">✓ Réponse enregistrée</div>';
        }

        if (page.type === 'retenir') {
          html += '<div class="retenir-label">📌 À retenir</div>';
          html += '<div class="retenir-mots">';
          page.mots.forEach(function(mot) {
            if (mot.trim()) html += '<span class="retenir-mot">' + mot.trim() + '</span>';
          });
          html += '</div>';
          html += '<p style="font-family:Inter,sans-serif;font-size:14px;color:#6b6b6b;margin-top:8px;">Ces mots-clés vous aideront à mémoriser l\'essentiel.</p>';
        }

        html += '</div>';
        html += '</div>';
      });

      wrapper.innerHTML = html;
      observerPages();
      document.getElementById('btnFermer').addEventListener('click', function() { window.location.href = '/medit/mes-textes.html'; });
      recupererStatutExistant();
    }

    function observerPages() {
      var wrapper = document.getElementById('pagesWrapper');
      if (!wrapper) return;
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      wrapper.querySelectorAll('.page-item').forEach(function(page) { observer.observe(page); });
    }

    // ============================================================
    // QUIZ
    // ============================================================
    function selectionnerReponse(quizIndex, reponseIndex) {
      var page = etat.pages.find(function(p) { return p.type === 'quiz' && p.index === quizIndex; });
      if (!page) return;
      if (etat.reponsesQuiz[quizIndex]) return;

      var reponses = document.querySelectorAll('#page-' + getPageIndex(quizIndex) + ' .quiz-reponse');
      var reponse = page.reponses[reponseIndex];

      reponses.forEach(function(el, idx) {
        el.classList.remove('selectionnee');
        if (idx === reponseIndex) el.classList.add('selectionnee');
      });

      etat.reponsesQuiz[quizIndex] = { reponseIndex: reponseIndex, correct: reponse.correct };
      afficherFeedbackQuiz(quizIndex);
    }

    function afficherFeedbackQuiz(quizIndex) {
      var page = etat.pages.find(function(p) { return p.type === 'quiz' && p.index === quizIndex; });
      if (!page) return;
      var reponseData = etat.reponsesQuiz[quizIndex];
      if (!reponseData) return;

      var reponses = document.querySelectorAll('#page-' + getPageIndex(quizIndex) + ' .quiz-reponse');
      var feedback = document.getElementById('quizFeedback-' + quizIndex);
      var bonneReponse = document.getElementById('quizBonneReponse-' + quizIndex);

      reponses.forEach(function(el, idx) {
        el.classList.remove('correcte', 'incorrecte');
        var icon = el.querySelector('.result-icon');
        if (idx === reponseData.reponseIndex) {
          if (reponseData.correct) { el.classList.add('correcte'); icon.textContent = '✓'; }
          else { el.classList.add('incorrecte'); icon.textContent = '✗'; }
        } else if (page.reponses[idx] && page.reponses[idx].correct) {
          el.classList.add('correcte');
          icon.textContent = '✓';
        } else {
          icon.textContent = '';
        }
      });

      if (reponseData.correct) {
        bonneReponse.textContent = '✅ Bonne réponse !';
      } else {
        var bonne = page.reponses.find(function(r) { return r.correct; });
        bonneReponse.textContent = '❌ La bonne réponse était : "' + (bonne ? bonne.texte : '—') + '"';
      }

      feedback.classList.add('visible');
      verifierQuizComplets();
    }

    function verifierQuizComplets() {
      var quizPages = etat.pages.filter(function(p) { return p.type === 'quiz'; });
      var tousRepondus = quizPages.every(function(q) { return etat.reponsesQuiz[q.index] !== undefined; });
      if (!tousRepondus) return;

      var totalBonnes = 0, totalQuestions = 0;
      quizPages.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) { totalQuestions++; if (rep.correct) totalBonnes++; }
      });

      etat.totalBonnes = totalBonnes;
      etat.totalQuestions = totalQuestions;

      var seuil = Math.ceil(totalQuestions / 2);
      etat.statutFinal = (totalQuestions > 0 && totalBonnes >= seuil) ? 'valide' : 'non-valide';
      if (totalQuestions === 0) etat.statutFinal = 'en-attente';

      mettreAJourBadge();
      sauvegarderQuiz();
    }

    function mettreAJourBadge() {
      var badge = document.getElementById('badgeStatut');
      if (etat.statutFinal === 'valide') { badge.textContent = '✅ Validé'; badge.className = 'badge-statut valide'; }
      else if (etat.statutFinal === 'non-valide') { badge.textContent = '📖 À relire'; badge.className = 'badge-statut non-valide'; }
      else { badge.textContent = '⏳ En cours'; badge.className = 'badge-statut en-attente'; }
    }

    function sauvegarderQuiz() {
      if (!etat.postId) return;
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var choixQcm = '';
      var quizPages = etat.pages.filter(function(p) { return p.type === 'quiz'; });
      quizPages.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) {
          if (choixQcm) choixQcm += '|';
          choixQcm += (rep.correct ? 'V' : 'F') + ':' + (rep.reponseIndex + 1);
        }
      });

      var url = SCRIPT_URL + '?action=saveQuiz' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(etat.post.titre || 'Quiz') +
        '&choixQcm=' + encodeURIComponent(choixQcm) +
        '&bonnes=' + encodeURIComponent(etat.totalBonnes) +
        '&total=' + encodeURIComponent(etat.totalQuestions);

      fetch(url).then(function(r) { return r.json(); }).then(function(data) { if (data.success) console.log('✅ Quiz sauvegardé'); }).catch(function(e) { console.error('Erreur sauvegarde:', e); });
    }

    // ============================================================
    // QUESTION OUVERTE
    // ============================================================
    function envoyerReponseOuverte(index) {
      var textarea = document.getElementById('openReponse-' + index);
      if (!textarea) return;
      var reponse = textarea.value.trim();
      if (!reponse) { alert('Veuillez écrire une réponse.'); return; }

      var btn = textarea.parentElement.querySelector('.btn-envoyer-reponse');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveReponseOuverte' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&reponseOuverte=' + encodeURIComponent(reponse);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var confirmation = document.getElementById('openConfirmation-' + index);
          if (data.success) {
            confirmation.classList.add('visible');
            textarea.disabled = true;
            btn.textContent = '✓ Envoyé';
          } else {
            alert('Erreur : ' + (data.message || 'Impossible d\'envoyer.'));
            btn.disabled = false;
            btn.textContent = 'Envoyer la réponse';
          }
        })
        .catch(function(e) {
          alert('Erreur réseau.');
          btn.disabled = false;
          btn.textContent = 'Envoyer la réponse';
        });
    }

    // ============================================================
    // UTILITAIRES
    // ============================================================
    function getPageIndex(quizIndex) {
      var pages = document.querySelectorAll('.page-item');
      for (var i = 0; i < pages.length; i++) {
        var page = etat.pages[i];
        if (page && page.type === 'quiz' && page.index === quizIndex) return i;
      }
      return 0;
    }

    function recupererStatutExistant() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      fetch(SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(nom))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses) {
            var reponse = data.reponses.find(function(r) { return r.articleId === etat.postId; });
            if (reponse && reponse.bonnes > 0 && reponse.total > 0) {
              var seuil = Math.ceil(reponse.total / 2);
              if (reponse.bonnes >= seuil) {
                etat.statutFinal = 'valide';
                etat.totalBonnes = reponse.bonnes;
                etat.totalQuestions = reponse.total;
                mettreAJourBadge();
              }
            }
          }
        })
        .catch(function(e) { console.error('Erreur récupération statut:', e); });
    }

    function afficherErreur(message) {
      document.getElementById('pagesWrapper').innerHTML = `
        <div class="lecture-error">
          <div class="icone">📖</div>
          <h2>Texte introuvable</h2>
          <p>${message || 'Le texte n\'existe pas.'}</p>
          <a href="/medit/mes-textes.html" class="btn-retour">← Retour</a>
        </div>
      `;
    }

    window.selectionnerReponse = selectionnerReponse;
    window.envoyerReponseOuverte = envoyerReponseOuverte;
  </script>
</body>
</html>
