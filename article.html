<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Lecture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬜⬜⬜</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
</head>
<body>

  <header class="lecture-header">
    <div class="meta-left">
      <div class="cat-niveau">
        <span id="metaCategorie">—</span> · <span id="metaNiveau">Niveau —</span>
      </div>
      <div class="titre" id="metaTitre">Chargement...</div>
    </div>
    <div class="actions">
      <span class="badge-statut" id="badgeStatut"></span>
      <button class="btn-close" id="btnFermer">✕</button>
    </div>
  </header>

  <div class="slides-container" id="slidesContainer">
    <div class="lecture-loader" id="lectureLoader">
      <div class="spinner"></div>
      <span>Chargement...</span>
    </div>

    <!-- Commandes de taille en bas à droite -->
    <div class="font-control-bottom" id="fontControlsBottom">
      <button id="fontDecreaseBottom" title="Réduire la taille du texte">−</button>
      <span class="size-indicator" id="fontSizeDisplayBottom">18</span>
      <button id="fontIncreaseBottom" title="Augmenter la taille du texte">+</button>
    </div>
  </div>

  <div class="pagination-text" id="pagination">1 / 1</div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';

    var etat = {
      postId: null,
      post: null,
      slides: [],
      currentIndex: 0,
      reponsesQuiz: {},
      totalBonnes: 0,
      totalQuestions: 0,
      statutFinal: null,
      enTransition: false,
      notes: {},
      ordreValide: {},
      cartesResultats: {},
      cartesTotal: 0,
      cartesBonnes: 0,
      carteCourante: null
    };

    // ============================================================
    // GESTION DE LA TAILLE DE POLICE (sauvegardée)
    // ============================================================
    var FONT_SIZE_KEY = 'medit_font_size';
    var FONT_SIZE_MIN = 12;
    var FONT_SIZE_MAX = 32;
    var DEFAULT_FONT_SIZE = 18;

    function getSavedFontSize() {
      var saved = localStorage.getItem(FONT_SIZE_KEY);
      if (saved) {
        var val = parseInt(saved, 10);
        if (!isNaN(val) && val >= FONT_SIZE_MIN && val <= FONT_SIZE_MAX) {
          return val;
        }
      }
      return DEFAULT_FONT_SIZE;
    }

    function setFontSize(size) {
      size = Math.min(Math.max(size, FONT_SIZE_MIN), FONT_SIZE_MAX);
      localStorage.setItem(FONT_SIZE_KEY, String(size));
      document.documentElement.style.setProperty('--slide-font-size', size + 'px');
      var display = document.getElementById('fontSizeDisplayBottom');
      if (display) display.textContent = size;
      document.querySelectorAll('.slide-content').forEach(function(el) {
        el.style.fontSize = size + 'px';
      });
    }

    function increaseFont() {
      var current = getSavedFontSize();
      setFontSize(current + 2);
    }

    function decreaseFont() {
      var current = getSavedFontSize();
      setFontSize(current - 2);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id) { afficherErreur('Aucun identifiant.'); return; }
      etat.postId = id;
      chargerPost(id);

      var initialSize = getSavedFontSize();
      setFontSize(initialSize);

      document.getElementById('fontIncreaseBottom').addEventListener('click', increaseFont);
      document.getElementById('fontDecreaseBottom').addEventListener('click', decreaseFont);
    });

    // ============================================================
    // CHARGER LE POST
    // ============================================================
    function chargerPost(id) {
      fetch(SCRIPT_URL + '?action=getPost&id=' + encodeURIComponent(id))
        .then(function(r) { 
          if (!r.ok) throw new Error('Erreur réseau: ' + r.status); 
          return r.json(); 
        })
        .then(function(data) {
          console.log('📦 Données reçues du serveur:', data);
          
          if (!data.success || !data.post) throw new Error(data.message || 'Texte introuvable');
          
          var post = data.post;
          var contenu = post.contenu || '';
          
          console.log('📄 Contenu brut:', contenu);
          
          var parts = contenu.split(' | ');
          
          var slidesArray = [];
          var quiz = '';
          var openQuestion = '';
          var ordre = '';
          var carte = '';
          var retenir = '';
          
          parts.forEach(function(part) {
            part = part.trim();
            
            if (part.startsWith('q:')) {
              quiz = part;
            } else if (part.startsWith('qs:')) {
              openQuestion = part;
            } else if (part.startsWith('o:')) {
              ordre = part;
            } else if (part.startsWith('r:')) {
              carte = part;
            } else if (part.startsWith('#')) {
              retenir = part;
            } else {
              var cleanText = part.replace(/\r\n/g, '\n').trim();
              if (cleanText) {
                var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
                subSlides.forEach(function(sub) {
                  slidesArray.push(sub.trim());
                });
              }
            }
          });
          
          console.log('📊 Slides array (' + slidesArray.length + ' slides):', slidesArray);
          console.log('📊 Quiz:', quiz);
          console.log('📊 OpenQ:', openQuestion);
          console.log('📊 Ordre:', ordre);
          console.log('📊 Carte:', carte);
          console.log('📊 Retenir:', retenir);
          
          etat.post = post;
          
          preparerSlidesV2(post, slidesArray, quiz, openQuestion, ordre, carte, retenir);
          
          console.log('📊 Slides générés:', etat.slides);
          
          if (etat.slides.length === 0) {
            afficherErreur('Aucun contenu trouvé dans ce post.');
            return;
          }
          
          recupererNotes();
          afficherSlides();
        })
        .catch(function(error) { 
          console.error('❌ Erreur:', error);
          afficherErreur(error.message); 
        });
    }

    // ============================================================
    // PRÉPARER LES SLIDES
    // ============================================================
    function preparerSlidesV2(post, slidesArray, quiz, openQuestion, ordre, carte, retenir) {
      var slidesFinal = [];
      
      slidesArray.forEach(function(texteSlide) {
        if (texteSlide.trim() !== '') {
          slidesFinal.push({ type: 'slide', contenu: texteSlide.trim() });
        }
      });
      
      if (quiz.trim() !== '') {
        var quizsParsed = parserQuizs(quiz);
        quizsParsed.forEach(function(qp) {
          if (qp && qp.reponses.length > 0) {
            slidesFinal.push({ type: 'quiz', question: qp.question, reponses: qp.reponses, index: slidesFinal.length });
          }
        });
      }
      
      if (openQuestion.trim() !== '') {
        slidesFinal.push({ type: 'open', question: openQuestion.replace(/^qs:\s*/i, '').trim(), index: slidesFinal.length });
      }
      
      if (ordre.trim() !== '') {
        var ordreParsed = parserOrdre(ordre);
        if (ordreParsed && ordreParsed.length > 0) {
          slidesFinal.push({ type: 'ordre', elements: ordreParsed, index: slidesFinal.length });
        }
      }
      
      if (carte.trim() !== '') {
        var carteParsed = parserCarte(carte);
        if (carteParsed) {
          slidesFinal.push({ type: 'carte', recto: carteParsed.recto, verso: carteParsed.verso, index: slidesFinal.length });
        }
      }
      
      if (retenir.trim() !== '') {
        var mots = retenir.replace(/^#\s*/, '').split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m.length > 0; });
        if (mots.length > 0) {
          slidesFinal.push({ type: 'retenir', mots: mots });
        }
      }
      
      console.log('✅ Slides construits :', slidesFinal);
      etat.slides = slidesFinal;
    }

    // ============================================================
    // PARSEUR QUIZ (gère plusieurs quiz)
    // ============================================================
    function parserQuizs(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      if (lignes.length === 0) return [];
      
      var quizs = [];
      var currentQuiz = null;
      
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var trimmed = ligne.trim();
        
        if (trimmed.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) {
            quizs.push(currentQuiz);
          }
          currentQuiz = {
            question: trimmed.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var isCorrect = false;
          var isFaux = false;
          var texteRep = trimmed;
          
          if (/^v\s/i.test(trimmed) || /^-v-\s*/.test(trimmed) || trimmed.toLowerCase() === 'v') {
            isCorrect = true;
            texteRep = trimmed.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(trimmed) || /^-f-\s*/.test(trimmed) || trimmed.toLowerCase() === 'f') {
            isFaux = true;
            texteRep = trimmed.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          
          if (isCorrect || isFaux) {
            currentQuiz.reponses.push({
              texte: texteRep || (isCorrect ? 'Vrai' : 'Faux'),
              correct: isCorrect
            });
          }
        }
      }
      
      if (currentQuiz && currentQuiz.reponses.length > 0) {
        quizs.push(currentQuiz);
      }
      
      return quizs;
    }

    // ============================================================
    // PARSEURS SPÉCIFIQUES
    // ============================================================
    function parserOrdre(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push('-' + match[1] + '-' + match[2]);
        }
      }
      
      return elements;
    }

    function parserCarte(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var recto = '';
      var verso = '';
      
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.toLowerCase().startsWith('r:')) {
          recto = ligne.replace(/^r:\s*/i, '').trim() || 'Question';
        } else if (ligne.toLowerCase().startsWith('v:')) {
          verso = ligne.replace(/^v:\s*/i, '').trim() || 'Réponse';
        }
      }
      
      if (recto === '') return null;
      return { recto: recto, verso: verso };
    }

    // ============================================================
    // RÉCUPÉRER LES NOTES
    // ============================================================
    function recupererNotes() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      fetch(SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(nom))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses) {
            var reponse = data.reponses.find(function(r) { return r.articleId === etat.postId; });
            if (reponse && reponse.annotations) {
              var parts = reponse.annotations.split('|');
              for (var i = 0; i < parts.length; i++) {
                var kv = parts[i].split(':');
                if (kv.length === 2 && kv[0].startsWith('slide')) {
                  var slideNum = parseInt(kv[0].replace('slide', ''));
                  etat.notes[slideNum] = kv[1];
                }
              }
            }
          }
        })
        .catch(function(e) { console.error('Erreur récupération notes:', e); });
    }

    // ============================================================
    // AFFICHER LES SLIDES
    // ============================================================
    function afficherSlides() {
      var container = document.getElementById('slidesContainer');
      var post = etat.post;
      document.getElementById('metaTitre').textContent = post.titre || 'Sans titre';
      document.getElementById('metaCategorie').textContent = post.categorie || 'Sans catégorie';
      document.getElementById('metaNiveau').textContent = 'Niveau ' + (post.niveau || 0);

      if (etat.slides.length === 0) {
        container.innerHTML = '<div class="lecture-error"><div class="icone">⬜⬜⬜</div><h2>Aucun contenu</h2><p>Ce texte ne contient aucune slide.</p></div>';
        return;
      }

      var html = '';
      etat.slides.forEach(function(slide, index) {
        var activeClass = index === 0 ? ' active' : '';
        html += '<div class="slide-wrapper' + activeClass + '" data-index="' + index + '" id="slide-' + index + '">';
        html += '<div class="slide-content';
        if (slide.type === 'quiz') html += ' quiz-content';
        else if (slide.type === 'open') html += ' open-content';
        else if (slide.type === 'retenir') html += ' retenir-content';
        else if (slide.type === 'ordre') html += ' ordre-content';
        else if (slide.type === 'carte') html += ' carte-content';
        html += '" id="slideContent-' + index + '">';

        if (slide.type === 'slide') {
          var paragraphs = (slide.contenu || '').split('\n').filter(function(p) { return p.trim() !== ''; });
          html += paragraphs.map(function(p) { return '<p>' + p.trim() + '</p>'; }).join('');
        }

        if (slide.type === 'quiz') {
          html += afficherQuiz(slide);
        }

        if (slide.type === 'open') {
          html += afficherOpen(slide);
        }

        if (slide.type === 'ordre') {
          html += afficherOrdre(slide, index);
        }

        if (slide.type === 'carte') {
          html += afficherCarte(slide, index);
        }

        if (slide.type === 'retenir') {
          html += afficherRetenir(slide);
        }

        if (slide.type === 'slide') {
          html += '<div class="note-toggle" id="noteToggle-' + index + '" onclick="toggleNote(' + index + ')" title="Ajouter une note">✎</div>';
          html += '<div class="note-area" id="noteArea-' + index + '">';
          html += '<textarea id="noteText-' + index + '" placeholder="Écrire une note sur ce slide..." oninput="autoSaveNote(' + index + ')"></textarea>';
          html += '<div class="note-indicator" id="noteIndicator-' + index + '">◉ Enregistrement automatique</div>';
          html += '</div>';
        }

        html += '</div>';
        html += '</div>';
      });

      var controls = document.getElementById('fontControlsBottom');
      var loader = document.getElementById('lectureLoader');
      if (loader) loader.style.display = 'none';

      var oldWrappers = container.querySelectorAll('.slide-wrapper');
      oldWrappers.forEach(function(el) { el.remove(); });

      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      while (tempDiv.firstChild) {
        container.insertBefore(tempDiv.firstChild, controls);
      }

      for (var slideNum in etat.notes) {
        var textarea = document.getElementById('noteText-' + slideNum);
        if (textarea) {
          textarea.value = etat.notes[slideNum];
          var indicator = document.getElementById('noteIndicator-' + slideNum);
          if (indicator) {
            indicator.textContent = '✓ Note chargée';
            indicator.className = 'note-indicator saved';
          }
        }
      }

      container.addEventListener('click', function(e) {
        var target = e.target;
        if (target.closest('.quiz-reponse') ||
            target.closest('.btn-continuer') ||
            target.closest('.btn-envoyer-reponse') ||
            target.closest('textarea') ||
            target.closest('.btn-fermer-slide') ||
            target.closest('.note-toggle') ||
            target.closest('.note-area') ||
            target.closest('.ordre-item') ||
            target.closest('.btn-valider-ordre') ||
            target.closest('.carte-container') ||
            target.closest('.carte-boutons') ||
            target.closest('.font-control-bottom')) {
          return;
        }
        var rect = container.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var width = rect.width;
        if (x < width * 0.2) {
          slidePrecedente();
        } else {
          slideSuivante();
        }
      });

      var scrollTimeout = null;
      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(function() { scrollTimeout = null; }, 900);
        if (e.deltaY > 0) {
          slideSuivante();
        } else {
          slidePrecedente();
        }
      }, { passive: false });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          slideSuivante();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          slidePrecedente();
        }
      });

      document.getElementById('btnFermer').addEventListener('click', function() {
        fermerLiseuse();
      });

      recupererStatutExistant();
      mettreAJourPagination();

      var currentSize = getSavedFontSize();
      document.querySelectorAll('.slide-content').forEach(function(el) {
        el.style.fontSize = currentSize + 'px';
      });
    }

    // ============================================================
    // FONCTIONS D'AFFICHAGE
    // ============================================================
    function afficherQuiz(slide) {
      var html = '';
      html += '<div class="quiz-question">' + (slide.question || 'Question') + '</div>';
      html += '<div class="quiz-reponses" data-quiz-index="' + slide.index + '">';
      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
      slide.reponses.forEach(function(rep, ri) {
        html += '<div class="quiz-reponse" data-reponse-index="' + ri + '" onclick="selectionnerReponse(event, ' + slide.index + ', ' + ri + ')">';
        html += '<span class="lettre">' + lettres[ri] + '</span>';
        html += '<span>' + (rep.texte || 'Réponse vide') + '</span>';
        html += '<span class="result-icon"></span>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="quiz-feedback" id="quizFeedback-' + slide.index + '">';
      html += '<div class="bonne-reponse" id="quizBonneReponse-' + slide.index + '"></div>';
      html += '</div>';
      html += '<button class="btn-continuer" id="btnContinuer-' + slide.index + '" onclick="slideSuivante()">Continuer →</button>';
      return html;
    }

    function afficherOpen(slide) {
      var html = '';
      html += '<div class="open-question-text">' + (slide.question || 'Question ouverte') + '</div>';
      html += '<textarea id="openReponse-' + slide.index + '" placeholder="Écrivez votre réponse ici..."></textarea>';
      html += '<button class="btn-envoyer-reponse" onclick="envoyerReponseOuverte(event, ' + slide.index + ')">Envoyer la réponse</button>';
      html += '<div class="reponse-confirmation" id="openConfirmation-' + slide.index + '">♡ ⎙ ⌲ Réponse enregistrée</div>';
      html += '<button class="btn-continuer" id="btnContinuerOpen-' + slide.index + '" onclick="slideSuivante()">Continuer →</button>';
      return html;
    }

    function afficherRetenir(slide) {
      var html = '';
      html += '<div class="retenir-label">♡ À retenir</div>';
      html += '<div class="retenir-mots">';
      slide.mots.forEach(function(mot) {
        if (mot.trim()) html += '<span class="retenir-mot">' + mot.trim() + '</span>';
      });
      html += '</div>';
      html += '<p style="font-family:Inter,sans-serif;font-size:14px;color:var(--text-secondary);margin-top:8px;text-align:center;">Ces mots-clés vous aideront à mémoriser l\'essentiel.</p>';
      html += '<button class="btn-fermer-slide" onclick="fermerLiseuse()">Fermer</button>';
      return html;
    }

    function afficherOrdre(slide, index) {
      var elements = slide.elements || [];
      var shuffled = elements.slice();
      for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
      }

      var html = '';
      html += '<h3 style="font-family:Inter,sans-serif;font-size:18px;font-weight:500;margin-bottom:8px;text-align:center;">Remettez dans l\'ordre</h3>';
      html += '<p style="font-family:Inter,sans-serif;font-size:14px;color:var(--text-secondary);text-align:center;margin-bottom:12px;">Utilisez les boutons ↑↓ pour réorganiser les éléments.</p>';
      html += '<div class="ordre-list" id="ordre-list-' + index + '">';

      for (var i = 0; i < shuffled.length; i++) {
        var num = shuffled[i].match(/^-(\d+)-/);
        var numValue = num ? num[1] : (i + 1);
        var texte = shuffled[i].replace(/^-\d+-/, '').trim();
        html += '<div class="ordre-item" data-pos="' + i + '" data-num="' + numValue + '">';
        html += '<span class="ordre-num">#' + (i + 1) + '</span>';
        html += '<span class="ordre-texte">' + texte + '</span>';
        html += '<div class="ordre-boutons">';
        html += '<button onclick="deplacerOrdre(this, -1, ' + index + ')" ' + (i === 0 ? 'disabled' : '') + '>↑</button>';
        html += '<button onclick="deplacerOrdre(this, 1, ' + index + ')" ' + (i === shuffled.length - 1 ? 'disabled' : '') + '>↓</button>';
        html += '</div>';
        html += '</div>';
      }

      html += '</div>';
      html += '<button class="btn-valider-ordre" id="btnValiderOrdre-' + index + '" onclick="validerOrdre(' + index + ')">Valider l\'ordre</button>';
      html += '<div class="ordre-resultat" id="ordreResultat-' + index + '"></div>';
      html += '<button class="btn-continuer" id="btnContinuerOrdre-' + index + '" onclick="slideSuivante()">Continuer →</button>';

      etat.ordreValide[index] = false;
      return html;
    }

    function afficherCarte(slide, index) {
      var html = '';
      html += '<div class="carte-indicateur">Cliquez sur la carte pour la retourner</div>';
      html += '<div class="carte-container" id="carteContainer-' + index + '" onclick="retournerCarte(' + index + ')">';
      html += '<div class="carte-inner" id="carteInner-' + index + '">';
      html += '<div class="carte-face carte-recto">' + (slide.recto || 'Question') + '</div>';
      html += '<div class="carte-face carte-verso">' + (slide.verso || 'Réponse') + '</div>';
      html += '</div>';
      html += '</div>';
      html += '<div class="carte-boutons" id="carteBoutons-' + index + '">';
      html += '<button class="btn-trouve" onclick="carteTrouve(' + index + ')">☑ J\'ai trouvé</button>';
      html += '<button onclick="cartePasTrouve(' + index + ')">◻ Je n\'ai pas trouvé</button>';
      html += '</div>';
      html += '<div class="carte-resultat" id="carteResultat-' + index + '"></div>';
      html += '<div class="carte-progression" id="carteProgression-' + index + '"></div>';
      html += '<button class="btn-continuer" id="btnContinuerCarte-' + index + '" onclick="slideSuivante()">Continuer →</button>';

      etat.cartesResultats[index] = null;
      return html;
    }

    // ============================================================
    // FONCTIONS DE NAVIGATION ET INTERACTION
    // ============================================================
    function selectionnerReponse(event, quizIndex, reponseIndex) {
      event.stopPropagation();
      var slide = etat.slides.find(function(s) { return s.type === 'quiz' && s.index === quizIndex; });
      if (!slide) return;
      if (etat.reponsesQuiz[quizIndex]) return;
      var slideEl = document.getElementById('slide-' + etat.slides.indexOf(slide));
      if (!slideEl) return;
      var reponses = slideEl.querySelectorAll('.quiz-reponse');
      var reponse = slide.reponses[reponseIndex];
      reponses.forEach(function(el, idx) {
        el.classList.remove('selectionnee');
        if (idx === reponseIndex) el.classList.add('selectionnee');
      });
      etat.reponsesQuiz[quizIndex] = { reponseIndex: reponseIndex, correct: reponse.correct };
      setTimeout(function() {
        afficherFeedbackQuiz(quizIndex);
      }, 300);
    }

    function afficherFeedbackQuiz(quizIndex) {
      var slide = etat.slides.find(function(s) { return s.type === 'quiz' && s.index === quizIndex; });
      if (!slide) return;
      var reponseData = etat.reponsesQuiz[quizIndex];
      if (!reponseData) return;
      var slideEl = document.getElementById('slide-' + etat.slides.indexOf(slide));
      if (!slideEl) return;
      var reponses = slideEl.querySelectorAll('.quiz-reponse');
      var feedback = document.getElementById('quizFeedback-' + quizIndex);
      var bonneReponse = document.getElementById('quizBonneReponse-' + quizIndex);
      var btnContinuer = document.getElementById('btnContinuer-' + quizIndex);
      reponses.forEach(function(el, idx) {
        el.classList.remove('correcte', 'incorrecte');
        var icon = el.querySelector('.result-icon');
        if (idx === reponseData.reponseIndex) {
          if (reponseData.correct) { el.classList.add('correcte'); icon.textContent = '✓'; }
          else { el.classList.add('incorrecte'); icon.textContent = '✗'; }
        } else if (slide.reponses[idx] && slide.reponses[idx].correct) {
          el.classList.add('correcte');
          icon.textContent = '✓';
        } else {
          icon.textContent = '';
        }
      });
      if (reponseData.correct) {
        bonneReponse.textContent = '✓ Bonne réponse !';
        bonneReponse.className = 'bonne-reponse';
      } else {
        var bonne = slide.reponses.find(function(r) { return r.correct; });
        bonneReponse.textContent = '✗ La bonne réponse était : "' + (bonne ? bonne.texte : '—') + '"';
        bonneReponse.className = 'mauvaise-reponse';
      }
      feedback.classList.add('visible');
      setTimeout(function() {
        btnContinuer.classList.add('visible');
      }, 400);
      verifierQuizComplets();
    }

    function verifierQuizComplets() {
      var quizSlides = etat.slides.filter(function(s) { return s.type === 'quiz'; });
      var tousRepondus = quizSlides.every(function(q) {
        return etat.reponsesQuiz[q.index] !== undefined;
      });
      if (!tousRepondus) return;
      var totalBonnes = 0, totalQuestions = 0;
      quizSlides.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) { totalQuestions++; if (rep.correct) totalBonnes++; }
      });
      etat.totalBonnes = totalBonnes;
      etat.totalQuestions = totalQuestions;
      var seuil = Math.ceil(totalQuestions / 2);
      etat.statutFinal = (totalQuestions > 0 && totalBonnes >= seuil) ? 'valide' : 'non-valide';
      if (totalQuestions === 0) etat.statutFinal = 'en-attente';
      mettreAJourBadge();
      sauvegarderQuiz();
    }

    function mettreAJourBadge() {
      var badge = document.getElementById('badgeStatut');
      if (etat.statutFinal === 'valide') { badge.textContent = '✓ Validé'; badge.className = 'badge-statut valide'; }
      else if (etat.statutFinal === 'non-valide') { badge.textContent = '✗ À relire'; badge.className = 'badge-statut non-valide'; }
      else { badge.textContent = '⏱ En cours'; badge.className = 'badge-statut en-attente'; }
    }

    function sauvegarderQuiz() {
      if (!etat.postId) return;
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var choixQcm = '';
      var quizSlides = etat.slides.filter(function(s) { return s.type === 'quiz'; });
      quizSlides.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) {
          if (choixQcm) choixQcm += '|';
          choixQcm += (rep.correct ? 'V' : 'F') + ':' + (rep.reponseIndex + 1);
        }
      });
      var url = SCRIPT_URL + '?action=saveQuiz' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(etat.post.titre || 'Quiz') +
        '&choixQcm=' + encodeURIComponent(choixQcm) +
        '&bonnes=' + encodeURIComponent(etat.totalBonnes) +
        '&total=' + encodeURIComponent(etat.totalQuestions);
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        if (data.success) console.log('✓ Quiz sauvegardé');
      }).catch(function(e) { console.error('Erreur sauvegarde:', e); });
    }

    function envoyerReponseOuverte(event, index) {
      if (event) event.stopPropagation();
      var textarea = document.getElementById('openReponse-' + index);
      if (!textarea) return;
      var reponse = textarea.value.trim();
      if (!reponse) { alert('Veuillez écrire une réponse.'); return; }
      var btn = textarea.parentElement.querySelector('.btn-envoyer-reponse');
      btn.disabled = true;
      btn.textContent = 'Envoi...';
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveReponseOuverte' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&reponseOuverte=' + encodeURIComponent(reponse);
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var confirmation = document.getElementById('openConfirmation-' + index);
          var btnContinuer = document.getElementById('btnContinuerOpen-' + index);
          if (data.success) {
            confirmation.classList.add('visible');
            textarea.disabled = true;
            btn.textContent = '✓ Envoyé';
            setTimeout(function() {
              btnContinuer.classList.add('visible');
            }, 400);
          } else {
            alert('Erreur : ' + (data.message || 'Impossible d\'envoyer.'));
            btn.disabled = false;
            btn.textContent = 'Envoyer la réponse';
          }
        })
        .catch(function(e) {
          alert('Erreur réseau.');
          btn.disabled = false;
          btn.textContent = 'Envoyer la réponse';
        });
    }

    function recupererStatutExistant() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      fetch(SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(nom))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses) {
            var reponse = data.reponses.find(function(r) { return r.articleId === etat.postId; });
            if (reponse && reponse.bonnes > 0 && reponse.total > 0) {
              var seuil = Math.ceil(reponse.total / 2);
              if (reponse.bonnes >= seuil) {
                etat.statutFinal = 'valide';
                etat.totalBonnes = reponse.bonnes;
                etat.totalQuestions = reponse.total;
                mettreAJourBadge();
              }
            }
          }
        })
        .catch(function(e) { console.error('Erreur récupération statut:', e); });
    }

    function slideSuivante() {
      if (etat.enTransition) return;
      if (etat.currentIndex >= etat.slides.length - 1) return;

      var slide = etat.slides[etat.currentIndex];

      if (slide.type === 'quiz') {
        var reponse = etat.reponsesQuiz[slide.index];
        if (!reponse) return;
        var btn = document.getElementById('btnContinuer-' + slide.index);
        if (!btn || !btn.classList.contains('visible')) return;
      }

      if (slide.type === 'open') {
        var btnOpen = document.getElementById('btnContinuerOpen-' + slide.index);
        if (!btnOpen || !btnOpen.classList.contains('visible')) return;
      }

      if (slide.type === 'ordre') {
        if (!etat.ordreValide[slide.index]) return;
        var btnOrdre = document.getElementById('btnContinuerOrdre-' + slide.index);
        if (!btnOrdre || !btnOrdre.classList.contains('visible')) return;
      }

      if (slide.type === 'carte') {
        var btnCarte = document.getElementById('btnContinuerCarte-' + slide.index);
        if (!btnCarte || !btnCarte.classList.contains('visible')) return;
      }

      etat.enTransition = true;
      var current = document.getElementById('slide-' + etat.currentIndex);
      var next = document.getElementById('slide-' + (etat.currentIndex + 1));
      if (current) current.classList.remove('active');
      if (next) next.classList.add('active');
      etat.currentIndex++;
      mettreAJourPagination();
      setTimeout(function() {
        etat.enTransition = false;
      }, 850);
    }

    function slidePrecedente() {
      if (etat.enTransition) return;
      if (etat.currentIndex <= 0) return;
      etat.enTransition = true;
      var current = document.getElementById('slide-' + etat.currentIndex);
      var prev = document.getElementById('slide-' + (etat.currentIndex - 1));
      if (current) current.classList.remove('active');
      if (prev) prev.classList.add('active');
      etat.currentIndex--;
      mettreAJourPagination();
      setTimeout(function() {
        etat.enTransition = false;
      }, 850);
    }

    function mettreAJourPagination() {
      var pagination = document.getElementById('pagination');
      if (pagination) {
        pagination.textContent = (etat.currentIndex + 1) + ' / ' + etat.slides.length;
      }
    }

    // ============================================================
    // NOTES
    // ============================================================
    function toggleNote(index) {
      var area = document.getElementById('noteArea-' + index);
      var toggle = document.getElementById('noteToggle-' + index);
      if (!area) return;
      if (area.classList.contains('visible')) {
        area.classList.remove('visible');
        toggle.classList.remove('active');
      } else {
        area.classList.add('visible');
        toggle.classList.add('active');
        var textarea = document.getElementById('noteText-' + index);
        if (textarea) textarea.focus();
      }
    }

    var timers = {};

    function autoSaveNote(index) {
      if (timers[index]) clearTimeout(timers[index]);
      var indicator = document.getElementById('noteIndicator-' + index);
      if (indicator) {
        indicator.textContent = '⏱ Enregistrement...';
        indicator.className = 'note-indicator';
      }
      timers[index] = setTimeout(function() {
        sauvegarderNote(index);
      }, 2000);
    }

    function sauvegarderNote(index) {
      var textarea = document.getElementById('noteText-' + index);
      if (!textarea) return;
      var note = textarea.value.trim();
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveAnnotation' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&slide=' + encodeURIComponent(index) +
        '&annotation=' + encodeURIComponent(note);
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var indicator = document.getElementById('noteIndicator-' + index);
          if (indicator) {
            if (data.success) {
              indicator.textContent = '✓ Note sauvegardée';
              indicator.className = 'note-indicator saved';
              etat.notes[index] = note;
            } else {
              indicator.textContent = '⚠︎ Erreur de sauvegarde';
              indicator.className = 'note-indicator';
            }
          }
        })
        .catch(function() {
          var indicator = document.getElementById('noteIndicator-' + index);
          if (indicator) {
            indicator.textContent = '⚠︎ Erreur réseau';
            indicator.className = 'note-indicator';
          }
        });
    }

    // ============================================================
    // ORDRE
    // ============================================================
    function deplacerOrdre(btn, direction, index) {
      var item = btn.closest('.ordre-item');
      var list = item.closest('.ordre-list');
      var items = list.querySelectorAll('.ordre-item');
      var currentIdx = Array.from(items).indexOf(item);
      var newIdx = currentIdx + direction;

      if (newIdx < 0 || newIdx >= items.length) return;

      if (direction < 0) {
        list.insertBefore(item, items[newIdx]);
      } else {
        list.insertBefore(items[newIdx], item);
      }

      var allItems = list.querySelectorAll('.ordre-item');
      allItems.forEach(function(el, idx) {
        var numSpan = el.querySelector('.ordre-num');
        if (numSpan) numSpan.textContent = '#' + (idx + 1);
        var upBtn = el.querySelector('.ordre-boutons button:first-child');
        var downBtn = el.querySelector('.ordre-boutons button:last-child');
        if (upBtn) upBtn.disabled = (idx === 0);
        if (downBtn) downBtn.disabled = (idx === allItems.length - 1);
      });

      var resultat = document.getElementById('ordreResultat-' + index);
      if (resultat) {
        resultat.textContent = '';
        resultat.className = 'ordre-resultat';
      }
      etat.ordreValide[index] = false;
      var btnContinuer = document.getElementById('btnContinuerOrdre-' + index);
      if (btnContinuer) btnContinuer.classList.remove('visible');
    }

    function validerOrdre(index) {
      var list = document.getElementById('ordre-list-' + index);
      if (!list) return;
      var items = list.querySelectorAll('.ordre-item');
      var ordreDonne = [];
      var ordreAttendu = [];

      items.forEach(function(el) {
        ordreDonne.push(parseInt(el.dataset.num));
        ordreAttendu.push(parseInt(el.dataset.num));
      });

      ordreAttendu.sort(function(a, b) { return a - b; });

      var correct = true;
      for (var i = 0; i < ordreDonne.length; i++) {
        if (ordreDonne[i] !== ordreAttendu[i]) {
          correct = false;
          break;
        }
      }

      var resultat = document.getElementById('ordreResultat-' + index);
      var btnContinuer = document.getElementById('btnContinuerOrdre-' + index);
      var btnValider = document.getElementById('btnValiderOrdre-' + index);

      if (correct) {
        resultat.textContent = '✌︎︎ Tous les éléments sont bien placés !';
        resultat.className = 'ordre-resultat correct';
        etat.ordreValide[index] = true;
        sauvegarderOrdre(index, ordreDonne.join(','), 1, ordreDonne.length);
        if (btnContinuer) btnContinuer.classList.add('visible');
        if (btnValider) btnValider.disabled = true;
      } else {
        resultat.textContent = '✋︎ L\'ordre n\'est pas correct. Réessayez.';
        resultat.className = 'ordre-resultat incorrect';
        etat.ordreValide[index] = false;
        sauvegarderOrdre(index, ordreDonne.join(','), 0, ordreDonne.length);
      }
    }

    function sauvegarderOrdre(index, ordreDonne, bonnes, total) {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveOrdre' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(etat.post.titre || 'Ordre') +
        '&ordreDonne=' + encodeURIComponent(ordreDonne) +
        '&bonnes=' + encodeURIComponent(bonnes) +
        '&total=' + encodeURIComponent(total);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) console.log('✓ Ordre sauvegardé');
        })
        .catch(function(e) { console.error('Erreur sauvegarde ordre:', e); });
    }

    // ============================================================
    // CARTES
    // ============================================================
    function retournerCarte(index) {
      var inner = document.getElementById('carteInner-' + index);
      if (!inner) return;
      if (inner.classList.contains('retournee')) return;

      inner.classList.add('retournee');
      var boutons = document.getElementById('carteBoutons-' + index);
      if (boutons) boutons.classList.add('visible');
    }

    function carteTrouve(index) {
      var resultat = document.getElementById('carteResultat-' + index);
      var boutons = document.getElementById('carteBoutons-' + index);
      var btnContinuer = document.getElementById('btnContinuerCarte-' + index);

      if (etat.cartesResultats[index] !== null) return;

      etat.cartesResultats[index] = true;
      etat.cartesBonnes++;
      etat.cartesTotal++;

      resultat.textContent = '☑ Bien joué !';
      resultat.style.color = 'var(--text)';
      if (boutons) boutons.classList.remove('visible');
      if (btnContinuer) btnContinuer.classList.add('visible');

      sauvegarderCarte(index);
    }

    function cartePasTrouve(index) {
      var resultat = document.getElementById('carteResultat-' + index);
      var boutons = document.getElementById('carteBoutons-' + index);
      var btnContinuer = document.getElementById('btnContinuerCarte-' + index);

      if (etat.cartesResultats[index] !== null) return;

      etat.cartesResultats[index] = false;
      etat.cartesTotal++;

      resultat.textContent = '☹ Pas de problème, retenez bien la réponse.';
      resultat.style.color = 'var(--text-secondary)';
      if (boutons) boutons.classList.remove('visible');
      if (btnContinuer) btnContinuer.classList.add('visible');

      sauvegarderCarte(index);
    }

    function sauvegarderCarte(index) {
      var slide = etat.slides.find(function(s) { return s.type === 'carte' && s.index === index; });
      if (!slide) return;

      var toutesLesCartes = etat.slides.filter(function(s) { return s.type === 'carte'; });
      var resultats = [];
      toutesLesCartes.forEach(function(c) {
        if (etat.cartesResultats[c.index] === true) resultats.push('1');
        else if (etat.cartesResultats[c.index] === false) resultats.push('0');
        else resultats.push('?');
      });

      var cartesStr = resultats.join(',');
      var bonnes = etat.cartesBonnes;
      var total = etat.cartesTotal;

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveCarte' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(etat.post.titre || 'Cartes') +
        '&cartes=' + encodeURIComponent(cartesStr) +
        '&bonnes=' + encodeURIComponent(bonnes) +
        '&total=' + encodeURIComponent(total);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) console.log('✓ Cartes sauvegardées');
        })
        .catch(function(e) { console.error('Erreur sauvegarde cartes:', e); });
    }

    // ============================================================
    // FERMER
    // ============================================================
    function fermerLiseuse() {
      window.location.href = '/medit/mes-textes.html';
    }

    function afficherErreur(message) {
      document.getElementById('slidesContainer').innerHTML = `
        <div class="lecture-error">
          <div class="icone">⬜⬜⬜</div>
          <h2>Texte introuvable</h2>
          <p>${message || 'Le texte n\'existe pas.'}</p>
          <a href="/medit/mes-textes.html" class="btn-retour">← Retour</a>
        </div>
      `;
    }

    // ============================================================
    // EXPOSER LES FONCTIONS GLOBALEMENT
    // ============================================================
    window.selectionnerReponse = selectionnerReponse;
    window.envoyerReponseOuverte = envoyerReponseOuverte;
    window.slideSuivante = slideSuivante;
    window.slidePrecedente = slidePrecedente;
    window.fermerLiseuse = fermerLiseuse;
    window.toggleNote = toggleNote;
    window.autoSaveNote = autoSaveNote;
    window.deplacerOrdre = deplacerOrdre;
    window.validerOrdre = validerOrdre;
    window.retournerCarte = retournerCarte;
    window.carteTrouve = carteTrouve;
    window.cartePasTrouve = cartePasTrouve;
  </script>

</body>
</html>
