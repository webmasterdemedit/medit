<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Lecture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       LISEUSE - STYLE ÉPURÉ
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #121212 !important;
    }

    body {
      font-family: 'Merriweather', 'Georgia', serif;
      color: #e8e0d8 !important;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #121212 !important;
    }

    body::before { display: none !important; }

    /* ===== HEADER LISEUSE ===== */
    .lecture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      min-height: 64px;
      z-index: 10;
    }

    .lecture-header .meta-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .lecture-header .meta-left .cat-niveau {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b6b6b;
    }

    .lecture-header .meta-left .cat-niveau span { margin: 0 6px; }

    .lecture-header .meta-left .titre {
      font-family: 'Merriweather', serif;
      font-size: 18px;
      font-weight: 400;
      color: #e8e0d8;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lecture-header .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .lecture-header .actions .btn-close {
      background: none;
      border: none;
      color: #6b6b6b;
      font-size: 26px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
      transition: color 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .lecture-header .actions .btn-close:hover { color: #e8e0d8; }

    .lecture-header .actions .badge-statut {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #6b6b6b;
      letter-spacing: 0.3px;
      display: none;
    }

    .lecture-header .actions .badge-statut.valide {
      display: inline-block;
      background: #1e3a2a;
      color: #7ab893;
    }

    .lecture-header .actions .badge-statut.non-valide {
      display: inline-block;
      background: #3a1e1e;
      color: #c87a7a;
    }

    .lecture-header .actions .badge-statut.en-attente {
      display: inline-block;
      background: #2a2a1e;
      color: #c8b87a;
    }

    /* ===== CONTENU PRINCIPAL ===== */
    .lecture-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #161616;
    }

    .lecture-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ===== PAGES ===== */
    .pages-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding: 20px 40px 20px 40px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    .pages-wrapper::-webkit-scrollbar { width: 4px; }
    .pages-wrapper::-webkit-scrollbar-track { background: transparent; }
    .pages-wrapper::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

    .page-item {
      min-height: calc(100vh - 180px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 20px;
      max-width: 780px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      scroll-margin-top: 20px;
    }

    .page-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page-item .page-num {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #3a3a3a;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .page-item .page-content {
      font-size: 19px;
      line-height: 1.9;
      color: #e0d8d0;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .page-item .page-content p { margin-bottom: 1.2em; }
    .page-item .page-content p:last-child { margin-bottom: 0; }

    /* ===== SLIDES ===== */
    .page-item.slide .page-content { font-size: 21px; line-height: 2; }

    .page-item.slide .page-content .slide-idee {
      font-style: italic;
      color: #6b6b6b;
      border-left: 3px solid #2a2a2a;
      padding-left: 20px;
    }

    /* ===== QUIZ ===== */
    .page-item.quiz .page-content { font-size: 18px; }

    .page-item.quiz .quiz-question {
      font-weight: 400;
      font-size: 20px;
      margin-bottom: 20px;
      color: #e8e0d8;
    }

    .page-item.quiz .quiz-reponses {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .page-item.quiz .quiz-reponse {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #c8c0b8;
    }

    .page-item.quiz .quiz-reponse:hover {
      background: #262626;
      border-color: #3a3a3a;
    }

    .page-item.quiz .quiz-reponse .lettre {
      font-weight: 600;
      color: #6b6b6b;
      min-width: 24px;
      font-size: 13px;
    }

    .page-item.quiz .quiz-reponse.selectionnee {
      border-color: #4a6a5a;
      background: #1e2a24;
    }

    .page-item.quiz .quiz-reponse.correcte {
      border-color: #4a8a5a;
      background: #1a2a1e;
      color: #8ac8a0;
    }

    .page-item.quiz .quiz-reponse.incorrecte {
      border-color: #8a4a4a;
      background: #2a1a1a;
      color: #c88a8a;
    }

    .page-item.quiz .quiz-reponse .result-icon { margin-left: auto; font-size: 18px; }

    .page-item.quiz .quiz-feedback {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }

    .page-item.quiz .quiz-feedback.visible { display: block; }

    .page-item.quiz .quiz-feedback .bonne-reponse { color: #8ac8a0; }

    .page-item.quiz .quiz-feedback .score {
      font-weight: 500;
      color: #e8e0d8;
      margin-top: 8px;
    }

    /* ===== QUESTION OUVERTE ===== */
    .page-item.open-question .page-content { font-size: 18px; }

    .page-item.open-question .open-question-text {
      font-weight: 400;
      font-size: 20px;
      color: #e8e0d8;
      margin-bottom: 16px;
    }

    .page-item.open-question textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px 18px;
      border-radius: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #e0d8d0;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .page-item.open-question textarea:focus {
      outline: none;
      border-color: #4a6a5a;
    }

    .page-item.open-question textarea::placeholder { color: #4a4a4a; }

    .page-item.open-question .btn-envoyer-reponse {
      margin-top: 12px;
      padding: 10px 28px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid #4a6a5a;
      color: #8ac8a0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      align-self: flex-start;
    }

    .page-item.open-question .btn-envoyer-reponse:hover {
      background: #1a2a1e;
      border-color: #5a8a6a;
    }

    .page-item.open-question .btn-envoyer-reponse:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-item.open-question .reponse-confirmation {
      margin-top: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #7ab893;
      display: none;
    }

    .page-item.open-question .reponse-confirmation.visible { display: block; }

    /* ===== RÉTENIR ===== */
    .page-item.retenir .page-content {
      font-size: 18px;
      text-align: center;
    }

    .page-item.retenir .retenir-mots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 24px 0;
    }

    .page-item.retenir .retenir-mot {
      font-family: 'Merriweather', serif;
      font-size: 28px;
      font-weight: 400;
      color: #e8e0d8;
      padding: 12px 24px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
    }

    .page-item.retenir .retenir-label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6b6b6b;
      margin-bottom: 8px;
    }

    /* ===== RÉSULTAT FINAL ===== */
    .page-item.resultat .page-content { text-align: center; }

    .page-item.resultat .resultat-icone { font-size: 64px; margin-bottom: 20px; }

    .page-item.resultat .resultat-titre {
      font-size: 24px;
      font-weight: 400;
      color: #e8e0d8;
      margin-bottom: 8px;
    }

    .page-item.resultat .resultat-sous-titre {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #6b6b6b;
    }

    .page-item.resultat .resultat-score {
      font-family: 'Inter', sans-serif;
      font-size: 48px;
      font-weight: 300;
      color: #e8e0d8;
      margin: 16px 0;
    }

    .page-item.resultat .resultat-detail {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #6b6b6b;
    }

    .page-item.resultat .resultat-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .page-item.resultat .resultat-actions button {
      padding: 10px 28px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #c8c0b8;
    }

    .page-item.resultat .resultat-actions button:hover { background: #2a2a2a; }

    .page-item.resultat .resultat-actions .btn-fermer {
      border-color: #4a6a5a;
      color: #8ac8a0;
    }

    .page-item.resultat .resultat-actions .btn-fermer:hover { background: #1a2a1e; }

    /* ===== LOADER ===== */
    .lecture-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b6b6b;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .lecture-loader .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2a2a2a;
      border-top-color: #6b6b6b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .lecture-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b6b6b;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 40px;
    }

    .lecture-error .icone { font-size: 48px; margin-bottom: 16px; }

    .lecture-error h2 {
      font-family: 'Merriweather', serif;
      font-size: 22px;
      font-weight: 400;
      color: #e8e0d8;
      margin-bottom: 8px;
    }

    .lecture-error p { font-size: 14px; color: #6b6b6b; }

    .lecture-error .btn-retour {
      margin-top: 20px;
      padding: 10px 28px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #c8c0b8;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .lecture-error .btn-retour:hover { background: #2a2a2a; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .lecture-header { padding: 10px 16px; min-height: 56px; }
      .lecture-header .meta-left .titre { font-size: 15px; }
      .lecture-header .meta-left .cat-niveau { font-size: 10px; }
      .lecture-header .actions .btn-close { font-size: 22px; }
      .pages-wrapper { padding: 12px 16px 12px 16px; }
      .page-item { padding: 20px 12px; min-height: calc(100vh - 160px); }
      .page-item .page-content { font-size: 17px; line-height: 1.8; }
      .page-item.slide .page-content { font-size: 18px; line-height: 1.9; }
      .page-item .page-num { font-size: 10px; margin-bottom: 14px; }
      .page-item.quiz .quiz-question { font-size: 17px; }
      .page-item.quiz .quiz-reponse { font-size: 14px; padding: 10px 14px; }
      .page-item.retenir .retenir-mot { font-size: 22px; padding: 10px 18px; }
      .page-item.open-question textarea { min-height: 100px; font-size: 14px; }
      .page-item.resultat .resultat-score { font-size: 36px; }
    }

    @media (max-width: 480px) {
      .lecture-header { padding: 8px 12px; min-height: 50px; }
      .lecture-header .meta-left .titre { font-size: 13px; }
      .lecture-header .meta-left .cat-niveau { font-size: 9px; }
      .lecture-header .actions .badge-statut { font-size: 10px; padding: 3px 10px; }
      .pages-wrapper { padding: 8px 10px 8px 10px; }
      .page-item { padding: 16px 8px; min-height: calc(100vh - 140px); }
      .page-item .page-content { font-size: 15px; line-height: 1.7; }
      .page-item.slide .page-content { font-size: 16px; line-height: 1.8; }
      .page-item.quiz .quiz-question { font-size: 15px; }
      .page-item.quiz .quiz-reponse { font-size: 13px; padding: 8px 12px; gap: 10px; }
      .page-item.quiz .quiz-reponse .lettre { font-size: 12px; min-width: 20px; }
      .page-item.retenir .retenir-mot { font-size: 18px; padding: 8px 14px; }
      .page-item.resultat .resultat-score { font-size: 28px; }
      .page-item.resultat .resultat-actions button { padding: 8px 20px; font-size: 13px; }
      .page-item.open-question .btn-envoyer-reponse { padding: 8px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER LISEUSE ===== -->
  <header class="lecture-header">
    <div class="meta-left">
      <div class="cat-niveau" id="metaCatNiveau">
        <span id="metaCategorie">—</span>
        <span>·</span>
        <span id="metaNiveau">Niveau —</span>
      </div>
      <div class="titre" id="metaTitre">Chargement...</div>
    </div>
    <div class="actions">
      <span class="badge-statut" id="badgeStatut"></span>
      <button class="btn-close" id="btnFermer" title="Fermer">✕</button>
    </div>
  </header>

  <!-- ===== CORPS ===== -->
  <div class="lecture-body">
    <div class="lecture-container" id="lectureContainer">
      <div class="lecture-loader" id="lectureLoader">
        <div class="spinner"></div>
        <span>Chargement du texte...</span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';

    // ============================================================
    // ÉTAT
    // ============================================================
    var etat = {
      postId: null,
      post: null,
      pages: [],
      reponsesQuiz: {},
      totalBonnes: 0,
      totalQuestions: 0,
      statutFinal: null,
      reponseEnvoyee: false,
    };

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');

      if (!id) {
        afficherErreur('Aucun identifiant de texte spécifié.');
        return;
      }

      etat.postId = id;
      chargerPost(id);
    });

    // ============================================================
    // CHARGER LE POST
    // ============================================================
    function chargerPost(id) {
      var url = SCRIPT_URL + '?action=getPost&id=' + encodeURIComponent(id);

      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('Erreur réseau');
          return response.json();
        })
        .then(function(data) {
          if (!data.success || !data.post) throw new Error(data.message || 'Texte introuvable');
          etat.post = data.post;
          preparerPages(etat.post);
          afficherLiseuse();
        })
        .catch(function(error) {
          console.error('Erreur:', error);
          afficherErreur('Impossible de charger le texte. ' + error.message);
        });
    }

    // ============================================================
    // PRÉPARER LES PAGES - VERSION CORRIGÉE
    // ============================================================
    function preparerPages(post) {
      var pages = [];
      var contenu = post.contenu || '';

      // ============================================================
// PARSER LE CONTENU - CHERCHE LES INDICATEURS (-s-, -q-, etc.)
// ============================================================
function parserContenu(texte) {
  var result = {
    slides: [],
    slidesIdee: [],
    quizs: [],
    openQuestions: [],
    retenir: []
  };

  if (!texte) return result;

  // On découpe en éléments en cherchant les indicateurs
  // On utilise une expression régulière pour trouver tout ce qui commence par -s-, -q-, etc.
  
  // Méthode 1 : Si le texte a des sauts de ligne, on découpe par ligne
  var elements = [];
  if (texte.includes('\n')) {
    elements = texte.split('\n').filter(function(l) { return l.trim() !== ''; });
  } 
  // Méthode 2 : Si le texte a des tabulations
  else if (texte.includes('\t')) {
    elements = texte.split('\t').filter(function(l) { return l.trim() !== ''; });
  } 
  // Méthode 3 : On cherche manuellement les indicateurs
  else {
    // On va chercher chaque occurrence de -s-, -q-, etc.
    var indices = [];
    var patterns = ['-s-', '-si-', '-q-', '-qs-', '-r-', '-i-'];
    for (var p = 0; p < patterns.length; p++) {
      var pos = texte.indexOf(patterns[p]);
      while (pos !== -1) {
        indices.push({ pos: pos, pattern: patterns[p] });
        pos = texte.indexOf(patterns[p], pos + 1);
      }
    }
    // Trier par position
    indices.sort(function(a, b) { return a.pos - b.pos; });
    
    // Extraire chaque élément
    for (var i = 0; i < indices.length; i++) {
      var start = indices[i].pos;
      var end = (i + 1 < indices.length) ? indices[i + 1].pos : texte.length;
      var element = texte.substring(start, end).trim();
      if (element) elements.push(element);
    }
  }

  // Parcourir chaque élément
  for (var i = 0; i < elements.length; i++) {
    var ligne = elements[i].trim();
    if (!ligne) continue;

    // --- SLIDE NORMAL ---
    if (ligne.startsWith('-s-')) {
      var contenuSlide = ligne.replace('-s-', '').trim();
      // Si la slide est vide et que l'élément suivant n'a pas d'indicateur, on le prend
      if (!contenuSlide && i + 1 < elements.length) {
        var next = elements[i + 1].trim();
        if (!next.startsWith('-')) {
          contenuSlide = next;
          i++;
        }
      }
      result.slides.push(contenuSlide || 'Slide vide');
      result.slidesIdee.push(false);
      continue;
    }

    // --- SLIDE IDÉE ---
    if (ligne.startsWith('-si-')) {
      result.slides.push(ligne.replace('-si-', '').trim() || 'Idée');
      result.slidesIdee.push(true);
      continue;
    }

    // --- QUIZ ---
    if (ligne.startsWith('-q-')) {
      var qText = ligne.replace('-q-', '').trim() || 'Question sans texte';
      var reponses = [];
      var j = i + 1;

      // Collecter les réponses (-v- et -f-) qui suivent
      while (j < elements.length) {
        var nextLine = elements[j].trim();
        if (nextLine.startsWith('-v-')) {
          reponses.push({ 
            texte: nextLine.replace('-v-', '').trim() || 'Vrai', 
            correct: true 
          });
          j++;
        } else if (nextLine.startsWith('-f-')) {
          reponses.push({ 
            texte: nextLine.replace('-f-', '').trim() || 'Faux', 
            correct: false 
          });
          j++;
        } else {
          // On s'arrête si on tombe sur une autre section
          break;
        }
      }

      // Si aucune réponse trouvée, mettre des valeurs par défaut
      if (reponses.length === 0) {
        reponses.push({ texte: 'Vrai', correct: true });
        reponses.push({ texte: 'Faux', correct: false });
      }

      i = j - 1;
      result.quizs.push({ question: qText, reponses: reponses });
      continue;
    }

    // --- QUESTION OUVERTE ---
    if (ligne.startsWith('-qs-')) {
      result.openQuestions.push(ligne.replace('-qs-', '').trim() || 'Question ouverte');
      continue;
    }

    // --- RETENIR ---
    if (ligne.startsWith('-r-')) {
      var retenirText = ligne.replace('-r-', '').trim();
      if (retenirText) {
        var mots = retenirText.split(',').map(function(m) { return m.trim(); });
        result.retenir = mots.filter(function(m) { return m.length > 0; });
      }
      continue;
    }

    // --- INFO (on ignore) ---
    if (ligne.startsWith('-i-')) {
      continue;
    }

    // --- Texte libre sans préfixe : on l'ajoute comme slide ---
    if (ligne.length > 0 && !ligne.startsWith('-')) {
      result.slides.push(ligne);
      result.slidesIdee.push(false);
    }
  }

  return result;
}
      // ============================================================
      // CONSTRUIRE LES PAGES
      // ============================================================
      var parsed = parserContenu(contenu);

      // 1. Slides
      parsed.slides.forEach(function(slide, index) {
        pages.push({
          type: 'slide',
          titre: 'Slide ' + (index + 1),
          contenu: slide,
          estIdee: parsed.slidesIdee[index] || false
        });
      });

      // 2. Quiz
      parsed.quizs.forEach(function(quiz, index) {
        pages.push({
          type: 'quiz',
          titre: 'Quiz ' + (index + 1),
          question: quiz.question,
          reponses: quiz.reponses,
          index: index
        });
      });

      // 3. Questions ouvertes
      parsed.openQuestions.forEach(function(q, index) {
        pages.push({
          type: 'open-question',
          titre: 'Question ouverte ' + (index + 1),
          question: q,
          index: index
        });
      });

      // 4. Retenir
      if (parsed.retenir && parsed.retenir.length > 0) {
        pages.push({
          type: 'retenir',
          titre: 'À retenir',
          mots: parsed.retenir
        });
      }

      // 5. Résultat final
      pages.push({
        type: 'resultat',
        titre: 'Résultat'
      });

      etat.pages = pages;
    }

    // ============================================================
    // AFFICHER LA LISEUSE
    // ============================================================
    function afficherLiseuse() {
      var container = document.getElementById('lectureContainer');
      var loader = document.getElementById('lectureLoader');

      // Mettre à jour le header
      var post = etat.post;
      document.getElementById('metaTitre').textContent = post.titre || 'Sans titre';
      document.getElementById('metaCategorie').textContent = post.categorie || 'Sans catégorie';
      document.getElementById('metaNiveau').textContent = 'Niveau ' + (post.niveau || 0);

      // Construire les pages
      var html = '<div class="pages-wrapper" id="pagesWrapper">';

      etat.pages.forEach(function(page, index) {
        var typeClass = page.type;
        var visibleClass = index === 0 ? ' visible' : '';

        html += '<div class="page-item ' + typeClass + visibleClass + '" data-index="' + index + '" id="page-' + index + '">';
        html += '<div class="page-num">' + (index + 1) + ' / ' + etat.pages.length + '</div>';
        html += '<div class="page-content">';

        switch (page.type) {
          case 'slide':
            html += renderSlide(page);
            break;
          case 'quiz':
            html += renderQuiz(page, index);
            break;
          case 'open-question':
            html += renderOpenQuestion(page, index);
            break;
          case 'retenir':
            html += renderRetenir(page);
            break;
          case 'resultat':
            html += renderResultat();
            break;
        }

        html += '</div>';
        html += '</div>';
      });

      html += '</div>';
      container.innerHTML = html;

      // Observer les pages
      observerPages();

      // Fermeture
      document.getElementById('btnFermer').addEventListener('click', function() {
        window.location.href = '/medit/mes-textes.html';
      });

      // Récupérer le statut existant
      recupererStatutExistant();
    }

    // ============================================================
    // RENDER: SLIDE
    // ============================================================
    function renderSlide(page) {
      var content = page.contenu || '';
      var isIdee = page.estIdee || false;

      var paragraphs = content.split('\n').filter(function(p) { return p.trim() !== ''; });
      var html = paragraphs.map(function(p) {
        return '<p>' + p.trim() + '</p>';
      }).join('');

      if (isIdee) {
        html = '<div class="slide-idee">' + html + '</div>';
      }

      return html;
    }

    // ============================================================
    // RENDER: QUIZ
    // ============================================================
    function renderQuiz(page, index) {
      var html = '';
      html += '<div class="quiz-question">' + (page.question || 'Question') + '</div>';
      html += '<div class="quiz-reponses" data-quiz-index="' + index + '">';

      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
      page.reponses.forEach(function(rep, ri) {
        html += '<div class="quiz-reponse" data-reponse-index="' + ri + '" onclick="selectionnerReponse(' + index + ', ' + ri + ')">';
        html += '<span class="lettre">' + lettres[ri] + '</span>';
        html += '<span>' + (rep.texte || 'Réponse vide') + '</span>';
        html += '<span class="result-icon"></span>';
        html += '</div>';
      });

      html += '</div>';
      html += '<div class="quiz-feedback" id="quizFeedback-' + index + '">';
      html += '<div class="bonne-reponse" id="quizBonneReponse-' + index + '"></div>';
      html += '<div class="score" id="quizScore-' + index + '"></div>';
      html += '</div>';

      return html;
    }

    // ============================================================
    // RENDER: QUESTION OUVERTE
    // ============================================================
    function renderOpenQuestion(page, index) {
      var html = '';
      html += '<div class="open-question-text">' + (page.question || 'Question ouverte') + '</div>';
      html += '<textarea id="openReponse-' + index + '" placeholder="Écrivez votre réponse ici..."></textarea>';
      html += '<button class="btn-envoyer-reponse" onclick="envoyerReponseOuverte(' + index + ')">Envoyer la réponse</button>';
      html += '<div class="reponse-confirmation" id="openConfirmation-' + index + '">✓ Réponse enregistrée</div>';
      return html;
    }

    // ============================================================
    // RENDER: RETENIR
    // ============================================================
    function renderRetenir(page) {
      var html = '';
      html += '<div class="retenir-label">📌 À retenir</div>';
      html += '<div class="retenir-mots">';

      page.mots.forEach(function(mot) {
        if (mot.trim()) {
          html += '<span class="retenir-mot">' + mot.trim() + '</span>';
        }
      });

      html += '</div>';
      html += '<p style="font-family:Inter,sans-serif;font-size:14px;color:#6b6b6b;margin-top:8px;">Ces mots-clés vous aideront à mémoriser l\'essentiel.</p>';
      return html;
    }

    // ============================================================
    // RENDER: RÉSULTAT
    // ============================================================
    function renderResultat() {
      var statut = etat.statutFinal || 'en-attente';
      var bonnes = etat.totalBonnes || 0;
      var total = etat.totalQuestions || 0;
      var pourcentage = total > 0 ? Math.round((bonnes / total) * 100) : 0;

      var icone, titre, sousTitre, classeStatut;

      if (statut === 'valide') {
        icone = '✅';
        titre = 'Félicitations !';
        sousTitre = 'Vous avez validé ce texte avec succès.';
        classeStatut = 'valide';
      } else if (statut === 'non-valide') {
        icone = '📖';
        titre = 'À relire';
        sousTitre = 'Prenez le temps de relire ce texte pour mieux le comprendre.';
        classeStatut = 'non-valide';
      } else {
        icone = '⏳';
        titre = 'En attente';
        sousTitre = 'Répondez aux quiz pour valider ce texte.';
        classeStatut = 'en-attente';
      }

      var html = '';
      html += '<div class="resultat-icone">' + icone + '</div>';
      html += '<div class="resultat-titre">' + titre + '</div>';
      html += '<div class="resultat-sous-titre">' + sousTitre + '</div>';

      if (total > 0) {
        html += '<div class="resultat-score">' + bonnes + '/' + total + '</div>';
        html += '<div class="resultat-detail">' + pourcentage + '% de bonnes réponses</div>';
      } else {
        html += '<div class="resultat-score">—</div>';
        html += '<div class="resultat-detail">Aucun quiz à évaluer</div>';
      }

      html += '<div class="resultat-actions">';
      html += '<button class="btn-fermer" onclick="fermerLiseuse()">Terminer la lecture</button>';
      html += '</div>';

      // Mettre à jour le badge
      var badge = document.getElementById('badgeStatut');
      badge.textContent = statut === 'valide' ? '✅ Validé' : statut === 'non-valide' ? '📖 À relire' : '⏳ En cours';
      badge.className = 'badge-statut ' + classeStatut;

      return html;
    }

    // ============================================================
    // OBSERVER LES PAGES
    // ============================================================
    function observerPages() {
      var wrapper = document.getElementById('pagesWrapper');
      if (!wrapper) return;

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      });

      var pages = wrapper.querySelectorAll('.page-item');
      pages.forEach(function(page) {
        observer.observe(page);
      });
    }

    // ============================================================
    // QUIZ - SÉLECTIONNER UNE RÉPONSE
    // ============================================================
    function selectionnerReponse(quizIndex, reponseIndex) {
      var page = etat.pages.find(function(p) {
        return p.type === 'quiz' && p.index === quizIndex;
      });

      if (!page) return;

      // Vérifier si déjà répondu
      if (etat.reponsesQuiz[quizIndex]) return;

      var reponses = document.querySelectorAll('#page-' + getPageIndex(quizIndex) + ' .quiz-reponse');
      var reponse = page.reponses[reponseIndex];

      // Marquer la sélection
      reponses.forEach(function(el, idx) {
        el.classList.remove('selectionnee');
        if (idx === reponseIndex) {
          el.classList.add('selectionnee');
        }
      });

      // Enregistrer la réponse
      etat.reponsesQuiz[quizIndex] = {
        reponseIndex: reponseIndex,
        correct: reponse.correct
      };

      // Afficher le feedback
      afficherFeedbackQuiz(quizIndex);
    }

    // ============================================================
    // QUIZ - AFFICHER LE FEEDBACK
    // ============================================================
    function afficherFeedbackQuiz(quizIndex) {
      var page = etat.pages.find(function(p) {
        return p.type === 'quiz' && p.index === quizIndex;
      });

      if (!page) return;

      var reponseData = etat.reponsesQuiz[quizIndex];
      if (!reponseData) return;

      var reponses = document.querySelectorAll('#page-' + getPageIndex(quizIndex) + ' .quiz-reponse');
      var feedback = document.getElementById('quizFeedback-' + quizIndex);
      var bonneReponse = document.getElementById('quizBonneReponse-' + quizIndex);

      // Marquer les réponses
      reponses.forEach(function(el, idx) {
        el.classList.remove('correcte', 'incorrecte');
        var icon = el.querySelector('.result-icon');

        if (idx === reponseData.reponseIndex) {
          if (reponseData.correct) {
            el.classList.add('correcte');
            icon.textContent = '✓';
          } else {
            el.classList.add('incorrecte');
            icon.textContent = '✗';
          }
        } else if (page.reponses[idx] && page.reponses[idx].correct) {
          el.classList.add('correcte');
          icon.textContent = '✓';
        } else {
          icon.textContent = '';
        }
      });

      // Feedback
      if (reponseData.correct) {
        bonneReponse.textContent = '✅ Bonne réponse !';
      } else {
        var bonne = page.reponses.find(function(r) { return r.correct; });
        bonneReponse.textContent = '❌ La bonne réponse était : "' + (bonne ? bonne.texte : '—') + '"';
      }

      feedback.classList.add('visible');

      // Vérifier si tous les quiz sont répondus
      verifierQuizComplets();
    }

    // ============================================================
    // QUIZ - VÉRIFIER SI TOUS SONT RÉPONDUS
    // ============================================================
    function verifierQuizComplets() {
      var quizPages = etat.pages.filter(function(p) { return p.type === 'quiz'; });
      var tousRepondus = quizPages.every(function(q) {
        return etat.reponsesQuiz[q.index] !== undefined;
      });

      if (!tousRepondus) return;

      // Calculer le score total
      var totalBonnes = 0;
      var totalQuestions = 0;

      quizPages.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) {
          totalQuestions++;
          if (rep.correct) totalBonnes++;
        }
      });

      etat.totalBonnes = totalBonnes;
      etat.totalQuestions = totalQuestions;

      // Déterminer le statut (50% de bonnes réponses pour valider)
      var seuil = Math.ceil(totalQuestions / 2);
      var valide = totalQuestions > 0 && totalBonnes >= seuil;

      etat.statutFinal = valide ? 'valide' : 'non-valide';
      if (totalQuestions === 0) {
        etat.statutFinal = 'en-attente';
      }

      // Mettre à jour la page résultat
      mettreAJourResultat();

      // Sauvegarder le quiz
      sauvegarderQuiz();
    }

    // ============================================================
    // METTRE À JOUR LE RÉSULTAT
    // ============================================================
    function mettreAJourResultat() {
      var pageResultat = document.querySelector('.page-item.resultat');
      if (!pageResultat) return;

      var content = pageResultat.querySelector('.page-content');
      if (!content) return;

      var statut = etat.statutFinal || 'en-attente';
      var bonnes = etat.totalBonnes || 0;
      var total = etat.totalQuestions || 0;
      var pourcentage = total > 0 ? Math.round((bonnes / total) * 100) : 0;

      var icone, titre, sousTitre, classeStatut;

      if (statut === 'valide') {
        icone = '✅';
        titre = 'Félicitations !';
        sousTitre = 'Vous avez validé ce texte avec succès.';
        classeStatut = 'valide';
      } else if (statut === 'non-valide') {
        icone = '📖';
        titre = 'À relire';
        sousTitre = 'Prenez le temps de relire ce texte pour mieux le comprendre.';
        classeStatut = 'non-valide';
      } else {
        icone = '⏳';
        titre = 'En attente';
        sousTitre = 'Répondez aux quiz pour valider ce texte.';
        classeStatut = 'en-attente';
      }

      var html = '';
      html += '<div class="resultat-icone">' + icone + '</div>';
      html += '<div class="resultat-titre">' + titre + '</div>';
      html += '<div class="resultat-sous-titre">' + sousTitre + '</div>';

      if (total > 0) {
        html += '<div class="resultat-score">' + bonnes + '/' + total + '</div>';
        html += '<div class="resultat-detail">' + pourcentage + '% de bonnes réponses</div>';
      } else {
        html += '<div class="resultat-score">—</div>';
        html += '<div class="resultat-detail">Aucun quiz à évaluer</div>';
      }

      html += '<div class="resultat-actions">';
      html += '<button class="btn-fermer" onclick="fermerLiseuse()">Terminer la lecture</button>';
      html += '</div>';

      content.innerHTML = html;

      // Mettre à jour le badge
      var badge = document.getElementById('badgeStatut');
      badge.textContent = statut === 'valide' ? '✅ Validé' : statut === 'non-valide' ? '📖 À relire' : '⏳ En cours';
      badge.className = 'badge-statut ' + classeStatut;
    }

    // ============================================================
    // SAUVEGARDER LE QUIZ
    // ============================================================
    function sauvegarderQuiz() {
      if (!etat.postId) return;

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var titre = etat.post.titre || 'Quiz';
      var bonnes = etat.totalBonnes || 0;
      var total = etat.totalQuestions || 0;

      var choixQcm = '';
      var quizPages = etat.pages.filter(function(p) { return p.type === 'quiz'; });
      quizPages.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) {
          if (choixQcm) choixQcm += '|';
          choixQcm += (rep.correct ? 'V' : 'F') + ':' + (rep.reponseIndex + 1);
        }
      });

      var url = SCRIPT_URL + '?action=saveQuiz' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(titre) +
        '&choixQcm=' + encodeURIComponent(choixQcm) +
        '&bonnes=' + encodeURIComponent(bonnes) +
        '&total=' + encodeURIComponent(total);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            console.log('Quiz sauvegardé');
          }
        })
        .catch(function(e) {
          console.error('Erreur sauvegarde quiz:', e);
        });
    }

    // ============================================================
    // ENVOYER UNE RÉPONSE OUVERTE
    // ============================================================
    function envoyerReponseOuverte(index) {
      var textarea = document.getElementById('openReponse-' + index);
      if (!textarea) return;

      var reponse = textarea.value.trim();
      if (!reponse) {
        alert('Veuillez écrire une réponse.');
        return;
      }

      var btn = textarea.parentElement.querySelector('.btn-envoyer-reponse');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';

      var url = SCRIPT_URL + '?action=saveReponseOuverte' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&reponseOuverte=' + encodeURIComponent(reponse);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var confirmation = document.getElementById('openConfirmation-' + index);
          if (data.success) {
            confirmation.classList.add('visible');
            textarea.disabled = true;
            btn.textContent = '✓ Envoyé';
            etat.reponseEnvoyee = true;
          } else {
            alert('Erreur : ' + (data.message || 'Impossible d\'envoyer la réponse.'));
            btn.disabled = false;
            btn.textContent = 'Envoyer la réponse';
          }
        })
        .catch(function(e) {
          alert('Erreur réseau. Veuillez réessayer.');
          btn.disabled = false;
          btn.textContent = 'Envoyer la réponse';
        });
    }

    // ============================================================
    // RÉCUPÉRER LE STATUT EXISTANT
    // ============================================================
    function recupererStatutExistant() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';

      var url = SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(nom);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses) {
            var reponse = data.reponses.find(function(r) {
              return r.articleId === etat.postId;
            });

            if (reponse) {
              if (reponse.bonnes > 0 && reponse.total > 0) {
                var seuil = Math.ceil(reponse.total / 2);
                if (reponse.bonnes >= seuil) {
                  etat.statutFinal = 'valide';
                  etat.totalBonnes = reponse.bonnes;
                  etat.totalQuestions = reponse.total;
                  mettreAJourResultat();
                }
              }
            }
          }
        })
        .catch(function(e) {
          console.error('Erreur récupération statut:', e);
        });
    }

    // ============================================================
    // FERMER LA LISEUSE
    // ============================================================
    function fermerLiseuse() {
      window.location.href = '/medit/mes-textes.html';
    }

    // ============================================================
    // UTILITAIRE - TROUVER L'INDEX D'UNE PAGE
    // ============================================================
    function getPageIndex(quizIndex) {
      var pages = document.querySelectorAll('.page-item');
      for (var i = 0; i < pages.length; i++) {
        var page = etat.pages[i];
        if (page && page.type === 'quiz' && page.index === quizIndex) {
          return i;
        }
      }
      return 0;
    }

    // ============================================================
    // AFFICHER UNE ERREUR
    // ============================================================
    function afficherErreur(message) {
      var container = document.getElementById('lectureContainer');
      container.innerHTML = `
        <div class="lecture-error">
          <div class="icone">📖</div>
          <h2>Texte introuvable</h2>
          <p>${message || 'Le texte que vous recherchez n\'existe pas ou a été supprimé.'}</p>
          <a href="/medit/mes-textes.html" class="btn-retour">← Retour à mes textes</a>
        </div>
      `;
    }

    // ============================================================
    // EXPOSER LES FONCTIONS GLOBALEMENT
    // ============================================================
    window.selectionnerReponse = selectionnerReponse;
    window.envoyerReponseOuverte = envoyerReponseOuverte;
    window.fermerLiseuse = fermerLiseuse;
  </script>
