<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>۞</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/article.css" />
  <style>
    /* ============================================================
       STYLES CORRIGÉS POUR L'AFFICHAGE DES ARTICLES
       ============================================================ */
    
    /* Conteneur principal de l'article */
    .page-article {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .blog-article {
      width: 100%;
      max-width: 820px;
      background: #f3f0e9;
      border-radius: 4px;
      padding: 32px 40px 24px;
      border: 1px solid #d1ccc4;
      position: relative;
    }

    .btn-retour {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 20px;
      color: #6b7a8a;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .btn-retour:hover { color: #2c2c2c; }

    .article-content {
      width: 100%;
    }

    .post-label {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6b7a8a;
      margin-bottom: 8px;
      font-weight: 500;
    }

    #article-titre {
      font-size: 28px;
      font-weight: 400;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 20px;
      line-height: 1.3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-share-title {
      background: transparent;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 16px;
      cursor: pointer;
      color: #6b7a8a;
    }
    .btn-share-title:hover { background: #e8e5e0; color: #2c2c2c; }

    /* ============================================================
       CONTENEUR DES SLIDES - CORRIGÉ
       ============================================================ */
    .paragraphe-container {
      width: 100%;
      margin: 12px 0 8px;
      min-height: 120px;
      border: 1px solid transparent;
    }

    .paragraphe-wrapper {
      width: 100%;
    }

    .paragraphe-item {
      padding: 12px 0;
      font-size: 17px;
      line-height: 1.8;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #2c2c2c;
      min-height: 80px;
    }

    .slide-content {
      font-size: 17px;
      line-height: 1.8;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #2c2c2c;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* ============================================================
       COMPTEUR + STYLO
       ============================================================ */
    .compteur-bloc {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0 8px;
      border-top: 1px solid #e8e5e0;
      margin-top: 8px;
    }
    .compteur {
      font-size: 14px;
      color: #6b7a8a;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-annotate {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #6b7a8a;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .btn-annotate:hover { background: #e8e5e0; }
    .lock-message { font-size: 13px; color: #6b7a8a; font-style: italic; margin-left: auto; }

    /* ============================================================
       QUIZ
       ============================================================ */
    .quiz-container {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #d1ccc4;
    }
    .quiz-container h3 {
      font-size: 18px;
      font-weight: 600;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 12px;
    }
    .quiz-item {
      padding: 12px 0;
      border-bottom: 1px solid #e8e5e0;
    }
    .quiz-item:last-child { border-bottom: none; }
    .quiz-question {
      font-size: 15px;
      font-weight: 500;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 6px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 12px;
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #2c2c2c;
      cursor: pointer;
      padding: 4px 0;
    }
    .quiz-option input[type="radio"] {
      accent-color: #2d6a4f;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .quiz-option:hover { background: #e8e5e0; }

    #quiz-result {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 4px;
      background: #e8e5e0;
    }
    #quiz-result p { margin: 4px 0; }
    #quiz-score { font-weight: 600; color: #2d6a4f; }
    #quiz-total { font-weight: 600; color: #2c2c2c; }
    #quiz-message { font-weight: 500; }

    /* ============================================================
       QUESTION OUVERTE
       ============================================================ */
    #openQuestion {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #d1ccc4;
    }
    #openQuestion h3 {
      font-size: 18px;
      font-weight: 600;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 8px;
    }
    #questionOuverteTexte {
      font-size: 15px;
      font-weight: 400;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 8px;
    }
    #openQuestion textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1ccc4;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      background: #faf8f5;
      color: #2c2c2c;
      resize: vertical;
      min-height: 80px;
    }
    #openQuestion textarea:focus { outline: none; border-color: #2d6a4f; }
    .btn-nav {
      padding: 8px 24px;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: #2c2c2c;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-nav:hover { background: #e8e5e0; }
    #form-message-mailto { margin-top: 6px; font-size: 14px; }

    /* ============================================================
       POST FOOTER
       ============================================================ */
    .post-footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid #e8e5e0;
      text-align: center;
      font-size: 12px;
      color: #b8b0a8;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ============================================================
       DOTS (points de navigation)
       ============================================================ */
    .dots-container-outside {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #d1ccc4;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
    }
    .dot:hover { background: #b8b0a8; }
    .dot.active { background: #2c2c2c; }

    /* ============================================================
       LOADER & ERREUR
       ============================================================ */
    .loader {
      text-align: center;
      padding: 60px 20px;
      color: #b8b0a8;
    }
    .loader .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #d1ccc4;
      border-top-color: #2c2c2c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .erreur-article {
      text-align: center;
      padding: 60px 20px;
      border: 1px solid #d1ccc4;
      border-radius: 4px;
      background: #f3f0e9;
    }
    .erreur-article h2 {
      font-size: 20px;
      font-weight: 400;
      font-family: 'Georgia', serif;
      color: #2c2c2c;
      margin-bottom: 4px;
    }
    .erreur-article p { color: #b8b0a8; font-size: 15px; }

    /* ============================================================
       ANNOTATION POPUP
       ============================================================ */
    .annotate-popup {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      background: #faf8f5;
      border: 1px solid #d1ccc4;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      z-index: 9999;
    }
    .annotate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #2c2c2c;
    }
    .annotate-close {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #6b7a8a;
    }
    .annotate-close:hover { color: #2c2c2c; }
    .annotate-popup textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1ccc4;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Georgia', serif;
      background: #ffffff;
      color: #2c2c2c;
      resize: vertical;
      min-height: 100px;
    }
    .annotate-popup textarea:focus { outline: none; border-color: #2d6a4f; }
    .annotate-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #6b7a8a;
    }
    .annotate-auto-save { font-style: italic; }
    .annotate-status { font-weight: 500; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .blog-article { padding: 20px 16px; }
      #article-titre { font-size: 22px; }
      .paragraphe-item { font-size: 15px; }
      .slide-content { font-size: 15px; }
      .annotate-popup { bottom: 40px; padding: 16px; }
    }
    @media (max-width: 480px) {
      .blog-article { padding: 16px 12px; }
      #article-titre { font-size: 19px; }
      .paragraphe-item { font-size: 14px; }
      .slide-content { font-size: 14px; }
      .btn-retour { font-size: 16px; top: 8px; right: 12px; }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = '';
      });

    function mettreAJourHeader() {}
    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }
  </script>

  <!-- ========== PAGE ARTICLE ========== -->
  <div class="page-article">

    <div class="blog-article" id="contenu-principal">

      <!-- ========== CROIX RETOUR ========== -->
      <a href="/medit/mes-textes.html" class="btn-retour" aria-label="Retour">✕</a>

      <!-- ========== CONTENU SCROLLABLE ========== -->
      <div class="article-content">

        <!-- LOADER -->
        <div class="loader" id="loader">
          <div class="spinner"></div>
          <p>Chargement...</p>
        </div>

        <!-- ERREUR -->
        <div class="erreur-article" id="erreur" style="display:none;">
          <h2>Méditation introuvable</h2>
          <p>Ce texte n'existe pas ou a été déplacé.</p>
          <a href="/medit/mes-textes.html" style="margin-top:12px;display:inline-block;padding:10px 24px;background:#2d6a4f;color:#fff;border-radius:30px;font-weight:500;font-family:'Lora','Georgia',serif;text-decoration:none;">Voir toutes</a>
        </div>

        <!-- CONTENU DE L'ARTICLE -->
        <div id="article-charge" style="display:none; width:100%;">

          <span class="post-label" id="postLabel">Méditation</span>
          
          <h1 id="article-titre">
            Titre
            <button class="btn-share-title" onclick="partager()" aria-label="Partager">↗</button>
          </h1>

          <!-- ========== SLIDES ========== -->
          <div class="paragraphe-container">
            <div class="paragraphe-wrapper" id="slideWrapper"></div>
          </div>

          <!-- ========== COMPTEUR + STYLO ========== -->
          <div class="compteur-bloc">
            <span class="compteur" id="compteur">1 / 1</span>
            <button class="btn-annotate" id="btnAnnotate" title="Annoter cette slide">
              <span id="annotateIcon">✏</span>
            </button>
            <span class="lock-message" id="lockMessage"></span>
          </div>

          <!-- ========== QUIZ + QUESTION OUVERTE ========== -->
          <div class="paragraphe-item" id="slideQuiz" style="display: none;">
            
            <div class="quiz-container" id="quizContent">
              <h3>Quiz</h3>
              <div id="quizQuestionsContainer"></div>
              <div id="quiz-result">
                <p><strong>Score :</strong> <span id="quiz-score">0</span> / <span id="quiz-total">0</span></p>
                <p id="quiz-message"></p>
              </div>
            </div>

            <div id="openQuestion">
              <h3>Question ouverte</h3>
              <h4 id="questionOuverteTexte">Qu'est-ce que ce texte vous a inspiré ?</h4>
              <p>
                <label>Votre réponse :<br />
                  <textarea id="reponse-mailto" placeholder="Écrivez ici votre réponse..." rows="3"></textarea>
                </label>
              </p>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                <button class="btn-nav" onclick="validerReponse()">Enregistrer</button>
              </div>
              <div id="form-message-mailto" style="margin-top:6px;"></div>
            </div>

          </div>

        </div>
      </div>

      <!-- ========== POST FOOTER ========== -->
      <div class="post-footer">
        <span class="post-meta">qiraat.fr · Sir Khan · <span id="postDate"></span></span>
      </div>

    </div>

    <!-- ========== DOTS ========== -->
    <div id="dotsContainerOutside" class="dots-container-outside"></div>

  </div>

  <!-- ========== ANNOTATION POPUP ========== -->
  <div class="annotate-popup" id="annotatePopup">
    <div class="annotate-header">
      <span>✐ Note sur la slide <span id="annotateSlideNum">1</span></span>
      <button class="annotate-close" id="annotateClose">✓</button>
    </div>
    <textarea id="annotateTextarea" placeholder="Écris ta réflexion, une question, ce que tu retiens..." rows="4"></textarea>
    <div class="annotate-footer">
      <span class="annotate-auto-save">Sauvegarde automatique</span>
      <span class="annotate-status" id="annotateStatus"></span>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = '';
      });
  </script>

  <script>
    // ============================================================
    // PARTAGE NATIF
    // ============================================================
    function partager() {
      var url = window.location.href;
      var titre = document.querySelector('h1')?.textContent || 'Méditation';

      if (navigator.share) {
        navigator.share({
          title: titre,
          text: '📖 ' + titre + ' — sur Qiraat',
          url: url
        }).catch(function() {});
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() {
            alert('🔗 Lien copié !');
          }).catch(function() {});
        } else {
          var input = document.createElement('input');
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          alert('Lien copié !');
        }
      }
    }
     
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/article.js"></script>
  <link rel="stylesheet" href="/medit/lecture-mode.css" />

</body>
</html>
