<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>۞</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/article.css" />
  <link rel="stylesheet" href="/medit/font/qcf4.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <!-- ========== PAGE ARTICLE ========== -->
  <div class="page-article">

    <div class="blog-article" id="contenu-principal">

      <!-- ========== CROIX RETOUR ========== -->
      <a href="/medit/mes-textes.html" class="btn-retour" aria-label="Retour">✕</a>

      <!-- ========== CONTENU SCROLLABLE ========== -->
      <div class="article-content">

        <div class="loader" id="loader">
          <div class="spinner"></div>
          <p>Chargement...</p>
        </div>

        <div class="erreur-article" id="erreur" style="display:none;">
          <h2>Méditation introuvable</h2>
          <p>ce texte n'existe pas ou a été déplacée.</p>
          <a href="/medit/mes-textes.html" style="margin-top:12px;display:inline-block;padding:10px 24px;background:#2d6a4f;color:#fff;border-radius:30px;font-weight:500;font-family:'Lora','Georgia',serif;">Voir toutes</a>
        </div>

        <div id="article-charge" style="display:none; width:100%;">

          <span class="post-label" id="postLabel">Méditation</span>
          
          <!-- ========== TITRE AVEC BOUTON DE PARTAGE ========== -->
          <h1 id="article-titre">
            Titre
            <button class="btn-share-title" onclick="partager()" aria-label="Partager">↗</button>
          </h1>

          <!-- ========== CONTENU DES SLIDES ========== -->
          <div class="paragraphe-container">
            <div class="paragraphe-wrapper" id="slideWrapper"></div>
          </div>

          <!-- ========== COMPTEUR + STYLO + MESSAGE ========== -->
          <div class="compteur-bloc">
            <span class="compteur" id="compteur">1 / 1</span>
            <button class="btn-annotate" id="btnAnnotate" title="Annoter cette slide">
              <span id="annotateIcon">✏</span>
            </button>
            <span class="lock-message" id="lockMessage"></span>
          </div>

          <div class="paragraphe-item" id="slideQuiz" style="display: none;">
            <div class="quiz-container" id="quizContent">
              <h3>Quiz</h3>
              <div id="quizQuestionsContainer"></div>
              <div id="quiz-result">
                <p><strong>Score :</strong> <span id="quiz-score">0</span> / <span id="quiz-total">0</span></p>
                <p id="quiz-message"></p>
              </div>
            </div>

            <div id="openQuestion">
              <h3>Question ouverte</h3>
              <h4 id="questionOuverteTexte">Qu'est-ce que ce texte vous a inspiré ?</h4>
              <p>
                <label>Votre réponse :<br />
                  <textarea id="reponse-mailto" placeholder="Écrivez ici votre réponse..." rows="3"></textarea>
                </label>
              </p>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                <button class="btn-nav" onclick="validerReponse()">Enregistrer</button>
              </div>
              <div id="form-message-mailto" style="margin-top:6px;"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- ========== PIED DE CARTE ========== -->
      <div class="post-footer">
        <span class="post-meta">qiraat.fr · Sir Khan · <span id="postDate"></span></span>
      </div>

    </div>

    <!-- ========== POINTS (DOTS) ========== -->
    <div id="dotsContainerOutside" class="dots-container-outside"></div>

  </div>

  <!-- Popup d'annotation -->
  <div class="annotate-popup" id="annotatePopup">
    <div class="annotate-header">
      <span>✐ Note sur la slide <span id="annotateSlideNum">1</span></span>
      <button class="annotate-close" id="annotateClose">✓</button>
    </div>
    <textarea id="annotateTextarea" placeholder="Écris ta réflexion, une question, ce que tu retiens..." rows="4"></textarea>
    <div class="annotate-footer">
      <span class="annotate-auto-save">Sauvegarde automatique</span>
      <span class="annotate-status" id="annotateStatus"></span>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <!-- ========== CHARGEMENT DES SCRIPTS DANS LE BON ORDRE ========== -->
  
  <!-- 1. CONFIG D'ABORD -->
  <script src="/medit/config.js"></script>
  
  <!-- 2. ENSUITE LES AUTRES SCRIPTS -->
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/article.js"></script>
  <script src="/medit/lecture-mode.js"></script>
  
  <!-- 3. ENFIN LE CODE PERSONNALISÉ -->
  <script>
    // ============================================================
    // CHARGEMENT DU HEADER
    // ============================================================
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
        mettreAJourHeader();
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
        document.getElementById('header-container').innerHTML = '';
      });

    function mettreAJourHeader() {
      // Header caché, rien à faire
    }

    function deconnecter() {
      if (confirm('Se déconnecter ?')) {
        localStorage.removeItem('etudiant_id');
        localStorage.removeItem('etudiant_niveau');
        window.location.href = '/medit/index.html';
      }
    }

    // ============================================================
    // PARTAGE NATIF
    // ============================================================
    function partager() {
      var url = window.location.href;
      var titre = document.querySelector('h1')?.textContent || 'Méditation';

      if (navigator.share) {
        navigator.share({
          title: titre,
          text: '📖 ' + titre + ' — sur Qiraat',
          url: url
        }).catch(function() {});
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() {
            alert('🔗 Lien copié !');
          }).catch(function() {});
        } else {
          var input = document.createElement('input');
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          alert('Lien copié !');
        }
      }
    }

    // ============================================================
    // VALIDER LA RÉPONSE OUVERTE - AVEC DEBUG
    // ============================================================
    function validerReponse() {
      console.log('=== validerReponse() appelée ===');
      
      // Debug: afficher ce qui est dans CONFIG
      console.log('CONFIG:', typeof CONFIG);
      console.log('CONFIG.scriptUrl:', CONFIG ? CONFIG.scriptUrl : 'undefined');
      
      var reponse = document.getElementById('reponse-mailto').value;
      var messageDiv = document.getElementById('form-message-mailto');
      
      if (!reponse || reponse.trim() === '') {
        messageDiv.innerHTML = '<span style="color:#d9534f;">Veuillez écrire une réponse avant d\'enregistrer.</span>';
        return;
      }

      var nom = localStorage.getItem('etudiant_id');
      var articleId = getArticleIdFromUrl();

      console.log('nom:', nom);
      console.log('articleId:', articleId);

      if (!nom || !articleId) {
        messageDiv.innerHTML = '<span style="color:#d9534f;">Erreur : utilisateur ou article non identifié.</span>';
        return;
      }

      // Vérifier CONFIG
      if (typeof CONFIG === 'undefined' || !CONFIG.scriptUrl) {
        console.error('CONFIG non trouvé ou scriptUrl manquant');
        messageDiv.innerHTML = '<span style="color:#d9534f;">Erreur : configuration non trouvée. Vérifie que config.js est chargé.</span>';
        return;
      }

      var params = new URLSearchParams();
      params.append('action', 'saveReponseOuverte');
      params.append('nom', nom);
      params.append('articleId', articleId);
      params.append('reponseOuverte', reponse);

      var url = CONFIG.scriptUrl + '?' + params.toString();
      console.log('URL appelée:', url);

      fetch(url)
        .then(function(response) { 
          console.log('Réponse reçue, status:', response.status);
          return response.json(); 
        })
        .then(function(data) {
          console.log('Données reçues:', data);
          if (data.success) {
            messageDiv.innerHTML = '<span style="color:#2d6a4f;">✅ Réponse enregistrée avec succès !</span>';
            document.getElementById('reponse-mailto').disabled = true;
          } else {
            messageDiv.innerHTML = '<span style="color:#d9534f;">❌ Erreur : ' + (data.message || 'inconnue') + '</span>';
          }
        })
        .catch(function(error) {
          console.error('Erreur fetch:', error);
          messageDiv.innerHTML = '<span style="color:#d9534f;">❌ Erreur réseau : ' + error.message + '</span>';
        });
    }

    function getArticleIdFromUrl() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('postId') || null;
      console.log('ID extrait de l\'URL:', id);
      return id;
    }

    // ============================================================
    // CHARGEMENT DU FOOTER
    // ============================================================
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = '';
      });
  </script>

  <link rel="stylesheet" href="/medit/lecture-mode.css" />
</body>
</html>
