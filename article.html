<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Lecture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       LISEUSE - STYLE SOMBRE ET ÉPURÉ
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Merriweather', 'Georgia', serif;
      background: #121212;
      color: #e8e0d8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER LISEUSE ===== */
    .lecture-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      min-height: 72px;
      z-index: 10;
    }

    .lecture-header .meta-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lecture-header .meta-left .cat-niveau {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b6b6b;
    }

    .lecture-header .meta-left .cat-niveau span {
      margin: 0 6px;
    }

    .lecture-header .meta-left .titre {
      font-family: 'Merriweather', serif;
      font-size: 20px;
      font-weight: 400;
      color: #e8e0d8;
      line-height: 1.3;
    }

    .lecture-header .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lecture-header .actions .btn-close {
      background: none;
      border: none;
      color: #6b6b6b;
      font-size: 28px;
      cursor: pointer;
      padding: 8px 8px 4px 8px;
      line-height: 1;
      transition: color 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .lecture-header .actions .btn-close:hover {
      color: #e8e0d8;
    }

    .lecture-header .actions .badge-statut {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #6b6b6b;
      letter-spacing: 0.3px;
      display: none;
    }

    .lecture-header .actions .badge-statut.valide {
      display: inline-block;
      background: #1e3a2a;
      color: #7ab893;
    }

    .lecture-header .actions .badge-statut.non-valide {
      display: inline-block;
      background: #3a1e1e;
      color: #c87a7a;
    }

    /* ===== CONTENU PRINCIPAL ===== */
    .lecture-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: #161616;
    }

    .lecture-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ===== PAGES ===== */
    .pages-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding: 20px 40px 20px 40px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    .pages-wrapper::-webkit-scrollbar {
      width: 4px;
    }

    .pages-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .pages-wrapper::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 4px;
    }

    .page-item {
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 20px;
      max-width: 780px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      scroll-margin-top: 20px;
    }

    .page-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page-item .page-num {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #3a3a3a;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .page-item .page-content {
      font-size: 19px;
      line-height: 1.9;
      color: #e0d8d0;
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .page-item .page-content p {
      margin-bottom: 1.2em;
    }

    .page-item .page-content p:last-child {
      margin-bottom: 0;
    }

    /* ===== SLIDES ===== */
    .page-item.slide .page-content {
      font-size: 21px;
      line-height: 2;
    }

    .page-item.slide .page-content .slide-idee {
      font-style: italic;
      color: #6b6b6b;
      border-left: 3px solid #2a2a2a;
      padding-left: 20px;
    }

    /* ===== QUIZ ===== */
    .page-item.quiz .page-content {
      font-size: 18px;
    }

    .page-item.quiz .quiz-question {
      font-weight: 400;
      font-size: 20px;
      margin-bottom: 20px;
      color: #e8e0d8;
    }

    .page-item.quiz .quiz-reponses {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .page-item.quiz .quiz-reponse {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #c8c0b8;
    }

    .page-item.quiz .quiz-reponse:hover {
      background: #262626;
      border-color: #3a3a3a;
    }

    .page-item.quiz .quiz-reponse .lettre {
      font-weight: 600;
      color: #6b6b6b;
      min-width: 24px;
      font-size: 13px;
    }

    .page-item.quiz .quiz-reponse.selectionnee {
      border-color: #4a6a5a;
      background: #1e2a24;
    }

    .page-item.quiz .quiz-reponse.correcte {
      border-color: #4a8a5a;
      background: #1a2a1e;
      color: #8ac8a0;
    }

    .page-item.quiz .quiz-reponse.incorrecte {
      border-color: #8a4a4a;
      background: #2a1a1a;
      color: #c88a8a;
    }

    .page-item.quiz .quiz-reponse .result-icon {
      margin-left: auto;
      font-size: 18px;
    }

    .page-item.quiz .quiz-feedback {
      margin-top: 16px;
      padding: 14px 20px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }

    .page-item.quiz .quiz-feedback.visible {
      display: block;
    }

    .page-item.quiz .quiz-feedback .bonne-reponse {
      color: #8ac8a0;
    }

    .page-item.quiz .quiz-feedback .score {
      font-weight: 500;
      color: #e8e0d8;
      margin-top: 8px;
    }

    /* ===== QUESTION OUVERTE ===== */
    .page-item.open-question .page-content {
      font-size: 18px;
    }

      font-weight: 400;
      font-size:
