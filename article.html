<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>Lecture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       LISEUSE - VERSION FINALE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #121212; }
    body { font-family: 'Merriweather', serif; color: #e8e0d8; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #121212; }

    /* ===== HEADER ===== */
    .lecture-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 32px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0; min-height: 64px; z-index: 10;
    }
    .lecture-header .meta-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .lecture-header .meta-left .cat-niveau { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: #6b6b6b; }
    .lecture-header .meta-left .titre { font-family: 'Merriweather', serif; font-size: 18px; font-weight: 400; color: #e8e0d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lecture-header .actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .lecture-header .actions .btn-close { background: none; border: none; color: #6b6b6b; font-size: 26px; cursor: pointer; padding: 4px 8px; line-height: 1; transition: color 0.2s; font-family: 'Inter', sans-serif; }
    .lecture-header .actions .btn-close:hover { color: #e8e0d8; }
    .lecture-header .actions .badge-statut { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; padding: 4px 14px; border-radius: 20px; background: #2a2a2a; color: #6b6b6b; letter-spacing: 0.3px; display: none; }
    .lecture-header .actions .badge-statut.valide { display: inline-block; background: #1e3a2a; color: #7ab893; }
    .lecture-header .actions .badge-statut.non-valide { display: inline-block; background: #3a1e1e; color: #c87a7a; }
    .lecture-header .actions .badge-statut.en-attente { display: inline-block; background: #2a2a1e; color: #c8b87a; }

    /* ===== SLIDES CONTAINER ===== */
    .slides-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #121212;
      cursor: pointer;
    }

    .slide-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .slide-wrapper.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-content {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      font-size: 21px;
      line-height: 2;
      color: #e0d8d0;
      font-weight: 300;
      letter-spacing: 0.3px;
      position: relative;
    }

    .slide-content p { margin-bottom: 1.2em; }
    .slide-content p:last-child { margin-bottom: 0; }

    /* ===== SLIDE IDÉE ===== */
    .slide-content .slide-idee {
      font-style: italic;
      color: #6b6b6b;
      border-left: 3px solid #2a2a2a;
      padding-left: 20px;
    }

    /* ===== QUIZ ===== */
    .slide-content.quiz-content { font-size: 18px; }
    .slide-content .quiz-question { font-weight: 400; font-size: 20px; margin-bottom: 20px; color: #e8e0d8; }
    .slide-content .quiz-reponses { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .slide-content .quiz-reponse {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
      border-radius: 8px; background: #1e1e1e; border: 1px solid #2a2a2a;
      cursor: pointer; transition: all 0.2s ease;
      font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 400; color: #c8c0b8;
    }
    .slide-content .quiz-reponse:hover { background: #262626; border-color: #3a3a3a; }
    .slide-content .quiz-reponse .lettre { font-weight: 600; color: #6b6b6b; min-width: 24px; font-size: 13px; }
    .slide-content .quiz-reponse.selectionnee { border-color: #4a6a5a; background: #1e2a24; }
    .slide-content .quiz-reponse.correcte { border-color: #4a8a5a; background: #1a2a1e; color: #8ac8a0; }
    .slide-content .quiz-reponse.incorrecte { border-color: #8a4a4a; background: #2a1a1a; color: #c88a8a; }
    .slide-content .quiz-reponse .result-icon { margin-left: auto; font-size: 18px; }
    .slide-content .quiz-feedback {
      margin-top: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .slide-content .quiz-feedback.visible { opacity: 1; }
    .slide-content .quiz-feedback .bonne-reponse { color: #8ac8a0; }
    .slide-content .quiz-feedback .mauvaise-reponse { color: #c87a7a; }

    /* ===== BOUTON CONTINUER ===== */
    .btn-continuer {
      display: inline-block;
      background: transparent;
      color: #8ac8a0;
      border: 1px solid #4a6a5a;
      border-radius: 30px;
      padding: 8px 28px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(8px);
    }
    .btn-continuer.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .btn-continuer:hover {
      background: #1a2a1e;
    }

    /* ===== QUESTION OUVERTE ===== */
    .slide-content.open-content { font-size: 18px; }
    .slide-content .open-question-text { font-weight: 400; font-size: 20px; color: #e8e0d8; margin-bottom: 16px; }
    .slide-content textarea {
      width: 100%; min-height: 120px; padding: 14px 18px; border-radius: 8px;
      background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0d8d0;
      font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.6;
      resize: vertical; transition: border-color 0.2s;
    }
    .slide-content textarea:focus { outline: none; border-color: #4a6a5a; }
    .slide-content textarea::placeholder { color: #4a4a4a; }
    .slide-content .btn-envoyer-reponse {
      margin-top: 12px; padding: 10px 28px; border-radius: 8px;
      background: transparent; border: 1px solid #4a6a5a; color: #8ac8a0;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s; align-self: flex-start;
    }
    .slide-content .btn-envoyer-reponse:hover { background: #1a2a1e; border-color: #5a8a6a; }
    .slide-content .btn-envoyer-reponse:disabled { opacity: 0.4; cursor: not-allowed; }
    .slide-content .reponse-confirmation {
      margin-top: 12px; font-family: 'Inter', sans-serif; font-size: 14px;
      color: #7ab893; display: none;
    }
    .slide-content .reponse-confirmation.visible { display: block; }

    /* ===== ANNOTATION ===== */
    .annotation-container {
      position: fixed;
      bottom: 80px;
      right: 32px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .annotation-toggle {
      background: transparent;
      border: none;
      color: #4a4a4a;
      font-size: 22px;
      cursor: pointer;
      transition: color 0.3s ease;
      padding: 8px;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
    }
    .annotation-toggle:hover { color: #8ac8a0; border-color: #4a6a5a; }
    .annotation-toggle.has-note { color: #8ac8a0; border-color: #4a6a5a; }
    .annotation-toggle .dot-save {
      display: none;
      width: 8px;
      height: 8px;
      background: #4a6a5a;
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
      right: 4px;
    }
    .annotation-toggle .dot-save.saved { display: block; background: #4a8a5a; }
    .annotation-toggle .dot-save.saving { display: block; background: #c8b87a; animation: pulse-dot 0.8s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .annotation-box {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      width: 300px;
      max-width: 80vw;
      margin-bottom: 4px;
    }
    .annotation-box.open { display: block; }
    .annotation-box textarea {
      width: 100%;
      min-height: 80px;
      background: transparent;
      border: none;
      color: #e0d8d0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .annotation-box textarea::placeholder { color: #4a4a4a; }

    /* ===== RETENIR ===== */
    .slide-content.retenir-content { font-size: 18px; text-align: center; }
    .slide-content .retenir-mots { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin: 24px 0; }
    .slide-content .retenir-mot { font-family: 'Merriweather', serif; font-size: 28px; font-weight: 400; color: #e8e0d8; padding: 12px 24px; border: 1px solid #2a2a2a; border-radius: 8px; background: #1a1a1a; }
    .slide-content .retenir-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: #6b6b6b; margin-bottom: 8px; }

    /* ===== PAGINATION ===== */
    .pagination {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #4a4a4a;
      letter-spacing: 0.5px;
      background: rgba(18, 18, 18, 0.8);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      pointer-events: none;
      z-index: 5;
    }

    /* ===== BOUTON FERMER DERNIER SLIDE ===== */
    .btn-fermer-slide {
      display: inline-block;
      background: transparent;
      color: #c8c0b8;
      border: 1px solid #2a2a2a;
      border-radius: 30px;
      padding: 8px 28px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
    }
    .btn-fermer-slide:hover {
      background: #1e1e1e;
      color: #e8e0d8;
    }

    /* ===== LOADER ===== */
    .lecture-loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #6b6b6b; font-family: 'Inter', sans-serif; font-size: 14px;
    }
    .lecture-loader .spinner {
      width: 32px; height: 32px; border: 3px solid #2a2a2a;
      border-top-color: #6b6b6b; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lecture-error {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #6b6b6b; font-family: 'Inter', sans-serif; text-align: center; padding: 40px;
    }
    .lecture-error .icone { font-size: 48px; margin-bottom: 16px; }
    .lecture-error h2 { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 400; color: #e8e0d8; margin-bottom: 8px; }
    .lecture-error p { font-size: 14px; color: #6b6b6b; }
    .lecture-error .btn-retour { margin-top: 20px; padding: 10px 28px; border-radius: 8px; background: transparent; border: 1px solid #2a2a2a; color: #c8c0b8; font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .lecture-error .btn-retour:hover { background: #2a2a2a; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .lecture-header { padding: 10px 16px; min-height: 56px; }
      .lecture-header .meta-left .titre { font-size: 15px; }
      .slide-wrapper { padding: 20px 24px; }
      .slide-content { font-size: 18px; line-height: 1.9; }
      .slide-content .quiz-question { font-size: 17px; }
      .slide-content .quiz-reponse { font-size: 14px; padding: 10px 14px; }
      .slide-content .retenir-mot { font-size: 22px; padding: 10px 18px; }
      .pagination { bottom: 24px; font-size: 12px; padding: 4px 14px; }
      .annotation-container { bottom: 70px; right: 16px; }
      .annotation-box { width: 240px; }
    }
    @media (max-width: 480px) {
      .lecture-header { padding: 8px 12px; min-height: 50px; }
      .lecture-header .meta-left .titre { font-size: 13px; }
      .slide-wrapper { padding: 16px 16px; }
      .slide-content { font-size: 16px; line-height: 1.8; }
      .slide-content .quiz-question { font-size: 15px; }
      .slide-content .quiz-reponse { font-size: 13px; padding: 8px 12px; gap: 10px; }
      .slide-content .quiz-reponse .lettre { font-size: 12px; min-width: 20px; }
      .slide-content .retenir-mot { font-size: 18px; padding: 8px 14px; }
      .slide-content textarea { min-height: 100px; font-size: 14px; }
      .pagination { bottom: 16px; font-size: 11px; padding: 4px 12px; }
      .annotation-container { bottom: 60px; right: 12px; }
      .annotation-box { width: 200px; }
      .annotation-toggle { width: 38px; height: 38px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="lecture-header">
    <div class="meta-left">
      <div class="cat-niveau">
        <span id="metaCategorie">—</span> · <span id="metaNiveau">Niveau —</span>
      </div>
      <div class="titre" id="metaTitre">Chargement...</div>
    </div>
    <div class="actions">
      <span class="badge-statut" id="badgeStatut"></span>
      <button class="btn-close" id="btnFermer">✕</button>
    </div>
  </header>

  <!-- ===== SLIDES ===== -->
  <div class="slides-container" id="slidesContainer">
    <div class="lecture-loader" id="lectureLoader">
      <div class="spinner"></div>
      <span>Chargement...</span>
    </div>
  </div>

  <!-- ===== ANNOTATION ===== -->
  <div class="annotation-container" id="annotationContainer">
    <div class="annotation-box" id="annotationBox">
      <textarea id="annotationTextarea" placeholder="Écrire une note sur cette slide..."></textarea>
    </div>
    <button class="annotation-toggle" id="annotationToggle" title="Notes">
      <span>✎</span>
      <span class="dot-save" id="annotationDot"></span>
    </button>
  </div>

  <script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkB3GmKI8olDeB4-12FHHzmpe1cQPl9FroBx0yBRDBeI0UY5nITpEnSLfK_0qfo6p1/exec';

    var etat = {
      postId: null,
      post: null,
      slides: [],
      currentIndex: 0,
      reponsesQuiz: {},
      totalBonnes: 0,
      totalQuestions: 0,
      statutFinal: null,
      enTransition: false,
      annotations: {},
      annotationOpen: false,
      annotationSaving: false
    };

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id) { afficherErreur('Aucun identifiant.'); return; }
      etat.postId = id;
      chargerPost(id);
    });

    // ============================================================
    // CHARGER
    // ============================================================
    function chargerPost(id) {
      fetch(SCRIPT_URL + '?action=getPost&id=' + encodeURIComponent(id))
        .then(function(r) { if (!r.ok) throw new Error('Erreur réseau'); return r.json(); })
        .then(function(data) {
          if (!data.success || !data.post) throw new Error(data.message || 'Texte introuvable');
          etat.post = data.post;
          preparerSlides(etat.post);
          afficherSlides();
          chargerAnnotations();
        })
        .catch(function(error) { afficherErreur(error.message); });
    }

    // ============================================================
    // PARSER - NETTOYAGE DES | INCLUS
    // ============================================================
    function parserContenu(texte) {
      var result = { slides: [], quizs: [], openQuestions: [], retenir: [] };
      if (!texte) return result;

      // Nettoyer les | superflus
      texte = texte.replace(/\s*\|\s*$/gm, '');

      var patterns = ['-s-', '-q-', '-v-', '-f-', '-qs-', '-r-', '-i-'];
      var indices = [];

      for (var p = 0; p < patterns.length; p++) {
        var pos = texte.indexOf(patterns[p]);
        while (pos !== -1) {
          indices.push({ pos: pos, pattern: patterns[p] });
          pos = texte.indexOf(patterns[p], pos + 1);
        }
      }

      indices.sort(function(a, b) { return a.pos - b.pos; });

      var elements = [];
      for (var i = 0; i < indices.length; i++) {
        var start = indices[i].pos;
        var end = (i + 1 < indices.length) ? indices[i + 1].pos : texte.length;
        var element = texte.substring(start, end).trim();
        if (element) elements.push(element);
      }

      var quizCourant = null;

      for (var i = 0; i < elements.length; i++) {
        var ligne = elements[i].trim();
        if (!ligne) continue;

        if (ligne.startsWith('-s-')) {
          result.slides.push({ type: 'slide', contenu: ligne.replace('-s-', '').trim() || 'Slide vide' });
          continue;
        }

        if (ligne.startsWith('-q-')) {
          if (quizCourant && quizCourant.reponses.length > 0) {
            result.quizs.push(quizCourant);
          }
          quizCourant = { question: ligne.replace('-q-', '').trim() || 'Question', reponses: [] };
          continue;
        }

        if (ligne.startsWith('-v-')) {
          if (quizCourant) {
            quizCourant.reponses.push({ texte: ligne.replace('-v-', '').trim() || 'Vrai', correct: true });
          }
          continue;
        }

        if (ligne.startsWith('-f-')) {
          if (quizCourant) {
            quizCourant.reponses.push({ texte: ligne.replace('-f-', '').trim() || 'Faux', correct: false });
          }
          continue;
        }

        if (ligne.startsWith('-qs-')) {
          result.openQuestions.push(ligne.replace('-qs-', '').trim() || 'Question ouverte');
          continue;
        }

        if (ligne.startsWith('-r-')) {
          var retenirText = ligne.replace('-r-', '').trim();
          if (retenirText) {
            var mots = retenirText.split(',').map(function(m) { return m.trim(); });
            result.retenir = mots.filter(function(m) { return m.length > 0; });
          }
          continue;
        }

        if (ligne.startsWith('-i-')) {
          continue;
        }
      }

      if (quizCourant && quizCourant.reponses.length > 0) {
        result.quizs.push(quizCourant);
      }

      return result;
    }

    // ============================================================
    // PRÉPARER LES SLIDES
    // ============================================================
    function preparerSlides(post) {
      var slides = [];
      var contenu = post.contenu || '';
      var parsed = parserContenu(contenu);

      parsed.slides.forEach(function(s) {
        slides.push({ type: 'slide', contenu: s.contenu });
      });

      parsed.quizs.forEach(function(q) {
        slides.push({ type: 'quiz', question: q.question, reponses: q.reponses, index: slides.length });
      });

      parsed.openQuestions.forEach(function(q) {
        slides.push({ type: 'open', question: q, index: slides.length });
      });

      if (parsed.retenir && parsed.retenir.length > 0) {
        slides.push({ type: 'retenir', mots: parsed.retenir });
      }

      etat.slides = slides;
    }

    // ============================================================
    // AFFICHER LES SLIDES
    // ============================================================
    function afficherSlides() {
      var container = document.getElementById('slidesContainer');
      var post = etat.post;

      document.getElementById('metaTitre').textContent = post.titre || 'Sans titre';
      document.getElementById('metaCategorie').textContent = post.categorie || 'Sans catégorie';
      document.getElementById('metaNiveau').textContent = 'Niveau ' + (post.niveau || 0);

      if (etat.slides.length === 0) {
        container.innerHTML = '<div class="lecture-error"><div class="icone">📖</div><h2>Aucun contenu</h2><p>Ce texte ne contient aucune slide.</p></div>';
        return;
      }

      var html = '';

      etat.slides.forEach(function(slide, index) {
        var activeClass = index === 0 ? ' active' : '';
        html += '<div class="slide-wrapper' + activeClass + '" data-index="' + index + '" id="slide-' + index + '">';
        html += '<div class="slide-content';

        if (slide.type === 'quiz') html += ' quiz-content';
        else if (slide.type === 'open') html += ' open-content';
        else if (slide.type === 'retenir') html += ' retenir-content';

        html += '">';

        if (slide.type === 'slide') {
          var paragraphs = (slide.contenu || '').split('\n').filter(function(p) { return p.trim() !== ''; });
          html += paragraphs.map(function(p) { return '<p>' + p.trim() + '</p>'; }).join('');
        }

        if (slide.type === 'quiz') {
          html += '<div class="quiz-question">' + (slide.question || 'Question') + '</div>';
          html += '<div class="quiz-reponses" data-quiz-index="' + slide.index + '">';
          var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];
          slide.reponses.forEach(function(rep, ri) {
            html += '<div class="quiz-reponse" data-reponse-index="' + ri + '" onclick="selectionnerReponse(event, ' + slide.index + ', ' + ri + ')">';
            html += '<span class="lettre">' + lettres[ri] + '</span>';
            html += '<span>' + (rep.texte || 'Réponse vide') + '</span>';
            html += '<span class="result-icon"></span>';
            html += '</div>';
          });
          html += '</div>';
          html += '<div class="quiz-feedback" id="quizFeedback-' + slide.index + '">';
          html += '<div class="bonne-reponse" id="quizBonneReponse-' + slide.index + '"></div>';
          html += '</div>';
          html += '<button class="btn-continuer" id="btnContinuer-' + slide.index + '" onclick="slideSuivante()">Continuer →</button>';
        }

        if (slide.type === 'open') {
          html += '<div class="open-question-text">' + (slide.question || 'Question ouverte') + '</div>';
          html += '<textarea id="openReponse-' + slide.index + '" placeholder="Écrivez votre réponse ici..."></textarea>';
          html += '<button class="btn-envoyer-reponse" onclick="envoyerReponseOuverte(event, ' + slide.index + ')">Envoyer la réponse</button>';
          html += '<div class="reponse-confirmation" id="openConfirmation-' + slide.index + '">✓ Réponse enregistrée</div>';
        }

        if (slide.type === 'retenir') {
          html += '<div class="retenir-label">📌 À retenir</div>';
          html += '<div class="retenir-mots">';
          slide.mots.forEach(function(mot) {
            if (mot.trim()) html += '<span class="retenir-mot">' + mot.trim() + '</span>';
          });
          html += '</div>';
          html += '<p style="font-family:Inter,sans-serif;font-size:14px;color:#6b6b6b;margin-top:8px;">Ces mots-clés vous aideront à mémoriser l\'essentiel.</p>';
          html += '<button class="btn-fermer-slide" onclick="fermerLiseuse()">Fermer</button>';
        }

        html += '</div>';
        html += '</div>';
      });

      // Pagination
      html += '<div class="pagination" id="pagination">1 / ' + etat.slides.length + '</div>';

      container.innerHTML = html;

      // ===== GESTION DU CLIC SUR LE CONTAINER =====
      container.addEventListener('click', function(e) {
        // Ignorer si on clique sur un élément interactif
        var target = e.target;
        if (target.closest('.quiz-reponse') ||
            target.closest('.btn-continuer') ||
            target.closest('.btn-envoyer-reponse') ||
            target.closest('textarea') ||
            target.closest('.btn-fermer-slide') ||
            target.closest('.annotation-container')) {
          return;
        }

        // Bord gauche = précédent (20% de l'écran)
        var rect = container.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var width = rect.width;

        if (x < width * 0.2) {
          slidePrecedente();
        } else {
          slideSuivante();
        }
      });

      // ===== GESTION DU SCROLL =====
      var scrollTimeout = null;
      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        if (scrollTimeout) return;
        scrollTimeout = setTimeout(function() { scrollTimeout = null; }, 600);

        if (e.deltaY > 0) {
          slideSuivante();
        } else {
          slidePrecedente();
        }
      }, { passive: false });

      // ===== GESTION DU CLAVIER =====
      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          slideSuivante();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          slidePrecedente();
        }
      });

      document.getElementById('btnFermer').addEventListener('click', function() {
        fermerLiseuse();
      });

      // ===== ANNOTATION =====
      document.getElementById('annotationToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        toggleAnnotation();
      });

      // Sauvegarde auto des annotations
      var annotationTextarea = document.getElementById('annotationTextarea');
      var saveTimeout = null;
      annotationTextarea.addEventListener('input', function() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(function() {
          sauvegarderAnnotation();
        }, 800);
      });

      // Empêcher la propagation du clic sur la zone annotation
      document.querySelector('.annotation-container').addEventListener('click', function(e) {
        e.stopPropagation();
      });

      recupererStatutExistant();
      mettreAJourPagination();
      mettreAJourAnnotation();
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function slideSuivante() {
      if (etat.enTransition) return;
      if (etat.currentIndex >= etat.slides.length - 1) return;

      var slide = etat.slides[etat.currentIndex];
      if (slide.type === 'quiz') {
        var reponse = etat.reponsesQuiz[slide.index];
        if (!reponse) return;
        var btn = document.getElementById('btnContinuer-' + slide.index);
        if (!btn || !btn.classList.contains('visible')) return;
      }

      etat.enTransition = true;
      var current = document.getElementById('slide-' + etat.currentIndex);
      var next = document.getElementById('slide-' + (etat.currentIndex + 1));

      if (current) current.classList.remove('active');
      if (next) next.classList.add('active');

      etat.currentIndex++;
      mettreAJourPagination();
      mettreAJourAnnotation();

      setTimeout(function() {
        etat.enTransition = false;
      }, 600);
    }

    function slidePrecedente() {
      if (etat.enTransition) return;
      if (etat.currentIndex <= 0) return;

      etat.enTransition = true;
      var current = document.getElementById('slide-' + etat.currentIndex);
      var prev = document.getElementById('slide-' + (etat.currentIndex - 1));

      if (current) current.classList.remove('active');
      if (prev) prev.classList.add('active');

      etat.currentIndex--;
      mettreAJourPagination();
      mettreAJourAnnotation();

      setTimeout(function() {
        etat.enTransition = false;
      }, 600);
    }

    function mettreAJourPagination() {
      var pagination = document.getElementById('pagination');
      if (pagination) {
        pagination.textContent = (etat.currentIndex + 1) + ' / ' + etat.slides.length;
      }
    }

    // ============================================================
    // QUIZ
    // ============================================================
    function selectionnerReponse(event, quizIndex, reponseIndex) {
      event.stopPropagation();

      var slide = etat.slides.find(function(s) { return s.type === 'quiz' && s.index === quizIndex; });
      if (!slide) return;
      if (etat.reponsesQuiz[quizIndex]) return;

      var slideEl = document.getElementById('slide-' + etat.slides.indexOf(slide));
      if (!slideEl) return;

      var reponses = slideEl.querySelectorAll('.quiz-reponse');
      var reponse = slide.reponses[reponseIndex];

      reponses.forEach(function(el, idx) {
        el.classList.remove('selectionnee');
        if (idx === reponseIndex) el.classList.add('selectionnee');
      });

      etat.reponsesQuiz[quizIndex] = { reponseIndex: reponseIndex, correct: reponse.correct };

      setTimeout(function() {
        afficherFeedbackQuiz(quizIndex);
      }, 300);
    }

    function afficherFeedbackQuiz(quizIndex) {
      var slide = etat.slides.find(function(s) { return s.type === 'quiz' && s.index === quizIndex; });
      if (!slide) return;

      var reponseData = etat.reponsesQuiz[quizIndex];
      if (!reponseData) return;

      var slideEl = document.getElementById('slide-' + etat.slides.indexOf(slide));
      if (!slideEl) return;

      var reponses = slideEl.querySelectorAll('.quiz-reponse');
      var feedback = document.getElementById('quizFeedback-' + quizIndex);
      var bonneReponse = document.getElementById('quizBonneReponse-' + quizIndex);
      var btnContinuer = document.getElementById('btnContinuer-' + quizIndex);

      reponses.forEach(function(el, idx) {
        el.classList.remove('correcte', 'incorrecte');
        var icon = el.querySelector('.result-icon');
        if (idx === reponseData.reponseIndex) {
          if (reponseData.correct) { el.classList.add('correcte'); icon.textContent = '✓'; }
          else { el.classList.add('incorrecte'); icon.textContent = '✗'; }
        } else if (slide.reponses[idx] && slide.reponses[idx].correct) {
          el.classList.add('correcte');
          icon.textContent = '✓';
        } else {
          icon.textContent = '';
        }
      });

      if (reponseData.correct) {
        bonneReponse.textContent = '✅ Bonne réponse !';
        bonneReponse.className = 'bonne-reponse';
      } else {
        var bonne = slide.reponses.find(function(r) { return r.correct; });
        bonneReponse.textContent = '❌ La bonne réponse était : "' + (bonne ? bonne.texte : '—') + '"';
        bonneReponse.className = 'mauvaise-reponse';
      }

      feedback.classList.add('visible');

      setTimeout(function() {
        btnContinuer.classList.add('visible');
      }, 400);

      verifierQuizComplets();
    }

    function verifierQuizComplets() {
      var quizSlides = etat.slides.filter(function(s) { return s.type === 'quiz'; });
      var tousRepondus = quizSlides.every(function(q) {
        return etat.reponsesQuiz[q.index] !== undefined;
      });

      if (!tousRepondus) return;

      var totalBonnes = 0, totalQuestions = 0;
      quizSlides.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) { totalQuestions++; if (rep.correct) totalBonnes++; }
      });

      etat.totalBonnes = totalBonnes;
      etat.totalQuestions = totalQuestions;

      var seuil = Math.ceil(totalQuestions / 2);
      etat.statutFinal = (totalQuestions > 0 && totalBonnes >= seuil) ? 'valide' : 'non-valide';
      if (totalQuestions === 0) etat.statutFinal = 'en-attente';

      mettreAJourBadge();
      sauvegarderQuiz();
    }

    function mettreAJourBadge() {
      var badge = document.getElementById('badgeStatut');
      if (etat.statutFinal === 'valide') { badge.textContent = '✅ Validé'; badge.className = 'badge-statut valide'; }
      else if (etat.statutFinal === 'non-valide') { badge.textContent = '📖 À relire'; badge.className = 'badge-statut non-valide'; }
      else { badge.textContent = '⏳ En cours'; badge.className = 'badge-statut en-attente'; }
    }

    function sauvegarderQuiz() {
      if (!etat.postId) return;
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var choixQcm = '';
      var quizSlides = etat.slides.filter(function(s) { return s.type === 'quiz'; });
      quizSlides.forEach(function(q) {
        var rep = etat.reponsesQuiz[q.index];
        if (rep) {
          if (choixQcm) choixQcm += '|';
          choixQcm += (rep.correct ? 'V' : 'F') + ':' + (rep.reponseIndex + 1);
        }
      });

      var url = SCRIPT_URL + '?action=saveQuiz' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&titre=' + encodeURIComponent(etat.post.titre || 'Quiz') +
        '&choixQcm=' + encodeURIComponent(choixQcm) +
        '&bonnes=' + encodeURIComponent(etat.totalBonnes) +
        '&total=' + encodeURIComponent(etat.totalQuestions);

      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        if (data.success) console.log('✅ Quiz sauvegardé');
      }).catch(function(e) { console.error('Erreur sauvegarde:', e); });
    }

    // ============================================================
    // QUESTION OUVERTE
    // ============================================================
    function envoyerReponseOuverte(event, index) {
      if (event) event.stopPropagation();

      var textarea = document.getElementById('openReponse-' + index);
      if (!textarea) return;
      var reponse = textarea.value.trim();
      if (!reponse) { alert('Veuillez écrire une réponse.'); return; }

      var btn = textarea.parentElement.querySelector('.btn-envoyer-reponse');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveReponseOuverte' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&reponseOuverte=' + encodeURIComponent(reponse);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var confirmation = document.getElementById('openConfirmation-' + index);
          if (data.success) {
            confirmation.classList.add('visible');
            textarea.disabled = true;
            btn.textContent = '✓ Envoyé';
          } else {
            alert('Erreur : ' + (data.message || 'Impossible d\'envoyer.'));
            btn.disabled = false;
            btn.textContent = 'Envoyer la réponse';
          }
        })
        .catch(function(e) {
          alert('Erreur réseau.');
          btn.disabled = false;
          btn.textContent = 'Envoyer la réponse';
        });
    }

    // ============================================================
    // ANNOTATIONS
    // ============================================================
    function toggleAnnotation() {
      etat.annotationOpen = !etat.annotationOpen;
      var box = document.getElementById('annotationBox');
      if (etat.annotationOpen) {
        box.classList.add('open');
        document.getElementById('annotationTextarea').focus();
        chargerAnnotationSlide();
      } else {
        box.classList.remove('open');
        sauvegarderAnnotation();
      }
    }

    function chargerAnnotationSlide() {
      var key = etat.postId + '_' + etat.currentIndex;
      var annotation = etat.annotations[key] || '';
      document.getElementById('annotationTextarea').value = annotation;
    }

    function mettreAJourAnnotation() {
      var dot = document.getElementById('annotationDot');
      var key = etat.postId + '_' + etat.currentIndex;
      if (etat.annotations[key] && etat.annotations[key].trim() !== '') {
        dot.className = 'dot-save saved';
      } else {
        dot.className = 'dot-save';
      }
    }

    function sauvegarderAnnotation() {
      var textarea = document.getElementById('annotationTextarea');
      var note = textarea.value.trim();
      var key = etat.postId + '_' + etat.currentIndex;

      if (note === '' && !etat.annotations[key]) return;

      etat.annotations[key] = note;

      var dot = document.getElementById('annotationDot');
      dot.className = 'dot-save saving';

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=saveAnnotation' +
        '&nom=' + encodeURIComponent(nom) +
        '&articleId=' + encodeURIComponent(etat.postId) +
        '&slideIndex=' + encodeURIComponent(etat.currentIndex) +
        '&annotation=' + encodeURIComponent(note);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            dot.className = 'dot-save saved';
            console.log('✅ Annotation sauvegardée');
          } else {
            dot.className = 'dot-save';
            console.error('Erreur sauvegarde annotation');
          }
        })
        .catch(function(e) {
          dot.className = 'dot-save';
          console.error('Erreur:', e);
        });
    }

    function chargerAnnotations() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var url = SCRIPT_URL + '?action=getAnnotations&nom=' + encodeURIComponent(nom) + '&articleId=' + encodeURIComponent(etat.postId);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.annotations) {
            data.annotations.forEach(function(a) {
              var key = etat.postId + '_' + a.slideIndex;
              etat.annotations[key] = a.annotation || '';
            });
            mettreAJourAnnotation();
          }
        })
        .catch(function(e) { console.error('Erreur chargement annotations:', e); });
    }

    // ============================================================
    // UTILITAIRES
    // ============================================================
    function recupererStatutExistant() {
      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      fetch(SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(nom))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success && data.reponses) {
            var reponse = data.reponses.find(function(r) { return r.articleId === etat.postId; });
            if (reponse && reponse.bonnes > 0 && reponse.total > 0) {
              var seuil = Math.ceil(reponse.total / 2);
              if (reponse.bonnes >= seuil) {
                etat.statutFinal = 'valide';
                etat.totalBonnes = reponse.bonnes;
                etat.totalQuestions = reponse.total;
                mettreAJourBadge();
              }
            }
          }
        })
        .catch(function(e) { console.error('Erreur récupération statut:', e); });
    }

    function fermerLiseuse() {
      window.location.href = '/medit/mes-textes.html';
    }

    function afficherErreur(message) {
      document.getElementById('slidesContainer').innerHTML = `
        <div class="lecture-error">
          <div class="icone">📖</div>
          <h2>Texte introuvable</h2>
          <p>${message || 'Le texte n\'existe pas.'}</p>
          <a href="/medit/mes-textes.html" class="btn-retour">← Retour</a>
        </div>
      `;
    }

    window.selectionnerReponse = selectionnerReponse;
    window.envoyerReponseOuverte = envoyerReponseOuverte;
    window.slideSuivante = slideSuivante;
    window.slidePrecedente = slidePrecedente;
    window.fermerLiseuse = fermerLiseuse;
  </script>

</body>
</html>
