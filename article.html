<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f0e9" />
  <title>Méditation islamique</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>۞</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/style.css" />
  <link rel="stylesheet" href="/medit/article.css" />
  <link rel="stylesheet" href="/medit/font/qcf4.css" />
  <link rel="stylesheet" href="/medit/lecture-mode.css" />
  <style>
    .qcf4-text {
      font-family: 'QCF4_Hafs_02', sans-serif;
      font-size: 30px;
      line-height: 1.8;
      direction: rtl;
    }

    .action-bas {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0 8px;
      border-top: 1px solid #d1ccc4;
      margin-top: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-terminer {
      padding: 10px 32px;
      background: transparent;
      color: #2c2c2c;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
    }

    .btn-terminer:hover {
      background: #e8e5e0;
    }

    .btn-terminer:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-terminer.lu {
      background: #d1ccc4;
    }

    .message-lu {
      font-size: 13px;
      color: #6b7a8a;
    }

    .btn-partager-bas {
      padding: 8px 20px;
      background: transparent;
      color: #6b7a8a;
      border: 1px solid #d1ccc4;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', sans-serif;
    }

    .btn-partager-bas:hover {
      background: #e8e5e0;
      color: #2c2c2c;
    }

    @media (max-width: 640px) {
      .action-bas {
        flex-direction: column;
        gap: 8px;
      }
      .btn-terminer {
        width: 100%;
        text-align: center;
      }
      .btn-partager-bas {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div id="header-container"></div>

  <script>
    // Chargement du header
    fetch('/medit/header.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement header:', error);
      });
  </script>

  <!-- ========== PAGE ARTICLE ========== -->
  <div class="page-article">

    <div class="blog-article" id="contenu-principal">

      <!-- ========== RETOUR ========== -->
      <a href="/medit/mes-textes.html" class="btn-retour" aria-label="Retour">←</a>

      <!-- ========== CONTENU SCROLLABLE ========== -->
      <div class="article-content">

        <div class="loader" id="loader">
          <div class="spinner"></div>
          <p>Chargement...</p>
        </div>

        <div class="erreur-article" id="erreur" style="display:none;">
          <h2>Méditation introuvable</h2>
          <p>Cette méditation n'existe pas ou a été déplacée.</p>
          <a href="/medit/mes-textes.html" style="margin-top:12px;display:inline-block;padding:10px 24px;background:#2d6a4f;color:#fff;border-radius:30px;font-weight:500;font-family:'Lora','Georgia',serif;">Voir toutes</a>
        </div>

        <div id="article-charge" style="display:none; width:100%;">

          <span class="post-label" id="postLabel">Méditation</span>
          
          <!-- ========== TITRE ========== -->
          <h1 id="article-titre">Titre</h1>

          <!-- ========== CONTENU DES SLIDES ========== -->
          <div class="paragraphe-container">
            <div class="paragraphe-wrapper" id="slideWrapper"></div>
          </div>

          <!-- ========== COMPTEUR + STYLO ========== -->
          <div class="compteur-bloc">
            <span class="compteur" id="compteur">1 / 1</span>
            <button class="btn-annotate" id="btnAnnotate" title="Annoter cette slide">
              <span id="annotateIcon">✎𓂃</span>
            </button>
            <span class="lock-message" id="lockMessage"></span>
          </div>

          <!-- ========== QUIZ ========== -->
          <div class="paragraphe-item" id="slideQuiz" style="display: none;">
            <div class="quiz-container" id="quizContent">
              <h3>Quiz</h3>
              <div id="quizQuestionsContainer"></div>
              <div id="quiz-result">
                <p><strong>Score :</strong> <span id="quiz-score">0</span> / <span id="quiz-total">0</span></p>
                <p id="quiz-message"></p>
              </div>
            </div>

            <div id="openQuestion">
              <h3>Question ouverte</h3>
              <h4 id="questionOuverteTexte">Qu'est-ce que cette méditation vous a inspiré ?</h4>
              <p>
                <label>Votre réponse :<br />
                  <textarea id="reponse-mailto" placeholder="Écrivez ici votre réponse..." rows="3"></textarea>
                </label>
              </p>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                <button class="btn-nav" onclick="validerReponse()">Enregistrer</button>
              </div>
              <div id="form-message-mailto" style="margin-top:6px;"></div>
            </div>
          </div>

          <!-- ========== ACTION BAS : MARQUER LU + PARTAGER ========== -->
          <div class="action-bas" id="actionBas">
            <button class="btn-terminer" id="btnTerminer" onclick="marquerLu()">
              ✓ Marquer comme lu
            </button>
            <span class="message-lu" id="messageLu"></span>
            <button class="btn-partager-bas" onclick="partager()">🔗 Partager</button>
          </div>

        </div>
      </div>

      <!-- ========== PIED DE CARTE ========== -->
      <div class="post-footer">
        <span class="post-meta">qiraat.fr · Sir Khan · <span id="postDate"></span></span>
      </div>

    </div>

    <!-- ========== POINTS (DOTS) ========== -->
    <div id="dotsContainerOutside" class="dots-container-outside"></div>

  </div>

  <!-- Popup d'annotation -->
  <div class="annotate-popup" id="annotatePopup">
    <div class="annotate-header">
      <span>📝 Note sur la slide <span id="annotateSlideNum">1</span></span>
      <button class="annotate-close" id="annotateClose">✓</button>
    </div>
    <textarea id="annotateTextarea" placeholder="Écris ta réflexion, une question, ce que tu retiens..." rows="4"></textarea>
    <div class="annotate-footer">
      <span class="annotate-auto-save">💾 Sauvegarde automatique</span>
      <span class="annotate-status" id="annotateStatus"></span>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = '';
      });
  </script>

  <script>
    // ============================================================
    // PARTAGE NATIF
    // ============================================================
    function partager() {
      var url = window.location.href;
      var titre = document.querySelector('h1')?.textContent || 'Méditation';

      if (navigator.share) {
        navigator.share({
          title: titre,
          text: '📖 ' + titre + ' — sur Qiraat',
          url: url
        }).catch(function() {});
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() {
            alert('🔗 Lien copié !');
          }).catch(function() {});
        } else {
          var input = document.createElement('input');
          input.value = url;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          alert('🔗 Lien copié !');
        }
      }
    }
  </script>

  <script>
    // ============================================================
    // MARQUER COMME LU (sans QCM ni question)
    // ============================================================
    function marquerLu() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        alert('Veuillez vous connecter');
        return;
      }

      var articleId = new URLSearchParams(window.location.search).get('id');
      var titre = document.getElementById('article-titre')?.textContent || 'Lecture';

      var btn = document.getElementById('btnTerminer');
      var msg = document.getElementById('messageLu');

      btn.disabled = true;
      btn.textContent = '...';
      msg.textContent = '';

      var url = CONFIG.SCRIPT_URL + '?action=saveLecture' +
        '&nom=' + encodeURIComponent(id) +
        '&articleId=' + encodeURIComponent(articleId) +
        '&titre=' + encodeURIComponent(titre);

      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            btn.textContent = '✅ Lu ✓';
            btn.classList.add('lu');
            btn.disabled = true;
            msg.textContent = '✅ Enregistré dans "Lus"';
            DataManager.invalider();
          } else {
            btn.textContent = '✓ Marquer comme lu';
            btn.disabled = false;
            msg.textContent = '❌ Erreur: ' + (data.message || '');
          }
        })
        .catch(function() {
          btn.textContent = '✓ Marquer comme lu';
          btn.disabled = false;
          msg.textContent = '❌ Erreur de connexion';
        });
    }

    // ============================================================
    // VÉRIFIER SI DÉJÀ LU
    // ============================================================
    function verifierDejaLu() {
      var articleId = new URLSearchParams(window.location.search).get('id');
      if (!articleId) return;

      // Attendre que DataManager soit chargé
      setTimeout(function() {
        var reponses = DataManager.getReponses();
        for (var i = 0; i < reponses.length; i++) {
          if (reponses[i].articleId === articleId) {
            var total = parseInt(reponses[i].total) || 0;
            var bonnes = parseInt(reponses[i].bonnes) || 0;
            
            // Si déjà validé (quiz ou lecture)
            if (total === 1 && bonnes === 1) {
              var btn = document.getElementById('btnTerminer');
              if (btn) {
                btn.textContent = '✅ Lu ✓';
                btn.classList.add('lu');
                btn.disabled = true;
              }
              document.getElementById('messageLu').textContent = '✅ Déjà enregistré dans "Lus"';
              return true;
            }
          }
        }
        return false;
      }, 500);
    }
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/article.js"></script>
  <script src="/medit/lecture-mode.js"></script>

  <script>
    // ============================================================
    // INIT : CHARGER + VÉRIFIER SI DÉJÀ LU
    // ============================================================
    // On attend que article.js ait fini de charger l'article
    document.addEventListener('DOMContentLoaded', function() {
      // Vérifier après le chargement de l'article
      var observer = new MutationObserver(function() {
        if (document.getElementById('article-charge').style.display !== 'none') {
          verifierDejaLu();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('article-charge'), {
        attributes: true,
        attributeFilter: ['style']
      });
    });
  </script>

</body>
</html>
