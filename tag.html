<!-- tag.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Tag - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <style>
    .page-blog {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    .page-blog h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .page-blog .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    .page-blog .grille-themes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stats-ligne {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat-item .nombre {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== CARTE BLOG (identique à textes.html) ===== */
    .carte-blog {
      display: flex;
      gap: 20px;
      padding: 18px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
    }

    .carte-blog:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .carte-blog .blog-numero {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-muted);
      border-right: 1px solid var(--border);
      padding-right: 14px;
      box-sizing: border-box;
    }

    .carte-blog .blog-corps {
      flex: 1;
      min-width: 0;
    }

    .carte-blog .blog-titre {
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .carte-blog .blog-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .carte-blog .blog-meta .badge-icone,
    .carte-blog .blog-meta .niveau-badge,
    .carte-blog .blog-meta .mots {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .carte-blog .blog-extrait {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .carte-blog .blog-categorie {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .carte-blog .blog-date {
      flex: 0 0 auto;
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
      box-sizing: border-box;
    }

    .carte-blog .blog-date .date-label {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .carte-blog .blog-date .date-validation {
      color: var(--text);
    }

    .vide-tags {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .vide-tags .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .page-blog { padding: 12px 16px 30px; }
      .page-blog h1 { font-size: 22px; }

      .carte-blog {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
      }

      .carte-blog .blog-numero {
        flex: 0 0 36px;
        font-size: 18px;
        padding-right: 10px;
      }

      .carte-blog .blog-date {
        flex: 1 0 100%;
        text-align: left;
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 8px;
        flex-direction: row;
        gap: 8px;
      }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-blog">

    <h1 id="titreTag">Tag</h1>
    <p class="sous-titre-page">Textes associés à ce tag. Cliquez sur un texte pour le lire.</p>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item">
        <span>Textes trouvés :</span>
        <span class="nombre" id="totalTextes">0</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des textes...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ===== UTILITAIRES (identiques à textes.html) =====
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extraireNumeroTexte(titre) {
      if (!titre) return Infinity;
      var match = titre.match(/^\s*(\d+)\s+/);
      return match ? parseInt(match[1], 10) : Infinity;
    }

    function extraireTitreSansNumero(titre) {
      if (!titre) return '';
      return titre.replace(/^\s*\d+\s+/, '').trim();
    }

    function formatDateRelative(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      var maintenant = new Date();
      var diffMs = maintenant - d;
      var diffJours = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      if (diffJours < 0) diffJours = 0;
      if (diffJours === 0) return "Aujourd'hui";
      if (diffJours === 1) return 'Hier';
      if (diffJours < 7) return 'Il y a ' + diffJours + ' jours';
      if (diffJours < 30) return 'Il y a ' + Math.floor(diffJours / 7) + ' sem.';
      if (diffJours < 365) return 'Il y a ' + Math.floor(diffJours / 30) + ' mois';
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function formatDateComplete(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function normaliserTag(t) {
      return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    // ===== CARTE BLOG (copiée de textes.html) =====
    function construireCarteBlog(texte, toutesLesReponses) {
      var numero = extraireNumeroTexte(texte.titre);
      var titreAffiche = extraireTitreSansNumero(texte.titre);
      var categorie = (texte.categorie || 'Sans catégorie').trim();
      var mots = texte.mots || 0;

      var reponse = toutesLesReponses[texte.id];
      var estValide = reponse && reponse.valide === 'valide';
      var dateValidation = reponse && reponse.date ? reponse.date : '';
      var dateAjout = texte.date || '';

      var TYPES_EXERCICES = [
        { prefix: 'quiz:',   label: 'QCM' },
        { prefix: 'open:',   label: 'Ouverte' },
        { prefix: 'ordre:',  label: 'Ordre' },
        { prefix: 'carte:',  label: 'Carte' },
        { prefix: 'relier:', label: 'Relier' },
        { prefix: 'tt:',     label: 'Trous' },
        { prefix: 'vf:',     label: 'VF' },
        { prefix: 'copier:', label: 'Copier' }
      ];

      var ordreBlocs = texte.ordreBlocs || [];
      var detailParts = [];
      var nbExercices = 0;

      if (ordreBlocs.length > 0) {
        TYPES_EXERCICES.forEach(function(type) {
          var count = 0;
          ordreBlocs.forEach(function(ob) {
            if (ob.indexOf(type.prefix) === 0) count++;
          });
          if (count > 0) {
            nbExercices++;
            detailParts.push(count + ' ' + type.label);
          }
        });
      } else {
        if (texte.hasQuiz)     { nbExercices++; detailParts.push('1 QCM'); }
        if (texte.hasQuestion) { nbExercices++; detailParts.push('1 Ouverte'); }
      }

      var detailExercices = detailParts.join(' · ');
      var extrait = texte.description || texte.extrait || '';
      if (extrait.length > 200) extrait = extrait.substring(0, 200) + '…';

      var dateLabelHtml = '';
      var dateHtml = '';

      if (estValide && dateValidation) {
        dateLabelHtml = '<span class="date-label">Fait :</span>';
        dateHtml = '<span class="date-validation">' + formatDateComplete(dateValidation) + '</span>';
      } else if (dateAjout) {
        dateHtml = '<span class="date-validation">' + formatDateRelative(dateAjout) + '</span>';
      }

      var numeroHtml = (numero !== Infinity)
        ? '<div class="blog-numero">' + numero + '</div>'
        : '<div class="blog-numero">◆</div>';

      return `
        <div class="carte-blog"
             onclick="window.location.href='/medit/texte.html?id=${encodeURIComponent(texte.id)}'">
          ${numeroHtml}
          <div class="blog-corps">
            <div class="blog-titre">${escapeHtml(titreAffiche)}</div>
            <div class="blog-meta">
              <span class="niveau-badge">Niveau ${texte.niveau}</span>
              ${nbExercices > 0 ? '<span class="badge-icone">Nbr exercices : ' + nbExercices + '</span>' : ''}
              ${detailExercices ? '<span class="badge-icone">' + detailExercices + '</span>' : ''}
              ${mots > 0 ? '<span class="mots">' + mots + ' mots</span>' : ''}
            </div>
            ${extrait ? '<div class="blog-extrait">' + escapeHtml(extrait) + '</div>' : ''}
            <span class="blog-categorie">${escapeHtml(categorie)}</span>
          </div>
          <div class="blog-date">
            ${dateLabelHtml}
            ${dateHtml}
          </div>
        </div>
      `;
    }

    // ===== CHARGEMENT =====
    function chargerTag() {
      var params = new URLSearchParams(window.location.search);
      var tag = (params.get('tag') || '').trim();
      var conteneur = document.getElementById('contenu');

      if (!tag) {
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        conteneur.innerHTML = `
          <div class="vide-tags">
            <span class="icone">◈</span>
            <h2>Aucun tag spécifié</h2>
            <p><a href="/medit/tags.html" style="color:var(--text-secondary);">Voir tous les tags</a></p>
          </div>
        `;
        return;
      }

      document.getElementById('titreTag').textContent = 'Textes tagués « #' + tag + ' »';
      document.title = '#' + tag + ' - Qiraat';

      var id = (typeof getIdUtilisateur === 'function')
        ? getIdUtilisateur()
        : (localStorage.getItem('etudiant_id') || 'invite');

      DataManager.charger()
        .then(function(data) {
          var textes = data.tousLesTextes || data.textes || [];
          var reponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) { reponses[r.texteId] = r; });
          }
          afficherTextes(textes, reponses, tag);
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            var textes = cache.tousLesTextes || cache.textes || [];
            var reponses = {};
            if (cache.reponses) {
              cache.reponses.forEach(function(r) { reponses[r.texteId] = r; });
            }
            afficherTextes(textes, reponses, tag);
          } else {
            var loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
            conteneur.innerHTML = `
              <div class="vide-tags">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    function afficherTextes(textes, reponses, tag) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';

      var cible = normaliserTag(tag);

      var trouves = textes.filter(function(t) {
        var liste = t.tags || [];
        return liste.some(function(x) { return normaliserTag(x) === cible; });
      });

      // Tri par date DESC (comme textes.html)
      trouves.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        if (da !== db) return db - da;
        return extraireNumeroTexte(b.titre) - extraireNumeroTexte(a.titre);
      });

      document.getElementById('totalTextes').textContent = trouves.length;

      var container = document.getElementById('contenu');

      if (trouves.length === 0) {
        container.innerHTML = `
          <div class="vide-tags">
            <span class="icone">◈</span>
            <h2>Aucun texte ne porte ce tag</h2>
            <p><a href="/medit/tags.html" style="color:var(--text-secondary);">Voir tous les tags</a></p>
          </div>
        `;
        return;
      }

      var html = '<div class="grille-themes">';
      trouves.forEach(function(texte) {
        html += construireCarteBlog(texte, reponses);
      });
      html += '</div>';

      container.innerHTML = html;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerTag);
    } else {
      chargerTag();
    }
  </script>

</body>
</html>
