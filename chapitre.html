  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var chapitreActuel = null;
    var chapitresData = [];
    var imagesLivret = {};
    var livretsData = {};

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';
      return avant + spanSource + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateMoisAnnee(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        var mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        return mois[d.getMonth()] + ' ' + d.getFullYear();
      } catch(e) { return ''; }
    }

    function initialeTheme(nom) {
      if (!nom) return '?';
      var premier = nom.trim().charAt(0).toUpperCase();
      return premier || '?';
    }

    // ============================================================
    // TROUVER UN CHAPITRE
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // PARSERS D'EXERCICES
    // ============================================================
    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) {
            quizs.push(currentQuiz);
          }
          currentQuiz = {
            question: ligne.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          if (texteRep) {
            currentQuiz.reponses.push({
              texte: texteRep || 'Réponse',
              lettre: lettres[currentQuiz.reponses.length] || '?'
            });
          }
        }
      }

      if (currentQuiz && currentQuiz.reponses.length > 0) {
        quizs.push(currentQuiz);
      }
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      var consigne = 'Remettre dans l\'ordre';

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push(match[2]);
        } else if (elements.length === 0 && ligne.length > 0) {
          consigne = ligne.replace(/^o:\s*/i, '').trim() || consigne;
        }
      }
      return { elements: elements, consigne: consigne };
    }

    function parserCartesPourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var cartes = [];
      var current = null;

      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          if (current) cartes.push(current);
          current = { recto: l.replace(/^r:\s*/i, '').trim(), verso: '' };
        } else if (l.toLowerCase().startsWith('v:') && current) {
          current.verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (current) cartes.push(current);
      return cartes;
    }

    function parserRelierPourImpression(relierTexte) {
      var lignes = relierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });

      if (lignes.length === 0) return null;

      var consigne = lignes[0].replace(/^l:\s*/i, '').trim() || 'Relie les éléments';
      var paires = [];

      for (var i = 1; i < lignes.length; i++) {
        var idx = lignes[i].indexOf('-');
        if (idx === -1) continue;
        var gauche = lignes[i].substring(0, idx).trim();
        var droite = lignes[i].substring(idx + 1).trim();
        if (gauche && droite) {
          paires.push({ gauche: gauche, droite: droite });
        }
      }

      if (paires.length === 0) return null;

      var compteParDroite = {};
      paires.forEach(function(p) {
        compteParDroite[p.droite] = (compteParDroite[p.droite] || 0) + 1;
      });

      var droitesUniques = [];
      var dejaVues = {};
      paires.forEach(function(p) {
        if (!dejaVues[p.droite]) {
          dejaVues[p.droite] = true;
          droitesUniques.push({
            droite: p.droite,
            partagee: compteParDroite[p.droite] > 1
          });
        }
      });

      for (var j = droitesUniques.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = droitesUniques[j];
        droitesUniques[j] = droitesUniques[k];
        droitesUniques[k] = tmp;
      }

      return { consigne: consigne, paires: paires, droitesMelangees: droitesUniques };
    }

    function parserTextesTrousPourImpression(ttTexte) {
      var lignes = ttTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var resultats = [];

      lignes.forEach(function(ligne) {
        if (!/^tt:/i.test(ligne)) return;
        var contenu = ligne.replace(/^tt:\s*/i, '').trim();
        var match = contenu.match(/\/([^\/]+)\//);
        if (!match) return;
        var mot = match[1].trim();
        var idx = contenu.indexOf('/' + mot + '/');
        var avant = contenu.substring(0, idx).trim();
        var apres = contenu.substring(idx + mot.length + 2).trim();
        resultats.push({ avant: avant, mot: mot, apres: apres });
      });

      return resultats;
    }

    function parserVraiFauxPourImpression(vfTexte) {
      var lignes = vfTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var questions = [];

      lignes.forEach(function(ligne) {
        if (!/^vf:/i.test(ligne)) return;
        var contenu = ligne.replace(/^vf:\s*/i, '').trim();
        var match = contenu.match(/\(([vf])\)\s*$/i);
        if (!match) return;
        var question = contenu.replace(/\s*\([vf]\)\s*$/i, '').trim();
        if (question === '') return;
        questions.push(question);
      });

      return questions;
    }

    function parserCopierPourImpression(copierTexte) {
      if (!copierTexte) return [];
      var lignes = copierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });
      var blocs = [];
      lignes.forEach(function(ligne) {
        var contenu = ligne.replace(/^c:\s*/i, '').trim();
        if (!contenu) return;
        var mots = contenu.split(',')
          .map(function(m) { return m.trim(); })
          .filter(function(m) { return m !== ''; });
        if (mots.length > 0) blocs.push({ mots: mots });
      });
      return blocs;
    }

    // ============================================================
    // CONSTRUCTION DES EXERCICES
    // ============================================================
    function construireExercicesPourFeuille(blocsOrdonnes) {
      var html = '';
      var exoNum = 0;
      var hasExercice = false;

      function typeLogique(t) {
        if (t === 'carte') return 'open';
        return t;
      }

      var consignesBase = {
        quiz:   { sing: 'Cochez la bonne réponse :',  plur: 'Cochez la bonne réponse :' },
        open:   { sing: 'Répondez à la question :',   plur: 'Répondez aux questions :' },
        tt:     { sing: 'Complétez la phrase :',      plur: 'Complétez les phrases :' },
        vf:     { sing: 'Cochez Vrai ou Faux :',      plur: 'Cochez Vrai ou Faux :' },
        ordre:  { sing: 'Remettez dans l\'ordre :',   plur: 'Remettez dans l\'ordre :' },
        relier: { sing: 'Reliez les éléments :',      plur: 'Reliez les éléments :' },
        copier: { sing: 'Recopiez :',                 plur: 'Recopiez :' }
      };

      var iGroupe = 0;
      while (iGroupe < blocsOrdonnes.length) {
        var blocCourant = blocsOrdonnes[iGroupe];
        var typeCourant = typeLogique(blocCourant.type);
        if (typeCourant === 'slide') {
          iGroupe++;
          continue;
        }

        var nbConsecutifs = 1;
        var jGroupe = iGroupe + 1;
        while (jGroupe < blocsOrdonnes.length && typeLogique(blocsOrdonnes[jGroupe].type) === typeCourant) {
          nbConsecutifs++;
          jGroupe++;
        }

        if (typeCourant === 'vf') {
          nbConsecutifs = (nbConsecutifs - 1) + blocCourant.data.length;
        }

        var base = consignesBase[typeCourant];
        if (base) {
          var consigneFinale = (nbConsecutifs > 1) ? base.plur : base.sing;
          blocCourant._consigne = consigneFinale;
          for (var kGroupe = iGroupe + 1; kGroupe < jGroupe; kGroupe++) {
            blocsOrdonnes[kGroupe]._consigne = '';
          }
        }

        iGroupe = jGroupe;
      }

      function afficherConsigne(bloc) {
        if (bloc._consigne) {
          html += '<div class="consigne-exo">' + bloc._consigne + '</div>';
        }
      }

      blocsOrdonnes.forEach(function(bloc) {

        if (bloc.type === 'slide') return;

        if (bloc.type === 'copier') {
          hasExercice = true;
          exoNum++;
          var mots = bloc.data.mots;

          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">';
          html += '<div class="bloc-copier">';
          html += '<div class="copier-mots">';
          for (var cm = 0; cm < mots.length; cm++) {
            html += '<span class="copier-mot">' + mots[cm] + '</span>';
          }
          html += '</div>';
          html += '<div class="copier-ligne-pointillee"></div>';
          html += '</div>';
          html += '</span>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'quiz') {
          hasExercice = true;
          exoNum++;
          var q = bloc.data;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + q.question + '</span>';
          html += '</div>';
          html += '<div class="quiz-reponses">';
          q.reponses.forEach(function(rep) {
            html += '<span class="quiz-rep"><span class="quiz-case"></span> ' + rep.lettre + '. ' + rep.texte + '</span>';
          });
          html += '</div></div>';
          return;
        }

        if (bloc.type === 'open') {
          hasExercice = true;
          exoNum++;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + bloc.data + '</span>';
          html += '</div>';
          html += '<div class="open-lignes">';
          html += '<div class="open-ligne"></div>';
          html += '<div class="open-ligne"></div>';
          html += '<div class="open-ligne"></div>';
          html += '</div></div>';
          return;
        }

        if (bloc.type === 'tt') {
          hasExercice = true;
          exoNum++;
          var tt = bloc.data;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="tt-phrase-print">';
          if (tt.avant) html += tt.avant + ' ';
          html += '<span class="tt-trou"></span>';
          if (tt.apres) html += ' ' + tt.apres;
          html += '</span>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'vf') {
          hasExercice = true;
          bloc.data.forEach(function(question, idxVf) {
            exoNum++;
            html += '<div class="exo">';
            if (idxVf === 0) {
              afficherConsigne(bloc);
            }
            html += '<div class="exo-ligne vf-ligne">';
            html += '<span class="exo-num-inline">' + exoNum + '</span>';
            html += '<span class="exo-texte-vf">' + question + '</span>';
            html += '<span class="vf-cases">☐ V   ☐ F</span>';
            html += '</div>';
            html += '</div>';
          });
          return;
        }

        if (bloc.type === 'ordre') {
          hasExercice = true;
          var ordreData = bloc.data;
          var items = ordreData.elements || [];
          var consigne = ordreData.consigne || 'Remettez dans l\'ordre';

          var itemsMelanges = items.slice();
          for (var m = itemsMelanges.length - 1; m > 0; m--) {
            var k = Math.floor(Math.random() * (m + 1));
            var tmp = itemsMelanges[m]; itemsMelanges[m] = itemsMelanges[k]; itemsMelanges[k] = tmp;
          }

          var lettres = ['A','B','C','D','E','F','G','H'];
          exoNum++;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + consigne + '</span>';
          html += '</div>';
          html += '<div class="ordre-grille">';
          itemsMelanges.forEach(function(item, i) {
            html += '<div class="ordre-cell-texte">';
            html += '<span class="ordre-lettre">' + lettres[i] + '.</span> ';
            html += item;
            html += '</div>';
            html += '<div class="ordre-cell-pointille">n° ..........</div>';
          });
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'carte') {
          hasExercice = true;
          exoNum++;
          var c = bloc.data;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + c.recto + '</span>';
          html += '</div>';
          html += '<div class="carte-ligne-courte"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'relier') {
          hasExercice = true;
          var relierData = bloc.data;
          exoNum++;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + relierData.consigne + '</span>';
          html += '</div>';
          html += '<div class="relier-zone-lignes">';
          html += '<div class="relier-lignes-grid">';

          html += '<div class="relier-col-lignes gauche">';
          for (var rg = 0; rg < relierData.paires.length; rg++) {
            html += '<div class="relier-ligne-item">';
            html += '<span>' + relierData.paires[rg].gauche + '</span>';
            html += '<span class="relier-point"></span>';
            html += '</div>';
          }
          html += '</div>';

          html += '<div class="relier-col-lignes droite">';
          for (var rd = 0; rd < relierData.droitesMelangees.length; rd++) {
            var dItem = relierData.droitesMelangees[rd];
            var classePoint = dItem.partagee ? 'relier-point relier-point-partage' : 'relier-point';
            html += '<div class="relier-ligne-item">';
            html += '<span class="' + classePoint + '"></span>';
            html += '<span>' + dItem.droite + '</span>';
            html += '</div>';
          }
          html += '</div>';

          html += '</div>';
          html += '</div>';
          html += '</div>';
          return;
        }
      });

      if (!hasExercice) return '';

      return '<div class="exercices-zone">' +
               '<div class="titre-exercices">Exercices</div>' +
               html +
             '</div>';
    }

    // ============================================================
    // CONSTRUCTION DU HTML DU CHAPITRE
    // ============================================================
    function construireHtmlChapitre(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};
      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Chapitre vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      var quizTexte = '';
      var openTexte = '';
      var ordreTexte = '';
      var carteTexte = '';
      var relierTexte = '';
      var ttTexte = '';
      var vfTexte = '';
      var copierTexte = '';

      parts.forEach(function(part) {
        part = part.trim();

        if (part.startsWith('q:')) {
          quizTexte = quizTexte ? quizTexte + '\n\n' + part : part;
        } else if (part.startsWith('qs:')) {
          openTexte = openTexte ? openTexte + '\n\n' + part : part;
        } else if (part.startsWith('o:')) {
          ordreTexte = ordreTexte ? ordreTexte + '\n\n' + part : part;
        } else if (part.startsWith('r:')) {
          carteTexte = carteTexte ? carteTexte + '\n\n' + part : part;
        } else if (part.startsWith('l:')) {
          relierTexte = relierTexte ? relierTexte + '\n\n' + part : part;
        } else if (part.startsWith('tt:')) {
          ttTexte = ttTexte ? ttTexte + '\n' + part : part;
        } else if (part.startsWith('vf:')) {
          vfTexte = vfTexte ? vfTexte + '\n' + part : part;
        } else if (part.startsWith('c:')) {
          copierTexte = copierTexte ? copierTexte + '\n' + part : part;
        } else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
          }
        }
      });

      var quizsParsed = quizTexte ? parserQuizsPourImpression(quizTexte) : [];
      var opensParsed = [];
      if (openTexte) {
        openTexte.split('\n\n').forEach(function(bloc) {
          var t = bloc.replace(/^qs:\s*/i, '').trim();
          if (t) opensParsed.push(t);
        });
      }
      var ordresParsed = [];
      if (ordreTexte) {
        ordreTexte.split('\n\n').forEach(function(bloc) {
          var p = parserOrdrePourImpression(bloc);
          if (p && p.elements.length > 0) ordresParsed.push(p);
        });
      }
      var cartesParsed = carteTexte ? parserCartesPourImpression(carteTexte) : [];
      var reliersParsed = [];
      if (relierTexte) {
        relierTexte.split('\n\n').forEach(function(bloc) {
          var p = parserRelierPourImpression(bloc);
          if (p && p.paires.length > 0) reliersParsed.push(p);
        });
      }
      var ttsParsed = ttTexte ? parserTextesTrousPourImpression(ttTexte) : [];
      var vfsParsed = vfTexte ? parserVraiFauxPourImpression(vfTexte) : [];
      var copiersParsed = copierTexte ? parserCopierPourImpression(copierTexte) : [];

      var blocsOrdonnes = [];

      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;

          if (type === 'slide' && slidesArray[idx] !== undefined) {
            blocsOrdonnes.push({ type: 'slide', data: slidesArray[idx] });
          } else if (type === 'quiz' && quizsParsed[idx]) {
            blocsOrdonnes.push({ type: 'quiz', data: quizsParsed[idx] });
          } else if (type === 'open' && opensParsed[idx] !== undefined) {
            blocsOrdonnes.push({ type: 'open', data: opensParsed[idx] });
          } else if (type === 'ordre' && ordresParsed[idx]) {
            blocsOrdonnes.push({ type: 'ordre', data: ordresParsed[idx] });
          } else if (type === 'carte' && cartesParsed[idx]) {
            blocsOrdonnes.push({ type: 'carte', data: cartesParsed[idx] });
          } else if (type === 'relier' && reliersParsed[idx]) {
            blocsOrdonnes.push({ type: 'relier', data: reliersParsed[idx] });
          } else if (type === 'tt' && ttsParsed[idx]) {
            blocsOrdonnes.push({ type: 'tt', data: ttsParsed[idx] });
          } else if (type === 'vf' && vfsParsed.length > 0) {
            blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
          } else if (type === 'copier' && copiersParsed[idx]) {
            blocsOrdonnes.push({ type: 'copier', data: copiersParsed[idx] });
          }
        });
      } else {
        slidesArray.forEach(function(s) { blocsOrdonnes.push({ type: 'slide', data: s }); });
        quizsParsed.forEach(function(q) { blocsOrdonnes.push({ type: 'quiz', data: q }); });
        opensParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'open', data: o }); });
        ttsParsed.forEach(function(t) { blocsOrdonnes.push({ type: 'tt', data: t }); });
        if (vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
        ordresParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'ordre', data: o }); });
        cartesParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'carte', data: c }); });
        reliersParsed.forEach(function(r) { blocsOrdonnes.push({ type: 'relier', data: r }); });
        copiersParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'copier', data: c }); });
      }

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var textePourCompter = '';
      blocsOrdonnes.forEach(function(b) {
        if (b.type === 'slide') textePourCompter += ' ' + b.data;
      });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 14));

      chapitre._nbMots = nbMots;
      chapitre._tempsLecture = tempsLecture;
      chapitre._vocabClean = vocabClean;

      var html = '';

      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + echapperHtml(chapitre.titre || 'Lecture') + '</h1>';
      html += '  </div>';
      html += '</div>';

      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + echapperHtml(t) + '</span>'; });
        html += '</div>';
      }

      html += '<div class="slides-zone">';
      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type !== 'slide') return;

        html += '<div class="slide">';
        var lignesSlide = bloc.data.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();

        html += '</div>';
      });
      html += '</div>';

      var htmlExercices = construireExercicesPourFeuille(blocsOrdonnes);
      html += htmlExercices;

      return html;
    }

    // ============================================================
    // ARABISER
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);

      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n);
      }

      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;

        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);

        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });

        parent.replaceChild(frag, texteNode);
      });
    }

    // ============================================================

    function construireNavDansLivret(chapitre) {
      if (!chapitre.categorie) return {};

      var memeLivret = chapitresData.filter(function(c) {
        return (c.categorie || '') === (chapitre.categorie || '');
      });
      memeLivret = trierAlphabetique(memeLivret);

      var indexActuel = -1;
      for (var i = 0; i < memeLivret.length; i++) {
        if (String(memeLivret[i].id) === String(chapitre.id)) {
          indexActuel = i;
          break;
        }

      return {
        liste: memeLivret,
        index: indexActuel,
        precedent: indexActuel > 0 ? memeLivret[indexActuel - 1] : null,
        suivant: indexActuel !== -1 && indexActuel < memeLivret.length - 1 ? memeLivret[indexActuel + 1] : null
      };

    // ============================================================
    // BLOC "AUTRES LIVRETS DU THÈME"
    // ============================================================
    function construireBlocAutresLivretsMemeTheme(chapitre) {
      if (!chapitre.categorie) return '';
      var livretMeta = livretsData[chapitre.categorie] || {};
      var themeActuel = (livretMeta.theme || '').trim();
      if (!themeActuel) return '';

      var autresLivrets = [];
      for (var titre in livretsData) {
        if (titre === chapitre.categorie) continue;
        var meta = livretsData[titre];
        if ((meta.theme || '').trim() === themeActuel) {
          autresLivrets.push({
            titre: titre,
            couleur: meta.couleur || '#2d6a4f',
            sousTitre: meta.sousTitre || '',
            auteur: meta.auteur || '',
            date: meta.date || '',
            niveau: meta.niveau || 1,
            pourcentage: 0
          });
        }
      }
      if (autresLivrets.length === 0) return '';

      autresLivrets.sort(function(a, b) {
        return a.titre.localeCompare(b.titre, 'fr', { sensitivity: 'base' });
      });

      var html = '';
      html += '<div class="bloc-bas">';
      html += '  <div class="bloc-bas-titre">Autres livrets du thème « ' + echapperHtml(themeActuel) + ' »</div>';
      html += '  <div class="bloc-bas-sous-titre">' + autresLivrets.length + ' autre(s) livret(s) dans ce même thème</div>';
      html += '  <div class="grille-couvertures">';
      autresLivrets.forEach(function(l) {
        html += construireCouvertureHtml(l);
      });
      html += '  </div>';
      html += '</div>';
      return html;
    }

    // ============================================================
    // BLOC "LES THÈMES"
    // ============================================================
    function construireBlocThemes(chapitre) {
      var livretMeta = livretsData[chapitre.categorie] || {};
      var themeActuel = (livretMeta.theme || '').trim();

      var parTheme = {};
      for (var titre in livretsData) {
        var meta = livretsData[titre];
        var t = (meta.theme || '').trim() || 'Sans thème';
        if (!parTheme[t]) parTheme[t] = [];
        parTheme[t].push({
          titre: titre,
          couleur: meta.couleur || '#2d6a4f'
        });
      }

      var themes = Object.keys(parTheme);
      if (themes.length === 0) return '';

      themes.sort(function(a, b) {
        var aEstActuel = (a === themeActuel);
        var bEstActuel = (b === themeActuel);
        if (aEstActuel && !bEstActuel) return -1;
        if (!aEstActuel && bEstActuel) return 1;
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });

      var html = '';
      html += '<div class="bloc-bas">';
      html += '  <div class="bloc-bas-titre">Explorer par thème</div>';
      html += '  <div class="bloc-bas-sous-titre">' + themes.length + ' thème(s) disponible(s)</div>';
      html += '  <div class="grille-themes">';

      themes.forEach(function(nomTheme) {
        var livrets = parTheme[nomTheme];
        var nbLivrets = livrets.length;
        var estActif = (nomTheme === themeActuel);
        var couleurTheme = (livrets[0] && livrets[0].couleur) || '#2d6a4f';
        var initiale = initialeTheme(nomTheme);

        html += '<a class="btn-theme-gros' + (estActif ? ' actif' : '') + '" '
              + 'href="/medit/mes-livrets.html?theme=' + encodeURIComponent(nomTheme) + '" '
              + 'title="Voir les livrets du thème ' + echapperHtml(nomTheme) + '">';
        html += '  <span class="theme-pastille" style="background: ' + couleurTheme + ';">' + echapperHtml(initiale) + '</span>';
        html += '  <span class="theme-infos">';
        html += '    <span class="theme-nom">' + echapperHtml(nomTheme) + '</span>';
        html += '    <span class="theme-compteur">' + nbLivrets + ' livret' + (nbLivrets > 1 ? 's' : '') + '</span>';
        html += '  </span>';
        html += '</a>';
      });

      html += '  </div>';
      html += '</div>';
      return html;
    }

        if (auteurLivret) html += '          <span class="auteur-couv">' + echapperHtml(auteurLivret) + '</span>';
        html += '          <span class="titre-couv">' + echapperHtml(chapitre.categorie) + '</span>';
        if (sousTitre) html += '          <span class="sous-titre-couv">' + echapperHtml(sousTitre) + '</span>';
        html += '        </div>';
        html += '        <div class="edition-info">';
        html += '          <span class="edition-nom">Qiraat Édition</span>';
        if (dateFormatee) html += '          <span class="edition-date">' + dateFormatee + '</span>';
        html += '        </div>';
        html += '      </div>';
        html += '      <div class="progression-couv"><div class="barre" style="width: 0%;"></div></div>';
        html += '    </div>';

        html += '    <div class="encart-texte">';
        html += '      <div class="encart-label">Extrait du livret</div>';
        html += '      <div class="encart-nom-livret">' + echapperHtml(chapitre.categorie) + '</div>';
        html += '      <div class="encart-cta">Voir le livret →</div>';
        html += '    </div>';
        html += '  </a>';
        html += '</div>';
      }

      if (nav.liste && nav.liste.length > 1) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">';
        html += '    <span class="icone">🕮</span> Dans ce livret';
        html += '    <span class="compteur">' + nav.liste.length + '</span>';
        html += '  </div>';
        html += '  <div class="liste-chapitres">';

        nav.liste.forEach(function(c) {
          var estActuel = String(c.id) === String(chapitre.id);
          if (estActuel) {
            html += '<div class="item-chapitre actuel">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">●</span>';
            html += '</div>';
          } else {
            html += '<a class="item-chapitre" href="/medit/chapitre.html?id=' + encodeURIComponent(c.id) + '">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">→</span>';
            html += '</a>';
          }
        });

        html += '  </div>';
        html += '</div>';
      }

      return html;
    }

    // ============================================================
    // ZONE BASSE MOBILE
    // ============================================================
    function construireZoneBasseMobile(chapitre) {
      return construireZoneLaterale(chapitre);
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerChapitre() {
      var params = new URLSearchParams(window.location.search);
      var chapitreId = params.get('id');

      if (!chapitreId) { afficherErreur('Aucun chapitre spécifié.'); return; }

      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          chapitresData = data.tousLesChapitres || data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                theme: l.theme || '',
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                description: l.description || '',
                auteur: l.auteur || '',
                niveau: parseInt(l.niveau) || 0
              };
            });
          }

          chapitreActuel = trouverChapitre(chapitreId, chapitresData);

          if (!chapitreActuel) {
            afficherErreur('Chapitre introuvable.');
            return;
          }

          if (chapitreActuel.categorie && typeof chargerImagesLivret === 'function') {
            chargerImagesLivret(chapitreActuel.categorie)
              .then(function(images) {
                imagesLivret = images || {};
                afficherChapitre(chapitreActuel);
              })
              .catch(function() {
                imagesLivret = {};
                afficherChapitre(chapitreActuel);
              });
          } else {
            afficherChapitre(chapitreActuel);
          }
        })
        .catch(function(error) {
          console.error('❌ Erreur:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];

            livretsData = {};
            if (cache.livrets && Array.isArray(cache.livrets)) {
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  theme: l.theme || '',
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  description: l.description || '',
                  auteur: l.auteur || '',
                  niveau: parseInt(l.niveau) || 0
                };
              });
            }

            chapitreActuel = trouverChapitre(chapitreId, chapitresData);
            if (chapitreActuel) {
              afficherChapitre(chapitreActuel);
              return;
            }
          }
          afficherErreur('Erreur de chargement.');
        });
    }

    // ============================================================
    // AFFICHER LE CHAPITRE
    // ============================================================
    function afficherChapitre(chapitre) {
      var container = document.getElementById('chapitreContainer');
      var colonneLaterale = document.getElementById('colonneLaterale');
      var zoneBasseMobile = document.getElementById('zoneBasseMobile');
      var zoneBasPage = document.getElementById('zoneBasPage');

      var contenuHtml = construireHtmlChapitre(chapitre, imagesLivret);
      var blocARetenirHtml = construireBlocARetenir(chapitre);
      var zoneBasHtml = construireZoneBasChapitre(chapitre);

      container.innerHTML =
        '<div class="feuille-chapitre">' + contenuHtml + '</div>' +
        blocARetenirHtml +
        zoneBasHtml;

      colonneLaterale.innerHTML = construireZoneLaterale(chapitre);
      zoneBasseMobile.innerHTML = construireZoneBasseMobile(chapitre);
      zoneBasPage.innerHTML = construireZoneBasPage(chapitre);

      arabiserDans(container);
      afficherFilAriane(chapitre);

      document.title = chapitre.titre + ' - Qiraat';
    }

    // ============================================================
    // ERREUR
    // ============================================================
    function afficherErreur(message) {
      document.getElementById('chapitreContainer').innerHTML = `
        <div class="vide-chapitre">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux chapitres.</p>
          <a href="/medit/présentation.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux chapitres</a>
        </div>
      `;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerChapitre);
    } else {
      chargerChapitre();
    }
  </script>

</body>
</html>
