<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Chapitre - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================ */
    /* LAYOUT GLOBAL                                                */
    /* ============================================================ */
    .page-chapitre {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 30px 60px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }
    @media (min-width: 1100px) {
      .page-chapitre {
        grid-template-columns: minmax(0, 820px) 360px;
        align-items: start;
      }
      .colonne-principale { grid-column: 1; }
      .colonne-laterale  { grid-column: 2; position: sticky; top: 20px; }
    }
    .zone-bas-page {
      grid-column: 1 / -1;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .zone-bas-page .bloc-bas { margin-bottom: 48px; }
    .zone-bas-page .bloc-bas:last-child { margin-bottom: 0; }
    .zone-bas-page .bloc-bas-titre {
      font-family: 'Georgia', serif;
      font-size: 20px; font-weight: 700; color: var(--text);
      margin-bottom: 6px; letter-spacing: 0.3px;
    }
    .zone-bas-page .bloc-bas-sous-titre {
      font-family: 'Roboto', sans-serif;
      font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
    }

    /* ============================================================ */
    /* FIL D'ARIANE                                                 */
    /* ============================================================ */
    .fil-ariane {
      grid-column: 1 / -1;
      font-family: 'Roboto', sans-serif;
      font-size: 12px; color: var(--text-muted);
      margin-bottom: 16px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .fil-ariane a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .fil-ariane a:hover { color: var(--text); border-bottom-color: var(--text); }
    .fil-ariane .sep { color: var(--text-muted); opacity: 0.6; }
    .fil-ariane .current { color: var(--text-secondary); }

    .btn-retour {
      grid-column: 1 / -1;
      display: inline-block; justify-self: start;
      margin-bottom: 8px; padding: 6px 18px;
      font-size: 13px; font-family: 'Roboto', sans-serif;
      background: transparent; border: 1px solid var(--border);
      cursor: pointer; color: var(--text-secondary);
      transition: all 0.2s; text-decoration: none;
    }
    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* FEUILLE CHAPITRE                                             */
    /* ============================================================ */
    .feuille-chapitre,
    .feuille-chapitre * {
      background: transparent !important;
      border-color: #e8e2d0;
    }
    .feuille-chapitre {
      color: #1a1a1a;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt; line-height: 1.35;
      padding: 26px 30px 30px;
      border: 1px solid #e8e2d0;
    }
    .feuille-chapitre .arabe,
    .feuille-chapitre [lang="ar"] {
      font-family: 'Janna LT Bold', 'Traditional Arabic', serif !important;
      font-size: 1.7em; line-height: 1; vertical-align: middle;
    }
    .feuille-chapitre .bandeau-titre {
      border-radius: 3px; padding: 10px 14px 9px; margin-bottom: 8px;
    }
    .feuille-chapitre .bandeau-titre .ligne-titre {
      display: flex; flex-direction: row; justify-content: space-between;
      align-items: baseline; gap: 10px; text-align: left;
    }
    .feuille-chapitre .bandeau-titre h1 {
      font-family: 'Georgia', serif;
      font-size: 16pt; font-weight: bold; color: #1a1a1a;
      letter-spacing: 0.5px; text-transform: uppercase;
      line-height: 1.15; margin: 0;
    }
    .feuille-chapitre .tags-haut {
      margin-top: 4px; margin-bottom: 8px; text-align: center;
    }
    .feuille-chapitre .tags-haut .memo-tag {
      display: inline-block; padding: 1px 9px; margin: 1px 3px;
      border-radius: 10px; font-size: 9.5pt; color: #444;
      font-style: normal; border: 1px solid #e8e2d0;
    }
    .feuille-chapitre .slides-zone { margin-top: 16px; margin-bottom: 20px; }
    .feuille-chapitre .slide { margin-bottom: 8px; }
    .feuille-chapitre .slide p {
      font-size: 14.3pt; margin-bottom: 4px;
      text-align: justify; text-indent: 1.2em;
    }
    .feuille-chapitre .slide p em { font-style: italic; }
    .feuille-chapitre .slide p .source-marge {
      float: right; display: inline-block;
      margin: 6px 0 6px 16px; padding: 4px 0 0 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 12pt; font-weight: 700; font-style: normal;
      color: #333; text-align: right; max-width: 23%;
      line-height: 1.2; text-indent: 0; white-space: normal;
      vertical-align: top;
    }
    .feuille-chapitre .slide::after {
      content: ""; display: table; clear: both;
    }
    .feuille-chapitre .print-img {
      display: block; height: auto; border: none; margin: 10px 0;
    }
    .feuille-chapitre .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-chapitre .print-img-gauche { float: left; margin: 6px 14px 8px 0; }
    .feuille-chapitre .print-img-droite { float: right; margin: 6px 0 8px 14px; }
    .feuille-chapitre .print-img-petit  { max-width: 150px; }
    .feuille-chapitre .print-img-moyen  { max-width: 220px; }
    .feuille-chapitre .print-img-grand  { max-width: 320px; }
    .feuille-chapitre .img-manquante {
      display: block; padding: 8px; border: 1px dashed #999;
      color: #666; font-size: 9pt; text-align: center; margin: 8px 0;
    }

    /* ============================================================ */
    /* EXERCICES                                                    */
    /* ============================================================ */
    .feuille-chapitre .exercices-zone {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid #e8e2d0;
    }
    .feuille-chapitre .titre-exercices {
      font-family: 'Georgia', serif; font-size: 14pt; font-weight: bold;
      color: #1a1a1a; letter-spacing: 0.5px; text-transform: uppercase;
      text-align: center; margin-bottom: 16px; padding-bottom: 6px;
      border-bottom: 1px solid #e8e2d0;
    }
    .feuille-chapitre .exo {
      margin-bottom: 16px; padding: 12px 14px 10px;
      border: 1px solid #e8e2d0; border-radius: 4px;
      break-inside: avoid; page-break-inside: avoid;
    }
    .feuille-chapitre .exo:last-child { margin-bottom: 0; }
    .feuille-chapitre .consigne-exo {
      font-size: 8.5pt; font-weight: 600; color: #333;
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 6px; padding: 3px 10px;
      border-left: 2.5px solid #888; border-radius: 2px;
    }
    .feuille-chapitre .consigne-exo::before {
      content: "◆ "; color: #888; font-size: 7pt; margin-right: 2px;
    }
    .feuille-chapitre .exo-ligne {
      display: flex; align-items: baseline; gap: 8px; margin-top: 4px;
    }
    .feuille-chapitre .exo-num-inline {
      display: inline-block; width: 18px; height: 18px;
      line-height: 17px; text-align: center;
      background: transparent !important; color: #1a1a1a;
      border: 0.8px solid #1a1a1a; border-radius: 50%;
      font-weight: bold; font-size: 9pt; flex-shrink: 0;
    }
    .feuille-chapitre .exo-texte {
      flex: 1; font-size: 11pt; line-height: 1.45;
    }

    /* Quiz */
    .feuille-chapitre .quiz-reponses { margin-left: 26px; margin-top: 4px; }
    .feuille-chapitre .quiz-rep {
      display: block; margin-bottom: 2px; font-size: 11pt;
      padding: 3px 6px; border-radius: 3px;
      transition: background 0.15s;
    }
    .feuille-chapitre .quiz-rep.interactive {
      cursor: pointer; user-select: none;
    }
    .feuille-chapitre .quiz-rep.interactive:hover {
      background: rgba(0,0,0,0.04);
    }
    .feuille-chapitre .quiz-rep.correct {
      border-left: 3px solid #333; padding-left: 8px;
    }
    .feuille-chapitre .quiz-rep.incorrect {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .feuille-chapitre .quiz-rep.correct .quiz-case,
    .feuille-chapitre .quiz-rep.revelee .quiz-case {
      background: #333 !important; border-color: #333;
    }
    .feuille-chapitre .quiz-case {
      display: inline-block; width: 11px; height: 11px;
      border: 0.8px solid #333; margin-right: 6px;
      vertical-align: middle; background: #fff !important;
      border-radius: 1px;
    }
    .feuille-chapitre .quiz-feedback-exo {
      margin-left: 26px; margin-top: 6px;
      font-size: 10pt; font-style: italic; color: #333;
      min-height: 16px;
    }

    /* QS ouverte */
    .feuille-chapitre .open-textarea {
      display: block; width: 100%; min-height: 110px;
      margin: 8px 0 4px 0; padding: 8px 10px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt; line-height: 1.5;
      border: 1px solid #d8d2c0; border-radius: 3px;
      background: #fdfcf9 !important; color: #1a1a1a;
      resize: vertical;
    }
    .feuille-chapitre .open-textarea:focus {
      outline: none; border-color: #888;
    }

    /* TT */
    .feuille-chapitre .tt-input {
      display: inline-block; min-width: 100px; max-width: 160px;
      padding: 1px 6px; font-family: inherit; font-size: 11pt;
      border: none; border-bottom: 1.2px solid #333;
      background: transparent; color: #1a1a1a;
      text-align: center; outline: none;
    }
    .feuille-chapitre .tt-input.tt-ok {
      border-bottom-width: 2px; font-weight: 600;
    }
    .feuille-chapitre .tt-input.tt-ko {
      text-decoration: line-through; opacity: 0.6;
    }
    .feuille-chapitre .tt-feedback {
      margin-left: 26px; margin-top: 4px;
      font-size: 9.5pt; font-style: italic; color: #333;
      min-height: 14px;
    }

    /* VF */
    .feuille-chapitre .vf-btn {
      display: inline-block; padding: 2px 10px; margin-left: 6px;
      font-size: 9.5pt; font-family: 'Roboto', sans-serif;
      background: transparent; border: 1px solid #333;
      border-radius: 3px; cursor: pointer;
      transition: all 0.15s; color: #1a1a1a;
    }
    .feuille-chapitre .vf-btn:hover:not(:disabled) { background: rgba(0,0,0,0.05); }
    .feuille-chapitre .vf-btn.vf-ok {
      background: #333; color: #fff; border-color: #333;
    }
    .feuille-chapitre .vf-btn.vf-ko {
      text-decoration: line-through; opacity: 0.5;
    }
    .feuille-chapitre .vf-btn:disabled { cursor: default; }
    .feuille-chapitre .vf-feedback {
      margin-left: 26px; margin-top: 4px;
      font-size: 9.5pt; font-style: italic; color: #333;
      min-height: 14px;
    }

    /* Cartes */
    .feuille-chapitre .carte-actions {
      margin-left: 26px; margin-top: 8px;
    }
    .feuille-chapitre .carte-btn-voir {
      display: inline-block; padding: 3px 12px;
      font-size: 9.5pt; font-family: 'Roboto', sans-serif;
      background: transparent; border: 1px solid #333;
      border-radius: 3px; cursor: pointer;
      transition: all 0.15s; color: #1a1a1a;
    }
    .feuille-chapitre .carte-btn-voir:hover { background: rgba(0,0,0,0.05); }
    .feuille-chapitre .carte-reponse-cachee {
      display: none; margin-left: 26px; margin-top: 6px;
      padding: 6px 10px; border-left: 2px solid #888;
      font-size: 10.5pt; font-style: italic; color: #333;
    }
    .feuille-chapitre .carte-reponse-cachee.visible { display: block; }
    .feuille-chapitre .carte-choix {
      margin-left: 26px; margin-top: 6px; display: none;
    }
    .feuille-chapitre .carte-choix.visible { display: block; }
    .feuille-chapitre .carte-choix button {
      padding: 3px 12px; margin-right: 6px;
      font-size: 9.5pt; font-family: 'Roboto', sans-serif;
      background: transparent; border: 1px solid #333;
      border-radius: 3px; cursor: pointer;
      transition: all 0.15s; color: #1a1a1a;
    }
    .feuille-chapitre .carte-choix button:hover:not(:disabled) { background: rgba(0,0,0,0.05); }
    .feuille-chapitre .carte-choix button.actif { background: #333; color: #fff; }
    .feuille-chapitre .carte-choix button:disabled { cursor: default; opacity: 0.4; }
    .feuille-chapitre .carte-choix button.actif:disabled { opacity: 1; }

    /* Relier (sans SVG) */
    .feuille-chapitre .relier-zone {
      position: relative; margin: 12px 0 8px 26px; max-width: 100%;
    }
    .feuille-chapitre .relier-grid {
      display: flex; justify-content: space-between; gap: 0;
    }
    .feuille-chapitre .relier-colonne {
      display: flex; flex-direction: column; gap: 12px;
      flex: 0 0 auto; max-width: 45%;
    }
    .feuille-chapitre .relier-colonne.gauche { align-items: flex-end; }
    .feuille-chapitre .relier-colonne.droite { align-items: flex-start; }
    .feuille-chapitre .relier-item {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 11pt;
      cursor: pointer; user-select: none;
      transition: opacity 0.2s;
      border: none; background: transparent;
    }
    .feuille-chapitre .relier-item .point {
      width: 10px; height: 10px;
      border: 1.5px solid #333; border-radius: 50%;
      background: #fff; flex-shrink: 0;
      box-sizing: border-box; transition: all 0.2s;
    }
    .feuille-chapitre .relier-item .point.point-partage { border-radius: 0; }
    .feuille-chapitre .relier-colonne.gauche .relier-item .point { order: 2; }
    .feuille-chapitre .relier-colonne.gauche .relier-item .texte { order: 1; }
    .feuille-chapitre .relier-colonne.droite .relier-item .point { order: 1; }
    .feuille-chapitre .relier-colonne.droite .relier-item .texte { order: 2; }
    .feuille-chapitre .relier-item:hover .texte {
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }
    .feuille-chapitre .relier-item.selectionne .point {
      background: #1a1a1a; transform: scale(1.3);
    }
    .feuille-chapitre .relier-item.associe {
      opacity: 0.45; cursor: default;
    }
    .feuille-chapitre .relier-item.associe:hover .texte {
      text-decoration: none;
    }
    .feuille-chapitre .relier-item.erreur .point {
      border-color: #333; background: #333;
    }
    .feuille-chapitre .relier-resultat {
      margin-left: 26px; margin-top: 6px;
      font-size: 10pt; font-style: italic; color: #333;
      min-height: 16px;
    }

    /* Ordre */
    .feuille-chapitre .ordre-grille {
      margin: 6px 0 4px 26px;
      display: grid; grid-template-columns: auto auto;
      column-gap: 14px; row-gap: 4px; font-size: 11pt;
    }
    .feuille-chapitre .ordre-cell-texte { white-space: nowrap; }
    .feuille-chapitre .ordre-cell-pointille {
      white-space: nowrap; color: #333;
      align-self: center; font-size: 10pt;
    }
    .feuille-chapitre .ordre-lettre { font-weight: bold; color: #333; }

    /* Copier */
    .feuille-chapitre .bloc-copier { margin-top: 4px; width: 100%; }
    .feuille-chapitre .copier-mots {
      text-align: right; direction: rtl;
      font-family: 'Janna LT Bold', 'Traditional Arabic', 'Amiri', serif;
      font-size: 2.2em; line-height: 1; color: #1a1a1a;
      padding: 2px 0 0; word-spacing: 14px;
      position: relative; display: block; margin-bottom: 8px;
    }
    .feuille-chapitre .copier-mots .copier-mot {
      display: inline-block; white-space: nowrap; direction: rtl;
    }
    .feuille-chapitre .copier-mots::after {
      content: ""; position: absolute;
      left: 0; right: 0; bottom: 0.28em; height: 1px;
      background: #333 !important; pointer-events: none;
    }
    .feuille-chapitre .copier-ligne-pointillee {
      width: 100%; height: 22px;
      border-bottom: 1px dotted #5a4a3a; margin-top: 2px;
    }

    /* ============================================================ */
    /* BLOC À RETENIR                                               */
    /* ============================================================ */
    .bloc-a-retenir {
      margin-top: 24px; background: #fffefb !important;
      border: 1px solid #e8e2d0; padding: 18px 22px 16px;
    }
    .bloc-a-retenir .bloc-a-retenir-titre {
      font-family: 'Georgia', serif; font-size: 14px; font-weight: 700;
      color: #1a1a1a; text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid #e8e2d0;
    }
    .bloc-a-retenir .bloc-a-retenir-liste {
      list-style: none; padding: 0; margin: 0;
    }
    .bloc-a-retenir .bloc-a-retenir-liste li {
      font-family: 'Georgia', serif; font-size: 14px; line-height: 1.55;
      color: #1a1a1a; padding: 6px 0 6px 22px;
      position: relative; border-bottom: 1px dashed #e8e2d0;
    }
    .bloc-a-retenir .bloc-a-retenir-liste li:last-child { border-bottom: none; }
    .bloc-a-retenir .bloc-a-retenir-liste li::before {
      content: "●"; position: absolute; left: 4px; top: 10px;
      color: #1a1a1a; font-size: 7pt;
    }

    /* ============================================================ */
    /* BLOC ACTIONS                                                 */
    /* ============================================================ */
    .bloc-actions-chapitre {
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn-action-lateral {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; padding: 14px 18px;
      font-size: 14px; font-family: 'Roboto', sans-serif;
      font-weight: 500; letter-spacing: 0.5px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer;
      color: var(--text-secondary); transition: all 0.2s;
      text-align: center; text-decoration: none; box-sizing: border-box;
    }
    .btn-action-lateral:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* ZONE BAS DU CHAPITRE                                         */
    /* ============================================================ */
    .zone-bas-chapitre {
      margin-top: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .nav-bas-chapitre {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .nav-bas-chapitre a,
    .nav-bas-chapitre .nav-placeholder {
      flex: 1; min-width: 200px; padding: 14px 18px;
      background: var(--bg); border: 1px solid var(--border);
      text-decoration: none; transition: all 0.2s;
      display: flex; flex-direction: column; gap: 4px;
    }
    .nav-bas-chapitre a:hover {
      border-color: var(--border-hover); background: var(--bg-hover);
    }
    .nav-bas-chapitre .nav-placeholder { opacity: 0.3; cursor: default; }
    .nav-bas-chapitre .nav-label {
      font-family: 'Roboto', sans-serif; font-size: 11px;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .nav-bas-chapitre .nav-titre {
      font-family: 'Georgia', serif; font-size: 15px;
      color: var(--text); font-weight: 500; line-height: 1.3;
    }
    .nav-bas-chapitre .nav-suivant { text-align: right; }
    .nav-bas-chapitre .nav-suivant .nav-label,
    .nav-bas-chapitre .nav-suivant .nav-titre { text-align: right; }

    /* ============================================================ */
    /* COLONNE LATÉRALE                                             */
    /* ============================================================ */
    .colonne-laterale .bloc-section {
      margin-bottom: 24px; padding: 16px 18px;
      background: var(--bg); border: 1px solid var(--border);
    }
    .colonne-laterale .bloc-section:last-child { margin-bottom: 0; }
    .bloc-section .bloc-titre {
      font-family: 'Georgia', serif; font-size: 14px; font-weight: 700;
      color: var(--text); margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px;
    }
    .bloc-section .bloc-titre .icone { font-size: 16px; opacity: 0.7; }
    .bloc-section .bloc-titre .compteur {
      font-family: 'Roboto', sans-serif; font-size: 11px;
      font-weight: 400; color: var(--text-muted); margin-left: auto;
    }
    .bloc-meta-chapitre {
      display: flex; flex-direction: column; gap: 6px;
      font-family: 'Roboto', sans-serif; font-size: 12px;
      color: var(--text-secondary);
    }
    .bloc-meta-chapitre .meta-ligne {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .bloc-meta-chapitre .meta-ligne .meta-icone {

    var reponsesChapitre = {
      quiz: {},        // { quizIdx: { choix, correct } }
      vf: {},          // { vfIdx: { choix, correct } }
      tt: {},          // { ttIdx: { saisi, correct } }
      cartes: {},      // { carteIdx: true|false }

    };

    // Map quizIdx → numéro d'exercice affiché (pour message "révisez les questions 1, 2…")
    var exoNumParType = {
      quiz: {},   // quizIdx → exoNum affiché
      vf: {},
      tt: {},
      relier: {},
      carte: {}
    };

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';
      return avant + spanSource + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateMoisAnnee(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        var mois = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        return mois[d.getMonth()] + ' ' + d.getFullYear();
      } catch(e) { return ''; }
    }

    function initialeTheme(nom) {
      if (!nom) return '?';
      var premier = nom.trim().charAt(0).toUpperCase();
      return premier || '?';
    }

    function normaliserComparaison(str) {
      return String(str)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    // ============================================================
    // TROUVER UN CHAPITRE
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // PARSERS
    // ============================================================
    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A','B','C','D','E','F'];
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
          currentQuiz = {
            question: ligne.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var isCorrect = false;
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) {
            isCorrect = true;
            texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          if (texteRep) {
            currentQuiz.reponses.push({
              texte: texteRep || 'Réponse',
              lettre: lettres[currentQuiz.reponses.length] || '?',
              correcte: isCorrect
            });
          }
        }
      }
      if (currentQuiz && currentQuiz.reponses.length > 0) quizs.push(currentQuiz);
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      var consigne = 'Remettre dans l\'ordre';
      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push(match[2]);
        } else if (elements.length === 0 && ligne.length > 0) {
          consigne = ligne.replace(/^o:\s*/i, '').trim() || consigne;
        }
      }
      return { elements: elements, consigne: consigne };
    }

    function parserCartesPourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var cartes = [];
      var current = null;
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          if (current) cartes.push(current);
          current = { recto: l.replace(/^r:\s*/i, '').trim(), verso: '' };
        } else if (l.toLowerCase().startsWith('v:') && current) {
          current.verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (current) cartes.push(current);
      return cartes;
    }

    function parserRelierPourImpression(relierTexte) {
      var lignes = relierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });
      if (lignes.length === 0) return null;
      var consigne = lignes[0].replace(/^l:\s*/i, '').trim() || 'Relie les éléments';
      var paires = [];
      for (var i = 1; i < lignes.length; i++) {
        var idx = lignes[i].indexOf('-');
        if (idx === -1) continue;
        var gauche = lignes[i].substring(0, idx).trim();
        var droite = lignes[i].substring(idx + 1).trim();
        if (gauche && droite) {
          paires.push({ gauche: gauche, droite: droite });
        }
      }
      if (paires.length === 0) return null;
      var compteParDroite = {};
      paires.forEach(function(p) {
        compteParDroite[p.droite] = (compteParDroite[p.droite] || 0) + 1;
      });
      var droitesUniques = [];
      var dejaVues = {};
      paires.forEach(function(p) {
        if (!dejaVues[p.droite]) {
          dejaVues[p.droite] = true;
          droitesUniques.push({
            droite: p.droite,
            partagee: compteParDroite[p.droite] > 1
          });
        }
      });
      for (var j = droitesUniques.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = droitesUniques[j];
        droitesUniques[j] = droitesUniques[k];
        droitesUniques[k] = tmp;
      }
      return { consigne: consigne, paires: paires, droitesMelangees: droitesUniques };
    }

    function parserTextesTrousPourImpression(ttTexte) {
      var lignes = ttTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var resultats = [];
      lignes.forEach(function(ligne) {
        if (!/^tt:/i.test(ligne)) return;
        var contenu = ligne.replace(/^tt:\s*/i, '').trim();
        var match = contenu.match(/\/([^\/]+)\//);
        if (!match) return;
        var mot = match[1].trim();
        var idx = contenu.indexOf('/' + mot + '/');
        var avant = contenu.substring(0, idx).trim();
        var apres = contenu.substring(idx + mot.length + 2).trim();
        resultats.push({ avant: avant, mot: mot, apres: apres });
      });
      return resultats;
    }

    function parserVraiFauxPourImpression(vfTexte) {
      var lignes = vfTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var questions = [];
      lignes.forEach(function(ligne) {
        if (!/^vf:/i.test(ligne)) return;
        var contenu = ligne.replace(/^vf:\s*/i, '').trim();
        var match = contenu.match(/\(([vf])\)\s*$/i);
        if (!match) return;
        var reponse = match[1].toLowerCase();
        var question = contenu.replace(/\s*\([vf]\)\s*$/i, '').trim();
        if (question === '') return;
        questions.push({ question: question, reponse: reponse });
      });
      return questions;
    }

    function parserCopierPourImpression(copierTexte) {
      if (!copierTexte) return [];
      var lignes = copierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });
      var blocs = [];
      lignes.forEach(function(ligne) {
        var contenu = ligne.replace(/^c:\s*/i, '').trim();
        if (!contenu) return;
        var mots = contenu.split(',')
          .map(function(m) { return m.trim(); })
          .filter(function(m) { return m !== ''; });
        if (mots.length > 0) blocs.push({ mots: mots });
      });
      return blocs;
    }

    // ============================================================
    // CONSTRUCTION DES EXERCICES
    // ============================================================
    function construireExercicesPourFeuille(blocsOrdonnes) {
      var html = '';
      var exoNum = 0;
      var hasExercice = false;
      var quizCounter = 0;
      var ttCounter = 0;
      var carteCounter = 0;
      var vfCounter = 0;
      var relierCounter = 0;

      function typeLogique(t) {
        if (t === 'carte') return 'open';
        return t;
      }

      var consignesBase = {
        quiz:   { sing: 'Cochez la bonne réponse :',  plur: 'Cochez la bonne réponse :' },
        open:   { sing: 'Répondez à la question :',   plur: 'Répondez aux questions :' },
        tt:     { sing: 'Complétez la phrase :',      plur: 'Complétez les phrases :' },
        vf:     { sing: 'Cochez Vrai ou Faux :',      plur: 'Cochez Vrai ou Faux :' },
        ordre:  { sing: 'Remettez dans l\'ordre :',   plur: 'Remettez dans l\'ordre :' },
        relier: { sing: 'Reliez les éléments :',      plur: 'Reliez les éléments :' },
        copier: { sing: 'Recopiez :',                 plur: 'Recopiez :' }
      };

      var iGroupe = 0;
      while (iGroupe < blocsOrdonnes.length) {
        var blocCourant = blocsOrdonnes[iGroupe];
        var typeCourant = typeLogique(blocCourant.type);
        if (typeCourant === 'slide') { iGroupe++; continue; }
        var nbConsecutifs = 1;
        var jGroupe = iGroupe + 1;
        while (jGroupe < blocsOrdonnes.length && typeLogique(blocsOrdonnes[jGroupe].type) === typeCourant) {
          nbConsecutifs++;
          jGroupe++;
        }
        if (typeCourant === 'vf') {
          nbConsecutifs = (nbConsecutifs - 1) + blocCourant.data.length;
        }
        var base = consignesBase[typeCourant];
        if (base) {
          var consigneFinale = (nbConsecutifs > 1) ? base.plur : base.sing;
          blocCourant._consigne = consigneFinale;
          for (var kGroupe = iGroupe + 1; kGroupe < jGroupe; kGroupe++) {
            blocsOrdonnes[kGroupe]._consigne = '';
          }
        }
        iGroupe = jGroupe;
      }

      function afficherConsigne(bloc) {
        if (bloc._consigne) {
          html += '<div class="consigne-exo">' + bloc._consigne + '</div>';
        }
      }

      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type === 'slide') return;

        if (bloc.type === 'copier') {
          hasExercice = true;
          exoNum++;
          var mots = bloc.data.mots;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">';
          html += '<div class="bloc-copier">';
          html += '<div class="copier-mots">';
          for (var cm = 0; cm < mots.length; cm++) {
            html += '<span class="copier-mot">' + mots[cm] + '</span>';
          }
          html += '</div>';
          html += '<div class="copier-ligne-pointillee"></div>';
          html += '</div>';
          html += '</span>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'quiz') {
          hasExercice = true;
          exoNum++;
          var q = bloc.data;
          var quizIdx = quizCounter++;
          exoNumParType.quiz[quizIdx] = exoNum;

          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + q.question + '</span>';
          html += '</div>';
          html += '<div class="quiz-reponses" data-quiz-idx="' + quizIdx + '">';
          q.reponses.forEach(function(rep, ri) {
            html += '<span class="quiz-rep interactive" data-quiz-idx="' + quizIdx + '" data-rep-idx="' + ri + '" data-correct="' + (rep.correcte ? '1' : '0') + '" onclick="repondreQuiz(this)">';
            html += '<span class="quiz-case"></span> ' + rep.lettre + '. ' + rep.texte;
            html += '</span>';
          });
          html += '</div>';
          html += '<div class="quiz-feedback-exo" id="quizFeedbackExo-' + quizIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'open') {
          hasExercice = true;
          exoNum++;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + bloc.data + '</span>';
          html += '</div>';
          html += '<textarea class="open-textarea" id="openReponse" placeholder="Écrivez votre réponse ici..." oninput="reponsesChapitre.questionOuverte = this.value;"></textarea>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'tt') {
          hasExercice = true;
          exoNum++;
          var tt = bloc.data;
          var ttIdx = ttCounter++;
          exoNumParType.tt[ttIdx] = exoNum;

          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="tt-phrase-print">';
          if (tt.avant) html += tt.avant + ' ';
          html += '<input type="text" class="tt-input" id="ttInput-' + ttIdx + '" data-mot="' + echapperHtml(tt.mot) + '" onkeydown="if(event.key===\'Enter\'){validerTT(' + ttIdx + ');return false;}" onblur="validerTT(' + ttIdx + ')">';
          if (tt.apres) html += ' ' + tt.apres;
          html += '</span>';
          html += '</div>';
          html += '<div class="tt-feedback" id="ttFeedback-' + ttIdx + '"></div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'vf') {
          hasExercice = true;
          bloc.data.forEach(function(item, idxVf) {
            exoNum++;
            var vfIdx = vfCounter++;
            exoNumParType.vf[vfIdx] = exoNum;

            html += '<div class="exo">';
            if (idxVf === 0) afficherConsigne(bloc);
            html += '<div class="exo-ligne vf-ligne">';
            html += '<span class="exo-num-inline">' + exoNum + '</span>';
            html += '<span class="exo-texte-vf">' + item.question + '</span>';
            html += '<span class="vf-cases">';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="v" data-correct="' + (item.reponse === 'v' ? '1' : '0') + '" onclick="repondreVF(this)">VRAI</button>';
            html += '<button class="vf-btn" data-vf-idx="' + vfIdx + '" data-choix="f" data-correct="' + (item.reponse === 'f' ? '1' : '0') + '" onclick="repondreVF(this)">FAUX</button>';
            html += '</span>';
            html += '</div>';
            html += '<div class="vf-feedback" id="vfFeedback-' + vfIdx + '"></div>';
            html += '</div>';
          });
          return;
        }

        if (bloc.type === 'ordre') {
          hasExercice = true;
          var ordreData = bloc.data;
          var items = ordreData.elements || [];
          var consigne = ordreData.consigne || 'Remettez dans l\'ordre';
          var itemsMelanges = items.slice();
          for (var m = itemsMelanges.length - 1; m > 0; m--) {
            var k = Math.floor(Math.random() * (m + 1));
            var tmp = itemsMelanges[m]; itemsMelanges[m] = itemsMelanges[k]; itemsMelanges[k] = tmp;
          }
          var lettres = ['A','B','C','D','E','F','G','H'];
          exoNum++;
          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + consigne + '</span>';
          html += '</div>';
          html += '<div class="ordre-grille">';
          itemsMelanges.forEach(function(item, i) {
            html += '<div class="ordre-cell-texte">';
            html += '<span class="ordre-lettre">' + lettres[i] + '.</span> ';
            html += item;
            html += '</div>';
            html += '<div class="ordre-cell-pointille">n° ..........</div>';
          });
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'carte') {
          hasExercice = true;
          exoNum++;
          var c = bloc.data;
          var carteIdx = carteCounter++;
          exoNumParType.carte[carteIdx] = exoNum;

          html += '<div class="exo">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + c.recto + '</span>';
          html += '</div>';
          html += '<div class="carte-actions">';
          html += '<button class="carte-btn-voir" data-carte-idx="' + carteIdx + '" onclick="voirCarteReponse(this)">Voir la réponse</button>';
          html += '</div>';
          html += '<div class="carte-reponse-cachee" id="carteRep-' + carteIdx + '">' + echapperHtml(c.verso) + '</div>';
          html += '<div class="carte-choix" id="carteChoix-' + carteIdx + '">';
          html += '<button class="trouve" data-carte-idx="' + carteIdx + '" data-choix="trouve" onclick="carteTrouvePasTrouve(this)">✓ J\'ai trouvé</button>';
          html += '<button class="pas-trouve" data-carte-idx="' + carteIdx + '" data-choix="pas-trouve" onclick="carteTrouvePasTrouve(this)">✗ Pas trouvé</button>';
          html += '</div>';
          html += '</div>';
          return;
        }

        if (bloc.type === 'relier') {
          hasExercice = true;
          var relierData = bloc.data;
          var relierIdx = relierCounter++;
          exoNum++;
          exoNumParType.relier[relierIdx] = exoNum;

          var paires = relierData.paires || [];
          var droitesMelangees = relierData.droitesMelangees || [];

          html += '<div class="exo relier-exo" data-relier-idx="' + relierIdx + '">';
          afficherConsigne(bloc);
          html += '<div class="exo-ligne">';
          html += '<span class="exo-num-inline">' + exoNum + '</span>';
          html += '<span class="exo-texte">' + relierData.consigne + '</span>';
          html += '</div>';
          html += '<div class="relier-zone" id="relierZone-' + relierIdx + '">';
          html += '<div class="relier-grid">';

          html += '<div class="relier-colonne gauche">';
          paires.forEach(function(p, i) {
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="gauche" data-idx="' + i + '" onclick="selectionnerRelier(' + relierIdx + ', \'gauche\', ' + i + ')">';
            html += '<span class="texte">' + p.gauche + '</span>';
            html += '<span class="point"></span>';
            html += '</div>';
          });
          html += '</div>';

          html += '<div class="relier-colonne droite">';
          droitesMelangees.forEach(function(d, i) {
            var classePoint = d.partagee ? 'point point-partage' : 'point';
            html += '<div class="relier-item" data-relier-idx="' + relierIdx + '" data-cote="droite" data-idx="' + i + '" data-droite-texte="' + echapperHtml(d.droite) + '" onclick="selectionnerRelier(' + relierIdx + ', \'droite\', ' + i + ')">';
            html += '<span class="' + classePoint + '"></span>';
            html += '<span class="texte">' + d.droite + '</span>';
            html += '</div>';
          });
          html += '</div>';

          html += '</div>'; // .relier-grid
          html += '</div>'; // .relier-zone
          html += '<div class="relier-resultat" id="relierResultat-' + relierIdx + '"></div>';
          html += '</div>'; // .exo
          return;
        }
      });

      if (!hasExercice) return '';

      return '<div class="exercices-zone">' +
               '<div class="titre-exercices">Exercices</div>' +
               html +
             '</div>';
    }

    // ============================================================
    // INTERACTIONS
    // ============================================================
    function repondreQuiz(el) {
      var quizIdx = el.getAttribute('data-quiz-idx');
      var repIdx = el.getAttribute('data-rep-idx');
      var correct = el.getAttribute('data-correct') === '1';

      if (reponsesChapitre.quiz[quizIdx]) return;
      reponsesChapitre.quiz[quizIdx] = { choix: repIdx, correct: correct };

      var parent = el.parentElement;
      var reps = parent.querySelectorAll('.quiz-rep');
      reps.forEach(function(r) { r.classList.remove('interactive'); r.style.pointerEvents = 'none'; });

      el.classList.add(correct ? 'correct' : 'incorrect');

      var feedback = document.getElementById('quizFeedbackExo-' + quizIdx);
      if (feedback) {
        if (correct) {
          feedback.textContent = 'Bonne réponse.';
        } else {
          var bonne = parent.querySelector('.quiz-rep[data-correct="1"]');
          var texteBonne = bonne ? bonne.textContent.trim() : '';
          feedback.textContent = 'La bonne réponse était : ' + texteBonne;
          if (bonne) bonne.classList.add('correct');
        }
      }

      majNoteGlobale();
    }

    function repondreVF(btn) {
      var vfIdx = btn.getAttribute('data-vf-idx');
      var choix = btn.getAttribute('data-choix');
      var correct = btn.getAttribute('data-correct') === '1';

      if (reponsesChapitre.vf[vfIdx]) return;
      reponsesChapitre.vf[vfIdx] = { choix: choix, correct: correct };

      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('.vf-btn');
      boutons.forEach(function(b) { b.disabled = true; });

      btn.classList.add(correct ? 'vf-ok' : 'vf-ko');
      if (!correct) {
        boutons.forEach(function(b) {
          if (b.getAttribute('data-correct') === '1') b.classList.add('vf-ok');
        });
      }

      var feedback = document.getElementById('vfFeedback-' + vfIdx);
      if (feedback) {
        feedback.textContent = correct ? 'Correct.' : 'Incorrect.';
      }

      majNoteGlobale();
    }

    function validerTT(ttIdx) {
      var input = document.getElementById('ttInput-' + ttIdx);
      if (!input || reponsesChapitre.tt[ttIdx]) return;
      var saisi = input.value.trim();
      if (saisi === '') return;

      var motAttendu = input.getAttribute('data-mot') || '';
      var correct = normaliserComparaison(saisi) === normaliserComparaison(motAttendu);

      reponsesChapitre.tt[ttIdx] = { saisi: saisi, correct: correct };

      input.classList.add(correct ? 'tt-ok' : 'tt-ko');
      input.disabled = true;

      var feedback = document.getElementById('ttFeedback-' + ttIdx);
      if (feedback) {
        if (correct) {
          feedback.textContent = 'Bonne réponse.';
        } else {
          feedback.textContent = 'La bonne réponse était : « ' + motAttendu + ' »';
        }
      }

      majNoteGlobale();
    }

    function voirCarteReponse(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var rep = document.getElementById('carteRep-' + carteIdx);
      var choix = document.getElementById('carteChoix-' + carteIdx);
      if (rep) rep.classList.add('visible');
      if (choix) choix.classList.add('visible');
      btn.style.display = 'none';
    }

    function carteTrouvePasTrouve(btn) {
      var carteIdx = btn.getAttribute('data-carte-idx');
      var choix = btn.getAttribute('data-choix');
      if (reponsesChapitre.cartes[carteIdx] !== undefined) return;

      reponsesChapitre.cartes[carteIdx] = (choix === 'trouve');

      var parent = btn.parentElement;
      var boutons = parent.querySelectorAll('button');
      boutons.forEach(function(b) { b.disabled = true; });
      btn.classList.add('actif');

      majNoteGlobale();
    }

    // ============================================================
    // RELIER (sans SVG, validation auto)
    // ============================================================
    var relierState = {};

    function initRelierState(relierIdx) {
      if (!relierState[relierIdx]) {
        relierState[relierIdx] = { associations: {}, selection: null, mapPaires: null };
      }
      return relierState[relierIdx];
    }

    function setRelierPaires(relierIdx, mapPaires) {
      var st = initRelierState(relierIdx);
      st.mapPaires = mapPaires;
    }

    function selectionnerRelier(relierIdx, cote, idx) {
      var st = initRelierState(relierIdx);
      if (st.valide) return;

      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;

      var item = exoEl.querySelector('.relier-item[data-cote="' + cote + '"][data-idx="' + idx + '"]');
      if (!item) return;
      if (item.classList.contains('associe')) return;

      var sel = st.selection;

      if (!sel) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }

      if (sel.cote === cote) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }

      var gaucheIdx = sel.cote === 'gauche' ? sel.idx : idx;
      var droiteIdx = sel.cote === 'droite' ? sel.idx : idx;

      var droiteEl = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + droiteIdx + '"]');
      if (droiteEl && droiteEl.classList.contains('associe')) {
        exoEl.querySelectorAll('.relier-item.selectionne').forEach(function(el) { el.classList.remove('selectionne'); });
        item.classList.add('selectionne');
        st.selection = { cote: cote, idx: idx };
        return;
      }

      var gaucheEl = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gaucheIdx + '"]');

      st.associations[gaucheIdx] = droiteIdx;

      if (gaucheEl) {
        gaucheEl.classList.remove('selectionne');
        gaucheEl.classList.add('associe');
      }
      if (droiteEl) {
        droiteEl.classList.remove('selectionne');
        droiteEl.classList.add('associe');
      }

      st.selection = null;

      var totalPaires = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]').length;
      var nbAssociees = Object.keys(st.associations).length;

      if (nbAssociees >= totalPaires) {
        validerRelier(relierIdx);
      }
    }

    function validerRelier(relierIdx) {
      var exoEl = document.querySelector('.relier-exo[data-relier-idx="' + relierIdx + '"]');
      if (!exoEl) return;
      var st = initRelierState(relierIdx);

      var mapPaires = st.mapPaires;
      if (!mapPaires) {
        // reconstruire depuis le DOM (fallback)
        mapPaires = {};
        exoEl.querySelectorAll('.relier-item[data-cote="gauche"]').forEach(function(el, i) {
          var t = el.querySelector('.texte').textContent.trim();
          mapPaires[t] = null;
        });
      }

      var itemsGauche = exoEl.querySelectorAll('.relier-item[data-cote="gauche"]');
      var total = itemsGauche.length;
      var bonnes = 0;

      exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });

      for (var gIdx in st.associations) {
        var dIdx = st.associations[gIdx];
        var texteGauche = itemsGauche[parseInt(gIdx)].querySelector('.texte').textContent.trim();
        var itemDroite = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
        var texteDroite = itemDroite ? itemDroite.getAttribute('data-droite-texte') : '';

        var bonne = (mapPaires[texteGauche] === texteDroite);
        if (bonne) {
          bonnes++;
        } else {
          var elG = exoEl.querySelector('.relier-item[data-cote="gauche"][data-idx="' + gIdx + '"]');
          var elD = exoEl.querySelector('.relier-item[data-cote="droite"][data-idx="' + dIdx + '"]');
          if (elG) elG.classList.add('erreur');
          if (elD) elD.classList.add('erreur');
        }
      }

      var resultat = document.getElementById('relierResultat-' + relierIdx);
      var correct = (bonnes === total);

      reponsesChapitre.relier[relierIdx] = { valide: correct, bonnes: bonnes, total: total };

      if (correct) {
        st.valide = true;
        if (resultat) resultat.textContent = 'Toutes les associations sont correctes.';
      } else {
        if (resultat) resultat.textContent = bonnes + '/' + total + ' associations correctes. Réessayez.';
        setTimeout(function() {
          exoEl.querySelectorAll('.relier-item.erreur').forEach(function(el) { el.classList.remove('erreur'); });
          st.associations = {};
          st.selection = null;
          exoEl.querySelectorAll('.relier-item.associe, .relier-item.selectionne').forEach(function(el) {
            el.classList.remove('associe', 'selectionne');
          });
          if (resultat) resultat.textContent = '';
        }, 1500);
      }

      majNoteGlobale();
    }

    // ============================================================
    // NOTE GLOBALE
    // ============================================================
    function calculerNote() {
      var note = {
        quiz:      { bonnes: 0, total: Object.keys(reponsesChapitre.quiz).length },
        vf:        { bonnes: 0, total: Object.keys(reponsesChapitre.vf).length },
        tt:        { bonnes: 0, total: Object.keys(reponsesChapitre.tt).length },
        cartes:    { bonnes: 0, total: Object.keys(reponsesChapitre.cartes).length },
        relier:    { bonnes: 0, total: 0 },
        total:     { bonnes: 0, total: 0 }
      };

      Object.keys(reponsesChapitre.quiz).forEach(function(k) {
        if (reponsesChapitre.quiz[k].correct) note.quiz.bonnes++;
      });
      Object.keys(reponsesChapitre.vf).forEach(function(k) {
        if (reponsesChapitre.vf[k].correct) note.vf.bonnes++;
      });
      Object.keys(reponsesChapitre.tt).forEach(function(k) {
        if (reponsesChapitre.tt[k].correct) note.tt.bonnes++;
      });
      Object.keys(reponsesChapitre.cartes).forEach(function(k) {
        if (reponsesChapitre.cartes[k] === true) note.cartes.bonnes++;
      });
      Object.keys(reponsesChapitre.relier).forEach(function(k) {
        var r = reponsesChapitre.relier[k];
        note.relier.total += r.total;
        note.relier.bonnes += r.bonnes;
      });

      note.total.bonnes = note.quiz.bonnes + note.vf.bonnes + note.tt.bonnes + note.cartes.bonnes + note.relier.bonnes;
      note.total.total  = note.quiz.total  + note.vf.total  + note.tt.total  + note.cartes.total  + note.relier.total;

      return note;
    }

    function majNoteGlobale() {
      var note = calculerNote();
      var lignes = [];

      if (note.quiz.total > 0)   lignes.push({ label: 'Quiz',              b: note.quiz.bonnes,   t: note.quiz.total });
      if (note.vf.total > 0)     lignes.push({ label: 'Vrai / Faux',       b: note.vf.bonnes,     t: note.vf.total });
      if (note.tt.total > 0)     lignes.push({ label: 'Textes à trous',    b: note.tt.bonnes,     t: note.tt.total });
      if (note.cartes.total > 0) lignes.push({ label: 'Cartes',            b: note.cartes.bonnes, t: note.cartes.total });
      if (note.relier.total > 0) lignes.push({ label: 'Relier',            b: note.relier.bonnes, t: note.relier.total });

      var html = '';
      lignes.forEach(function(l) {
        html += '<div class="note-ligne">';
        html += '  <span class="note-label">' + l.label + '</span>';
        html += '  <span class="note-valeur">' + l.b + ' / ' + l.t + '</span>';
        html += '</div>';
      });

      if (lignes.length === 0) {
        html += '<div class="note-ligne"><span class="note-label">Aucune réponse pour le moment.</span></div>';
      }

      var el = document.getElementById('noteLignes');
      if (el) el.innerHTML = html;

            var totalEl = document.getElementById('noteTotalValeur');
      if (totalEl) totalEl.textContent = note.total.bonnes + ' / ' + note.total.total;

      // Afficher le bouton "Refaire" seulement si < 60 %
      var btnRevoir = document.getElementById('btnRevoir');
      if (btnRevoir && note.total.total > 0) {
        var pourcentage = (note.total.bonnes / note.total.total) * 100;
        btnRevoir.style.display = (pourcentage < 60) ? 'inline-block' : 'none';
      }
    }

    // ============================================================
    // MESSAGE RÉVISION
    // ============================================================
    function construireMessageRevision() {
      var aRevoir = [];

      Object.keys(reponsesChapitre.quiz).forEach(function(k) {
        if (!reponsesChapitre.quiz[k].correct && exoNumParType.quiz[k]) aRevoir.push(exoNumParType.quiz[k]);
      });
      Object.keys(reponsesChapitre.vf).forEach(function(k) {
        if (!reponsesChapitre.vf[k].correct && exoNumParType.vf[k]) aRevoir.push(exoNumParType.vf[k]);
      });
      Object.keys(reponsesChapitre.tt).forEach(function(k) {
        if (!reponsesChapitre.tt[k].correct && exoNumParType.tt[k]) aRevoir.push(exoNumParType.tt[k]);
      });
      Object.keys(reponsesChapitre.cartes).forEach(function(k) {
        if (reponsesChapitre.cartes[k] === false && exoNumParType.carte[k]) aRevoir.push(exoNumParType.carte[k]);
      });
      Object.keys(reponsesChapitre.relier).forEach(function(k) {
        var r = reponsesChapitre.relier[k];
        if (!r.valide && exoNumParType.relier[k]) aRevoir.push(exoNumParType.relier[k]);
      });

      aRevoir.sort(function(a, b) { return a - b; });

      if (aRevoir.length === 0) return '';

      var liste = aRevoir.join(', ');
      return 'Révisez les questions ' + liste + ' puis repassez le test.';
    }

    // ============================================================
    // ENVOI FINAL
    // ============================================================
    function construireBlocNoteGlobale() {
      var html = '<div class="bloc-note-globale" id="blocNoteGlobale">';
      html += '  <div class="note-titre">Note globale</div>';
      html += '  <div class="note-lignes" id="noteLignes"></div>';
      html += '  <div class="note-totale">';
      html += '    <span>Total</span>';
      html += '    <span class="note-valeur" id="noteTotalValeur">0 / 0</span>';
      html += '  </div>';
      html += '  <div class="note-actions">';
      html += '    <button class="btn-revoir" id="btnRevoir" onclick="relireEtRefaire()" style="display:none;">Relire le texte et refaire les questions</button>';
      html += '    <button class="btn-envoyer-final" id="btnEnvoyerFinal" onclick="envoyerToutesReponses()">📤 Envoyer mes réponses</button>';
      html += '  </div>';
      html += '  <div class="envoi-statut" id="envoiStatut"></div>';
      html += '  <div class="revision-message" id="revisionMessage" style="margin-top:12px;font-family:\'Roboto\',sans-serif;font-size:12px;font-style:italic;color:#333;min-height:16px;"></div>';
      html += '</div>';
      return html;
    }

    function relireEtRefaire() {
      reponsesChapitre.quiz = {};
      reponsesChapitre.vf = {};
      reponsesChapitre.tt = {};
      reponsesChapitre.cartes = {};
      reponsesChapitre.relier = {};
      reponsesChapitre.questionOuverte = '';
      relierState = {};
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // Reset visuel de la page
      setTimeout(function() { window.location.reload(); }, 300);
    }

    function envoyerToutesReponses() {
      if (envoiEffectue) return;
      var btn = document.getElementById('btnEnvoyerFinal');
      var statut = document.getElementById('envoiStatut');
      if (!btn || !statut) return;

      var nom = localStorage.getItem('etudiant_id') || 'anonyme';
      var chapitreId = chapitreActuel ? chapitreActuel.id : '';
      var titre = chapitreActuel ? chapitreActuel.titre : '';

      btn.disabled = true;
      btn.textContent = '⏳ Envoi en cours...';
      statut.textContent = '';

      var note = calculerNote();
      var choixQcmArr = [];
      var quizTotal = 0, quizBonnes = 0;
      Object.keys(reponsesChapitre.quiz).forEach(function(k) {
        quizTotal++;
        var r = reponsesChapitre.quiz[k];
        if (r.correct) quizBonnes++;
        choixQcmArr.push((r.correct ? 'V' : 'F') + ':' + (parseInt(r.choix) + 1));
      });
      var choixQcm = choixQcmArr.join('|');

      var vfTotal = 0, vfBonnes = 0;
      Object.keys(reponsesChapitre.vf).forEach(function(k) {
        vfTotal++;
        if (reponsesChapitre.vf[k].correct) vfBonnes++;
      });

      var ttTotal = 0, ttBonnes = 0;
      Object.keys(reponsesChapitre.tt).forEach(function(k) {
        ttTotal++;
        if (reponsesChapitre.tt[k].correct) ttBonnes++;
      });

      var cartesTotal = 0, cartesBonnes = 0, cartesStr = [];
      Object.keys(reponsesChapitre.cartes).forEach(function(k) {
        cartesTotal++;
        if (reponsesChapitre.cartes[k] === true) cartesBonnes++;
        cartesStr.push(reponsesChapitre.cartes[k] ? '1' : '0');
      });

      var relierTotal = 0, relierBonnes = 0;
      Object.keys(reponsesChapitre.relier).forEach(function(k) {
        var r = reponsesChapitre.relier[k];
        relierTotal += r.total;
        relierBonnes += r.bonnes;
      });

      var base = (typeof SCRIPT_URL !== 'undefined') ? SCRIPT_URL : CONFIG.SCRIPT_URL;
      var promesses = [];

      if (quizTotal > 0) {
        promesses.push(fetch(base + '?action=saveQuiz' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&titre=' + encodeURIComponent(titre) +
          '&choixQcm=' + encodeURIComponent(choixQcm) +
          '&bonnes=' + quizBonnes +
          '&total=' + quizTotal).then(function(r){return r.json();}));
      }

      if (vfTotal > 0) {
        promesses.push(fetch(base + '?action=saveVraiFaux' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&bonnes=' + vfBonnes +
          '&total=' + vfTotal).then(function(r){return r.json();}));
      }

      if (ttTotal > 0) {
        promesses.push(fetch(base + '?action=saveTexteTrous' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&bonnes=' + ttBonnes +
          '&total=' + ttTotal).then(function(r){return r.json();}));
      }

      if (cartesTotal > 0) {
        promesses.push(fetch(base + '?action=saveCarte' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&titre=' + encodeURIComponent(titre) +
          '&cartes=' + encodeURIComponent(cartesStr.join(',')) +
          '&bonnes=' + cartesBonnes +
          '&total=' + cartesTotal).then(function(r){return r.json();}));
      }

      if (relierTotal > 0) {
        promesses.push(fetch(base + '?action=saveRelier' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&titre=' + encodeURIComponent(titre) +
          '&bonnes=' + relierBonnes +
          '&total=' + relierTotal).then(function(r){return r.json();}));
      }

      if (reponsesChapitre.questionOuverte && reponsesChapitre.questionOuverte.trim() !== '') {
        promesses.push(fetch(base + '?action=saveReponseOuverte' +
          '&nom=' + encodeURIComponent(nom) +
          '&chapitreId=' + encodeURIComponent(chapitreId) +
          '&reponseOuverte=' + encodeURIComponent(reponsesChapitre.questionOuverte)).then(function(r){return r.json();}));
      }

      if (promesses.length === 0) {
        btn.disabled = false;
        btn.textContent = '📤 Envoyer mes réponses';
        statut.textContent = 'Aucune réponse à envoyer.';
        return;
      }

      Promise.all(promesses)
        .then(function() {
          envoiEffectue = true;
          btn.textContent = '✓ Réponses envoyées';
          statut.textContent = 'Vos réponses ont bien été enregistrées.';

          var msgRev = construireMessageRevision();
          var revEl = document.getElementById('revisionMessage');
          if (revEl) revEl.textContent = msgRev;
        })
        .catch(function(err) {
          console.error('Erreur envoi:', err);
          btn.disabled = false;
          btn.textContent = '📤 Réessayer l\'envoi';
          statut.textContent = 'Erreur d\'envoi. Vérifiez la connexion.';
        });
    }

    // ============================================================
    // CONSTRUCTION DU HTML DU CHAPITRE
    // ============================================================
    function construireHtmlChapitre(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};
      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Chapitre vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      var quizTexte = '';
      var openTexte = '';
      var ordreTexte = '';
      var carteTexte = '';
      var relierTexte = '';
      var ttTexte = '';
      var vfTexte = '';
      var copierTexte = '';

      parts.forEach(function(part) {
        part = part.trim();
        if (part.startsWith('q:')) quizTexte = quizTexte ? quizTexte + '\n\n' + part : part;
        else if (part.startsWith('qs:')) openTexte = openTexte ? openTexte + '\n\n' + part : part;
        else if (part.startsWith('o:')) ordreTexte = ordreTexte ? ordreTexte + '\n\n' + part : part;
        else if (part.startsWith('r:')) carteTexte = carteTexte ? carteTexte + '\n\n' + part : part;
        else if (part.startsWith('l:')) relierTexte = relierTexte ? relierTexte + '\n\n' + part : part;
        else if (part.startsWith('tt:')) ttTexte = ttTexte ? ttTexte + '\n' + part : part;
        else if (part.startsWith('vf:')) vfTexte = vfTexte ? vfTexte + '\n' + part : part;
        else if (part.startsWith('c:')) copierTexte = copierTexte ? copierTexte + '\n' + part : part;
        else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
          }
        }
      });

      var quizsParsed = quizTexte ? parserQuizsPourImpression(quizTexte) : [];
      var opensParsed = [];
      if (openTexte) {
        openTexte.split('\n\n').forEach(function(bloc) {
          var t = bloc.replace(/^qs:\s*/i, '').trim();
          if (t) opensParsed.push(t);
        });
      }
      var ordresParsed = [];
      if (ordreTexte) {
        ordreTexte.split('\n\n').forEach(function(bloc) {
          var p = parserOrdrePourImpression(bloc);
          if (p && p.elements.length > 0) ordresParsed.push(p);
        });
      }
      var cartesParsed = carteTexte ? parserCartesPourImpression(carteTexte) : [];
      var reliersParsed = [];
      if (relierTexte) {
        relierTexte.split('\n\n').forEach(function(bloc) {
          var p = parserRelierPourImpression(bloc);
          if (p && p.paires.length > 0) reliersParsed.push(p);
        });
      }
      var ttsParsed = ttTexte ? parserTextesTrousPourImpression(ttTexte) : [];
      var vfsParsed = vfTexte ? parserVraiFauxPourImpression(vfTexte) : [];
      var copiersParsed = copierTexte ? parserCopierPourImpression(copierTexte) : [];

      var blocsOrdonnes = [];

      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;

          if (type === 'slide' && slidesArray[idx] !== undefined) blocsOrdonnes.push({ type: 'slide', data: slidesArray[idx] });
          else if (type === 'quiz' && quizsParsed[idx]) blocsOrdonnes.push({ type: 'quiz', data: quizsParsed[idx] });
          else if (type === 'open' && opensParsed[idx] !== undefined) blocsOrdonnes.push({ type: 'open', data: opensParsed[idx] });
          else if (type === 'ordre' && ordresParsed[idx]) blocsOrdonnes.push({ type: 'ordre', data: ordresParsed[idx] });
          else if (type === 'carte' && cartesParsed[idx]) blocsOrdonnes.push({ type: 'carte', data: cartesParsed[idx] });
          else if (type === 'relier' && reliersParsed[idx]) blocsOrdonnes.push({ type: 'relier', data: reliersParsed[idx] });
          else if (type === 'tt' && ttsParsed[idx]) blocsOrdonnes.push({ type: 'tt', data: ttsParsed[idx] });
          else if (type === 'vf' && vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
          else if (type === 'copier' && copiersParsed[idx]) blocsOrdonnes.push({ type: 'copier', data: copiersParsed[idx] });
        });
      } else {
        slidesArray.forEach(function(s) { blocsOrdonnes.push({ type: 'slide', data: s }); });
        quizsParsed.forEach(function(q) { blocsOrdonnes.push({ type: 'quiz', data: q }); });
        opensParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'open', data: o }); });
        ttsParsed.forEach(function(t) { blocsOrdonnes.push({ type: 'tt', data: t }); });
        if (vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
        ordresParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'ordre', data: o }); });
        cartesParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'carte', data: c }); });
        reliersParsed.forEach(function(r) { blocsOrdonnes.push({ type: 'relier', data: r }); });
        copiersParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'copier', data: c }); });
      }

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var textePourCompter = '';
      blocsOrdonnes.forEach(function(b) {
        if (b.type === 'slide') textePourCompter += ' ' + b.data;
      });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 14));

      chapitre._nbMots = nbMots;
      chapitre._tempsLecture = tempsLecture;
      chapitre._vocabClean = vocabClean;

      // Stocker les paires du relier (pour validation)
      window._relierPaires = {};
      var relierCountPourStockage = 0;
      blocsOrdonnes.forEach(function(b) {
        if (b.type === 'relier') {
          var map = {};
          (b.data.paires || []).forEach(function(p) { map[p.gauche] = p.droite; });
          window._relierPaires[relierCountPourStockage] = map;
          relierCountPourStockage++;
        }
      });

      var html = '';

      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + echapperHtml(chapitre.titre || 'Lecture') + '</h1>';
      html += '  </div>';
      html += '</div>';

      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + echapperHtml(t) + '</span>'; });
        html += '</div>';
      }

      html += '<div class="slides-zone">';
      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type !== 'slide') return;
        html += '<div class="slide">';
        var lignesSlide = bloc.data.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();
        html += '</div>';
      });
      html += '</div>';

      var htmlExercices = construireExercicesPourFeuille(blocsOrdonnes);
      html += htmlExercices;

      return html;
    }

    // ============================================================
    // ARABISER
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n);
      }
      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;
        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);
        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });
        parent.replaceChild(frag, texteNode);
      });
    }

    function construireNavDansLivret(chapitre) {

      var memeLivret = chapitresData.filter(function(c) {

      memeLivret = trierAlphabetique(memeLivret);

      return {
        liste: memeLivret,
        index: indexActuel,
        precedent: indexActuel > 0 ? memeLivret[indexActuel - 1] : null,
        suivant: indexActuel !== -1 && indexActuel < memeLivret.length - 1 ? memeLivret[indexActuel + 1] : null

    function construireBlocAutresLivretsMemeTheme(chapitre) {
      if (!chapitre.categorie) return '';
      var livretMeta = livretsData[chapitre.categorie] || {};
      var themeActuel = (livretMeta.theme || '').trim();
      if (!themeActuel) return '';
      var autresLivrets = [];
      for (var titre in livretsData) {
        if (titre === chapitre.categorie) continue;
        var meta = livretsData[titre];
        if ((meta.theme || '').trim() === themeActuel) {
          autresLivrets.push({
            titre: titre,
            couleur: meta.couleur || '#2d6a4f',
            sousTitre: meta.sousTitre || '',
            auteur: meta.auteur || '',
            date: meta.date || '',
            niveau: meta.niveau || 1,
            pourcentage: 0
          });
        }
      }
      if (autresLivrets.length === 0) return '';
      autresLivrets.sort(function(a, b) {
        return a.titre.localeCompare(b.titre, 'fr', { sensitivity: 'base' });
      });
      var html = '';
      html += '<div class="bloc-bas">';
      html += '  <div class="bloc-bas-titre">Autres livrets du thème « ' + echapperHtml(themeActuel) + ' »</div>';
      html += '  <div class="bloc-bas-sous-titre">' + autresLivrets.length + ' autre(s) livret(s) dans ce même thème</div>';
      html += '  <div class="grille-couvertures">';
      autresLivrets.forEach(function(l) { html += construireCouvertureHtml(l); });
      html += '  </div>';
      html += '</div>';
      return html;
    }

    function construireBlocThemes(chapitre) {
      var livretMeta = livretsData[chapitre.categorie] || {};
      var themeActuel = (livretMeta.theme || '').trim();
      var parTheme = {};
      for (var titre in livretsData) {
        var meta = livretsData[titre];
        var t = (meta.theme || '').trim() || 'Sans thème';
        if (!parTheme[t]) parTheme[t] = [];
        parTheme[t].push({ titre: titre, couleur: meta.couleur || '#2d6a4f' });
      }
      var themes = Object.keys(parTheme);
      if (themes.length === 0) return '';
      themes.sort(function(a, b) {
        var aEstActuel = (a === themeActuel);
        var bEstActuel = (b === themeActuel);
        if (aEstActuel && !bEstActuel) return -1;
        if (!aEstActuel && bEstActuel) return 1;
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });
      var html = '';
      html += '<div class="bloc-bas">';
      html += '  <div class="bloc-bas-titre">Explorer par thème</div>';
      html += '  <div class="bloc-bas-sous-titre">' + themes.length + ' thème(s) disponible(s)</div>';
      html += '  <div class="grille-themes">';
      themes.forEach(function(nomTheme) {
        var livrets = parTheme[nomTheme];
        var nbLivrets = livrets.length;
        var estActif = (nomTheme === themeActuel);
        var couleurTheme = (livrets[0] && livrets[0].couleur) || '#2d6a4f';
        var initiale = initialeTheme(nomTheme);
        html += '<a class="btn-theme-gros' + (estActif ? ' actif' : '') + '" '
              + 'href="/medit/mes-livrets.html?theme=' + encodeURIComponent(nomTheme) + '" '
              + 'title="Voir les livrets du thème ' + echapperHtml(nomTheme) + '">';
        html += '  <span class="theme-pastille" style="background: ' + couleurTheme + ';">' + echapperHtml(initiale) + '</span>';

        html += '  </span>';
        html += '</a>';
      });
      html += '  </div>';
      html += '</div>';
      return html;
    }
