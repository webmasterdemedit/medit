<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Chapitre - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================ */
    /* LAYOUT GLOBAL                                                */
    /* ============================================================ */
    .page-chapitre {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 30px 60px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    /* ✅ 2 colonnes dès 1100px (au lieu de 1200px) */
    @media (min-width: 1100px) {
      .page-chapitre {
        grid-template-columns: minmax(0, 820px) 360px;
        align-items: start;
      }
      .colonne-principale { grid-column: 1; }
      .colonne-laterale  { grid-column: 2; position: sticky; top: 20px; }
    }

    /* ============================================================ */
    /* FIL D'ARIANE                                                 */
    /* ============================================================ */
    .fil-ariane {
      grid-column: 1 / -1;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .fil-ariane a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .fil-ariane a:hover { color: var(--text); border-bottom-color: var(--text); }
    .fil-ariane .sep { color: var(--text-muted); opacity: 0.6; }
    .fil-ariane .current { color: var(--text-secondary); }

    .btn-retour {
      grid-column: 1 / -1;
      display: inline-block;
      justify-self: start;
      margin-bottom: 8px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* FEUILLE CHAPITRE                                             */
    /* ============================================================ */
    .feuille-chapitre {
      background: #ffffff;
      color: #1a1a1a;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.35;
      padding: 26px 30px 30px;
      border: 1px solid var(--border);
    }

    .feuille-chapitre .arabe,
    .feuille-chapitre [lang="ar"] {
      font-family: 'Janna LT Bold', 'Traditional Arabic', serif !important;
      font-size: 1.7em;
      line-height: 1;
      vertical-align: middle;
    }

    .feuille-chapitre .bandeau-titre {
      background: #f2f2f2;
      border-radius: 3px;
      padding: 10px 14px 9px;
      margin-bottom: 8px;
    }
    .feuille-chapitre .bandeau-titre .ligne-titre {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      text-align: left;
    }
    .feuille-chapitre .bandeau-titre h1 {
      font-family: 'Georgia', serif;
      font-size: 16pt;
      font-weight: bold;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
    }

    .feuille-chapitre .tags-haut {
      margin-top: 4px;
      margin-bottom: 4px;
      text-align: center;
    }
    .feuille-chapitre .tags-haut .memo-tag {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 9.5pt;
      color: #444;
      font-style: normal;
    }

    .feuille-chapitre .vocab-haut {
      margin-top: 3px;
      margin-bottom: 8px;
      text-align: center;
    }
    .feuille-chapitre .vocab-haut .titre-memo {
      display: inline;
      font-weight: 600;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-right: 6px;
    }
    .feuille-chapitre .vocab-haut .memo-mot {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      background: #faf8f4;
      border: 0.5px solid #bbb;
      border-radius: 10px;
      font-size: 9pt;
      color: #3a2e22;
      line-height: 1.35;
    }

    .feuille-chapitre .slides-zone {
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .feuille-chapitre .slide { margin-bottom: 8px; }
    .feuille-chapitre .slide p {
      font-size: 14.3pt;
      margin-bottom: 4px;
      text-align: justify;
      text-indent: 1.2em;
    }
    .feuille-chapitre .slide p em { font-style: italic; }

    .feuille-chapitre .slide p .source-marge {
      float: right;
      display: inline-block;
      margin: 6px 0 6px 16px;
      padding: 4px 0 0 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 12pt;
      font-weight: 700;
      font-style: normal;
      color: #333;
      text-align: right;
      max-width: 23%;
      line-height: 1.2;
      text-indent: 0;
      white-space: normal;
      vertical-align: top;
    }

    .feuille-chapitre .slide::after {
      content: "";
      display: table;
      clear: both;
    }
    .feuille-chapitre .print-img {
      display: block;
      height: auto;
      border: none;
      margin: 10px 0;
    }
    .feuille-chapitre .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-chapitre .print-img-gauche { float: left; margin: 6px 14px 8px 0; }
    .feuille-chapitre .print-img-droite { float: right; margin: 6px 0 8px 14px; }
    .feuille-chapitre .print-img-petit  { max-width: 150px; }
    .feuille-chapitre .print-img-moyen  { max-width: 220px; }
    .feuille-chapitre .print-img-grand  { max-width: 320px; }

    .feuille-chapitre .img-manquante {
      display: block;
      padding: 8px;
      border: 1px dashed #999;
      color: #666;
      font-size: 9pt;
      text-align: center;
      margin: 8px 0;
    }

    .feuille-chapitre .zone-memo {
      margin-top: 20px;
      padding: 10px 14px;
      background: #f7f7f7;
      border: 0.5px solid #ccc;
      border-left: 3px solid #999;
      border-radius: 3px;
    }
    .feuille-chapitre .zone-memo .titre-memo {
      font-weight: 600;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 6px;
    }
    .feuille-chapitre .zone-memo .titre-memo::before {
      content: "✦ ";
      color: #999;
      margin-right: 2px;
    }
    .feuille-chapitre .zone-memo .memo-liste {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .feuille-chapitre .zone-memo .memo-liste li {
      font-size: 11pt;
      margin-bottom: 3px;
      padding-left: 13px;
      position: relative;
      line-height: 1.4;
    }
    .feuille-chapitre .zone-memo .memo-liste li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #999;
      font-size: 6pt;
      top: 5px;
    }

    /* ============================================================ */
    /* ZONE BAS DU CHAPITRE (nav + boutons)                        */
    /* ============================================================ */
    .zone-bas-chapitre {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Navigation précédent/suivant */
    .nav-bas-chapitre {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-bas-chapitre a,
    .nav-bas-chapitre .nav-placeholder {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-bas-chapitre a:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .nav-bas-chapitre .nav-placeholder { opacity: 0.3; cursor: default; }
    .nav-bas-chapitre .nav-label {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .nav-bas-chapitre .nav-titre {
      font-family: 'Georgia', serif;
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.3;
    }
    .nav-bas-chapitre .nav-suivant { text-align: right; }
    .nav-bas-chapitre .nav-suivant .nav-label,
    .nav-bas-chapitre .nav-suivant .nav-titre { text-align: right; }

    /* Boutons d'action en bas */
       /* Boutons d'action en bas */
    .actions-bas-chapitre {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-action-bas {
      flex: 0 0 auto;
      width: 180px;
      height: 180px;
      padding: 20px 16px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.25s ease;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      line-height: 1.35;
    }
    .btn-action-bas .icone-btn {
      font-size: 34px;
      line-height: 1;
      opacity: 0.75;
      transition: all 0.25s ease;
    }
    .btn-action-bas .texte-btn {
      display: block;
      max-width: 130px;
    }
    .btn-action-bas:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
      transform: translateY(-2px);
    }
    .btn-action-bas:hover .icone-btn {
      opacity: 1;
      transform: scale(1.08);
    }
    .btn-action-bas.btn-elearning {
      border-color: #2d6a4f;
      color: #2d6a4f;
    }
    .btn-action-bas.btn-elearning:hover {
      background: #2d6a4f;
      color: #fff;
      border-color: #2d6a4f;
    }

    @media (max-width: 500px) {
      .btn-action-bas {
        width: 140px;
        height: 140px;
        font-size: 12px;
        gap: 10px;
      }
      .btn-action-bas .icone-btn { font-size: 28px; }
    }
    /* ============================================================ */
    /* COLONNE LATÉRALE                                             */
    /* ============================================================ */
    .colonne-laterale .bloc-section {
      margin-bottom: 24px;
      padding: 16px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .colonne-laterale .bloc-section:last-child { margin-bottom: 0; }

    .bloc-section .bloc-titre {
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bloc-section .bloc-titre .icone { font-size: 16px; opacity: 0.7; }
    .bloc-section .bloc-titre .compteur {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Bloc méta (Niveau + temps + dates) */
    .bloc-meta-chapitre {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .bloc-meta-chapitre .meta-ligne {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .bloc-meta-chapitre .meta-ligne .meta-icone {
      font-size: 14px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .bloc-meta-chapitre .meta-ligne .meta-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: auto;
    }
    .bloc-meta-chapitre .meta-ligne .meta-valeur {
      color: var(--text);
      font-weight: 500;
      text-align: right;
    }

    /* Encart livret */
    .encart-livret {
      display: flex;
      gap: 12px;
      align-items: stretch;
      padding: 12px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
    }
    .encart-livret:hover { border-color: var(--border-hover); }

    .encart-livret .mini-couverture {
      flex-shrink: 0;
      width: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 8px 6px;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .encart-livret .mini-couverture .badge-niveau-couv {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 3;
      padding: 1px 5px;
      font-size: 7px;
      font-weight: 500;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }
    .encart-livret .mini-couverture .contenu-couv {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding-top: 12px;
    }
    .encart-livret .mini-couverture .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .encart-livret .mini-couverture .edition-nom {
      font-weight: 700;
      font-style: italic;
      font-size: 6px;
      letter-spacing: 0.5px;
      opacity: 0.6;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
    }

    .encart-livret .encart-texte {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }
    .encart-livret .encart-label {
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .encart-livret .encart-nom-livret {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }
    .encart-livret .encart-cta {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .encart-livret:hover .encart-cta { color: var(--text); }

    /* Liste chapitres du même livret */
    .liste-chapitres {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 340px;
      overflow-y: auto;
    }
    .liste-chapitres .item-chapitre {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
    }
    .liste-chapitres .item-chapitre:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .liste-chapitres .item-chapitre.actuel {
      background: var(--bg-active);
      border-color: var(--border-hover);
      cursor: default;
    }
    .liste-chapitres .item-chapitre .item-titre {
      font-family: 'Georgia', serif;
      font-size: 13px;
      color: var(--text);
      font-weight: 400;
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    .liste-chapitres .item-chapitre.actuel .item-titre { font-weight: 700; }
    .liste-chapitres .item-chapitre .item-marqueur {
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .liste-chapitres .item-chapitre.actuel .item-marqueur {
      color: var(--text);
      font-weight: 600;
    }

    /* Galerie livrets */
    .galerie-livrets {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .carte-livret-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: #1a1a1a;
      position: relative;
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .carte-livret-mini:hover {
      transform: translateX(2px);
      border-color: var(--text);
    }
    .carte-livret-mini .badge-niveau {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 1px 6px;
      font-size: 8px;
      font-weight: 500;
      color: rgba(26, 26, 26, 0.85);
      background: rgba(255, 255, 255, 0.70);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .carte-livret-mini .couleur-pastille {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .carte-livret-mini .infos-livret {
      flex: 1;
      min-width: 0;
    }
    .carte-livret-mini .titre-livret {
      font-family: 'Georgia', serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .carte-livret-mini .sous-titre-livret {
      font-size: 10px;
      font-weight: 500;
      opacity: 0.75;
      color: rgba(26, 26, 26, 0.75);
      line-height: 1.3;
    }
    .carte-livret-mini.actuel {
      box-shadow: 0 0 0 2px var(--text);
    }
    .carte-livret-mini.actuel::after {
      content: "● Actuel";
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 8px;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 1px 6px;
      border-radius: 8px;
    }

    /* ============================================================ */
    /* BLOCS EN BAS (mobile uniquement)                             */
    /* ============================================================ */
    .zone-basse-mobile {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .zone-basse-mobile .bloc-section {
      padding: 16px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    @media (min-width: 1100px) {
      .zone-basse-mobile { display: none; }
    }
    @media (max-width: 1099px) {
      .colonne-laterale { display: none; }
    }

    /* ============================================================ */
    /* LOADER / ERREUR                                              */
    /* ============================================================ */
    .loader { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide-chapitre {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .vide-chapitre .icone {
      font-size: 40px; display: block;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .vide-chapitre h2 { font-size: 20px; color: var(--text); font-weight: 500; margin-bottom: 6px; }
    .vide-chapitre p { color: var(--text-secondary); font-size: 14px; }

    .devise {
      grid-column: 1 / -1;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .page-chapitre { padding: 12px 16px 40px; }
      .feuille-chapitre { padding: 20px 18px; font-size: 10pt; }
      .feuille-chapitre .bandeau-titre h1 { font-size: 13pt; }
      .feuille-chapitre .slide p { font-size: 12pt; }
      .feuille-chapitre .print-img-moyen,
      .feuille-chapitre .print-img-grand { max-width: 100%; }

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var chapitreActuel = null;
    var chapitresData = [];
    var imagesLivret = {};
    var livretsData = {};

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';
      return avant + spanSource + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateHeure(date) {
      try {
        var dateStr = date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
        var heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        return dateStr + ' à ' + heureStr;
      } catch(e) { return ''; }
    }

    // ============================================================
    // TROUVER UN CHAPITRE
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // CONSTRUCTION DU HTML DU CHAPITRE (texte)
    // ============================================================
    function construireHtmlChapitre(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};
      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Chapitre vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      parts.forEach(function(part) {
        part = part.trim();
        if (!part) return;
        if (part.startsWith('q:')) return;
        if (part.startsWith('qs:')) return;
        if (part.startsWith('o:')) return;
        if (part.startsWith('r:')) return;
        if (part.startsWith('l:')) return;
        if (part.startsWith('tt:')) return;
        if (part.startsWith('vf:')) return;
        if (part.startsWith('c:')) return;
        var cleanText = part.replace(/\r\n/g, '\n').trim();
        if (cleanText) {
          var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
          subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
        }
      });

      var blocsSlide = [];
      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;
          if (type === 'slide' && slidesArray[idx] !== undefined) {
            blocsSlide.push(slidesArray[idx]);
          }
        });
      }
      if (blocsSlide.length === 0) blocsSlide = slidesArray;

      var aRetenirClean = (chapitre.aRetenir || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var textePourCompter = '';
      blocsSlide.forEach(function(s) { textePourCompter += ' ' + s; });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 18));

      // Stockage pour réutilisation dans la colonne latérale
      chapitre._nbMots = nbMots;
      chapitre._tempsLecture = tempsLecture;

      var html = '';

      // Bandeau titre (sans les infos de livret)
      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + echapperHtml(chapitre.titre || 'Lecture') + '</h1>';
      html += '  </div>';
      html += '</div>';

      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + echapperHtml(t) + '</span>'; });
        html += '</div>';
      }

      if (vocabClean.length > 0) {
        html += '<div class="vocab-haut"><span class="titre-memo">Vocabulaire</span>';
        vocabClean.forEach(function(m) { html += '<span class="memo-mot">' + echapperHtml(m) + '</span>'; });
        html += '</div>';
      }

      html += '<div class="slides-zone">';
      blocsSlide.forEach(function(slideData) {
        html += '<div class="slide">';
        var lignesSlide = slideData.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();

        html += '</div>';
      });
      html += '</div>';

      if (aRetenirClean.length > 0) {
        html += '<div class="zone-memo">';
        html += '<div class="memo-bloc">';
        html += '<div class="titre-memo">À retenir</div>';
        html += '<ul class="memo-liste">';
        aRetenirClean.forEach(function(phrase) { html += '<li>' + echapperHtml(phrase) + '</li>'; });
        html += '</ul></div>';
        html += '</div>';
      }

      return html;
    }

    // ============================================================
    // ARABISER
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);

      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n);
      }

      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;

        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);

        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });

        parent.replaceChild(frag, texteNode);
      });
    }

    // ============================================================
    // FIL D'ARIANE
    // ============================================================
    function afficherFilAriane(chapitre) {
      var html = '';
      html += '<a href="/medit/index.html">Accueil</a>';
      html += '<span class="sep">›</span>';
      html += '<a href="/medit/livret.html">Tous les chapitres</a>';
      if (chapitre.categorie) {
        html += '<span class="sep">›</span>';
        html += '<a href="/medit/livret.html?cat=' + encodeURIComponent(chapitre.categorie) + '">' + echapperHtml(chapitre.categorie) + '</a>';
      }
      html += '<span class="sep">›</span>';
      html += '<span class="current">' + echapperHtml(chapitre.titre) + '</span>';

      var el = document.getElementById('filAriane');
      if (el) el.innerHTML = html;
    }

    // ============================================================
    // NAVIGATION DANS LE MÊME LIVRET
    // ============================================================
    function construireNavDansLivret(chapitre) {
      if (!chapitre.categorie) return {};

      var memeLivret = chapitresData.filter(function(c) {
        return (c.categorie || '') === (chapitre.categorie || '');
      });
      memeLivret = trierAlphabetique(memeLivret);

      var indexActuel = -1;
      for (var i = 0; i < memeLivret.length; i++) {
        if (String(memeLivret[i].id) === String(chapitre.id)) {
          indexActuel = i;
          break;
        }
      }

      return {
        liste: memeLivret,
        index: indexActuel,
        precedent: indexActuel > 0 ? memeLivret[indexActuel - 1] : null,
        suivant: indexActuel !== -1 && indexActuel < memeLivret.length - 1 ? memeLivret[indexActuel + 1] : null
      };
    }

    // ============================================================
    // GALERIE DE TOUS LES LIVRETS
    // ============================================================
    function construireGalerieLivrets(chapitreActuel) {
      var categoriesUniques = {};
      chapitresData.forEach(function(c) {
        var cat = c.categorie || 'Sans catégorie';
        if (!categoriesUniques[cat]) {
          categoriesUniques[cat] = {
            nom: cat,
            niveau: c.niveau || 1,
            nbChapitres: 0
          };
        }
        categoriesUniques[cat].nbChapitres++;
      });

      var livretsTries = Object.keys(categoriesUniques).sort(function(a, b) {
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });

      if (livretsTries.length === 0) return '';

      var html = '';
      html += '<div class="bloc-section">';
      html += '  <div class="bloc-titre">';
      html += '    <span class="icone">➡</span> Tous nos livrets';
      html += '    <span class="compteur">' + livretsTries.length + '</span>';
      html += '  </div>';
      html += '  <div class="galerie-livrets">';

      livretsTries.forEach(function(cat) {
        var info = categoriesUniques[cat];
        var livretMeta = livretsData[cat] || {};
        var couleur = livretMeta.couleur || '#2d6a4f';
        var sousTitre = livretMeta.sousTitre || '';

        var estActuel = (cat === chapitreActuel.categorie);

        html += '<a class="carte-livret-mini' + (estActuel ? ' actuel' : '') + '" ';
        html += '   href="/medit/livret.html?cat=' + encodeURIComponent(cat) + '" ';
        html += '   title="Voir les chapitres du livret ' + echapperHtml(cat) + '">';
        html += '  <span class="badge-niveau">Niv. ' + info.niveau + '</span>';
        html += '  <span class="couleur-pastille" style="background: ' + couleur + ';"></span>';
        html += '  <div class="infos-livret">';
        html += '    <div class="titre-livret">' + echapperHtml(cat) + '</div>';
        if (sousTitre) html += '    <div class="sous-titre-livret">' + echapperHtml(sousTitre) + '</div>';
        html += '  </div>';
        html += '</a>';
      });

      html += '  </div>';
      html += '</div>';

      return html;
    }

    // ============================================================
    // ZONE BAS DU CHAPITRE (nav + boutons)
    // ============================================================
    function construireZoneBasChapitre(chapitre) {
      var nav = construireNavDansLivret(chapitre);

      var html = '<div class="zone-bas-chapitre">';

      // 1. Navigation précédent/suivant
      html += '<div class="nav-bas-chapitre">';
      if (nav.precedent) {
        html += '<a href="/medit/chapitre.html?id=' + encodeURIComponent(nav.precedent.id) + '">';
        html += '  <span class="nav-label">← Précédent</span>';
        html += '  <span class="nav-titre">' + echapperHtml(nav.precedent.titre) + '</span>';
        html += '</a>';
      } else {
        html += '<div class="nav-placeholder">';
        html += '  <span class="nav-label">← Précédent</span>';
        html += '  <span class="nav-titre">Début du livret</span>';
        html += '</div>';
      }
      if (nav.suivant) {
        html += '<a href="/medit/chapitre.html?id=' + encodeURIComponent(nav.suivant.id) + '" class="nav-suivant">';
        html += '  <span class="nav-label">Suivant →</span>';
        html += '  <span class="nav-titre">' + echapperHtml(nav.suivant.titre) + '</span>';
        html += '</a>';
      } else {
        html += '<div class="nav-placeholder nav-suivant">';
        html += '  <span class="nav-label">Suivant →</span>';
        html += '  <span class="nav-titre">Fin du livret</span>';
        html += '</div>';
      }
      html += '</div>';

      // 2. Boutons : Imprimer + E-learning
      html += '<div class="actions-bas-chapitre">';
      html += '  <button class="btn-action-bas btn-imprimer" onclick="imprimerChapitre(\'' +
              chapitre.id + '\', \'' +
              (chapitre.titre || '').replace(/'/g, "\\'") + '\', chapitresData)">' +
              'Imprimer le textes et le quiz' +
              '</button>';
      html += '  <a class="btn-action-bas btn-elearning" href="/medit/quiz.html?id=' + encodeURIComponent(chapitre.id) + '">' +
              'Passer le quiz en ligne' +
              '</a>';
      html += '</div>';

      html += '</div>';

      return html;
    }

    // ============================================================
    // COLONNE LATÉRALE
    // ============================================================
    function construireZoneLaterale(chapitre) {
      var nav = construireNavDansLivret(chapitre);
      var livretInfo = livretsData[chapitre.categorie] || {};

      var html = '';

      // 1. Méta (Niveau + temps + écrit + imprimé)
      var niveau = chapitre.niveau || 0;
      var tempsLecture = chapitre._tempsLecture || 1;
      var dateEcrit = formatDateLongue(chapitre.date);
      var dateImprime = formatDateHeure(new Date());

      html += '<div class="bloc-section">';
      html += '  <div class="bloc-titre"><span class="icone"></span> Informations</div>';
      html += '  <div class="bloc-meta-chapitre">';
      html += '    <div class="meta-ligne">';
      html += '      <span class="meta-icone"></span>';
      html += '      <span class="meta-label">Niveau</span>';
      html += '      <span class="meta-valeur">' + niveau + '</span>';
      html += '    </div>';
      html += '    <div class="meta-ligne">';
      html += '      <span class="meta-icone">⏱</span>';
      html += '      <span class="meta-label">Temps de lecture avec le maître</span>';
      html += '      <span class="meta-valeur">' + tempsLecture + ' min</span>';
      html += '    </div>';
      if (dateEcrit) {
        html += '    <div class="meta-ligne">';
        html += '      <span class="meta-icone"></span>';
        html += '      <span class="meta-label">Écrit le</span>';
        html += '      <span class="meta-valeur">' + echapperHtml(dateEcrit) + '</span>';
        html += '    </div>';
      }
      html += '  </div>';
      html += '</div>';

      // 2. Encart livret
      if (chapitre.categorie) {
        var couleur = livretInfo.couleur || '#2d6a4f';
        var sousTitre = livretInfo.sousTitre || '';

        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre"><span class="icone">📖</span> Livret</div>';
        html += '  <a class="encart-livret" href="/medit/livret.html?cat=' + encodeURIComponent(chapitre.categorie) + '">';
        html += '    <div class="mini-couverture" style="background: ' + couleur + '; border-color: ' + couleur + ';">';
        html += '      <span class="badge-niveau-couv">Niv. ' + niveau + '</span>';
        html += '      <div class="contenu-couv">';
        html += '        <div>';
        html += '          <div class="titre-couv">' + echapperHtml(chapitre.categorie) + '</div>';
        html += '        </div>';
        html += '        <div class="edition-nom">Qiraat</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="encart-texte">';
        html += '      <div class="encart-label">Extrait du livret</div>';
        html += '      <div class="encart-nom-livret">' + echapperHtml(chapitre.categorie) + '</div>';
        html += '      <div class="encart-cta">Voir le livret →</div>';
        html += '    </div>';
        html += '  </a>';
        html += '</div>';
      }

      // 3. Liste "Dans ce livret"
      if (nav.liste && nav.liste.length > 1) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">';
        html += '    <span class="icone">🕮</span> Dans ce livret';
        html += '    <span class="compteur">' + nav.liste.length + '</span>';
        html += '  </div>';
        html += '  <div class="liste-chapitres">';

        nav.liste.forEach(function(c) {
          var estActuel = String(c.id) === String(chapitre.id);
          if (estActuel) {
            html += '<div class="item-chapitre actuel">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">●</span>';
            html += '</div>';
          } else {
            html += '<a class="item-chapitre" href="/medit/chapitre.html?id=' + encodeURIComponent(c.id) + '">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">→</span>';
            html += '</a>';
          }
        });

        html += '  </div>';
        html += '</div>';
      }

      // 4. Galerie livrets
      html += construireGalerieLivrets(chapitre);

      return html;
    }

    // ============================================================
    // ZONE BASSE MOBILE
    // ============================================================
    function construireZoneBasseMobile(chapitre) {
      // On réutilise les mêmes blocs que la colonne latérale
      return construireZoneLaterale(chapitre);
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerChapitre() {
      var params = new URLSearchParams(window.location.search);
      var chapitreId = params.get('id');

      if (!chapitreId) { afficherErreur('Aucun chapitre spécifié.'); return; }

      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          chapitresData = data.tousLesChapitres || data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                description: l.description || '',
                auteur: l.auteur || ''
              };
            });
          }

          chapitreActuel = trouverChapitre(chapitreId, chapitresData);

          if (!chapitreActuel) {
            afficherErreur('Chapitre introuvable.');
            return;
          }

          if (chapitreActuel.categorie && typeof chargerImagesLivret === 'function') {
            chargerImagesLivret(chapitreActuel.categorie)
              .then(function(images) {
                imagesLivret = images || {};
                afficherChapitre(chapitreActuel);
              })
              .catch(function() {
                imagesLivret = {};
                afficherChapitre(chapitreActuel);
              });
          } else {
            afficherChapitre(chapitreActuel);
          }
        })
        .catch(function(error) {
          console.error('❌ Erreur:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];

            livretsData = {};
            if (cache.livrets && Array.isArray(cache.livrets)) {
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  description: l.description || '',
                  auteur: l.auteur || ''
                };
              });
            }

            chapitreActuel = trouverChapitre(chapitreId, chapitresData);
            if (chapitreActuel) {
              afficherChapitre(chapitreActuel);
              return;
            }
          }
          afficherErreur('Erreur de chargement.');
        });
    }

    // ============================================================
    // AFFICHER LE CHAPITRE
    // ============================================================
    function afficherChapitre(chapitre) {
      var container = document.getElementById('chapitreContainer');
      var colonneLaterale = document.getElementById('colonneLaterale');
      var zoneBasseMobile = document.getElementById('zoneBasseMobile');

      var contenuHtml = construireHtmlChapitre(chapitre, imagesLivret);
      var zoneBasHtml = construireZoneBasChapitre(chapitre);

      // Colonne principale : texte + zone bas (nav + boutons)
      container.innerHTML =
        '<div class="feuille-chapitre">' + contenuHtml + '</div>' +
        zoneBasHtml;

      // Colonne latérale (grand écran)
      colonneLaterale.innerHTML = construireZoneLaterale(chapitre);

      // Zone basse (mobile)
      zoneBasseMobile.innerHTML = construireZoneBasseMobile(chapitre);

      arabiserDans(container);
      afficherFilAriane(chapitre);

      document.title = chapitre.titre + ' - Qiraat';
    }

    // ============================================================
    // ERREUR
    // ============================================================
    function afficherErreur(message) {
      document.getElementById('chapitreContainer').innerHTML = `
        <div class="vide-chapitre">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux chapitres.</p>
          <a href="/medit/livret.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux chapitres</a>
        </div>
      `;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerChapitre);
    } else {
      chargerChapitre();
    }
  </script>

</body>
