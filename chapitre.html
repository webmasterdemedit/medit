<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Chapitre - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    /* ============================================================ */
    /* FONDS VERTS D'EAU                                            */
    /* ============================================================ */

    /* Fond général de la page (derrière tout) — vert d'eau très très clair */
    html, body {
      background: #f4fbf8 !important;
    }

    /* Header — vert d'eau */
    .site-header,
    .lecture-header,
    header {
      background: #d4ebe4 !important;
      border-bottom: 1px solid #b8d9cf !important;
    }

    /* ============================================================ */
    /* LAYOUT GLOBAL                                                */
    /* ============================================================ */
    .page-chapitre {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 30px 60px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 1100px) {
      .page-chapitre {
        grid-template-columns: minmax(0, 820px) 360px;
        align-items: start;
      }
      .colonne-principale { grid-column: 1; }
      .colonne-laterale  { grid-column: 2; position: sticky; top: 20px; }
    }

    /* ============================================================ */
    /* FIL D'ARIANE                                                 */
    /* ============================================================ */
    .fil-ariane {
      grid-column: 1 / -1;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .fil-ariane a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .fil-ariane a:hover { color: var(--text); border-bottom-color: var(--text); }
    .fil-ariane .sep { color: var(--text-muted); opacity: 0.6; }
    .fil-ariane .current { color: var(--text-secondary); }

    .btn-retour {
      grid-column: 1 / -1;
      display: inline-block;
      justify-self: start;
      margin-bottom: 8px;
      padding: 6px 18px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-retour:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ============================================================ */
    /* FEUILLE CHAPITRE — FOND PAPIER BLANC TRÈS SUBTIL              */
    /* ============================================================ */
    .feuille-chapitre,
    .feuille-chapitre * {
      background: #fffefb !important;
      border-color: #e8e2d0;
    }

    .feuille-chapitre {
      color: #1a1a1a;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.35;
      padding: 26px 30px 30px;
      border: 1px solid #e8e2d0;
    }

    .feuille-chapitre .arabe,
    .feuille-chapitre [lang="ar"] {
      font-family: 'Janna LT Bold', 'Traditional Arabic', serif !important;
      font-size: 1.7em;
      line-height: 1;
      vertical-align: middle;
    }

    .feuille-chapitre .bandeau-titre {
      border-radius: 3px;
      padding: 10px 14px 9px;
      margin-bottom: 8px;
    }
    .feuille-chapitre .bandeau-titre .ligne-titre {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      text-align: left;
    }
    .feuille-chapitre .bandeau-titre h1 {
      font-family: 'Georgia', serif;
      font-size: 16pt;
      font-weight: bold;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
    }

    .feuille-chapitre .tags-haut {
      margin-top: 4px;
      margin-bottom: 8px;
      text-align: center;
    }
    .feuille-chapitre .tags-haut .memo-tag {
      display: inline-block;
      padding: 1px 9px;
      margin: 1px 3px;
      border-radius: 10px;
      font-size: 9.5pt;
      color: #444;
      font-style: normal;
      border: 1px solid #e8e2d0;
    }

    .feuille-chapitre .slides-zone {
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .feuille-chapitre .slide { margin-bottom: 8px; }
    .feuille-chapitre .slide p {
      font-size: 14.3pt;
      margin-bottom: 4px;
      text-align: justify;
      text-indent: 1.2em;
    }
    .feuille-chapitre .slide p em { font-style: italic; }

    .feuille-chapitre .slide p .source-marge {
      float: right;
      display: inline-block;
      margin: 6px 0 6px 16px;
      padding: 4px 0 0 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 12pt;
      font-weight: 700;
      font-style: normal;
      color: #333;
      text-align: right;
      max-width: 23%;
      line-height: 1.2;
      text-indent: 0;
      white-space: normal;
      vertical-align: top;
    }

    .feuille-chapitre .slide::after {
      content: "";
      display: table;
      clear: both;
    }
    .feuille-chapitre .print-img {
      display: block;
      height: auto;
      border: none;
      margin: 10px 0;
    }
    .feuille-chapitre .print-img-centre { margin-left: auto; margin-right: auto; }
    .feuille-chapitre .print-img-gauche { float: left; margin: 6px 14px 8px 0; }
    .feuille-chapitre .print-img-droite { float: right; margin: 6px 0 8px 14px; }
    .feuille-chapitre .print-img-petit  { max-width: 150px; }
    .feuille-chapitre .print-img-moyen  { max-width: 220px; }
    .feuille-chapitre .print-img-grand  { max-width: 320px; }

    .feuille-chapitre .img-manquante {
      display: block;
      padding: 8px;
      border: 1px dashed #999;
      color: #666;
      font-size: 9pt;
      text-align: center;
      margin: 8px 0;
    }

    /* ============================================================ */
    /* EXERCICES DANS LA FEUILLE CHAPITRE                           */
    /* ============================================================ */
    .feuille-chapitre .exercices-zone {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e8e2d0;
    }

    .feuille-chapitre .titre-exercices {
      font-family: 'Georgia', serif;
      font-size: 14pt;
      font-weight: bold;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e8e2d0;
    }

    .feuille-chapitre .exo {
      margin-bottom: 16px;
      padding: 12px 14px 10px;
      border: 1px solid #e8e2d0;
      border-radius: 4px;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .feuille-chapitre .exo:last-child {
      margin-bottom: 0;
    }

    .feuille-chapitre .consigne-exo {
      font-size: 8.5pt;
      font-weight: 600;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      padding: 3px 10px;
      border-left: 2.5px solid #888;
      border-radius: 2px;
    }
    .feuille-chapitre .consigne-exo::before {
      content: "◆ ";
      color: #888;
      font-size: 7pt;
      margin-right: 2px;
    }

    .feuille-chapitre .exo-ligne {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
    }

    .feuille-chapitre .exo-num-inline {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 17px;
      text-align: center;
      background: transparent !important;
      color: #1a1a1a;
      border: 0.8px solid #1a1a1a;
      border-radius: 50%;
      font-weight: bold;
      font-size: 9pt;
      flex-shrink: 0;
    }
    .feuille-chapitre .exo-texte {
      flex: 1;
      font-size: 11pt;
      line-height: 1.45;
    }

    .feuille-chapitre .quiz-reponses { margin-left: 26px; margin-top: 4px; }
    .feuille-chapitre .quiz-rep { display: block; margin-bottom: 2px; font-size: 11pt; }
    .feuille-chapitre .quiz-case {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 0.8px solid #333;
      margin-right: 6px;
      vertical-align: middle;
      background: #ffffff !important;
      border-radius: 1px;
    }

    .feuille-chapitre .open-lignes { margin-top: 6px; margin-left: 26px; }
    .feuille-chapitre .open-ligne {
      border-bottom: 0.5px dotted #999;
      height: 18px;
      margin-bottom: 12px;
    }

    .feuille-chapitre .carte-ligne-courte {
      margin-top: 6px;
      margin-left: 26px;
      width: 50%;
      border-bottom: 0.5px dotted #999;
      height: 18px;
    }

    .feuille-chapitre .ordre-grille {
      margin: 6px 0 4px 26px;
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 14px;
      row-gap: 4px;
      font-size: 11pt;
    }
    .feuille-chapitre .ordre-cell-texte { white-space: nowrap; }
    .feuille-chapitre .ordre-cell-pointille {
      white-space: nowrap;
      color: #333;
      align-self: center;
      font-size: 10pt;
    }
    .feuille-chapitre .ordre-lettre { font-weight: bold; color: #333; }

    .feuille-chapitre .tt-phrase-print {
      flex: 1;
      font-size: 11pt;
      line-height: 1.6;
    }
    .feuille-chapitre .tt-phrase-print .tt-trou {
      display: inline-block;
      min-width: 90px;
      border-bottom: 0.8px solid #333;
      text-align: center;
      padding: 0 6px;
    }

    .feuille-chapitre .exo-texte-vf {
      font-size: 11pt;
      line-height: 1.45;
      flex: 1;
    }
    .feuille-chapitre .vf-ligne .vf-cases {
      font-size: 10pt;
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .feuille-chapitre .relier-zone-lignes {
      position: relative;
      margin: 6px 0 6px 26px;
      max-width: 100%;
    }
    .feuille-chapitre .relier-lignes-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 60px;
    }
    .feuille-chapitre .relier-col-lignes {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .feuille-chapitre .relier-ligne-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11pt;
      padding: 2px 0;
      min-height: 18px;
    }
    .feuille-chapitre .relier-col-lignes.gauche .relier-ligne-item { justify-content: flex-end; text-align: right; }
    .feuille-chapitre .relier-col-lignes.droite .relier-ligne-item { justify-content: flex-start; text-align: left; }
    .feuille-chapitre .relier-point {
      width: 9px;
      height: 9px;
      border: 1px solid #333;
      border-radius: 50%;
      background: #ffffff !important;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .feuille-chapitre .relier-point.relier-point-partage { border-radius: 0; }

    .feuille-chapitre .bloc-copier {
      margin-top: 4px;
      width: 100%;
    }

    .feuille-chapitre .copier-mots {
      text-align: right;
      direction: rtl;
      font-family: 'Janna LT Bold', 'Traditional Arabic', 'Amiri', serif;
      font-size: 2.2em;
      line-height: 1;
      color: #1a1a1a;
      padding: 2px 0 0;
      word-spacing: 14px;
      position: relative;
      display: block;
      margin-bottom: 8px;
    }

    .feuille-chapitre .copier-mots .copier-mot {
      display: inline-block;
      white-space: nowrap;
      direction: rtl;
    }

    .feuille-chapitre .copier-mots::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.28em;
      height: 1px;
      background: #333 !important;
      pointer-events: none;
    }

    .feuille-chapitre .copier-ligne-pointillee {
      width: 100%;
      height: 22px;
      border-bottom: 1px dotted #5a4a3a;
      margin-top: 2px;
    }

    /* ============================================================ */
    /* BLOC À RETENIR                                               */
    /* ============================================================ */
    .bloc-a-retenir {
      margin-top: 24px;
      background: #fffefb !important;
      border: 1px solid #e8e2d0;
      border-left: 4px solid #2d6a4f;
      padding: 18px 22px 16px;
    }
    .bloc-a-retenir .bloc-a-retenir-titre {
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: #2d6a4f;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e8e2d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bloc-a-retenir .bloc-a-retenir-titre::before {
      content: "✦";
      color: #2d6a4f;
      font-size: 16px;
    }
    .bloc-a-retenir .bloc-a-retenir-liste {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .bloc-a-retenir .bloc-a-retenir-liste li {
      font-family: 'Georgia', serif;
      font-size: 14px;
      line-height: 1.55;
      color: #1a1a1a;
      padding: 6px 0 6px 22px;
      position: relative;
      border-bottom: 1px dashed #e8e2d0;
    }
    .bloc-a-retenir .bloc-a-retenir-liste li:last-child {
      border-bottom: none;
    }
    .bloc-a-retenir .bloc-a-retenir-liste li::before {
      content: "●";
      position: absolute;
      left: 4px;
      top: 10px;
      color: #2d6a4f;
      font-size: 7pt;
    }

    /* ============================================================ */
    /* BLOC ACTIONS — BOUTONS DANS LA COLONNE LATÉRALE              */
    /* ============================================================ */
    .bloc-actions-chapitre {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action-lateral {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-action-lateral:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }
    .btn-action-lateral.btn-elearning {
      border-color: #2d6a4f;
      color: #2d6a4f;
    }
    .btn-action-lateral.btn-elearning:hover {
      background: #2d6a4f;
      color: #fff;
      border-color: #2d6a4f;
    }

    /* ============================================================ */
    /* ZONE BAS DU CHAPITRE (nav uniquement)                        */
    /* ============================================================ */
    .zone-bas-chapitre {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-bas-chapitre {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-bas-chapitre a,
    .nav-bas-chapitre .nav-placeholder {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-bas-chapitre a:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
    }
    .nav-bas-chapitre .nav-placeholder { opacity: 0.3; cursor: default; }
    .nav-bas-chapitre .nav-label {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .nav-bas-chapitre .nav-titre {
      font-family: 'Georgia', serif;
      font-size: 15px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.3;
    }
    .nav-bas-chapitre .nav-suivant { text-align: right; }
    .nav-bas-chapitre .nav-suivant .nav-label,
    .nav-bas-chapitre .nav-suivant .nav-titre { text-align: right; }

    /* ============================================================ */
    /* COLONNE LATÉRALE — CADRES VERT D'EAU CLAIR                  */
    /* ============================================================ */
    .colonne-laterale .bloc-section {
      margin-bottom: 24px;
      padding: 16px 18px;
      background: #e8f5f0 !important;
      border: 1px solid #b8d9cf !important;
    }
    .colonne-laterale .bloc-section:last-child { margin-bottom: 0; }

    .bloc-section .bloc-titre {
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #b8d9cf;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bloc-section .bloc-titre .icone { font-size: 16px; opacity: 0.7; }
    .bloc-section .bloc-titre .compteur {
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Bloc méta (Niveau + temps + dates) */
    .bloc-meta-chapitre {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .bloc-meta-chapitre .meta-ligne {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.55) !important;
      border: 1px solid #b8d9cf;
    }
    .bloc-meta-chapitre .meta-ligne .meta-icone {
      font-size: 14px;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .bloc-meta-chapitre .meta-ligne .meta-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: auto;
    }
    .bloc-meta-chapitre .meta-ligne .meta-valeur {
      color: var(--text);
      font-weight: 500;
      text-align: right;
    }

    /* Bloc vocabulaire */
    .bloc-vocabulaire {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bloc-vocabulaire .vocab-mot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.55) !important;
      border: 1px solid #b8d9cf;
      font-family: 'Georgia', serif;
      font-size: 13px;
      color: #3a2e22;
      line-height: 1.35;
    }
    .bloc-vocabulaire .vocab-mot::before {
      content: "◆";
      color: #6a9a8a;
      font-size: 7pt;
      flex-shrink: 0;
    }

    /* Encart livret */
    .encart-livret {
      display: flex;
      gap: 12px;
      align-items: stretch;
      padding: 12px;
      background: rgba(255, 255, 255, 0.55) !important;
      border: 1px solid #b8d9cf;
      text-decoration: none;
      transition: all 0.2s;
    }
    .encart-livret:hover { border-color: #6a9a8a; }

    .encart-livret .mini-couverture {
      flex-shrink: 0;
      width: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 8px 6px;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
      border: 1px solid #b8d9cf;
    }
    .encart-livret .mini-couverture .badge-niveau-couv {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 3;
      padding: 1px 5px;
      font-size: 7px;
      font-weight: 500;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }
    .encart-livret .mini-couverture .contenu-couv {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      padding-top: 12px;
    }
    .encart-livret .mini-couverture .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var chapitreActuel = null;
    var chapitresData = [];
    var imagesLivret = {};
    var livretsData = {};

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function rendreSources(texte) {
      if (!/\[[^\]]+\]/.test(texte)) return texte;
      var matchSource = texte.match(/\[([^\]]+)\]\.?/);
      if (!matchSource) return texte;
      var contenuSource = matchSource[1].trim();
      var texteSansSource = texte.replace(/\[[^\]]+\]\.?/, '').trim();
      var texteAvant = texteSansSource;
      var idxDernierePonctuation = -1;
      for (var i = texteAvant.length - 1; i >= 0; i--) {
        var c = texteAvant.charAt(i);
        if (c === '.' || c === '!' || c === '?') { idxDernierePonctuation = i; break; }
      }
      var idxDebutPhrase = 0;
      if (idxDernierePonctuation !== -1) {
        for (var j = idxDernierePonctuation - 1; j >= 0; j--) {
          var c2 = texteAvant.charAt(j);
          if (c2 === '.' || c2 === '!' || c2 === '?') { idxDebutPhrase = j + 1; break; }
        }
      }
      var avant = texteAvant.substring(0, idxDebutPhrase);
      var phrase = texteAvant.substring(idxDebutPhrase);
      var spanSource = '<span class="source-marge">' + contenuSource + '</span>';
      return avant + spanSource + phrase;
    }

    function rendreCitations(texte) {
      if (!texte || texte.indexOf('"') === -1) return texte;
      return texte.replace(/["“]([^"”]+)["”]/g, '<em>« $1 »</em>');
    }

    function trierAlphabetique(arr) {
      return arr.slice().sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });
    }

    function formatDateLongue(dateStr) {
      if (!dateStr) return '';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function formatDateHeure(date) {
      try {
        var dateStr = date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
        var heureStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        return dateStr + ' à ' + heureStr;
      } catch(e) { return ''; }
    }

    // ============================================================
    // TROUVER UN CHAPITRE
    // ============================================================
    function trouverChapitre(chapitreId, chapitresDataParam) {
      if (chapitresDataParam && chapitresDataParam.length > 0) {
        for (var i = 0; i < chapitresDataParam.length; i++) {
          if (String(chapitresDataParam[i].id) === String(chapitreId)) {
            return chapitresDataParam[i];
          }
        }
      }
      var tous = DataManager.getTousLesChapitres();
      for (var j = 0; j < tous.length; j++) {
        if (String(tous[j].id) === String(chapitreId)) {
          return tous[j];
        }
      }
      return null;
    }

    // ============================================================
    // ✅ PARSERS D'EXERCICES (copiés depuis impression.js)
    // ============================================================
    function parserQuizsPourImpression(quizTexte) {
      var lignes = quizTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var quizs = [];
      var currentQuiz = null;
      var lettres = ['A', 'B', 'C', 'D', 'E', 'F'];

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        if (ligne.match(/^q:/i)) {
          if (currentQuiz && currentQuiz.reponses.length > 0) {
            quizs.push(currentQuiz);
          }
          currentQuiz = {
            question: ligne.replace(/^q:\s*/i, '').trim() || 'Question',
            reponses: []
          };
        } else if (currentQuiz) {
          var texteRep = ligne;
          if (/^v\s/i.test(ligne) || /^-v-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^v\s+|-v-\s*/i, '').trim();
          } else if (/^f\s/i.test(ligne) || /^-f-\s*/.test(ligne)) {
            texteRep = ligne.replace(/^f\s+|-f-\s*/i, '').trim();
          }
          if (texteRep) {
            currentQuiz.reponses.push({
              texte: texteRep || 'Réponse',
              lettre: lettres[currentQuiz.reponses.length] || '?'
            });
          }
        }
      }

      if (currentQuiz && currentQuiz.reponses.length > 0) {
        quizs.push(currentQuiz);
      }
      return quizs;
    }

    function parserOrdrePourImpression(ordreTexte) {
      var lignes = ordreTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var elements = [];
      var consigne = 'Remettre dans l\'ordre';

      for (var i = 0; i < lignes.length; i++) {
        var ligne = lignes[i];
        var match = ligne.match(/^(\d+)\s+(.+)/);
        if (match) {
          elements.push(match[2]);
        } else if (elements.length === 0 && ligne.length > 0) {
          consigne = ligne.replace(/^o:\s*/i, '').trim() || consigne;
        }
      }
      return { elements: elements, consigne: consigne };
    }

    function parserCartesPourImpression(carteTexte) {
      var lignes = carteTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var cartes = [];
      var current = null;

      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        if (l.toLowerCase().startsWith('r:')) {
          if (current) cartes.push(current);
          current = { recto: l.replace(/^r:\s*/i, '').trim(), verso: '' };
        } else if (l.toLowerCase().startsWith('v:') && current) {
          current.verso = l.replace(/^v:\s*/i, '').trim();
        }
      }
      if (current) cartes.push(current);
      return cartes;
    }

    function parserRelierPourImpression(relierTexte) {
      var lignes = relierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });

      if (lignes.length === 0) return null;

      var consigne = lignes[0].replace(/^l:\s*/i, '').trim() || 'Relie les éléments';
      var paires = [];

      for (var i = 1; i < lignes.length; i++) {
        var idx = lignes[i].indexOf('-');
        if (idx === -1) continue;
        var gauche = lignes[i].substring(0, idx).trim();
        var droite = lignes[i].substring(idx + 1).trim();
        if (gauche && droite) {
          paires.push({ gauche: gauche, droite: droite });
        }
      }

      if (paires.length === 0) return null;

      var compteParDroite = {};
      paires.forEach(function(p) {
        compteParDroite[p.droite] = (compteParDroite[p.droite] || 0) + 1;
      });

      var droitesUniques = [];
      var dejaVues = {};
      paires.forEach(function(p) {
        if (!dejaVues[p.droite]) {
          dejaVues[p.droite] = true;
          droitesUniques.push({
            droite: p.droite,
            partagee: compteParDroite[p.droite] > 1
          });
        }
      });

      for (var j = droitesUniques.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = droitesUniques[j];
        droitesUniques[j] = droitesUniques[k];
        droitesUniques[k] = tmp;
      }

      return { consigne: consigne, paires: paires, droitesMelangees: droitesUniques };
    }

    function parserTextesTrousPourImpression(ttTexte) {
      var lignes = ttTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var resultats = [];

      lignes.forEach(function(ligne) {
        if (!/^tt:/i.test(ligne)) return;
        var contenu = ligne.replace(/^tt:\s*/i, '').trim();
        var match = contenu.match(/\/([^\/]+)\//);
        if (!match) return;
        var mot = match[1].trim();
        var idx = contenu.indexOf('/' + mot + '/');
        var avant = contenu.substring(0, idx).trim();
        var apres = contenu.substring(idx + mot.length + 2).trim();
        resultats.push({ avant: avant, mot: mot, apres: apres });
      });

      return resultats;
    }

    function parserVraiFauxPourImpression(vfTexte) {
      var lignes = vfTexte.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l !== ''; });
      var questions = [];

      lignes.forEach(function(ligne) {
        if (!/^vf:/i.test(ligne)) return;
        var contenu = ligne.replace(/^vf:\s*/i, '').trim();
        var match = contenu.match(/\(([vf])\)\s*$/i);
        if (!match) return;
        var question = contenu.replace(/\s*\([vf]\)\s*$/i, '').trim();
        if (question === '') return;
        questions.push(question);
      });

      return questions;
    }

    function parserCopierPourImpression(copierTexte) {
      if (!copierTexte) return [];
      var lignes = copierTexte.split('\n')
        .map(function(l) { return l.trim(); })
        .filter(function(l) { return l !== ''; });
      var blocs = [];
      lignes.forEach(function(ligne) {
        var contenu = ligne.replace(/^c:\s*/i, '').trim();
        if (!contenu) return;
        var mots = contenu.split(',')
          .map(function(m) { return m.trim(); })
          .filter(function(m) { return m !== ''; });
        if (mots.length > 0) blocs.push({ mots: mots });
      });
      return blocs;
    }

    // ============================================================
    // ✅ CONSTRUCTION DES EXERCICES POUR LA FEUILLE CHAPITRE
    // ============================================================
    function construireExercicesPourFeuille(blocsOrdonnes) {
      var html = '';
      var exoNum = 0;
      var hasExercice = false;

      function typeLogique(t) {
        if (t === 'carte') return 'open';
        return t;
      }

      var consignesBase = {
        quiz:   { sing: 'Cochez la bonne réponse :',  plur: 'Cochez la bonne réponse :' },
        open:   { sing: 'Répondez à la question :',   plur: 'Répondez aux questions :' },
        tt:     { sing: 'Complétez la phrase :',      plur: 'Complétez les phrases :' },
        vf:     { sing: 'Cochez Vrai ou Faux :',      plur: 'Cochez Vrai ou Faux :' },
        ordre:  { sing: 'Remettez dans l\'ordre :',   plur: 'Remettez dans l\'ordre :' },
        relier: { sing: 'Reliez les éléments :',      plur: 'Reliez les éléments :' },
        copier: { sing: 'Recopiez :',                 plur: 'Recopiez :' }
      };

      var iGroupe = 0;
      while (iGroupe < blocsOrdonnes.length) {
        var blocCourant = blocsOrdonnes[iGroupe];
        var typeCourant = typeLogique(blocCourant.type);
        if (typeCourant === 'slide') {
          iGroupe++;
          continue;
        }

        var nbConsecutifs = 1;
        var jGroupe = iGroupe + 1;
        while (jGroupe < blocsOrdonnes.length && typeLogique(blocsOrdonnes[jGroupe].type) === typeCourant) {
          nbConsecutifs++;
          jGroupe++;
        }

        if (typeCourant === 'vf') {
          nbConsecutifs = (nbConsecutifs - 1) + blocCourant.data.length;
        }

        var base = consignesBase[typeCourant];
        if (base) {
          var consigneFinale = (nbConsecutifs > 1) ? base.plur : base.sing;
          blocCourant._consigne = consigneFinale;
          for (var kGroupe = iGroupe + 1; kGroupe < jGroupe; kGroupe++) {
            blocsOrdonnes[kGroupe]._consigne = '';
          }
        }

        iGroupe = jGroupe;
      }

      function afficherConsigne(bloc) {
        if (bloc._consigne) {
          html += '<div class="consigne-exo">' + bloc._consigne + '</div>';
        }
      }

      blocsOrdonnes.forEach(function(bloc) {

        if (bloc.type === 'slide') return;

        if (bloc.type === 'copier') {
          hasExercice = true;
          exoNum++;
          var mots = bloc.data.mots;

          html += '<div class="exo">';
          afficherConsigne(bloc);

    // ============================================================
    // ✅ CONSTRUCTION DU HTML DU CHAPITRE (texte + exercices)
    // ============================================================
    function construireHtmlChapitre(chapitre, imagesLivret) {
      imagesLivret = imagesLivret || {};
      var contenu = chapitre.contenu || '';
      if (!contenu) return '<p><em>Chapitre vide.</em></p>';

      var ordreBlocs = chapitre.ordreBlocs || [];
      var parts = contenu.split(' | ');

      var slidesArray = [];
      var quizTexte = '';
      var openTexte = '';
      var ordreTexte = '';
      var carteTexte = '';
      var relierTexte = '';
      var ttTexte = '';
      var vfTexte = '';
      var copierTexte = '';

      parts.forEach(function(part) {
        part = part.trim();

        if (part.startsWith('q:')) {
          quizTexte = quizTexte ? quizTexte + '\n\n' + part : part;
        } else if (part.startsWith('qs:')) {
          openTexte = openTexte ? openTexte + '\n\n' + part : part;
        } else if (part.startsWith('o:')) {
          ordreTexte = ordreTexte ? ordreTexte + '\n\n' + part : part;
        } else if (part.startsWith('r:')) {
          carteTexte = carteTexte ? carteTexte + '\n\n' + part : part;
        } else if (part.startsWith('l:')) {
          relierTexte = relierTexte ? relierTexte + '\n\n' + part : part;
        } else if (part.startsWith('tt:')) {
          ttTexte = ttTexte ? ttTexte + '\n' + part : part;
        } else if (part.startsWith('vf:')) {
          vfTexte = vfTexte ? vfTexte + '\n' + part : part;
        } else if (part.startsWith('c:')) {
          copierTexte = copierTexte ? copierTexte + '\n' + part : part;
        } else {
          var cleanText = part.replace(/\r\n/g, '\n').trim();
          if (cleanText) {
            var subSlides = cleanText.split(/\n\s*\n/).filter(function(s) { return s.trim() !== ''; });
            subSlides.forEach(function(sub) { slidesArray.push(sub.trim()); });
          }
        }
      });

      var quizsParsed = quizTexte ? parserQuizsPourImpression(quizTexte) : [];
      var opensParsed = [];
      if (openTexte) {
        openTexte.split('\n\n').forEach(function(bloc) {
          var t = bloc.replace(/^qs:\s*/i, '').trim();
          if (t) opensParsed.push(t);
        });
      }
      var ordresParsed = [];
      if (ordreTexte) {
        ordreTexte.split('\n\n').forEach(function(bloc) {
          var p = parserOrdrePourImpression(bloc);
          if (p && p.elements.length > 0) ordresParsed.push(p);
        });
      }
      var cartesParsed = carteTexte ? parserCartesPourImpression(carteTexte) : [];
      var reliersParsed = [];
      if (relierTexte) {
        relierTexte.split('\n\n').forEach(function(bloc) {
          var p = parserRelierPourImpression(bloc);
          if (p && p.paires.length > 0) reliersParsed.push(p);
        });
      }
      var ttsParsed = ttTexte ? parserTextesTrousPourImpression(ttTexte) : [];
      var vfsParsed = vfTexte ? parserVraiFauxPourImpression(vfTexte) : [];
      var copiersParsed = copierTexte ? parserCopierPourImpression(copierTexte) : [];

      var blocsOrdonnes = [];

      if (ordreBlocs.length > 0) {
        ordreBlocs.forEach(function(item) {
          var p = item.split(':');
          var type = p[0];
          var idx = p.length > 1 ? parseInt(p[1]) : 0;

          if (type === 'slide' && slidesArray[idx] !== undefined) {
            blocsOrdonnes.push({ type: 'slide', data: slidesArray[idx] });
          } else if (type === 'quiz' && quizsParsed[idx]) {
            blocsOrdonnes.push({ type: 'quiz', data: quizsParsed[idx] });
          } else if (type === 'open' && opensParsed[idx] !== undefined) {
            blocsOrdonnes.push({ type: 'open', data: opensParsed[idx] });
          } else if (type === 'ordre' && ordresParsed[idx]) {
            blocsOrdonnes.push({ type: 'ordre', data: ordresParsed[idx] });
          } else if (type === 'carte' && cartesParsed[idx]) {
            blocsOrdonnes.push({ type: 'carte', data: cartesParsed[idx] });
          } else if (type === 'relier' && reliersParsed[idx]) {
            blocsOrdonnes.push({ type: 'relier', data: reliersParsed[idx] });
          } else if (type === 'tt' && ttsParsed[idx]) {
            blocsOrdonnes.push({ type: 'tt', data: ttsParsed[idx] });
          } else if (type === 'vf' && vfsParsed.length > 0) {
            blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
          } else if (type === 'copier' && copiersParsed[idx]) {
            blocsOrdonnes.push({ type: 'copier', data: copiersParsed[idx] });
          }
        });
      } else {
        slidesArray.forEach(function(s) { blocsOrdonnes.push({ type: 'slide', data: s }); });
        quizsParsed.forEach(function(q) { blocsOrdonnes.push({ type: 'quiz', data: q }); });
        opensParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'open', data: o }); });
        ttsParsed.forEach(function(t) { blocsOrdonnes.push({ type: 'tt', data: t }); });
        if (vfsParsed.length > 0) blocsOrdonnes.push({ type: 'vf', data: vfsParsed });
        ordresParsed.forEach(function(o) { blocsOrdonnes.push({ type: 'ordre', data: o }); });
        cartesParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'carte', data: c }); });
        reliersParsed.forEach(function(r) { blocsOrdonnes.push({ type: 'relier', data: r }); });
        copiersParsed.forEach(function(c) { blocsOrdonnes.push({ type: 'copier', data: c }); });
      }

      var vocabClean = [];
      (chapitre.vocabulaire || []).forEach(function(item) {
        String(item).split(',').forEach(function(mot) {
          var m = mot.trim();
          if (m !== '') vocabClean.push(m);
        });
      });

      var tagsClean = (chapitre.tags || [])
        .map(function(x) { return String(x).trim(); })
        .filter(function(x) { return x !== ''; });

      var textePourCompter = '';
      blocsOrdonnes.forEach(function(b) {
        if (b.type === 'slide') textePourCompter += ' ' + b.data;
      });
      var nbMots = textePourCompter.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var tempsLecture = Math.max(1, Math.round(nbMots / 18));

      chapitre._nbMots = nbMots;
      chapitre._tempsLecture = tempsLecture;
      chapitre._vocabClean = vocabClean;

      var html = '';

      html += '<div class="bandeau-titre">';
      html += '  <div class="ligne-titre">';
      html += '    <h1>' + echapperHtml(chapitre.titre || 'Lecture') + '</h1>';
      html += '  </div>';
      html += '</div>';

      if (tagsClean.length > 0) {
        html += '<div class="tags-haut">';
        tagsClean.forEach(function(t) { html += '<span class="memo-tag">#' + echapperHtml(t) + '</span>'; });
        html += '</div>';
      }

      html += '<div class="slides-zone">';
      blocsOrdonnes.forEach(function(bloc) {
        if (bloc.type !== 'slide') return;

        html += '<div class="slide">';
        var lignesSlide = bloc.data.split('\n').filter(function(p) { return p.trim() !== ''; });
        var bufferTexte = '';

        function flushTexte() {
          if (!bufferTexte.trim()) { bufferTexte = ''; return; }
          var paras = bufferTexte.split('\n').filter(function(p) { return p.trim() !== ''; });
          paras.forEach(function(p) {
            html += '<p>' + rendreSources(rendreCitations(p.trim())) + '</p>';
          });
          bufferTexte = '';
        }

        lignesSlide.forEach(function(l) {
          var trimmed = l.trim();
          var imgMatch = trimmed.match(/^img:([^:\s]+)(?::([a-zA-Z]+))?(?::([a-zA-Z]+))?$/i);
          if (imgMatch) {
            flushTexte();
            var nomImg = imgMatch[1];
            var opt1 = (imgMatch[2] || '').toLowerCase();
            var opt2 = (imgMatch[3] || '').toLowerCase();
            var position = 'centre', taille = 'moyen';
            [opt1, opt2].forEach(function(o) {
              if (o === 'gauche' || o === 'droite' || o === 'centre') position = o;
              else if (o === 'petit' || o === 'moyen' || o === 'grand') taille = o;
            });
            var url = imagesLivret[nomImg];
            if (!url) {
              html += '<div class="img-manquante">[image manquante : ' + echapperHtml(nomImg) + ']</div>';
            } else {
              var classes = 'print-img print-img-' + position + ' print-img-' + taille;
              html += '<img src="' + url + '" alt="' + echapperHtml(nomImg) + '" class="' + classes + '">';
            }
            return;
          }
          bufferTexte = bufferTexte ? bufferTexte + '\n' + trimmed : trimmed;
        });
        flushTexte();

        html += '</div>';
      });
      html += '</div>';

      var htmlExercices = construireExercicesPourFeuille(blocsOrdonnes);
      html += htmlExercices;

      return html;
    }

    // ============================================================
    // ARABISER
    // ============================================================
    function arabiserDans(container) {
      if (!container) return;
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);

      var noeuds = [];
      var n;
      while ((n = walker.nextNode())) {
        if (/[\u0600-\u06FF]/.test(n.nodeValue || '')) noeuds.push(n);
      }

      noeuds.forEach(function(texteNode) {
        var parent = texteNode.parentNode;
        if (!parent) return;
        if (parent.classList && parent.classList.contains('arabe')) return;
        if (parent.classList && parent.classList.contains('copier-mot')) return;

        var txt = texteNode.nodeValue;
        var regex = /([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)/g;
        var parts = txt.split(regex);

        var frag = document.createDocumentFragment();
        parts.forEach(function(part) {
          if (part === '') return;
          if (/[\u0600-\u06FF]/.test(part)) {
            var span = document.createElement('span');
            span.className = 'arabe';
            span.setAttribute('lang', 'ar');
            span.textContent = part;
            frag.appendChild(span);
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        });

        parent.replaceChild(frag, texteNode);
      });
    }

    // ============================================================
    // NAVIGATION DANS LE MÊME LIVRET
    // ============================================================
    function construireNavDansLivret(chapitre) {
      if (!chapitre.categorie) return {};

      var memeLivret = chapitresData.filter(function(c) {
        return (c.categorie || '') === (chapitre.categorie || '');
      });
      memeLivret = trierAlphabetique(memeLivret);

      var indexActuel = -1;
      for (var i = 0; i < memeLivret.length; i++) {
        if (String(memeLivret[i].id) === String(chapitre.id)) {
          indexActuel = i;
          break;
        }
      }

      return {
        liste: memeLivret,
        index: indexActuel,
        precedent: indexActuel > 0 ? memeLivret[indexActuel - 1] : null,
        suivant: indexActuel !== -1 && indexActuel < memeLivret.length - 1 ? memeLivret[indexActuel + 1] : null
      };
    }

    // ============================================================
    // BLOC ACTIONS (boutons imprimer + quiz) — colonne latérale

      html += '  <div class="bloc-titre"><span class="icone">⚙</span> Actions</div>';
      html += '  <div class="bloc-actions-chapitre">';
      html += '    <button class="btn-action-lateral btn-imprimer" onclick="imprimerChapitre(\'' +
              chapitre.id + '\', \'' +
              (chapitre.titre || '').replace(/'/g, "\\'") + '\', chapitresData)">' +
              'Imprimer le texte et le quiz' +
              '</button>';
      html += '    <a class="btn-action-lateral btn-elearning" href="/medit/quiz.html?id=' + encodeURIComponent(chapitre.id) + '">' +
              'Passer le quiz en ligne' +
              '</a>';
      html += '  </div>';
      html += '</div>';
      return html;
    }

    // ============================================================
    // COLONNE LATÉRALE
    // ============================================================
    function construireZoneLaterale(chapitre) {
      var nav = construireNavDansLivret(chapitre);
      var livretInfo = livretsData[chapitre.categorie] || {};

      var html = '';

      html += construireBlocActions(chapitre);

      var niveau = chapitre.niveau || 0;
      var tempsLecture = chapitre._tempsLecture || 1;
      var dateEcrit = formatDateLongue(chapitre.date);

      html += '<div class="bloc-section">';
      html += '  <div class="bloc-titre"><span class="icone"></span> Informations</div>';
      html += '  <div class="bloc-meta-chapitre">';
      html += '    <div class="meta-ligne">';
      html += '      <span class="meta-icone"></span>';
      html += '      <span class="meta-label">Niveau</span>';
      html += '      <span class="meta-valeur">' + niveau + '</span>';
      html += '    </div>';
      html += '    <div class="meta-ligne">';
      html += '      <span class="meta-icone">⏱</span>';
      html += '      <span class="meta-label">Temps de lecture avec le maître</span>';
      html += '      <span class="meta-valeur">' + tempsLecture + ' min</span>';
      html += '    </div>';
      if (dateEcrit) {
        html += '    <div class="meta-ligne">';
        html += '      <span class="meta-icone"></span>';
        html += '      <span class="meta-label">Écrit le</span>';
        html += '      <span class="meta-valeur">' + echapperHtml(dateEcrit) + '</span>';
        html += '    </div>';
      }
      html += '  </div>';
      html += '</div>';

      var vocabClean = chapitre._vocabClean || [];
      if (vocabClean.length > 0) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">';
        html += '    <span class="icone">✎</span> Vocabulaire';
        html += '    <span class="compteur">' + vocabClean.length + '</span>';
        html += '  </div>';
        html += '  <div class="bloc-vocabulaire">';
        vocabClean.forEach(function(mot) {
          html += '<div class="vocab-mot">' + echapperHtml(mot) + '</div>';
        });
        html += '  </div>';
        html += '</div>';
      }

      if (chapitre.categorie) {
        var couleur = livretInfo.couleur || '#2d6a4f';
        var sousTitre = livretInfo.sousTitre || '';

        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre"><span class="icone">📖</span> Livret</div>';
        html += '  <a class="encart-livret" href="/medit/livret.html?cat=' + encodeURIComponent(chapitre.categorie) + '">';
        html += '    <div class="mini-couverture" style="background: ' + couleur + '; border-color: ' + couleur + ';">';
        html += '      <span class="badge-niveau-couv">Niv. ' + niveau + '</span>';
        html += '      <div class="contenu-couv">';
        html += '        <div>';
        html += '          <div class="titre-couv">' + echapperHtml(chapitre.categorie) + '</div>';
        html += '        </div>';
        html += '        <div class="edition-nom">Qiraat</div>';
        html += '      </div>';
        html += '    </div>';
        html += '    <div class="encart-texte">';
        html += '      <div class="encart-label">Extrait du livret</div>';
        html += '      <div class="encart-nom-livret">' + echapperHtml(chapitre.categorie) + '</div>';
        html += '      <div class="encart-cta">Voir le livret →</div>';
        html += '    </div>';
        html += '  </a>';
        html += '</div>';
      }

      if (nav.liste && nav.liste.length > 1) {
        html += '<div class="bloc-section">';
        html += '  <div class="bloc-titre">';
        html += '    <span class="icone">🕮</span> Dans ce livret';
        html += '    <span class="compteur">' + nav.liste.length + '</span>';
        html += '  </div>';
        html += '  <div class="liste-chapitres">';

        nav.liste.forEach(function(c) {
          var estActuel = String(c.id) === String(chapitre.id);
          if (estActuel) {
            html += '<div class="item-chapitre actuel">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">●</span>';
            html += '</div>';
          } else {
            html += '<a class="item-chapitre" href="/medit/chapitre.html?id=' + encodeURIComponent(c.id) + '">';
            html += '  <span class="item-titre">' + echapperHtml(c.titre) + '</span>';
            html += '  <span class="item-marqueur">→</span>';
            html += '</a>';
          }
        });

        html += '  </div>';
        html += '</div>';
      }

      html += construireGalerieLivrets(chapitre);

      return html;
    }

    // ============================================================
    // ZONE BASSE MOBILE
    // ============================================================
    function construireZoneBasseMobile(chapitre) {
      return construireZoneLaterale(chapitre);
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerChapitre() {
      var params = new URLSearchParams(window.location.search);
      var chapitreId = params.get('id');

      if (!chapitreId) { afficherErreur('Aucun chapitre spécifié.'); return; }

      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          chapitresData = data.tousLesChapitres || data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                description: l.description || '',
                auteur: l.auteur || ''
              };
            });
          }

          chapitreActuel = trouverChapitre(chapitreId, chapitresData);

          if (!chapitreActuel) {
            afficherErreur('Chapitre introuvable.');
            return;
          }

          if (chapitreActuel.categorie && typeof chargerImagesLivret === 'function') {
            chargerImagesLivret(chapitreActuel.categorie)
              .then(function(images) {
                imagesLivret = images || {};
                afficherChapitre(chapitreActuel);
              })
              .catch(function() {
                imagesLivret = {};
                afficherChapitre(chapitreActuel);
              });
          } else {
            afficherChapitre(chapitreActuel);
          }
        })
        .catch(function(error) {
          console.error('❌ Erreur:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];

            livretsData = {};
            if (cache.livrets && Array.isArray(cache.livrets)) {
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  description: l.description || '',
                  auteur: l.auteur || ''
                };
              });
            }

            chapitreActuel = trouverChapitre(chapitreId, chapitresData);
            if (chapitreActuel) {
              afficherChapitre(chapitreActuel);
              return;
            }
          }
          afficherErreur('Erreur de chargement.');
        });
    }

    // ============================================================
    // AFFICHER LE CHAPITRE
    // ============================================================
    function afficherChapitre(chapitre) {
      var container = document.getElementById('chapitreContainer');
      var colonneLaterale = document.getElementById('colonneLaterale');
      var zoneBasseMobile = document.getElementById('zoneBasseMobile');

      var contenuHtml = construireHtmlChapitre(chapitre, imagesLivret);
      var blocARetenirHtml = construireBlocARetenir(chapitre);
      var zoneBasHtml = construireZoneBasChapitre(chapitre);

      container.innerHTML =
        '<div class="feuille-chapitre">' + contenuHtml + '</div>' +
        blocARetenirHtml +
        zoneBasHtml;

      colonneLaterale.innerHTML = construireZoneLaterale(chapitre);
      zoneBasseMobile.innerHTML = construireZoneBasseMobile(chapitre);

      arabiserDans(container);
      afficherFilAriane(chapitre);

      document.title = chapitre.titre + ' - Qiraat';
    }

    // ============================================================
    // ERREUR
    // ============================================================
    function afficherErreur(message) {
      document.getElementById('chapitreContainer').innerHTML = `
        <div class="vide-chapitre">
          <span class="icone">◈</span>
          <h2>${message}</h2>
          <p>Vérifiez le lien ou retournez aux chapitres.</p>
          <a href="/medit/présentation.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:transparent;border:1px solid var(--border);text-decoration:none;color:var(--text-secondary);">← Retour aux chapitres</a>
        </div>
      `;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', chargerChapitre);
    } else {
      chargerChapitre();
    }
  </script>

</body>
</html>
