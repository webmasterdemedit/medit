<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Tous les textes - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    .page-blog {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 30px 40px;
    }

    /* ---------- EN-TÊTE ---------- */
    .entete-blog {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .entete-blog h1 {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .entete-blog .sous-titre-blog {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.6;
    }

    .entete-blog .stats-blog {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 10px 16px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .entete-blog .stats-blog .stat-item {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .entete-blog .stats-blog .stat-item .nombre {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      margin-left: 4px;
    }

    /* ---------- ZONE DE FILTRES ---------- */
    .zone-filtres {
      margin-bottom: 20px;
      padding: 14px 18px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .zone-filtres .ligne-filtre {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .zone-filtres .ligne-filtre + .ligne-filtre {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .zone-filtres .filtre-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      min-width: 68px;
    }

    .champ-recherche {
      flex: 1;
      min-width: 220px;
      padding: 7px 14px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .champ-recherche:focus { border-color: var(--border-hover); }
    .champ-recherche::placeholder { color: var(--text-muted); font-style: italic; }

    .btn-effacer {
      padding: 7px 14px;
      font-size: 12px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-effacer:hover {
      background: var(--bg-active);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .liste-filtres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .liste-filtres .filtre {
      padding: 4px 14px;
      font-size: 12px;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .liste-filtres .filtre:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .liste-filtres .filtre.actif {
      background: var(--bg-active);
      border-color: var(--border-hover);
      color: var(--text);
      font-weight: 500;
    }

    /* ---------- SECTION ---------- */
    .section-chapitres h3 {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .section-chapitres h3 .compteur {
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-left: 8px;
    }

    /* ============================================================ */
    /* CARTE ARTICLE : couverture à gauche + contenu à droite       */
    /* ============================================================ */
    .carte-chapitre {
      display: flex;
      align-items: stretch;
      gap: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 10px;
      transition: border-color 0.2s, transform 0.15s;
      cursor: pointer;
    }

    .carte-chapitre:hover {
      border-color: var(--border-hover);
    }

    .carte-chapitre:active {
      transform: scale(0.995);
    }

    /* --- Mini-couverture (à gauche) --- */
    .carte-chapitre .mini-couverture {
      flex-shrink: 0;
      width: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px 8px;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .carte-chapitre .mini-couverture .badge-niveau-couv {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 3;
      padding: 1px 7px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.70);
    }

    .carte-chapitre .mini-couverture .contenu-couv {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding-top: 14px;
    }

    .carte-chapitre .mini-couverture .auteur-couv {
      font-size: 7px;
      font-weight: 300;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.6;
      color: rgba(26, 26, 26, 0.5);
    }

    .carte-chapitre .mini-couverture .titre-couv {
      font-family: 'Georgia', serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      color: #1a1a1a;
    }

    .carte-chapitre .mini-couverture .sous-titre-couv {
      font-size: 8px;
      font-weight: 500;
      opacity: 0.8;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.2;
    }

    .carte-chapitre .mini-couverture .edition-nom {
      font-weight: 700;
      font-style: italic;
      font-size: 7px;
      letter-spacing: 0.8px;
      opacity: 0.6;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
      margin-top: 4px;
    }

    .carte-chapitre .mini-couverture .progression-couv {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .carte-chapitre .mini-couverture .progression-couv .barre {
      height: 100%;
      background: rgba(255, 255, 255, 0.60);
      transition: width 0.6s ease;
      width: 0%;
    }

    /* --- Contenu à droite --- */
    .carte-chapitre .contenu-principal {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      gap: 0;
    }

    /* Ligne du haut : numéro + titre */
    .carte-chapitre .ligne-titre-chapitre {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    /* Le fameux carré numéroté */
    .carte-chapitre .numero-chapitre {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-hover);
      border: 1.5px solid var(--border-hover);
      font-family: 'Georgia', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .carte-chapitre .titre-chapitre {
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      padding-top: 6px;
      flex: 1;
      min-width: 0;
    }

    /* --- Bas de carte : dates + bouton imprimer --- */
    .carte-chapitre .bas-carte {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
    }

    .carte-chapitre .dates-chapitre {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .carte-chapitre .dates-chapitre .date-item .label {
      color: var(--text-muted);
      margin-right: 4px;
    }

    .carte-chapitre .dates-chapitre .date-item .valeur {
      color: var(--text);
      font-weight: 500;
    }

    .carte-chapitre .btn-imprimer {
      display: inline-block;
      padding: 4px 14px;
      font-size: 11px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .carte-chapitre .btn-imprimer:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    /* ---------- PAGINATION ---------- */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .pagination button {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled):not(.actif) {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text);
    }

    .pagination button.actif {
      background: var(--bg-active);
      border-color: var(--border-hover);
      color: var(--text);
      font-weight: 700;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination .ellipsis {
      padding: 0 4px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .pagination .info-page {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* ---------- VIDES / LOADER ---------- */
    .vide-chapitres {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .vide-chapitres .icone {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .vide-chapitres h4 {
      font-size: 16px;
      color: var(--text);
      font-weight: 500;
    }

    .vide-chapitres p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .loader {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .page-blog { padding: 12px 16px 30px; }
      .entete-blog h1 { font-size: 26px; }
      .stats-blog { justify-content: flex-start; gap: 16px; }
      .zone-filtres .filtre-label { min-width: unset; width: 100%; }
      .pagination button { min-width: 32px; height: 32px; font-size: 12px; }

      .carte-chapitre { flex-direction: column; }
      .carte-chapitre .mini-couverture {
        width: 100%;
        height: 100px;
        flex-direction: row;
        justify-content: center;
      }
      .carte-chapitre .mini-couverture .contenu-couv {
        padding-top: 0;
        flex-direction: row;
        align-items: center;
        gap: 10px;
      }
      .carte-chapitre .numero-chapitre {
        width: 32px;
        height: 32px;
        font-size: 15px;
      }
    }

    @media (max-width: 400px) {
      .entete-blog h1 { font-size: 22px; }
      .entete-blog .sous-titre-blog { font-size: 13px; }
      .carte-chapitre .titre-chapitre { font-size: 15px; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-blog">

    <!-- EN-TÊTE -->
    <div class="entete-blog">
      <h1>Tous les textes</h1>
      <div class="sous-titre-blog">
        Tous les textes et exercices, tous livrets confondus, classés du plus récent au plus ancien.
      </div>
      <div id="statsBlog"></div>
    </div>

    <!-- FILTRES -->
    <div class="zone-filtres">
      <div class="ligne-filtre">
        <span class="filtre-label">Recherche</span>
        <input type="text" id="champRecherche" class="champ-recherche"
               placeholder="Rechercher un titre, un tag, un livret..."
               autocomplete="off" />
        <button type="button" class="btn-effacer" id="btnEffacer">Effacer</button>
      </div>
      <div class="ligne-filtre">
        <span class="filtre-label">Livret</span>
        <div class="liste-filtres" id="listeFiltres"></div>
      </div>
    </div>

    <!-- CONTENU -->
    <div id="contenuChapitres">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement des chapitres...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(function(error) {
        console.error('Erreur chargement footer:', error);
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-devise">"La méditation est la clé qui ouvre les portes de l'intelligence du cœur."</div>
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>
  <script src="/medit/impression.js"></script>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var CHAPITRES_PAR_PAGE = 20;

    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var toutesLesReponses = {};
    var chapitresData = [];
    var niveauEtudiant = 0;
    var nomEtudiant = '';
    var livretsData = {};

    var filtreLivretActuel = 'tous';
    var rechercheActuelle = '';
    var pageActuelle = 1;
    var chapitresFiltres = [];

    // ============================================================
    // FORMATER LA DATE (jj mois aaaa)
    // ============================================================
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        var date = new Date(dateStr);
        if (isNaN(date.getTime())) return '';
        var mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                    'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
        return date.getDate() + ' ' + mois[date.getMonth()] + ' ' + date.getFullYear();
      } catch(e) {
        return '';
      }
    }

    // ============================================================
    // NORMALISER UNE CHAÎNE
    // ============================================================
    function normaliser(str) {
      if (!str) return '';
      return str.toString().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerTextes() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }
      nomEtudiant = id;

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          chapitresData = data.tousLesChapitres || data.chapitres || [];

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                couleur: l.couleur || '#2d6a4f',
                sousTitre: l.sousTitre || '',
                date: l.date || '',
                pages: l.pages || '',
                description: l.description || '',
                auteur: l.auteur || ''
              };
            });
          }

          toutesLesReponses = {};
          if (data.reponses) {
            data.reponses.forEach(function(r) {
              if (!toutesLesReponses[r.chapitreId]) {
                toutesLesReponses[r.chapitreId] = [];
              }
              toutesLesReponses[r.chapitreId].push(r);
            });
          }

          initialiserTextes();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            chapitresData = cache.tousLesChapitres || cache.chapitres || [];
            if (cache.livrets && Array.isArray(cache.livrets)) {
              livretsData = {};
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  couleur: l.couleur || '#2d6a4f',
                  sousTitre: l.sousTitre || '',
                  date: l.date || '',
                  pages: l.pages || '',
                  description: l.description || '',
                  auteur: l.auteur || ''
                };
              });
            }
            toutesLesReponses = {};
            if (cache.reponses) {
              cache.reponses.forEach(function(r) {
                if (!toutesLesReponses[r.chapitreId]) {
                  toutesLesReponses[r.chapitreId] = [];
                }
                toutesLesReponses[r.chapitreId].push(r);
              });
            }
            initialiserTextes();
          } else {
            document.getElementById('contenuChapitres').innerHTML = `
              <div class="vide-chapitres">
                <span class="icone">⚠</span>
                <h4>Erreur de chargement</h4>
                <p>Vérifiez votre connexion internet.</p>
                <button onclick="location.reload();" style="margin-top:10px;padding:8px 20px;background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text-secondary);">Réessayer</button>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // INITIALISATION
    // ============================================================
    function initialiserTextes() {
      chapitresData.sort(function(a, b) {
        var da = a.date ? new Date(a.date).getTime() : 0;
        var db = b.date ? new Date(b.date).getTime() : 0;
        return db - da;
      });

      afficherStats();
      afficherFiltresLivrets();
      attacherEvenements();
      appliquerFiltres();
    }

    // ============================================================
    // STATS
    // ============================================================
    function afficherStats() {
      var totalChapitres = chapitresData.length;
      var totalLivrets = Object.keys(livretsData).length;

      var statsHtml = `
        <div class="stats-blog">
          <span class="stat-item">Textes & exercices : <span class="nombre">${totalChapitres}</span></span>
          <span class="stat-item">Livrets : <span class="nombre">${totalLivrets}</span></span>
          <span class="stat-item">Niveau : <span class="nombre">${niveauEtudiant}</span></span>
        </div>
      `;
      document.getElementById('statsBlog').innerHTML = statsHtml;
    }

    // ============================================================
    // FILTRES LIVRETS
    // ============================================================
    function afficherFiltresLivrets() {
      var categories = {};
      chapitresData.forEach(function(c) {
        var cat = c.categorie || 'Sans catégorie';
        categories[cat] = (categories[cat] || 0) + 1;
      });
      var catsTriees = Object.keys(categories).sort(function(a, b) {
        return a.localeCompare(b, 'fr', { sensitivity: 'base' });
      });

      var html = '';
      html += `<button type="button" class="filtre ${filtreLivretActuel === 'tous' ? 'actif' : ''}" data-cat="tous">Tous (${chapitresData.length})</button>`;
      catsTriees.forEach(function(cat) {
        html += `<button type="button" class="filtre ${filtreLivretActuel === cat ? 'actif' : ''}" data-cat="${cat.replace(/"/g, '&quot;')}">${cat} (${categories[cat]})</button>`;
      });

      document.getElementById('listeFiltres').innerHTML = html;

      var boutons = document.querySelectorAll('#listeFiltres .filtre');
      boutons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          filtreLivretActuel = this.getAttribute('data-cat');
          pageActuelle = 1;
          afficherFiltresLivrets();
          appliquerFiltres();
        });
      });
    }

    // ============================================================
    // ÉVÉNEMENTS
    // ============================================================
    function attacherEvenements() {
      var champ = document.getElementById('champRecherche');
      var btnEffacer = document.getElementById('btnEffacer');

      var timer = null;
      champ.addEventListener('input', function() {
        clearTimeout(timer);
        var val = this.value;
        timer = setTimeout(function() {
          rechercheActuelle = val;
          pageActuelle = 1;
          appliquerFiltres();
        }, 200);
      });

      btnEffacer.addEventListener('click', function() {
        champ.value = '';
        rechercheActuelle = '';
        pageActuelle = 1;
        appliquerFiltres();
      });
    }

    // ============================================================
    // APPLIQUER FILTRES
    // ============================================================
    function appliquerFiltres() {
      var rech = normaliser(rechercheActuelle);

      chapitresFiltres = chapitresData.filter(function(c) {
        if (filtreLivretActuel !== 'tous') {
          if ((c.categorie || 'Sans catégorie') !== filtreLivretActuel) return false;
        }

        if (rech) {
          var titreNorm = normaliser(c.titre);
          var catNorm = normaliser(c.categorie);
          var tagsNorm = '';
          if (c.tags && c.tags.length) {
            tagsNorm = normaliser(c.tags.join(' '));
          }
          if (titreNorm.indexOf(rech) === -1 &&
              catNorm.indexOf(rech) === -1 &&
              tagsNorm.indexOf(rech) === -1) {
            return false;
          }
        }

        return true;
      });

      afficherChapitres();
    }

    // ============================================================
    // AFFICHER LES CHAPITRES
    // ============================================================
    function afficherChapitres() {
      var container = document.getElementById('contenuChapitres');

      if (chapitresFiltres.length === 0) {
        container.innerHTML = `
          <div class="vide-chapitres">
            <span class="icone">◈</span>
            <h4>Aucun chapitre trouvé</h4>
            <p>Essayez de modifier votre recherche ou vos filtres.</p>
          </div>
        `;
        return;
      }

      var totalPages = Math.ceil(chapitresFiltres.length / CHAPITRES_PAR_PAGE);
      if (pageActuelle > totalPages) pageActuelle = totalPages;
      if (pageActuelle < 1) pageActuelle = 1;

      var debut = (pageActuelle - 1) * CHAPITRES_PAR_PAGE;
      var fin = debut + CHAPITRES_PAR_PAGE;
      var pageChapitres = chapitresFiltres.slice(debut, fin);

      var titreSection = 'Tous les textes';
      if (filtreLivretActuel !== 'tous') {
        titreSection = filtreLivretActuel;
      }
      if (rechercheActuelle.trim()) {
        titreSection += ' — recherche "' + rechercheActuelle.trim() + '"';
      }

      var html = '<div class="section-chapitres">';
      html += '<h3>' + titreSection +
              '<span class="compteur">(' + chapitresFiltres.length + ' résultat' +
              (chapitresFiltres.length > 1 ? 's' : '') + ')</span></h3>';

      for (var i = 0; i < pageChapitres.length; i++) {
        html += genererCarteChapitre(pageChapitres[i]);
      }
      html += '</div>';

      html += genererPagination(totalPages);

      container.innerHTML = html;

      // Attacher le clic sur les cartes
      var cartes = container.querySelectorAll('.carte-chapitre');
      cartes.forEach(function(carte) {
        carte.addEventListener('click', function() {
          var id = this.getAttribute('data-chapitre-id');
          if (id) {
            window.location.href = '/medit/texte.html?id=' + encodeURIComponent(id);
          }
        });
      });

      // Attacher le clic sur le bouton imprimer (stopPropagation)
      var boutonsImprimer = container.querySelectorAll('.btn-imprimer');
      boutonsImprimer.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = this.getAttribute('data-chapitre-id');
          var titre = this.getAttribute('data-chapitre-titre');
          if (id && typeof imprimerChapitre === 'function') {
            imprimerChapitre(id, titre, chapitresData);
          }
        });
      });

      // Pagination
      var boutonsPage = container.querySelectorAll('.pagination button[data-page]');
      boutonsPage.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var p = parseInt(this.getAttribute('data-page'));
          if (p && p !== pageActuelle) {
            pageActuelle = p;
            afficherChapitres();
            var top = document.querySelector('.zone-filtres');
            if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
    }

    // ============================================================
    // GÉNÉRER UNE CARTE CHAPITRE (avec numéro + hauteur réduite)
    // ============================================================
    function genererCarteChapitre(chapitre) {
      var livretInfo = livretsData[chapitre.categorie] || {};
      var couleur = livretInfo.couleur || '#2d6a4f';
      var sousTitre = livretInfo.sousTitre || '';
      var auteur = livretInfo.auteur || '';

      // Option A : dates création + modification du chapitre
      var dateCreation = chapitre.date ? formatDate(chapitre.date) : '';
      var dateModif = chapitre.dateModif ? formatDate(chapitre.dateModif) : '';

      // Progression étudiant (pour la barre de la couverture)
      var pourcentage = 0;
      var reponses = toutesLesReponses[chapitre.id] || [];
      if (reponses.length > 0) {
        var toutesValides = true;
        for (var j = 0; j < reponses.length; j++) {
          if (reponses[j].valide !== 'valide') {
            toutesValides = false;
            break;
          }
        }
        pourcentage = toutesValides ? 100 : 50;
      }

      // NUMÉRO : ordre alphabétique dans le même livret
      var numeroChapitre = calculerNumeroChapitre(chapitre);

      // Bloc dates
      var datesHtml = '';
      if (dateCreation) {
        datesHtml += `<span class="date-item"><span class="label">Créé :</span><span class="valeur">${dateCreation}</span></span>`;
      }
      if (dateModif) {
        datesHtml += `<span class="date-item"><span class="label">Modifié :</span><span class="valeur">${dateModif}</span></span>`;
      }

      var titreEchappe = chapitre.titre.replace(/"/g, '&quot;');

      return `
        <div class="carte-chapitre" data-chapitre-id="${chapitre.id}">
          <div class="mini-couverture" style="background: ${couleur}; border-color: ${couleur};">
            <span class="badge-niveau-couv">Niv. ${chapitre.niveau}</span>
            <div class="contenu-couv">
              ${auteur ? `<div class="auteur-couv">${auteur}</div>` : ''}
              <div class="titre-couv">${chapitre.categorie || 'Sans catégorie'}</div>
              ${sousTitre ? `<div class="sous-titre-couv">${sousTitre}</div>` : ''}
              <div class="edition-nom">Qiraat Édition</div>
            </div>
            <div class="progression-couv">
              <div class="barre" style="width: ${pourcentage}%;"></div>
            </div>
          </div>

          <div class="contenu-principal">
            <div class="ligne-titre-chapitre">
              <div class="numero-chapitre">${numeroChapitre}</div>
              <div class="titre-chapitre">${chapitre.titre}</div>
            </div>
            <div class="bas-carte">
              <div class="dates-chapitre">${datesHtml}</div>
              <button class="btn-imprimer"
                      data-chapitre-id="${chapitre.id}"
                      data-chapitre-titre="${titreEchappe}">
                🖨 Imprimer
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================
    // CALCULER LE NUMÉRO DU CHAPITRE (ordre alphabétique dans son livret)
    // ============================================================
    function calculerNumeroChapitre(chapitre) {
      // Récupérer tous les chapitres du même livret
      var memeLivret = chapitresData.filter(function(c) {
        return (c.categorie || 'Sans catégorie') === (chapitre.categorie || 'Sans catégorie');
      });

      // Trier A→Z
      memeLivret.sort(function(a, b) {
        return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
      });

      // Trouver l'index du chapitre courant
      for (var i = 0; i < memeLivret.length; i++) {
        if (String(memeLivret[i].id) === String(chapitre.id)) {
          return i + 1; // 1-based
        }
      }
      return 1;
    }

    // ============================================================
    // GÉNÉRER LA PAGINATION
    // ============================================================
    function genererPagination(totalPages) {
      if (totalPages <= 1) return '';

      var html = '<div class="pagination">';

      html += `<button type="button" data-page="${pageActuelle - 1}" ${pageActuelle === 1 ? 'disabled' : ''}>‹ Précédent</button>`;

      var pages = calculerPages(totalPages, pageActuelle);
      pages.forEach(function(p) {
        if (p === '...') {
          html += '<span class="ellipsis">…</span>';
        } else {
          html += `<button type="button" data-page="${p}" class="${p === pageActuelle ? 'actif' : ''}">${p}</button>`;
        }
      });

      html += `<button type="button" data-page="${pageActuelle + 1}" ${pageActuelle === totalPages ? 'disabled' : ''}>Suivant ›</button>`;

      html += `<div class="info-page">Page ${pageActuelle} sur ${totalPages}</div>`;

      html += '</div>';
      return html;
    }

    // ============================================================
    // CALCUL DES PAGES À AFFICHER
    // ============================================================
    function calculerPages(total, courante) {
      var pages = [];
      var delta = 2;

      if (total <= 7) {
        for (var i = 1; i <= total; i++) pages.push(i);
        return pages;
      }

      pages.push(1);

      var debut = Math.max(2, courante - delta);
      var fin = Math.min(total - 1, courante + delta);

      if (debut > 2) pages.push('...');

      for (var i = debut; i <= fin; i++) pages.push(i);

      if (fin < total - 1) pages.push('...');

      pages.push(total);

      return pages;
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
      chargerTextes();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
