<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes méditations</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f0;
      color: #1a2a2e;
      min-height: 100vh;
      letter-spacing: 0.3px;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eef2f6;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a3a4a;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.5px;
    }

    .header .info {
      font-size: 14px;
      color: #7a8a8e;
    }

    .header .info strong {
      color: #1a3a4a;
    }

    .btn-retour {
      padding: 8px 20px;
      background: #eef2f6;
      color: #1a3a4a;
      border: none;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-retour:hover {
      background: #dce2ea;
      transform: translateX(-4px);
    }

    .stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #eef2f6;
    }

    .stats .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 14px;
      color: #7a8a8e;
    }

    .stats .stat-item .nombre {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a4a;
    }

    .stats .stat-item .nombre.valide {
      color: #2d6a4f;
    }

    .grille {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .carte-post {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid #eef2f6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 16px;
    }

    .carte-post:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      border-color: #dce2ea;
    }

    .carte-post .infos {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .carte-post .titre {
      font-size: 17px;
      font-weight: 600;
      color: #1a3a4a;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.3px;
    }

    .carte-post .titre a {
      color: #1a3a4a;
      text-decoration: none;
    }

    .carte-post .titre a:hover {
      color: #2d6a4f;
    }

    .carte-post .meta {
      font-size: 13px;
      color: #94a3b8;
    }

    .carte-post .meta .categorie {
      background: #e8f5e9;
      color: #2d6a4f;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
      margin-right: 8px;
    }

    .carte-post .retenir-cadre {
      background: #f8fafc;
      border-left: 3px solid #b8956a;
      padding: 10px 16px;
      border-radius: 6px;
      margin-top: 6px;
      font-size: 14px;
      color: #2d3748;
      font-style: italic;
      line-height: 1.5;
      display: none;
    }

    .carte-post .retenir-cadre.visible {
      display: block;
    }

    .carte-post .retenir-cadre strong {
      font-style: normal;
      color: #1a3a4a;
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    .carte-post .statut {
      text-align: center;
      min-width: 80px;
    }

    .carte-post .statut .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .carte-post .statut .badge.valide {
      background: #e8f5e9;
      color: #2d6a4f;
      border: 1px solid #a5d6a7;
    }

    .carte-post .statut .badge.a-faire {
      background: #fef3c7;
      color: #b8860b;
      border: 1px solid #fcd34d;
    }

    .carte-post .statut .badge.non-vu {
      background: #eef2f6;
      color: #94a3b8;
    }

    .carte-post .statut .date-validation {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      display: none;
    }

    .carte-post .statut .date-validation.visible {
      display: block;
    }

    .carte-post .btn-lire {
      padding: 8px 20px;
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .carte-post .btn-lire:hover {
      background: #1a4a3a;
      transform: translateY(-2px);
    }

    .carte-post .btn-lire.reviser {
      background: #b8956a;
    }

    .carte-post .btn-lire.reviser:hover {
      background: #a07d55;
    }

    .loader {
      text-align: center;
      padding: 60px 20px;
      font-size: 18px;
      color: #94a3b8;
    }

    .loader .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 4px solid #eef2f6;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vide {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #eef2f6;
    }

    .vide .icone {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    .vide h2 {
      font-size: 22px;
      color: #1a3a4a;
      margin-bottom: 4px;
    }

    .vide p {
      color: #94a3b8;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
      .carte-post {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 14px 16px;
      }
      .carte-post .statut {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        justify-content: flex-start;
      }
      .carte-post .btn-lire {
        text-align: center;
        width: 100%;
      }
      .stats {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .carte-post .statut {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }
      .carte-post .statut .date-validation {
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="header">
      <div>
        <h1>📖 Mon tableau de bord</h1>
        <span class="info" id="infoConnecte">Connecté en tant que <strong id="nomConnecte">—</strong></span>
      </div>
      <a href="/medit/index.html" class="btn-retour">← Accueil</a>
    </div>

    <div class="stats" id="statsContainer">
      <div class="stat-item">
        <span class="nombre" id="totalPosts">0</span>
        <span>méditations disponibles</span>
      </div>
      <div class="stat-item">
        <span class="nombre valide" id="validesPosts">0</span>
        <span>validées</span>
      </div>
      <div class="stat-item">
        <span class="nombre" id="aFairePosts">0</span>
        <span>à faire</span>
      </div>
    </div>

    <div id="contenu">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Chargement des méditations...</p>
      </div>
    </div>

  </div>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>

  <script>
    // ============================================================
    // VARIABLES
    // ============================================================
    var toutesLesReponses = {};
    var postsData = [];

    // ============================================================
    // CHARGEMENT DES POSTS + RÉPONSES
    // ============================================================

    function chargerTableauDeBord() {
      var id = localStorage.getItem('etudiant_id');
      var niveau = parseInt(localStorage.getItem('etudiant_niveau')) || 0;

      if (!id) {
        window.location.href = '/medit/index.html';
        return;
      }

      document.getElementById('nomConnecte').textContent = id;

      var urlPosts = CONFIG.SCRIPT_URL + '?action=getPosts&niveau=' + niveau;

      fetch(urlPosts)
        .then(function(r) { return r.json(); })
        .then(function(dataPosts) {
          if (!dataPosts.success || !dataPosts.posts || dataPosts.posts.length === 0) {
            afficherVide();
            return;
          }

          postsData = dataPosts.posts;

          var urlReponses = CONFIG.SCRIPT_URL + '?action=getReponses&nom=' + encodeURIComponent(id);

          return fetch(urlReponses)
            .then(function(r) { return r.json(); })
            .then(function(dataReponses) {
              if (dataReponses.success && dataReponses.reponses) {
                dataReponses.reponses.forEach(function(r) {
                  toutesLesReponses[r.articleId] = r;
                });
              }
              afficherPosts(postsData);
            });
        })
        .catch(function() {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('contenu').innerHTML = `
            <div class="vide">
              <span class="icone">⚠️</span>
              <h2>Erreur de chargement</h2>
              <p>Vérifiez votre connexion et réessayez.</p>
            </div>
          `;
        });
    }

    // ============================================================
    // AFFICHAGE DES POSTS
    // ============================================================

    function afficherPosts(posts) {
      var contenu = document.getElementById('contenu');
      document.getElementById('loader').style.display = 'none';

      var html = '<div class="grille">';
      var total = 0;
      var valides = 0;
      var aFaire = 0;

      posts.forEach(function(post) {
        total++;
        var reponse = toutesLesReponses[post.id];
        var estValide = false;
        var dateValidation = '';
        var retenir = '';

        if (reponse) {
          var bonnes = reponse.bonnes || 0;
          var totalQ = reponse.total || 0;
          dateValidation = reponse.date || '';
          retenir = reponse.retenir || '';

          if (totalQ > 0 && bonnes >= Math.ceil(totalQ / 2)) {
            estValide = true;
            valides++;
          } else {
            aFaire++;
          }
        } else {
          aFaire++;
        }

        // Badge de statut
        var badgeHtml = '';
        var dateHtml = '';
        if (estValide) {
          badgeHtml = '<span class="badge valide">✅ Validé</span>';
          if (dateValidation) {
            var d = new Date(dateValidation);
            if (!isNaN(d.getTime())) {
              dateHtml = '<span class="date-validation visible">📅 ' + d.toLocaleDateString('fr-FR', {
                day: '2-digit', month: 'long', year: 'numeric'
              }) + '</span>';
            }
          }
        } else if (reponse) {
          badgeHtml = '<span class="badge a-faire">📖 À faire</span>';
        } else {
          badgeHtml = '<span class="badge non-vu">📭 À faire</span>';
        }

        var btnClass = 'btn-lire';
        var btnText = 'Ouvrir →';
        if (estValide) {
          btnClass += ' reviser';
          btnText = '🔄 Réviser';
        }

        var categorieHtml = post.categorie ? '<span class="categorie">' + post.categorie + '</span>' : '';

        var retenirHtml = '';
        if (estValide && retenir) {
          retenirHtml = `
            <div class="retenir-cadre visible">
              <strong>📌 À retenir</strong>
              ${retenir}
            </div>
          `;
        }

        html += `
          <div class="carte-post">
            <div class="infos">
              <div class="titre"><a href="/medit/article.html?id=${post.id}">${post.titre}</a></div>
              <div class="meta">
                ${categorieHtml}
                <span>Niveau ${post.niveau}</span>
                ${retenirHtml}
              </div>
            </div>
            <div class="statut">
              ${badgeHtml}
              ${dateHtml}
            </div>
            <a href="/medit/article.html?id=${post.id}" class="${btnClass}">${btnText}</a>
          </div>
        `;
      });

      html += '</div>';
      contenu.innerHTML = html;

      document.getElementById('totalPosts').textContent = total;
      document.getElementById('validesPosts').textContent = valides;
      document.getElementById('aFairePosts').textContent = aFaire;
    }

    // ============================================================
    // AFFICHAGE VIDE
    // ============================================================

    function afficherVide() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('contenu').innerHTML = `
        <div class="vide">
          <span class="icone">📭</span>
          <h2>Aucune méditation disponible</h2>
          <p>De nouvelles méditations seront ajoutées prochainement.</p>
          <p style="font-size:13px;color:#94a3b8;margin-top:4px;">Votre niveau actuel : ${localStorage.getItem('etudiant_niveau') || 0}</p>
        </div>
      `;
    }

    // ============================================================
    // INIT
    // ============================================================

    function demarrer() {
      chargerTableauDeBord();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
