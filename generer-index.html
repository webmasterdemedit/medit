<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générer index des versets</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #e0d4b4; padding: 20px; max-width: 900px; margin: 0 auto; }
        pre { background: #16213e; padding: 20px; border-radius: 12px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
        .status { color: #4caf50; }
        .error { color: #f44336; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; background: #c9a84c; color: #1a1a2e; border: none; border-radius: 8px; }
        button:hover { background: #dbb95e; }
    </style>
</head>
<body>

    <h1>📖 Générateur d'index des versets</h1>
    <p>Ce script parcourt toutes les pages JSON et reconstruit un index complet des versets.</p>
    <button id="generateBtn">🔧 Générer l'index</button>
    <pre id="output">⏳ Prêt...</pre>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const output = document.getElementById('output');
            output.textContent = '⏳ Parcours des pages en cours...\n';

            const versesIndex = {};
            let totalPages = 0;
            let totalVersets = 0;
            const maxPages = 604; // Nombre total de pages du Mushaf

            try {
                // Parcourir toutes les pages de 1 à 604
                for (let p = 1; p <= maxPages; p++) {
                    const pageNum = String(p).padStart(3, '0');
                    const url = `/medit/pages/${pageNum}.json`;

                    try {
                        const res = await fetch(url);
                        if (!res.ok) continue; // Page non trouvée, on passe

                        const pageData = await res.json();
                        totalPages++;

                        // Parcourir chaque mot de la page
                        let currentVerseKey = null;
                        let currentLine = null;
                        let currentStart = null;
                        let currentEnd = null;

                        pageData.lines.forEach(line => {
                            line.words.forEach((word, index) => {
                                const pos = index + 1;
                                const verseKey = word.verse_key;

                                if (verseKey && word.type !== 'end') {
                                    // Si c'est un nouveau verset ou un changement
                                    if (verseKey !== currentVerseKey) {
                                        // Sauvegarder le précédent si existant
                                        if (currentVerseKey) {
                                            if (!versesIndex[currentVerseKey]) {
                                                versesIndex[currentVerseKey] = { page: p, lines: [] };
                                            }
                                            // Ajouter la ligne si elle n'existe pas déjà
                                            const existing = versesIndex[currentVerseKey].lines.find(
                                                l => l.line === currentLine
                                            );
                                            if (!existing) {
                                                versesIndex[currentVerseKey].lines.push({
                                                    line: currentLine,
                                                    word_start: currentStart,
                                                    word_end: currentEnd
                                                });
                                            }
                                            totalVersets++;
                                        }
                                        // Démarrer un nouveau verset
                                        currentVerseKey = verseKey;
                                        currentLine = line.line;
                                        currentStart = pos;
                                        currentEnd = pos;
                                    } else {
                                        // Même verset, étendre la fin
                                        currentEnd = pos;
                                    }
                                }
                            });
                        });

                        // Sauvegarder le dernier verset de la page
                        if (currentVerseKey) {
                            if (!versesIndex[currentVerseKey]) {
                                versesIndex[currentVerseKey] = { page: p, lines: [] };
                            }
                            const existing = versesIndex[currentVerseKey].lines.find(
                                l => l.line === currentLine
                            );
                            if (!existing) {
                                versesIndex[currentVerseKey].lines.push({
                                    line: currentLine,
                                    word_start: currentStart,
                                    word_end: currentEnd
                                });
                            }
                            totalVersets++;
                        }

                        output.textContent += `✅ Page ${pageNum} traitée (${pageData.lines.length} lignes)\n`;

                    } catch (e) {
                        // Ignorer les pages manquantes
                        continue;
                    }
                }

                // Afficher le résultat
                output.textContent += `\n📊 Résumé :\n`;
                output.textContent += `   - Pages trouvées : ${totalPages}\n`;
                output.textContent += `   - Versets indexés : ${totalVersets}\n`;
                output.textContent += `   - Clés uniques : ${Object.keys(versesIndex).length}\n`;

                // Afficher l'index généré
                output.textContent += `\n📄 Index généré (extrait) :\n`;
                const keys = Object.keys(versesIndex).slice(0, 20);
                const sample = {};
                keys.forEach(k => { sample[k] = versesIndex[k]; });
                output.textContent += JSON.stringify(sample, null, 2) + '\n...\n';

                // Proposer le téléchargement
                const jsonStr = JSON.stringify(versesIndex, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'verses-index.json';
                downloadLink.textContent = '⬇️ Télécharger l\'index complet';
                downloadLink.style.display = 'block';
                downloadLink.style.marginTop = '12px';
                downloadLink.style.color = '#c9a84c';
                output.appendChild(downloadLink);

                output.textContent += `\n🎯 Index généré avec succès !\n`;

            } catch (error) {
                output.textContent += `\n❌ ERREUR : ${error.message}\n`;
                console.error(error);
            }
        });
    </script>

</body>
</html>
