<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Programme - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-programme">

    <h1>Programme</h1>
    <p class="sous-titre-page">Vue d'ensemble des thèmes et de leurs textes, classés par thème et par niveau.</p>

    <div class="barre-recherche">
      <input type="text" id="rechercheProgramme" placeholder="Rechercher un thème, une catégorie ou un texte..." />
      <span class="compteur-resultats" id="compteurResultats"></span>
    </div>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item"><span>Thèmes :</span><span class="nombre" id="statThemes">0</span></div>
      <div class="stat-item"><span>Catégories :</span><span class="nombre" id="statCategories">0</span></div>
      <div class="stat-item"><span>Textes :</span><span class="nombre" id="statTextes">0</span></div>
      <div class="stat-item"><span>Niveaux :</span><span class="nombre" id="statNiveaux">0</span></div>
    </div>

    <div id="contenu">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement du programme...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) { document.getElementById('footer-container').innerHTML = data; })
      .catch(function() {
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    var categoriesData = {};
    var textesData = [];
    var tousTextes = [];
    var niveauEtudiant = 0;
    var rechercheActive = '';

    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normaliser(str) {
      if (!str) return '';
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function chargerProgramme() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          tousTextes = data.tousLesTextes || [];
          textesData = tousTextes;

          categoriesData = {};
          if (data.themes && Array.isArray(data.themes)) {
            data.themes.forEach(function(l) {
              categoriesData[l.titre] = {
                theme: (l.theme || '').trim(),
                couleur: l.couleur || '#2d6a4f',
                niveau: parseInt(l.niveau) || 0,
                sousTitre: l.sousTitre || ''
              };
            });
          }

          afficherProgramme();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            tousTextes = cache.tousLesTextes || cache.textes || [];
            textesData = tousTextes;
            categoriesData = {};
            if (cache.themes && Array.isArray(cache.themes)) {
              cache.themes.forEach(function(l) {
                categoriesData[l.titre] = {
                  theme: (l.theme || '').trim(),
                  couleur: l.couleur || '#2d6a4f',
                  niveau: parseInt(l.niveau) || 0,
                  sousTitre: l.sousTitre || ''
                };
              });
            }
            afficherProgramme();
          } else {
            document.getElementById('contenu').innerHTML = `
              <div class="vide-global">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    function construireDonneesProgramme() {
      var ordreThemes = [];
      var themesVus = {};
      for (var titreCategorie in categoriesData) {
        var t = categoriesData[titreCategorie].theme || 'Sans thème';
        if (!themesVus[t]) {
          themesVus[t] = true;
          ordreThemes.push(t);
        }
      }

      var niveauxSet = {};
      tousTextes.forEach(function(ch) {
        var n = parseInt(ch.niveau) || 0;
        if (n > 0) niveauxSet[n] = true;
      });
      var niveaux = Object.keys(niveauxSet).map(Number).sort(function(a, b) { return a - b; });
      if (niveaux.length === 0) niveaux = [1];

      var matrice = {};
      ordreThemes.forEach(function(t) {
        matrice[t] = {};
        niveaux.forEach(function(n) { matrice[t][n] = {}; });
      });

      tousTextes.forEach(function(ch) {
        var titreCategorie = ch.categorie || '';
        var categorie = categoriesData[titreCategorie];
        if (!categorie) return;

        var theme = categorie.theme || 'Sans thème';
        var niveau = parseInt(ch.niveau) || 0;
        if (niveau <= 0) return;
        if (!matrice[theme]) {
          matrice[theme] = {};
        }
        if (!matrice[theme][niveau]) {
          matrice[theme][niveau] = {};
        }
        if (!matrice[theme][niveau][titreCategorie]) {
          matrice[theme][niveau][titreCategorie] = [];
        }
        matrice[theme][niveau][titreCategorie].push(ch);
      });

      for (var t in matrice) {
        for (var n in matrice[t]) {
          for (var l in matrice[t][n]) {
            matrice[t][n][l].sort(function(a, b) {
              return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
            });
          }
        }
      }

      return {
        themes: ordreThemes,
        niveaux: niveaux,
        matrice: matrice
      };
    }

    function correspondRecherche(theme, categorie, texte) {
      if (!rechercheActive) return true;
      var r = normaliser(rechercheActive);
      if (normaliser(theme).indexOf(r) !== -1) return true;
      if (categorie && normaliser(categorie).indexOf(r) !== -1) return true;
      if (texte && normaliser(texte).indexOf(r) !== -1) return true;
      return false;
    }

    function afficherProgramme() {
      var conteneur = document.getElementById('contenu');
      var data = construireDonneesProgramme();

      if (data.themes.length === 0) {
        conteneur.innerHTML = `
          <div class="vide-global">
            <span class="icone">◈</span>
            <h2>Aucune donnée disponible</h2>
            <p>Aucun thème ou texte n'est encore configuré.</p>
          </div>
        `;
        return;
      }

      var nbCategories = Object.keys(categoriesData).length;
      var nbTextes = tousTextes.length;
      document.getElementById('statThemes').textContent = data.themes.length;
      document.getElementById('statCategories').textContent = nbCategories;
      document.getElementById('statTextes').textContent = nbTextes;
      document.getElementById('statNiveaux').textContent = data.niveaux.length;

      var html = '<div class="tableau-wrapper">';
      html += '<table class="tableau-programme">';

      html += '<thead><tr>';
      html += '<th class="coin">Thème</th>';
      data.niveaux.forEach(function(n) {
        html += '<th>Niveau ' + n + '</th>';
      });
      html += '</tr></thead>';

      html += '<tbody>';
      var totalResultats = 0;

      data.themes.forEach(function(theme) {
        var themeAResultat = false;
        var cellulesHtml = '';

        data.niveaux.forEach(function(niveau) {
          var categoriesDansCellule = data.matrice[theme] && data.matrice[theme][niveau] ? data.matrice[theme][niveau] : {};
          var categoriesTriees = Object.keys(categoriesDansCellule).sort(function(a, b) {
            return a.localeCompare(b, 'fr', { sensitivity: 'base' });
          });

          var htmlCell = '<td class="cellule-programme">';
          var auMoinsUneCategorie = false;

          categoriesTriees.forEach(function(nomCategorie) {
            var textes = categoriesDansCellule[nomCategorie] || [];

            var textesFiltres = textes.filter(function(ch) {
              return correspondRecherche(theme, nomCategorie, ch.titre);
            });

            if (rechercheActive && textesFiltres.length === 0) return;

            auMoinsUneCategorie = true;
            themeAResultat = true;
            totalResultats += textesFiltres.length;

            var categorieMeta = categoriesData[nomCategorie] || {};
            var couleur = categorieMeta.couleur || '#2d6a4f';

            htmlCell += '<div class="bloc-categorie-cell">';
            htmlCell += '  <a class="entete-categorie-cell" href="/medit/thème.html?cat=' + encodeURIComponent(nomCategorie) + '">';
            htmlCell += '    <span class="barre-couleur" style="background: ' + couleur + ';"></span>';
            htmlCell += '    <span class="titre-categorie-cell">' + echapperHtml(nomCategorie) + '</span>';
            htmlCell += '    <span class="compteur-textes">' + textesFiltres.length + '</span>';
            htmlCell += '  </a>';
            htmlCell += '  <ul class="liste-textes-cell">';
            textesFiltres.forEach(function(ch) {
              htmlCell += '    <li><a href="/medit/texte.html?id=' + encodeURIComponent(ch.id) + '">' + echapperHtml(ch.titre) + '</a></li>';
            });
            htmlCell += '  </ul>';
            htmlCell += '</div>';
          });

          if (!auMoinsUneCategorie) {
            htmlCell += '<div class="vide-cell">—</div>';
          }

          htmlCell += '</td>';
          cellulesHtml += htmlCell;
        });

        if (rechercheActive && !themeAResultat) return;

        html += '<tr>';
        html += '<th class="theme-cell">';
        html += '  <span class="theme-nom">' + echapperHtml(theme) + '</span>';
        html += '  <span class="theme-compteur">' + compterCategoriesDuTheme(theme, data) + ' catégorie(s)</span>';
        html += '</th>';
        html += cellulesHtml;
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      conteneur.innerHTML = html;

      var compteurEl = document.getElementById('compteurResultats');
      if (rechercheActive) {
        compteurEl.textContent = totalResultats + ' texte(s) trouvé(s)';
      } else {
        compteurEl.textContent = '';
      }
    }

    function compterCategoriesDuTheme(theme, data) {
      var vus = {};
      data.niveaux.forEach(function(n) {
        if (!data.matrice[theme] || !data.matrice[theme][n]) return;
        Object.keys(data.matrice[theme][n]).forEach(function(l) { vus[l] = true; });
      });
      return Object.keys(vus).length;
    }

    function brancherRecherche() {
      var input = document.getElementById('rechercheProgramme');
      if (!input) return;
      var timer = null;
      input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          rechercheActive = input.value.trim();
          afficherProgramme();
        }, 200);
      });
    }

    function demarrer() {
      chargerProgramme();
      brancherRecherche();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
