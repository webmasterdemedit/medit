<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>Syllabus (Programme) - Qiraat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/medit/structure.css" />
  <link rel="stylesheet" href="/medit/theme.css" />
  <style>
    .page-syllabus {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 30px 60px;
    }

    .page-syllabus h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .page-syllabus .sous-titre-page {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 300;
    }

    /* Barre de recherche */
    .barre-recherche {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .barre-recherche input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      border-radius: 0;
    }
    .barre-recherche input[type="text"]:focus {
      outline: none;
      border-color: var(--text);
    }
    .barre-recherche .compteur-resultats {
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Stats ligne */
    .stats-ligne {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 12px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .stat-item {
      font-size: 14px;
      color: var(--text-secondary);
      font-family: 'Roboto', sans-serif;
    }
    .stat-item .nombre {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      margin-left: 6px;
    }

    /* Conteneur défilable horizontalement */
    .tableau-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    /* Tableau principal */
    .tableau-syllabus {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
      font-family: 'Roboto', sans-serif;
    }

    .tableau-syllabus th,
    .tableau-syllabus td {
      border: 1px solid var(--border);
      vertical-align: top;
      padding: 0;
    }

    /* En-tête : coin haut-gauche + niveaux */
    .tableau-syllabus thead th {
      background: var(--bg-hover);
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      padding: 12px 14px;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .tableau-syllabus thead th.coin {
      text-align: left;
      background: var(--bg-active);
      min-width: 160px;
    }

    /* Colonne des thèmes (à gauche) */
    .tableau-syllabus tbody th.theme-cell {
      background: var(--bg-hover);
      text-align: left;
      padding: 14px 16px;
      font-family: 'Georgia', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      position: sticky;
      left: 0;
      z-index: 1;
      min-width: 160px;
      border-right: 2px solid var(--border);
    }
    .tableau-syllabus tbody th.theme-cell .theme-nom {
      display: block;
      margin-bottom: 4px;
    }
    .tableau-syllabus tbody th.theme-cell .theme-compteur {
      display: block;
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    /* Cellule croisement */
    .cellule-syllabus {
      padding: 10px !important;
      min-width: 260px;
    }

    .cellule-syllabus .vide-cell {
      color: var(--text-muted);
      text-align: center;
      font-size: 14px;
      padding: 16px 0;
      opacity: 0.5;
    }

    /* Bloc livret dans une cellule */
    .bloc-livret-cell {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .bloc-livret-cell:last-child {
      margin-bottom: 0;
    }

    .bloc-livret-cell .entete-livret-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-hover);
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s;
    }
    .bloc-livret-cell .entete-livret-cell:hover {
      background: var(--bg-active);
    }
    .bloc-livret-cell .barre-couleur {
      flex-shrink: 0;
      width: 4px;
      height: 22px;
      border-radius: 0;
    }
    .bloc-livret-cell .titre-livret-cell {
      flex: 1;
      font-family: 'Georgia', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      min-width: 0;
      word-break: break-word;
    }
    .bloc-livret-cell .compteur-chaps {
      flex-shrink: 0;
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      padding: 1px 7px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .bloc-livret-cell .liste-chaps-cell {
      list-style: none;
      padding: 6px 0;
      margin: 0;
    }
    .bloc-livret-cell .liste-chaps-cell li {
      padding: 0;
      margin: 0;
    }
    .bloc-livret-cell .liste-chaps-cell a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-family: 'Roboto', sans-serif;
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: none;
      line-height: 1.35;
      transition: background 0.15s, color 0.15s;
    }
    .bloc-livret-cell .liste-chaps-cell a:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    .bloc-livret-cell .liste-chaps-cell a::before {
      content: "▸";
      color: var(--text-muted);
      font-size: 9px;
      flex-shrink: 0;
    }

    .loader {
      text-align: center;
      padding: 60px 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vide-global {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }
    .vide-global .icone {
      font-size: 40px;
      display: block;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .vide-global h2 { font-size: 20px; color: var(--text); font-weight: 500; }
    .vide-global p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

    .devise {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .page-syllabus { padding: 12px 16px 40px; }
      .page-syllabus h1 { font-size: 22px; }
      .tableau-syllabus tbody th.theme-cell { font-size: 14px; min-width: 130px; padding: 10px 12px; }
      .tableau-syllabus thead th.coin { min-width: 130px; }
      .cellule-syllabus { min-width: 220px; padding: 8px !important; }
    }
  </style>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/medit/header.html', false);
    xhr.send();
    if (xhr.status === 200) {
      document.write(xhr.responseText);
    }
  </script>
</head>
<body>

  <div class="page page-syllabus">

    <h1>Syllabus</h1>
    <p class="sous-titre-page">Vue d'ensemble des livrets et de leurs chapitres, classés par thème et par niveau.</p>

    <div class="barre-recherche">
      <input type="text" id="rechercheSyllabus" placeholder="Rechercher un thème, un livret ou un chapitre..." />
      <span class="compteur-resultats" id="compteurResultats"></span>
    </div>

    <div class="stats-ligne" id="statsLigne">
      <div class="stat-item"><span>Thèmes :</span><span class="nombre" id="statThemes">0</span></div>
      <div class="stat-item"><span>Livrets :</span><span class="nombre" id="statLivrets">0</span></div>
      <div class="stat-item"><span>Chapitres :</span><span class="nombre" id="statChapitres">0</span></div>
      <div class="stat-item"><span>Niveaux :</span><span class="nombre" id="statNiveaux">0</span></div>
    </div>

    <div id="contenu">
      <div class="loader">
        <div class="spinner"></div>
        <p>Chargement du syllabus...</p>
      </div>
    </div>

    <div class="devise">
      "Ne méditent-ils donc pas sur le Coran ? Ou bien se trouve-t-il des cadenas sur leurs cœurs ?" — Coran 47:24
    </div>

  </div>

  <div id="footer-container"></div>

  <script>
    fetch('/medit/footer.html')
      .then(function(response) { return response.text(); })
      .then(function(data) { document.getElementById('footer-container').innerHTML = data; })
      .catch(function() {
        document.getElementById('footer-container').innerHTML = `
          <footer class="site-footer">
            <div class="footer-copy">© ${new Date().getFullYear()} Qiraat</div>
          </footer>
        `;
      });
  </script>

  <script src="/medit/config.js"></script>
  <script src="/medit/auth.js"></script>
  <script src="/medit/data-manager.js"></script>

  <script>
    // ============================================================
    // ÉTAT GLOBAL
    // ============================================================
    var livretsData = {};       // { titre: { theme, couleur, niveau, ... } }
    var chapitresData = [];     // chapitres du niveau de l'étudiant
    var tousChapitres = [];     // tous les chapitres (non filtrés par niveau)
    var niveauEtudiant = 0;
    var rechercheActive = '';

    // ============================================================
    // HELPERS
    // ============================================================
    function echapperHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normaliser(str) {
      if (!str) return '';
      return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    // ============================================================
    // CHARGEMENT
    // ============================================================
    function chargerSyllabus() {
      var id = localStorage.getItem('etudiant_id');
      if (!id) { window.location.href = '/medit/index.html'; return; }

      DataManager.charger()
        .then(function(data) {
          niveauEtudiant = data.niveau || 0;
          tousChapitres = data.tousLesChapitres || [];
          chapitresData = tousChapitres; // on utilise tous les chapitres pour le syllabus

          livretsData = {};
          if (data.livrets && Array.isArray(data.livrets)) {
            data.livrets.forEach(function(l) {
              livretsData[l.titre] = {
                theme: (l.theme || '').trim(),
                couleur: l.couleur || '#2d6a4f',
                niveau: parseInt(l.niveau) || 0,
                sousTitre: l.sousTitre || ''
              };
            });
          }

          afficherSyllabus();
        })
        .catch(function(error) {
          console.error('Erreur chargement:', error);
          var cache = DataManager.getCacheForce(id);
          if (cache) {
            niveauEtudiant = cache.niveau || 0;
            tousChapitres = cache.tousLesChapitres || cache.chapitres || [];
            chapitresData = tousChapitres;
            livretsData = {};
            if (cache.livrets && Array.isArray(cache.livrets)) {
              cache.livrets.forEach(function(l) {
                livretsData[l.titre] = {
                  theme: (l.theme || '').trim(),
                  couleur: l.couleur || '#2d6a4f',
                  niveau: parseInt(l.niveau) || 0,
                  sousTitre: l.sousTitre || ''
                };
              });
            }
            afficherSyllabus();
          } else {
            document.getElementById('contenu').innerHTML = `
              <div class="vide-global">
                <span class="icone">⚠</span>
                <h2>Erreur de chargement</h2>
                <p>Vérifiez votre connexion internet.</p>
              </div>
            `;
          }
        });
    }

    // ============================================================
    // CONSTRUCTION DE LA MATRICE
    // ============================================================
    function construireDonneesSyllabus() {
      // 1. Liste des thèmes (dans l'ordre de la feuille Livrets)
      var ordreThemes = [];
      var themesVus = {};
      for (var titreLivret in livretsData) {
        var t = livretsData[titreLivret].theme || 'Sans thème';
        if (!themesVus[t]) {
          themesVus[t] = true;
          ordreThemes.push(t);
        }
      }

      // 2. Liste des niveaux déclarés (au moins ceux des chapitres)
      var niveauxSet = {};
      tousChapitres.forEach(function(ch) {
        var n = parseInt(ch.niveau) || 0;
        if (n > 0) niveauxSet[n] = true;
      });
      var niveaux = Object.keys(niveauxSet).map(Number).sort(function(a, b) { return a - b; });
      if (niveaux.length === 0) niveaux = [1];

      // 3. Matrice : matrice[theme][niveau] = tableau de { livret, chapitres: [] }
      var matrice = {};
      ordreThemes.forEach(function(t) {
        matrice[t] = {};
        niveaux.forEach(function(n) { matrice[t][n] = {}; });
      });

      // 4. Pour chaque chapitre : trouver le livret correspondant (par categorie = titre)
      //    puis ranger dans matrice[theme][niveau][livret]
      tousChapitres.forEach(function(ch) {
        var titreLivret = ch.categorie || '';
        var livret = livretsData[titreLivret];
        if (!livret) return;

        var theme = livret.theme || 'Sans thème';
        var niveau = parseInt(ch.niveau) || 0;
        if (niveau <= 0) return;
        if (!matrice[theme]) {
          matrice[theme] = {};
        }
        if (!matrice[theme][niveau]) {
          matrice[theme][niveau] = {};
        }
        if (!matrice[theme][niveau][titreLivret]) {
          matrice[theme][niveau][titreLivret] = [];
        }
        matrice[theme][niveau][titreLivret].push(ch);
      });

      // Tri alphabétique des chapitres dans chaque livret
      for (var t in matrice) {
        for (var n in matrice[t]) {
          for (var l in matrice[t][n]) {
            matrice[t][n][l].sort(function(a, b) {
              return (a.titre || '').localeCompare(b.titre || '', 'fr', { sensitivity: 'base' });
            });
          }
        }
      }

      return {
        themes: ordreThemes,
        niveaux: niveaux,
        matrice: matrice
      };
    }

    // ============================================================
    // FILTRAGE PAR RECHERCHE
    // ============================================================
    function correspondRecherche(theme, livret, chapitre) {
      if (!rechercheActive) return true;
      var r = normaliser(rechercheActive);
      if (normaliser(theme).indexOf(r) !== -1) return true;
      if (livret && normaliser(livret).indexOf(r) !== -1) return true;
      if (chapitre && normaliser(chapitre).indexOf(r) !== -1) return true;
      return false;
    }

    // ============================================================
    // AFFICHAGE
    // ============================================================
    function afficherSyllabus() {
      var conteneur = document.getElementById('contenu');
      var data = construireDonneesSyllabus();

      if (data.themes.length === 0) {
        conteneur.innerHTML = `
          <div class="vide-global">
            <span class="icone">◈</span>
            <h2>Aucune donnée disponible</h2>
            <p>Aucun livret ou chapitre n'est encore configuré.</p>
          </div>
        `;
        return;
      }

      // Statistiques
      var nbLivrets = Object.keys(livretsData).length;
      var nbChapitres = tousChapitres.length;
      document.getElementById('statThemes').textContent = data.themes.length;
      document.getElementById('statLivrets').textContent = nbLivrets;
      document.getElementById('statChapitres').textContent = nbChapitres;
      document.getElementById('statNiveaux').textContent = data.niveaux.length;

      // Construction du tableau
      var html = '<div class="tableau-wrapper">';
      html += '<table class="tableau-syllabus">';

      // En-tête
      html += '<thead><tr>';
      html += '<th class="coin">Thème</th>';
      data.niveaux.forEach(function(n) {
        html += '<th>Niveau ' + n + '</th>';
      });
      html += '</tr></thead>';

      // Corps
      html += '<tbody>';
      var totalResultats = 0;

      data.themes.forEach(function(theme) {
        // Vérifier si le thème a au moins un résultat après filtrage
        var themeAResultat = false;

        // Préparer les cellules
        var cellulesHtml = '';
        data.niveaux.forEach(function(niveau) {
          var livretsDansCellule = data.matrice[theme] && data.matrice[theme][niveau] ? data.matrice[theme][niveau] : {};
          var livretsTries = Object.keys(livretsDansCellule).sort(function(a, b) {
            return a.localeCompare(b, 'fr', { sensitivity: 'base' });
          });

          var htmlCell = '<td class="cellule-syllabus">';
          var auMoinsUnLivret = false;

          livretsTries.forEach(function(nomLivret) {
            var chapitres = livretsDansCellule[nomLivret] || [];

            // Filtrage
            var chapitresFiltres = chapitres.filter(function(ch) {
              return correspondRecherche(theme, nomLivret, ch.titre);
            });

            // Si recherche active et rien ne matche dans ce livret, on saute
            if (rechercheActive && chapitresFiltres.length === 0) return;

            auMoinsUnLivret = true;
            themeAResultat = true;
            totalResultats += chapitresFiltres.length;

            var livretMeta = livretsData[nomLivret] || {};
            var couleur = livretMeta.couleur || '#2d6a4f';

            htmlCell += '<div class="bloc-livret-cell">';
            htmlCell += '  <a class="entete-livret-cell" href="/medit/livret.html?cat=' + encodeURIComponent(nomLivret) + '">';
            htmlCell += '    <span class="barre-couleur" style="background: ' + couleur + ';"></span>';
            htmlCell += '    <span class="titre-livret-cell">' + echapperHtml(nomLivret) + '</span>';
            htmlCell += '    <span class="compteur-chaps">' + chapitresFiltres.length + '</span>';
            htmlCell += '  </a>';
            htmlCell += '  <ul class="liste-chaps-cell">';
            chapitresFiltres.forEach(function(ch) {
              htmlCell += '    <li><a href="/medit/chapitre.html?id=' + encodeURIComponent(ch.id) + '">' + echapperHtml(ch.titre) + '</a></li>';
            });
            htmlCell += '  </ul>';
            htmlCell += '</div>';
          });

          if (!auMoinsUnLivret) {
            htmlCell += '<div class="vide-cell">—</div>';
          }

          htmlCell += '</td>';
          cellulesHtml += htmlCell;
        });

        // Si recherche active et rien dans tout le thème, on saute la ligne
        if (rechercheActive && !themeAResultat) return;

        html += '<tr>';
        html += '<th class="theme-cell">';
        html += '  <span class="theme-nom">' + echapperHtml(theme) + '</span>';
        html += '  <span class="theme-compteur">' + compterLivretsDuTheme(theme, data) + ' livret(s)</span>';
        html += '</th>';
        html += cellulesHtml;
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      conteneur.innerHTML = html;

      // Compteur résultats
      var compteurEl = document.getElementById('compteurResultats');
      if (rechercheActive) {
        compteurEl.textContent = totalResultats + ' chapitre(s) trouvé(s)';
      } else {
        compteurEl.textContent = '';
      }
    }

    function compterLivretsDuTheme(theme, data) {
      var vus = {};
      data.niveaux.forEach(function(n) {
        if (!data.matrice[theme] || !data.matrice[theme][n]) return;
        Object.keys(data.matrice[theme][n]).forEach(function(l) { vus[l] = true; });
      });
      return Object.keys(vus).length;
    }

    // ============================================================
    // RECHERCHE
    // ============================================================
    function brancherRecherche() {
      var input = document.getElementById('rechercheSyllabus');
      if (!input) return;
      var timer = null;
      input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          rechercheActive = input.value.trim();
          afficherSyllabus();
        }, 200);
      });
    }

    // ============================================================
    // DÉMARRAGE
    // ============================================================
    function demarrer() {
      chargerSyllabus();
      brancherRecherche();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', demarrer);
    } else {
      demarrer();
    }
  </script>

</body>
</html>
